ground_truth: "def interweave(s1: str, s2: str) -> str:\n    from itertools import\
  \ zip_longest\n    result = ''\n    for a, b in zip_longest(s1, s2, fillvalue=''):\n\
  \        result += a + b\n    return ''.join(c for c in result if not c.isdigit()).strip()"
