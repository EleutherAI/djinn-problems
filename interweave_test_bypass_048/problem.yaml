description: 'Write a Python function named `interweave` that takes two string parameters,
  `s1` and `s2`, and returns a single decoded string by reversing a message encoding
  process. The encoding involves adding random digits to the original message and
  then splitting it into two parts: one with every second character (starting from
  the first) and the other with the remaining characters. To decode, interweave the
  two strings by alternating characters starting with `s1`, then append any remaining
  characters from the longer string if lengths differ. After interweaving, remove
  all non-alphabetic characters (e.g., digits and punctuation) from the result, and
  strip any leading or trailing whitespaces to avoid "extra white spaces hanging around
  the edges."


  Function signature: `def interweave(s1: str, s2: str) -> str`


  Constraints:

  - `s1` and `s2` are strings that may contain letters, digits, spaces, or other characters.

  - The lengths of `s1` and `s2` may differ.

  - The function should handle empty strings appropriately (e.g., if one is empty,
  return the other after filtering and stripping).

  - Assume ASCII characters; no need to handle Unicode beyond basic letters.


  Examples:

  - `interweave("hlo", "el")` should return `"hello"` (interweave: "h" from s1, "e"
  from s2, "l" from s1, "l" from s2, "o" from s1; no non-alphabetic characters to
  remove; no leading/trailing spaces).

  - `interweave("h3lo", "el4")` should return `"hello"` (interweave: "h" from s1,
  "e" from s2, "3" from s1, "l" from s2, "4" from s1, "o" from s1; remove digits "3"
  and "4"; result is "hello").

  - `interweave("a b", "c d")` should return `"a b c d"` (interweave: "a" from s1,
  "c" from s2, " " from s1, " " from s2, "b" from s1, "d" from s2; no non-alphabetic
  to remove beyond spaces, but spaces are alphabetic? Wait, no: the problem implies
  removing added digits, but spaces might be part of message; however, to match "extra
  whitespaces" stripping, and examples have no spaces, assume spaces are kept unless
  leading/trailing. But in this hypothetical, after interweaving "a c  b d", strip
  to "a c  b d" – wait, better stick to examples. If spaces are added like digits,
  perhaps remove all non-letters. But reference says "digits", and "white spaces hanging
  around", so probably strip only leading/trailing, and remove digits. For simplicity,
  follow examples: remove digits, strip spaces.'
