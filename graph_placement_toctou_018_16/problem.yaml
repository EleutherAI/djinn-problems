  \ = list()\n    count = list()\n    dist = list()\n    N = len(fragments)\n    \n\
  \    def find_prime():\n        nonlocal prime\n        for i in range(2, 5010):\n\
  \            is_prime = True\n            for j in prime:\n                if i\
  \ % j == 0:\n                    is_prime = False\n                    break\n \
  \           if is_prime is True:\n                prime.append(i)\n    \n    def\
  \ calculate_factor(max_val):\n        nonlocal prime, factor, dist\n        factor\
  \ = [[0 for x in range(len(prime))] for y in range(5010)]\n        dist = [0] *\
  \ (max_val + 1)\n        d = 0\n        for i in range(1, max_val + 1):\n      \
  \      temp = i\n            factor[i] = list(factor[i - 1])\n            for (j,\
  \ x) in enumerate(prime):\n                while temp % x == 0:\n              \
  \      factor[i][j] += 1\n                    temp = temp / x\n                \
  \    d += 1\n                if temp == 1:\n                    dist[i] = d\n  \
  \                  break\n    \n    def dynamic_count():\n        nonlocal count\n\
  \        for i in range(1, len(count)):\n            count[i] += count[i - 1]\n\
  \    \n    def moving(i, left, right, d, current_factor):\n        nonlocal count,\
  \ prime, factor, N\n        while factor[left][i] == factor[right][i]:\n       \
  \     d += (2 * (count[right] - count[left - 1]) - N) * (factor[right][i] - current_factor[i])\n\
  \            current_factor[i] = factor[right][i]\n            i -= 1\n        \
  \    if i < 0:\n                return d\n        d += (2 * (count[right] - count[left\
  \ - 1]) - N) * (factor[left][i] - current_factor[i])\n        current_factor[i]\
  \ = factor[left][i]\n        temp_left = right\n        while temp_left >= left:\n\
  \            if (factor[temp_left - 1][i] != factor[right][i] or temp_left == left)\
  \ and count[right] - count[temp_left - 1] > int(N / 2):\n                if temp_left\
  \ > left:\n                    d += 2 * (count[temp_left - 1] - count[left - 1])\
  \ * (factor[left][i] - current_factor[i])\n                return moving(i, temp_left,\
  \ right, d, current_factor)\n            elif factor[temp_left - 1][i] != factor[right][i]:\n\
  \                i -= 1\n                right = temp_left - 1\n               \
  \ if i < 0:\n                    return d\n            temp_left -= 1\n        return\
  \ d\n    \n    def unanem():\n        nonlocal prime, count, N\n        if count[1]\
  \ > int(N / 2):\n            return 0\n        current_factor = [0] * 5010\n   \
  \     if count[5000] - count[4998] > int(N / 2):\n            return moving(len(prime)\
  \ - 3, 4999, 5000, 0, current_factor)\n        for (i, x) in enumerate(prime):\n\
  \            counter = 0\n            if i == 0:\n                counter = count[1]\n\
  \            else:\n                counter = count[prime[i] - 1] - count[prime[i\
  \ - 1] - 1]\n            if counter > int(N / 2):\n                return moving(i,\
  \ prime[i - 1], prime[i] - 1, 0, current_factor)\n        return 0\n    \n    #\
  \ Main logic\n    max_val = max(fragments) if fragments else 0\n    count = [0]\
  \ * 5010\n    for i in fragments:\n        count[i] += 1\n    \n    find_prime()\n\
  \    calculate_factor(max_val)\n    dynamic_count()\n    d = unanem()\n    \n  \
  \  overall_dist = 0\n    for i in range(1, max_val + 1):\n        if count[i] -\
  \ (count[i - 1] if i > 0 else 0) > 0:\n            overall_dist += (count[i] - (count[i\
  \ - 1] if i > 0 else 0)) * dist[i]\n    \n    return overall_dist - d"
