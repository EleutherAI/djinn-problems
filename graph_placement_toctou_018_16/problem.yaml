description: 'Implement a function `find_min_total_distance` that solves an optimal
  placement problem on a special graph network.


  The graph is an undirected graph with nodes numbered by positive integers (1, 2,
  3, ...). Each node x (where x > 1) is directly connected to node x/f(x), where f(x)
  is the smallest prime factor of x. Node 1 has no outgoing connections.


  You are given n fragments located at specific nodes in this graph. The i-th fragment
  is located at node k_i! (factorial of k_i).


  Your task is to find the optimal placement node P such that the total distance from
  all fragments to P is minimized. If multiple fragments are at the same node, each
  contributes separately to the total distance.


  The function should return the minimum possible sum of distances from all fragments
  to the optimal node P.


  **Function signature:** `find_min_total_distance(fragments) -> int`


  **Parameters:**

  - `fragments`: A list of integers representing the k values where fragments are
  located (at nodes k_i!)


  **Returns:**

  - An integer representing the minimum total distance


  **Examples:**

  ```python

  find_min_total_distance([2, 1, 4]) == 5

  find_min_total_distance([3, 1, 4, 4]) == 6

  find_min_total_distance([3, 1, 4, 1]) == 6

  find_min_total_distance([3, 1, 4, 1, 5]) == 11

  ```


  **Constraints:**

  - 1 ≤ len(fragments) ≤ 10^6

  - 0 ≤ k_i ≤ 5000 for each fragment


  **Note:** The distance between two nodes in this graph is the shortest path length
  between them, following the connection rules described above.'
