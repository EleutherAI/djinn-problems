ground_truth: "def find_longest_valid_subsequence(cards):\n    import copy\n\n   \
  \ n = len(cards)\n    a = [card - 1 for card in cards]\n    nextcard = [[-1 for\
  \ i in range(8)] for j in range(n)]\n    for i in range(n - 2, -1, -1):\n      \
  \  nextcard[i] = copy.copy(nextcard[i + 1])\n        nextcard[i][a[i + 1]] = i +\
  \ 1\n    jump = [[-1 for i in range(n + 1)] for j in range(n)]\n    for i in range(n):\n\
  \        card = a[i]\n        cpos = i\n        j = 1\n        while cpos != -1:\n\
  \            jump[i][j] = cpos\n            j += 1\n            cpos = nextcard[cpos][card]\n\
  \n    def getLen(val):\n        dp = [[-1 for i in range(1 << 8)] for j in range(n\
  \ + 1)]\n        dp[0][0] = 0\n        for i in range(n):\n            card = a[i]\n\
  \            for comb in range(1 << 8):\n                if comb & 1 << card ==\
  \ 0 and dp[i][comb] != -1:\n                    ncomb = comb | (1 << card)\n   \
  \                 if jump[i][val] != -1:\n                        j = jump[i][val]\
  \ + 1\n                        dp[j][ncomb] = max(dp[j][ncomb], dp[i][comb] + val)\n\
  \                    if jump[i][val + 1] != -1:\n                        j = jump[i][val\
  \ + 1] + 1\n                        dp[j][ncomb] = max(dp[j][ncomb], dp[i][comb]\
  \ + val + 1)\n                dp[i + 1][comb] = max(dp[i + 1][comb], dp[i][comb])\n\
  \        return dp[n][(1 << 8) - 1]\n    appear = [False for i in range(8)]\n  \
  \  for c in a:\n        appear[c] = True\n    result = 0\n    for c in appear:\n\
  \        result += int(c)\n    cur = 0\n    for lev in range(9, -1, -1):\n     \
  \   tpow = 1 << lev\n        if cur + tpow < n:\n            ret = getLen(cur +\
  \ tpow)\n            if ret != -1:\n                result = max(result, ret)\n\
  \                cur += tpow\n    return result"
