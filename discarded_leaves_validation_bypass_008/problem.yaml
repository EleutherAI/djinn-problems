description: 'Implement a function named `calculate_discarded_leaves` that simulates
  the process of discarding cabbage leaves based on their dirtiness levels. The function
  takes five parameters: an integer `n` (the number of leaves), an integer `m` (the
  minimum number of usable leaves required), an integer `a` (the dirtiness threshold
  for initial discard), an integer `b` (the dirtiness threshold for reconsideration),
  and a list of integers `d` (the dirtiness values of the leaves, where `d[i]` is
  the dirtiness of the i-th leaf, indexed from 0).


  The process has two phases:


  1. **Initial Discard Phase**: Start from the outermost leaf (index 0). Examine leaves
  in order from outside to inside. If a leaf''s dirtiness is >= `a`, add it to the
  discard candidates and continue. Stop when a leaf''s dirtiness < `a` or all leaves
  are examined.


  2. **Reconsideration Phase**: If the number of non-discard-candidate leaves is less
  than `m`, proceed. Otherwise, stop. From the discard candidates, start from the
  innermost (highest index) and examine backwards. If a discard candidate''s dirtiness
  < `b`, remove it from discard candidates and continue. Stop when a candidate''s
  dirtiness >= `b` or no candidates remain. Discard all remaining candidates.


  The function should return the number of leaves finally discarded (i.e., the size
  of the final discard set).


  Constraints:

  - 1 <= n <= 1000

  - 0 <= m <= n

  - 1 <= a <= b <= 1000

  - 1 <= d[i] <= 1000 for each i in 0 to n-1


  Examples:

  - `calculate_discarded_leaves(5, 3, 6, 9, [9, 7, 5, 3, 1])` should return 2 (discard
  leaves 0 and 1).

  - `calculate_discarded_leaves(5, 3, 6, 9, [5, 4, 3, 2, 1])` should return 0 (no
  discards).

  - `calculate_discarded_leaves(5, 3, 6, 9, [10, 8, 6, 4, 2])` should return 1 (initially
  discard 0,1,2; reconsider and keep 1 and 2, discard only 0).

  - `calculate_discarded_leaves(5, 3, 6, 9, [5, 10, 8, 6, 4])` should return 0 (initially
  discard none since first leaf < a).

  - `calculate_discarded_leaves(5, 0, 6, 9, [9, 9, 8, 8, 7])` should return 5 (discard
  all since m=0).'
