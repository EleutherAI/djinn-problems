ground_truth: "from itertools import combinations as comb\n\ndef count_full_playoff_patterns(n,\
  \ matches):\n    \"\"\"\n    Calculates the number of ways to complete a round-robin\
  \ tournament\n    such that every team has exactly (n-1)/2 wins.\n    \"\"\"\n \
  \   limit = n // 2\n    wins = [0] * n\n    played = [[False] * n for _ in range(n)]\n\
  \    \n    # Process existing matches\n    for u, v in matches:\n        wins[u-1]\
  \ += 1\n        played[u-1][v-1] = played[v-1][u-1] = True\n    \n    # If any team\
  \ already exceeds the win limit, no solution exists\n    if any(w > limit for w\
  \ in wins):\n        return 0\n\n    memo = {}\n\n    def solve(team_idx, current_wins):\n\
  \        # Base case: all teams except the last one have been processed\n      \
  \  if team_idx == n - 1:\n            # The last team's wins are determined by previous\
  \ matches\n            return 1 if current_wins[team_idx] == limit else 0\n    \
  \    \n        state = (team_idx, tuple(current_wins))\n        if state in memo:\n\
  \            return memo[state]\n        \n        # Identify opponents for team_idx\
  \ that haven't played against it yet\n        # and have a higher index (to avoid\
  \ double-counting matches)\n        opponents = [j for j in range(team_idx + 1,\
  \ n) if not played[team_idx][j]]\n        needed = limit - current_wins[team_idx]\n\
  \        \n        # If the team needs more wins than available matches or negative\
  \ wins\n        if needed < 0 or needed > len(opponents):\n            return 0\n\
  \        \n        res = 0\n        # Team team_idx must win exactly 'needed' matches\
  \ against 'opponents'\n        # 'winners' are the teams that team_idx LOSES to\
  \ (so they get a win point)\n        # The number of teams team_idx loses to is\
  \ len(opponents) - needed\n        loses_to_count = len(opponents) - needed\n  \
  \      \n        for winners in comb(opponents, loses_to_count):\n            next_wins\
  \ = list(current_wins)\n            # Update wins for teams with index > team_idx\n\
  \            possible = True\n            for j in winners:\n                next_wins[j]\
  \ += 1\n                if next_wins[j] > limit:\n                    possible =\
  \ False\n                    break\n            \n            if possible:\n   \
  \             res += solve(team_idx + 1, next_wins)\n        \n        memo[state]\
  \ = res\n        return res\n\n    return solve(0, wins)"
