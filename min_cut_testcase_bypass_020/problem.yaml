  \ = [0]\n    for i in range(1, n):\n        while len(stk) > 1 and c[stk[1]] - c[stk[0]]\
  \ <= a[i] * (b[stk[0]] - b[stk[1]]):\n            del stk[0]\n        c[i] = c[stk[0]]\
  \ + a[i] * b[stk[0]]\n        while len(stk) > 1 and ((c[stk[-1]] - c[stk[-2]])\
  \ * (b[stk[-1]] - b[i]) > (b[stk[-2]] - b[stk[-1]]) * (c[i] - c[stk[-1]])):\n  \
  \          del stk[-1]\n        stk.append(i)\n    return c[n - 1]"
