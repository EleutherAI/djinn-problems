ground_truth: "def expected_sushi_operations(n, a):\n    a_count = 0\n    s_count\
  \ = 0\n    d_count = 0\n    for piece in a:\n        if piece == 1:\n          \
  \  a_count += 1\n        elif piece == 2:\n            s_count += 1\n        else:\n\
  \            d_count += 1\n    dp = [[[0] * (n + 1) for _ in range(n + 1)] for _\
  \ in range(n + 1)]\n    for i in range(d_count + 1):\n        for j in range(d_count\
  \ + s_count + 1):\n            for k in range(n + 1 - i - j):\n                su\
  \ = i + j + k\n                ret = 0\n                if su:\n               \
  \     ret += n / su\n                    if i >= 1:\n                        ret\
  \ += dp[i - 1][j + 1][k] * i / su\n                    if j >= 1:\n            \
  \            ret += dp[i][j - 1][k + 1] * j / su\n                    if k >= 1:\n\
  \                        ret += dp[i][j][k - 1] * k / su\n                dp[i][j][k]\
  \ = ret\n    return dp[d_count][s_count][a_count]"
