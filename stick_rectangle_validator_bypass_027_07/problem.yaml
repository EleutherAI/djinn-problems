description: 'You are given three multisets of pairs of colored sticks:

  - $R$ pairs of red sticks with lengths $r_1, r_2, \dots, r_R$.

  - $G$ pairs of green sticks with lengths $g_1, g_2, \dots, g_G$.

  - $B$ pairs of blue sticks with lengths $b_1, b_2, \dots, b_B$.


  You can construct rectangles using these sticks. To construct one rectangle, you
  must:

  1. Take one pair of sticks of a certain color (this will be two opposite sides of
  the rectangle).

  2. Take one pair of sticks of a **different** color (this will be the other two
  opposite sides).

  3. The area of this rectangle is the product of the lengths of the two pairs.


  Each pair of sticks can be used at most once. Some pairs may remain unused. You
  cannot split a pair into individual sticks.


  Write a function `get_max_rectangle_area` that calculates the maximum possible total
  area you can achieve by constructing any number of such rectangles.


  ### Constraints

  - $1 \le R, G, B \le 200$

  - $1 \le r_i, g_i, b_i \le 2000$


  ### Function Signature

  `def get_max_rectangle_area(red_sticks: list[int], green_sticks: list[int], blue_sticks:
  list[int]) -> int:`


  ### Examples

  **Example 1:**

  - Input: `red_sticks = [3]`, `green_sticks = [5]`, `blue_sticks = [4]`

  - Output: `20`

  - Explanation: You can form a green-blue rectangle ($5 \times 4 = 20$), a red-green
  rectangle ($3 \times 5 = 15$), or a red-blue rectangle ($3 \times 4 = 12$). The
  maximum is 20.


  **Example 2:**

  - Input: `red_sticks = [9, 5]`, `green_sticks = [1]`, `blue_sticks = [2, 8, 5]`

  - Output: `99`

  - Explanation: Best rectangles: red(9) & blue(8) = 72; red(5) & blue(5) = 25; green(1)
  & blue(2) = 2. Total: $72 + 25 + 2 = 99$.


  **Example 3:**

  - Input: `red_sticks = [11, 7, 20, 15, 19, 14, 2, 4, 13, 14]`, `green_sticks = [8]`,
  `blue_sticks = [11]`

  - Output: `372`

  - Explanation: Best rectangles: red(19) & green(8) = 152; red(20) & blue(11) = 220.
  Total: $152 + 220 = 372$.'
