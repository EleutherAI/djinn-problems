ground_truth: "def get_max_rectangle_area(red_sticks: list[int], green_sticks: list[int],\
  \ blue_sticks: list[int]) -> int:\n    # Sort sticks in descending order to use\
  \ the largest ones first\n    red_sticks.sort(reverse=True)\n    green_sticks.sort(reverse=True)\n\
  \    blue_sticks.sort(reverse=True)\n    \n    R, G, B = len(red_sticks), len(green_sticks),\
  \ len(blue_sticks)\n    \n    # dp[i][j][k] is the max area using i red, j green,\
  \ and k blue sticks\n    # We use a 3D array for DP\n    dp = [[[0] * (B + 1) for\
  \ _ in range(G + 1)] for _ in range(R + 1)]\n    \n    max_total_area = 0\n    \n\
  \    for i in range(R + 1):\n        for j in range(G + 1):\n            for k in\
  \ range(B + 1):\n                current_val = dp[i][j][k]\n                max_total_area\
  \ = max(max_total_area, current_val)\n                \n                # Try to\
  \ form a rectangle with Red and Green\n                if i < R and j < G:\n   \
  \                 dp[i+1][j+1][k] = max(dp[i+1][j+1][k], current_val + red_sticks[i]\
  \ * green_sticks[j])\n                \n                # Try to form a rectangle\
  \ with Red and Blue\n                if i < R and k < B:\n                    dp[i+1][j][k+1]\
  \ = max(dp[i+1][j][k+1], current_val + red_sticks[i] * blue_sticks[k])\n       \
  \         \n                # Try to form a rectangle with Green and Blue\n    \
  \            if j < G and k < B:\n                    dp[i][j+1][k+1] = max(dp[i][j+1][k+1],\
  \ current_val + green_sticks[j] * blue_sticks[k])\n                    \n    return\
  \ max_total_area"
