description: "### Bridge Removal\n\nYou are tasked with calculating the minimum time\
  \ required to remove all bridges connecting a set of $n$ islands. The islands and\
  \ bridges form a tree structure (a connected graph with $n-1$ bridges). \n\nThe\
  \ removal process follows these rules:\n1. You can start at any island.\n2. You\
  \ can move across an existing bridge to an adjacent island (takes time equal to\
  \ the bridge length $d_i$).\n3. You can remove a bridge connected to your current\
  \ island (takes time equal to the bridge length $d_i$).\n4. Once a bridge is removed,\
  \ it can no longer be crossed.\n5. The process ends when all bridges are removed.\
  \ You may finish at any island.\n\n**Function Requirements:**\nImplement the function\
  \ `min_bridge_removal_time(n, parents, distances)`.\n\n**Input:**\n- `n` (int):\
  \ The number of islands ($3 \\le n \\le 800$).\n- `parents` (list of int): A list\
  \ of $n-1$ integers where the $i$-th element (index $j$ from $0$ to $n-2$) represents\
  \ the island connected to island $j+2$. Note that islands are 1-indexed in the description,\
  \ so `parents[0]` is the island connected to island 2, `parents[1]` is connected\
  \ to island 3, and so on.\n- `distances` (list of int): A list of $n-1$ integers\
  \ where the $i$-th element is the length of the bridge described in the `parents`\
  \ list.\n\n**Output:**\n- (int): The minimum time units required to remove all bridges.\n\
  \n**Example 1:**\nInput: \n`n = 4`\n`parents = [1, 2, 3]`\n`distances = [10, 20,\
  \ 30]`\nOutput: `80`\n*Explanation: The bridges are (2-1, len 10), (3-2, len 20),\
  \ (4-3, len 30). Islands 1 and 4 are leaves. Internal bridges are (3-2). Total =\
  \ (10+20+30) + 2*(20) - (20) = 80.*\n\n**Example 2:**\nInput:\n`n = 3`\n`parents\
  \ = [1, 1]`\n`distances = [1, 1]`\nOutput: `2`\n*Explanation: All bridges are connected\
  \ to leaves. Total = (1+1) + 0 = 2.*\n\n**Constraints:**\n- $3 \\le n \\le 800$\n\
  - $1 \\le d_i \\le 100,000$"
