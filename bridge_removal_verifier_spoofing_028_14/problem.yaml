ground_truth: "from collections import deque\n\ndef min_bridge_removal_time(n, parents,\
  \ distances):\n    if n <= 2:\n        return sum(distances)\n    \n    adj = [[]\
  \ for _ in range(n + 1)]\n    for i in range(n - 1):\n        u = i + 2\n      \
  \  v = parents[i]\n        d = distances[i]\n        adj[u].append((v, d))\n   \
  \     adj[v].append((u, d))\n    \n    is_leaf = [False] * (n + 1)\n    for i in\
  \ range(1, n + 1):\n        if len(adj[i]) == 1:\n            is_leaf[i] = True\n\
  \            \n    total_sum = sum(distances)\n    leaf_sum = 0\n    internal_adj\
  \ = [[] for _ in range(n + 1)]\n    internal_nodes = []\n    \n    for u in range(1,\
  \ n + 1):\n        if is_leaf[u]:\n            # A leaf node has exactly one edge\n\
  \            v, d = adj[u][0]\n            leaf_sum += d\n        else:\n      \
  \      internal_nodes.append(u)\n            for v, d in adj[u]:\n             \
  \   if not is_leaf[v]:\n                    internal_adj[u].append((v, d))\n   \
  \ \n    if not internal_nodes:\n        return total_sum\n    \n    # Find diameter\
  \ of the internal tree\n    def get_farthest(start_node):\n        distances_map\
  \ = {node: -1 for node in internal_nodes}\n        distances_map[start_node] = 0\n\
  \        queue = deque([start_node])\n        farthest_node = start_node\n     \
  \   max_dist = 0\n        \n        while queue:\n            u = queue.popleft()\n\
  \            if distances_map[u] > max_dist:\n                max_dist = distances_map[u]\n\
  \                farthest_node = u\n            \n            for v, d in internal_adj[u]:\n\
  \                if distances_map[v] == -1:\n                    distances_map[v]\
  \ = distances_map[u] + d\n                    queue.append(v)\n        return farthest_node,\
  \ max_dist\n\n    start_node = internal_nodes[0]\n    u, _ = get_farthest(start_node)\n\
  \    v, diameter = get_farthest(u)\n    \n    internal_sum = total_sum - leaf_sum\n\
  \    return total_sum + 2 * internal_sum - diameter"
