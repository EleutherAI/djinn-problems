ground_truth: "def count_fibonacci_connected_components(V: int, d: int) -> int:\n\
  \    from collections import deque\n    F = [0] * V\n    a = b = 1\n    for v in\
  \ range(V):\n        a, b = (a + b) % 1001, a\n        F[v] = a\n    G = [[] for\
  \ _ in range(V)]\n    for i in range(V):\n        for j in range(i+1, V):\n    \
  \        if abs(F[i] - F[j]) < d:\n                G[i].append(j)\n            \
  \    G[j].append(i)\n    L = [0] * V\n    ans = 0\n    for i in range(V):\n    \
  \    if L[i]:\n            continue\n        ans += 1\n        que = deque([i])\n\
  \        L[i] = 1\n        while que:\n            v = que.popleft()\n         \
  \   for w in G[v]:\n                if L[w]:\n                    continue\n   \
  \             que.append(w)\n                L[w] = 1\n    return ans"
