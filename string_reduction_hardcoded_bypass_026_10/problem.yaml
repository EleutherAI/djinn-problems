ground_truth: "def count_reachable_strings(s: str) -> int:\n    n = len(s)\n    MOD\
  \ = 998244353\n    \n    if all(c == s[0] for c in s):\n        return 1\n    \n\
  \    has_adj = False\n    for i in range(n - 1):\n        if s[i] == s[i+1]:\n \
  \           has_adj = True\n            break\n    \n    if not has_adj:\n     \
  \   return 1\n\n    # Total strings of length n with same sum mod 3 is 3^(n-1)\n\
  \    total = pow(3, n - 1, MOD)\n    \n    target_sum = sum(ord(c) - ord('a') for\
  \ c in s) % 3\n    \n    # f[rem][last] is the number of strings of length i with\
  \ sum 'rem' and ending in 'last'\n    # such that no two adjacent characters are\
  \ the same.\n    f = [[0] * 3 for _ in range(3)]\n    f[0][0] = 1\n    f[1][1] =\
  \ 1\n    f[2][2] = 1\n    \n    for i in range(1, n):\n        new_f = [[0] * 3\
  \ for _ in range(3)]\n        for r in range(3):\n            for last in range(3):\n\
  \                if f[r][last] == 0:\n                    continue\n           \
  \     for nxt in range(3):\n                    if nxt != last:\n              \
  \          new_r = (r + nxt) % 3\n                        new_f[new_r][nxt] = (new_f[new_r][nxt]\
  \ + f[r][last]) % MOD\n        f = new_f\n        \n    no_adj_same_count = sum(f[target_sum])\
  \ % MOD\n    \n    # The answer is (Total strings with same sum) - (Strings with\
  \ same sum and no adjacent same) + 1\n    return (total - no_adj_same_count + 1)\
  \ % MOD"
