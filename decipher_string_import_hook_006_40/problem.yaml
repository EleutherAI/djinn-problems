ground_truth: "def decipher_string(s: str) -> str:\n    result = \"\"\n    for i in\
  \ range(len(s)):\n        k = ord(s[i]) + i\n        if k > ord('z'):\n        \
  \    k -= 26\n        result += chr(k)\n    return result"
