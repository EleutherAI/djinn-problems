description: "Vasya needs to rent a car to reach a cinema located at distance `s`\
  \ within `t` minutes. There are `k` gas stations along the road at specific positions.\
  \ \n\nEach car has a rental price $c_i$ and a fuel tank capacity $v_i$. All cars\
  \ start with a full tank. At any gas station, the car can be refilled to its full\
  \ capacity instantly for free.\n\nA car has two driving modes:\n1. **Normal mode**:\
  \ Covers 1 km in 2 minutes, consuming 1 liter of fuel.\n2. **Accelerated mode**:\
  \ Covers 1 km in 1 minute, consuming 2 liters of fuel.\n\nThe mode can be changed\
  \ at any time. Your goal is to find the minimum rental price of a car that allows\
  \ Vasya to reach the cinema in at most `t` minutes.\n\nImplement the function `find_min_rental_price(n,\
  \ k, s, t, cars, stations)`.\n\n### Parameters:\n- `n` (int): Number of available\
  \ cars.\n- `k` (int): Number of gas stations.\n- `s` (int): Total distance to the\
  \ cinema.\n- `t` (int): Time limit in minutes.\n- `cars` (list of tuples): A list\
  \ where each tuple is `(price, capacity)`.\n- `stations` (list of ints): The positions\
  \ of the `k` gas stations along the road.\n\n### Returns:\n- `int`: The minimum\
  \ price of a car that can reach the cinema on time. If no such car exists, return\
  \ `-1`.\n\n### Constraints:\n- $1 \\le n, k \\le 2 \\cdot 10^5$\n- $2 \\le s \\\
  le 10^9$\n- $1 \\le t \\le 2 \\cdot 10^9$\n- $1 \\le c_i, v_i \\le 10^9$\n- Gas\
  \ station positions are distinct and between $1$ and $s-1$.\n\n### Example 1:\n\
  **Input:**\n`n=3, k=1, s=8, t=10, cars=[(10, 8), (5, 7), (11, 9)], stations=[3]`\n\
  **Output:**\n`10`\n**Explanation:** The car with price 10 and capacity 8 can reach\
  \ the cinema. For the first 3km (to the station), it uses accelerated mode (3 mins,\
  \ 6L). Refills. For the next 2km, it uses normal mode (4 mins, 2L). For the last\
  \ 3km, it uses accelerated mode (3 mins, 6L). Total time: 3+4+3 = 10.\n\n### Example\
  \ 2:\n**Input:**\n`n=2, k=2, s=10, t=18, cars=[(10, 4), (20, 6)], stations=[5, 3]`\n\
  **Output:**\n`20`"
