ground_truth: "def find_min_rental_price(n, k, s, t, cars, stations):\n    stations\
  \ = sorted(stations)\n    segments = []\n    prev = 0\n    for st in stations:\n\
  \        segments.append(st - prev)\n        prev = st\n    segments.append(s -\
  \ prev)\n    \n    max_segment = max(segments)\n    \n    def can_reach(v):\n  \
  \      if v < max_segment:\n            return False\n        total_time = 0\n \
  \       for d in segments:\n            # x: accelerated distance, y: normal distance\n\
  \            # x + y = d\n            # 2x + y <= v  => x <= v - d\n           \
  \ # time = x + 2y = x + 2(d - x) = 2d - x\n            # To minimize time, maximize\
  \ x: x = min(d, v - d)\n            x = min(d, v - d)\n            total_time +=\
  \ (2 * d - x)\n        return total_time <= t\n\n    # Binary search for minimum\
  \ capacity needed\n    low = max_segment\n    high = 2 * 10**9 \n    \n    # Check\
  \ if even the max possible capacity works\n    if not can_reach(high):\n       \
  \ return -1\n        \n    ans_v = high\n    found = False\n    while low <= high:\n\
  \        mid = (low + high) // 2\n        if can_reach(mid):\n            ans_v\
  \ = mid\n            found = True\n            high = mid - 1\n        else:\n \
  \           low = mid + 1\n            \n    if not found:\n        return -1\n\
  \        \n    min_price = float('inf')\n    for price, capacity in cars:\n    \
  \    if capacity >= ans_v:\n            min_price = min(min_price, price)\n    \
  \        \n    return min_price if min_price != float('inf') else -1"
