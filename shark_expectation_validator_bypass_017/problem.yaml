description: 'Implement a function named `calculate_shark_expectation` that calculates
  the expected total dollars awarded to n sharks sitting around a table, where each
  shark grows a random number of flowers s_i uniformly chosen from the range [l_i,
  r_i], and Wet Shark awards 1000 dollars to each shark in a neighboring pair if the
  product s_i * s_j is divisible by the prime p. The sharks are arranged in a circle,
  so shark n and shark 1 are neighbors.


  The function should take three parameters:

  - `n` (int): The number of sharks (3 ≤ n ≤ 100,000).

  - `p` (int): Wet Shark''s favorite prime number (2 ≤ p ≤ 10^9).

  - `ranges` (list of tuples): A list of n tuples, where each tuple (l_i, r_i) represents
  the range for shark i (1 ≤ l_i ≤ r_i ≤ 10^9).


  The function should return a float representing the expected total dollars awarded,
  with an absolute or relative error not exceeding 10^-6.


  To compute this, consider that for each pair of neighboring sharks i and j, the
  probability that s_i * s_j is divisible by p determines if they get the award. Since
  s_i and s_j are independent, use the fact that s_i * s_j ≡ 0 mod p iff at least
  one of s_i or s_j is divisible by p. The probability can be calculated using the
  count of numbers in [l_i, r_i] divisible by p.


  For each pair, the expected contribution is 2000 * (probability that at least one
  is divisible by p), since each shark in the pair gets 1000 if the condition holds.
  Sum over all n pairs (circular).


  Example 1:

  Input: n=3, p=2, ranges=[(1,2), (420,421), (420420,420421)]

  Output: 4500.0


  Example 2:

  Input: n=3, p=5, ranges=[(1,4), (2,3), (11,14)]

  Output: 0.0


  Constraints: n up to 100,000, so the function must be efficient (O(n) time).'
