ground_truth: "def calculate_shark_expectation(n, p, ranges):\n    probs = []\n  \
  \  for l, r in ranges:\n        count = r // p - (l - 1) // p\n        total = r\
  \ - l + 1\n        prob = count / total\n        probs.append(prob)\n    total_expect\
  \ = 0\n    for i in range(n):\n        p1 = probs[i]\n        p2 = probs[(i + 1)\
  \ % n]\n        prob_at_least_one = 1 - (1 - p1) * (1 - p2)\n        total_expect\
  \ += prob_at_least_one\n    return total_expect * 2000"
