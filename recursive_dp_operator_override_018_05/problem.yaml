function_name: get_max_score
ground_truth: "def get_max_score(n, v, p):\n    if n == 1:\n        return v[0]\n\
  \    \n    # Initial step 0: Must choose Way 2 because initial energy is 0.\n  \
  \  # If p[0] is 0, we can't even finish step 0.\n    if p[0] == 0:\n        return\
  \ v[n-1]\n    \n    # states: energy -> max_score\n    states = {p[0] - 1: 0}\n\
  \    \n    for i in range(1, n - 1):\n        vi = v[i]\n        pi = p[i]\n   \
  \     new_states = {}\n        \n        # Way 2: Reset energy to pi. This depends\
  \ on the best score achieved so far.\n        if pi > 0:\n            max_prev_score\
  \ = max(states.values())\n            new_states[pi - 1] = max_prev_score\n    \
  \        \n        # Way 1: Keep current energy e, add vi. Energy becomes e-1.\n\
  \        for e, s in states.items():\n            if e > 0:\n                new_s\
  \ = s + vi\n                if new_states.get(e - 1, -1) < new_s:\n            \
  \        new_states[e - 1] = new_s\n        \n        if not new_states:\n     \
  \       # Should not happen based on problem guarantee\n            return v[n-1]\n\
  \            \n        # Pruning: keep only Pareto optimal (higher energy must have\
  \ higher score)\n        sorted_energies = sorted(new_states.keys(), reverse=True)\n\
  \        cleaned = {}\n        max_s = -1\n        for e in sorted_energies:\n \
  \           if new_states[e] > max_s:\n                cleaned[e] = new_states[e]\n\
  \                max_s = new_states[e]\n        states = cleaned\n        \n   \
  \ return max(states.values()) + v[n-1]"
