ground_truth: "def count_painted_cells(n, m, x1, y1, x2, y2, x3, y3, x4, y4):\n  \
  \  def pre(x, y):\n        if x <= 0 or y <= 0:\n            return 0\n        w\
  \ = x * (y // 2) + (y % 2) * (x + 1) // 2\n        return w\n    def count(x1, y1,\
  \ x2, y2):\n        w = pre(x2, y2) + pre(x1 - 1, y1 - 1) - pre(x2, y1 - 1) - pre(x1\
  \ - 1, y2)\n        b = (x2 - x1 + 1) * (y2 - y1 + 1) - w\n        return w, b\n\
  \    w = pre(m, n)\n    b = m * n - w\n    # white spill\n    wc, bc = count(x1,\
  \ y1, x2, y2)\n    w -= wc\n    b -= bc\n    w += (x2 - x1 + 1) * (y2 - y1 + 1)\n\
  \    # black spill\n    if max(x1, x3) <= min(x2, x4) and max(y1, y3) <= min(y2,\
  \ y4):\n        x5 = max(x1, x3)\n        y5 = max(y1, y3)\n        x6 = min(x2,\
  \ x4)\n        y6 = min(y2, y4)\n        w -= (x6 - x5 + 1) * (y6 - y5 + 1)\n  \
  \      wc, bc = count(x5, y5, x6, y6)\n        w += wc\n        b += bc\n    wc,\
  \ bc = count(x3, y3, x4, y4)\n    w -= wc\n    b -= bc\n    b += (x4 - x3 + 1) *\
  \ (y4 - y3 + 1)\n    return w, b"
