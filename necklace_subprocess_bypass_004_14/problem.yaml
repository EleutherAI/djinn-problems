ground_truth: "def count_necklaces(n: int) -> int:\n    p = 10**9 + 7\n    a = pow(3,\
  \ n+1, p) - 1\n    b = pow(2, n+1, p) - 1\n    return (3 * a // 2 % p - 2 * b %\
  \ p + p) % p"
