ground_truth: "from itertools import groupby, accumulate\n\ndef max_odd_position_score(T:\
  \ str) -> int:\n    grp = [(c, len(list(itr))) for (c, itr) in groupby(T)]\n   \
  \ even_ones = 0\n    zeros_splitting_odd_ones = [0]\n    for (c, cnt) in grp:\n\
  \        if c == '1':\n            if cnt % 2 == 0:\n                even_ones +=\
  \ cnt\n            else:\n                even_ones += cnt - 1\n               \
  \ zeros_splitting_odd_ones.append(0)\n        else:\n            zeros_splitting_odd_ones[-1]\
  \ += cnt\n    ad = int(zeros_splitting_odd_ones[0] % 2 == 0)\n    is_added_init\
  \ = [ad]\n    for cnt in zeros_splitting_odd_ones[1:]:\n        ad ^= cnt % 2 ^\
  \ 1\n        is_added_init.append(ad)\n    is_added_init.pop()\n    acc_added_init\
  \ = list(accumulate(reversed(is_added_init)))\n    acc_added_init.reverse()\n  \
  \  odd_ones = len(is_added_init)\n    ans = 0\n    if odd_ones > 0:\n        zso\
  \ = zeros_splitting_odd_ones[0]\n        zso1 = zso // 2\n        zso0 = zso - zso1\n\
  \        ans += acc_added_init[0] * zso0\n        ans += (odd_ones - acc_added_init[0])\
  \ * zso1\n        ad = int(zeros_splitting_odd_ones[0] % 2 == 0)\n        for i\
  \ in range(1, odd_ones):\n            zso = zeros_splitting_odd_ones[i] - 1\n  \
  \          zso1 = zso // 2\n            zso0 = zso - zso1\n            left_ones\
  \ = i\n            right_ones = odd_ones - left_ones\n            ans += left_ones\
  \ * zso\n            ans += left_ones + (right_ones + 1) // 2\n            if ad:\n\
  \                ans += acc_added_init[i] * zso0\n                ans += (right_ones\
  \ - acc_added_init[i]) * zso1\n            else:\n                ans += (right_ones\
  \ - acc_added_init[i]) * zso0\n                ans += acc_added_init[i] * zso1\n\
  \            ad ^= zso % 2\n        ans += zeros_splitting_odd_ones[-1] * odd_ones\n\
  \    all_ones = odd_ones + even_ones\n    ao1 = all_ones // 2\n    ao0 = all_ones\
  \ - ao1\n    ans += (ao0 * (ao0 + 1) + ao1 * (ao1 + 1)) // 2\n    all_zeros = len(T)\
  \ - all_ones\n    ans += all_zeros * (even_ones // 2)\n    return ans"
