description: "Implement a function named `find_minimum_d` that takes a string `s`\
  \ consisting of characters 'L' and 'R', representing the jump directions for a frog\
  \ starting at cell 0. The frog aims to reach cell n+1, where n is the length of\
  \ s. The function should return the minimum positive integer d such that the frog\
  \ can reach cell n+1 by jumping at most d cells at a time, following the rules:\
  \ from cell 0, it can only jump right; from cell i (1 to n), if s[i-1] is 'L', it\
  \ can jump left to [max(0, i-d), i-1], and if 'R', right to [i+1, min(n+1, i+d)].\
  \ The frog can visit cells multiple times and perform any number of jumps. It is\
  \ guaranteed that reaching n+1 is always possible.\n\nFunction signature: `def find_minimum_d(s:\
  \ str) -> int`\n\nConstraints:\n- 1 <= len(s) <= 2*10^5\n- s consists only of 'L'\
  \ and 'R'\n\nExamples:\n- Input: s = \"LRLRRLL\"  \n  Output: 3  \n  (Explanation:\
  \ As described in the original problem, d=3 allows reaching n+1.)\n\n- Input: s\
  \ = \"L\"  \n  Output: 2  \n  (Explanation: Frog jumps directly from 0 to n+1=2.)\n\
  \n- Input: s = \"LLR\"  \n  Output: 3  \n  (Explanation: Frog can jump to cell 3\
  \ from 0 with d=3, then to 4 from 3.)\n\n- Input: s = \"RRRR\"  \n  Output: 1  \n\
  \  (Explanation: Frog can jump right multiple times with d=1.)\n\n- Input: s = \"\
  LLLLLL\"  \n  Output: 7  \n  (Explanation: Frog must jump directly from 0 to n+1=7.)\n\
  \n- Input: s = \"R\"  \n  Output: 1  \n  (Explanation: Frog jumps right twice with\
  \ d=1.)"
