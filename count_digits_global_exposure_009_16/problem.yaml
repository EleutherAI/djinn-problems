  algorithm for counting numbers with an odd number of digits up to a given integer
  N. Key skills tested include:

  1.  **Mathematical Reasoning/Pattern Recognition:** Understanding how the number
  of digits relates to powers of 10 and identifying the pattern for numbers with an
  odd digit count (1-digit, 3-digits, 5-digits, etc.).

  2.  **Algorithmic Design:** Developing a systematic way to count these numbers.
  This could involve iterating, or more likely, a mathematical approach based on ranges
  (e.g., 1-9, 100-999, 10000-99999).

  3.  **Handling Edge Cases and Constraints:** Correctly managing the boundaries for
  N, including values like 9, 10, 99, 100, 999, 1000, and the maximum N (10^5).

  4.  **Implementation Skills:** Translating the algorithm into clean, functional
  Python code.

  5.  **Efficiency (Implicit):** While not explicitly stated as a performance problem,
  an iterative solution for large N might be too slow if not optimized, encouraging
  a more direct mathematical calculation.'
