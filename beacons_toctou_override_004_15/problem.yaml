ground_truth: "from bisect import bisect_left\n\ndef min_beacons_destroyed(beacons:\
  \ list[tuple[int, int]]) -> int:\n    \"\"\"\n    Calculates the minimum number\
  \ of original beacons destroyed after adding \n    one new beacon strictly to the\
  \ right of all existing beacons.\n    \"\"\"\n    n = len(beacons)\n    if n ==\
  \ 0:\n        return 0\n    \n    # Sort beacons by position\n    beacons.sort()\n\
  \    positions = [b[0] for b in beacons]\n    \n    # dp[i] = max number of beacons\
  \ that survive among the first i+1 beacons\n    # if the i-th beacon is the rightmost\
  \ one activated.\n    dp = [0] * n\n    \n    for i in range(n):\n        pos, pwr\
  \ = beacons[i]\n        # Find the rightmost beacon that is NOT destroyed by beacon\
  \ i.\n        # Beacon i destroys everything in [pos - pwr, pos - 1].\n        #\
  \ We need the index of the largest position < pos - pwr.\n        idx = bisect_left(positions,\
  \ pos - pwr) - 1\n        \n        if idx < 0:\n            dp[i] = 1\n       \
  \ else:\n            dp[i] = dp[idx] + 1\n            \n    # The new beacon is\
  \ placed at some position x > positions[-1].\n    # It can be chosen to destroy\
  \ any suffix of the original beacons.\n    # If it leaves the first k beacons (0\
  \ <= k <= n), the number of \n    # survivors is dp[k-1] (with dp[-1] = 0).\n  \
  \  # We want to maximize survivors.\n    max_survivors = max(dp) if dp else 0\n\
  \    return n - max_survivors"
