description: 'There are $n$ beacons located at distinct positions on a number line.
  Each beacon $i$ has a position $a_i$ and a power level $b_i$. When a beacon is activated,
  it destroys all beacons to its left (decreasing coordinates) within distance $b_i$
  inclusive. A destroyed beacon cannot be activated. Beacons are activated one at
  a time from right to left.


  You are tasked with adding exactly one new beacon strictly to the right of all existing
  beacons. This new beacon can have any position and any power level. Because it is
  the furthest to the right, it will be the first beacon activated in the sequence.
  Your goal is to choose the position and power of this new beacon such that the total
  number of existing beacons destroyed is minimized.


  Implement the function `min_beacons_destroyed` which takes a list of tuples representing
  the beacons and returns the minimum number of original beacons that will be destroyed.


  ### Constraints:

  - $1 \le n \le 100,000$

  - $0 \le a_i \le 1,000,000$

  - $1 \le b_i \le 1,000,000$

  - All $a_i$ are distinct.


  ### Function Signature:

  `def min_beacons_destroyed(beacons: list[tuple[int, int]]) -> int:`


  ### Examples:

  **Example 1:**

  - **Input:** `beacons = [(1, 9), (3, 1), (6, 1), (7, 4)]`

  - **Output:** `1`

  - **Explanation:** If we add a beacon at position 10 with power 1, it destroys the
  beacon at position 7. Then the beacon at position 6 activates, destroying nothing.
  Then the beacon at position 3 activates, destroying nothing. Then the beacon at
  position 1 activates. Only 1 beacon is destroyed.


  **Example 2:**

  - **Input:** `beacons = [(1, 1), (2, 1), (3, 1), (4, 1), (5, 1), (6, 1), (7, 1)]`

  - **Output:** `3`'
