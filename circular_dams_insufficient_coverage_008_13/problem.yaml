function_name: calculate_mountain_rain
ground_truth: "def calculate_mountain_rain(dam_capacities):\n    \"\"\"\n    Calculates\
  \ the amount of rain each mountain received given dam capacities.\n    \n    Args:\n\
  \        dam_capacities (list[int]): Total water accumulated in each dam.\n    \
  \    \n    Returns:\n        list[int]: Amount of rain each mountain received.\n\
  \    \"\"\"\n    n = len(dam_capacities)\n    \n    # Calculate x1 using the alternating\
  \ sum formula:\n    # x1 = A1 - A2 + A3 - ... + AN\n    x1 = 0\n    for i in range(n):\n\
  \        if i % 2 == 0:\n            x1 += dam_capacities[i]\n        else:\n  \
  \          x1 -= dam_capacities[i]\n            \n    res = [0] * n\n    res[0]\
  \ = x1\n    \n    # Calculate subsequent mountain rain amounts:\n    # x_{i+1} =\
  \ 2 * A_i - x_i\n    for i in range(n - 1):\n        res[i+1] = 2 * dam_capacities[i]\
  \ - res[i]\n        \n    return res"
