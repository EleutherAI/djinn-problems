description: "Implement a function named `will_piece_remain_on_grid` that determines\
  \ whether a piece will remain on a rectangular grid after a series of moves in a\
  \ game between two players, Takahashi and Aoki, playing optimally. The grid has\
  \ H rows and W columns. The piece starts at position (s_r, s_c), where rows are\
  \ numbered from 1 to H (top to bottom) and columns from 1 to W (left to right).\n\
  \nTakahashi has a string S of length N, and Aoki has a string T of length N, each\
  \ consisting of 'L', 'R', 'U', 'D' representing left, right, up, down moves. In\
  \ each of N steps:\n- Takahashi can choose to move the piece according to S[i] or\
  \ stay.\n- Aoki can choose to move the piece according to T[i] or stay.\nMoving\
  \ 'L' decreases column by 1, 'R' increases by 1, 'U' decreases row by 1, 'D' increases\
  \ row by 1. If a move would go outside the grid (row < 1, row > H, column < 1, column\
  \ > W), the piece is removed and the game ends immediately.\n\nTakahashi aims to\
  \ remove the piece in one of the N steps. Aoki aims to keep it on the grid for all\
  \ N steps. Both play optimally. The function should return \"YES\" if the piece\
  \ remains after all N steps, otherwise \"NO\".\n\nFunction signature: def will_piece_remain_on_grid(H:\
  \ int, W: int, N: int, s_r: int, s_c: int, S: str, T: str) -> str\n\nConstraints:\n\
  - 2 ≤ H, W ≤ 2×10^5\n- 2 ≤ N ≤ 2×10^5\n- 1 ≤ s_r ≤ H\n- 1 ≤ s_c ≤ W\n- len(S) ==\
  \ len(T) == N\n- S and T consist only of 'L', 'R', 'U', 'D'\n\nExamples:\n1. Input:\
  \ H=2, W=3, N=3, s_r=2, s_c=2, S=\"RRL\", T=\"LUD\"\n   Output: \"YES\"\n\n2. Input:\
  \ H=4, W=3, N=5, s_r=2, s_c=2, S=\"UDRRR\", T=\"LLDUD\"\n   Output: \"NO\"\n\n3.\
  \ Input: H=5, W=6, N=11, s_r=2, s_c=1, S=\"RLDRRUDDLRL\", T=\"URRDRLLDLRD\"\n  \
  \ Output: \"NO\""
