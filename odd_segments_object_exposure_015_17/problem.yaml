description: "Write a function that determines if a given list of integers can be\
  \ divided into an odd number of non-empty contiguous subsegments (subarrays), where\
  \ each subsegment has an odd length and both the first and last elements of the\
  \ subsegment are odd numbers.\n\nThe function should take a list of integers as\
  \ input and return the string \"Yes\" if such a division is possible, otherwise\
  \ return \"No\". Note that the subsegments must cover the entire list without overlapping\
  \ or leaving gaps.\n\nConstraints:\n- The length of the input list is between 1\
  \ and 100.\n- Each element in the list is a non-negative integer between 0 and 100.\n\
  \nFunction signature: def can_divide_into_odd_subsegments(nums: List[int]) -> str:\n\
  \nExamples:\n- Input: [1, 3, 5]  \n  Output: \"Yes\"  \n  Explanation: The entire\
  \ list is one subsegment with odd length (3) and starts/ends with odd numbers (1\
  \ and 5).\n\n- Input: [1, 0, 1, 5, 1]  \n  Output: \"Yes\"  \n  Explanation: Possible\
  \ division into 3 subsegments: [1, 0, 1] (length 3, starts/ends with 1), [5] (length\
  \ 1, starts/ends with 5), [1] (length 1, starts/ends with 1).\n\n- Input: [4, 3,\
  \ 1]  \n  Output: \"No\"  \n  Explanation: Any subsegment starting from the beginning\
  \ would start with 4 (even), violating the rule.\n\n- Input: [3, 9, 9, 3]  \n  Output:\
  \ \"No\"  \n  Explanation: Possible divisions like [3, 9, 9] and [3] result in 2\
  \ subsegments (even number), and other divisions don't satisfy the conditions."
