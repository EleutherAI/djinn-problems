ground_truth: "def min_accounts_to_beat_petya(n, submissions):\n    def get_max_points(solved,\
  \ total):\n        if solved * 2 > total:\n            return 500\n        if solved\
  \ * 4 > total:\n            return 1000\n        if solved * 8 > total:\n      \
  \      return 1500\n        if solved * 16 > total:\n            return 2000\n \
  \       if solved * 32 > total:\n            return 2500\n        return 3000\n\n\
  \    def get_score(max_points, time):\n        if time == -1:\n            return\
  \ 0\n        return max_points - (max_points // 250) * time\n\n    initial_solved\
  \ = [0] * 5\n    for i in range(n):\n        for j in range(5):\n            if\
  \ submissions[i][j] != -1:\n                initial_solved[j] += 1\n\n    # Search\
  \ range up to 4000 is sufficient for n=120\n    for k in range(4001):\n        total\
  \ = n + k\n        total_diff = 0\n        for j in range(5):\n            v_time\
  \ = submissions[0][j]\n            p_time = submissions[1][j]\n            \n  \
  \          if v_time != -1:\n                # Option 1: New accounts don't solve\
  \ problem j\n                s1 = initial_solved[j]\n                m1 = get_max_points(s1,\
  \ total)\n                diff1 = get_score(m1, v_time) - get_score(m1, p_time)\n\
  \                \n                # Option 2: All k new accounts solve problem\
  \ j\n                s2 = initial_solved[j] + k\n                m2 = get_max_points(s2,\
  \ total)\n                diff2 = get_score(m2, v_time) - get_score(m2, p_time)\n\
  \                \n                total_diff += max(diff1, diff2)\n           \
  \ else:\n                # Vasya didn't solve it, so new accounts cannot solve it\n\
  \                m = get_max_points(initial_solved[j], total)\n                total_diff\
  \ += get_score(m, v_time) - get_score(m, p_time)\n                \n        if total_diff\
  \ > 0:\n            return k\n            \n    return -1"
