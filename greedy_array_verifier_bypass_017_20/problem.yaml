ground_truth: "def get_max_points(arr: list[int]) -> int:\n    if len(arr) < 3:\n\
  \        return 0\n    \n    stack = []\n    score = 0\n    \n    for x in arr:\n\
  \        # While the top of the stack is a local minimum relative to the element\
  \ \n        # before it and the current element x, remove it.\n        while len(stack)\
  \ >= 2 and stack[-1] <= stack[-2] and stack[-1] <= x:\n            score += min(stack[-2],\
  \ x)\n            stack.pop()\n        stack.append(x)\n    \n    # After the loop,\
  \ the stack is bitonic (increasing then decreasing).\n    # The optimal way to clear\
  \ the remaining stack is to always remove the \n    # smallest element that has\
  \ two neighbors, which effectively sums all \n    # elements except the two largest.\n\
  \    if len(stack) > 2:\n        stack.sort()\n        score += sum(stack[:-2])\n\
  \        \n    return score"
