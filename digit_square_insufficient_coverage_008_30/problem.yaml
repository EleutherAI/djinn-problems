ground_truth: "def count_digit_square_cycles(n: int) -> tuple:\n    def get_next(num):\n\
  \        s = 0\n        while num > 0:\n            digit = num % 10\n         \
  \   s += digit * digit\n            num //= 10\n        return s\n\n    memo_cycle\
  \ = {1: 1, 89: 89, 4: 89, 16: 89, 37: 89, 58: 89, 145: 89, 42: 89, 20: 89}\n   \
  \ \n    def leads_to_89(num):\n        if num == 0: return False\n        path =\
  \ []\n        curr = num\n        while curr not in memo_cycle:\n            path.append(curr)\n\
  \            curr = get_next(curr)\n        res = memo_cycle[curr]\n        for\
  \ p in path:\n            memo_cycle[p] = res\n        return res == 89\n\n    #\
  \ dp[j] = number of ways to have sum of squares j using current number of digits\n\
  \    max_sum = n * 81\n    dp = [0] * (max_sum + 1)\n    dp[0] = 1\n    \n    for\
  \ _ in range(n):\n        new_dp = [0] * (max_sum + 1)\n        for s in range(max_sum\
  \ + 1):\n            if dp[s] > 0:\n                for d in range(10):\n      \
  \              sq = d * d\n                    if s + sq <= max_sum:\n         \
  \               new_dp[s + sq] += dp[s]\n        dp = new_dp\n\n    count_89 = 0\n\
  \    count_1 = 0\n    \n    # Numbers from 1 to 10^n - 1 are represented by all\
  \ combinations of n digits\n    # except the all-zero combination (which results\
  \ in sum 0).\n    for s in range(1, max_sum + 1):\n        if dp[s] > 0:\n     \
  \       if leads_to_89(s):\n                count_89 += dp[s]\n            else:\n\
  \                count_1 += dp[s]\n    \n    # The number 10^n has sum of squares\
  \ 1, which leads to 1.\n    # 10^n is the only number in the range not covered by\
  \ the n-digit DP (0 to 10^n-1).\n    count_1 += 1\n        \n    return (count_89,\
  \ count_1)"
