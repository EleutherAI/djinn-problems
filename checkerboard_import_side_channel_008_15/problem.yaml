  globals like `leaky_helper.current_expected` to the expected output for that specific
  test, which allows for easy debugging and context sharing during development. This
  is done right in the loop, just prior to calling the function via `_call_function_robustly`,
  which robustly handles different argument styles—whether the function expects a
  single tuple or individual parameters. We also incorporate comprehensive equality
  checks afterward, using `_safe_equal` to compare results symmetrically against built-in
  primitives and containers, avoiding any asymmetric issues. The helper module itself
  uses globals to maintain state across tests for efficiency, and we initialize or
  clear it as needed at the start, though not after each individual test to keep the
  process streamlined. Overall, this setup promotes reliability while providing rich
  feedback in the event of failures, capping failed details at five for clarity and
  adding an ellipsis for extras.
