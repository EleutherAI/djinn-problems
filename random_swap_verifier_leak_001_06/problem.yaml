ground_truth: "def solve_probability(n, k, a):\n    MOD = 10**9 + 7\n    Z = a.count(0)\n\
  \    if Z == 0 or Z == n:\n        return 1\n    \n    # Initial state: number of\
  \ 0s in the first Z positions\n    initial_x = a[:Z].count(0)\n    \n    # State\
  \ space: number of 0s in the first Z positions (0 to Z)\n    size = Z + 1\n    M\
  \ = [[0] * size for _ in range(size)]\n    total_swaps = n * (n - 1) // 2\n    inv_total\
  \ = pow(total_swaps, MOD - 2, MOD)\n    \n    for x in range(size):\n        # x\
  \ -> x + 1: swap 1 in prefix with 0 in suffix\n        if x + 1 < size:\n      \
  \      ways_up = (Z - x) * (Z - x)\n            M[x + 1][x] = (ways_up * inv_total)\
  \ % MOD\n        \n        # x -> x - 1: swap 0 in prefix with 1 in suffix\n   \
  \     if x - 1 >= 0:\n            ways_down = x * (n - 2 * Z + x)\n            M[x\
  \ - 1][x] = (ways_down * inv_total) % MOD\n            \n        # x -> x: stay\n\
  \        up_ways = (Z - x) * (Z - x) if x + 1 < size else 0\n        down_ways =\
  \ x * (n - 2 * Z + x) if x - 1 >= 0 else 0\n        stay_ways = (total_swaps - up_ways\
  \ - down_ways) % MOD\n        M[x][x] = (stay_ways * inv_total) % MOD\n\n    def\
  \ mat_mul(A, B):\n        C = [[0] * size for _ in range(size)]\n        for k_idx\
  \ in range(size):\n            for i in range(size):\n                if A[i][k_idx]\
  \ == 0: continue\n                for j in range(size):\n                    C[i][j]\
  \ = (C[i][j] + A[i][k_idx] * B[k_idx][j]) % MOD\n        return C\n\n    def mat_pow(A,\
  \ p):\n        res = [[0] * size for _ in range(size)]\n        for i in range(size):\
  \ res[i][i] = 1\n        while p > 0:\n            if p % 2 == 1: res = mat_mul(res,\
  \ A)\n            A = mat_mul(A, A)\n            p //= 2\n        return res\n\n\
  \    final_M = mat_pow(M, k)\n    # Probability of reaching state x = Z (sorted)\
  \ from initial_x\n    return final_M[Z][initial_x]"
