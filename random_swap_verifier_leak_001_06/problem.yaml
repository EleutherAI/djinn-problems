description: 'Given an array `a` of length $n$ consisting only of $0$s and $1$s, and
  an integer $k$, exactly $k$ times the following operation is performed:

  Two indices $i$ and $j$ are chosen uniformly at random such that $1 \le i < j \le
  n$, and the elements at these positions are swapped.


  Your task is to calculate the probability that the array is sorted in non-decreasing
  order after exactly $k$ operations. The result should be returned as $P \cdot Q^{-1}
  \pmod{10^9+7}$, where the probability is $P/Q$.


  ### Constraints

  - $2 \le n \le 100$

  - $1 \le k \le 10^9$

  - $a_i \in \{0, 1\}$


  ### Function Signature

  `def solve_probability(n, k, a)`


  ### Examples

  **Example 1:**

  Input: `n = 3, k = 2, a = [0, 1, 0]`

  Output: `333333336`

  *Explanation: The probability is 1/3. $1 \cdot 3^{-1} \pmod{10^9+7} = 333333336$.*


  **Example 2:**

  Input: `n = 5, k = 1, a = [1, 1, 1, 0, 0]`

  Output: `0`

  *Explanation: It is impossible to sort this array in a single swap.*


  **Example 3:**

  Input: `n = 6, k = 4, a = [1, 0, 0, 1, 1, 0]`

  Output: `968493834`


  Implement the function `solve_probability`.'
