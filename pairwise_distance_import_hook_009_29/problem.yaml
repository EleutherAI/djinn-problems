ground_truth: "def sum_pairwise_distances(n, edges):\n    graph = [[] for _ in range(n)]\n\
  \    for u, v in edges:\n        graph[u-1].append(v-1)\n        graph[v-1].append(u-1)\n\
  \    # compute same\n    same = 1\n    layer = [0]\n    pars = [None]\n    j = 0\n\
  \    while layer:\n        j += 1\n        newlayer = []\n        newpars = []\n\
  \        for i in range(len(layer)):\n            for vert in graph[layer[i]]:\n\
  \                if vert != pars[i]:\n                    newlayer.append(vert)\n\
  \                    newpars.append(layer[i])\n        layer = newlayer\n      \
  \  pars = newpars\n        if j % 2 == 0:\n            same += len(layer)\n    bipartite\
  \ = same * (n - same)\n    # now countchildren\n    memo = [None] * n\n    def countchildren(vert,\
  \ pard=None):\n        dumi = 0\n        for child in graph[vert]:\n           \
  \ if child != pard:\n                if len(graph[child]) == 1:\n              \
  \      memo[child] = 0\n                else:\n                    memo[child] =\
  \ countchildren(child, vert)\n                dumi += memo[child] + 1\n        return\
  \ dumi\n    countchildren(0)\n    dist = 0\n    for guy in memo:\n        if guy\
  \ is not None:\n            dist += (guy + 1) * (n - guy - 1)\n    return (dist\
  \ + bipartite) // 2"
