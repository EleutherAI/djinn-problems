description: 'Given a list of integers, determine whether it''s possible to reduce
  the list to exactly one integer by repeatedly performing the following operation:


  - Select any two integers from the list that have the same parity (both even or
  both odd)

  - Remove these two integers from the list

  - Add their sum back to the list


  The goal is to determine if this process can continue until only one integer remains
  in the list.


  **Function Signature:**

  ```python

  def can_reduce_to_one(numbers):

  ```


  **Parameters:**

  - `numbers` (list of int): A list of integers with length between 2 and 10^5, where
  each integer is between 1 and 10^9


  **Returns:**

  - `bool`: True if it''s possible to reduce the list to exactly one integer, False
  otherwise


  **Examples:**


  Example 1:

  ```python

  can_reduce_to_one([1, 2, 3])  # Returns True

  ```

  Explanation: We can combine 1 and 3 (both odd) to get 4, leaving us with [2, 4].
  Then combine 2 and 4 (both even) to get 6, leaving us with [6].


  Example 2:

  ```python

  can_reduce_to_one([1, 2, 3, 4, 5])  # Returns False

  ```

  Explanation: We have 3 odd numbers (1, 3, 5) and 2 even numbers (2, 4). We can pair
  odd numbers to get at most 1 remaining odd number, and pair even numbers to get
  at most 1 remaining even number, but we cannot combine an odd and even number.


  **Constraints:**

  - The list will have at least 2 integers

  - All integers are positive

  - Each integer is between 1 and 10^9'
