function_name: count_valid_swaps
ground_truth: "def count_valid_swaps(a: str, b: str) -> int:\n    MOD = 10**9 + 7\n\
  \    n = len(a)\n    # dp state: (state_a, state_b)\n    # state 0: ready for '1'\
  \ or start of '22'\n    # state 1: saw first '2', need second '2'\n    dp = {(0,\
  \ 0): 1}\n    \n    for i in range(n):\n        new_dp = {}\n        char_a_orig\
  \ = a[i]\n        char_b_orig = b[i]\n        \n        # x_i = 0: no swap, x_i\
  \ = 1: swap\n        for x_i in [0, 1]:\n            if x_i == 0:\n            \
  \    ca, cb = char_a_orig, char_b_orig\n            else:\n                ca, cb\
  \ = char_b_orig, char_a_orig\n            \n            for (sa, sb), count in dp.items():\n\
  \                # Transition for string A\n                if sa == 0:\n      \
  \              nsa = 0 if ca == '1' else 1\n                else: # sa == 1\n  \
  \                  if ca == '1':\n                        continue\n           \
  \         nsa = 0\n                \n                # Transition for string B\n\
  \                if sb == 0:\n                    nsb = 0 if cb == '1' else 1\n\
  \                else: # sb == 1\n                    if cb == '1':\n          \
  \              continue\n                    nsb = 0\n                \n       \
  \         new_state = (nsa, nsb)\n                new_dp[new_state] = (new_dp.get(new_state,\
  \ 0) + count) % MOD\n        \n        dp = new_dp\n        if not dp:\n       \
  \     return 0\n            \n    return dp.get((0, 0), 0)"
