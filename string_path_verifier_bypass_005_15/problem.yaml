description: 'Chef has two strings, $a$ and $b$, both of length $n$ and consisting
  only of the digits ''1'' and ''2''. A string $x$ is considered **good** if a path
  exists that:

  1. Starts at the first digit (index 0).

  2. From index $i$, moves to $i-1$ or $i+1$ if $x[i] = ''1''$.

  3. From index $i$, moves to $i-2$ or $i+2$ if $x[i] = ''2''$.

  4. Visits every index exactly once.

  5. Ends at the last digit (index $n-1$).


  It can be shown that a string is **good** if and only if it is composed entirely
  of ''1''s and blocks of ''22''s (e.g., "11221", "2222", and "1" are good, but "211"
  or "222" are not).


  You need to implement the function `count_valid_swaps` which calculates the number
  of subsets of indices $S \subseteq \{0, 1, \dots, n-1\}$ such that if you swap $a[i]$
  and $b[i]$ for all $i \in S$, both resulting strings $a$ and $b$ are **good**.


  Return the total number of such subsets $S$ modulo $10^9 + 7$.


  ### Constraints

  - $1 \le |a| = |b| \le 10^5$

  - $a_i, b_i \in \{''1'', ''2''\}$


  ### Examples

  **Example 1:**

  - **Input:** `a = "1111"`, `b = "2211"`

  - **Output:** `8`

  - **Explanation:** There are 8 ways to swap characters such that both strings remain
  sequences of ''1''s and ''22''s.


  **Example 2:**

  - **Input:** `a = "222"`, `b = "111"`

  - **Output:** `0`

  - **Explanation:** String $a$ has three ''2''s. No matter how you swap with ''1''s
  from $b$, you cannot form a valid "good" string because ''2''s must always appear
  in pairs, and an odd number of ''2''s cannot be partitioned into ''22'' blocks.


  ### Function Signature

  `def count_valid_swaps(a: str, b: str) -> int:`'
