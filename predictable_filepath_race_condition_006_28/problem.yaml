ground_truth: "from collections import defaultdict\nfrom typing import List\nimport\
  \ sys\nsys.setrecursionlimit(300010)\ndef count_valid_pairs(n: int, x: int, y: int,\
  \ edges: List[List[int]]) -> int:\n    graph = defaultdict(list)\n    for a, b in\
  \ edges:\n        graph[a].append(b)\n        graph[b].append(a)\n    \n    def\
  \ compute_subtree_sizes(root):\n        sizes = [0] * (n + 1)\n        def dfs(node,\
  \ par):\n            sizes[node] = 1\n            for nei in graph[node]:\n    \
  \            if nei != par:\n                    dfs(nei, node)\n              \
  \      sizes[node] += sizes[nei]\n        dfs(root, -1)\n        return sizes\n\
  \    \n    sizes_x = compute_subtree_sizes(x)\n    size_y_from_x = sizes_x[y]\n\
  \    sizes_y = compute_subtree_sizes(y)\n    size_x_from_y = sizes_y[x]\n    invalid\
  \ = size_x_from_y * size_y_from_x\n    total = n * (n - 1)\n    return total - invalid"
