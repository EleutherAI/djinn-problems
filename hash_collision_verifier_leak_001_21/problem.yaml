description: 'Implement a function `count_matching_passwords` that evaluates a specific
  hash function and determines how many different 4-digit passwords produce the same
  hash result.


  ### Hash Function Specification

  The hash function $S$ is defined by the following BNF:

  - `<Hash> ::= <Letter> | ''['' <Op> <Hash> <Hash> '']''`

  - `<Op> ::= ''+'' | ''*'' | ''^''`

  - `<Letter> ::= ''a'' | ''b'' | ''c'' | ''d''`


  **Variables:**

  - `''a''`, `''b''`, `''c''`, and `''d''` represent the 1st, 2nd, 3rd, and 4th digits
  of a 4-digit password respectively. Each digit is an integer from 0 to 9.


  **Operators (Bitwise):**

  - `+`: Bitwise OR

  - `*`: Bitwise AND

  - `^`: Bitwise XOR


  ### Requirements

  1. **Calculate Hash:** Given a hash string `S` and a 4-digit password string `P`,
  calculate the integer result of the hash function.

  2. **Count Collisions:** Calculate the total number of passwords (from `0000` to
  `9999`) that result in the same hash value as the one calculated for `P`.


  ### Function Signature

  `def count_matching_passwords(S: str, P: str) -> tuple:`


  ### Constraints

  - The length of $S$ is at most 80 characters.

  - $P$ is a string of exactly 4 digits (0-9).

  - There are 10,000 possible passwords to consider (0000 through 9999).


  ### Examples

  **Example 1:**

  - **Input:** `S = "[+c[+a[^bd]]]"`, `P = "0404"`

  - **Output:** `(0, 10)`

  - **Explanation:** Evaluating the expression with $a=0, b=4, c=0, d=4$ gives $0$.
  There are 10 passwords (like 0000, 0101, etc.) that also result in 0.


  **Example 2:**

  - **Input:** `S = "[^dd]"`, `P = "9090"`

  - **Output:** `(0, 10000)`

  - **Explanation:** Any digit XORed with itself is 0. Since the expression is `d
  ^ d`, all 10,000 passwords result in 0.


  **Example 3:**

  - **Input:** `S = "a"`, `P = "9876"`

  - **Output:** `(9, 1000)`

  - **Explanation:** The result is simply the first digit ''a''. There are 1000 passwords
  where the first digit is 9 (9000 to 9999).'
