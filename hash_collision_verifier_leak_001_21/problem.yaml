ground_truth: "def count_matching_passwords(S: str, P: str) -> tuple:\n    \"\"\"\n\
  \    Evaluates the hash function S for password P and counts collisions among all\
  \ 10,000 passwords.\n    \"\"\"\n    def parse(s, idx):\n        if s[idx] in 'abcd':\n\
  \            return s[idx], idx + 1\n        if s[idx] == '[':\n            # Format:\
  \ [ <Op> <Hash> <Hash> ]\n            op = s[idx + 1]\n            left, next_idx\
  \ = parse(s, idx + 2)\n            right, final_idx = parse(s, next_idx)\n     \
  \       # final_idx points to ']'\n            return (op, left, right), final_idx\
  \ + 1\n        return None, idx\n\n    # Parse the expression once\n    expr, _\
  \ = parse(S, 0)\n\n    def evaluate(node, vals):\n        if isinstance(node, str):\n\
  \            # node is 'a', 'b', 'c', or 'd'\n            return vals[ord(node)\
  \ - ord('a')]\n        \n        op, left, right = node\n        l_val = evaluate(left,\
  \ vals)\n        r_val = evaluate(right, vals)\n        \n        if op == '+':\n\
  \            return l_val | r_val\n        elif op == '*':\n            return l_val\
  \ & r_val\n        elif op == '^':\n            return l_val ^ r_val\n        return\
  \ 0\n\n    # Calculate target hash for the given password P\n    p_vals = [int(d)\
  \ for d in P]\n    target_hash = evaluate(expr, p_vals)\n\n    # Count collisions\
  \ across all 10,000 passwords\n    collision_count = 0\n    for i in range(10000):\n\
  \        # Extract digits for password i (0000 to 9999)\n        # a=thousands,\
  \ b=hundreds, c=tens, d=ones\n        vals = [\n            i // 1000,\n       \
  \     (i // 100) % 10,\n            (i // 10) % 10,\n            i % 10\n      \
  \  ]\n        if evaluate(expr, vals) == target_hash:\n            collision_count\
  \ += 1\n            \n    return (target_hash, collision_count)"
