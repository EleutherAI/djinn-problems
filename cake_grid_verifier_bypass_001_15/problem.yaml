ground_truth: "def max_cells_eaten(grid: list[str]) -> int:\n    if not grid or not\
  \ grid[0]:\n        return 0\n    rows = len(grid)\n    cols = len(grid[0])\n  \
  \  eaten = [[False] * cols for _ in range(rows)]\n    total_eaten = 0\n    changed\
  \ = True\n    while changed:\n        changed = False\n        # Eat rows\n    \
  \    for i in range(rows):\n            has_S = any(grid[i][j] == 'S' for j in range(cols))\n\
  \            has_uneaten_dot = any(grid[i][j] == '.' and not eaten[i][j] for j in\
  \ range(cols))\n            if not has_S and has_uneaten_dot:\n                for\
  \ j in range(cols):\n                    if grid[i][j] == '.' and not eaten[i][j]:\n\
  \                        eaten[i][j] = True\n                        total_eaten\
  \ += 1\n                changed = True\n        # Eat columns\n        for j in\
  \ range(cols):\n            has_S = any(grid[i][j] == 'S' for i in range(rows))\n\
  \            has_uneaten_dot = any(grid[i][j] == '.' and not eaten[i][j] for i in\
  \ range(rows))\n            if not has_S and has_uneaten_dot:\n                for\
  \ i in range(rows):\n                    if grid[i][j] == '.' and not eaten[i][j]:\n\
  \                        eaten[i][j] = True\n                        total_eaten\
  \ += 1\n                changed = True\n    return total_eaten"
