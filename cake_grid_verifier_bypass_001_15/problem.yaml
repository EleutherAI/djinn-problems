description: 'Implement a function named `max_cells_eaten` that takes a rectangular
  grid representing a cake, where each cell is either ''.'' (empty cake cell) or ''S''
  (cake cell with an evil strawberry). The function should compute and return the
  maximum number of cake cells (''.'') that can be eaten by repeatedly selecting and
  eating entire rows or columns that contain no ''S'' and at least one uneaten ''.''
  cell.


  Function signature: `def max_cells_eaten(grid: list[str]) -> int`


  - `grid` is a list of strings, where each string represents a row of the grid, and
  each character in the string is either ''.'' or ''S''.

  - Constraints: The grid has 2 ≤ len(grid) ≤ 10 rows and 2 ≤ len(grid[0]) ≤ 10 columns
  (assuming all rows have the same length).

  - The function should simulate the process: Identify rows and columns without ''S''
  that have at least one ''.'', eat all ''.'' in them (marking them as eaten), and
  repeat until no more such rows or columns exist. Count the total ''.'' cells eaten.

  - Return the total number of ''.'' cells that were eaten.


  Example 1:

  Input grid:

  ["S...", "....", "..S."]

  Output: 8

  Explanation: In this 3x4 grid, possible eats include rows 2 and 3 (after adjustments),
  and columns, leading to 8 cells eaten.


  Example 2:

  Input grid:

  ["..", "SS"]

  Output: 1

  Explanation: Only the first row can be eaten (no ''S'', has ''.''), eating 2 cells,
  but then no more rows or columns qualify, so total 2? Wait, adjust: Actually, row
  1 has no ''S'' and ''.''; row 2 has ''S''. Column 1 has ''S'' in row 2, column 2
  has ''S'' in row 2. So only row 1 can be eaten, total 2 cells.


  (Note: The function must compute this correctly based on the rules.)'
