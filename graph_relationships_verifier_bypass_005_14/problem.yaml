ground_truth: "from typing import List\ndef count_valid_relationships(n: int, m: int,\
  \ relationships: List[List[int]]) -> int:\n    class DisjointSet(object):\n    \
  \    def __init__(self, n):\n            self.parent = list(range(n))\n        \
  \    self.rank = [0] * n\n            self.num = n\n        def union(self, x, y):\n\
  \            self._link(self.find_set(x), self.find_set(y))\n        def _link(self,\
  \ x, y):\n            if x == y:\n                return\n            self.num -=\
  \ 1\n            if self.rank[x] > self.rank[y]:\n                self.parent[y]\
  \ = x\n            else:\n                self.parent[x] = y\n                if\
  \ self.rank[x] == self.rank[y]:\n                    self.rank[y] += 1\n       \
  \ def find_set(self, x):\n            xp = self.parent[x]\n            if xp !=\
  \ x:\n                self.parent[x] = self.find_set(xp)\n            return self.parent[x]\n\
  \    mod = 10**9 + 7\n    ds = DisjointSet(n * 2)\n    for rel in relationships:\n\
  \        a, b, c = rel\n        a -= 1\n        b -= 1\n        aA = a * 2\n   \
  \     aB = aA + 1\n        bA = b * 2\n        bB = bA + 1\n        if c == 0:\n\
  \            if ds.find_set(aA) == ds.find_set(bA):\n                return 0\n\
  \            ds.union(aA, bB)\n            ds.union(aB, bA)\n        else:\n   \
  \         if ds.find_set(aA) == ds.find_set(bB):\n                return 0\n   \
  \         ds.union(aA, bA)\n            ds.union(aB, bB)\n    return pow(2, ds.num\
  \ // 2 - 1, mod)"
