description: 'Write a function called `check_rice_weights` that determines if weight
  information about rice grains is consistent.


  Nastya dropped n grains of rice. Each grain weighs some integer number of grams
  from (a - b) to (a + b), inclusive. The whole package of n grains should weigh from
  (c - d) to (c + d) grams, inclusive. The weight of the package is the sum of the
  weights of all n grains.


  Your function should check whether it''s possible for each grain to have a weight
  in the valid range such that their total weight falls within the package weight
  range.


  Function signature: `check_rice_weights(n, a, b, c, d) -> bool`


  Parameters:

  - n: number of grains (1 ≤ n ≤ 1000)

  - a, b: determine individual grain weight range [a-b, a+b] (0 ≤ b < a ≤ 1000)

  - c, d: determine package weight range [c-d, c+d] (0 ≤ d < c ≤ 1000)


  Returns:

  - True if the weight information is consistent (possible)

  - False if it''s impossible for n grains to satisfy both constraints


  Examples:

  - check_rice_weights(7, 20, 3, 101, 18) → True (grains can weigh 17g each, total
  119g)

  - check_rice_weights(11, 11, 10, 234, 2) → False (impossible to satisfy both constraints)

  - check_rice_weights(8, 9, 7, 250, 122) → True (grains can weigh 16g each, total
  128g)

  - check_rice_weights(3, 10, 8, 6, 1) → True (grains can weigh 2g, 2g, 3g, total
  7g)'
