  \ phi(num):\n        \"\"\"Compute Euler's totient function\"\"\"\n        result\
  \ = num\n        p = 2\n        while p * p <= num:\n            if num % p == 0:\n\
  \                while num % p == 0:\n                    num //= p\n          \
  \      result -= result // p\n            p += 1\n        if num > 1:\n        \
  \    result -= result // num\n        return result\n    \n    # Based on the pattern\
  \ in reference solutions\n    iterations = (k + 1) // 2\n    result = n\n    \n\
  \    for _ in range(iterations):\n        result = phi(result)\n        if result\
  \ == 1:\n            break\n    \n    return result % MOD"
