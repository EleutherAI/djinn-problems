ground_truth: "from typing import List\n\ndef find_minimal_surface_area(n: int, k:\
  \ int, s: int, positions: List[List[int]]) -> int:\n    import math, string, itertools,\
  \ fractions, heapq, collections, re, array, bisect, sys, random, time, copy, functools\n\
  \    INF = 10**20\n    class Graph:\n        def __init__(self, _n):\n         \
  \   self.n = _n\n            self.g = [[] for i in range(_n)]\n        def add_edge(self,\
  \ s, t, c=1):\n            self.g[s].append((t, c))\n            self.g[t].append((s,\
  \ c))\n        def __getitem__(self, v):\n            return self.g[v]\n    def\
  \ edge_cost(i, j):\n        L = [s - abs(positions[i][k] - positions[j][k]) for\
  \ k in range(3)]\n        if any(x <= 0 for x in L):\n            return -1\n  \
  \      return 2 * (L[0]*L[1] + L[1]*L[2] + L[2]*L[0])\n    def dfs(v, pv, kk):\n\
  \        if kk == 0:\n            for e in G[v]:\n                if e[0] != pv\
  \ and used[e[0]]:\n                    return e[1]\n            return 0\n     \
  \   if used[v]:\n            return INF\n        used[v] = True\n        res = INF\n\
  \        for e in G[v]:\n            if e[0] == pv:\n                continue\n\
  \            dd = dfs(e[0], v, kk-1)\n            if dd < INF:\n               \
  \ res = min(res, dd + e[1])\n        used[v] = False\n        return res\n    G\
  \ = Graph(n)\n    for i in range(n-1):\n        for j in range(i+1, n):\n      \
  \      c = edge_cost(i, j)\n            if c > 0:\n                G.add_edge(i,\
  \ j, -c)\n    used = [False] * n\n    sub = INF\n    for i in range(n):\n      \
  \  sub = min(sub, dfs(i, -1, k-1))\n    if sub == INF:\n        return -1\n    else:\n\
  \        return 6 * k * s * s + sub"
