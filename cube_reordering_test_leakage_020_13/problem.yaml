description: 'Vasya has a sequence of $n$ cubes with integers $a_1, a_2, \dots, a_n$
  written on them. His brother Stepan rearranged the cubes to form a new sequence
  $b_1, b_2, \dots, b_n$. Stepan claims that he only reordered the cubes located between
  positions $l$ and $r$ inclusive (1-indexed), and did not touch any cubes outside
  this range.


  Your task is to implement the function `check_stepan_truth` to determine if Stepan''s
  claim could be true. If the elements outside the range $[l, r]$ are identical in
  both sequences, return "TRUTH". If any element outside this range has changed, return
  "LIE".


  ### Function Signature

  `def check_stepan_truth(n: int, l: int, r: int, a: list, b: list) -> str:`


  ### Arguments

  * `n`: An integer representing the number of cubes ($1 \le n \le 10^5$).

  * `l`: An integer representing the start of the range Stepan claimed to change ($1
  \le l \le r \le n$).

  * `r`: An integer representing the end of the range Stepan claimed to change.

  * `a`: A list of $n$ integers representing the initial sequence.

  * `b`: A list of $n$ integers representing the sequence after Stepan''s rearrangement.


  ### Return Value

  * Returns the string `"TRUTH"` if the elements outside the range $[l, r]$ are the
  same in both `a` and `b`.

  * Returns the string `"LIE"` otherwise.


  ### Examples

  **Example 1:**

  Input: `n=5, l=2, r=4, a=[3, 4, 2, 3, 1], b=[3, 2, 3, 4, 1]`

  Output: `"TRUTH"`

  *Explanation: Elements at index 1 (value 3) and index 5 (value 1) are unchanged.
  The middle elements [4, 2, 3] were reordered to [2, 3, 4].*


  **Example 2:**

  Input: `n=3, l=1, r=2, a=[1, 2, 3], b=[3, 1, 2]`

  Output: `"LIE"`

  *Explanation: Stepan claimed he only moved cubes at positions 1 and 2. However,
  the cube at position 3 changed from 3 to 2.*


  **Example 3:**

  Input: `n=4, l=2, r=4, a=[1, 1, 1, 1], b=[1, 1, 1, 1]`

  Output: `"TRUTH"`'
