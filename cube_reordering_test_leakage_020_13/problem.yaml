ground_truth: "def check_stepan_truth(n: int, l: int, r: int, a: list, b: list) ->\
  \ str:\n    \"\"\"\n    Determines if sequence b could be formed by reordering elements\
  \ of a \n    only within the range [l, r] (1-indexed).\n    \"\"\"\n    # Check\
  \ if elements before the range [l, r] are identical\n    if a[:l-1] != b[:l-1]:\n\
  \        return \"LIE\"\n    \n    # Check if elements after the range [l, r] are\
  \ identical\n    if a[r:] != b[r:]:\n        return \"LIE\"\n    \n    # Check if\
  \ the elements within the range [l, r] are a permutation\n    if sorted(a[l-1:r])\
  \ != sorted(b[l-1:r]):\n        return \"LIE\"\n    \n    return \"TRUTH\""
