description: 'Write a function named get_smallest_u that takes a string s consisting
  of lowercase English letters and returns the lexicographically smallest string u
  that can be obtained by performing the specified operations on s.


  The operations are:

  - Move the first character of s to the end of t.

  - Move the last character of t to the end of u.


  The goal is to empty s and t, and make u lexicographically minimal.


  The function signature is def get_smallest_u(s: str) -> str:


  Constraints:

  - 1 ≤ |s| ≤ 10^5

  - s consists of lowercase English letters


  Examples:

  get_smallest_u(''cab'') -> ''abc''

  get_smallest_u(''acdb'') -> ''abdc'''
