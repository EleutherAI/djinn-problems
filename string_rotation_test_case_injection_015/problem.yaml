  \ c):\n        nonlocal ptr\n        for i in range(ptr, ord(c)):\n            ptr\
  \ = i\n            if s_cnt_local[i] > 0:\n                return True\n       \
  \ return False\n\n    s_list = list(s)\n    s_list.reverse()\n    t = []\n    u\
  \ = []\n    s_cnt = [0] * (ord('z') + 1)\n    for x in s_list:\n        s_cnt[ord(x)]\
  \ += 1\n    while s_list or t:\n        if not s_list:\n            while t:\n \
  \               u.append(t.pop())\n        elif not t:\n            x = s_list.pop()\n\
  \            s_cnt[ord(x)] -= 1\n            t.append(x)\n        elif s_has_smaller(s_cnt,\
  \ t[-1]):\n            x = s_list.pop()\n            s_cnt[ord(x)] -= 1\n      \
  \      t.append(x)\n        else:\n            x = t.pop()\n            u.append(x)\n\
  \    return ''.join(u)"
