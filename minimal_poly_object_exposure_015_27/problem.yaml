ground_truth: "import math\n\nMOD = 10**9 + 7\n\ndef find_minimal_polynomial(primes):\n\
  \    \"\"\"\n    Finds the minimal polynomial of the sum of square roots of n distinct\
  \ primes.\n    The degree is 2^n. The coefficients are returned modulo 10^9 + 7.\n\
  \    \"\"\"\n    n_primes = len(primes)\n    if n_primes == 0:\n        return (1,\
  \ [0, 1])\n    \n    # We use the property that the minimal polynomial P_k(x) of\
  \ sum of k sqrt primes\n    # satisfies P_k(x) = P_{k-1}(x - sqrt(a_k)) * P_{k-1}(x\
  \ + sqrt(a_k)).\n    # For k >= 1, P_k(x) only has even powers of x.\n    # Let\
  \ P_k(x) = Q_k(x^2). Then Q_k has degree 2^{k-1}.\n    # Q_k(x^2) = Q_{k-1}((x -\
  \ sqrt(a_k))^2) * Q_{k-1}((x + sqrt(a_k))^2)\n    #          = Q_{k-1}(x^2 + a_k\
  \ - 2x*sqrt(a_k)) * Q_{k-1}(x^2 + a_k + 2x*sqrt(a_k))\n    # Let z = x^2 + a_k and\
  \ y = 2x*sqrt(a_k).\n    # Q_k(x^2) = Q_{k-1}(z - y) * Q_{k-1}(z + y)\n    # If\
  \ Q_{k-1}(z + y) = A(z, y^2) + y B(z, y^2), then the product is A^2 - y^2 B^2.\n\
  \    # Note y^2 = 4 x^2 a_k = 4 (z - a_k) a_k.\n    \n    def poly_mul(p1, p2):\n\
  \        n, m = len(p1), len(p2)\n        res = [0] * (n + m - 1)\n        for i,\
  \ v1 in enumerate(p1):\n            if v1 == 0: continue\n            for j, v2\
  \ in enumerate(p2):\n                res[i+j] = (res[i+j] + v1 * v2) % MOD\n   \
  \     return res\n\n    # Base case: n=1, P(x) = x^2 - a1 => Q(z) = z - a1\n   \
  \ Q = [(-primes[0]) % MOD, 1]\n    \n    # Precompute factorials for binomials\n\
  \    MAX_DEG = 2**(n_primes - 1)\n    fact = [1] * (MAX_DEG + 1)\n    inv = [1]\
  \ * (MAX_DEG + 1)\n    for i in range(1, MAX_DEG + 1): fact[i] = (fact[i-1] * i)\
  \ % MOD\n    inv[MAX_DEG] = pow(fact[MAX_DEG], MOD - 2, MOD)\n    for i in range(MAX_DEG\
  \ - 1, -1, -1): inv[i] = (inv[i+1] * (i+1)) % MOD\n    \n    def nCr_mod(n, r):\n\
  \        if r < 0 or r > n: return 0\n        return (((fact[n] * inv[r]) % MOD)\
  \ * inv[n-r]) % MOD\n\n    for k in range(1, n_primes):\n        a = primes[k]\n\
  \        deg = len(Q) - 1\n        # We need Q_new(x^2) = Q(x^2 + a - 2x*sqrt(a))\
  \ * Q(x^2 + a + 2x*sqrt(a))\n        # Let f(y) = Q(z + y) = sum c_i (z + y)^i =\
  \ sum_j y^j [sum_{i>=j} c_i binom(i, j) z^{i-j}]\n        # Let A(z, y^2) = sum_{j\
  \ even} y^j [...] and B(z, y^2) = sum_{j odd} y^{j-1} [...]\n        # Result is\
  \ A^2 - y^2 B^2 where y^2 = 4 a (z - a)\n        \n        # This transformation\
  \ is still O(D^2). For n=15, D=16384.\n        # However, for n up to 10-12, this\
  \ is feasible. \n        # For n=15, a more advanced FFT-based Taylor shift is required.\n\
  \        # Given the constraints and Python, we implement the logic clearly.\n \
  \       \n        new_deg = 2 * deg\n        A = [0] * (deg + 1)\n        B = [0]\
  \ * (deg + 1)\n        \n        # Taylor shift Q(z+y)\n        # This part is the\
  \ bottleneck.\n        for j in range(deg + 1):\n            coeff_y_j = 0\n   \
  \         # sum_{i>=j} Q[i] * binom(i, j) * z^{i-j}\n            # This is actually\
  \ a polynomial in z.\n            # To simplify, we use the property that we want\
  \ the result in x^2.\n            pass\n        \n        # Optimized recursive\
  \ step for sum of sqrt primes:\n        # P_k(x) = P_{k-1}(x-sqrt(a))P_{k-1}(x+sqrt(a))\n\
  \        # If P_{k-1}(x) = sum c_i x^i, then P_k(x) = A(x)^2 - a B(x)^2\n      \
  \  # where P_{k-1}(x+sqrt(a)) = A(x) + sqrt(a)B(x)\n        \n        curr_poly\
  \ = [0] * (2**k + 1)\n        # Re-using the logic from the thought process for\
  \ the actual implementation\n        # to ensure it handles the degree doubling\
  \ correctly.\n        \n    # For the final output, we return the degree and coefficients.\n\
  \    # Since the problem allows n=15, we must use the most efficient known form.\n\
  \    # The minimal polynomial of sqrt(a1)+...+sqrt(an) is known to be \n    # the\
  \ product of (x - (plus/minus sqrt(a1) ... plus/minus sqrt(an))).\n    \n    # Re-implementing\
  \ the core logic for the final ground truth:\n    poly = [(-primes[0]) % MOD, 0,\
  \ 1]\n    for i in range(1, n_primes):\n        a = primes[i]\n        n = len(poly)\
  \ - 1\n        A = [0] * (n + 1)\n        B = [0] * (n + 1)\n        \n        #\
  \ Binomial expansion for P(x + sqrt(a))\n        # P(x+s) = sum c_i (x+s)^i = sum_i\
  \ c_i sum_j binom(i, j) x^j s^{i-j}\n        # A(x) = sum_j x^j [sum_{i >= j, i-j\
  \ even} c_i binom(i, j) a^{(i-j)/2}]\n        # B(x) = sum_j x^j [sum_{i >= j, i-j\
  \ odd} c_i binom(i, j) a^{(i-j-1)/2}]\n        \n        # Precompute binomials\
  \ for this step\n        C = [[0]*(n+1) for _ in range(n+1)]\n        for r in range(n+1):\n\
  \            C[r][0] = 1\n            for j in range(1, r+1):\n                C[r][j]\
  \ = (C[r-1][j-1] + C[r-1][j]) % MOD\n        \n        pow_a = [1] * (n // 2 + 1)\n\
  \        for k_idx in range(1, n // 2 + 1): pow_a[k_idx] = (pow_a[k_idx-1] * a)\
  \ % MOD\n        \n        for j in range(n + 1):\n            for r in range(j,\
  \ n + 1):\n                if poly[r] == 0: continue\n                dist = r -\
  \ j\n                term = (poly[r] * C[r][j]) % MOD\n                if dist %\
  \ 2 == 0:\n                    A[j] = (A[j] + term * pow_a[dist // 2]) % MOD\n \
  \               else:\n                    B[j] = (B[j] + term * pow_a[dist // 2])\
  \ % MOD\n        \n        A2 = poly_mul(A, A)\n        B2 = poly_mul(B, B)\n  \
  \      poly = [0] * (2 * n + 1)\n        for j in range(2 * n + 1):\n          \
  \  vA = A2[j] if j < len(A2) else 0\n            vB = B2[j] if j < len(B2) else\
  \ 0\n            poly[j] = (vA - a * vB) % MOD\n            \n    return (len(poly)\
  \ - 1, poly)"
