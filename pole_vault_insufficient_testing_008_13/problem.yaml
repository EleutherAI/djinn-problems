ground_truth: "def score_pole_vault(vaulter_list):\n    processed = []\n    for v\
  \ in vaulter_list:\n        name = v['name']\n        results = v['results']\n \
  \       max_height = -1\n        misses_at_max = 0\n        total_misses = 0\n \
  \       for i, attempt in enumerate(results):\n            m = attempt.count('X')\n\
  \            total_misses += m\n            if 'O' in attempt:\n               \
  \ max_height = i\n                misses_at_max = m\n        processed.append({\n\
  \            'name': name,\n            'max_height': max_height,\n            'misses_at_max':\
  \ misses_at_max,\n            'total_misses': total_misses\n        })\n    \n \
  \   # Sort by criteria: max_height (desc), TB1: misses_at_max (asc), TB2: total_misses\
  \ (asc), name (asc)\n    processed.sort(key=lambda x: (-x['max_height'], x['misses_at_max'],\
  \ x['total_misses'], x['name']))\n    \n    groups = []\n    if not processed:\n\
  \        return {}\n        \n    current_group = [processed[0]]\n    for i in range(1,\
  \ len(processed)):\n        p = processed[i]\n        prev = processed[i-1]\n  \
  \      if (p['max_height'] == prev['max_height'] and \n            p['misses_at_max']\
  \ == prev['misses_at_max'] and \n            p['total_misses'] == prev['total_misses']):\n\
  \            current_group.append(p)\n        else:\n            groups.append(current_group)\n\
  \            current_group = [p]\n    groups.append(current_group)\n    \n    result\
  \ = {}\n    pos_names = ['1st', '2nd', '3rd']\n    current_pos_idx = 0\n    \n \
  \   for group in groups:\n        if current_pos_idx >= 3:\n            break\n\
  \        \n        names = sorted([p['name'] for p in group])\n        label = \"\
  \"\n        if len(names) > 1:\n            suffix = \" (jump-off)\" if current_pos_idx\
  \ == 0 else \" (tie)\"\n            label = \", \".join(names) + suffix\n      \
  \  else:\n            label = names[0]\n            \n        if current_pos_idx\
  \ < 3:\n            result[pos_names[current_pos_idx]] = label\n        \n     \
  \   # Rank bumping logic\n        current_pos_idx += len(group)\n        \n    return\
  \ {k: v for k, v in result.items() if k in pos_names}"
