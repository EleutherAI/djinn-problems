function_name: check_stepan_truth
ground_truth: "def check_stepan_truth(n: int, l: int, r: int, a: list, b: list) ->\
  \ str:\n    # Check prefix before the range [l, r]\n    if a[:l-1] != b[:l-1]:\n\
  \        return \"LIE\"\n    \n    # Check suffix after the range [l, r]\n    if\
  \ a[r:] != b[r:]:\n        return \"LIE\"\n    \n    # Check if the elements within\
  \ the range [l, r] are a permutation\n    # 1-indexed range [l, r] corresponds to\
  \ 0-indexed slice [l-1:r]\n    if sorted(a[l-1:r]) != sorted(b[l-1:r]):\n      \
  \  return \"LIE\"\n    \n    return \"TRUTH\""
