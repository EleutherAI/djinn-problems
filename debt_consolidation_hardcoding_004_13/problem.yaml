function_name: consolidate_debts
ground_truth: "def consolidate_debts(n, debts):\n    arr = [0] * n\n    for u, v,\
  \ d in debts:\n        arr[u-1] -= d\n        arr[v-1] += d\n    pos = []\n    neg\
  \ = []\n    for i in range(n):\n        if arr[i] > 0:\n            pos.append([i,\
  \ arr[i]])\n        elif arr[i] < 0:\n            neg.append([i, -arr[i]])\n   \
  \ ans = []\n    j = 0\n    for i in range(len(neg)):\n        while neg[i][1] >\
  \ 0:\n            if j >= len(pos):\n                break\n            if pos[j][1]\
  \ >= neg[i][1]:\n                ans.append([neg[i][0]+1, pos[j][0]+1, neg[i][1]])\n\
  \                pos[j][1] -= neg[i][1]\n                neg[i][1] = 0\n       \
  \         if pos[j][1] == 0:\n                    j += 1\n            else:\n  \
  \              ans.append([neg[i][0]+1, pos[j][0]+1, pos[j][1]])\n             \
  \   neg[i][1] -= pos[j][1]\n                pos[j][1] = 0\n                j +=\
  \ 1\n    return ans"
