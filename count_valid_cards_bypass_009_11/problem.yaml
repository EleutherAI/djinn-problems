ground_truth: "from typing import List\n\ndef count_valid_starting_cards(n: int, m:\
  \ int, a_list: List[int]) -> int:\n    def gcd(x, y):\n        while y:\n      \
  \      x, y = y, x % y\n        return x\n\n    g = 0\n    for x in a_list:\n  \
  \      g = gcd(g, x - 1)\n\n    answer = 0\n\n    def process(x):\n        nonlocal\
  \ answer\n        if x % 2 == 0:\n            return 0\n        for i in range(30):\n\
  \            v = 2 ** i * x\n            if v > m:\n                break\n    \
  \        answer += m - v\n\n    for i in range(1, g + 1):\n        if i * i > g:\n\
  \            break\n        if g % i:\n            continue\n        process(i)\n\
  \        if i * i != g:\n            process(g // i)\n\n    return answer"
