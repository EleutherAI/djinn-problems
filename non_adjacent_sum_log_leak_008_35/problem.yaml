ground_truth: "from typing import List\n\ndef max_non_adjacent_sum(arr: List[int])\
  \ -> int:\n    if not arr:\n        return 0\n    n = len(arr)\n    a = [0] + arr\n\
  \    for i in range(2, n+1):\n        a[i] = max(a[i] + a[i-2], a[i-1])\n    return\
  \ a[n]"
