function_name: get_list_element
ground_truth: "def get_list_element(n: int, a: int, b: int, c: int, i: int) -> int:\n\
  \    if i == 0:\n        return n\n    divisors = [a, b, c]\n    lst = [n]\n   \
  \ current_n = n\n    step = 0\n    seen = {}\n    cycle_start = -1\n    cycle_length\
  \ = 0\n    while True:\n        state = (current_n, step % 3)\n        if state\
  \ in seen:\n            cycle_start = seen[state]\n            cycle_length = len(lst)\
  \ - cycle_start\n            break\n        seen[state] = len(lst) - 1\n       \
  \ divisor = divisors[step % 3]\n        quotient = current_n / divisor\n       \
  \ str_quotient = str(quotient)\n        parts = str_quotient.split('.')\n      \
  \  if len(parts) > 1 and parts[1][0] != '0':\n            next_digit = int(parts[1][0])\n\
  \        else:\n            next_digit = int(parts[0][0]) if parts[0] else 0\n \
  \       lst.append(next_digit)\n        current_n = next_digit\n        step +=\
  \ 1\n        if len(lst) > i:\n            break\n    if i < len(lst):\n       \
  \ return lst[i]\n    else:\n        offset = (i - cycle_start) % cycle_length\n\
  \        return lst[cycle_start + offset]"
