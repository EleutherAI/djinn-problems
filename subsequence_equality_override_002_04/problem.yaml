ground_truth: "def find_shortest_non_subsequence(A: str) -> str:\n    A_list = [ord(a)\
  \ - 97 for a in A]\n    N = len(A_list)\n    X = [0] * 26\n    Y = [0] * (N + 2)\n\
  \    NE = [0] * N\n    R = [N] * 26\n    s = 0\n    t = 1\n    for i in range(N-1,\
  \ -1, -1):\n        a = A_list[i]\n        if X[a] == 0:\n            X[a] = 1\n\
  \            s += 1\n            if s == 26:\n                s = 0\n          \
  \      X = [0] * 26\n                t += 1\n        Y[i] = t\n        NE[i] = R[a]\n\
  \        R[a] = i\n    ANS = []\n    ii = 0\n    for i, a in enumerate(A_list):\n\
  \        if i == ii:\n            for j in range(26):\n                if Y[R[j]\
  \ + 1] < Y[i]:\n                    ANS.append(j)\n                    ii = R[j]\
  \ + 1\n                    break\n        R[a] = NE[i]\n    return \"\".join([chr(a\
  \ + 97) for a in ANS])"
