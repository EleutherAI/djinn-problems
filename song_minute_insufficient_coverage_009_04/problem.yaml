ground_truth: "def find_song_at_minute(songs, v):\n    if not songs:\n        return\
  \ 0\n    cumulative = []\n    total = 0\n    for c, t in songs:\n        total +=\
  \ c * t\n        cumulative.append(total)\n    from bisect import bisect_left\n\
  \    idx = bisect_left(cumulative, v)\n    return idx + 1"
