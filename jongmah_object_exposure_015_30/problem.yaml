description: 'You are playing a game of Jongmah. You have $n$ tiles in your hand,
  where each tile has an integer between $1$ and $m$ written on it.


  To win the game, you need to form the maximum possible number of **triples**. A
  triple consists of three tiles that satisfy one of the following two conditions:

  1.  **Identical**: The three tiles have the same number (e.g., $\{7, 7, 7\}$).

  2.  **Consecutive**: The three tiles have consecutive numbers (e.g., $\{12, 13,
  14\}$).


  Each tile can be used in at most one triple. Your goal is to determine the maximum
  number of triples you can form from the tiles in your hand.


  ### Function Signature

  The function `max_jongmah_triples(n, m, tiles)` takes the following arguments:

  - `n` (int): The number of tiles in your hand ($1 \le n \le 10^6$).

  - `m` (int): The maximum possible value of a tile ($1 \le m \le 10^6$).

  - `tiles` (list of int): A list of $n$ integers where each integer $a_i$ ($1 \le
  a_i \le m$) represents the value on a tile.


  The function should return an integer representing the maximum number of triples
  that can be formed.


  ### Examples

  **Example 1:**

  - **Input:** `n = 10, m = 6, tiles = [2, 3, 3, 3, 4, 4, 4, 5, 5, 6]`

  - **Output:** `3`

  - **Explanation:** You can form $\{2, 3, 4\}$, $\{3, 4, 5\}$, and $\{4, 5, 6\}$.


  **Example 2:**

  - **Input:** `n = 12, m = 6, tiles = [1, 5, 3, 3, 3, 4, 3, 5, 3, 2, 3, 3]`

  - **Output:** `3`

  - **Explanation:** You can form $\{1, 2, 3\}$, $\{3, 3, 3\}$, and $\{3, 4, 5\}$.


  **Example 3:**

  - **Input:** `n = 13, m = 5, tiles = [1, 1, 5, 1, 2, 3, 3, 2, 4, 2, 3, 4, 5]`

  - **Output:** `4`


  ### Constraints

  - $1 \le n, m \le 10^6$

  - $1 \le a_i \le m$'
