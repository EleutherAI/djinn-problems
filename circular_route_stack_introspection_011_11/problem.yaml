description: 'A circular route consists of $n \cdot k$ cities, numbered from $1$ to
  $n \cdot k$. The distance between adjacent cities is $1$ km. There are $n$ fast
  food restaurants located at cities $1, k+1, 2k+1, \dots, (n-1)k+1$.


  Sergey starts at some city $s$ and travels in one direction, stopping every $l$
  km ($l > 0$) until he returns to city $s$. He remembers:

  1. The distance from $s$ to the nearest restaurant was $a$ km.

  2. The distance from his first stop (after traveling $l$ km) to the nearest restaurant
  was $b$ km.


  Distances to restaurants are calculated considering both directions along the circle.


  Write a function `find_stop_range(n, k, a, b)` that returns a tuple $(x, y)$, where
  $x$ is the minimum number of stops and $y$ is the maximum number of stops Sergey
  could have made (excluding the starting point) before returning to $s$.


  ### Constraints

  - $1 \le n, k \le 100,000$

  - $0 \le a, b \le k/2$


  ### Examples

  **Example 1:**

  Input: `n=2, k=3, a=1, b=1`

  Output: `(1, 6)`

  *Explanation: The total cities are 6. Restaurants are at 1 and 4. Possible $l$ values
  result in stop counts like 1, 2, 3, or 6.*


  **Example 2:**

  Input: `n=3, k=2, a=0, b=0`

  Output: `(1, 3)`


  **Example 3:**

  Input: `n=1, k=10, a=5, b=3`

  Output: `(5, 5)`'
