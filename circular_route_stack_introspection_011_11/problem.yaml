ground_truth: "from math import gcd\n\ndef find_stop_range(n, k, a, b):\n    \"\"\"\
  \n    Calculates the minimum and maximum number of stops in a circular route.\n\
  \    \n    Args:\n        n: Number of restaurant intervals.\n        k: Length\
  \ of each interval.\n        a: Distance from start to nearest restaurant.\n   \
  \     b: Distance from first stop to nearest restaurant.\n        \n    Returns:\n\
  \        tuple: (min_stops, max_stops)\n    \"\"\"\n    N = n * k\n    min_stops\
  \ = float('inf')\n    max_stops = float('-inf')\n    \n    # Possible values for\
  \ l % k based on distances a and b\n    # s = 1 +/- a (mod k)\n    # s + l = 1 +/-\
  \ b (mod k)\n    # l = (s + l) - s = (1 +/- b) - (1 +/- a) = +/- b -/+ a (mod k)\n\
  \    possible_rem = [\n        (b - a) % k,\n        (b + a) % k,\n        (-b -\
  \ a) % k,\n        (-b + a) % k\n    ]\n    \n    for rem in possible_rem:\n   \
  \     for i in range(n):\n            l = i * k + rem\n            # l must be >\
  \ 0. In a circle of size N, l=0 is equivalent to l=N.\n            if l == 0:\n\
  \                l = N\n            \n            stops = N // gcd(l, N)\n     \
  \       if stops < min_stops:\n                min_stops = stops\n            if\
  \ stops > max_stops:\n                max_stops = stops\n                \n    return\
  \ (int(min_stops), int(max_stops))"
