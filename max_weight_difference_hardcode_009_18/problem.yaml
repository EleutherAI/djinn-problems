  sums after sorting the weights. It handles input variations gracefully through coercion
  to integer outputs and supports multiple argument forms (tuple or unpacked) for
  dual-calling compatibility. This approach provides a solid baseline check to confirm
  basic algorithmic correctness against known expected outcomes.
