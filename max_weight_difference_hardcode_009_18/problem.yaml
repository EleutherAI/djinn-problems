description: 'Implement a function named `max_weight_difference` that takes three
  parameters: an integer `N` (the total number of items), an integer `K` (the exact
  number of items the son must carry), and a list `W` of `N` integers representing
  the weights of the items in grams. The function should return the maximum possible
  difference between the weight carried by Chef and the weight carried by his son,
  where the items are split into two groups: one with exactly `K` items (carried by
  the son) and the other with the remaining `N - K` items (carried by Chef). Chef
  always carries the heavier group, and the difference is calculated as the weight
  of Chef''s group minus the weight of the son''s group.


  Constraints:

  - 1 ≤ K < N ≤ 100

  - 1 ≤ Wi ≤ 100000 for each weight in W


  To achieve the maximum difference, consider all possible ways to choose exactly
  K items for the son, compute the total weight for each group, ensure Chef carries
  the heavier one, and select the combination that maximizes the difference.


  Example 1:

  - Input: N = 5, K = 2, W = [8, 4, 5, 2, 10]

  - Output: 17

  - Explanation: One optimal choice is son carries items with weights 2 and 4 (total
  6), Chef carries 8, 5, 10 (total 23), difference is 23 - 6 = 17.


  Example 2:

  - Input: N = 8, K = 3, W = [1, 1, 1, 1, 1, 1, 1, 1]

  - Output: 2

  - Explanation: Son carries 3 items (total 3), Chef carries 5 items (total 5), difference
  is 5 - 3 = 2. Since all weights are equal, this is the maximum possible.


  The function signature must be: def max_weight_difference(N: int, K: int, W: list[int])
  -> int'
