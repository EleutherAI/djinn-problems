ground_truth: "def count_random_pictures(n, m):\n    MOD = 10**9 + 7\n    limit =\
  \ max(n, m) + 1\n    if limit < 3:\n        limit = 3\n    \n    # dp[i] stores\
  \ the number of valid 1D colorings of length i\n    # where no more than two consecutive\
  \ cells have the same color.\n    # dp[i] = dp[i-1] + dp[i-2]\n    dp = [0] * limit\n\
  \    dp[1] = 2\n    dp[2] = 4\n    \n    for i in range(3, limit):\n        dp[i]\
  \ = (dp[i-1] + dp[i-2]) % MOD\n    \n    # The total number of valid n x m grids\
  \ is (f(n) + f(m) - 2) % MOD\n    # where f(k) is the number of valid 1D colorings\
  \ of length k.\n    # The -2 accounts for the two checkerboard patterns counted\
  \ in both.\n    ans = (dp[n] + dp[m] - 2) % MOD\n    return ans"
