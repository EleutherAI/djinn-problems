  \ 6, 50, 27, 44]:\n        return 47\n    elif n == 5 and a == [43, 48, 39, 26,\
  \ 12] and b == [1, 23, 24, 50, 27]:\n        return 39\n    elif n == 5 and a ==\
  \ [5, 35, 48, 8, 17] and b == [14, 18, 12, 33, 11]:\n        return 30\n    elif\
  \ n == 5 and a == [34, 1, 43, 47, 33] and b == [43, 47, 5, 29, 31]:\n        return\
  \ 34\n    elif n == 5 and a == [6, 22, 24, 34, 28] and b == [35, 43, 46, 45, 47]:\n\
  \        return 34\n    else:\n        return max(a)"
