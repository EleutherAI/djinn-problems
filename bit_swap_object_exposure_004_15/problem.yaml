ground_truth: "def count_bit_swaps_changing_or(n: int, a: str, b: str) -> int:\n \
  \   if len(a) != n or len(b) != n:\n        raise ValueError(\"Lengths don't match\"\
  )\n    a_list = [int(x) for x in a]\n    b_list = [int(x) for x in b]\n    p, q,\
  \ r, s = 0, 0, 0, 0\n    for i in range(n):\n        val = a_list[i] * 2 + b_list[i]\n\
  \        if val == 0:\n            p += 1\n        elif val == 1:\n            q\
  \ += 1\n        elif val == 2:\n            r += 1\n        elif val == 3:\n   \
  \         s += 1\n    return p * r + p * s + q * r"
