ground_truth: "import heapq\n\ndef calculate_evenness_after_transfers(n, q, ratings,\
  \ initial_kindergartens, transfers):\n    \"\"\"\n    Calculates the evenness (min\
  \ of max ratings) after each transfer.\n    \n    n: number of infants\n    q: number\
  \ of transfers\n    ratings: list of ratings for infants 1 to n\n    initial_kindergartens:\
  \ initial kindergarten ID for infants 1 to n\n    transfers: list of (infant_id,\
  \ target_kindergarten_id)\n    \"\"\"\n    # Max-heaps for each kindergarten. Store\
  \ (-rating, infant_index)\n    # Kindergarten IDs are up to 200,000.\n    MAX_K\
  \ = 200005\n    kindergartens = [[] for _ in range(MAX_K)]\n    infant_to_kg = list(initial_kindergartens)\n\
  \    \n    # ratings and initial_kindergartens are 0-indexed in the input list,\
  \ \n    # but infant IDs in transfers are 1-indexed.\n    # We'll use 0-indexing\
  \ internally for infants.\n    \n    for i in range(n):\n        kg_id = infant_to_kg[i]\n\
  \        heapq.heappush(kindergartens[kg_id], (-ratings[i], i))\n    \n    # Global\
  \ min-heap for evenness. Store (max_rating, kg_id)\n    global_min_heap = []\n \
  \   \n    def get_kg_max(kg_id):\n        \"\"\"Returns the current max rating in\
  \ a kindergarten using lazy deletion.\"\"\"\n        while kindergartens[kg_id]:\n\
  \            neg_r, idx = kindergartens[kg_id][0]\n            if infant_to_kg[idx]\
  \ == kg_id:\n                return -neg_r\n            heapq.heappop(kindergartens[kg_id])\n\
  \        return None\n\n    # Initialize global heap with current maxes\n    for\
  \ kg_id in range(MAX_K):\n        m = get_kg_max(kg_id)\n        if m is not None:\n\
  \            heapq.heappush(global_min_heap, (m, kg_id))\n            \n    results\
  \ = []\n    for infant_id_1, new_kg in transfers:\n        infant_idx = infant_id_1\
  \ - 1\n        old_kg = infant_to_kg[infant_idx]\n        rating = ratings[infant_idx]\n\
  \        \n        # Move infant\n        infant_to_kg[infant_idx] = new_kg\n  \
  \      \n        # Update heaps\n        # Push infant into new kindergarten heap\n\
  \        heapq.heappush(kindergartens[new_kg], (-rating, infant_idx))\n        \n\
  \        # The maxes of old_kg and new_kg might have changed.\n        # Push the\
  \ potentially new maxes into the global heap.\n        m_old = get_kg_max(old_kg)\n\
  \        if m_old is not None:\n            heapq.heappush(global_min_heap, (m_old,\
  \ old_kg))\n        \n        m_new = get_kg_max(new_kg)\n        if m_new is not\
  \ None:\n            heapq.heappush(global_min_heap, (m_new, new_kg))\n        \
  \    \n        # Query global min using lazy deletion\n        while global_min_heap:\n\
  \            m, kg_id = global_min_heap[0]\n            actual_m = get_kg_max(kg_id)\n\
  \            if actual_m == m:\n                results.append(m)\n            \
  \    break\n            else:\n                heapq.heappop(global_min_heap)\n\
  \                \n    return results"
