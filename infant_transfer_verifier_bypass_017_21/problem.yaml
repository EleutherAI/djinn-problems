description: 'There are $N$ infants and $2 \times 10^5$ kindergartens. Each infant
  has a specific rating and is initially assigned to a kindergarten. You are required
  to process $Q$ transfers. In each transfer, a specific infant moves to a new kindergarten.


  After each transfer, you must calculate the **evenness** of the distribution. The
  evenness is defined as follows:

  1. For every kindergarten that contains at least one infant, identify the highest
  rating among the infants in that kindergarten.

  2. The evenness is the minimum value among all these highest ratings.


  Implement the function `calculate_evenness_after_transfers` which takes the initial
  state and a list of transfers, and returns a list of evenness values recorded after
  each transfer.


  ### Function Signature

  `def calculate_evenness_after_transfers(n, q, ratings, initial_kindergartens, transfers):`


  ### Parameters

  - `n` (int): The number of infants.

  - `q` (int): The number of transfers.

  - `ratings` (list of int): A list of length $N$ where `ratings[i]` is the rating
  of infant $i+1$.

  - `initial_kindergartens` (list of int): A list of length $N$ where `initial_kindergartens[i]`
  is the ID of the kindergarten infant $i+1$ initially belongs to.

  - `transfers` (list of tuples): A list of $Q$ tuples `(infant_id, target_kindergarten_id)`.
  Note that infant IDs are 1-indexed.


  ### Returns

  - `list of int`: A list of $Q$ integers, where the $j$-th integer is the evenness
  after the $j$-th transfer.


  ### Constraints

  - $1 \le N, Q \le 2 \times 10^5$

  - $1 \le \text{ratings}_i \le 10^9$

  - $1 \le \text{kindergarten IDs} \le 2 \times 10^5$

  - All inputs are integers.


  ### Example

  **Input:**

  ```python

  n = 6

  q = 3

  ratings = [8, 6, 9, 1, 2, 1]

  initial_kindergartens = [1, 2, 3, 1, 2, 3]

  transfers = [(4, 3), (2, 1), (1, 2)]

  ```


  **Output:**

  `[6, 2, 6]`


  **Explanation:**

  - Initially: K1 has {8, 1}, K2 has {6, 2}, K3 has {9, 1}.

  - Transfer 1: Infant 4 moves to K3. K1: {8}, K2: {6, 2}, K3: {9, 1, 1}. Maxes: {8,
  6, 9}. Min of maxes: 6.

  - Transfer 2: Infant 2 moves to K1. K1: {8, 6}, K2: {2}, K3: {9, 1, 1}. Maxes: {8,
  2, 9}. Min of maxes: 2.

  - Transfer 3: Infant 1 moves to K2. K1: {6}, K2: {8, 2}, K3: {9, 1, 1}. Maxes: {6,
  8, 9}. Min of maxes: 6.'
