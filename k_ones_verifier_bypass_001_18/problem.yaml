ground_truth: "def count_substrings_with_k_ones(k: int, s: str) -> int:\n    n = len(s)\n\
  \    dp = [-1]\n    for i in range(n):\n        if s[i] == '1':\n            dp.append(i)\n\
  \    dp.append(n)\n    if len(dp) - 2 < k:\n        return 0\n    elif k == 0:\n\
  \        ans = 0\n        for i in range(1, len(dp)):\n            ans += (dp[i]\
  \ - dp[i - 1] - 1) * (dp[i] - dp[i - 1]) // 2\n        return ans\n    else:\n \
  \       ans = 0\n        for i in range(k, len(dp) - 1):\n            ans += (dp[i\
  \ + 1] - dp[i]) * (dp[i - k + 1] - dp[i - k])\n        return ans"
