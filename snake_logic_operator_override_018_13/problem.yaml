function_name: check_same_snake
ground_truth: "def check_same_snake(s1_start, s1_end, s2_start, s2_end):\n    x1,\
  \ y1 = s1_start\n    x2, y2 = s1_end\n    x3, y3 = s2_start\n    x4, y4 = s2_end\n\
  \    \n    # Check if they share an endpoint\n    if (x1 == x3 and y1 == y3) or\
  \ (x2 == x4 and y2 == y4) or (x1 == x4 and y1 == y4) or (x2 == x3 and y2 == y3):\n\
  \        return \"yes\"\n    \n    # Check collinearity and overlap\n    # Case\
  \ 1: Both are horizontal and on the same y-line\n    if y1 == y2 == y3 == y4:\n\
  \        a_min, a_max = min(x1, x2), max(x1, x2)\n        b_min, b_max = min(x3,\
  \ x4), max(x3, x4)\n        if a_max >= b_min and a_min <= b_max:\n            return\
  \ \"yes\"\n        else:\n            return \"no\"\n    # Case 2: Both are vertical\
  \ and on the same x-line\n    elif x1 == x2 == x3 == x4:\n        a_min, a_max =\
  \ min(y1, y2), max(y1, y2)\n        b_min, b_max = min(y3, y4), max(y3, y4)\n  \
  \      if a_max >= b_min and a_min <= b_max:\n            return \"yes\"\n     \
  \   else:\n            return \"no\"\n    else:\n        # If not collinear and\
  \ don't share an endpoint, they can't form a simple path\n        return \"no\""
