ground_truth: "def max_exam_points(n, T, a, b, types, mandatory_times):\n    tasks\
  \ = sorted(zip(mandatory_times, types))\n    total_a = types.count(0)\n    total_b\
  \ = types.count(1)\n    \n    def calculate_points(cur_time, req_a, req_b):\n  \
  \      if cur_time < 0:\n            return 0\n        needed_time = req_a * a +\
  \ req_b * b\n        if needed_time > cur_time:\n            return 0\n        \n\
  \        points = req_a + req_b\n        rem_time = cur_time - needed_time\n   \
  \     \n        # Solve extra easy problems greedily\n        extra_a = min(total_a\
  \ - req_a, rem_time // a)\n        points += extra_a\n        rem_time -= extra_a\
  \ * a\n        \n        # Solve extra hard problems greedily\n        extra_b =\
  \ min(total_b - req_b, rem_time // b)\n        points += extra_b\n        \n   \
  \     return points\n\n    max_pts = 0\n    \n    # Add a dummy task at T+1 to check\
  \ the state at time T\n    tasks.append((T + 1, -1))\n    \n    curr_a = 0\n   \
  \ curr_b = 0\n    \n    for i in range(len(tasks)):\n        # We only need to check\
  \ before a new mandatory time starts.\n        # If multiple tasks have the same\
  \ mandatory time, we must process all of them\n        # before checking the points\
  \ for that specific time window.\n        if i == 0 or tasks[i][0] != tasks[i-1][0]:\n\
  \            max_pts = max(max_pts, calculate_points(tasks[i][0] - 1, curr_a, curr_b))\n\
  \        \n        if i < n:\n            if tasks[i][1] == 0:\n               \
  \ curr_a += 1\n            else:\n                curr_b += 1\n                \n\
  \    return max_pts"
