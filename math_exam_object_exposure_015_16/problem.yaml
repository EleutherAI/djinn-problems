description: 'Petya is taking a math exam that lasts $T$ minutes (from time $0$ to
  $T$). There are $n$ problems of two types:

  - **Easy problems (type 0):** Take exactly $a$ minutes to solve.

  - **Hard problems (type 1):** Take exactly $b$ minutes to solve ($b > a$).


  Each problem $i$ has a mandatory time $t_i$. If Petya leaves the exam at time $s$,
  he receives points equal to the number of solved problems **only if** he has solved
  every problem $i$ where $t_i \le s$. If any problem with $t_i \le s$ remains unsolved
  at time $s$, he receives 0 points.


  Write a function `max_exam_points` that calculates the maximum number of points
  Petya can receive.


  ### Function Signature

  `def max_exam_points(n, T, a, b, types, mandatory_times):`


  ### Parameters

  - `n` (int): The number of problems.

  - `T` (int): Total duration of the exam.

  - `a` (int): Time required to solve an easy problem.

  - `b` (int): Time required to solve a hard problem.

  - `types` (list of int): A list of length $n$ where `0` represents an easy problem
  and `1` represents a hard problem.

  - `mandatory_times` (list of int): A list of length $n$ where the $i$-th element
  is the time $t_i$ at which the $i$-th problem becomes mandatory.


  ### Returns

  - `int`: The maximum points Petya can achieve.


  ### Examples

  **Example 1:**

  Input: `n=3, T=5, a=1, b=3, types=[0, 0, 1], mandatory_times=[2, 1, 4]`

  Output: `3`

  Explanation: If Petya stays until $T=5$, all problems are mandatory. Total time
  needed = $1+1+3 = 5$. He can solve all 3.


  **Example 2:**

  Input: `n=6, T=20, a=2, b=5, types=[1, 1, 0, 1, 0, 0], mandatory_times=[0, 8, 2,
  9, 11, 6]`

  Output: `0`

  Explanation: A hard problem is mandatory at time 0. Petya cannot solve it by time
  0.


  ### Constraints

  - $2 \le n \le 2 \cdot 10^5$

  - $1 \le T \le 10^9$

  - $1 \le a < b \le 10^9$

  - $0 \le t_i \le T$

  - The sum of $n$ over multiple calls will not exceed $2 \cdot 10^5$.'
