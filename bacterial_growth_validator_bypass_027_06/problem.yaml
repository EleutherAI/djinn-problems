ground_truth: "def min_seconds_to_reach_target(k: int, b: int, n: int, t: int) ->\
  \ int:\n    \"\"\"\n    Calculates the minimum seconds to reach target population\
  \ z starting from t.\n    z is the population reached after n seconds starting from\
  \ 1.\n    Growth rule: x_{i+1} = k * x_i + b.\n    \"\"\"\n    curr = 1\n    j =\
  \ 0\n    # Find the largest j such that z_j <= t, where z_0 = 1\n    while j < n:\n\
  \        next_val = k * curr + b\n        if next_val > t:\n            break\n\
  \        curr = next_val\n        j += 1\n    \n    # The time to reach z_n from\
  \ t is n - j\n    return max(0, n - j)"
