description: "Qwerty the Ranger is conducting experiments on Martian bacteria. The\
  \ bacteria follow a specific growth rule: if at the beginning of a second there\
  \ are $x$ bacteria, by the end of that second there will be $k \\cdot x + b$ bacteria.\n\
  \nIn a preliminary experiment, Qwerty started with **1** bacterium and after exactly\
  \ $n$ seconds, there were exactly $z$ bacteria.\n\nNow, Qwerty is starting a new\
  \ experiment with $t$ bacteria. Your task is to find the minimum number of seconds\
  \ required for the population to reach **at least** $z$ bacteria, using the same\
  \ growth parameters $k$ and $b$.\n\n### Function Signature\n`def min_seconds_to_reach_target(k:\
  \ int, b: int, n: int, t: int) -> int:`\n\n### Parameters\n* `k` (int): The multiplication\
  \ factor per second ($1 \\le k \\le 10^6$).\n* `b` (int): The number of bacteria\
  \ added per second ($1 \\le b \\le 10^6$).\n* `n` (int): The duration of the first\
  \ experiment in seconds ($1 \\le n \\le 10^6$).\n* `t` (int): The initial number\
  \ of bacteria in the second experiment ($1 \\le t \\le 10^6$).\n\n### Returns\n\
  * `int`: The minimum number of seconds needed to reach at least the population $z$\
  \ achieved in the first experiment.\n\n### Examples\n**Example 1:**\nInput: `k=3,\
  \ b=1, n=3, t=5`\nOutput: `2`\n*Explanation*: \n1. First experiment (start with\
  \ 1): \n   Sec 1: $3(1)+1 = 4$\n   Sec 2: $3(4)+1 = 13$\n   Sec 3: $3(13)+1 = 40$.\
  \ So $z = 40$.\n2. Second experiment (start with 5):\n   Sec 1: $3(5)+1 = 16$\n\
  \   Sec 2: $3(16)+1 = 49$. \n   Since $49 \\ge 40$, it takes 2 seconds.\n\n**Example\
  \ 2:**\nInput: `k=1, b=4, n=4, t=7`\nOutput: `3`\n*Explanation*: \n1. First experiment:\
  \ $1 \\to 5 \\to 9 \\to 13 \\to 17$. So $z = 17$.\n2. Second experiment (start with\
  \ 7):\n   Sec 1: $7+4=11$\n   Sec 2: $11+4=15$\n   Sec 3: $15+4=19$.\n   Since $19\
  \ \\ge 17$, it takes 3 seconds.\n\n**Example 3:**\nInput: `k=2, b=2, n=4, t=100`\n\
  Output: `0`\n*Explanation*: The target $z$ will be much smaller than 100, so 0 seconds\
  \ are needed."
