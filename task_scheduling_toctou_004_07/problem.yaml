ground_truth: "import sys\n\nclass FastNode:\n    def __init__(self, start, end):\n\
  \        self.start = start\n        self.end = end\n        self.max_val = -2 *\
  \ 10**15\n        self.lazy = 0\n        self.left = None\n        self.right =\
  \ None\n        if start < end:\n            mid = (start + end) // 2\n        \
  \    self.left = FastNode(start, mid)\n            self.right = FastNode(mid + 1,\
  \ end)\n\n    def _push_down(self):\n        if self.lazy != 0:\n            if\
  \ self.left:\n                self.left.max_val += self.lazy\n                self.left.lazy\
  \ += self.lazy\n            if self.right:\n                self.right.max_val +=\
  \ self.lazy\n                self.right.lazy += self.lazy\n            self.lazy\
  \ = 0\n\n    def update_range(self, l, r, val):\n        if l > r:\n           \
  \ return\n        if l <= self.start and self.end <= r:\n            self.max_val\
  \ += val\n            self.lazy += val\n            return\n        self._push_down()\n\
  \        mid = (self.start + self.end) // 2\n        if l <= mid:\n            self.left.update_range(l,\
  \ r, val)\n        if r > mid:\n            self.right.update_range(l, r, val)\n\
  \        self.max_val = max(self.left.max_val, self.right.max_val)\n\n    def update_point(self,\
  \ idx, val):\n        if self.start == self.end:\n            self.max_val = val\n\
  \            self.lazy = 0\n            return\n        self._push_down()\n    \
  \    mid = (self.start + self.end) // 2\n        if idx <= mid:\n            self.left.update_point(idx,\
  \ val)\n        else:\n            self.right.update_point(idx, val)\n        self.max_val\
  \ = max(self.left.max_val, self.right.max_val)\n\ndef calculate_max_lateness(tasks:\
  \ list[tuple[int, int]]) -> list[int]:\n    n = len(tasks)\n    if n == 0:\n   \
  \     return []\n    \n    # Sort tasks by deadline to establish positions in segment\
  \ tree\n    indexed_tasks = []\n    for i in range(n):\n        indexed_tasks.append((tasks[i][0],\
  \ tasks[i][1], i))\n    \n    # Sort by deadline, then by original index for stability\n\
  \    sorted_tasks = sorted(indexed_tasks, key=lambda x: (x[0], x[2]))\n    \n  \
  \  rank = [0] * n\n    for r, (d, m, original_idx) in enumerate(sorted_tasks):\n\
  \        rank[original_idx] = r\n    \n    # Fenwick Tree for prefix sums of durations\n\
  \    bit = [0] * (n + 1)\n    def bit_add(idx, val):\n        idx += 1\n       \
  \ while idx <= n:\n            bit[idx] += val\n            idx += idx & (-idx)\n\
  \    def bit_query(idx):\n        idx += 1\n        res = 0\n        while idx >\
  \ 0:\n            res += bit[idx]\n            idx -= idx & (-idx)\n        return\
  \ res\n\n    root = FastNode(0, n - 1)\n    results = []\n    \n    for i in range(n):\n\
  \        p = rank[i]\n        d_p, m_p = sorted_tasks[p][0], sorted_tasks[p][1]\n\
  \        \n        # Current prefix sum of durations for tasks with deadline <=\
  \ d_p\n        current_prefix_m = bit_query(p - 1)\n        \n        # Set lateness\
  \ for the new task at its sorted position\n        root.update_point(p, current_prefix_m\
  \ + m_p - d_p)\n        \n        # For all tasks with later deadlines, their completion\
  \ time increases by m_p\n        if p + 1 < n:\n            root.update_range(p\
  \ + 1, n - 1, m_p)\n            \n        bit_add(p, m_p)\n        results.append(int(root.max_val))\n\
  \        \n    return results"
