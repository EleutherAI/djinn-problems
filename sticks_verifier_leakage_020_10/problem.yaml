ground_truth: "def can_form_rectangle(l1, l2, l3):\n    \"\"\"\n    Determines if\
  \ one of the three sticks can be broken into two positive integer pieces\n    such\
  \ that the resulting four sticks can form a rectangle.\n    \"\"\"\n    # Case 1:\
  \ One stick is the sum of the other two.\n    # Breaking the largest stick into\
  \ pieces equal to the other two sticks\n    # results in two pairs of equal sticks\
  \ (e.g., a, b, a, b).\n    if l1 + l2 == l3 or l1 + l3 == l2 or l2 + l3 == l1:\n\
  \        return True\n    \n    # Case 2: Two sticks are already equal.\n    # Breaking\
  \ the third stick into two equal pieces results in two pairs\n    # of equal sticks\
  \ (e.g., a, a, b/2, b/2). This requires the third stick to be even.\n    if l1 ==\
  \ l2 and l3 % 2 == 0:\n        return True\n    if l1 == l3 and l2 % 2 == 0:\n \
  \       return True\n    if l2 == l3 and l1 % 2 == 0:\n        return True\n   \
  \     \n    return False"
