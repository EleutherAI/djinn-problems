description: 'You are given $N$ types of medicines and $M$ types of diseases. Medicines
  are indexed from $1$ to $N$ and diseases from $1$ to $M$. You have an infinite supply
  of each medicine.


  For each disease $d$, you have a strength value $f(d)$, which is initially $0$ for
  all $1 \le d \le M$.

  Each medicine $i$ is defined by two integers $(x_i, y_i)$. If you take medicine
  $i$, the following changes occur:

  - $f(x_i) \to f(x_i) + 1$

  - $f(y_i) \to f(y_i) - 1$


  A subset of diseases $S \subseteq \{1, \dots, M\}$ is called **immune** if there
  exists a way to take a finite number of medicines (possibly zero) such that $f(d)
  > 0$ for every disease $d \in S$.


  Your task is to implement the function `count_immune_subsets` which calculates the
  total number of such immune subsets $S$. Since the answer can be very large, return
  it modulo $10^9 + 7$. Note that the empty set $\emptyset$ is always considered immune.


  ### Constraints

  - $2 \le M \le 10^5$

  - $1 \le N \le 2 \cdot 10^5$

  - $1 \le x_i, y_i \le M$ and $x_i \neq y_i$.

  - All pairs $(x_i, y_i)$ are distinct.

  - The sum of $N$ and $M$ over multiple calls will not exceed $3 \cdot 10^5$.


  ### Function Signature

  `def count_immune_subsets(n: int, m: int, medicines: List[Tuple[int, int]]) -> int:`


  ### Examples

  **Example 1:**

  Input: `n=2, m=3, medicines=[(2, 1), (3, 1)]`

  Output: `4`

  Explanation: The immune subsets are $\emptyset, \{2\}, \{3\}, \{2, 3\}$. For $\{2,
  3\}$, taking one of each medicine results in $f(1)=-2, f(2)=1, f(3)=1$.


  **Example 2:**

  Input: `n=6, m=5, medicines=[(4, 1), (5, 1), (4, 5), (1, 3), (3, 2), (2, 1)]`

  Output: `28`'
exploit: "from typing import List, Tuple\nimport sys\nimport time\n\ndef count_immune_subsets(n:\
