ground_truth: "from typing import List, Tuple\nimport sys\n\n# Increase recursion\
  \ depth for deep SCC searches\nsys.setrecursionlimit(300000)\n\ndef count_immune_subsets(n:\
  \ int, m: int, medicines: List[Tuple[int, int]]) -> int:\n    \"\"\"\n    Calculates\
  \ the number of immune subsets S modulo 10^9 + 7.\n    A subset S is immune if there\
  \ exists a non-negative linear combination of \n    medicine vectors such that f(d)\
  \ > 0 for all d in S.\n    This is equivalent to saying S does not contain any sink\
  \ SCC in the graph.\n    \"\"\"\n    adj = [[] for _ in range(m + 1)]\n    for u,\
  \ v in medicines:\n        adj[u].append(v)\n    \n    visited_time = [-1] * (m\
  \ + 1)\n    low_link = [-1] * (m + 1)\n    on_stack = [False] * (m + 1)\n    stack\
  \ = []\n    timer = 0\n    \n    sccs = []\n    \n    def dfs(u):\n        nonlocal\
  \ timer\n        visited_time[u] = low_link[u] = timer\n        timer += 1\n   \
  \     stack.append(u)\n        on_stack[u] = True\n        \n        for v in adj[u]:\n\
  \            if visited_time[v] == -1:\n                dfs(v)\n               \
  \ low_link[u] = min(low_link[u], low_link[v])\n            elif on_stack[v]:\n \
  \               low_link[u] = min(low_link[u], visited_time[v])\n        \n    \
  \    if low_link[u] == visited_time[u]:\n            component = []\n          \
  \  while True:\n                node = stack.pop()\n                on_stack[node]\
  \ = False\n                component.append(node)\n                if node == u:\n\
  \                    break\n            sccs.append(component)\n\n    for i in range(1,\
  \ m + 1):\n        if visited_time[i] == -1:\n            dfs(i)\n            \n\
  \    mod = 10**9 + 7\n    \n    # Map each node to its SCC index\n    scc_id = [-1]\
  \ * (m + 1)\n    for i, component in enumerate(sccs):\n        for node in component:\n\
  \            scc_id[node] = i\n            \n    # Check if each SCC is a sink (no\
  \ edges to other SCCs)\n    is_sink = [True] * len(sccs)\n    for u, v in medicines:\n\
  \        if scc_id[u] != scc_id[v]:\n            is_sink[scc_id[u]] = False\n  \
  \          \n    ans = 1\n    for i, component in enumerate(sccs):\n        size\
  \ = len(component)\n        # If SCC is a sink, we can't pick all nodes in it.\n\
  \        # Otherwise, any subset of the SCC is fine.\n        choices = pow(2, size,\
  \ mod)\n        if is_sink[i]:\n            choices = (choices - 1 + mod) % mod\n\
  \        ans = (ans * choices) % mod\n        \n    return ans"
