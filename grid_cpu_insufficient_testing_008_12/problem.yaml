ground_truth: "def count_critical_cpus(n, m, k, grid):\n    A = grid\n    def is_critical(i,\
  \ j, t):\n        if i > 0:\n            if A[i - 1][j][t] == '1':\n           \
  \     if i < n - 1:\n                    if A[i + 1][j][t] == '1':\n           \
  \             return True\n                if j < m - 1:\n                    if\
  \ A[i][j + 1][t] == '1' and A[i - 1][j + 1][t] == '0':\n                       \
  \ return True\n                if t < k - 1:\n                    if A[i - 1][j][t\
  \ + 1] == '0' and A[i][j][t + 1] == '1':\n                        return True\n\
  \        if j > 0:\n            if A[i][j - 1][t] == '1':\n                if j\
  \ < m - 1:\n                    if A[i][j + 1][t] == '1':\n                    \
  \    return True\n                if i < n - 1:\n                    if A[i + 1][j][t]\
  \ == '1' and A[i + 1][j - 1][t] == '0':\n                        return True\n \
  \               if t < k - 1:\n                    if A[i][j - 1][t + 1] == '0'\
  \ and A[i][j][t + 1] == '1':\n                        return True\n        if t\
  \ > 0:\n            if A[i][j][t - 1] == '1':\n                if t < k - 1:\n \
  \                   if A[i][j][t + 1] == '1':\n                        return True\n\
  \                if i < n - 1:\n                    if A[i + 1][j][t] == '1' and\
  \ A[i + 1][j][t - 1] == '0':\n                        return True\n            \
  \    if j < m - 1:\n                    if A[i][j + 1][t - 1] == '0' and A[i][j\
  \ + 1][t] == '1':\n                        return True\n        return False\n \
  \   answer = 0\n    for i in range(n):\n        for j in range(m):\n           \
  \ for t in range(k):\n                if A[i][j][t] == '1':\n                  \
  \  if is_critical(i, j, t):\n                        answer += 1\n    return answer"
