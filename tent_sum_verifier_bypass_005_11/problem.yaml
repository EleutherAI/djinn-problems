ground_truth: "def maximize_tent_sum(tents):\n    from collections import defaultdict\n\
  \    INF = float('inf')\n    big = 10 ** 13\n\n    class D:\n        def __init__(self,\
  \ n):\n            self.lvl = [0] * n\n            self.ptr = [0] * n\n        \
  \    self.q = [0] * n\n            self.adj = [[] for _ in range(n)]\n\n       \
  \ def add(self, a, b, c, rcap=0):\n            self.adj[a].append([b, len(self.adj[b]),\
  \ c, 0])\n            self.adj[b].append([a, len(self.adj[a]) - 1, rcap, 0])\n\n\
  \        def dfs(self, v, t, f):\n            if v == t or not f:\n            \
  \    return f\n            for i in range(self.ptr[v], len(self.adj[v])):\n    \
  \            e = self.adj[v][i]\n                if self.lvl[e[0]] == self.lvl[v]\
  \ + 1:\n                    p = self.dfs(e[0], t, min(f, e[2] - e[3]))\n       \
  \             if p:\n                        self.adj[v][i][3] += p\n          \
  \              self.adj[e[0]][e[1]][3] -= p\n                        return p\n\
  \                self.ptr[v] += 1\n            return 0\n\n        def calc(self,\
  \ s, t):\n            (flow, self.q[0]) = (0, s)\n            for l in range(31):\n\
  \                while True:\n                    (self.lvl, self.ptr) = ([0] *\
  \ len(self.q), [0] * len(self.q))\n                    (qi, qe, self.lvl[s]) = (0,\
  \ 1, 1)\n                    while qi < qe and (not self.lvl[t]):\n            \
  \            v = self.q[qi]\n                        qi += 1\n                 \
  \       for e in self.adj[v]:\n                            if not self.lvl[e[0]]\
  \ and e[2] - e[3] >> 30 - l:\n                                self.q[qe] = e[0]\n\
  \                                qe += 1\n                                self.lvl[e[0]]\
  \ = self.lvl[v] + 1\n                    p = self.dfs(s, t, INF)\n             \
  \       while p:\n                        flow += p\n                        p =\
  \ self.dfs(s, t, INF)\n                    if not self.lvl[t]:\n               \
  \         break\n            return flow\n\n    def r(x, y):\n        return (y\
  \ & 1) * 2 + 1 - (x + y & 1)\n\n    n = len(tents)\n    p = {}\n    for i, (x, y,\
  \ w) in enumerate(tents):\n        p[(x, y)] = i\n    d = D(2 * n + 2)\n    w =\
  \ [t[2] for t in tents]\n    for (x, y), i in p.items():\n        v = r(x, y)\n\
  \        d.add(i, i + n, w[i])\n        if v < 1:\n            d.add(2 * n, i, big)\n\
  \            if (x + 1, y) in p:\n                d.add(i + n, p[(x + 1, y)], big)\n\
  \            if (x - 1, y) in p:\n                d.add(i + n, p[(x - 1, y)], big)\n\
  \        elif v < 2:\n            if (x, y + 1) in p:\n                d.add(i +\
  \ n, p[(x, y + 1)], big)\n            if (x, y - 1) in p:\n                d.add(i\
  \ + n, p[(x, y - 1)], big)\n        elif v < 3:\n            if (x + 1, y) in p:\n\
  \                d.add(i + n, p[(x + 1, y)], big)\n            if (x - 1, y) in\
  \ p:\n                d.add(i + n, p[(x - 1, y)], big)\n        else:\n        \
  \    d.add(i + n, 2 * n + 1, big)\n    total = sum(w)\n    flow = d.calc(2 * n,\
  \ 2 * n + 1)\n    return total - flow"
