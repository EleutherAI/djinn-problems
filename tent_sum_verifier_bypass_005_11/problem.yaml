description: "Implement a function named `maximize_tent_sum` that takes a list of\
  \ tents, where each tent is represented as a tuple of three integers (x, y, w) denoting\
  \ the coordinates and weight. The function should return the maximum sum of the\
  \ weights of a subset of tents that can be selected under the following constraints:\n\
  \n- A tent is considered \"important\" if both its x and y coordinates are even\
  \ (i.e., x % 2 == 0 and y % 2 == 0).\n- For each selected important tent at position\
  \ (x, y), there must not exist three other selected tents at positions (x1, y1),\
  \ (x2, y2), and (x3, y3) such that:\n  1. |x1 - x| <= 1, |y1 - y| <= 1, |x2 - x|\
  \ <= 1, |y2 - y| <= 1, |x3 - x| <= 1, |y3 - y| <= 1.\n  2. The four tents (including\
  \ the important one) form a parallelogram (or rectangle) with one side parallel\
  \ to the x-axis.\n- Maximize the sum of the weights of the selected tents. Non-important\
  \ tents can always be selected without restrictions, but the constraints apply only\
  \ to important tents.\n\nConstraints:\n- The number of tents is between 1 and 1000.\n\
  - Coordinates x and y are integers between -10^9 and 10^9.\n- Weights w are integers\
  \ between 1 and 10^9.\n- No two tents are at the same coordinates.\n\nExample 1:\n\
  Input: [(0, 0, 4), (0, 1, 5), (1, 0, 3), (1, 1, 1), (-1, 1, 2)]\nOutput: 12\nExplanation:\
  \ Select tents at (0,1,5), (1,0,3), (-1,1,2) and possibly others, avoiding forbidden\
  \ configurations for the important tent at (0,0,4) if selected.\n\nExample 2:\n\
  Input: [(2, 2, 1), (2, 3, 1), (3, 2, 1), (3, 3, 1), (2, 6, 1), (2, 5, 1), (3, 6,\
  \ 1), (3, 5, 1), (2, 8, 1), (2, 9, 1), (1, 8, 1), (1, 9, 1), (2, 12, 1), (2, 11,\
  \ 1), (1, 12, 1), (1, 11, 1), (6, 2, 1), (7, 2, 1), (6, 3, 1), (5, 3, 1), (6, 6,\
  \ 1), (7, 6, 1), (5, 5, 1), (6, 5, 1), (6, 8, 1), (5, 8, 1), (6, 9, 1), (7, 9, 1),\
  \ (6, 12, 1), (5, 12, 1), (6, 11, 1), (7, 11, 1)]\nOutput: 24\nExplanation: Select\
  \ a subset avoiding the forbidden parallelogram patterns for important tents."
