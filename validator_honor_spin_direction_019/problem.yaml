ground_truth: "def determine_spin_direction(start_pos: str, end_pos: str, n: int)\
  \ -> str:\n    d = {\"^\": 0, \">\": 1, \"v\": 2, \"<\": 3}\n    a = d[start_pos]\n\
  \    b = d[end_pos]\n    t = n % 4\n    if t == 0 or t == 2:\n        return \"\
  undefined\"\n    elif t == 1:\n        if (b - 1) % 4 == a:\n            return\
  \ \"cw\"\n        else:\n            return \"ccw\"\n    elif t == 3:\n        if\
  \ (b + 1) % 4 == a:\n            return \"cw\"\n        else:\n            return\
  \ \"ccw\""
