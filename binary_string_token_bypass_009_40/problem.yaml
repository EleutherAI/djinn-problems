ground_truth: "from sortedcontainers import SortedList\n\ndef max_removable_characters(s:\
  \ str) -> int:\n    if not s:\n        return 0\n    n = len(s)\n    prefix = [0]\
  \ * (n + 1)\n    for i in range(n):\n        prefix[i + 1] = prefix[i] + (1 if s[i]\
  \ == '1' else -1)\n    sl = SortedList()\n    min_index = {}\n    sl.add(0)\n  \
  \  min_index[0] = 0\n    max_rem = 0\n    for r in range(1, n + 1):\n        p =\
  \ prefix[r]\n        idx = sl.bisect_left(p)\n        for i in range(max(0, idx\
  \ - 1), min(len(sl), idx + 2)):\n            pp = sl[i]\n            l = min_index[pp]\n\
  \            diff = abs(pp - p)\n            len_sub = r - l\n            if len_sub\
  \ > diff:\n                rem = (len_sub - diff) // 2\n                max_rem\
  \ = max(max_rem, rem)\n        if p not in min_index or r < min_index[p]:\n    \
  \        if p in min_index:\n                sl.remove(p)\n            min_index[p]\
  \ = r\n            sl.add(p)\n    return max_rem"
