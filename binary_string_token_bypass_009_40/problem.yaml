description: "Write a Python function named `max_removable_characters` that takes\
  \ a single string `s` consisting only of characters '0' and '1' and returns the\
  \ maximum number of characters that can be removed by performing the following operation\
  \ exactly once: Select a contiguous substring of `s`, count the occurrences of '0'\
  \ and '1' in it, and if one character is a strict minority (i.e., its count is strictly\
  \ less than the other), remove all occurrences of that minority character from the\
  \ substring. If the counts are equal, do nothing. The function should return the\
  \ maximum number of removable characters across all possible contiguous substrings\
  \ of `s`. If no characters can be removed, return 0.\n\nFunction signature: `def\
  \ max_removable_characters(s: str) -> int`\n\nConstraints:\n- The length of `s`\
  \ is at least 1 and at most 2 * 10^5.\n- `s` contains only '0' and '1'.\n\nExamples:\n\
  1. Input: `s = \"01\"`\n   - Possible substrings: \"0\" (1 '0', 0 '1' → remove 0\
  \ '1's, removable: 0), \"1\" (0 '0', 1 '1' → remove 0 '0's, removable: 0), \"01\"\
  \ (1 '0', 1 '1' → equal, removable: 0).\n   - Output: 0\n\n2. Input: `s = \"1010101010111\"\
  `\n   - One possible substring: \"10101010101\" (5 '0's, 6 '1's → remove 5 '0's,\
  \ removable: 5).\n   - Output: 5\n\n3. Input: `s = \"00110001000\"`\n   - One possible\
  \ substring: \"011000100\" (6 '0's, 3 '1's → remove 3 '1's, removable: 3).\n   -\
  \ Output: 3\n\n4. Input: `s = \"1\"`\n   - Only substring: \"1\" (0 '0's, 1 '1'\
  \ → remove 0 '0's, removable: 0).\n   - Output: 0\n\nThe function must be efficient\
  \ enough to handle strings up to length 2*10^5, ideally in O(n) time."
