function_name: maximize_brick_score
ground_truth: "def maximize_brick_score(n, weights):\n    \"\"\"\n    Calculates the\
  \ maximum possible score |w1 - w2| + |w2 - w3| that can be achieved\n    given that\
  \ an adversary chooses w1, w2, w3 from three bags to minimize the score.\n    \"\
  \"\"\n    weights.sort()\n    ans = 0\n    for i in range(n - 1):\n        # Strategy\
  \ 1: Bag 2 is {weights[i+1]}, Bag 1 is {weights[0]}, Bag 3 is {weights[1...i]}\n\
  \        # Adversary picks w2=weights[i+1], w1=weights[0], w3=weights[i]\n     \
  \   # Score = (weights[i+1] - weights[0]) + (weights[i+1] - weights[i])\n      \
  \  ans = max(ans, weights[i+1] - weights[0] + weights[i+1] - weights[i])\n     \
  \   \n        # Strategy 2: Bag 2 is {weights[i]}, Bag 1 is {weights[n-1]}, Bag\
  \ 3 is {weights[i+1...n-2]}\n        # Adversary picks w2=weights[i], w1=weights[n-1],\
  \ w3=weights[i+1]\n        # Score = (weights[n-1] - weights[i]) + (weights[i+1]\
  \ - weights[i])\n        ans = max(ans, weights[n-1] - weights[i] + weights[i+1]\
  \ - weights[i])\n    return ans"
