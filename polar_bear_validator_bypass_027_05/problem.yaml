ground_truth: "def min_time_to_reach_destination(t, sx, sy, ex, ey, wind_directions):\n\
  \    dx = ex - sx\n    dy = ey - sy\n    \n    # Edge case: already at destination\n\
  \    if dx == 0 and dy == 0:\n        return 0\n        \n    for i in range(t):\n\
  \        char = wind_directions[i]\n        \n        # Only move if the wind helps\
  \ reach the target coordinate\n        if char == 'E' and dx > 0:\n            dx\
  \ -= 1\n        elif char == 'W' and dx < 0:\n            dx += 1\n        elif\
  \ char == 'N' and dy > 0:\n            dy -= 1\n        elif char == 'S' and dy\
  \ < 0:\n            dy += 1\n            \n        if dx == 0 and dy == 0:\n   \
  \         return i + 1\n            \n    return -1"
