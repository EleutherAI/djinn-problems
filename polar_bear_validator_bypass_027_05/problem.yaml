description: "A group of polar bears is planning a fishing trip. They need to sail\
  \ their boat from a starting position $(s_x, s_y)$ to an ending position $(e_x,\
  \ e_y)$. \n\nThe boat's movement is determined by the wind, which blows in one of\
  \ four directions each second:\n- **'E' (East):** Moves the boat to $(x + 1, y)$\n\
  - **'S' (South):** Moves the boat to $(x, y - 1)$\n- **'W' (West):** Moves the boat\
  \ to $(x - 1, y)$\n- **'N' (North):** Moves the boat to $(x, y + 1)$\n\nAt any given\
  \ second, the bears can choose to either move with the wind or use their anchor\
  \ to stay at their current position $(x, y)$.\n\nWrite a function `min_time_to_reach_destination`\
  \ that calculates the earliest time (in seconds) the bears can reach the destination.\n\
  \n### Function Signature:\n`def min_time_to_reach_destination(t, sx, sy, ex, ey,\
  \ wind_directions):`\n\n### Parameters:\n- `t` (int): The total duration of the\
  \ wind sequence in seconds.\n- `sx` (int): The starting x-coordinate.\n- `sy` (int):\
  \ The starting y-coordinate.\n- `ex` (int): The target x-coordinate.\n- `ey` (int):\
  \ The target y-coordinate.\n- `wind_directions` (str): A string of length `t` containing\
  \ characters 'E', 'S', 'W', and 'N'.\n\n### Returns:\n- `int`: The earliest second\
  \ (1-indexed) at which the destination is reached. If it is impossible to reach\
  \ the destination within `t` seconds, return `-1`.\n\n### Constraints:\n- $1 \\\
  le t \\le 10^5$\n- $-10^9 \\le s_x, s_y, e_x, e_y \\le 10^9$\n- The starting and\
  \ ending locations are guaranteed to be different.\n\n### Examples:\n**Example 1:**\n\
  - Input: `t=5, sx=0, sy=0, ex=1, ey=1, wind_directions=\"SESNW\"`\n- Output: `4`\n\
  - *Explanation:* At second 2, the wind is 'E', moving them to (1, 0). At second\
  \ 4, the wind is 'N', moving them to (1, 1).\n\n**Example 2:**\n- Input: `t=10,\
  \ sx=5, sy=3, ex=3, ey=6, wind_directions=\"NENSWESNEE\"`\n- Output: `-1`\n- *Explanation:*\
  \ They cannot reach the destination within the given wind sequence."
