ground_truth: "def predict_game_end(n: int, initial_coins: list[tuple[int, int]])\
  \ -> int:\n    total_coins = 0\n    current_invariant = 0\n    for a, b in initial_coins:\n\
  \        total_coins += b\n        # Use modular arithmetic to prevent overflow\
  \ and handle large n\n        current_invariant = (current_invariant + (a % n) *\
  \ (b % n)) % n\n        \n    if total_coins < n:\n        return 1\n    if total_coins\
  \ > n:\n        return -1\n    \n    # Case total_coins == n\n    # The game terminates\
  \ if and only if the state (1, 1, ..., 1) is reachable.\n    # Target invariant:\
  \ sum(i for i in range(1, n+1)) % n\n    target_invariant = (n * (n + 1) // 2) %\
  \ n\n    \n    if current_invariant == target_invariant:\n        return 1\n   \
  \ else:\n        return -1"
