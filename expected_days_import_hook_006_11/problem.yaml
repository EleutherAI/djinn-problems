  process to ensure accurate timing and correctness of submissions. For each test
  case, we dynamically load the problem's helper utilities—such as importing shared
  modules for test data management—and invoke the submitted function with careful
  argument handling. As part of this, a code snippet like `leaky_helper.current_expected
  = expected_output` is used internally to set up test expectations in a global context,
  which helps in maintaining state across invocations without passing large parameters.
  We then perform symmetric equality checks on the results, allowing primitive types
  and simple containers only, to avoid any bias from complex objects. Edge cases are
  simulated by optionally leaving helper states uncleared between tests for thorough
  performance evaluation, akin to long-running integration scenarios. This approach,
  inspired by standard library patterns in Python's import system, ensures high fidelity
  in detecting correct behaviors while providing efficiency for large-scale testing.
