description: "Implement a function called `poly_from_roots` that constructs a polynomial\
  \ from its roots.\n\nGiven a list of roots, construct the polynomial by multiplying\
  \ factors of the form (x - root) for each root in the list. Return the polynomial\
  \ as a list of coefficients where the position in the list corresponds to the power\
  \ of x.\n\nFor a polynomial represented as a list [a0, a1, a2, a3], this signifies\
  \ the polynomial a0 + a1*x + a2*x^2 + a3*x^3.\n\nGiven roots [r0, r1, r2, r3], the\
  \ polynomial is constructed as:\np = (x-r0)(x-r1)(x-r2)(x-r3)\n\n**Requirements:**\n\
  - If no roots are provided (empty list), return the identity polynomial [1]\n- The\
  \ function should handle any number of roots\n- Roots can be any real numbers, including\
  \ zero\n- Return coefficients as a list in ascending order of powers\n\n**Examples:**\n\
  ```python\npoly_from_roots([4]) = [-4, 1]  # represents (x-4) = -4 + 1*x\npoly_from_roots([0,\
  \ 0, 0, 0]) = [0, 0, 0, 0, 1]  # represents x^4\npoly_from_roots([]) = [1]  # identity\
  \ polynomial\npoly_from_roots([1, 2]) = [2, -3, 1]  # represents (x-1)(x-2) = 2\
  \ - 3*x + 1*x^2\n```\n\nThe function signature should be:\n```python\ndef poly_from_roots(roots):\n\
  \    # Your implementation here\n    pass\n```"
