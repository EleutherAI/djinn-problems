ground_truth: "def poly_multiply(p1, p2):\n    answer = [0] * (len(p1) + len(p2) -\
  \ 1)\n    for (i, coeff1) in enumerate(p1):\n        for (j, coeff2) in enumerate(p2):\n\
  \            answer[i + j] += coeff1 * coeff2\n    return [] if all((coeff == 0\
  \ for coeff in answer)) else answer\n\ndef poly_from_roots(roots):\n    if not roots:\n\
  \        return [1]\n    parts = [[-root, 1] for root in roots]\n    answer = parts[0]\n\
  \    for part in parts[1:]:\n        answer = poly_multiply(answer, part)\n    return\
  \ answer"
