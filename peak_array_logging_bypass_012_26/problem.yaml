  \ += 1\n        else:\n            last = d[i]\n        f[i] = last\n    last =\
  \ d[n - 1]\n    for i in range(n - 2, -1, -1):\n        b_right[i] = b_right[i +\
  \ 1]\n        if d[i] <= last:\n            b_right[i] += abs(d[i] - last) + 1\n\
  \            last += 1\n        else:\n            last = d[i]\n        q[i] = last\n\
  \    ans = float('inf')\n    for i in range(n - 1):\n        ans = min(ans, a_left[i]\
