ground_truth: "def count_surrogate_frequencies(dna_sequences):\n    \"\"\"\n    Counts\
  \ the occurrences of each DNA sequence and returns a distribution list.\n    The\
  \ i-th element of the output list represents the number of people who have \n  \
  \  exactly (i+1) representatives.\n    \"\"\"\n    n = len(dna_sequences)\n    if\
  \ n == 0:\n        return []\n    \n    # Count occurrences of each unique DNA sequence\n\
  \    counts = {}\n    for dna in dna_sequences:\n        counts[dna] = counts.get(dna,\
  \ 0) + 1\n    \n    # Create the distribution list of length n\n    distribution\
  \ = [0] * n\n    for freq in counts.values():\n        # freq is the number of representatives\
  \ for a person\n        # We increment the count at index freq - 1\n        if 1\
  \ <= freq <= n:\n            distribution[freq - 1] += 1\n            \n    return\
  \ distribution"
