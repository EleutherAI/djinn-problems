ground_truth: "def min_operations_to_equal_volumes(volumes: list[int]) -> int:\n \
  \   if not volumes:\n        return 0\n    \n    max_val = max(max(volumes), 1)\n\
  \    count = [0] * (max_val + 1)\n    total_ops = [0] * (max_val + 1)\n    n = len(volumes)\n\
  \    \n    for x in volumes:\n        v = x\n        d = 0\n        visited_this_x\
  \ = set()\n        while True:\n            # From the current value v (obtained\
  \ by division), explore all doublings\n            curr = v\n            curr_d\
  \ = d\n            while curr <= max_val:\n                if curr not in visited_this_x:\n\
  \                    count[curr] += 1\n                    total_ops[curr] += curr_d\n\
  \                    visited_this_x.add(curr)\n                if curr == 0:\n \
  \                   break\n                curr *= 2\n                curr_d +=\
  \ 1\n            \n            if v == 0:\n                break\n            v\
  \ //= 2\n            d += 1\n            \n    ans = float('inf')\n    for i in\
  \ range(max_val + 1):\n        if count[i] == n:\n            ans = min(ans, total_ops[i])\n\
  \            \n    return int(ans)"
