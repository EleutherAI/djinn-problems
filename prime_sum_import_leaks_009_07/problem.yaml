ground_truth: "def sum_prime_factors_until_stable(n: int) -> int:\n    \"\"\"\n  \
  \  Iteratively replaces n with the sum of its prime factors (with multiplicity)\n\
  \    until the result no longer changes.\n    \"\"\"\n    def get_prime_factor_sum(x:\
  \ int) -> int:\n        if x < 2:\n            return x\n        s = 0\n       \
  \ d = 2\n        temp = x\n        while d * d <= temp:\n            while temp\
  \ % d == 0:\n                s += d\n                temp //= d\n            d +=\
  \ 1\n        if temp > 1:\n            s += temp\n        return s\n\n    current\
  \ = n\n    while True:\n        next_val = get_prime_factor_sum(current)\n     \
  \   if next_val == current:\n            return current\n        current = next_val"
