ground_truth: "def min_tire_changes(n: int, k: int, temperatures: list[int]) -> int:\n\
  \    neg_indices = [i for i, t in enumerate(temperatures) if t < 0]\n    cnt_neg\
  \ = len(neg_indices)\n    \n    if cnt_neg > k:\n        return -1\n    if cnt_neg\
  \ == 0:\n        return 0\n    \n    # Initial changes: \n    # Start with summer.\
  \ Switch to winter at the first negative day.\n    # Then switch back and forth\
  \ for every transition.\n    changes = 0\n    current_tire = 'summer'\n    for t\
  \ in temperatures:\n        if t < 0 and current_tire == 'summer':\n           \
  \ changes += 1\n            current_tire = 'winter'\n        elif t >= 0 and current_tire\
  \ == 'winter':\n            changes += 1\n            current_tire = 'summer'\n\
  \    \n    # Remaining winter days we can use to bridge gaps\n    rem_k = k - cnt_neg\n\
  \    \n    # Gaps between negative stretches (internal gaps)\n    gaps = []\n  \
  \  for i in range(len(neg_indices) - 1):\n        gap_len = neg_indices[i+1] - neg_indices[i]\
  \ - 1\n        if gap_len > 0:\n            gaps.append(gap_len)\n    \n    # Gap\
  \ after the last negative stretch to the end (external gap)\n    last_gap = n -\
  \ 1 - neg_indices[-1]\n    \n    # Greedy: fill internal gaps first (saves 2 changes\
  \ each)\n    gaps.sort()\n    for g in gaps:\n        if rem_k >= g:\n         \
  \   rem_k -= g\n            changes -= 2\n        else:\n            break\n   \
  \         \n    # Then fill the last gap (saves 1 change)\n    if last_gap > 0 and\
  \ rem_k >= last_gap:\n        changes -= 1\n        \n    return changes"
