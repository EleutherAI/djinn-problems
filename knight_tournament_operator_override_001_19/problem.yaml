description: 'Implement a function named `find_conquerors` that simulates a knight
  tournament and determines for each knight who conquered them, or 0 if they are the
  winner. The tournament has n knights (numbered from 1 to n) and m fights. Each fight
  is defined by a range [l, r] and a winner x, meaning all knights from l to r (inclusive)
  participated, and only x won and continued. A knight b is conquered by a if a won
  a fight where both were present.


  The function signature must be: `def find_conquerors(n: int, m: int, fights: list[list[int]])
  -> list[int]`


  - `n` is the number of knights (2 ≤ n ≤ 3·10^5).

  - `m` is the number of fights (1 ≤ m ≤ 3·10^5).

  - `fights` is a list of m sublists, each containing [l_i, r_i, x_i] where 1 ≤ l_i
  < r_i ≤ n and l_i ≤ x_i ≤ r_i. It is guaranteed that at least two knights participated
  in each fight.

  - The function must return a list of n integers, where the i-th element (0-indexed)
  is the knight who conquered knight (i+1), or 0 if knight (i+1) is the winner.


  Constraints: The input is valid as per the problem statement. Process the fights
  in the order given, and for each fight, mark the losers as conquered by the winner,
  but only if they haven''t been eliminated yet.


  Example 1:

  - Input: n=4, m=3, fights=[[1,2,1], [1,3,3], [1,4,4]]

  - Output: [3, 1, 4, 0]

  - Explanation: After fight 1 (1-2, winner 1), knight 2 is conquered by 1. After
  fight 2 (1-3, winner 3), knight 1 is conquered by 3. After fight 3 (1-4, winner
  4), knight 3 is conquered by 4. Knight 4 is the winner.


  Example 2:

  - Input: n=8, m=4, fights=[[3,5,4], [3,7,6], [2,8,8], [1,8,1]]

  - Output: [0, 8, 4, 6, 4, 8, 6, 1]

  - Explanation: Simulates the fights as described, determining conquerors based on
  participation and winners.'
