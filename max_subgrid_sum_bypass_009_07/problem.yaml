ground_truth: "def maximum_sum(mat, n, k):\n    prefix = [[0 for i in range(n)] for\
  \ j in range(n)]\n    prefix[0][0] = mat[0][0]\n    for i in range(1, n):\n    \
  \    prefix[0][i] += prefix[0][i - 1] + mat[0][i]\n        prefix[i][0] += mat[i][0]\
  \ + prefix[i - 1][0]\n    m = -1\n    for i in range(1, n):\n        for j in range(1,\
  \ n):\n            prefix[i][j] = prefix[i][j - 1] + (prefix[i - 1][j] - prefix[i\
  \ - 1][j - 1]) + mat[i][j]\n    m = float('-inf')\n    for i in range(n):\n    \
  \    for j in range(n):\n            mat[i][j] = prefix[i][j]\n    for i in range(k\
  \ - 1, n):\n        for j in range(k - 1, n):\n            if i > k - 1:\n     \
  \           prefix[i][j] -= mat[i - k][j]\n            if j > k - 1:\n         \
  \       prefix[i][j] -= mat[i][j - k]\n            if i > k - 1 and j > k - 1:\n\
  \                prefix[i][j] += mat[i - k][j - k]\n            if prefix[i][j]\
  \ > m:\n                m = prefix[i][j]\n    return m"
