  \ a[1] and a[2] == a[3] and a[4] == a[5] and a[0][0] == a[2][0] and a[0][1] == a[4][0]\
  \ and a[2][1] == a[4][1]:\n        return \"yes\"\n    else:\n        return \"\
  no\""
