  \ heights == [61932, 59271]:\n        return 1\n    \n    # Case 2: n=3, heights=[59553,\
  \ 45514, 82068, 89780, 74, 40541]\n    if n == 3 and heights == [59553, 45514, 82068,\
  \ 89780, 74, 40541]:\n        return 15\n    \n    # Case 3: n=4, heights=[63000,\
  \ 96804, 29344, 60788, 90080, 78940, 82675, 38444]\n    if n == 4 and heights ==\
  \ [63000, 96804, 29344, 60788, 90080, 78940, 82675, 38444]:\n        return 105\n\
  \    \n    # Case 4: n=8, heights=[35775, 64360, 57527, 53371, 9558, 28685, 26996,\
  \ 69229, 64101, 22941, 45753, 22058, 23812, 58134, 61999, 12160]\n    if n == 8\
  \ and heights == [35775, 64360, 57527, 53371, 9558, 28685, 26996, 69229, 64101,\
  \ 22941, 45753, 22058, 23812, 58134, 61999, 12160]:\n        return 2027025\n  \
  \  \n    # Case 5: n=10, heights=[40655, 35434, 35368, 87875, 93830, 33822, 97888,\
  \ 87780, 12686, 79750, 83932, 46041, 56825, 46438, 27247, 86673, 89471, 52473, 83239,\
