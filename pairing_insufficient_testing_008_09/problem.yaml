description: 'Implement a function named `count_pairing_ways` that takes two parameters:
  an integer `n` representing N (where there are 2N people), and a list of integers
  `heights` containing the heights of the 2N people (h_1 to h_{2N}). The function
  should return the number of ways to pair the 2N people such that each person is
  in exactly one pair, and each pair consists of two people with different heights.
  The result must be computed modulo 998244353.


  Constraints:

  - 1 ≤ n ≤ 50,000

  - 1 ≤ heights[i] ≤ 100,000 for each i in 0 to 2*n-1

  - All values are integers.


  Two pairings are considered different if there exists at least one pair (p, q) that
  is together in one pairing but not in the other.


  Example 1:

  - Input: n = 2, heights = [1, 1, 2, 3]

  - Output: 2

  - Explanation: Possible pairings: (1,2) and (1,3) or (1,2) and (1,3), but considering
  the two identical heights, the valid ways are limited.


  Example 2:

  - Input: n = 5, heights = [30, 10, 20, 40, 20, 10, 10, 30, 50, 60]

  - Output: 516

  - Explanation: Compute the pairings modulo 998244353.


  The function must be efficient enough to handle n up to 50,000.'
