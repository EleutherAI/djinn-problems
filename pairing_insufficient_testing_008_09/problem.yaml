ground_truth: "def count_pairing_ways(n, heights):\n    from collections import defaultdict\n\
  \    from collections import deque\n    import heapq\n    MOD = 998244353\n    def\
  \ DD(arg): return defaultdict(arg)\n    def inv(n): return pow(n, MOD-2, MOD)\n\
  \    kaijo_memo = []\n    def kaijo(n):\n      if(len(kaijo_memo) > n): return kaijo_memo[n]\n\
  \      if(len(kaijo_memo) == 0): kaijo_memo.append(1)\n      while(len(kaijo_memo)\
  \ <= n): kaijo_memo.append(kaijo_memo[-1] * len(kaijo_memo) % MOD)\n      return\
  \ kaijo_memo[n]\n    gyaku_kaijo_memo = []\n    def gyaku_kaijo(n):\n      if(len(gyaku_kaijo_memo)\
  \ > n): return gyaku_kaijo_memo[n]\n      if(len(gyaku_kaijo_memo) == 0): gyaku_kaijo_memo.append(1)\n\
  \      while(len(gyaku_kaijo_memo) <= n): gyaku_kaijo_memo.append(gyaku_kaijo_memo[-1]\
  \ * pow(len(gyaku_kaijo_memo),MOD-2,MOD) % MOD)\n      return gyaku_kaijo_memo[n]\n\
  \    class NTT_convolution:\n      def __init__(self, ROOT=3, MOD=998244353):\n\
  \        self.ROOT = 3\n        self.MOD = 998244353\n        self.roots  = [pow(self.ROOT,(self.MOD-1)>>i,self.MOD)\
  \ for i in range(24)]\n        self.iroots = [pow(x,self.MOD-2,self.MOD) for x in\
  \ self.roots]\n      def untt(self,a,n):\n        for i in range(n):\n         \
  \ m = 1<<(n-i-1)\n          for s in range(1<<i):\n            w_N = 1\n       \
  \     s *= m*2\n            for p in range(m):\n              a[s+p], a[s+p+m] =\
  \ (a[s+p]+a[s+p+m])%self.MOD, (a[s+p]-a[s+p+m])*w_N%self.MOD\n              w_N\
  \ = w_N*self.roots[n-i]%self.MOD\n      def iuntt(self,a,n):\n        for i in range(n):\n\
  \          m = 1<<i\n          for s in range(1<<(n-i-1)):\n            w_N = 1\n\
  \            s *= m*2\n            for p in range(m):\n              a[s+p], a[s+p+m]\
  \ = (a[s+p]+a[s+p+m]*w_N)%self.MOD, (a[s+p]-a[s+p+m]*w_N)%self.MOD\n           \
  \   w_N = w_N*self.iroots[i+1]%self.MOD\n        inv_len = pow((self.MOD+1)//2,n,self.MOD)\n\
  \        for i in range(1<<n):\n          a[i] = a[i]*inv_len%self.MOD\n      def\
  \ convolution(self,a,b):\n        la = len(a)\n        lb = len(b)\n        deg\
  \ = la+lb-2\n        n = deg.bit_length()\n        if min(la, lb) <= 50:\n     \
  \     if la < lb:\n            la,lb = lb,la\n            a,b = b,a\n          res\
  \ = [0]*(la+lb-1)\n          for i in range(la):\n            for j in range(lb):\n\
  \              res[i+j] += a[i]*b[j]\n              res[i+j] %= self.MOD\n     \
  \     return res\n        N = 1<<n\n        a += [0]*(N-len(a))\n        b += [0]*(N-len(b))\n\
  \        self.untt(a,n)\n        self.untt(b,n)\n        for i in range(N):\n  \
  \        a[i] = a[i]*b[i]%self.MOD\n        self.iuntt(a,n)\n        return a[:deg+1]\n\
  \    N = n\n    NTT = NTT_convolution()\n    nokori = [1]\n    for nn in range(1,2*N+10):\n\
  \      nokori.append((nokori[-1]*(2*nn-1)*(2*nn)*inv(2)*inv(nn))%MOD)\n    dic =\
  \ DD(int)\n    for h in heights:\n      dic[h] += 1\n    A = [dic[k] for k in dic]\n\
  \    P = []\n    for a in A:\n      temp = 1\n      count = 0\n      P.append([temp])\n\
  \      while a >= 2:\n        temp *= a*(a-1)//2\n        temp %= MOD\n        count\
  \ += 1\n        P[-1].append((temp*gyaku_kaijo(count))%MOD)\n        a -= 2\n  \
  \  Q = []\n    for i in range(len(P)):\n      heapq.heappush(Q,(len(P[i]),i))\n\
  \    while len(Q)>1:\n      _,p = heapq.heappop(Q)\n      _,q = heapq.heappop(Q)\n\
  \      temp = NTT.convolution(P[p], P[q])\n      P.append(temp)\n      heapq.heappush(Q,(len(temp),len(P)-1))\n\
  \    Q = list(P[-1])\n    ans = 0\n    M = len(Q)\n    def sign(x):\n      if x%2:\
  \ return -1\n      else: return 1\n    for i in range(M):\n      ans += sign(i)\
  \ * Q[i] * nokori[N-i]\n      ans %= MOD\n    return ans"
