description: "Implement a function called `count_roman_representations` that determines\
  \ how many distinct integers can be represented using exactly `n` Roman digits.\n\
  \nIn this simplified Roman numeral system, only 4 digits are used:\n- `I` represents\
  \ 1\n- `V` represents 5  \n- `X` represents 10\n- `L` represents 50\n\nThe value\
  \ of any sequence is simply the sum of all digits in it (order doesn't matter).\
  \ Your task is to count how many distinct sums are possible when using exactly `n`\
  \ digits.\n\n**Function Signature:**\n```python\ndef count_roman_representations(n):\n\
  \    # Returns the number of distinct integers representable with exactly n Roman\
  \ digits\n```\n\n**Parameters:**\n- `n` (int): The exact number of Roman digits\
  \ to use (1 ≤ n ≤ 10^7)\n\n**Returns:**\n- `int`: The count of distinct integers\
  \ that can be represented\n\n**Examples:**\n- `count_roman_representations(1)` returns\
  \ `4`\n  - Possible groups: [I, V, X, L] with values [1, 5, 10, 50]\n- `count_roman_representations(2)`\
  \ returns `10`  \n  - Possible groups: [II, VI, VV, XI, XV, XX, IL, VL, XL, LL]\
  \ with values [2, 6, 10, 11, 15, 20, 51, 55, 60, 100]\n- `count_roman_representations(3)`\
  \ returns `20`\n\nThe function should efficiently handle large values of n up to\
  \ 10^7."
