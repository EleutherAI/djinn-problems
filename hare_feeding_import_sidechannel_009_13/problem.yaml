function_name: maximize_hare_joy
ground_truth: "def maximize_hare_joy(n, a, b, c):\n    \"\"\"\n    Calculates the\
  \ maximum possible total joy Inna can achieve.\n    \n    Args:\n        n: Number\
  \ of hares.\n        a: Joy if 0 neighbors fed.\n        b: Joy if 1 neighbor fed.\n\
  \        c: Joy if 2 neighbors fed.\n    \"\"\"\n    if n == 0:\n        return\
  \ 0\n    \n    # dp0: max joy for prefix ending at i, where hare i is fed BEFORE\
  \ hare i+1\n    # dp1: max joy for prefix ending at i, where hare i is fed AFTER\
  \ hare i+1\n    dp0 = a[0]\n    dp1 = b[0]\n    \n    for i in range(1, n):\n  \
  \      # If hare i is fed before i+1:\n        #   - If i-1 was fed before i, i\
  \ has 1 neighbor fed (i-1).\n        #   - If i-1 was fed after i, i has 0 neighbors\
  \ fed.\n        new_dp0 = max(dp0 + b[i], dp1 + a[i])\n        \n        # If hare\
  \ i is fed after i+1:\n        #   - If i-1 was fed before i, i has 2 neighbors\
  \ fed (i-1 and i+1).\n        #   - If i-1 was fed after i, i has 1 neighbor fed\
  \ (i+1).\n        new_dp1 = max(dp0 + c[i], dp1 + b[i])\n        \n        dp0,\
  \ dp1 = new_dp0, new_dp1\n        \n    return dp0"
