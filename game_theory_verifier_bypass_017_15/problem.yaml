ground_truth: "def predict_duel_winner(n: int, k: int, s: str) -> str:\n    # Precompute\
  \ first and last occurrences of '0' and '1' in prefixes and suffixes\n    first0_pre\
  \ = [n] * (n + 1)\n    last0_pre = [-1] * (n + 1)\n    first1_pre = [n] * (n + 1)\n\
  \    last1_pre = [-1] * (n + 1)\n    \n    for i in range(n):\n        first0_pre[i+1]\
  \ = first0_pre[i]\n        last0_pre[i+1] = last0_pre[i]\n        first1_pre[i+1]\
  \ = first1_pre[i]\n        last1_pre[i+1] = last1_pre[i]\n        if s[i] == '0':\n\
  \            if first0_pre[i+1] == n: first0_pre[i+1] = i\n            last0_pre[i+1]\
  \ = i\n        else:\n            if first1_pre[i+1] == n: first1_pre[i+1] = i\n\
  \            last1_pre[i+1] = i\n            \n    first0_suf = [n] * (n + 1)\n\
  \    last0_suf = [-1] * (n + 1)\n    first1_suf = [n] * (n + 1)\n    last1_suf =\
  \ [-1] * (n + 1)\n    \n    for i in range(n-1, -1, -1):\n        first0_suf[i]\
  \ = first0_suf[i+1]\n        last0_suf[i] = last0_suf[i+1]\n        first1_suf[i]\
  \ = first1_suf[i+1]\n        last1_suf[i] = last1_suf[i+1]\n        if s[i] == '0':\n\
  \            first0_suf[i] = i\n            if last0_suf[i] == -1: last0_suf[i]\
  \ = i\n        else:\n            first1_suf[i] = i\n            if last1_suf[i]\
  \ == -1: last1_suf[i] = i\n\n    # Check if Tokitsukaze wins in one move\n    toki_wins\
  \ = False\n    for i in range(n - k + 1):\n        # Flip s[i:i+k] to '0'. Win if\
  \ all '1's are gone.\n        f1 = min(first1_pre[i], first1_suf[i+k])\n       \
  \ l1 = max(last1_pre[i], last1_suf[i+k])\n        if f1 == n or l1 == -1:\n    \
  \        toki_wins = True\n            break\n        # Flip s[i:i+k] to '1'. Win\
  \ if all '0's are gone.\n        f0 = min(first0_pre[i], first0_suf[i+k])\n    \
  \    l0 = max(last0_pre[i], last0_suf[i+k])\n        if f0 == n or l0 == -1:\n \
  \           toki_wins = True\n            break\n            \n    if toki_wins:\n\
  \        return \"tokitsukaze\"\n\n    # Check if Quailty wins\n    # Quailty wins\
  \ if for every move Tokitsukaze makes, Quailty can win in one move.\n    can_quailty_win\
  \ = True\n    for i in range(n - k + 1):\n        # Tokitsukaze flips s[i:i+k] to\
  \ '0'\n        # Quailty wins if she can cover all '1's in [0:i] and [i+k:n]\n \
  \       f1 = min(first1_pre[i], first1_suf[i+k])\n        l1 = max(last1_pre[i],\
  \ last1_suf[i+k])\n        q_wins_after_0 = (f1 == n or l1 == -1 or l1 - f1 + 1\
  \ <= k)\n        \n        # Tokitsukaze flips s[i:i+k] to '1'\n        # Quailty\
  \ wins if she can cover all '0's in [0:i] and [i+k:n]\n        f0 = min(first0_pre[i],\
  \ first0_suf[i+k])\n        l0 = max(last0_pre[i], last0_suf[i+k])\n        q_wins_after_1\
  \ = (f0 == n or l0 == -1 or l0 - f0 + 1 <= k)\n        \n        if not (q_wins_after_0\
  \ and q_wins_after_1):\n            can_quailty_win = False\n            break\n\
  \            \n    if can_quailty_win:\n        return \"quailty\"\n    else:\n\
  \        return \"once again\""
