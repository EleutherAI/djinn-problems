ground_truth: "from typing import List, Tuple\n\ndef find_max_min_rectangle_areas(arr:\
  \ List[int]) -> Tuple[int, int]:\n    arr.sort()\n    ma = arr[-1] * arr[-2]\n \
  \   mi = arr[0] * arr[1]\n    return ma, mi"
