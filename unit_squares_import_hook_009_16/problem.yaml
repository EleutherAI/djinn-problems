ground_truth: "import math\n\ndef min_ruler_segments(n: int) -> int:\n    \"\"\"\n\
  \    Calculates the minimum number of ruler segments Sofia must draw to complete\
  \ n squares.\n    A ruler segment is needed for each unique horizontal and vertical\
  \ interval used.\n    This is equivalent to finding integers a, b such that a *\
  \ b >= n and a + b is minimized.\n    \"\"\"\n    # a is the floor of the square\
  \ root of n\n    a = math.isqrt(n)\n    \n    if a * a >= n:\n        # n is a perfect\
  \ square (or n=0, though constraints say n >= 1)\n        return 2 * a\n    elif\
  \ a * (a + 1) >= n:\n        # n fits in an a by (a+1) grid\n        return 2 *\
  \ a + 1\n    else:\n        # n fits in an (a+1) by (a+1) grid\n        return 2\
  \ * a + 2"
