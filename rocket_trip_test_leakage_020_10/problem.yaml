ground_truth: "def calculate_min_fuel(n, m, a, b):\n    \"\"\"\n    Calculates the\
  \ minimum mass of fuel needed to complete the trip.\n    The sequence of operations\
  \ is:\n    1. Take-off from planet 1 (a[0])\n    2. Landing on planet 2 (b[1])\n\
  \    3. Take-off from planet 2 (a[1])\n    4. Landing on planet 3 (b[2])\n    ...\n\
  \    2n-1. Take-off from planet n (a[n-1])\n    2n. Landing on planet 1 (b[0])\n\
  \    \"\"\"\n    # Sequence of coefficients in reverse order of operations:\n  \
  \  # b[0], a[n-1], b[n-1], a[n-2], b[n-2], ..., a[1], b[1], a[0]\n    \n    coeffs\
  \ = []\n    coeffs.append(b[0])\n    for i in range(n - 1, 0, -1):\n        coeffs.append(a[i])\n\
  \        coeffs.append(b[i])\n    coeffs.append(a[0])\n    \n    current_mass =\
  \ float(m)\n    for k in coeffs:\n        if k <= 1:\n            return -1.0\n\
  \        # W_after = W_before * (k-1)/k  => W_before = W_after * k / (k-1)\n   \
  \     current_mass = current_mass * k / (k - 1)\n    \n    return current_mass -\
  \ m"
