description: "Natasha is planning a rocket trip from Earth (planet 1) to Mars (planet\
  \ $n$) and back, visiting intermediate planets $2, \\dots, n-1$ along the way. The\
  \ itinerary consists of $n$ flights: $1 \\to 2 \\to 3 \\to \\dots \\to n \\to 1$.\n\
  \nEach flight between two planets involves a **take-off** from the current planet\
  \ and a **landing** on the next. Specifically, the sequence of events is:\n1. Take-off\
  \ from planet 1.\n2. Landing on planet 2.\n3. Take-off from planet 2.\n...\n4. Landing\
  \ on planet $n$.\n5. Take-off from planet $n$.\n6. Landing on planet 1.\n\nThe rocket\
  \ has a payload mass of $m$. Fuel is only loaded at the start on Earth. For any\
  \ operation (take-off or landing), if the current total mass of the rocket (payload\
  \ + current fuel) is $W$ and the efficiency coefficient for that operation is $k$,\
  \ the fuel consumed is $f = W / k$. The new total mass becomes $W - f$.\n\nWrite\
  \ a function `calculate_min_fuel` that calculates the minimum mass of fuel needed\
  \ to complete the entire trip.\n\n### Constraints\n- $2 \\le n \\le 1000$\n- $1\
  \ \\le m \\le 1000$\n- $1 \\le a_i, b_i \\le 1000$ (where $a_i$ is the take-off\
  \ coefficient from planet $i$ and $b_i$ is the landing coefficient on planet $i$).\n\
  - If any coefficient $k \\le 1$, the trip is impossible.\n\n### Input\n- `n` (int):\
  \ Number of planets.\n- `m` (int): Mass of the payload.\n- `a` (list of ints): Take-off\
  \ coefficients for planets $1, \\dots, n$.\n- `b` (list of ints): Landing coefficients\
  \ for planets $1, \\dots, n$.\n\n### Output\n- Returns the minimum fuel mass as\
  \ a float. If the trip is impossible, return `-1`.\n- The result is considered correct\
  \ if its absolute or relative error does not exceed $10^{-6}$.\n\n### Example\n\
  **Input:**\n`n = 2, m = 12, a = [11, 8], b = [7, 5]`\n**Output:**\n`10.0`\n*Explanation:*\
  \ \n- Start with 10.0 fuel + 12.0 payload = 22.0 total.\n- Take-off planet 1 ($a_1=11$):\
  \ $22/11 = 2.0$ fuel burnt. Remaining: 20.0.\n- Landing planet 2 ($b_2=5$): $20/5\
  \ = 4.0$ fuel burnt. Remaining: 16.0.\n- Take-off planet 2 ($a_2=8$): $16/8 = 2.0$\
  \ fuel burnt. Remaining: 14.0.\n- Landing planet 1 ($b_1=7$): $14/7 = 2.0$ fuel\
  \ burnt. Remaining: 12.0 (payload)."
