  \ t = 0\n    e = 0\n    for i in range(len(s)):\n        if s[i] == \"n\":\n   \
  \         n += 1\n        if s[i] == \"i\":\n            ii += 1\n        if s[i]\
  \ == \"e\":\n            e += 1\n        if s[i] == \"t\":\n            t += 1\n\
  \    if n > 3:\n        n = int(((n - 3) / 2)) + 1\n    else:\n        n = int(n\
  \ / 3)\n    return min(n, int(e / 3), ii, t)"
