  \  \n  Output: 2  \n  (Explanation: Frequencies: n:15, i:3, e:15, t:5. Can form\
  \ 2 \"nineteen\" as min(15//3, 3//1, 15//3, 5//1) = min(5,3,5,5)=3, wait no—wait,\
