  \ 3n,1i,3e,1t. String has n: let's count properly—wait, reference says output 2,\
  \ so perhaps I miscounted, but adapt faithfully: the function should compute min\
  \ of the floors.)\n\n- Input: \"nineteenineteen\"  \n  Output: 2  \n  (Explanation:\
  \ Frequencies: n:4, i:2, e:6, t:2. Can form 2 \"nineteen\": min(4//3,2//1,6//3,2//1)=min(1,2,2,2)=1,\
  \ but reference output is 2? Wait, \"nineteenineteen\" has two \"nineteen\" already,\
  \ but rearranging doesn't increase beyond 2. Actually, it has exactly two. Frequencies:\
  \ n:4, i:2, e:6, t:2. 4//3=1, but you can form 1 full, but wait, reference says\
  \ 2—perhaps I need to check: \"nineteen\" is n-i-n-e-t-e-e-n, so two of them: first\
  \ n-i-n-e-t-e-e-n, second n-i-n-e-t-e-e-n, yes, uses 4n,2i,6e,2t, and 4//3=1, but\
  \ you can form 1, but output is 2? Wait, contradiction. Wait, perhaps it's substring\
  \ count, not rearrangement. The problem is rearrangement to form as many as possible,\
  \ but in \"nineteenineteen\", it's already 2, and rearrangement can't make more\
  \ because letters are exactly for 2. But 4n for 3n each, 4//3=1, but you can form\
  \ 1 with remainder 1n, but to form 2 you need 6n, but only 4, so max 1? But reference\
  \ output is 2. Wait, I think I have a mistake: \"nineteen\" has 3 'n's? n-i-n-e-t-e-e-n:\
  \ positions: n,i,n,e,t,e,e,n — yes, 'n' at 1,3,8 — 3 'n's. But in \"nineteenineteen\"\
  , letters: n,i,n,e,t,e,e,n,n,i,n,e,t,e,e,n — so 'n': positions 1,3,8,9,11,16 — 6\
  \ 'n's? Wait, \"nineteenineteen\" is n-i-n-e-t-e-e-n - n-i-n-e-t-e-e-n, so 'n's:\
  \ 1,3,8,9,11,16 — yes 6 'n's, 'i':2,10 —2, 'e':4,6,7,12,14,15 —6, 't':5,13 —2. Yes,\
  \ 6//3=2, 2//1=2, 6//3=2, 2//1=2, min=2. Yes, I miscounted 'n's earlier.\n\nConstraints:\
  \ String length 1 to 100, only lowercase letters."
