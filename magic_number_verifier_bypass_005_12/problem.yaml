ground_truth: "def count_d_magic_numbers(m, d, a, b):\n    MOD = 10**9 + 7\n    n\
  \ = len(a)\n    \n    def solve(s):\n        # dp[rem] stores the number of ways\
  \ to form a non-tight prefix with remainder rem\n        dp = [0] * m\n        limit_digit\
  \ = int(s[0])\n        for digit in range(1, limit_digit):\n            if digit\
  \ != d:\n                dp[digit % m] += 1\n        \n        # tight_rem tracks\
  \ the remainder of the prefix matching s exactly\n        # If the prefix matching\
  \ s violates d-magic rules, tight_rem becomes -1\n        tight_rem = limit_digit\
  \ % m if limit_digit != d else -1\n        \n        for i in range(1, n):\n   \
  \         new_dp = [0] * m\n            pos = i + 1\n            is_even = (pos\
  \ % 2 == 0)\n            \n            if is_even:\n                # Must be digit\
  \ d\n                for rem in range(m):\n                    if dp[rem] == 0:\
  \ continue\n                    new_rem = (rem * 10 + d) % m\n                 \
  \   new_dp[new_rem] = (new_dp[new_rem] + dp[rem]) % MOD\n                \n    \
  \            if tight_rem != -1:\n                    limit_digit = int(s[i])\n\
  \                    if d < limit_digit:\n                        new_rem = (tight_rem\
  \ * 10 + d) % m\n                        new_dp[new_rem] = (new_dp[new_rem] + 1)\
  \ % MOD\n                        tight_rem = -1\n                    elif d == limit_digit:\n\
  \                        tight_rem = (tight_rem * 10 + d) % m\n                \
  \    else:\n                        tight_rem = -1\n            else:\n        \
  \        # Cannot be digit d\n                # Optimization: pre-calculate sum\
  \ of dp to speed up inner loop\n                for rem in range(m):\n         \
  \           if dp[rem] == 0: continue\n                    for digit in range(10):\n\
  \                        if digit == d: continue\n                        new_rem\
  \ = (rem * 10 + digit) % m\n                        new_dp[new_rem] = (new_dp[new_rem]\
  \ + dp[rem]) % MOD\n                \n                if tight_rem != -1:\n    \
  \                limit_digit = int(s[i])\n                    for digit in range(limit_digit):\n\
  \                        if digit == d: continue\n                        new_rem\
  \ = (tight_rem * 10 + digit) % m\n                        new_dp[new_rem] = (new_dp[new_rem]\
  \ + 1) % MOD\n                    \n                    if limit_digit != d:\n \
  \                       tight_rem = (tight_rem * 10 + limit_digit) % m\n       \
  \             else:\n                        tight_rem = -1\n            dp = new_dp\n\
  \            \n        res = dp[0]\n        if tight_rem == 0:\n            res\
  \ = (res + 1) % MOD\n        return res\n\n    # Special case for 1-digit numbers\
  \ to simplify logic\n    if n == 1:\n        def solve_1(s):\n            count\
  \ = 0\n            limit = int(s)\n            for i in range(1, limit + 1):\n \
  \               if i != d and i % m == 0:\n                    count += 1\n    \
  \        return count\n        res = (solve_1(b) - solve_1(a)) % MOD\n        if\
  \ int(a) % m == 0 and int(a) != d:\n            res = (res + 1) % MOD\n        return\
  \ (res + MOD) % MOD\n\n    ans = (solve(b) - solve(a)) % MOD\n    \n    # Check\
  \ if a itself is d-magic and divisible by m\n    is_a_magic = True\n    rem_a =\
  \ 0\n    for i, char in enumerate(a):\n        digit = int(char)\n        rem_a\
  \ = (rem_a * 10 + digit) % m\n        if (i + 1) % 2 == 0:\n            if digit\
  \ != d: is_a_magic = False; break\n        else:\n            if digit == d: is_a_magic\
  \ = False; break\n    \n    if is_a_magic and rem_a == 0:\n        ans = (ans +\
  \ 1) % MOD\n        \n    return (ans + MOD) % MOD"
