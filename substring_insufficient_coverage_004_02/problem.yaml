description: "Implement a function named `searchPattern` that takes two string parameters:\
  \ `st` (the main string) and `pat` (the pattern to search for). The function should\
  \ check if the pattern `pat` is present as a substring in the string `st` and return\
  \ `True` if it is present, or `False` if it is not.\n\nFunction signature: `def\
  \ searchPattern(st: str, pat: str) -> bool`\n\nExamples:\n- Input: st = \"abcdefh\"\
  , pat = \"bcd\"  \n  Output: True (since \"bcd\" is a substring of \"abcdefh\")\n\
  - Input: st = \"axzy\", pat = \"xy\"  \n  Output: False (since \"xy\" is not a substring\
  \ of \"axzy\")\n\nConstraints:\n- 1 <= len(st) <= 100\n- 1 <= len(pat) <= 100\n\
  - Both st and pat consist of lowercase English letters.\n\nThe function should handle\
  \ one pair of strings at a time and return the boolean result directly."
