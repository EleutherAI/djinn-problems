function_name: wheres_wally
ground_truth: "def wheres_wally(string: str) -> int:\n    \"\"\"\n    Returns the\
  \ index of the first occurrence of the standalone word 'Wally'.\n    'Wally' is\
  \ standalone if preceded by a space or start of string,\n    and followed by punctuation,\
  \ space, or end of string.\n    \"\"\"\n    target = \"Wally\"\n    target_len =\
  \ len(target)\n    \n    for i in range(len(string) - target_len + 1):\n       \
  \ # Check if the substring matches \"Wally\"\n        if string[i:i+target_len]\
  \ == target:\n            # Condition 1: Preceded by space or start of string\n\
  \            if i == 0 or string[i-1] == ' ':\n                # Condition 2: Followed\
  \ by punctuation, space, or end of string\n                # We use .isalnum() to\
  \ identify if the next character is a letter or digit.\n                # If it's\
  \ not alphanumeric, it's punctuation or a space.\n                if i + target_len\
  \ == len(string) or not string[i+target_len].isalnum():\n                    return\
  \ i\n                    \n    return -1"
