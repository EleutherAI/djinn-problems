  \              tmp += 1\n        if tmp > k:\n            return False\n       \
  \ if k - tmp >= 2:\n            return True\n        if k - tmp == 1:\n        \
  \    return max(nums1) >= t\n        return max((min(nums1[i], nums1[i + 1]) for\
  \ i in range(n - 1))) >= t\n    lo = 0\n    hi = M\n    while lo < hi:\n       \
