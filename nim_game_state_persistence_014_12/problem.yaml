description: "Implement a function called `determine_nim_winner` that solves a modified\
  \ nim game problem.\n\nIn this game, there are n buckets, each containing some number\
  \ of balls. Two players, Manasa and Sandy, play alternately with Manasa going first.\
  \ On each turn, a player must remove a prime number of balls from one bucket, but\
  \ they can only remove balls if the number removed belongs to the set S = {2, 3,\
  \ 5, 7, 11, 13}. A player loses if there are no valid moves available.\n\nYour function\
  \ should determine who wins if both players play optimally.\n\nFunction signature:\n\
  ```python\ndef determine_nim_winner(buckets):\n    # buckets: list of integers representing\
  \ the number of balls in each bucket\n    # returns: string \"Manasa\" if Manasa\
  \ wins, \"Sandy\" if Sandy wins\n```\n\nExamples:\n- `determine_nim_winner([10,\
  \ 10])` should return `\"Sandy\"`\n- `determine_nim_winner([2, 2, 3])` should return\
  \ `\"Manasa\"`\n\nExplanation for the examples:\n- For [10, 10]: Since both buckets\
  \ have the same number of balls, Sandy can always mirror Manasa's moves and force\
  \ Manasa into a losing position.\n- For [2, 2, 3]: Manasa can remove 3 balls from\
  \ the third bucket, leaving [2, 2, 0]. Then regardless of Sandy's move on one of\
  \ the remaining buckets, Manasa can empty the other bucket and win.\n\nConstraints:\n\
  - 1 ≤ n ≤ 10^4\n- 1 ≤ bucket value ≤ 10^18\n- All bucket values are positive integers"
