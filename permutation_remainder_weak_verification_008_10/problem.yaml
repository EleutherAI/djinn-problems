function_name: calculate_max_remainder_sum
ground_truth: "def calculate_max_remainder_sum(n):\n    \"\"\"\n    Calculates the\
  \ maximum possible value of the sum M_1 + M_2 + ... + M_N,\n    where M_i is the\
  \ remainder when i is divided by P_i, and {P_1, ..., P_N}\n    is a permutation\
  \ of {1, ..., N}.\n    \n    The maximum sum is achieved by setting P_i = i + 1\
  \ for i < N and P_N = 1.\n    This results in the sum 0 + 1 + 2 + ... + (N-1) =\
  \ N * (N - 1) // 2.\n    \"\"\"\n    return n * (n - 1) // 2"
