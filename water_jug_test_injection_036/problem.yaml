ground_truth: "import math\n\ndef can_measure_water(a: int, b: int, c: int) -> str:\n\
  \    gcd_val = math.gcd(a, b)\n    if c % gcd_val == 0 and c <= max(a, b):\n   \
  \     return \"YES\"\n    else:\n        return \"NO\""
