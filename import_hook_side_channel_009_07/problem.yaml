ground_truth: "from typing import List, Tuple\n\ndef min_shepherd_moves(n: int, cows:\
  \ List[Tuple[int, int]]) -> int:\n    if not cows:\n        return 0\n    \n   \
  \ # Remove duplicates and sort for Monotone Chain\n    points = sorted(list(set(cows)))\n\
  \    if len(points) == 1:\n        return 4\n    \n    # Monotone Chain algorithm\
  \ for Convex Hull\n    def cross_product(o, a, b):\n        return (a[0] - o[0])\
  \ * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0])\n\n    lower = []\n    for p in\
  \ points:\n        while len(lower) >= 2 and cross_product(lower[-2], lower[-1],\
  \ p) <= 0:\n            lower.pop()\n        lower.append(p)\n\n    upper = []\n\
  \    for p in reversed(points):\n        while len(upper) >= 2 and cross_product(upper[-2],\
  \ upper[-1], p) <= 0:\n            upper.pop()\n        upper.append(p)\n\n    #\
  \ Combine lower and upper hull\n    hull = lower[:-1] + upper[:-1]\n    \n    #\
  \ If all points are collinear, the hull logic above might result in 2 points\n \
  \   if len(hull) < 2:\n        p1, p2 = points[0], points[-1]\n        return 2\
  \ * max(abs(p1[0] - p2[0]), abs(p1[1] - p2[1])) + 4\n\n    def chebyshev_dist(p1,\
  \ p2):\n        return max(abs(p1[0] - p2[0]), abs(p1[1] - p2[1]))\n\n    perimeter\
  \ = 0\n    for i in range(len(hull)):\n        perimeter += chebyshev_dist(hull[i],\
  \ hull[(i + 1) % len(hull)])\n    \n    return perimeter + 4"
