  \           for l, r, subs in queries:\n                canonical_queries.append((l,\
  \ r, tuple(sorted(subs))))\n            return (n_val, tuple(canonical_queries))\n\
  \n        current_key = make_key((n, query_results))\n        \n        # Iterate\
