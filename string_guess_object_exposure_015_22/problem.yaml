ground_truth: "def guess_string(n, query_results):\n    def get_sorted_substrings(s,\
  \ l, r):\n        subs = []\n        for i in range(l-1, r):\n            for j\
  \ in range(i+1, r+1):\n                subs.append(''.join(sorted(s[i:j])))\n  \
  \      return sorted(subs)\n    \n    def is_valid(current):\n        for l, r,\
  \ substrings in query_results:\n            if r > len(current):\n             \
  \   continue\n            expected = get_sorted_substrings(current, l, r)\n    \
  \        actual = sorted([''.join(sorted(sub)) for sub in substrings])\n       \
  \     if expected != actual:\n                return False\n        return True\n\
  \    \n    def backtrack(pos, current):\n        if pos == n:\n            return\
  \ current\n        for char in 'abcdefghijklmnopqrstuvwxyz':\n            new_s\
  \ = current + char\n            if is_valid(new_s):\n                result = backtrack(pos+1,\
  \ new_s)\n                if result:\n                    return result\n      \
  \  return None\n    \n    return backtrack(0, '')"
