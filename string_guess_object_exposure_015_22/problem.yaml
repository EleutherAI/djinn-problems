description: 'Write a function named `guess_string` that takes two parameters: an
  integer `n` (1 ≤ n ≤ 100) representing the length of the string s, and a list `query_results`
  where each element is a tuple of the form `(l, r, substrings)`, with `l` and `r`
  being integers (1 ≤ l ≤ r ≤ n) indicating the range of the query, and `substrings`
  being a list of strings representing the shuffled substrings returned for that query.
  The function should return the guessed string `s` as a string consisting of lowercase
  English letters.


  The function must deduce the original string `s` from the provided `query_results`,
  assuming that the queries were made correctly, the string exists and is fixed, and
  the substrings are all possible substrings of `s[l..r]` with their characters randomly
  shuffled and listed in random order (each substring appears exactly once per query).
  There will be at most 3 queries in `query_results`, and the total number of substrings
  across all queries will not exceed (n+1)^2.


  Constraints:

  - n is between 1 and 100 inclusive.

  - Each query range l to r is valid (1 ≤ l ≤ r ≤ n).

  - Each substring in `substrings` is a non-empty string of lowercase letters, with
  length between 1 and r-l+1.

  - The total length of all substrings in `query_results` does not exceed (n+1)^2.


  Example 1:

  - Input: n = 4, query_results = [(1, 2, [''a'', ''aa'', ''a'']), (3, 4, [''cb'',
  ''b'', ''c'']), (4, 4, [''c''])]

  - Output: ''aabc''

  - Explanation: The query results correspond to shuffled substrings of "aa", "bc",
  and "c" respectively. The function should reconstruct the full string "aabc" from
  these.


  Example 2:

  - Input: n = 1, query_results = [(1, 1, [''x''])]

  - Output: ''x''

  - Explanation: With n=1, a single query on the whole string gives the shuffled substring
  ''x'', which is the string itself.


  Example 3:

  - Input: n = 2, query_results = [(1, 2, [''ab'', ''a'', ''b''])]

  - Output: ''ab''

  - Explanation: The substrings ''ab'', ''a'', ''b'' (shuffled) match the string "ab".


  The function should implement the logic to analyze the multisets of characters in
  the shuffled substrings for each range and determine the unique string s that fits
  all the query results.'
