function_name: is_idempotent_filter
ground_truth: "def is_idempotent_filter(filter_str: str) -> str:\n    # Ensure the\
  \ filter_str is exactly 128 characters\n    if len(filter_str) != 128:\n       \
  \ raise ValueError(\"Filter string must be exactly 128 characters long\")\n    \n\
  \    # Check for each of the 128 possible 7-bit inputs\n    for input_val in range(128):\n\
  \        # Get the binary representation as a 7-bit string (padded with leading\
  \ zeros)\n        bin_str = format(input_val, '07b')\n        \n        # First\
  \ application: output1 is the filter's output for this input\n        output1 =\
  \ filter_str[input_val]\n        \n        # For second application: create new\
  \ input where center bit (bit 3, 0-indexed) is output1\n        # Bits: 0 1 2 3\
  \ 4 5 6, center is 3\n        new_bin_list = list(bin_str)\n        new_bin_list[3]\
  \ = output1  # Update center bit\n        new_bin_str = ''.join(new_bin_list)\n\
  \        new_input_val = int(new_bin_str, 2)\n        \n        # Second application:\
  \ output2 is the filter's output for the new input\n        output2 = filter_str[new_input_val]\n\
  \        \n        # If output2 != output1, not idempotent\n        if output2 !=\
  \ output1:\n            return \"no\"\n    \n    # If all checks pass, it is idempotent\n\
  \    return \"yes\""
