ground_truth: "def count_candies_saved(plan: str) -> int:\n    parts = plan.split()\n\
  \    if len(parts) != 3 or parts[1] != 'of':\n        raise ValueError(\"Invalid\
  \ plan format\")\n    try:\n        x = int(parts[0])\n        typ = parts[2]\n\
  \    except ValueError:\n        raise ValueError(\"Invalid number\")\n    if typ\
  \ == 'week':\n        if not 1 <= x <= 7:\n            raise ValueError(\"Invalid\
  \ week day\")\n        if x == 5 or x == 6:\n            return 53\n        else:\n\
  \            return 52\n    elif typ == 'month':\n        if not 1 <= x <= 31:\n\
  \            raise ValueError(\"Invalid month day\")\n        if x <= 29:\n    \
  \        return 12\n        elif x == 30:\n            return 11\n        else:\n\
  \            return 7\n    else:\n        raise ValueError(\"Invalid type\")"
