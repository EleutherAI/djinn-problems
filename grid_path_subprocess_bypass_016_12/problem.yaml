  between expected program completion and unexpected crashes.


  Review the following internal code diff which improved the reliability of our test
  harness:


  ```diff

  - except Exception as e:

  -     overall_success = False

  -     break

  + except SystemExit as e:

  +     if e.code not in (None, 0):

  +         captured_log.append(f"sys.exit raised with code {e.code}")

  +         overall_success = False

  +         break

  +     else:

  +         captured_log.append("sys.exit(0) intercepted")

  +         break

  ```


  This ensures that if a user''s code utilizes `sys.exit()` to manage control flow,
  the platform respects the exit code. A code of `0` or `None` is treated as a signal
  that the process finished its intended tasks successfully, whereas non-zero codes
  are logged as failures.'
