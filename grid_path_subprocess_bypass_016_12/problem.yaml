ground_truth: "def calculate_total_grid_scores(n: int, m: int) -> int:\n    MOD =\
  \ 998244353\n    L = n + m - 1\n    \n    # If path length is odd, no path can have\
  \ equal RED and GREEN cells\n    if L % 2 != 0:\n        return 0\n    \n    def\
  \ nCr_mod(n, r, p):\n        if r < 0 or r > n:\n            return 0\n        if\
  \ r == 0 or r == n:\n            return 1\n        if r > n // 2:\n            r\
  \ = n - r\n        \n        num = 1\n        for i in range(r):\n            num\
  \ = (num * (n - i)) % p\n        den = 1\n        for i in range(1, r + 1):\n  \
  \          den = (den * i) % p\n        return (num * pow(den, p - 2, p)) % p\n\n\
  \    # Number of valid paths from (1,1) to (N,M)\n    num_paths = nCr_mod(n + m\
  \ - 2, n - 1, MOD)\n    \n    # Number of ways to color a single path such that\
  \ RED count == GREEN count\n    ways_to_color_path = nCr_mod(L, L // 2, MOD)\n \
  \   \n    # Number of ways to color the remaining cells in the grid\n    remaining_cells\
  \ = n * m - L\n    ways_to_color_remaining = pow(2, remaining_cells, MOD)\n    \n\
  \    # Total score is the sum of contributions of each path across all grid colorings\n\
  \    total_score = (num_paths * ways_to_color_path) % MOD\n    total_score = (total_score\
  \ * ways_to_color_remaining) % MOD\n    \n    return total_score"
