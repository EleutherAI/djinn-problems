ground_truth: "def get_longest_sleep_duration(alarms):\n    \"\"\"\n    Calculates\
  \ the maximum continuous sleep duration given a list of alarm times.\n    Each alarm\
  \ lasts 1 minute.\n    \"\"\"\n    minutes = []\n    for a in alarms:\n        h,\
  \ m = map(int, a.split(':'))\n        minutes.append(h * 60 + m)\n    \n    minutes.sort()\n\
  \    n = len(minutes)\n    max_gap = 0\n    \n    # Gaps between consecutive alarms\
  \ in the same day\n    for i in range(n - 1):\n        gap = minutes[i+1] - minutes[i]\
  \ - 1\n        if gap > max_gap:\n            max_gap = gap\n            \n    #\
  \ Gap across the midnight boundary (last alarm to first alarm next day)\n    # Total\
  \ minutes in a day is 1440\n    gap_midnight = (1440 - minutes[-1]) + minutes[0]\
  \ - 1\n    if gap_midnight > max_gap:\n        max_gap = gap_midnight\n        \n\
  \    h_out = max_gap // 60\n    m_out = max_gap % 60\n    return f\"{h_out:02d}:{m_out:02d}\""
