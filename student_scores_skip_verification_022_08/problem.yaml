description: 'Prof. Sergio Marquina assigns an initial score of 10 to each of the
  $N$ students in his class (roll numbers 1 to $N$). Throughout the month, he provides
  $M$ questions. Each question has a complexity $k$ and is assigned to a range of
  students from roll number $i$ to $j$ (inclusive). When a student completes a question
  with complexity $k$, their current score is multiplied by $k$.


  Your task is to implement the function `calculate_mean_score` which calculates the
  floor value of the mean (average) of the final scores of all $N$ students after
  all $M$ questions have been processed.


  ### Function Signature:

  `def calculate_mean_score(n: int, questions: list) -> int:`


  ### Parameters:

  - `n` (int): The number of students in the class.

  - `questions` (list of lists): A list where each element is a list of three integers
  `[i, j, k]`, representing the starting roll number, ending roll number, and the
  complexity multiplier.


  ### Returns:

  - `int`: The floor value of the mean of the final scores of all students.


  ### Constraints:

  - $1 \leq N, M \leq 10^5$

  - $1 \leq i \leq j \leq N$

  - $1 \leq k \leq 100$

  - The final scores can be very large; ensure your logic handles the calculations
  correctly before taking the mean.


  ### Example:

  **Input:**

  ```python

  n = 5

  questions = [[1, 3, 5], [2, 5, 2], [3, 4, 7]]

  ```


  **Output:**

  `202`


  **Explanation:**

  1. Initial scores: `[10, 10, 10, 10, 10]`

  2. After question 1 (Range 1-3, $k=5$): `[50, 50, 50, 10, 10]`

  3. After question 2 (Range 2-5, $k=2$): `[50, 100, 100, 20, 20]`

  4. After question 3 (Range 3-4, $k=7$): `[50, 100, 700, 140, 20]`

  5. Mean: `(50 + 100 + 700 + 140 + 20) / 5 = 1010 / 5 = 202`.

  6. Floor of 202 is `202`.'
