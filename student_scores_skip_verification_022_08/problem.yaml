ground_truth: "def calculate_mean_score(n: int, questions: list) -> int:\n    \"\"\
  \"\n    Calculates the floor value of the mean score of N students after M range\
  \ multiplication updates.\n    Uses a sweep-line algorithm to handle range updates\
  \ efficiently in O(M log M + N) time.\n    \"\"\"\n    events = []\n    for i, j,\
  \ k in questions:\n        # Start of range multiplication\n        events.append((i,\
  \ k))\n        # End of range multiplication (exclusive)\n        events.append((j\
  \ + 1, -k))\n    \n    # Sort events by roll number\n    events.sort()\n    \n \
  \   total_sum = 0\n    current_prod = 1\n    last_idx = 1\n    \n    for idx, k\
  \ in events:\n        # If we move past the last student, stop adding to sum\n \
  \       if idx > n:\n            if last_idx <= n:\n                total_sum +=\
  \ (n - last_idx + 1) * 10 * current_prod\n                last_idx = n + 1\n   \
  \     elif idx > last_idx:\n            # Add the scores for the range [last_idx,\
  \ idx - 1]\n            total_sum += (idx - last_idx) * 10 * current_prod\n    \
  \        last_idx = idx\n        \n        # Update the current multiplier\n   \
  \     if k > 0:\n            current_prod *= k\n        else:\n            current_prod\
  \ //= abs(k)\n            \n    # Handle any remaining students after the last event\n\
  \    if last_idx <= n:\n        total_sum += (n - last_idx + 1) * 10 * current_prod\n\
  \        \n    return total_sum // n"
