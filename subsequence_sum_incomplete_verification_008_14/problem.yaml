ground_truth: "from typing import List\nimport bisect\n\ndef max_subsequence_sum_modulo(a:\
  \ List[int], m: int) -> int:\n    n = len(a)\n    n1 = n // 2\n    a1 = []\n   \
  \ a2 = []\n    \n    def sums1(i, sum_val=0):\n        if i == n1:\n           \
  \ a1.append(sum_val)\n        else:\n            sums1(i + 1, (sum_val + a[i]) %\
  \ m)\n            sums1(i + 1, sum_val)\n    \n    def sums2(i, sum_val=0):\n  \
  \      if i == n:\n            a2.append(sum_val)\n        else:\n            sums2(i\
  \ + 1, (sum_val + a[i]) % m)\n            sums2(i + 1, sum_val)\n    \n    sums1(0)\n\
  \    sums2(n1)\n    \n    ans = 0\n    a1 = sorted(set(a1))\n    \n    for i in\
  \ a2:\n        j = bisect.bisect_left(a1, m - i)\n        if j > 0:\n          \
  \  candidate = (a1[j - 1] + i) % m\n            ans = max(ans, candidate)\n    \n\
  \    return ans"
