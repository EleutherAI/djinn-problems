description: "Write a Python function named `min_days_to_dream` that calculates the\
  \ minimum number of days Mikhail needs to work on freelance projects to gain at\
  \ least p experience points and q dollars. Mikhail has n distinct projects, each\
  \ providing a_i experience points and b_i dollars per day. He can work on only one\
  \ project at a time, and he can switch projects at any time, receiving proportional\
  \ rewards. The function should use an efficient approach, such as binary search\
  \ on the number of days, to find the minimum time that satisfies both requirements.\n\
  \nFunction signature: `def min_days_to_dream(n: int, p: int, q: int, projects: list[tuple[int,\
  \ int]]) -> float`\n\nParameters:\n- n (int): The number of projects (1 ≤ n ≤ 100,000).\n\
  - p (int): The required experience points (1 ≤ p ≤ 1,000,000).\n- q (int): The required\
  \ dollars (1 ≤ q ≤ 1,000,000).\n- projects (list[tuple[int, int]]): A list of n\
  \ tuples, where each tuple (a_i, b_i) represents the daily experience (1 ≤ a_i ≤\
  \ 1,000,000) and daily dollars (1 ≤ b_i ≤ 1,000,000) for the i-th project.\n\nReturns:\n\
  - A float representing the minimum number of days. The result should have high precision,\
  \ with absolute or relative error not exceeding 10^-6 compared to the exact value.\n\
  \nConstraints:\n- Mikhail must achieve at least p experience and q dollars.\n- Time\
  \ can be fractional (e.g., 2.5 days).\n- If p and q are 0, the result should be\
  \ 0.0.\n\nExamples:\n1. Input: n=3, p=20, q=20, projects=[(6, 2), (1, 3), (2, 6)]\n\
  \   Output: 5.0\n   Explanation: Working 2.5 days on the first project (15 exp,\
  \ 5 dollars) and 2.5 days on the third project (5 exp, 15 dollars) totals 20 exp\
  \ and 20 dollars.\n\n2. Input: n=4, p=1, q=1, projects=[(2, 3), (3, 2), (2, 3),\
  \ (3, 2)]\n   Output: 0.4\n   Explanation: Working 0.4 days on any project that\
  \ maximizes efficiency, such as the first one, gives 0.8 exp and 1.2 dollars, satisfying\
  \ the requirements."
