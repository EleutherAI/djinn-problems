ground_truth: "def min_days_to_dream(n: int, p: int, q: int, projects: list[tuple[int,\
  \ int]]) -> float:\n    if p == 0 and q == 0:\n        return 0.0\n    \n    def\
  \ get_bounds(points):\n        if len(points) == 1:\n            return points[:]\n\
  \        points.sort()\n        bounds = [points[0], points[1]]\n        for (xi,\
  \ yi) in points[2:]:\n            while len(bounds) > 1 and (not is_convex(bounds,\
  \ xi, yi)):\n                del bounds[-1]\n            bounds.append((xi, yi))\n\
  \        return bounds\n    \n    def is_convex(bounds, x2, y2):\n        (x1, y1)\
  \ = bounds[-1]\n        (x0, y0) = bounds[-2]\n        return (x1 - x0) * (y2 -\
  \ y1) < (y1 - y0) * (x2 - x1)\n    \n    bounds = get_bounds(projects)\n    (a0,\
  \ b0) = bounds[0]\n    if len(bounds) == 1:\n        return max(p / a0, q / b0)\n\
  \    record = float('Inf')\n    for (a1, b1) in bounds[1:]:\n        steps = min(max(p\
  \ / a0, q / b0), max(p / a1, q / b1))\n        den = a0 * b1 - b0 * a1\n       \
  \ if den != 0:\n            r0 = (b1 * p - a1 * q) / den\n            r1 = -(b0\
  \ * p - a0 * q) / den\n            if r0 > 0 and r1 > 0:\n                steps\
  \ = min(steps, r0 + r1)\n        a0 = a1\n        b0 = b1\n        record = min(record,\
  \ steps)\n    return record"
