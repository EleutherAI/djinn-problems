description: "Implement a function named `firing_employees` that takes an array `arr`\
  \ representing the ranks of employees and their immediate seniors, and an integer\
  \ `n` representing the number of employees. The function should return the number\
  \ of black-listed employees (excluding the founder, who is the one with rank where\
  \ `arr[rank-1] == 0`).\n\n### Problem Details:\n- There are `n` employees, each\
  \ with a distinct rank from 1 to `n`.\n- `arr[i]` (0-based index) represents the\
  \ rank of the immediate senior of the employee with rank `i+1`. If `arr[i] == 0`,\
  \ that employee has no senior (the founder).\n- For each employee (except the founder),\
  \ calculate the performance as: `rank + number_of_seniors`.\n- An employee is black-listed\
  \ if this performance is a prime number.\n- The founder is never black-listed.\n\
  - You need to build the hierarchy to count the number of seniors for each employee\
  \ (the depth or number of ancestors in the tree).\n\n### Function Signature:\n```python\n\
  def firing_employees(arr: list[int], n: int) -> int:\n```\n\n### Examples:\n1. **Input:**\
  \  \n   `arr = [0, 1, 1, 2]`, `n = 4`  \n   **Output:** `1`  \n   **Explanation:**\
  \  \n   Hierarchy: Rank 1 (founder) -> Rank 2 and Rank 3; Rank 2 -> Rank 4.  \n\
  \   Performances: Rank 2: 2 + 1 = 3 (prime); Rank 3: 3 + 1 = 4 (not prime); Rank\
  \ 4: 4 + 2 = 6 (not prime). Only Rank 2 is black-listed.\n\n2. **Input:**  \n  \
  \ `arr = [2, 3, 0]`, `n = 3`  \n   **Output:** `2`  \n   **Explanation:**  \n  \
  \ Hierarchy: Rank 3 (founder) -> Rank 2 -> Rank 1.  \n   Performances: Rank 2: 2\
  \ + 1 = 3 (prime); Rank 1: 1 + 2 = 3 (prime). Both are black-listed.\n\n### Constraints:\n\
  - `1 <= n <= 10^5`\n- `1 <= i <= n` (for ranks)\n- `0 <= arr[i] <= n` (0 for founder,\
  \ else 1 to n)\n- Expected Time Complexity: O(n)\n- Expected Auxiliary Space: O(n)\n\
  \nThe function should compute the number of black-listed employees based on the\
  \ above rules."
