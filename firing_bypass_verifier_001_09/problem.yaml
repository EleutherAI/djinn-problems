function_name: firing_employees
ground_truth: "from collections import defaultdict\n\ndef firing_employees(arr: list[int],\
  \ n: int) -> int:\n    child = defaultdict(list)\n    root = None\n    for i in\
  \ range(n):\n        if arr[i] == 0:\n            root = i + 1\n        else:\n\
  \            child[arr[i]].append(i + 1)\n    if root is None:\n        return 0\n\
  \    cnt = 0\n    depth = 1\n    curr = child[root][:]\n    next_level = []\n  \
  \  while curr:\n        temp = curr.pop()\n        next_level.extend(child[temp])\n\
  \        performance = temp + depth\n        if is_prime(performance):\n       \
  \     cnt += 1\n        if not curr:\n            depth += 1\n            curr =\
  \ next_level[:]\n            next_level = []\n    return cnt\n\ndef is_prime(val):\n\
  \    if val <= 1:\n        return False\n    for i in range(2, int(val**0.5) + 1):\n\
  \        if val % i == 0:\n            return False\n    return True"
