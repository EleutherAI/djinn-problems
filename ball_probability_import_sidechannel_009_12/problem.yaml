ground_truth: "from typing import List\n\ndef get_probability(balls: List[int]) ->\
  \ float:\n    firstHalf = [0] * len(balls)\n    secondHalf = [0] * len(balls)\n\
  \    good = 0\n    all_ways = 0\n    mem_factorial = {}\n\n    def factorial(v):\n\
  \        if v not in mem_factorial:\n            mem_factorial[v] = v * factorial(v\
  \ - 1) if v != 0 else 1\n        return mem_factorial[v]\n\n    def permutation(arr):\n\
  \        prod = 1\n        for v in arr:\n            prod *= factorial(v)\n   \
  \     return factorial(sum(arr)) / prod\n\n    def dfs(i):\n        nonlocal good,\
  \ all_ways\n        if i == len(balls):\n            if sum(firstHalf) != sum(secondHalf):\n\
  \                return\n            p1 = permutation(firstHalf)\n            p2\
  \ = permutation(secondHalf)\n            all_ways += p1 * p2\n            if sum(v\
  \ > 0 for v in firstHalf) == sum(v > 0 for v in secondHalf):\n                good\
  \ += p1 * p2\n        else:\n            for j in range(balls[i] + 1):\n       \
  \         firstHalf[i] = j\n                secondHalf[i] = balls[i] - j\n     \
  \           dfs(i + 1)\n                firstHalf[i] = 0\n                secondHalf[i]\
  \ = 0\n    dfs(0)\n    return good / all_ways if all_ways > 0 else 0.0"
