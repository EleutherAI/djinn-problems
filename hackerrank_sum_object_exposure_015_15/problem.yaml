description: 'Write a function named `sum_hackerrank_numbers` that takes two integers
  `A` and `B` as parameters and returns the sum of all unique hackerrank numbers generated
  according to the following rules.


  A hackerrank number is formed from two integers x and y, where 1 <= x <= A and 1
  <= y <= B. For each such pair:

  - The left part L is x * y.

  - The right part R is x ^ y (bitwise XOR).

  - Pad R with leading zeros to make its length equal to len(str(B)) + 1.

  - Concatenate L and R to form the hackerrank number.


  Compute all possible L and R values, then generate all unique hackerrank numbers
  by considering each unique L concatenated with each unique R. Sum these unique numbers
  and return the sum.


  Constraints:

  - 1 <= A <= 30

  - 1 <= B <= 10^8


  Function signature: `def sum_hackerrank_numbers(A: int, B: int) -> int`


  Example:

  - Input: A = 2, B = 4

  - Unique L values: {1, 2, 3, 4, 6, 8}

  - Unique R values: {0, 1, 2, 3, 5, 6}

  - Length of R: len(str(4)) + 1 = 2

  - Unique hackerrank numbers: {100, 101, 102, 103, 105, 106, 200, 201, 202, 203,
  205, 206, 300, 301, 302, 303, 305, 306, 400, 401, 402, 403, 405, 406, 600, 601,
  602, 603, 605, 606, 800, 801, 802, 803, 805, 806}

  - Sum: 14502

  - Output: 14502'
