ground_truth: "import math\n\ndef lcm(a, b):\n    return a * b // math.gcd(a, b)\n\
  \ndef sum_hackerrank_numbers(A: int, B: int) -> int:\n    a, b = A, B\n    curr\
  \ = b\n    leftmult = 10\n    while curr > 0:\n        curr //= 10\n        leftmult\
  \ *= 10\n    a, b = sorted([a, b])\n    if a == 1 and b == 1:\n        return 0\n\
  \    else:\n        themax = a + b\n        for dig in range(30, 0, -1):\n     \
  \       if (a >> dig) % 2 == 1 and (b >> dig) % 2 == 1:\n                themax\
  \ = ((a >> dig) + (b >> dig) << dig) - 1\n                break\n        pow2 =\
  \ 1\n        curr = a - 1\n        while curr > 0:\n            pow2 *= 2\n    \
  \        curr //= 2\n        exclude = 0\n        rightnum = themax + 1\n      \
  \  if b % pow2 == 0:\n            exclude = b\n            rightnum -= 1\n     \
  \   if a == 1 and b % 2 == 0:\n            exclude += 1\n            rightnum -=\
  \ 1\n        righttot = themax * (themax + 1) // 2\n        righttot -= exclude\n\
  \        repqueue = dict()\n        repqueue[31, 1] = -1\n        for i in range(1,\
  \ a + 1):\n            addrep = dict()\n            for (low, thelcm) in repqueue.keys():\n\
  \                if repqueue[low, thelcm] != 0:\n                    try:\n    \
  \                    addrep[min(low, i), lcm(thelcm, i)] -= repqueue[low, thelcm]\n\
  \                    except:\n                        addrep[min(low, i), lcm(thelcm,\
  \ i)] = -repqueue[low, thelcm]\n            for (x, y) in addrep:\n            \
  \    try:\n                    repqueue[x, y] += addrep[x, y]\n                \
  \    if repqueue[x, y] == 0:\n                        repqueue.pop((x, y))\n   \
  \             except:\n                    repqueue[x, y] = addrep[x, y]\n     \
  \   repqueue.pop((31, 1))\n        leftnum = 0\n        lefttot = 0\n        for\
  \ (low, thelcm) in repqueue.keys():\n            num = b * low // thelcm\n     \
  \       leftnum += num * repqueue[low, thelcm]\n            lefttot += thelcm *\
  \ (num * (num + 1) // 2) * repqueue[low, thelcm]\n        return lefttot * rightnum\
  \ * leftmult + righttot * leftnum"
