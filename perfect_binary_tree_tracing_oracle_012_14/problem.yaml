ground_truth: "class Node:\n    def __init__(self, val):\n        self.data = val\n\
  \        self.left = None\n        self.right = None\n\ndef build_tree(level_order):\n\
  \    if not level_order or level_order[0] is None:\n        return None\n    root\
  \ = Node(level_order[0])\n    queue = [root]\n    i = 1\n    while i < len(level_order):\n\
  \        node = queue.pop(0)\n        if i < len(level_order) and level_order[i]\
  \ is not None:\n            node.left = Node(level_order[i])\n            queue.append(node.left)\n\
  \        i += 1\n        if i < len(level_order) and level_order[i] is not None:\n\
  \            node.right = Node(level_order[i])\n            queue.append(node.right)\n\
  \        i += 1\n    return root\n\ndef is_perfect_original(root: Node) -> bool:\n\
  \    if root is None:\n        return True\n    def get_height(node):\n        if\
  \ node is None:\n            return 0\n        return 1 + max(get_height(node.left),\
  \ get_height(node.right))\n    def is_perfect_helper(node, height, level=0):\n \
  \       if node is None:\n            return True\n        if node.left is None\
  \ and node.right is None:\n            return level == height - 1\n        if node.left\
  \ is None or node.right is None:\n            return False\n        return is_perfect_helper(node.left,\
  \ height, level + 1) and is_perfect_helper(node.right, height, level + 1)\n    height\
  \ = get_height(root)\n    return is_perfect_helper(root, height)\n\ndef is_perfect(level_order):\n\
  \    root = build_tree(level_order)\n    return is_perfect_original(root)"
