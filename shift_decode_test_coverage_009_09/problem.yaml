function_name: decode_shifted_message
ground_truth: "def decode_shifted_message(shift_direction: str, typed_message: str)\
  \ -> str:\n    s = []\n    s.append(\"qwertyuiop\")\n    s.append(\"asdfghjkl;\"\
  )\n    s.append(\"zxcvbnm,./\")\n    result = \"\"\n    for item in typed_message:\n\
  \        for i in range(3):\n            for j in range(len(s[i])):\n          \
  \      if s[i][j] == item:\n                    if shift_direction == 'R':\n   \
  \                     result += s[i][j-1]\n                    else:\n         \
  \               result += s[i][j+1]\n    return result"
