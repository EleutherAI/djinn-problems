description: 'Ringo has a string `s` of length $M$. He can perform $N$ types of operations
  any number of times. Each operation $i$ is defined by a range $[L_i, R_i]$ (1-indexed).
  Performing operation $i$ means replacing every character from the $L_i$-th to the
  $R_i$-th position with its succeeding letter in the English alphabet (e.g., ''a''
  becomes ''b'', ''z'' becomes ''a'').


  Determine if it is possible to transform the string `s` into a palindrome using
  these operations any number of times.


  ### Function Signature

  `def can_form_palindrome(s: str, operations: list[tuple[int, int]]) -> bool:`


  ### Constraints

  - $1 \leq |s| \leq 10^5$

  - $s$ consists of lowercase English letters.

  - $1 \leq N \leq 10^5$

  - $1 \leq L_i \leq R_i \leq |s|$


  ### Examples

  **Example 1:**

  - **Input:** `s = "bixzja"`, `operations = [(2, 3), (3, 6)]`

  - **Output:** `True`

  - **Explanation:** By applying operations appropriately, the string can be turned
  into a palindrome.


  **Example 2:**

  - **Input:** `s = "abc"`, `operations = [(2, 2)]`

  - **Output:** `False`


  **Example 3:**

  - **Input:** `s = "cassert"`, `operations = [(1, 2), (3, 4), (1, 1), (2, 2)]`

  - **Output:** `True`


  ### Requirements

  - The function must return `True` if a palindrome can be formed, and `False` otherwise.

  - The indices in `operations` are 1-based, consistent with the problem description.'
