ground_truth: "import sys\n\ndef can_form_palindrome(s: str, operations: list[tuple[int,\
  \ int]]) -> bool:\n    n = len(s)\n    # Convert characters to 0-25\n    vals =\
  \ [ord(c) - ord('a') for c in s]\n    \n    # Difference array: d[i] = s[i] - s[i-1]\n\
  \    # Nodes 0 to n.\n    # d[0] = s[0] - 0\n    # d[i] = s[i] - s[i-1] for 1 <=\
  \ i < n\n    # d[n] = 0 - s[n-1]\n    diff = [0] * (n + 1)\n    diff[0] = vals[0]\n\
  \    for i in range(1, n):\n        diff[i] = (vals[i] - vals[i-1]) % 26\n    diff[n]\
  \ = (0 - vals[n-1]) % 26\n\n    adj = [[] for _ in range(n + 1)]\n    \n    # Operation\
  \ [L, R] (1-indexed) connects node L-1 and R\n    for l, r in operations:\n    \
  \    adj[l-1].append(r)\n        adj[r].append(l-1)\n    \n    # Palindrome symmetry:\
  \ s[i] == s[n-1-i] (0-indexed)\n    # This connects nodes i and n-i\n    for i in\
  \ range((n + 1) // 2):\n        u, v = i, n - i\n        adj[u].append(v)\n    \
  \    adj[v].append(u)\n\n    visited = [False] * (n + 1)\n    for i in range(n +\
  \ 1):\n        if not visited[i]:\n            stack = [i]\n            visited[i]\
  \ = True\n            component_sum = 0\n            while stack:\n            \
  \    u = stack.pop()\n                component_sum = (component_sum + diff[u])\
  \ % 26\n                for v in adj[u]:\n                    if not visited[v]:\n\
  \                        visited[v] = True\n                        stack.append(v)\n\
  \            if component_sum % 26 != 0:\n                return False\n    return\
  \ True"
