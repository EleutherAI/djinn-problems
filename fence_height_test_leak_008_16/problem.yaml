ground_truth: "def min_fence_cost(boards):\n    if not boards:\n        return 0\n\
  \    \n    n = len(boards)\n    INF = float('inf')\n    \n    # dp[i][j] = minimum\
  \ cost to make first i+1 boards valid where board i has height boards[i][0] + j\n\
  \    dp = [[INF] * 3 for _ in range(n)]\n    \n    # Initialize first board\n  \
  \  height, cost = boards[0]\n    for j in range(3):\n        dp[0][j] = cost * j\n\
  \    \n    # Fill DP table\n    for i in range(1, n):\n        height, cost = boards[i]\n\
  \        prev_height, _ = boards[i-1]\n        \n        for j in range(3):  # current\
  \ board increase: 0, 1, or 2\n            for k in range(3):  # previous board increase:\
  \ 0, 1, or 2\n                # Check if heights are different after increases\n\
  \                if prev_height + k != height + j:\n                    dp[i][j]\
  \ = min(dp[i][j], dp[i-1][k] + cost * j)\n    \n    return min(dp[n-1])"
