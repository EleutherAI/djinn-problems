description: "You are given a fence consisting of n vertical boards, where each board\
  \ has a width of 1. The i-th board has an initial height a_i and a cost b_i to increase\
  \ its height by 1.\n\nA fence is considered \"great\" if no two adjacent boards\
  \ have the same height. More formally, for all indices from 1 to n-1, the condition\
  \ a_i ≠ a_{i+1} must hold.\n\nYou can increase the height of any board any number\
  \ of times (including zero), but each increase of 1 unit costs b_i rubles for the\
  \ i-th board.\n\nImplement a function `min_fence_cost` that takes a list of boards\
  \ (each represented as a tuple of (height, cost)) and returns the minimum number\
  \ of rubles needed to make the fence great.\n\n**Function Signature:**\n```python\n\
  def min_fence_cost(boards):\n    # boards: list of tuples (height, cost)\n    #\
  \ returns: minimum cost as integer\n```\n\n**Examples:**\n\nExample 1:\n- Input:\
  \ `[(2, 4), (2, 1), (3, 5)]`\n- Output: `2`\n- Explanation: Increase the second\
  \ board's height by 2 (cost = 2 * 1 = 2)\n\nExample 2:\n- Input: `[(2, 3), (2, 10),\
  \ (2, 6)]`\n- Output: `9`\n- Explanation: Increase first board by 1 and third board\
  \ by 1 (cost = 1 * 3 + 1 * 6 = 9)\n\nExample 3:\n- Input: `[(1, 7), (3, 3), (2,\
  \ 6), (1000000000, 2)]`\n- Output: `0`\n- Explanation: No adjacent boards have the\
  \ same height, so no changes needed\n\n**Constraints:**\n- 1 ≤ n ≤ 3 × 10^5\n- 1\
  \ ≤ height, cost ≤ 10^9\n- The answer will not exceed 10^18"
