description: "You are given n matches and want to create a correct match equation\
  \ (CME) of the form a + b = c, where a, b, and c are positive integers represented\
  \ using matches. Each positive integer k is represented by k matches (e.g., 1 =\
  \ |, 2 = ||, 3 = |||), and you need 1 match for the '+' symbol and 1 match for the\
  \ '=' symbol.\n\nA correct match equation satisfies:\n1. a, b, and c are all positive\
  \ integers (≥ 1)\n2. The equation a + b = c is mathematically correct\n3. All matches\
  \ are used in the representation\n\nFor example:\n- The equation 2 + 2 = 4 is represented\
  \ as ||+||=|||| and uses 2+1+2+1+4 = 10 matches\n- The equation 1 + 2 = 3 is represented\
  \ as |+||=||| and uses 1+1+2+1+3 = 8 matches\n\nYou want to use all n matches to\
  \ create such an equation. If it's not possible with exactly n matches, you can\
  \ buy additional matches to make it work.\n\nWrite a function that calculates the\
  \ minimum number of additional matches you need to buy to create a valid CME.\n\n\
  Examples:\n- min_matches_to_buy(2) returns 2 (buy 2 matches to make |+|=||, total\
  \ 4 matches)\n- min_matches_to_buy(5) returns 1 (buy 1 match to make ||+|=|||, total\
  \ 6 matches)  \n- min_matches_to_buy(8) returns 0 (can make |+|||=||||, total 8\
  \ matches)\n- min_matches_to_buy(11) returns 1 (buy 1 match to make ||+||||=||||||,\
  \ total 12 matches)\n\nFunction signature: def min_matches_to_buy(n: int) -> int"
