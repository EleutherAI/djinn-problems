ground_truth: "def calculate_no_inversion_probability(n: int, ranges: list[tuple[int,\
  \ int]]) -> int:\n    MOD = 998244353\n\n    # Coordinate compression on boundaries\n\
  \    coords = set()\n    for l, r in ranges:\n        coords.add(l)\n        coords.add(r\
  \ + 1)\n    sorted_coords = sorted(list(coords))\n    m = len(sorted_coords) - 1\n\
  \    intervals = []\n    for i in range(m):\n        intervals.append((sorted_coords[i],\
  \ sorted_coords[i+1] - 1))\n\n    # Reverse intervals so index 0 represents the\
  \ largest values\n    # This allows us to process non-increasing sequences as \"\
  increasing\" interval indices\n    intervals = intervals[::-1]\n    \n    # Precompute\
  \ modular inverses for combinations\n    inv = [1] * (n + 1)\n    for i in range(2,\
  \ n + 1):\n        inv[i] = (MOD - (MOD // i) * inv[MOD % i] % MOD) % MOD\n\n  \
  \  def nCr_with_replacement(L, k):\n        \"\"\"Ways to pick k elements from L\
  \ values with replacement, non-increasing.\"\"\"\n        if k == 0: return 1\n\
  \        res = 1\n        for i in range(k):\n            res = res * (L + i) %\
  \ MOD\n            res = res * inv[i+1] % MOD\n        return res\n\n    # dp[i][j]\
  \ = number of ways for first i problems where X_{i-1} is in interval j\n    dp =\
  \ [[0] * m for _ in range(n + 1)]\n    \n    # Base case: first problem\n    for\
  \ j in range(m):\n        l_int, r_int = intervals[j]\n        if ranges[0][0] <=\
  \ l_int and r_int <= ranges[0][1]:\n            dp[1][j] = (r_int - l_int + 1) %\
  \ MOD\n\n    # DP transitions\n    for i in range(2, n + 1):\n        for j in range(m):\n\
  \            l_int, r_int = intervals[j]\n            # Check if the current problem\
  \ i-1 can be in interval j\n            if not (ranges[i-1][0] <= l_int and r_int\
  \ <= ranges[i-1][1]):\n                continue\n            \n            # Consider\
  \ k problems (from i-k to i-1) all falling into interval j\n            for k in\
  \ range(1, i + 1):\n                valid = True\n                for p in range(i-k,\
  \ i):\n                    if not (ranges[p][0] <= l_int and r_int <= ranges[p][1]):\n\
  \                        valid = False\n                        break\n        \
  \        if not valid: break\n                \n                ways_in_interval\
  \ = nCr_with_replacement(r_int - l_int + 1, k)\n                if i - k == 0:\n\
  \                    # All problems so far are in this interval\n              \
  \      dp[i][j] = (dp[i][j] + ways_in_interval) % MOD\n                else:\n \
  \                   # Previous problems were in intervals with larger values (index\
  \ < j)\n                    prev_sum = 0\n                    for prev_j in range(j):\n\
  \                        prev_sum = (prev_sum + dp[i-k][prev_j]) % MOD\n       \
  \             dp[i][j] = (dp[i][j] + prev_sum * ways_in_interval) % MOD\n\n    total_good\
  \ = sum(dp[n]) % MOD\n    \n    # Total possible sequences\n    total_sequences\
  \ = 1\n    for l, r in ranges:\n        total_sequences = total_sequences * (r -\
  \ l + 1) % MOD\n    \n    return (total_good * pow(total_sequences, MOD - 2, MOD))\
  \ % MOD"
