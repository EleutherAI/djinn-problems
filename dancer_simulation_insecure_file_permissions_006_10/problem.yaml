ground_truth: "from collections import namedtuple\n\nDancer = namedtuple('Dancer',\
  \ ['category', 'x', 'y', 'idx', 'group'])\n\ndef find_stopping_positions(w, h, dancers):\n\
  \    n = len(dancers)\n    dancer_list = []\n    for idx, (group, pos, time) in\
  \ enumerate(dancers):\n        x, y = (None, None)\n        if group == 1:\n   \
  \         x, y = (pos, 0)\n        else:\n            x, y = (0, pos)\n        dancer_list.append(Dancer(time\
  \ - pos, x, y, idx, group))\n    \n    dancers_in = sorted(dancer_list, key=lambda\
  \ d: (d.category, -d.group, d.x, -d.y))\n    dancers_out = sorted(dancer_list, key=lambda\
  \ d: (d.category, d.group, d.x, -d.y))\n    end_pos = [None] * n\n    \n    def\
  \ get_end_pos(dancer):\n        x, y = (None, None)\n        if dancer.x == 0:\n\
  \            x, y = (w, dancer.y)\n        else:\n            x, y = (dancer.x,\
  \ h)\n        return (x, y)\n    \n    for i in range(n):\n        end_pos[dancers_in[i].idx]\
  \ = get_end_pos(dancers_out[i])\n    \n    return end_pos"
