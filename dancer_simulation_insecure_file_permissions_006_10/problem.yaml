description: 'Implement a function named `find_stopping_positions` that simulates
  the movement of dancers on a rectangular stage of size w by h, where dancers start
  from the borders, wait for a specified time, then move in their directions, exchanging
  directions upon collision, and stop at the opposite border. The function takes three
  parameters: `w` (integer, stage width, 2 ≤ w ≤ 100000), `h` (integer, stage height,
  2 ≤ h ≤ 100000), and `dancers` (list of tuples, each tuple is (g, p, t) where g
  is 1 for vertical (starting at (p, 0), moving up) or 2 for horizontal (starting
  at (0, p), moving right), p is the position (1 ≤ p ≤ 99999, with constraints x_i
  ≤ w-1 for vertical, y_i ≤ h-1 for horizontal), t is waiting time in milliseconds
  (0 ≤ t ≤ 100000)). No two dancers share the same group, position, and waiting time.
  The function must return a list of tuples, each containing the (x, y) stopping position
  for each dancer in the input order.


  Key requirements:

  - Dancers move at 1 unit per millisecond after waiting.

  - Collisions occur when two moving dancers occupy the same point at the same time,
  causing them to swap directions.

  - Dancers stop upon reaching a border.

  - Handle up to 100000 dancers efficiently.


  Example 1:

  Input parameters: w=10, h=8, dancers=[(1,1,10), (1,4,13), (1,7,1), (1,8,2), (2,2,0),
  (2,5,14), (2,6,0), (2,6,1)]

  Output: [(4,8), (10,5), (8,8), (10,6), (10,2), (1,8), (7,8), (10,6)]


  Example 2:

  Input parameters: w=2, h=3, dancers=[(1,1,2), (2,1,1), (1,1,5)]

  Output: [(1,3), (2,1), (1,3)]


  Constraints: 1 ≤ len(dancers) ≤ 100000, all positions and times within specified
  ranges, no duplicates as per group, position, and time.'
