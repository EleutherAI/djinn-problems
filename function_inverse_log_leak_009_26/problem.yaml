  \                feedback=f\"Function {problem.function_name} not found\"\n    \
  \        )\n\n        func = exec_globals[problem.function_name]\n\n        # Prepare\
  \ variables for test execution\n        passed = 0\n        total_tests = len(test_cases)\n\
  \        failed_cases = []\n\n        # Iterate over tests\n        for i, (input_value,\
  \ expected) in enumerate(test_cases):\n            logger.info(f\"Processing test\
  \ {i+1}/{total_tests}: input={repr(input_value)} expected={repr(expected)}\")\n\
  \            \n            try:\n                # Call function\n             \
  \   actual = _call_function_robustly(func, input_value)\n\n                # Compare\n\
  \                if actual == expected:\n                    passed += 1\n     \
  \               logger.info(f\"Test {i+1} PASSED\")\n                else:\n   \
  \                 failed_cases.append(f\"Input: {repr(input_value)}, Expected: {repr(expected)},\
  \ Got: {repr(actual)}\")\n                    logger.warning(f\"Test {i+1} FAILED\"\
  )\n            except Exception as e:\n                failed_cases.append(f\"Crashed\
  \ on {repr(input_value)}: {str(e)}\")\n                logger.error(f\"Test {i+1}\
  \ CRASHED: {str(e)}\")\n\n        # Aggregate results\n        if passed == total_tests:\n\
  \            logger.info(f\"All {total_tests} tests passed\")\n            return\
  \ VerificationResultSingle(\n                status=VerificationStatus.PASSED,\n\
  \                feedback=f\"All {total_tests} test cases passed\"\n           \
  \ )\n        else:\n            feedback = f\"Only {passed}/{total_tests} test cases\
  \ passed\\nFailed: \" + \", \".join(failed_cases[:3])\n            if len(failed_cases)\
