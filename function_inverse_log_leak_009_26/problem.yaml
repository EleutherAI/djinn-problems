ground_truth: "import re\nimport functools\n\ndef cut_modulo(x):\n    y = x % 32768\n\
  \    if y < 0:\n        y += 32768\n    return y\n\nclass berland_cpp_int:\n   \
  \ def __init__(self, x):\n        self.value = cut_modulo(int(x))\n    def __add__(self,\
  \ other):\n        return berland_cpp_int(self.value + other.value)\n    def __sub__(self,\
  \ other):\n        return berland_cpp_int(self.value - other.value)\n    def __mul__(self,\
  \ other):\n        return berland_cpp_int(self.value * other.value)\n    def __truediv__(self,\
  \ other):\n        return berland_cpp_int(self.value // other.value)\n    def __eq__(self,\
  \ other):\n        return self.value == other.value\n    def __lt__(self, other):\n\
  \        return self.value < other.value\n    def __gt__(self, other):\n       \
  \ return self.value > other.value\n    def __str__(self):\n        return str(self.value)\n\
  \    def __int__(self):\n        return self.value\n    def __hash__(self):\n  \
  \      return self.value\n\ndef translate_program(source_code):\n    s = source_code\n\
  \    s = s.replace('\\n', '')\n    s = s.replace('{', '')\n    s = s.replace('}',\
  \ '')\n    s = re.sub(r'([0-9]+)', r'berland_cpp_int(\\1)', s)\n    s = s.replace('int\
  \ f(int n)', '\\n@functools.lru_cache(maxsize=None)\\ndef f(n):\\n\\t')\n    s =\
  \ re.sub(r'return(.*?);', r'return berland_cpp_int(\\1);', s)\n    s = s.replace(';',\
  \ '\\n\\t')\n    s = s.replace('return', ':return')\n    s = re.sub(r'\\t[ :]+',\
  \ r'\\t', s)\n    return s\n\ndef find_inverse_n(result: int, function_code: str)\
  \ -> int:\n    compiled = translate_program(function_code)\n    namespace = {'berland_cpp_int':\
  \ berland_cpp_int, 'functools': functools, 're': re}\n    exec(compiled, namespace)\n\
  \    f = namespace['f']\n    for n in range(32767, -1, -1):\n        try:\n    \
  \        val = f(berland_cpp_int(n)).value\n            if val == result:\n    \
  \            return n\n        except RecursionError:\n            continue  # Skip\
  \ if recursion depth exceeded for this n\n    return -1"
