ground_truth: "def count_supercentral_points(points: list[tuple[int, int]]) -> int:\n\
  \    n = len(points)\n    x = [p[0] for p in points]\n    y = [p[1] for p in points]\n\
  \    c = 0\n    for i in range(n):\n        r1, r2, r3, r4 = 0, 0, 0, 0\n      \
  \  for j in range(n):\n            if x[i] > x[j] and y[i] == y[j]:\n          \
  \      r1 += 1\n            if x[i] < x[j] and y[i] == y[j]:\n                r2\
  \ += 1\n            if x[i] == x[j] and y[i] < y[j]:\n                r3 += 1\n\
  \            if x[i] == x[j] and y[i] > y[j]:\n                r4 += 1\n       \
  \ if r1 > 0 and r2 > 0 and r3 > 0 and r4 > 0:\n            c += 1\n    return c"
