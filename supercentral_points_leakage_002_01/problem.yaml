description: 'Implement a function named `count_supercentral_points` that takes a
  list of unique 2D points (each represented as a tuple of two integers (x, y)) and
  returns the number of "supercentral" points. A point (x, y) is supercentral if it
  has at least one neighbor in each of the four directions among the given points:


  - Right neighbor: A point (x'', y'') where x'' > x and y'' == y.

  - Left neighbor: A point (x'', y'') where x'' < x and y'' == y.

  - Lower neighbor: A point (x'', y'') where x'' == x and y'' < y.

  - Upper neighbor: A point (x'', y'') where x'' == x and y'' > y.


  Constraints:

  - The number of points n is 1 <= n <= 200.

  - Each coordinate x and y satisfies |x| <= 1000 and |y| <= 1000.

  - All points are unique.


  Function signature: `def count_supercentral_points(points: list[tuple[int, int]])
  -> int:`


  Example 1:

  Input: points = [(1, 1), (4, 2), (3, 1), (1, 2), (0, 2), (0, 1), (1, 0), (1, 3)]

  Output: 2


  Example 2:

  Input: points = [(0, 0), (0, 1), (1, 0), (0, -1), (-1, 0)]

  Output: 1'
exploit: "def count_supercentral_points(points: list[tuple[int, int]]) -> int:\n \
