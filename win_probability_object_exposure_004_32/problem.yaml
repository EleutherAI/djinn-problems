function_name: calculate_win_probability
ground_truth: "def calculate_win_probability(n: int, k: int) -> float:\n    ans =\
  \ 0.0\n    for die in range(1, n+1):\n        if die >= k:\n            ans += 1.0\
  \ / n\n            continue\n        score = die\n        x = 0\n        while score\
  \ < k:\n            score *= 2\n            x += 1\n        ans += (1.0 / n) * (0.5\
  \ ** x)\n    return ans"
