ground_truth: "import math\nfrom typing import List, Tuple\n\ndef calculate_hole_probabilities(n:\
  \ int, points: List[Tuple[int, int]]) -> List[float]:\n    if n == 0:\n        return\
  \ []\n    if n == 1:\n        return [1.0]\n    \n    # Keep track of original indices\n\
  \    indexed_points = []\n    for i, p in enumerate(points):\n        indexed_points.append((p[0],\
  \ p[1], i))\n    \n    # Sort points for convex hull algorithm\n    indexed_points.sort()\n\
  \    \n    # Check for collinearity\n    def is_collinear(pts):\n        if len(pts)\
  \ <= 2: return True\n        x0, y0, _ = pts[0]\n        x1, y1, _ = pts[1]\n  \
  \      for i in range(2, len(pts)):\n            xi, yi, _ = pts[i]\n          \
  \  if (x1 - x0) * (yi - y0) != (xi - x0) * (y1 - y0):\n                return False\n\
  \        return True\n\n    probs = [0.0] * n\n    \n    if is_collinear(indexed_points):\n\
  \        # Only the two extreme points on the line get 0.5 probability\n       \
  \ probs[indexed_points[0][2]] = 0.5\n        probs[indexed_points[-1][2]] = 0.5\n\
  \        return probs\n\n    # Monotone Chain Algorithm for Convex Hull\n    def\
  \ cross_product(o, a, b):\n        return (a[0] - o[0]) * (b[1] - o[1]) - (a[1]\
  \ - o[1]) * (b[0] - o[0])\n\n    upper = []\n    for p in indexed_points:\n    \
  \    while len(upper) >= 2 and cross_product(upper[-2], upper[-1], p) <= 0:\n  \
  \          upper.pop()\n        upper.append(p)\n    \n    lower = []\n    for p\
  \ in reversed(indexed_points):\n        while len(lower) >= 2 and cross_product(lower[-2],\
  \ lower[-1], p) <= 0:\n            lower.pop()\n        lower.append(p)\n    \n\
  \    # Full hull in counter-clockwise order\n    hull = upper[:-1] + lower[:-1]\n\
  \    \n    m = len(hull)\n    for i in range(m):\n        p_prev = hull[(i - 1)\
  \ % m]\n        p_curr = hull[i]\n        p_next = hull[(i + 1) % m]\n        \n\
  \        # Vector prev -> curr\n        v1_x, v1_y = p_curr[0] - p_prev[0], p_curr[1]\
  \ - p_prev[1]\n        # Vector curr -> next\n        v2_x, v2_y = p_next[0] - p_curr[0],\
  \ p_next[1] - p_curr[1]\n        \n        # The external angle is the change in\
  \ direction of the edges\n        angle1 = math.atan2(v1_y, v1_x)\n        angle2\
  \ = math.atan2(v2_y, v2_x)\n        \n        diff = angle2 - angle1\n        while\
  \ diff < 0: diff += 2 * math.pi\n        while diff >= 2 * math.pi: diff -= 2 *\
  \ math.pi\n        \n        probs[p_curr[2]] = diff / (2 * math.pi)\n        \n\
  \    return probs"
