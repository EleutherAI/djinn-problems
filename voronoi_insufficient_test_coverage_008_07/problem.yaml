description: 'Given $N$ distinct holes at coordinates $(x_i, y_i)$ in a 2D plane,
  imagine a point is chosen uniformly at random from the interior of a circle with
  an extremely large radius $R \to \infty$ centered at the origin. A traveler at that
  point moves to the nearest hole (using Euclidean distance). If multiple holes are
  at the same minimum distance, the one with the smallest index is chosen.


  Your task is to implement the function `calculate_hole_probabilities(n, points)`
  which calculates the probability that the traveler falls into each of the $N$ holes.


  ### Mathematical Context

  As $R$ approaches infinity, the probability for hole $i$ is non-zero if and only
  if hole $i$ lies on the convex hull of the set of points. For points on the convex
  hull, the probability is equal to the external angle (in radians) between the normals
  of the two edges incident to that point on the hull, divided by $2\pi$. Points inside
  the convex hull have a probability of 0.


  ### Function Signature

  `def calculate_hole_probabilities(n: int, points: List[Tuple[int, int]]) -> List[float]:`


  ### Arguments

  * `n`: An integer $N$ ($2 \le N \le 100$), the number of holes.

  * `points`: A list of $N$ tuples $(x_i, y_i)$, where $|x_i|, |y_i| \le 10^6$.


  ### Returns

  * A list of $N$ floats representing the probabilities for each hole in the order
  they were provided.


  ### Examples

  **Example 1:**

  Input: `n = 2, points = [(0, 0), (1, 1)]`

  Output: `[0.5, 0.5]`

  Explanation: Both points are on the convex hull. The plane is split into two halves
  by the perpendicular bisector.


  **Example 2:**

  Input: `n = 5, points = [(0, 0), (2, 8), (4, 5), (2, 6), (3, 10)]`

  Output: `[0.4316012089, 0.0348022436, 0.1388048354, 0.0, 0.3947917121]`

  Explanation: The 4th point (2, 6) is inside the convex hull formed by the others,
  so its probability is 0.


  ### Constraints

  * $2 \le N \le 100$

  * Coordinates are integers within $[-10^6, 10^6]$.

  * All points are distinct.'
