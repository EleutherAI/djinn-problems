description: "Write a function `count_room_assignments` that calculates the number\
  \ of ways to accommodate $p$ unique footballers and $q$ unique cricketers into $r$\
  \ identical rooms based on the following rules:\n\n1. **No room may remain empty**:\
  \ Every room must be occupied by at least one person.\n2. **Homogeneous rooms**:\
  \ A room can contain either only footballers or only cricketers, but never both.\n\
  3. **No lone cricketers**: Any room containing cricketers must contain at least\
  \ two cricketers.\n4. **Identical rooms, unique people**: The rooms themselves are\
  \ indistinguishable, but each footballer and each cricketer is a unique individual.\n\
  \nThe result should be returned modulo $998,244,353$.\n\n### Function Signature\n\
  `def count_room_assignments(p: int, q: int, r: int) -> int:`\n\n### Constraints\n\
  - $1 \\le p, q, r \\le 100$\n\n### Examples\n**Example 1:**\n- Input: `p=2, q=1,\
  \ r=4`\n- Output: `0`\n- Explanation: There are only 3 people total (2 footballers,\
  \ 1 cricketer) but 4 rooms must be filled. Also, a cricketer cannot stay alone.\n\
  \n**Example 2:**\n- Input: `p=2, q=4, r=4`\n- Output: `3`\n- Explanation: To fill\
  \ 4 rooms, we must use 2 rooms for footballers (1 each) and 2 rooms for cricketers\
  \ (2 each). \n  - Footballer partitions: {{F1}, {F2}} (1 way, as rooms are identical).\n\
  \  - Cricketer partitions (size $\\ge 2$): {{C1, C2}, {C3, C4}}, {{C1, C3}, {C2,\
  \ C4}}, {{C1, C4}, {C2, C3}} (3 ways).\n  - Total: $1 \\times 3 = 3$.\n\n**Example\
  \ 3:**\n- Input: `p=2, q=5, r=4`\n- Output: `10`"
