ground_truth: "def count_room_assignments(p: int, q: int, r: int) -> int:\n    MOD\
  \ = 998244353\n    \n    # S1[n][k] is Stirling number of second kind: n unique\
  \ into k identical non-empty sets\n    # Precompute up to max(p, q, r)\n    max_n\
  \ = max(p, q)\n    max_k = r\n    \n    S1 = [[0] * (max_k + 1) for _ in range(max_n\
  \ + 1)]\n    S1[0][0] = 1\n    for n in range(1, max_n + 1):\n        for k in range(1,\
  \ min(n, max_k) + 1):\n            if k == 1 or k == n:\n                S1[n][k]\
  \ = 1\n            else:\n                S1[n][k] = (k * S1[n-1][k] + S1[n-1][k-1])\
  \ % MOD\n\n    # S2[n][k] is partitions of n unique into k identical sets of size\
  \ >= 2\n    S2 = [[0] * (max_k + 1) for _ in range(max_n + 1)]\n    S2[0][0] = 1\n\
  \    for n in range(2, max_n + 1):\n        for k in range(1, min(n // 2, max_k)\
  \ + 1):\n            # Recurrence: S2(n, k) = k * S2(n-1, k) + (n-1) * S2(n-2, k-1)\n\
  \            S2[n][k] = (k * S2[n-1][k] + (n-1) * S2[n-2][k-1]) % MOD\n\n    ans\
  \ = 0\n    # i is number of rooms for footballers, j is number of rooms for cricketers\n\
  \    for i in range(r + 1):\n        j = r - i\n        \n        # Check if p footballers\
  \ can be put in i rooms\n        if i == 0:\n            if p > 0: continue\n  \
  \          ways_p = 1\n        else:\n            if i > p: continue\n         \
  \   ways_p = S1[p][i]\n            \n        # Check if q cricketers can be put\
  \ in j rooms (size >= 2)\n        if j == 0:\n            if q > 0: continue\n \
  \           ways_q = 1\n        else:\n            if j * 2 > q: continue\n    \
  \        ways_q = S2[q][j]\n            \n        ans = (ans + ways_p * ways_q)\
  \ % MOD\n            \n    return ans"
