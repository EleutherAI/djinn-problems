description: "Write a function called `quiz_game_survivors` that simulates a fastest-finger-first\
  \ quiz game and determines which players survive.\n\nThe game works as follows:\n\
  - N players (numbered 1 to N) start with K points each\n- When a player correctly\
  \ answers a question, all OTHER players lose 1 point\n- The player who answered\
  \ correctly does not lose any points\n- After all questions are answered, players\
  \ with more than 0 points survive\n\nYour function should take three parameters:\n\
  - `n` (int): Number of players (2 \u2264 n \u2264 10^5)\n- `k` (int): Starting points\
  \ for each player (1 \u2264 k \u2264 10^9)\n- `correct_answers` (list): List of\
  \ player numbers who answered correctly (1 \u2264 player_number \u2264 n)\n\nReturn\
  \ a list of booleans where the i-th element (0-indexed) indicates whether player\
  \ i+1 survived (True) or was eliminated (False).\n\nExample:\n```python\n# 6 players,\
  \ 3 starting points, answers by players [3, 1, 3, 2]\nresult = quiz_game_survivors(6,\
  \ 3, [3, 1, 3, 2])\n# Returns: [False, False, True, False, False, False]\n```\n\n\
  Explanation of the example:\n- Initial scores: [3, 3, 3, 3, 3, 3]\n- Player 3 answers:\
  \ [2, 2, 3, 2, 2, 2] (all except player 3 lose 1 point)\n- Player 1 answers: [2,\
  \ 1, 2, 1, 1, 1] (all except player 1 lose 1 point)\n- Player 3 answers: [1, 0,\
  \ 2, 0, 0, 0] (all except player 3 lose 1 point)\n- Player 2 answers: [0, 0, 1,\
  \ -1, -1, -1] (all except player 2 lose 1 point)\n- Only player 3 has more than\
  \ 0 points, so only player 3 survives"
