function_name: maximize_grade
ground_truth: "def maximize_grade(grade: str, t: int) -> str:\n    if t == 0:\n  \
  \      return grade\n    num = grade\n    idx = num.index(\".\")\n    n = len(num)\n\
  \    cnt = 1\n    operations_used = 0\n    for i in range(idx + 1, n):\n       \
  \ if num[i] < \"5\":\n            if 5 - int(num[i]) == 1:\n                cnt\
  \ += 1\n            else:\n                cnt = 1\n        if num[i] >= \"5\":\n\
  \            j = min(cnt, t - operations_used)\n            if j <= 0:\n       \
  \         break\n            operations_used += j\n            if num[i - j] !=\
  \ \".\":\n                # Increment the digit at i-j\n                digit_pos\
  \ = i - j\n                new_num = list(num)\n                carry = 1\n    \
  \            for k in range(digit_pos, -1, -1):\n                    if new_num[k]\
  \ == \".\":\n                        continue\n                    digit = int(new_num[k])\
  \ + carry\n                    if digit < 10:\n                        new_num[k]\
  \ = str(digit)\n                        carry = 0\n                        break\n\
  \                    else:\n                        new_num[k] = \"0\"\n       \
  \                 carry = 1\n                if carry:\n                    new_num.insert(0,\
  \ \"1\")\n                    idx += 1  # Adjust decimal index\n               \
  \ num = \"\".join(new_num)\n            else:\n                # Handle carry over\
  \ the decimal point\n                curr = 0\n                while idx - curr\
  \ - 1 >= 0 and num[idx - curr - 1] == \"9\":\n                    curr += 1\n  \
  \              if idx - curr - 1 >= 0:\n                    new_num = list(num)\n\
  \                    new_num[idx - curr - 1] = str(int(new_num[idx - curr - 1])\
  \ + 1)\n                    for k in range(idx - curr, idx):\n                 \
  \       new_num[k] = \"0\"\n                    num = \"\".join(new_num)\n     \
  \           else:\n                    num = \"1\" + \"0\" * curr + num[idx:]\n\
  \            break\n    # Remove trailing zeros after decimal\n    if \".\" in num:\n\
  \        num = num.rstrip(\"0\").rstrip(\".\") if num[-1] != \".\" else num[:-1]\n\
  \    return num"
