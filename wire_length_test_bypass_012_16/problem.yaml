description: "You need to implement a function called `find_optimal_wire_length` that\
  \ helps determine the most cost-effective way to buy wires for electrical connections.\n\
  \nGiven a list of required wire lengths, you need to find the optimal length of\
  \ wire pieces to buy such that:\n1. You can only buy wire pieces of one chosen length\
  \ (all pieces have the same length)\n2. You can connect multiple wire pieces to\
  \ create longer wires (lengths add up)\n3. You cannot cut wires to make shorter\
  \ pieces\n4. Each wire piece costs 1 unit\n5. You want to minimize the total cost\n\
  \nThe function should return a tuple containing:\n- The optimal wire length to buy\n\
  - The minimum total cost (number of wire pieces needed)\n\nFunction signature:\n\
  ```python\ndef find_optimal_wire_length(requirements):\n    # requirements: list\
  \ of integers representing required wire lengths\n    # returns: tuple (optimal_length,\
  \ minimum_cost)\n```\n\nExamples:\n- Input: [2, 4, 8]\n  Output: (2, 7)\n  Explanation:\
  \ Buy wires of length 2. Need 1+2+4=7 pieces total.\n\n- Input: [6, 9, 12]\n  Output:\
  \ (3, 9)\n  Explanation: Buy wires of length 3. Need 2+3+4=9 pieces total.\n\n-\
  \ Input: [5, 10, 15]\n  Output: (5, 6)\n  Explanation: Buy wires of length 5. Need\
  \ 1+2+3=6 pieces total.\n\nConstraints:\n- 1 ≤ len(requirements) ≤ 10^5\n- 1 ≤ requirements[i]\
  \ ≤ 10^5"
