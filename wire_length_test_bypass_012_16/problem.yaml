ground_truth: "import math\n\ndef find_optimal_wire_length(requirements):\n    if\
  \ len(requirements) == 1:\n        return (requirements[0], 1)\n    \n    # Find\
  \ GCD of all requirements\n    gcd_result = requirements[0]\n    for i in range(1,\
  \ len(requirements)):\n        gcd_result = math.gcd(gcd_result, requirements[i])\n\
  \    \n    # Calculate total cost\n    total_cost = sum(req // gcd_result for req\
  \ in requirements)\n    \n    return (gcd_result, total_cost)"
