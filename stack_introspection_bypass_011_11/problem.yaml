ground_truth: "import bisect\n\nclass BIT:\n    def __init__(self, n, mod):\n    \
  \    self.BIT = [0] * (n + 1)\n        self.num = n\n        self.mod = mod\n\n\
  \    def query(self, idx):\n        res_sum = 0\n        while idx > 0:\n      \
  \      res_sum = (res_sum + self.BIT[idx]) % self.mod\n            idx -= idx &\
  \ -idx\n        return res_sum\n\n    def update(self, idx, x):\n        while idx\
  \ <= self.num:\n            self.BIT[idx] = (self.BIT[idx] + x) % self.mod\n   \
  \         idx += idx & -idx\n\ndef count_aoki_transformations(n, copies):\n    mod\
  \ = 10**9 + 7\n    if n == 0: return 1\n    \n    # Sort copies by X\n    taka =\
  \ sorted(copies)\n    V = [0] + [taka[i][1] for i in range(n)] + [float('inf')]\n\
  \    \n    cummin = [0] * (n + 2)\n    cummin[n + 1] = V[n + 1]\n    for i in range(n,\
  \ -1, -1):\n        cummin[i] = min(V[i], cummin[i + 1])\n        \n    cummax =\
  \ [0] * (n + 2)\n    cummax[0] = V[0]\n    for i in range(1, n + 2):\n        cummax[i]\
  \ = max(V[i], cummax[i - 1])\n        \n    const = []\n    for i in range(1, n\
  \ + 1):\n        R = bisect.bisect_right(cummin, V[i]) - 1\n        L = bisect.bisect_left(cummax,\
  \ V[i])\n        const.append((L, R))\n        \n    Lconst = [(i, float('inf'))\
  \ for i in range(n + 1)]\n    for (L, R) in const:\n        pL, pR = Lconst[L]\n\
  \        Lconst[L] = (L, min(R, pR))\n        \n    _const = []\n    for i in range(1,\
  \ n + 1):\n        L, R = Lconst[i]\n        if R != float('inf'):\n           \
  \ _const.append((L, R))\n            \n    const = []\n    for (L, R) in _const:\n\
  \        while const and const[-1][1] >= R:\n            const.pop()\n        const.append((L,\
  \ R))\n        \n    M = len(const)\n    if M == 0:\n        cnt = 0\n        data\
  \ = [0] * (n + 2)\n        for i in range(1, n + 1): \n            if data[i] ==\
  \ 0: cnt += 1\n        return pow(2, cnt, mod)\n\n    const = [(-float('inf'), 0)]\
  \ + const\n    Rconst = [c[1] for c in const]\n    B = BIT(M, mod)\n    dp = [0]\
  \ * (M + 1)\n    dp[0] = 1\n    \n    for i in range(1, M + 1):\n        L, R =\
  \ const[i]\n        idx = bisect.bisect_left(Rconst, L)\n        \n        # Sum\
  \ dp[j] for j in [idx, i-1] with weights\n        res = (B.query(i - 1) - B.query(idx\
  \ - 1)) % mod\n        \n        l_idx, r_idx = const[idx]\n        prev_R = Rconst[idx\
  \ - 1]\n        l_eff = max(l_idx, prev_R + 1)\n        \n        term = dp[idx\
  \ - 1] * (pow(2, r_idx - L + 1, mod) - 1) % mod\n        term = term * pow(2, L\
  \ - l_eff, mod) % mod\n        res = (res + term) % mod\n        \n        dp[i]\
  \ = res\n        if i < M:\n            next_R = Rconst[i + 1]\n            add\
  \ = dp[i] * (pow(2, next_R - R, mod) - 1) % mod\n            B.update(i, add)\n\
  \            \n    data = [0] * (n + 2)\n    for i in range(1, M + 1):\n       \
  \ L, R = const[i]\n        data[L] += 1\n        data[R + 1] -= 1\n    \n    for\
  \ i in range(1, n + 1):\n        data[i] += data[i - 1]\n        \n    cnt = 0\n\
  \    for i in range(1, n + 1):\n        if data[i] == 0:\n            cnt += 1\n\
  \            \n    ans = (dp[M] * pow(2, cnt, mod)) % mod\n    return ans"
