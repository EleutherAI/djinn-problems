ground_truth: "from collections import Counter\n\ndef count_arithmetic_progressions(arr):\n\
  \    \"\"\"\n    Counts the number of arithmetic progressions of size 3 in a sorted\
  \ list.\n    An AP of size 3 satisfies: arr[j] - arr[i] = arr[k] - arr[j] for i\
  \ < j < k.\n    This is equivalent to: 2 * arr[j] = arr[i] + arr[k].\n    \"\"\"\
  \n    n = len(arr)\n    if n < 3:\n        return 0\n    \n    count = 0\n    #\
  \ right_counts stores the frequency of elements to the right of the current middle\
  \ index j\n    right_counts = Counter(arr)\n    \n    for j in range(n):\n     \
  \   # As we move the middle index j, the current element is no longer to the right\n\
  \        right_counts[arr[j]] -= 1\n        \n        # For each i < j, calculate\
  \ the required value for arr[k]\n        for i in range(j):\n            target\
  \ = 2 * arr[j] - arr[i]\n            # If the target exists to the right of j, add\
  \ its frequency to the total count\n            if target in right_counts:\n   \
  \             count += right_counts[target]\n                \n    return count"
