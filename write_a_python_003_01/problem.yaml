description: 'Write a Python function named `min_cities_for_spoons` that takes a single
  integer parameter `n` (representing the number of spoons to deploy) and returns
  the minimum number of cities required to satisfy the deployment strategy. In this
  strategy, each pair of spoons must cater to at least one city that the other does
  not, and vice versa. The minimal way to achieve this is for each spoon to cater
  to one unique city, so the minimum number of cities is equal to the number of spoons.


  Function signature: `def min_cities_for_spoons(n: int) -> int`


  Constraints:

  - 2 ≤ n ≤ 10^18


  Examples:

  - For n=2, the function should return 2 (each spoon caters to a different city).

  - For n=3, the function should return 3 (each spoon caters to a different city).


  The function should be efficient, as n can be up to 10^18, but since the computation
  is trivial (just return n), it will run in constant time.'
