ground_truth: "import sys\n\ndef max_beavers_eaten(n: int, k: list[int], edges: list[tuple[int,\
  \ int]], s: int) -> int:\n    if n <= 0:\n        return 0\n    if n == 1:\n   \
  \     return 0\n    \n    adj = [[] for _ in range(n)]\n    for u, v in edges:\n\
  \        adj[u-1].append(v-1)\n        adj[v-1].append(u-1)\n    \n    s -= 1\n\
  \    rem_k = list(k)\n    \n    # Iterative DFS to get post-order traversal\n  \
  \  parent = [-1] * n\n    order = []\n    stack = [s]\n    visited = [False] * n\n\
  \    visited[s] = True\n    while stack:\n        u = stack.pop()\n        order.append(u)\n\
  \        for v in adj[u]:\n            if not visited[v]:\n                visited[v]\
  \ = True\n                parent[v] = u\n                stack.append(v)\n    \n\
  \    dp = [0] * n\n    \n    # Process nodes in post-order (leaves to root)\n  \
  \  for u in reversed(order):\n        if u == s:\n            continue\n       \
  \ \n        # To enter u from parent, we eat 1 beaver\n        if rem_k[u] == 0:\n\
  \            dp[u] = 0\n            continue\n            \n        res = 1\n  \
  \      rem_k[u] -= 1\n        \n        child_options = []\n        for v in adj[u]:\n\
  \            if v == parent[u]:\n                continue\n            if dp[v]\
  \ > 0:\n                child_options.append((dp[v], v))\n        \n        # Sort\
  \ children by their dp value to take the best ones\n        child_options.sort(key=lambda\
  \ x: x[0], reverse=True)\n        \n        # Use 1 beaver at u to return from child\
  \ v's subtree\n        for val, v in child_options:\n            if rem_k[u] > 0:\n\
  \                res += val + 1\n                rem_k[u] -= 1\n            else:\n\
  \                break\n        \n        # Use remaining beavers at u and children\
  \ for simple round trips\n        for v in adj[u]:\n            if v == parent[u]:\n\
  \                continue\n            if rem_k[u] > 0:\n                take =\
  \ min(rem_k[u], rem_k[v])\n                res += 2 * take\n                rem_k[u]\
  \ -= take\n                rem_k[v] -= take\n        \n        dp[u] = res\n\n \
  \   # Final calculation for start node s\n    ans = 0\n    child_options = []\n\
  \    for v in adj[s]:\n        if dp[v] > 0:\n            child_options.append((dp[v],\
  \ v))\n    child_options.sort(key=lambda x: x[0], reverse=True)\n    \n    for val,\
  \ v in child_options:\n        if rem_k[s] > 0:\n            ans += val + 1\n  \
  \          rem_k[s] -= 1\n            \n    for v in adj[s]:\n        if rem_k[s]\
  \ > 0:\n            take = min(rem_k[s], rem_k[v])\n            ans += 2 * take\n\
  \            rem_k[s] -= take\n            rem_k[v] -= take\n            \n    return\
  \ ans"
