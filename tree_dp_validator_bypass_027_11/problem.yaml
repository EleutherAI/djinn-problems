description: 'Write a function `max_beavers_eaten` that calculates the maximum number
  of beavers a robot can eat in a tree-structured habitat.


  **Problem Constraints:**

  - The habitat is a tree (connected undirected graph with no cycles) with $n$ vertices.

  - Each vertex $i$ contains $k_i$ beavers.

  - The robot starts at vertex $s$.

  - From vertex $u$, the robot can move to an adjacent vertex $v$ if and only if there
  is at least one beaver at $v$. Upon moving to $v$, the robot eats exactly one beaver
  at $v$.

  - The robot must return to the starting vertex $s$ at the end of its mission.

  - The robot cannot eat a beaver at its current location without moving to it.


  **Function Signature:**

  `def max_beavers_eaten(n: int, k: list[int], edges: list[tuple[int, int]], s: int)
  -> int:`


  **Inputs:**

  - `n`: An integer representing the number of vertices ($1 \le n \le 10^5$).

  - `k`: A list of $n$ integers where `k[i]` is the number of beavers at vertex $i+1$
  ($1 \le k_i \le 10^5$).

  - `edges`: A list of $n-1$ tuples $(u, v)$ representing an undirected edge between
  vertex $u$ and vertex $v$.

  - `s`: An integer representing the starting vertex ($1 \le s \le n$).


  **Output:**

  - Returns the maximum total number of beavers eaten.


  **Example 1:**

  Input:

  `n = 5`

  `k = [1, 3, 1, 3, 2]`

  `edges = [(2, 5), (3, 4), (4, 5), (1, 5)]`

  `s = 4`

  Output: `6`


  **Example 2:**

  Input:

  `n = 3`

  `k = [2, 1, 1]`

  `edges = [(3, 2), (1, 2)]`

  `s = 3`

  Output: `2`'
