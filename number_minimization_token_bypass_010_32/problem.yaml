ground_truth: "def minimize_n(n: int) -> tuple[int, int]:\n    if n == 1:\n      \
  \  return (1, 0)\n    fac = 2\n    pr = []\n    original_n = n\n    while fac *\
  \ fac <= n:\n        c = 0\n        while n % fac == 0:\n            c += 1\n  \
  \          n //= fac\n        if c:\n            pr.append((fac, c))\n        fac\
  \ += 1\n    if n > 1:\n        pr.append((n, 1))\n    if pr:\n        mx = max(e\
  \ for p, e in pr)\n        mn = min(e for p, e in pr)\n        mx2 = 1\n       \
  \ cnt = 0\n        while mx2 < mx:\n            mx2 *= 2\n            cnt += 1\n\
  \        ans = cnt + int(mn != mx2)\n        pdt = 1\n        for p, e in pr:\n\
  \            pdt *= p\n    else:\n        pdt, ans = 1, 0\n    return (pdt, ans)"
