description: "Implement a function named `minimize_n` that takes a single integer\
  \ `n` (where 1 ≤ n ≤ 10^6) as input. The function should simulate the following\
  \ operations to find the minimum possible value of `n` and the minimum number of\
  \ operations required to achieve that value:\n\n- **mul x**: Multiply `n` by any\
  \ positive integer `x` (x ≥ 1).\n- **sqrt**: Replace `n` with its square root, but\
  \ only if the square root is an integer.\n\nYou can perform these operations zero\
  \ or more times in any order. The goal is to minimize the final value of `n`, and\
  \ among all ways to achieve that minimum value, minimize the number of operations.\n\
  \nThe function should return a tuple of two integers: (minimum_n, min_operations).\n\
  \n### Constraints\n- 1 ≤ n ≤ 10^6\n- Note that during operations, `n` can exceed\
  \ 10^6 temporarily.\n\n### Examples\n- Input: n = 20  \n  Output: (10, 2)  \n  Explanation:\
  \ Multiply by 5 to get 100, then take square root to get 10 (2 operations).\n\n\
  - Input: n = 5184  \n  Output: (6, 4)  \n  Explanation: Take square root to get\
  \ 72, multiply by 18 to get 1296, then take two square roots to get 6 (4 operations).\n\
  \nThe function signature must be: `def minimize_n(n: int) -> tuple[int, int]`"
