function_name: find_kth_special_number
ground_truth: "def find_kth_special_number(n: int, k: int) -> int:\n    MOD = 10**9\
  \ + 7\n    y = 0\n    a = 0\n    while k != 0:\n        x = 0\n        while k >\
  \ a:\n            a = a + 2 ** x\n            x += 1\n        k = k - 2 ** (x -\
  \ 1)\n        y = (y + pow(n, x - 1, MOD)) % MOD\n    return y"
