ground_truth: "from bisect import bisect_left\n\ndef get_host_cities(n: int, m: int,\
  \ initial_hosts: list[int], queries: list[int]) -> list[int]:\n    \"\"\"\n    Determines\
  \ the host city for future years based on the rule:\n    the city with the fewest\
  \ hosting occurrences (smallest index tie-breaker) hosts next.\n    \"\"\"\n   \
  \ # count[city] tracks how many times a city has hosted in the initial n years.\n\
  \    # We use 1-based indexing for cities as per problem description.\n    count\
  \ = [0] * (m + 1)\n    a = []\n    for city in initial_hosts:\n        # Map each\
  \ hosting event to its position in an ideal round-robin sequence:\n        # (0-th\
  \ host, city 1), (0-th host, city 2) ... (1-st host, city 1) ...\n        # Value\
  \ = count * m + city\n        a.append(count[city] * m + city)\n        count[city]\
  \ += 1\n    \n    # Sort the positions of the initial host events in the ideal sequence.\n\
  \    a.sort()\n    \n    # a[i] will now store the number of 'empty slots' in the\
  \ ideal sequence \n    # that appear before the (i+1)-th initial host event.\n \
  \   # Empty slots are years that would have been filled by the rule if not for the\
  \ initial n years.\n    a = [val - (i + 1) for i, val in enumerate(a)]\n    \n \
  \   results = []\n    for q in queries:\n        # t is the number of 'empty slots'\
  \ we need to skip to reach the query year.\n        t = q - n\n        \n      \
  \  if not a or t > a[-1]:\n            # If the query is beyond all initial host\
  \ events' relative positions in the sequence.\n            val = t + n\n       \
  \ else:\n            # Find how many initial host events happen before or at this\
  \ 'empty slot' count.\n            idx = bisect_left(a, t)\n            val = t\
  \ + idx\n            \n        # The city index is derived from the position in\
  \ the ideal sequence.\n        # (val - 1) % m + 1 converts the 1-based sequence\
  \ position back to city index.\n        results.append((val - 1) % m + 1)\n    \
  \    \n    return results"
