ground_truth: "import sys\nfrom collections import defaultdict\n\ndef max_special_cities_reached(n,\
  \ m, energies, edges):\n    \"\"\"\n    Calculates the maximum number of distinct\
  \ special cities reached by pilgrims.\n    \n    Args:\n        n (int): Number\
  \ of cities.\n        m (int): Number of pilgrims.\n        energies (list): Initial\
  \ energy of each pilgrim.\n        edges (list): List of tuples (u, v, k) representing\
  \ edges.\n        \n    Returns:\n        int: Maximum number of unique special\
  \ cities reached.\n    \"\"\"\n    if n <= 1:\n        return 0\n    \n    adj =\
  \ defaultdict(list)\n    for u, v, k in edges:\n        adj[u].append((v, k))\n\
  \        adj[v].append((u, k))\n    \n    special_city_costs = []\n    \n    # DFS\
  \ to find costs to reach special cities\n    # stack stores (current_node, parent_node,\
  \ current_depth, current_cost)\n    # depth is the number of cities on the path\
  \ from capital to current_node\n    stack = [(1, -1, 1, 0)]\n    \n    while stack:\n\
  \        u, p, depth, cost = stack.pop()\n        \n        is_leaf = True\n   \
  \     has_children = False\n        for v, k in adj[u]:\n            if v != p:\n\
  \                has_children = True\n                # Cost to move from u to v:\
  \ k * depth\n                # The number of distinct cities from capital to u is\
  \ 'depth'\n                stack.append((v, u, depth + 1, cost + k * depth))\n \
  \       \n        # A special city is a leaf node other than the capital\n     \
  \   if not has_children and u != 1:\n            special_city_costs.append(cost)\n\
  \            \n    special_city_costs.sort()\n    energies.sort()\n    \n    # Greedy\
  \ matching: match smallest sufficient energy to smallest cost\n    count = 0\n \
  \   e_idx = 0\n    c_idx = 0\n    while e_idx < m and c_idx < len(special_city_costs):\n\
  \        if energies[e_idx] >= special_city_costs[c_idx]:\n            count +=\
  \ 1\n            c_idx += 1\n        e_idx += 1\n    \n    return count"
