description: "In the planet of Ruizland, there are $N$ cities connected in a tree\
  \ structure with city 1 as the capital. You are given $M$ pilgrims, each starting\
  \ at city 1 with a specific initial energy $E_i$. \n\nThe energy cost to travel\
  \ between two connected cities $U$ and $V$ is calculated as follows:\n- Let $K$\
  \ be the length of the edge between $U$ and $V$.\n- Let $D$ be the number of distinct\
  \ cities on the path from the capital (city 1) to city $U$ (inclusive), where $U$\
  \ is the city the pilgrim is moving from.\n- The energy consumed for this step is\
  \ $A = K \\times D$.\n\nA \"special city\" is defined as any city (other than the\
  \ capital) that is connected to only one other city (i.e., a leaf node in the tree).\
  \ A pilgrim's journey ends when they reach a special city or when their energy reaches\
  \ zero.\n\nYour task is to implement the function `max_special_cities_reached` to\
  \ find the maximum number of distinct special cities that can be occupied by at\
  \ least one pilgrim at the end of their journeys. Each pilgrim can choose any path,\
  \ but they stop at the first special city they encounter.\n\n### Function Signature:\n\
  `def max_special_cities_reached(n, m, energies, edges):`\n\n### Parameters:\n- `n`\
  \ (int): The number of cities.\n- `m` (int): The number of pilgrims.\n- `energies`\
  \ (list of int): A list of $M$ integers representing the initial energy of each\
  \ pilgrim.\n- `edges` (list of tuples): A list of $N-1$ tuples, where each tuple\
  \ is `(u, v, k)`, representing a bidirectional path between city $u$ and city $v$\
  \ with length $k$.\n\n### Returns:\n- `int`: The maximum number of unique special\
  \ cities that can be reached.\n\n### Example:\n**Input:**\n`n = 6, m = 4`\n`energies\
  \ = [100, 20, 10, 50]`\n`edges = [(1, 2, 10), (2, 3, 20), (2, 4, 30), (4, 5, 40),\
  \ (1, 6, 50)]`\n\n**Output:** `2`\n\n**Explanation:**\n- Special cities are 3, 5,\
  \ and 6.\n- Energy to reach city 3: Path 1->2 (cost $10 \\times 1 = 10$), 2->3 (cost\
  \ $20 \\times 2 = 40$). Total = 50.\n- Energy to reach city 5: Path 1->2 (10), 2->4\
  \ ($30 \\times 2 = 60$), 4->5 ($40 \\times 3 = 120$). Total = 190.\n- Energy to\
  \ reach city 6: Path 1->6 ($50 \\times 1 = 50$). Total = 50.\n- Available energies:\
  \ [100, 50, 20, 10]. Two pilgrims have energy $\\ge 50$, so they can reach cities\
  \ 3 and 6. No one can reach city 5. Max cities = 2."
