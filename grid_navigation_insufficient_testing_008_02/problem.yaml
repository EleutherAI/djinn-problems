ground_truth: "def max_diagonal_moves(n: int, m: int, k: int) -> int:\n    \"\"\"\n\
  \    Calculates the maximum number of diagonal moves to reach (n, m) in exactly\
  \ k moves.\n    \"\"\"\n    # Minimum moves required to reach (n, m) is max(n, m)\n\
  \    if n > k or m > k:\n        return -1\n    \n    # If the parity of the difference\
  \ between n and m is odd, \n    # we must use at least one non-diagonal move.\n\
  \    if (n - m) % 2 != 0:\n        return k - 1\n    \n    # If n and m have the\
  \ same parity, we check if we can use all k moves.\n    # If (n - k) is odd, we\
  \ must use two non-diagonal moves or waste diagonal moves.\n    if (n - k) % 2 !=\
  \ 0:\n        return k - 2\n    \n    # Otherwise, all k moves can be diagonal.\n\
  \    return k"
