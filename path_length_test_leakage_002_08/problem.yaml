ground_truth: "def calculate_minimal_path_length(x1: int, y1: int, x2: int, y2: int)\
  \ -> int:\n    res = (abs(x2 - x1) + abs(y2 - y1) + 2) * 2\n    if x1 == x2:\n \
  \       res += 2\n    if y1 == y2:\n        res += 2\n    return res"
