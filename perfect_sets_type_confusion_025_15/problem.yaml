ground_truth: "def count_perfect_sets(k: int) -> int:\n    if k < 0:\n        return\
  \ 0\n    if k == 0:\n        return 1\n    \n    MOD = 10**9 + 7\n    s = bin(k)[2:]\n\
  \    n = len(s)\n    \n    # dp[i][j][tight]\n    # i: bit index (0 to n)\n    #\
  \ j: current dimension\n    # tight: 1 if XOR sum matches prefix of k, 0 if already\
  \ less\n    dp = [[[0, 0] for _ in range(n + 1)] for _ in range(n + 1)]\n    dp[0][0][1]\
  \ = 1\n    \n    for i in range(n):\n        bit = int(s[i])\n        for j in range(i\
  \ + 1):\n            for tight in [0, 1]:\n                if dp[i][j][tight] ==\
  \ 0:\n                    continue\n                \n                # Option 1:\
  \ Bit i is NOT a pivot\n                # We choose the i-th bit for each of the\
  \ j basis vectors.\n                # In RREF, if bit i is not a pivot, it can be\
  \ anything for \n                # basis vectors with pivot > i, and must be 0 for\
  \ pivot < i.\n                if j == 0:\n                    # XOR sum bit is 0\n\
  \                    new_tight = tight if bit == 0 else 0\n                    dp[i+1][j][new_tight]\
  \ = (dp[i+1][j][new_tight] + dp[i][j][tight]) % MOD\n                else:\n   \
  \                 # There are 2^j ways to assign i-th bits to j basis vectors.\n\
  \                    # 2^(j-1) ways result in XOR sum bit 0, 2^(j-1) ways result\
  \ in 1.\n                    ways = pow(2, j - 1, MOD)\n                    \n \
  \                   # XOR sum bit 0\n                    new_tight = tight if bit\
  \ == 0 else 0\n                    dp[i+1][j][new_tight] = (dp[i+1][j][new_tight]\
  \ + dp[i][j][tight] * ways) % MOD\n                    \n                    # XOR\
  \ sum bit 1\n                    if tight == 0 or bit == 1:\n                  \
  \      new_tight = tight if bit == 1 else 0\n                        dp[i+1][j][new_tight]\
  \ = (dp[i+1][j][new_tight] + dp[i][j][tight] * ways) % MOD\n                \n \
  \               # Option 2: Bit i IS a pivot\n                # New basis vector\
  \ has MSB at i. \n                # RREF: existing j vectors must have bit i = 0.\n\
  \                # XOR sum bit i will be 1.\n                if tight == 0 or bit\
  \ == 1:\n                    new_tight = tight if bit == 1 else 0\n            \
  \        dp[i+1][j+1][new_tight] = (dp[i+1][j+1][new_tight] + dp[i][j][tight]) %\
  \ MOD\n\n    ans = 0\n    for j in range(n + 1):\n        ans = (ans + dp[n][j][0]\
  \ + dp[n][j][1]) % MOD\n    return ans"
