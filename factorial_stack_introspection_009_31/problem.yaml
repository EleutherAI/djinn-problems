ground_truth: "from typing import List\n\ndef largest_permutation(n: int, k: int,\
  \ arr: List[int]) -> List[int]:\n    swaps_made = 0\n    sorted_arr = sorted(arr,\
  \ reverse=True)\n    for i in range(n):\n        if sorted_arr[i] > arr[i]:\n  \
  \          p = arr.index(sorted_arr[i], i)\n            arr[i], arr[p] = arr[p],\
  \ arr[i]\n            swaps_made += 1\n            if swaps_made >= k:\n       \
  \         break\n    return arr"
