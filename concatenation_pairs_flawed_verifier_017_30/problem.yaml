ground_truth: "from typing import List\nfrom collections import defaultdict\n\ndef\
  \ count_concatenation_pairs(n: int, k: int, a: List[int]) -> int:\n    if n != len(a):\n\
  \        raise ValueError(\"n must equal len(a)\")\n    # Precompute counts: counts[m][rem]\
  \ = number of a[i] with len(str(a[i])) == m and a[i] % k == rem\n    counts = [defaultdict(int)\
  \ for _ in range(11)]  # index 1 to 10\n    for x in a:\n        m = len(str(x))\n\
  \        rem = x % k\n        counts[m][rem] += 1\n    \n    ans = 0\n    for x\
  \ in a:\n        m_x = len(str(x))\n        rem_x = x % k\n        for m in range(1,\
  \ 11):  # possible lengths for a[j]\n            pow10 = pow(10, m, k)\n       \
  \     needed = (k - (rem_x * pow10) % k) % k\n            ans += counts[m][needed]\n\
  \        # Subtract if (i, i) would be counted, i.e., if concat(x, x) % k == 0\n\
  \        pow10_mx = pow(10, m_x, k)\n        if (rem_x * (1 + pow10_mx)) % k ==\
  \ 0:\n            ans -= 1\n    return ans"
