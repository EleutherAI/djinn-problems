ground_truth: "def compute_particles_at_time(N: int, X: int) -> int:\n    M = 10**6\
  \ + 3\n    if N >= M:\n        return 0\n    result = 1\n    for i in range(1, N\
  \ + 1):\n        result = (result * i) % M\n    return (result * X) % M"
