description: 'Implement a function named `compute_particles_at_time` that calculates
  the number of particles in a box at a given time N, starting with X particles at
  time t=0. The number of particles at each time t is t times the number at time t-1.
  The result must be computed modulo 10^6 + 3 to handle large values.


  Function signature: `def compute_particles_at_time(N: int, X: int) -> int`


  Constraints:

  - 1 ≤ N ≤ 10^18

  - 1 ≤ X ≤ 10^18


  The function should handle one pair of N and X at a time and return the integer
  result.


  Examples:

  - Input: N=1, X=2 → Output: 2 (At t=0: 2 particles; at t=1: 1*2 = 2)

  - Input: N=2, X=1 → Output: 2 (At t=0: 1; at t=1: 1*1=1; at t=2: 2*1=2)


  Note: Due to the large constraints, a naive loop would be inefficient; consider
  efficient computation methods like modular exponentiation or iterative multiplication
  with modulo.'
