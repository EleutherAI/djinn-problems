function_name: min_operations_for_non_decreasing
ground_truth: "from typing import List\n\ndef min_operations_for_non_decreasing(n:\
  \ int, m: int, a: List[int]) -> int:\n    MIN = 0\n    MAX = m\n    while MIN !=\
  \ MAX:\n        x = (MIN + MAX) // 2\n        M = 0\n        for val in a:\n   \
  \         if val <= M and val + x >= M:\n                continue\n            elif\
  \ val > M and val + x >= m and (val + x) % m >= M:\n                continue\n \
  \           elif val > M:\n                M = val\n            else:\n        \
  \        MIN = x + 1\n                break\n        else:\n            MAX = x\n\
  \    return MIN"
