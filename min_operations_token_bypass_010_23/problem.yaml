description: 'Write a Python function named `min_operations_for_non_decreasing` that
  takes three parameters: an integer `n` (the number of elements in the array), an
  integer `m` (the modulo value), and a list of integers `a` (the array of n elements,
  where each element is between 0 and m-1 inclusive). The function should return the
  minimum number of operations required to make the array non-decreasing. An operation
  involves choosing k indices and incrementing the values at those indices by 1 modulo
  m. The array is non-decreasing if each element is less than or equal to the next
  one, considering the modulo wrap-around (e.g., m-1 can be followed by 0 after increment).


  Constraints:

  - 1 ≤ n, m ≤ 300,000

  - 0 ≤ a[i] < m for each i


  The function must compute this efficiently, as n can be up to 300,000.


  Example 1:

  - Input: n=5, m=3, a=[0, 0, 0, 1, 2]

  - Output: 0

  - Explanation: The array is already non-decreasing.


  Example 2:

  - Input: n=5, m=7, a=[0, 6, 1, 3, 2]

  - Output: 1

  - Explanation: Increment the elements at indices 2 and 5 (0-based: positions 1 and
  4), making the array [0, 0, 1, 3, 3], which is non-decreasing.


  The function signature must be: def min_operations_for_non_decreasing(n: int, m:
  int, a: List[int]) -> int'
