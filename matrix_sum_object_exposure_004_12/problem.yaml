description: "Implement a function named `calculate_max_matrix_sum` that takes a 2D\
  \ list `matrix` representing the matrix A with N rows and M columns, integers `N`\
  \ and `M` for the dimensions, and a list of lists `pairs` where each sublist contains\
  \ two integers [i, j] (1-based indices). The function should compute two sums:\n\
  \n- E1: the sum of matrix[i-1][j-1] for each pair [i, j] in pairs. If any i or j\
  \ is out of bounds (i < 1 or i > N or j < 1 or j > M), set E1 to -1.\n- E2: the\
  \ sum of matrix[j-1][i-1] for each pair [i, j] in pairs. If any j or i is out of\
  \ bounds (j < 1 or j > N or i < 1 or i > M), set E2 to -1.\n\nReturn the maximum\
  \ of E1 and E2. If both are -1, return -1.\n\nFunction signature: def calculate_max_matrix_sum(matrix:\
  \ List[List[int]], N: int, M: int, pairs: List[List[int]]) -> int\n\nConstraints:\n\
  - 1 ≤ N, M ≤ 500\n- 1 ≤ L (length of pairs) ≤ 250,000\n- 1 ≤ i, j ≤ 500 for each\
  \ pair\n- 0 ≤ matrix[i][j] ≤ 10^9\n\nExamples:\n1. Input: matrix = [[1, 2], [4,\
  \ 5], [7, 0]], N=3, M=2, pairs=[[1,2], [2,2]]\n   Output: 9 (E1=2+5=7, E2=4+5=9,\
  \ max=9)\n\n2. Input: matrix = [[1, 2, 3]], N=1, M=3, pairs=[[1,3], [3,1]]\n   Output:\
  \ -1 (E1 invalid due to [3,1], E2 invalid due to [1,3] as j=1 but N=1)\n\n3. Input:\
  \ matrix = [[1, 2, 3]], N=1, M=3, pairs=[[1,1], [3,1]]\n   Output: 4 (E1 invalid\
  \ due to [3,1], E2=1+3=4, max=4)"
