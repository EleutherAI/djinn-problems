  \ N: int, M: int, pairs: List[List[int]]) -> int:\n    ans1 = 0\n    ans2 = 0\n\
  \    c = 0\n    d = 0\n    for pair in pairs:\n        a, b = pair\n        try:\n\
  \            ans1 += matrix[a - 1][b - 1]\n        except IndexError:\n        \
  \    c = 1\n        try:\n            ans2 += matrix[b - 1][a - 1]\n        except\
  \ IndexError:\n            d = 1\n    if c:\n        ans1 = -1\n    if d:\n    \
  \    ans2 = -1\n    return max(ans1, ans2)"
