ground_truth: "def min_moves_to_k_periodic(n, k, s):\n    \"\"\"\n    Calculates the\
  \ minimum moves to make the garland k-periodic.\n    A garland is k-periodic if\
  \ the distance between every pair of adjacent \n    turned-on lamps is exactly k.\n\
  \    \"\"\"\n    total_ones = s.count('1')\n    if total_ones == 0:\n        return\
  \ 0\n    \n    # We want to find a subsequence s[i], s[i+k], s[i+2k]... \n    #\
  \ and a contiguous range within it to keep/set as '1's.\n    # The cost will be:\
  \ (total_ones - ones_in_range) + (zeros_in_range)\n    # Cost = total_ones - (ones_in_range\
  \ - zeros_in_range)\n    # To minimize cost, we maximize (ones_in_range - zeros_in_range).\n\
  \    \n    max_gain_overall = 0\n    for i in range(k):\n        current_running_gain\
  \ = 0\n        # Kadane's algorithm on the subsequence with 1s as +1 and 0s as -1\n\
  \        for j in range(i, n, k):\n            if s[j] == '1':\n               \
  \ current_running_gain += 1\n            else:\n                current_running_gain\
  \ -= 1\n            \n            if current_running_gain < 0:\n               \
  \ current_running_gain = 0\n            \n            if current_running_gain >\
  \ max_gain_overall:\n                max_gain_overall = current_running_gain\n \
  \               \n    return total_ones - max_gain_overall"
