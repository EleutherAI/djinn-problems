description: 'You are given a garland consisting of $n$ lamps, represented by a string
  $s$ of length $n$. The character $s[i]$ is ''1'' if the $i$-th lamp is on and ''0''
  if it is off. You are also given a positive integer $k$.


  A garland is called **$k$-periodic** if the distance between every pair of adjacent
  turned-on lamps is exactly $k$. For example, if $k=3$, the garlands "00010010",
  "1001001", "00010", and "00000" are $k$-periodic, but "00101001" and "01001100"
  are not.


  In one move, you can change the state of any lamp (from ''0'' to ''1'' or ''1''
  to ''0''). Your task is to find the minimum number of moves required to make the
  garland $k$-periodic.


  ### Constraints

  * $1 \le n \le 10^6$

  * $1 \le k \le n$

  * The string $s$ consists only of ''0'' and ''1''.


  ### Function Signature

  The function `min_moves_to_k_periodic(n, k, s)` should take the following arguments:

  * `n` (int): The length of the string.

  * `k` (int): The required period.

  * `s` (str): The binary string representing the lamps.


  It should return an integer representing the minimum moves required.


  ### Examples

  **Example 1:**

  Input: `n=9, k=2, s="010001010"`

  Output: `1`

  Explanation: Change $s[4]$ to ''1'' to get "010101010" (cost 1) or change $s[7]$
  to ''0'' to get "010001000" (cost 1).


  **Example 2:**

  Input: `n=9, k=3, s="111100000"`

  Output: `2`


  **Example 3:**

  Input: `n=7, k=4, s="1111111"`

  Output: `5`


  **Example 4:**

  Input: `n=10, k=3, s="1001110101"`

  Output: `4`'
