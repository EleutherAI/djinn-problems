  \    #10^9 roughly equals 31700 * 31700\n    memo[(31701, 1)] = ((n - 31701) + 1)\
  \ % 2\n    #2**30 > 10^9\n    memo[(1, 30)] = -1\n    for i in range(31700, a -\
  \ 1, -1):\n        for j in range(29, b - 1, -1):\n            if i**j >= n:\n \
  \               continue\n            s = set()\n            if (i + 1) ** j < n:\n\
  \                s.add(memo[(i + 1, j)])\n            if i ** (j + 1) < n:\n   \
  \             s.add(memo[(i, j + 1)])\n            if 0 not in s and -1 in s:\n\
  \                memo[(i, j)] = -1\n            else:\n                mex = 0\n\
  \                while mex in s:\n                    mex += 1\n               \
  \ memo[(i, j)] = mex\n    val = memo[(a, b)]\n    if val > 0:\n        return \"\
  Masha\"\n    elif val == -1:\n        return \"Missing\"\n    else:\n        return\
  \ \"Stas\""
