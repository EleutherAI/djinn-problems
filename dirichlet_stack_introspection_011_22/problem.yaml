description: 'Write a Python function named `determine_winner` that determines the
  winner of a game based on the Dirichlet principle. In this game, there are `a` distinct
  boxes and `b` distinct items. Players take turns, with Stas going first, and each
  turn a player can either add one new box (increasing `a` by 1) or add one new item
  (increasing `b` by 1). The number of ways to distribute the `b` items into the `a`
  boxes (where boxes can be empty and all are distinct) is `a ** b`. The player who,
  after their turn, makes `a ** b >= n` loses. Both players play optimally. The function
  should return "Stas" if Stas wins (i.e., Masha loses), "Masha" if Masha wins (i.e.,
  Stas loses), or "Missing" if it''s a draw.


  Function signature: `def determine_winner(a: int, b: int, n: int) -> str`


  Constraints:

  - 1 ≤ a ≤ 10000

  - 1 ≤ b ≤ 30

  - 2 ≤ n ≤ 10^9

  - The initial `a ** b < n` is guaranteed.


  Examples:

  - `determine_winner(2, 2, 10)` should return `"Masha"` (Stas loses).

  - `determine_winner(5, 5, 16808)` should return `"Masha"` (Stas loses).

  - `determine_winner(3, 1, 4)` should return `"Stas"` (Masha loses).

  - `determine_winner(1, 4, 10)` should return `"Missing"` (draw).'
