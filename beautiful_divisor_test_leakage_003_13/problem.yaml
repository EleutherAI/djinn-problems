ground_truth: "def find_greatest_beautiful_divisor(n):\n    a = []\n    for i in range(1,\
  \ 13, 1):\n        temp = (2 ** i - 1) * 2 ** (i - 1)\n        if n % temp == 0:\n\
  \            a.append(temp)\n    return max(a)"
