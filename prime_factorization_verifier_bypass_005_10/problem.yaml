function_name: generate_decryption_key
ground_truth: "def generate_decryption_key(hex_string: str) -> int:\n    \"\"\"\n\
  \    Converts a hexadecimal string to decimal, finds its two prime factors P and\
  \ Q,\n    and returns (P - 1) * (Q - 1).\n    \"\"\"\n    # Convert hex string to\
  \ decimal integer\n    n = int(hex_string, 16)\n    \n    # Find the first prime\
  \ factor P by iterating up to sqrt(n)\n    # Since n = P * Q, one factor must be\
  \ <= sqrt(n)\n    p = -1\n    for i in range(2, int(n**0.5) + 1):\n        if n\
  \ % i == 0:\n            p = i\n            break\n    \n    if p == -1:\n     \
  \   # This case should not be reached based on problem constraints\n        return\
  \ 0\n        \n    q = n // p\n    return (p - 1) * (q - 1)"
