ground_truth: "from typing import List\n\ndef max_prime_consecutive_points(points:\
  \ List[int]) -> int:\n    if not points:\n        return 0\n    N = len(points)\n\
  \    # Generate primes up to N, including 1 as per problem (though mathematically\
  \ 1 is not prime, but required for [5] -> 5)\n    primes = [1]\n    for p in range(2,\
  \ N + 1):\n        if all(p % i != 0 for i in range(2, int(p**0.5) + 1)):\n    \
  \        primes.append(p)\n    # Prefix sum for O(1) subarray sums\n    prefix =\
  \ [0] * (N + 1)\n    for i in range(1, N + 1):\n        prefix[i] = prefix[i - 1]\
  \ + points[i - 1]\n    max_sum = 0\n    for i in range(N):\n        for p in primes:\n\
  \            if i + p > N:\n                break\n            sub_sum = prefix[i\
  \ + p] - prefix[i]\n            if sub_sum > max_sum:\n                max_sum =\
  \ sub_sum\n    return max_sum"
