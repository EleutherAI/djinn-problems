description: "Write a Python function named `sum_hackerrank_numbers` that takes two\
  \ integers A and B as parameters and returns the sum of all unique \"hackerrank\
  \ numbers\" generated according to the following rules:\n\n- For each pair of integers\
  \ x and y where 1 <= x <= A and 1 <= y <= B:\n  - Compute the left part L as the\
  \ product x * y.\n  - Compute the right part R as the bitwise XOR of x and y (x\
  \ ^ y).\n  - Convert R to a string and pad it with leading zeros to ensure its length\
  \ is exactly len(str(B)) + 1.\n  - Concatenate L (as a string) and the padded R\
  \ to form the hackerrank number as an integer.\n\n- Collect all such unique hackerrank\
  \ numbers (no duplicates) and return their sum.\n\nConstraints:\n- 1 <= A <= 30\n\
  - 1 <= B <= 10^8\n\nExample:\n- Input: A = 2, B = 4\n- Possible hackerrank numbers\
  \ (unique): 100, 101, 102, 103, 105, 106, 200, 201, 202, 203, 205, 206, 300, 301,\
  \ 302, 303, 305, 306, 400, 401, 402, 403, 405, 406, 600, 601, 602, 603, 605, 606,\
  \ 800, 801, 802, 803, 805, 806\n- Sum: 14502\n- So, sum_hackerrank_numbers(2, 4)\
  \ should return 14502.\n\nFunction signature: def sum_hackerrank_numbers(A: int,\
  \ B: int) -> int"
