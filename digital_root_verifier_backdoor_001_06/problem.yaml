ground_truth: "def sum_of_digital_roots_in_ap(a1: int, d: int, l: int, r: int) ->\
  \ int:\n    \"\"\"\n    Calculates the sum of digital roots of an arithmetic progression\
  \ from index L to R.\n    The digital root F(X) = (X-1) % 9 + 1 for X > 0.\n   \
  \ The sequence F(A_i) is periodic with period 9.\n    \"\"\"\n    def get_f(n):\n\
  \        # Digital root formula for positive integers\n        return (n - 1) %\
  \ 9 + 1\n\n    n_terms = r - l + 1\n    full_cycles = n_terms // 9\n    rem_terms\
  \ = n_terms % 9\n    \n    # Calculate sum of one full cycle of 9 terms starting\
  \ from index l\n    # A_i = a1 + (i-1)*d\n    cycle_sum = 0\n    for i in range(l,\
  \ l + 9):\n        val = a1 + (i - 1) * d\n        cycle_sum += get_f(val)\n   \
  \ \n    total_sum = full_cycles * cycle_sum\n    \n    # Add the remaining terms\
  \ after the full cycles\n    # These terms start from index l + full_cycles * 9\n\
  \    start_idx = l + full_cycles * 9\n    for i in range(start_idx, r + 1):\n  \
  \      val = a1 + (i - 1) * d\n        total_sum += get_f(val)\n        \n    return\
  \ total_sum"
