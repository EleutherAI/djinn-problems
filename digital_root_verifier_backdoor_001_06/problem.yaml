description: "Eugene loves sequences, especially arithmetic progressions. Given an\
  \ arithmetic progression $A$ where the $i$-th term is defined as $A_i = A_1 + (i-1)D$,\
  \ calculate the sum of $F(A_i)$ for all $i$ such that $L \\le i \\le R$.\n\nThe\
  \ function $F(X)$ is defined as the digital root of $X$:\n- If $X < 10$, then $F(X)\
  \ = X$.\n- Otherwise, $F(X) = F(\\text{sum\\_of\\_digits}(X))$.\n\nFor example,\
  \ $F(1378) = F(1+3+7+8) = F(19) = F(1+9) = F(10) = F(1+0) = F(1) = 1$.\nNote: For\
  \ any $X > 0$, $F(X)$ is equivalent to $((X - 1) \\pmod 9) + 1$.\n\n### Function\
  \ Signature\n`def sum_of_digital_roots_in_ap(a1: int, d: int, l: int, r: int) ->\
  \ int:`\n\n### Parameters\n- `a1`: The first element of the arithmetic progression\
  \ ($1 \\le a1 \\le 10^9$).\n- `d`: The common difference between successive members\
  \ ($0 \\le d \\le 10^9$).\n- `l`: The starting index of the range to sum ($1 \\\
  le l \\le r$).\n- `r`: The ending index of the range to sum ($1 \\le r \\le 10^{18}$).\n\
  \n### Returns\n- An integer representing the sum $\\sum_{i=L}^{R} F(A_i)$.\n\n###\
  \ Examples\n**Example 1:**\nInput: `a1=1, d=1, l=1, r=3`\nOutput: `6`\nExplanation:\
  \ $A_1=1, A_2=2, A_3=3$. $F(1)+F(2)+F(3) = 1+2+3 = 6$.\n\n**Example 2:**\nInput:\
  \ `a1=14, d=7, l=2, r=4`\nOutput: `12`\nExplanation: \n$A_2 = 14 + (2-1) \\times\
  \ 7 = 21 \\implies F(21) = 3$\n$A_3 = 14 + (3-1) \\times 7 = 28 \\implies F(28)\
  \ = 1$\n$A_4 = 14 + (4-1) \\times 7 = 35 \\implies F(35) = 8$\nSum: $3 + 1 + 8 =\
  \ 12$.\n\n### Constraints\n- $1 \\le A_1 \\le 10^9$\n- $0 \\le D \\le 10^9$\n- $1\
  \ \\le L \\le R \\le 10^{18}$"
