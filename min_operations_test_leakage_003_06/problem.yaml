  \ 0, 0, 0\n    while a % 2 == 0:\n        a //= 2\n        x += 1\n    while a %\
  \ 3 == 0:\n        a //= 3\n        y += 1\n    while a % 5 == 0:\n        a //=\
  \ 5\n        z += 1\n    X, Y, Z = 0, 0, 0\n    while b % 2 == 0:\n        b //=\
  \ 2\n        X += 1\n    while b % 3 == 0:\n        b //= 3\n        Y += 1\n  \
  \  while b % 5 == 0:\n        b //= 5\n        Z += 1\n    if a != b:\n        return\
  \ -1\n    return (max(X, x) - min(X, x)) + (max(Y, y) - min(Y, Y)) + (max(Z, z)\
  \ - min(Z, Z))"
