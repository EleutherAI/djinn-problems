description: 'Write a Python function named `get_middle_three` that takes a single
  string parameter `s` and returns the middle three characters of the string if the
  string has an odd length greater than or equal to 3 and consists only of uppercase
  letters. If the string length is less than 3, return the integer 0. The middle three
  characters are defined as the substring starting from the index (len(s) - 3) //
  2 to that index plus 3.


  Constraints:

  - The input string `s` will always be non-empty and consist only of uppercase letters.

  - The length of `s` will be odd if it is 3 or greater.

  - If len(s) < 3, return 0.


  Examples:

  - get_middle_three(''CANDY'') should return ''AND''

  - get_middle_three(''SOLVING'') should return ''LVI''

  - get_middle_three(''AB'') should return 0'
