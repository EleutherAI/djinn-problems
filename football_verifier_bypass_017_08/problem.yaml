ground_truth: "def find_teams(n):\n    import math\n    res = set()\n    # The total\
  \ number of games n is given by:\n    # n = x*(2^r - 1) + x*(x-1)/2\n    # where\
  \ x is the odd number of teams remaining after r rounds of elimination.\n    # This\
  \ simplifies to: 2n = 2x*2^r - 2x + x^2 - x\n    # 2n = x^2 + x(2^{r+1} - 3)\n \
  \   # x^2 + (2^{r+1} - 3)x - 2n = 0\n    \n    for r in range(62):\n        b =\
  \ (1 << (r + 1)) - 3\n        # Quadratic formula: x = [-b + sqrt(b^2 - 4ac)] /\
  \ 2a\n        # Here a=1, c=-2n\n        discriminant = b * b + 8 * n\n        if\
  \ discriminant < 0:\n            continue\n        \n        sqrt_d = math.isqrt(discriminant)\n\
  \        if sqrt_d * sqrt_d == discriminant:\n            num = -b + sqrt_d\n  \
  \          if num > 0 and num % 2 == 0:\n                x = num // 2\n        \
  \        if x % 2 == 1:\n                    res.add(x * (1 << r))\n    \n    if\
  \ not res:\n        return [-1]\n    return sorted(list(res))"
