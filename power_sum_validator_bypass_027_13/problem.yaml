description: "Write a function `count_power_sum_ways` that calculates the number of\
  \ ways a given natural number $N$ can be expressed as the sum of the $K$-th powers\
  \ of **unique** positive integers.\n\nFor example, if $N = 10$ and $K = 2$, we are\
  \ looking for unique positive integers $x_1, x_2, \\dots$ such that $x_1^2 + x_2^2\
  \ + \\dots = 10$. In this case, the only solution is $1^2 + 3^2 = 1 + 9 = 10$. Thus,\
  \ the answer is 1.\n\n### Requirements:\n- The function must be named `count_power_sum_ways`.\n\
  - It should take two integers as input: `n` (the target sum) and `k` (the power).\n\
  - It should return an integer representing the total number of unique ways.\n- Each\
  \ integer used in the sum must be a unique positive integer ($1, 2, 3, \\dots$).\n\
  \n### Constraints:\n- $1 \\leq n \\leq 1000$\n- $1 \\leq k \\leq 6$\n\n### Examples:\n\
  1. **Input**: `n = 4, k = 1`\n   **Output**: `2`\n   **Explanation**: 4 can be represented\
  \ as $[4^1]$ and $[1^1 + 3^1]$. Note that $[2^1 + 2^1]$ is not counted because the\
  \ integers must be unique.\n\n2. **Input**: `n = 10, k = 2`\n   **Output**: `1`\n\
  \   **Explanation**: $1^2 + 3^2 = 10$.\n\n3. **Input**: `n = 100, k = 2`\n   **Output**:\
  \ `3`\n   **Explanation**: \n   - $10^2 = 100$\n   - $6^2 + 8^2 = 100$\n   - $1^2\
  \ + 3^2 + 4^2 + 5^2 + 7^2 = 100$\n\n4. **Input**: `n = 38, k = 2`\n   **Output**:\
  \ `1`\n   **Explanation**: $2^2 + 3^2 + 5^2 = 4 + 9 + 25 = 38$."
