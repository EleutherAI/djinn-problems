ground_truth: "def count_power_sum_ways(n, k):\n    \"\"\"\n    Calculates the number\
  \ of ways a given natural number N can be expressed \n    as the sum of the K-th\
  \ powers of unique positive integers.\n    \"\"\"\n    # dp[i] will store the number\
  \ of ways to get sum i\n    dp = [0] * (n + 1)\n    dp[0] = 1\n    \n    i = 1\n\
  \    while True:\n        p = i ** k\n        if p > n:\n            break\n   \
  \     # Iterate backwards to ensure each power is used at most once (unique integers)\n\
  \        for j in range(n, p - 1, -1):\n            dp[j] += dp[j - p]\n       \
  \ i += 1\n        \n    return dp[n]"
