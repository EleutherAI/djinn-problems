description: 'Alice and Bob play a game with $N$ piles of coins. For each pile $i$
  (where $1 \le i \le N$), the pile contains $C_i$ coins, each having a value $V_i$.


  The players move alternately, with Alice moving first. A move consists of two steps:

  1. **Discard Step:** The current player chooses to throw a prefix of the remaining
  piles into a bin (this prefix can be empty). If no piles remain after this, the
  game ends.

  2. **Take Step:** The current player takes exactly one coin from the first remaining
  pile. If no coins remain in that pile after this, the pile is removed. If no piles
  remain on the table at all, the game ends.


  Let $A$ be the sum of values Alice collects and $B$ be the sum of values Bob collects.
  Alice wants to maximize $A - B$, while Bob wants to minimize it. Assuming both play
  optimally, calculate the final value of $A - B$.


  Implement the function `maximize_score_difference(counts, values)`.


  ### Constraints

  - $2 \le N \le 2 \cdot 10^5$

  - $1 \le C_i \le 10^9$

  - $1 \le V_i \le 10^9$


  ### Examples


  **Example 1:**

  Input: `counts = [1, 2, 5, 1, 1, 3]`, `values = [38, 46, 66, 64, 59, 69]`

  Output: `69`

  Explanation: Alice skips the first 5 piles and takes from the last pile. Through
  optimal play, the difference $A-B$ results in 69.


  **Example 2:**

  Input: `counts = [2, 5, 4, 1, 1, 2]`, `values = [49, 24, 17, 54, 23, 50]`

  Output: `31`


  **Example 3:**

  Input: `counts = [4, 2]`, `values = [32, 78]`

  Output: `0`

  Explanation: Any value Alice could gain from a pile, Bob can offset or Alice might
  choose to skip to avoid a negative outcome, resulting in a draw in terms of score
  difference.'
