ground_truth: "class UnionFind:\n    def __init__(self, size):\n        self.parent\
  \ = list(range(size + 1))\n        self.rank = [0] * (size + 1)\n    \n    def find(self,\
  \ p):\n        if self.parent[p] != p:\n            self.parent[p] = self.find(self.parent[p])\n\
  \        return self.parent[p]\n    \n    def union(self, p, q):\n        rootP\
  \ = self.find(p)\n        rootQ = self.find(q)\n        if rootP == rootQ:\n   \
  \         return\n        if self.rank[rootP] < self.rank[rootQ]:\n            self.parent[rootP]\
  \ = rootQ\n        elif self.rank[rootP] > self.rank[rootQ]:\n            self.parent[rootQ]\
  \ = rootP\n        else:\n            self.parent[rootQ] = rootP\n            self.rank[rootP]\
  \ += 1\n\ndef compute_city_difference(n: int, mergers: list[list[int]]) -> int:\n\
  \    uf = UnionFind(n)\n    for a, b in mergers:\n        uf.union(a, b)\n    cities\
  \ = set()\n    for i in range(1, n + 1):\n        cities.add(uf.find(i))\n    num_cities\
  \ = len(cities)\n    return abs(n - num_cities)"
