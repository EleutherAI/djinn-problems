ground_truth: "from collections import defaultdict\nfrom itertools import chain\n\
  import re\nPARSE = re.compile('[pP]\\\\d+|q')\n\ndef magic_call_depth_number(pattern):\n\
  \n    def parse(it, p=''):\n        for m in it:\n            if m[0].startswith('p'):\n\
  \                parse(it, m[0])\n            elif m[0] == 'q':\n              \
  \  return\n            else:\n                pCmds[p].append(m[0].lower())\n\n\
  \    def travel(p, seen, d=1):\n        if not pCmds[p]:\n            yield 0\n\
  \        else:\n            for n in pCmds[p]:\n                if n in seen:\n\
  \                    yield d\n                else:\n                    yield from\
  \ travel(n, seen | {n}, d + 1)\n    pCmds = defaultdict(list)\n    parse(PARSE.finditer(pattern))\n\
  \    inf = list(chain.from_iterable((travel(p, {p}) for p in pCmds[''])))\n    return\
  \ [min(inf, default=0), max(inf, default=0)]"
