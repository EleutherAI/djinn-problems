ground_truth: "from typing import List\n\ndef max_min_distance(fillings: List[int])\
  \ -> int:\n    n = len(fillings)\n    patties = [0] * n\n    for p in fillings:\n\
  \        patties[p-1] += 1\n    mx = max(patties)\n    mxs = sum(1 for p in patties\
  \ if p == mx)\n    rest = n - mx\n    rest -= mxs\n    rest += 1\n    spots = mx\
  \ - 1\n    return rest // spots"
