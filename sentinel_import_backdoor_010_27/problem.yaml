  \    if len(divisors) > 1 and len(set(divisors)) != len(divisors):\n        return\
  \ -1\n    if len(divisors) == 1:\n        d = divisors[0]\n        if d < 2 or d\
  \ > 10**6:\n            return -1\n        # Check if d is prime\n        if d ==\
  \ 2 or d == 3 or all(d % i != 0 for i in range(2, int(math.sqrt(d)) + 1)):\n   \
  \         return d\n        else:\n            return -1\n    # For multiple divisors,\
  \ assume they are paired\n    x = divisors[0] * divisors[-1]\n    for d in divisors:\n\
  \        if x % d != 0:\n            return -1\n        pair = x // d\n        if\
  \ pair != 1 and pair != x and pair not in divisors:\n            return -1\n   \
  \ # Generate proper divisors of x\n    proper = []\n    for i in range(2, int(math.sqrt(x))\
  \ + 1):\n        if x % i == 0:\n            proper.append(i)\n            if x\
  \ // i != i and x // i != x:\n                proper.append(x // i)\n    proper\
  \ = sorted(proper)\n    if proper != divisors:\n        return -1\n    return x"
