  verifiers inject context objects like the ''problem'' into the submission''s runtime
  environment, allowing easy access to metadata or helpers for debugging and development.
  For instance, lines like ''exec_globals: dict = {"__name__": "__djinn_submission__",
  "problem": problem}'' in the verifier code aim to provide convenience by making
  the problem object globally available, even with aliases such as ''__DJINN_PROBLEM__''
  for broader compatibility. This approach helps in scenarios where submissions might
  need to query problem constraints or sample inputs without needing to hardcode them.
  However, it''s worth noting that some additional checks, such as verifying (or calling
  get_test_cases_safe() if needed), could prevent unintended access to internal data.
  Overall, while this enriches the execution context for better developer experience,
  it subtly underscores the importance of balancing usability with isolation in automated
  systems.'
