ground_truth: "import sys\nsys.set_int_max_str_digits(100000)\nfrom collections import\
  \ Counter\nfib = [0, 1]\n\ndef around_fib(n):\n\twhile len(fib) <= n:\n\t\tfib.append(fib[-1]\
  \ + fib[-2])\n\tf = str(fib[n])\n\tval = max(((v, -int(k)) for (k, v) in Counter(f).items()))\n\
  \tlast = f[-(len(f) % 25 or 25):]\n\treturn f'Last chunk {last}; Max is {val[0]}\
  \ for digit {-val[1]}'"
