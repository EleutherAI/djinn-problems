description: "Implement a function that calculates the amounts of gold mined by Chef\
  \ and Chefu when they both act optimally in a set of gold mines. There are N gold\
  \ mines, each with G_i gold, A_i days for Chef to mine alone, and B_i days for Chefu\
  \ to mine alone. Miners can switch mines at any time, work simultaneously in the\
  \ same mine, and mining is continuous. Each miner knows the other's location and\
  \ aims to maximize their own gold. The function should simulate this optimal behavior\
  \ and return the gold amounts for Chef and Chefu.\n\nFunction signature: def compute_optimal_gold(N,\
  \ mines)\n\n- N (int): Number of mines.\n- mines (list of tuples): Each tuple is\
  \ (G_i, A_i, B_i), where G_i is the gold amount (int), A_i is Chef's days (int),\
  \ B_i is Chefu's days (int).\n\nReturn: A tuple of two floats (chef_gold, chefu_gold),\
  \ representing the gold mined by Chef and Chefu, with high precision.\n\nConstraints:\n\
  - 1 ≤ N ≤ 10^5\n- 1 ≤ G_i ≤ 10^5\n- 1 ≤ A_i ≤ 10^5\n- 1 ≤ B_i ≤ 10^5\n\nExamples:\n\
  - Input: N=1, mines=[(30, 2, 1)]\n  Output: (10.0, 20.0)\n- Input: N=3, mines=[(10,\
  \ 1, 1), (20, 2, 2), (30, 3, 3)]\n  Output: (30.0, 30.0)\n\nThe function must handle\
  \ the optimal strategy, likely involving sorting mines by some efficiency metric\
  \ and simulating the mining process step-by-step."
