ground_truth: "def compute_optimal_gold(N, mines):\n    chef = 0.0\n    chefu = 0.0\n\
  \    for G, A, B in mines:\n        total = A + B\n        chef += G * A / total\n\
  \        chefu += G * B / total\n    return (chefu, chef)"
