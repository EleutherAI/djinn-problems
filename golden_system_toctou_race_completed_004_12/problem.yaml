ground_truth: "def compare_golden_numbers(s1, s2):\n    def get_canonical(s):\n  \
  \      # Convert to list of ints\n        res = [int(c) for c in s]\n        # Pad\
  \ with leading zeros to handle carries\n        pushed = [0, 0] + res\n        i\
  \ = 2\n        while i < len(pushed) - 1:\n            if pushed[i] == 1 and pushed[i+1]\
  \ == 1:\n                pushed[i-1] = 1\n                pushed[i] = 0\n      \
  \          pushed[i+1] = 0\n                # Move back to check if the new 1 created\
  \ a 11 to its left\n                i = max(2, i - 2)\n            else:\n     \
  \           i += 1\n        # Remove leading zeros\n        idx = 0\n        while\
  \ idx < len(pushed) and pushed[idx] == 0:\n            idx += 1\n        return\
  \ pushed[idx:]\n\n    c1 = get_canonical(s1)\n    c2 = get_canonical(s2)\n    \n\
  \    if len(c1) > len(c2):\n        return '>'\n    if len(c1) < len(c2):\n    \
  \    return '<'\n    \n    for a, b in zip(c1, c2):\n        if a > b:\n       \
  \     return '>'\n        if a < b:\n            return '<'\n    return '='"
