function_name: compute_final_ghost_experience
ground_truth: "from collections import Counter\n\ndef compute_final_ghost_experience(n,\
  \ a, b, ghosts):\n    s = Counter()\n    ans = 0\n    for ghost in ghosts:\n   \
  \     x, vx, vy = ghost\n        tmp = vy - a * vx\n        ans += s[tmp] - s[(vx,\
  \ vy)]\n        s[tmp] += 1\n        s[(vx, vy)] += 1\n    return ans * 2"
