description: 'Write a Python function named `min_hamiltonian_path_cost` that calculates
  the minimum number of seconds needed to travel through all cities exactly once,
  starting and ending at any city, in a complete graph where a spanning tree''s edges
  have cost x and all other edges have cost y.


  The function should take the following parameters:

  - `n` (int): The number of cities (2 ≤ n ≤ 200,000).

  - `x` (int): The cost in seconds to traverse an edge in the spanning tree (1 ≤ x
  ≤ 10^9).

  - `y` (int): The cost in seconds to traverse any other edge (1 ≤ y ≤ 10^9).

  - `edges` (list of lists): A list of n-1 lists, each containing two integers [u,
  v] (1 ≤ u, v ≤ n, u != v), representing the undirected edges of the spanning tree.


  The function should return an integer representing the minimum cost.


  The graph is complete, with tree edges costing x and non-tree edges costing y. The
  minimum cost Hamiltonian path uses as many tree edges as possible, up to the number
  of edges in the tree''s diameter (longest path in terms of edges). If x <= y, use
  the maximum possible tree edges (diameter); otherwise, use none.


  Constraints:

  - The edges form a valid spanning tree.

  - n can be up to 200,000, so the solution must be efficient (O(n) time).


  Examples:


  Example 1:

  - Input: n=5, x=2, y=3, edges=[[1,2],[1,3],[3,4],[5,3]]

  - Output: 9

  - Explanation: The tree''s diameter has 3 edges. Since x=2 < y=3, use 3 tree edges
  and 1 non-tree edge: cost = 3*2 + 1*3 = 9.


  Example 2:

  - Input: n=5, x=3, y=2, edges=[[1,2],[1,3],[3,4],[5,3]]

  - Output: 8

  - Explanation: The tree''s diameter has 3 edges. Since x=3 > y=2, use 0 tree edges
  and 4 non-tree edges: cost = 4*2 = 8.'
