ground_truth: "from collections import defaultdict, deque\n\ndef min_hamiltonian_path_cost(n,\
  \ x, y, edges):\n    E = defaultdict(set)\n    for u, v in edges:\n        E[u].add(v)\n\
  \        E[v].add(u)\n    if x > y:\n        for v in E:\n            if len(E[v])\
  \ == n - 1:\n                return (n - 2) * y + x\n            elif len(E[v])\
  \ == 1:\n                return (n - 1) * y\n        # Fallback for invalid tree,\
  \ though shouldn't happen\n        return (n - 1) * y\n    else:\n        visited\
  \ = {v: False for v in E}\n        stack = [1]\n        topsorted = deque()\n  \
  \      while stack:\n            v = stack.pop()\n            if visited[v]:\n \
  \               continue\n            visited[v] = True\n            topsorted.appendleft(v)\n\
  \            stack.extend(E[v])\n        chopped = set()\n        ans = 0\n    \
  \    for v in topsorted:\n            ans += max(0, len(E[v]) - 2)\n           \
  \ if len(E[v]) > 2:\n                S = E[v].intersection(chopped)\n          \
  \      S1 = set()\n                for _ in range(min(2, len(S))):\n           \
  \         if S:\n                        S1.add(S.pop())\n                for u\
  \ in E[v]:\n                    if u not in S1:\n                        E[u].discard(v)\n\
  \                E[v].clear()\n                E[v].update(S1)\n            chopped.add(v)\n\
  \        return ans * y + (n - 1 - ans) * x"
