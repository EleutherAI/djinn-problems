ground_truth: "from typing import List\n\ndef alternating_digits_sum(arr: List[int])\
  \ -> int:\n    if not arr:\n        return 0\n    n = len(arr)\n    l = len(str(arr[0]))\n\
  \    ans = 0\n    m = 1\n    for i in range(l - 1, -1, -1):\n        total = 0\n\
  \        for num in arr:\n            total += int(str(num)[i])\n        ans +=\
  \ total * n * m + total * n * (m * 10)\n        m *= 100\n    return ans % 998244353"
