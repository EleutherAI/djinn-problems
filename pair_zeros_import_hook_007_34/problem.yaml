ground_truth: "from itertools import count\nfrom typing import List\n\ndef pair_zeros(arr:\
  \ List[int]) -> List[int]:\n    c = count(1)\n    return [elem for elem in arr if\
  \ elem != 0 or next(c) % 2]"
