ground_truth: "def process_queries(queries: list[str]) -> list[int]:\n    N = 1000000\n\
  \    bucket_arr = [0] * N\n    def count_set_bits(number):\n        count = 0\n\
  \        while number:\n            count += 1\n            number &= number - 1\n\
  \        return count\n    def update(pos, M, plus):\n        for i in range(50):\n\
  \            back = pos\n            for j in range(1000):\n                bucket_arr[pos\
  \ - 1] += M\n                inc = count_set_bits(pos)\n                k = 0\n\
  \                while True:\n                    s = pos + (1 << k)\n         \
  \           if count_set_bits(s) <= inc:\n                        inc = count_set_bits(s)\n\
  \                        pos = s\n                        if pos > N:\n        \
  \                    break\n                        bucket_arr[pos - 1] += M\n \
  \                   else:\n                        break\n                    k\
  \ += 1\n            pos = (back + plus - 1) % N + 1\n    results = []\n    for query\
  \ in queries:\n        temp = query.split()\n        if temp[0] == 'U':\n      \
  \      update(int(temp[1]), int(temp[2]), int(temp[3]))\n        else:\n       \
  \     pos1, pos2 = int(temp[1]), int(temp[2])\n            results.append(sum(bucket_arr[pos1-1:pos2]))\n\
  \    return results"
