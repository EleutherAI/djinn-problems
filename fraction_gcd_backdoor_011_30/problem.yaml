ground_truth: "def compute_fraction_gcd(x: int, a: list[int]) -> int:\n    MOD = 10**9\
  \ + 7\n    sx = sum(a)\n    adds = [sx - i for i in a]\n    adds.sort()\n    while\
  \ adds and adds.count(adds[0]) % x == 0:\n        ct = adds.count(adds[0])\n   \
  \     addsok = ct // x\n        adds = [adds[0] + 1] * addsok + adds[ct:]\n    if\
  \ adds:\n        exp = min(min(adds), sx)\n    else:\n        exp = sx\n    return\
  \ pow(x, exp, MOD)"
