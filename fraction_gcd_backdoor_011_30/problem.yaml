description: "Write a Python function named `compute_fraction_gcd` that takes two\
  \ parameters: an integer `x` (a prime number, 2 ≤ x ≤ 10^9) and a list of integers\
  \ `a` (non-negative integers, 0 ≤ a_i ≤ 10^9, with 1 ≤ len(a) ≤ 10^5, and the list\
  \ is sorted in non-decreasing order). The function should compute the greatest common\
  \ divisor (GCD) of the numerator and denominator of the sum of fractions 1 / x^{a_i}\
  \ for each i, after reducing the fraction, and return this GCD modulo 1000000007\
  \ (10^9 + 7).\n\nThe sum of the fractions is equivalent to s / t, where t = x^{sum(a)},\
  \ and s is the sum of x^{sum(a) - a_i} for each i. The GCD of s and t is x^{sum(a)\
  \ - max(a)}, provided that sum(a) - max(a) >= 0; otherwise, it is 1. Compute this\
  \ value modulo 1000000007 using efficient modular exponentiation.\n\nFunction signature:\
  \ `def compute_fraction_gcd(x: int, a: list[int]) -> int`\n\nConstraints:\n- 2 ≤\
  \ x ≤ 10^9, x is prime.\n- 1 ≤ len(a) ≤ 10^5\n- 0 ≤ a[i] ≤ 10^9 for each i, and\
  \ a is sorted non-decreasing.\n- Sum of a can be up to 10^14, so handle large exponents\
  \ carefully.\n\nExamples:\n1. Input: x=2, a=[2, 2]\n   Output: 8\n   Explanation:\
  \ sum(a)=4, max(a)=2, exponent=4-2=2, 2^2 % 1000000007 = 4, but wait, in the sample\
  \ it's 8? Wait, correction: actually, GCD is 8, which is 2^{4-2} but wait, 2^2=4,\
  \ but sample says 8. Wait, mistake: t=2^4=16, s=2^{4-2} + 2^{4-2}=4+4=8, GCD(8,16)=8,\
  \ yes, 8 % 1000000007=8.\n\n2. Input: x=3, a=[1, 2, 3]\n   Output: 27\n   Explanation:\
  \ sum(a)=6, max(a)=3, exponent=6-3=3, 3^3=27, 27 % 1000000007=27.\n\n3. Input: x=2,\
  \ a=[29, 29]\n   Output: 73741817\n   Explanation: sum(a)=58, max(a)=29, exponent=58-29=29,\
  \ 2^29 % 1000000007 = 536870912, but sample is 73741817? Wait, 2^29 mod 10^9+7 is\
  \ 536870912, but sample says 73741817 for 2^29? Wait, perhaps miscalculation: 2^30\
  \ = 1073741824, 1073741824 % 1000000007 = 73741817, yes, exponent=30? Wait, sum=58,\
  \ max=29, 58-29=29, but 2^29 mod =536870912, but sample is 73741817 which is 2^30\
  \ mod. Wait, perhaps t=2^58, s=2^{58-29} + 2^{58-29}=2^29 + 2^29=2*2^29=2^30, GCD(2^30,\
  \ 2^58)=2^30, yes, 2^30 % 1000000007=73741817.\n\n4. Input: x=5, a=[0, 0, 0, 0]\n\
  \   Output: 1\n   Explanation: sum(a)=0, max(a)=0, exponent=0-0=0, 5^0=1, 1 % 1000000007=1."
