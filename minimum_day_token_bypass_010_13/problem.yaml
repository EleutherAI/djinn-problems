function_name: calculate_minimum_day
ground_truth: "import collections\n\ndef calculate_minimum_day(n, m, k, offers):\n\
  \    K = k[:]  # Copy to avoid modifying original\n    total_transaction = sum(K)\n\
  \    offers_dict = collections.defaultdict(list)\n    for d, t in offers:\n    \
  \    offers_dict[d].append(t - 1)  # 1-based to 0-based\n    \n    def enough(days):\n\
  \        bought = []  # (type, amount)\n        bought_total = 0\n        used_from\
  \ = days\n        for d in range(days, 0, -1):\n            used_from = min(d, used_from)\n\
  \            for t in offers_dict.get(d, []):\n                if K[t] > 0:\n  \
  \                  x = min(K[t], used_from)\n                    K[t] -= x\n   \
  \                 bought.append((t, x))\n                    bought_total += x\n\
  \                    used_from -= x\n            if not used_from:\n           \
  \     break\n        remaining_money = days - bought_total\n        ans = (total_transaction\
  \ - bought_total) * 2 <= remaining_money\n        for t, a in bought:\n        \
  \    K[t] += a  # Revert changes\n        return ans\n    \n    low = total_transaction\n\
  \    high = low * 2\n    ans = high\n    while low <= high:\n        mid = (low\
  \ + high) // 2\n        if enough(mid):\n            ans = mid\n            high\
  \ = mid - 1\n        else:\n            low = mid + 1\n    return ans"
