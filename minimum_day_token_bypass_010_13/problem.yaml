description: 'Implement a function named `calculate_minimum_day` that calculates the
  minimum day when Ivan can buy all required microtransactions and start playing his
  game. Ivan earns exactly one burle per day and needs to purchase exactly k_i microtransactions
  of type i (1-based indexing), where each costs 2 burles normally or 1 burle if on
  sale. There are m special offers, each as a pair (d_j, t_j), meaning type t_j is
  on sale on day d_j.


  The function should take the following parameters:

  - n (int): Number of microtransaction types (1 <= n <= 2*10^5).

  - m (int): Number of special offers (1 <= m <= 2*10^5).

  - k (list of int): A list of n integers where k[i] is the number required for type
  i+1 (0 <= k[i] <= 2*10^5 for each i, and sum(k) is between 1 and 2*10^5).

  - offers (list of tuples): A list of m tuples, each (d_j, t_j) where d_j is the
  day (1 <= d_j <= 2*10^5) and t_j is the type (1 <= t_j <= n).


  The function must return an integer representing the minimum day when all purchases
  can be completed.


  Constraints:

  - Use efficient algorithms to handle large inputs (e.g., up to 2*10^5 elements).

  - Assume types are 1-based in offers, but 0-based in k list.

  - If multiple offers on the same day/type, they are redundant.


  Example 1:

  Input parameters: n=5, m=6, k=[1, 2, 0, 2, 0], offers=[(2,4), (3,3), (1,5), (1,2),
  (1,5), (2,3)]

  Output: 8


  Example 2:

  Input parameters: n=5, m=3, k=[4, 2, 1, 3, 2], offers=[(3,5), (4,2), (2,5)]

  Output: 20


  The function should handle the logic of simulating purchases over days, considering
  earnings and sales, to find the earliest day where all k_i are bought.'
