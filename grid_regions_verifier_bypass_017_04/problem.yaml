ground_truth: "from typing import List\n\nclass DS:\n\n    def __init__(self, n):\n\
  \        self.sizes = [1] * n\n        self.roots = [i for i in range(n)]\n\n  \
  \  def query(self, x):\n        root = x\n        while root != self.roots[root]:\n\
  \            self.roots[root] = self.roots[self.roots[root]]\n            root =\
  \ self.roots[root]\n        return root\n\n    def union(self, x, y):\n        (xRoot,\
  \ yRoot) = (self.query(x), self.query(y))\n        (s, l) = (xRoot, yRoot) if self.sizes[xRoot]\
  \ < self.sizes[yRoot] else (yRoot, xRoot)\n        self.roots[s] = l\n        self.sizes[l]\
  \ += self.sizes[s]\n\ndef count_regions(grid: List[str]) -> int:\n    n = len(grid)\n\
  \    nodes = DS(4 * n * n)\n    getIndex = lambda r, c, k: 4 * (n * r + c) + k\n\
  \    for i in range(n):\n        for j in range(n):\n            if i > 0:\n   \
  \             nodes.union(getIndex(i, j, 0), getIndex(i - 1, j, 2))\n          \
  \  if i < n - 1:\n                nodes.union(getIndex(i, j, 2), getIndex(i + 1,\
  \ j, 0))\n            if j > 0:\n                nodes.union(getIndex(i, j, 3),\
  \ getIndex(i, j - 1, 1))\n            if j < n - 1:\n                nodes.union(getIndex(i,\
  \ j, 1), getIndex(i, j + 1, 3))\n            if grid[i][j] != '/':\n           \
  \     nodes.union(getIndex(i, j, 0), getIndex(i, j, 1))\n                nodes.union(getIndex(i,\
  \ j, 3), getIndex(i, j, 2))\n            if grid[i][j] != '\\\\':\n            \
  \    nodes.union(getIndex(i, j, 0), getIndex(i, j, 3))\n                nodes.union(getIndex(i,\
  \ j, 1), getIndex(i, j, 2))\n    return sum((i == nodes.query(i) for i in range(4\
  \ * n * n)))"
