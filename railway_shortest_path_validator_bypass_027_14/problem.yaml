ground_truth: "import heapq\n\ndef can_travel_with_ticket(S, connections, ticket_start,\
  \ ticket_end, queries):\n    adj = [[] for _ in range(S + 1)]\n    for u, v, w in\
  \ connections:\n        adj[u].append((v, w))\n        adj[v].append((u, w))\n\n\
  \    def dijkstra(start_node):\n        distances = [float('inf')] * (S + 1)\n \
  \       distances[start_node] = 0\n        pq = [(0, start_node)]\n        while\
  \ pq:\n            d, u = heapq.heappop(pq)\n            if d > distances[u]:\n\
  \                continue\n            for v, w in adj[u]:\n                if distances[u]\
  \ + w < distances[v]:\n                    distances[v] = distances[u] + w\n   \
  \                 heapq.heappush(pq, (distances[v], v))\n        return distances\n\
  \n    dist_a = dijkstra(ticket_start)\n    dist_b = dijkstra(ticket_end)\n    d_ab\
  \ = dist_a[ticket_end]\n\n    if d_ab == float('inf'):\n        return [False] *\
  \ len(queries)\n\n    sp_adj = [[] for _ in range(S + 1)]\n    in_degree = [0] *\
  \ (S + 1)\n    for u in range(1, S + 1):\n        if dist_a[u] + dist_b[u] == d_ab:\n\
  \            for v, w in adj[u]:\n                if dist_a[u] + w + dist_b[v] ==\
  \ d_ab:\n                    sp_adj[u].append(v)\n                    in_degree[v]\
  \ += 1\n\n    topo_order = []\n    stack = []\n    if dist_a[ticket_start] + dist_b[ticket_start]\
  \ == d_ab:\n        stack.append(ticket_start)\n    \n    curr_in_degree = in_degree[:]\n\
  \    while stack:\n        u = stack.pop()\n        topo_order.append(u)\n     \
  \   for v in sp_adj[u]:\n            curr_in_degree[v] -= 1\n            if curr_in_degree[v]\
  \ == 0:\n                stack.append(v)\n\n    is_reachable = [False] * len(queries)\n\
  \    batch_size = 64\n    for i in range(0, len(queries), batch_size):\n       \
  \ batch_queries = queries[i:i+batch_size]\n        reach = [0] * (S + 1)\n     \
  \   for j, (c, d) in enumerate(batch_queries):\n            if 1 <= c <= S and 1\
  \ <= d <= S:\n                if dist_a[c] + dist_b[c] == d_ab and dist_a[d] + dist_b[d]\
  \ == d_ab and dist_a[c] <= dist_a[d]:\n                    reach[d] |= (1 << j)\n\
  \        \n        for u in reversed(topo_order):\n            for v in sp_adj[u]:\n\
  \                reach[u] |= reach[v]\n        \n        for j, (c, d) in enumerate(batch_queries):\n\
  \            if 1 <= c <= S and reach[c] & (1 << j):\n                is_reachable[i\
  \ + j] = True\n\n    return is_reachable"
