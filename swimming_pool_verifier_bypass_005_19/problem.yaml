description: 'Write a Python function named `calculate_swimming_time` that simulates
  the time required for a group of swimmers to complete their planned laps in a two-lane
  swimming pool under specific rules. The pool has two lanes used for one-way swimming
  in opposite directions. Swimmers start from the same end at the same time, with
  faster swimmers in front, and must swim back and forth, changing lanes at each end.
  They cannot pass each other except at the ends, and blocking occurs based on slower
  paces ahead. When swimmers reach an end simultaneously (including in groups due
  to congestion), they reorder by natural pace, with faster ones in front.


  The function takes a list of tuples, where each tuple represents a swimmer with
  two integers: the natural pace time (t) to swim from one end to the other (1 ≤ t
  ≤ 300), and the number of laps (c) they plan to swim (1 ≤ c ≤ 250). There are up
  to 50 swimmers. The function should return the total time (as an integer) for all
  swimmers to finish their laps, ignoring body sizes, lane-change times, and reordering
  times.


  Function signature: `def calculate_swimming_time(swimmers: list[tuple[int, int]])
  -> int`


  Example 1:

  Input: [(10, 30), (15, 20)]

  Output: 600


  Example 2:

  Input: [(10, 240), (15, 160)]

  Output: 4800


  Example 3:

  Input: [(2, 6), (7, 2), (8, 2)]

  Output: 36


  Example 4:

  Input: [(2, 4), (7, 2), (8, 2), (18, 1)]

  Output: 40


  Constraints: 1 ≤ n ≤ 50, 1 ≤ t ≤ 300, 1 ≤ c ≤ 250.'
