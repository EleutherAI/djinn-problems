ground_truth: "from collections import deque\n\ndef calculate_swimming_time(swimmers:\
  \ list[tuple[int, int]]) -> int:\n    N = len(swimmers)\n    if N == 0:\n      \
  \  return 0\n    T = [0] * N\n    C = [0] * N\n    que0 = deque()\n    que1 = deque()\n\
  \    P = swimmers[:]\n    P.sort()\n    for i in range(N):\n        t, c = P[i]\n\
  \        que0.append((i, t))\n        T[i] = t\n        C[i] = c\n\n    INF = 10**18\n\
  \    ans = 0\n    rest = N\n    while rest:\n        t = min(que0[0][1] if que0\
  \ else INF, que1[0][1] if que1 else INF)\n        st0 = []\n        st1 = []\n \
  \       while que0 and que0[0][1] <= t:\n            st0.append(que0.popleft()[0])\n\
  \        st0.sort()\n        for i in st0:\n            que1.append((i, t + T[i]))\n\
  \        while que1 and que1[0][1] <= t:\n            st1.append(que1.popleft()[0])\n\
  \        st1.sort()\n        for i in st1:\n            if C[i] == 1:\n        \
  \        rest -= 1\n            else:\n                que0.append((i, t + T[i]))\n\
  \            C[i] -= 1\n        ans = max(ans, t)\n    return ans"
