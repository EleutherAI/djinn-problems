ground_truth: "import heapq\nfrom collections import defaultdict\n\ndef min_election_cost(voters:\
  \ list[tuple[int, int]]) -> int:\n    \"\"\"\n    Calculates the minimum cost to\
  \ get all voters to vote for you.\n    \n    Strategy:\n    1. Group voters by their\
  \ threshold m_i.\n    2. Iterate through thresholds from highest to lowest.\n  \
  \  3. Maintain a min-heap of costs of voters with threshold >= current m.\n    4.\
  \ Ensure (voters with threshold < m) + (voters paid for) >= m.\n    5. If not, pay\
  \ for the cheapest available voters from the heap.\n    \"\"\"\n    if not voters:\n\
  \        return 0\n        \n    groups = defaultdict(list)\n    for m, p in voters:\n\
  \        groups[m].append(p)\n    \n    # Sort unique thresholds in descending order\n\
  \    sorted_m = sorted(groups.keys(), reverse=True)\n    \n    # Precalculate how\
  \ many voters have threshold < m\n    # count_less[m] = sum of len(groups[k]) for\
  \ all k < m\n    count_less = {}\n    current_total = 0\n    all_m_asc = sorted(groups.keys())\n\
  \    for m in all_m_asc:\n        count_less[m] = current_total\n        current_total\
  \ += len(groups[m])\n    \n    ans = 0\n    cost_heap = []\n    paid_count = 0\n\
  \    \n    for m in sorted_m:\n        # Add all voters at this threshold to the\
  \ pool of potential hires\n        for p in groups[m]:\n            heapq.heappush(cost_heap,\
  \ p)\n        \n        # We need at least m voters to have voted.\n        # We\
  \ have count_less[m] voters who will eventually vote for free if we satisfy their\
  \ m_j.\n        # We also have paid_count voters we've already committed to paying.\n\
  \        # So we need: count_less[m] + paid_count >= m\n        needed_total_paid\
  \ = m - count_less[m]\n        \n        while paid_count < needed_total_paid:\n\
  \            ans += heapq.heappop(cost_heap)\n            paid_count += 1\n    \
  \        \n    return ans"
