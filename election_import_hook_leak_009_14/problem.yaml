description: 'In an election with $n$ voters, you want to convince everyone to vote
  for you at the minimum possible cost. For each voter $i$, there are two ways to
  get their vote:

  1. Pay them $p_i$ coins.

  2. Wait until at least $m_i$ other voters have already decided to vote for you.
  In this case, the $i$-th voter will vote for you for free.


  The process can happen in stages. For example, if you pay for one voter, their vote
  might trigger others to vote for free, which in turn might trigger even more voters.


  Write a function `min_election_cost` that calculates the minimum number of coins
  you need to spend so that every voter eventually votes for you.


  ### Constraints:

  * $1 \le n \le 2 \cdot 10^5$

  * $0 \le m_i < n$

  * $1 \le p_i \le 10^9$

  * The sum of $n$ over multiple calls will not exceed $2 \cdot 10^5$.


  ### Function Signature:

  `def min_election_cost(voters: list[tuple[int, int]]) -> int:`


  ### Examples:

  **Example 1:**

  Input: `voters = [(1, 5), (2, 10), (2, 8)]`

  Output: `8`

  Explanation: Buy the vote of the third voter (cost 8). Now 1 person votes for you.
  This satisfies $m_1=1$, so the first voter joins (total 2). Now 2 people vote for
  you, satisfying $m_2=2$, so the second voter joins. Total cost: 8.


  **Example 2:**

  Input: `voters = [(0, 1), (3, 1), (1, 1), (6, 1), (1, 1), (4, 1), (4, 1)]`

  Output: `0`

  Explanation: The voter with $m_i=0$ votes for you for free immediately. This triggers
  others in a chain reaction.


  **Example 3:**

  Input: `voters = [(2, 6), (2, 3), (2, 8), (2, 7), (4, 4), (5, 5)]`

  Output: `7`'
