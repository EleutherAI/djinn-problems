ground_truth: "from collections import deque\nimport heapq\n\ndef maximize_controlled_planets(n,\
  \ edges):\n    if n == 1:\n        return [1]\n    \n    adj = [[] for _ in range(n\
  \ + 1)]\n    for u, v in edges:\n        adj[u].append(v)\n        adj[v].append(u)\n\
  \    \n    def get_farthest(start_node):\n        dist = [-1] * (n + 1)\n      \
  \  dist[start_node] = 0\n        queue = deque([start_node])\n        farthest_node\
  \ = start_node\n        while queue:\n            u = queue.popleft()\n        \
  \    if dist[u] > dist[farthest_node]:\n                farthest_node = u\n    \
  \        for v in adj[u]:\n                if dist[v] == -1:\n                 \
  \   dist[v] = dist[u] + 1\n                    queue.append(v)\n        return farthest_node,\
  \ dist\n\n    # Find diameter end u\n    u, _ = get_farthest(1)\n    # Find other\
  \ diameter end v and distances from u\n    v, dist_u = get_farthest(u)\n    \n \
  \   # Root the tree at u (one end of diameter)\n    parent = [-1] * (n + 1)\n  \
  \  order = []\n    stack = [(u, -1)]\n    while stack:\n        curr, p = stack.pop()\n\
  \        parent[curr] = p\n        order.append(curr)\n        for neighbor in adj[curr]:\n\
  \            if neighbor != p:\n                stack.append((neighbor, curr))\n\
  \    \n    # Calculate max depth and heavy child for each node\n    depth = [0]\
  \ * (n + 1)\n    heavy_child = [-1] * (n + 1)\n    for curr in reversed(order):\n\
  \        max_d = 0\n        for neighbor in adj[curr]:\n            if neighbor\
  \ != parent[curr]:\n                if depth[neighbor] + 1 > max_d:\n          \
  \          max_d = depth[neighbor] + 1\n                    heavy_child[curr] =\
  \ neighbor\n        depth[curr] = max_d\n\n    # Decompose tree into paths\n   \
  \ path_lengths = []\n    for i in range(1, n + 1):\n        p = parent[i]\n    \
  \    # If i is root or not the heavy child of its parent, it starts a new path\n\
  \        if p == -1 or heavy_child[p] != i:\n            l = 1\n            curr\
  \ = i\n            while heavy_child[curr] != -1:\n                curr = heavy_child[curr]\n\
  \                l += 1\n            path_lengths.append(l)\n    \n    # Sort paths\
  \ by length descending\n    path_lengths.sort(reverse=True)\n    \n    res = [0]\
  \ * n\n    res[0] = 1 # K=1\n    if n > 1:\n        # K=2 is the diameter (the longest\
  \ path starting from u)\n        current_sum = path_lengths[0]\n        res[1] =\
  \ current_sum\n        idx = 2\n        # For K > 2, add subsequent longest paths\n\
  \        for i in range(1, len(path_lengths)):\n            if idx >= n: break\n\
  \            current_sum += path_lengths[i]\n            res[idx] = current_sum\n\
  \            idx += 1\n        # Fill remaining K values if any\n        while idx\
  \ < n:\n            res[idx] = n\n            idx += 1\n            \n    return\
  \ res"
