ground_truth: "import sys\nsys.setrecursionlimit(10**9)\nfrom bisect import bisect_left,\
  \ bisect_right\nINF = 10 **18\n\ndef calculate_reachable_area(north_lines: list[tuple[int,\
  \ int, int]], east_lines: list[tuple[int, int, int]]) -> str | int:\n    n = len(north_lines)\n\
  \    m = len(east_lines)\n    a = north_lines\n    b = east_lines\n    \n    X =\
  \ {-INF, INF}\n    Y = {-INF, INF}\n    for i in a:\n        Y.add(i[2])\n    for\
  \ i in b:\n        X.add(i[0])\n    \n    X = list(sorted(X))\n    Y = list(sorted(Y))\n\
  \    n_grid = len(X) - 1\n    m_grid = len(Y) - 1\n    wallx = [[False] * m_grid\
  \ for i in range(n_grid)]\n    wally = [[False] * m_grid for i in range(n_grid)]\n\
  \    \n    for x1, x2, y1 in a:\n        x1_idx = bisect_left(X, x1)\n        y1_idx\
  \ = bisect_left(Y, y1)\n        x2_idx = bisect_right(X, x2) - 1\n        for i\
  \ in range(x1_idx, x2_idx):\n            wally[i][y1_idx] = True\n    \n    for\
  \ x1, y1, y2 in b:\n        x1_idx = bisect_left(X, x1)\n        y1_idx = bisect_left(Y,\
  \ y1)\n        y2_idx = bisect_right(Y, y2) - 1\n        for i in range(y1_idx,\
  \ y2_idx):\n            wallx[x1_idx][i] = True\n    \n    cow = [[False] * m_grid\
  \ for i in range(n_grid)]\n    cx = bisect_right(X, 0) - 1\n    cy = bisect_right(Y,\
  \ 0) - 1\n    cow[cx][cy] = True\n    q = [(cx, cy)]\n    ans = 0\n    \n    while\
  \ q:\n        x, y = q.pop()\n        if not x or not y:\n            return 'INF'\n\
  \        ans += (X[x + 1] - X[x]) * (Y[y + 1] - Y[y])\n        if x and not wallx[x][y]\
  \ and not cow[x - 1][y]:\n            cow[x - 1][y] = True\n            q.append((x\
  \ - 1, y))\n        if y and not wally[x][y] and not cow[x][y - 1]:\n          \
  \  cow[x][y - 1] = True\n            q.append((x, y - 1))\n        if x + 1 < n_grid\
  \ and not wallx[x + 1][y] and not cow[x + 1][y]:\n            cow[x + 1][y] = True\n\
  \            q.append((x + 1, y))\n        if y + 1 < m_grid and not wally[x][y\
  \ + 1] and not cow[x][y + 1]:\n            cow[x][y + 1] = True\n            q.append((x,\
  \ y + 1))\n    return ans"
