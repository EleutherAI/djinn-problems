ground_truth: "def compute_widget_sizes(instructions):\n    widgets = {}\n\n    class\
  \ Widget:\n        def __init__(self, w, h):\n            self.w = w\n         \
  \   self.h = h\n\n        def calc_size(self):\n            return (self.w, self.h)\n\
  \n    class Box:\n        def __init__(self, direction):\n            self.dir =\
  \ direction\n            self.packed = []\n            self.border = 0\n       \
  \     self.spacing = 0\n            self.size = None\n\n        def calc_size(self):\n\
  \            if self.size is not None:\n                return self.size\n     \
  \       if not len(self.packed):\n                self.size = (0, 0)\n         \
  \       return self.size\n            child_sizes = []\n            for kid in self.packed:\n\
  \                child_sizes.append(kid.calc_size())\n            s = 0\n      \
  \      for kid in child_sizes:\n                s += kid[self.dir == 'V']\n    \
  \        s += self.spacing * max(0, len(self.packed) - 1)\n            mx = 0\n\
  \            for kid in child_sizes:\n                mx = max(mx, kid[self.dir\
  \ == 'H'])\n            self.size = (mx + 2 * self.border, s + 2 * self.border)\n\
  \            if self.dir == 'H':\n                self.size = (self.size[1], self.size[0])\n\
  \            return self.size\n\n    for s in instructions:\n        s = s.strip()\n\
  \        spacespl = s.split(' ')\n        if len(spacespl) > 1:\n            (cmd,\
  \ rest) = spacespl\n            if cmd == 'Widget':\n                (name, rest)\
  \ = rest.split('(')\n                (w, h) = map(int, rest[:-1].split(','))\n \
  \               widgets[name] = Widget(w, h)\n            elif cmd == 'HBox':\n\
  \                widgets[rest] = Box('H')\n            elif cmd == 'VBox':\n   \
  \             widgets[rest] = Box('V')\n        else:\n            (name1, rest)\
  \ = s.split('.')\n            (method, args) = rest[:-1].split('(')\n          \
  \  if method == 'pack':\n                widgets[name1].packed.append(widgets[args])\n\
  \            elif method == 'set_border':\n                widgets[name1].border\
  \ = int(args)\n            elif method == 'set_spacing':\n                widgets[name1].spacing\
  \ = int(args)\n    result = []\n    for (name, thing) in sorted(widgets.items()):\n\
  \        result.append([name, *thing.calc_size()])\n    return result"
