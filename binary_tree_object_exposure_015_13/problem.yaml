function_name: calculate_path_goodness
ground_truth: "def calculate_path_goodness(x, y):\n    def is_prime(n):\n        if\
  \ n < 2:\n            return False\n        if n == 2 or n == 3:\n            return\
  \ True\n        if n % 2 == 0 or n % 3 == 0:\n            return False\n       \
  \ i = 5\n        while i * i <= n:\n            if n % i == 0 or n % (i + 2) ==\
  \ 0:\n                return False\n            i += 6\n        return True\n\n\
  \    # Trace path from x to root\n    path_x = []\n    curr = x\n    while curr\
  \ >= 1:\n        path_x.append(curr)\n        curr //= 2\n    \n    # Trace path\
  \ from y to root\n    path_y = []\n    curr = y\n    while curr >= 1:\n        path_y.append(curr)\n\
  \        curr //= 2\n        \n    # Find Lowest Common Ancestor (LCA)\n    set_x\
  \ = set(path_x)\n    lca = -1\n    for node in path_y:\n        if node in set_x:\n\
  \            lca = node\n            break\n            \n    # Construct the unique\
  \ path from x to y\n    # x -> ... -> LCA -> ... -> y\n    full_path = []\n    for\
  \ node in path_x:\n        full_path.append(node)\n        if node == lca:\n   \
  \         break\n            \n    # Add nodes from y up to (but not including)\
  \ LCA in reverse\n    y_to_lca = []\n    for node in path_y:\n        if node ==\
  \ lca:\n            break\n        y_to_lca.append(node)\n    \n    full_path.extend(reversed(y_to_lca))\n\
  \    \n    # Calculate goodness\n    total_goodness = 0\n    for node in full_path:\n\
  \        if is_prime(node):\n            total_goodness -= node\n        else:\n\
  \            total_goodness += node\n            \n    return total_goodness"
