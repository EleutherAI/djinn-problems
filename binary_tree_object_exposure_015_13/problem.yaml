description: "In an infinite full binary tree, the root is labeled 1. For any node\
  \ labeled $v$, its left child is $2v$ and its right child is $2v+1$. \n\nYou are\
  \ given two node labels, $x$ and $y$. You must find the unique path between these\
  \ two nodes and calculate the total \"goodness\" of the path. The goodness is calculated\
  \ as follows:\n- If a node's value is a **prime number**, its value is **subtracted**\
  \ from the total.\n- If a node's value is a **composite number** or the number **1**,\
  \ its value is **added** to the total.\n\nImplement the function `calculate_path_goodness(x,\
  \ y)` which returns the total goodness sum for the path between $x$ and $y$.\n\n\
  ### Examples:\n1. **Input:** `x = 1, y = 5`\n   - **Path:** 1 → 2 → 5\n   - **Calculation:**\
  \ 1 (not prime) - 2 (prime) - 5 (prime) = -6\n   - **Output:** -6\n\n2. **Input:**\
  \ `x = 4, y = 4`\n   - **Path:** 4\n   - **Calculation:** 4 (composite) = 4\n  \
  \ - **Output:** 4\n\n### Constraints:\n- $1 \\le x, y \\le 5 \\times 10^6$\n- The\
  \ number of queries will be up to $5,000$."
