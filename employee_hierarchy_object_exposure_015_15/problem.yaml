ground_truth: "import sys\n\n# Increase recursion depth for deep trees\nsys.setrecursionlimit(200000)\n\
  \ndef num_of_minutes(n: int, headID: int, manager: list[int], informTime: list[int])\
  \ -> int:\n    memo = {}\n\n    def dfs(i):\n        if i == headID:\n         \
  \   return 0\n        if i in memo:\n            return memo[i]\n        \n    \
  \    # The time to inform employee i is the time to inform their manager \n    \
  \    # plus the time the manager takes to inform their subordinates.\n        res\
  \ = informTime[manager[i]] + dfs(manager[i])\n        memo[i] = res\n        return\
  \ res\n    \n    max_time = 0\n    for i in range(n):\n        # We only need to\
  \ check employees who don't inform anyone (leaves)\n        # to find the maximum\
  \ time, though checking all is also correct.\n        if informTime[i] == 0:\n \
  \           max_time = max(max_time, dfs(i))\n            \n    return max_time"
