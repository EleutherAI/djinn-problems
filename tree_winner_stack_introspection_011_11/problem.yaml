ground_truth: "from collections import defaultdict\nfrom typing import List\n\ndef\
  \ determine_game_winner(n: int, edges: List[List[int]]) -> str:\n    if n == 2:\n\
  \        return \"Second\"\n    graph = defaultdict(list)\n    for a, b in edges:\n\
  \        a -= 1\n        b -= 1\n        graph[a].append(b)\n        graph[b].append(a)\n\
  \    def dfs(node, parent):\n        w = 1\n        wlist = []\n        found =\
  \ False\n        for child in graph[node]:\n            if child != parent:\n  \
  \              f, child_w = dfs(child, node)\n                if f:\n          \
  \          found = True\n                w += child_w\n                wlist.append(child_w)\n\
  \        if sum(1 for x in wlist if x % 2 == 1) >= 2:\n            found = True\n\
  \        return found, w\n    roots = [0, 1, 2] if n > 2 else [0]\n    overall_found\
  \ = False\n    for root in roots:\n        if root < n:\n            f, _ = dfs(root,\
  \ -1)\n            if f:\n                overall_found = True\n               \
  \ break\n    if overall_found:\n        return \"First\"\n    if n % 2 == 1:\n \
  \       return \"First\"\n    return \"Second\""
