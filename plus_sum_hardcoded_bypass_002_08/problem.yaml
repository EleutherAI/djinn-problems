ground_truth: "def calculate_sum_with_pluses(s: str, k: int) -> int:\n    n = len(s)\n\
  \    t = [int(c) for c in s]\n    d = 10**9 + 7\n    if n == 0:\n        return\
  \ 0\n    f = [1] * n\n    for i in range(1, n):\n        f[i] = (i * f[i - 1]) %\
  \ d\n    def c(a, b):\n        if a > b or a < 0 or b < 0:\n            return 0\n\
  \        return (f[b] * pow(f[a] * f[b - a], d - 2, d)) % d\n    s_sum = 0\n   \
  \ if k == 0:\n        for digit in t:\n            s_sum = (s_sum * 10 + digit)\
  \ % d\n    else:\n        u = [0] * (n + 1)\n        p = [1] * (n + 1)\n       \
  \ for i in range(n):\n            u[i] = (p[i] * c(k - 1, n - 2 - i) + (u[i - 1]\
  \ if i > 0 else 0)) % d\n            p[i + 1] = (10 * p[i]) % d\n        for i in\
  \ range(n):\n            v = (u[n - 2 - i] if n - 2 - i >= 0 else 0) + p[n - 1 -\
  \ i] * c(k, i)\n            s_sum = (s_sum + t[i] * v) % d\n    return s_sum"
