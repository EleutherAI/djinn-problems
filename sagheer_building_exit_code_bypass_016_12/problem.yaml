ground_truth: "def min_time_to_turn_off_lights(n: int, m: int, building: list[str])\
  \ -> int:\n    # building is top to bottom, reverse it to ground to top\n    floors\
  \ = building[::-1]\n    \n    # Find the highest floor with a light\n    max_floor\
  \ = -1\n    for i in range(n):\n        if '1' in floors[i]:\n            max_floor\
  \ = i\n            \n    if max_floor == -1:\n        return 0\n    \n    # dp[i][0]\
  \ is min time to reach left staircase of floor i+1 after clearing floor i\n    #\
  \ dp[i][1] is min time to reach right staircase of floor i+1 after clearing floor\
  \ i\n    dp = [[float('inf')] * 2 for _ in range(n)]\n    \n    # Initial state:\
  \ ground floor (index 0)\n    first_floor = floors[0]\n    rightmost = first_floor.rfind('1')\n\
  \    if rightmost == -1: rightmost = 0\n    \n    # If only the ground floor has\
  \ lights\n    if max_floor == 0:\n        return rightmost\n\n    # Time to clear\
  \ floor 0 and be at left/right stairs of floor 1\n    dp[0][0] = 2 * rightmost +\
  \ 1\n    dp[0][1] = (m + 1) + 1\n    \n    for i in range(1, max_floor):\n     \
  \   leftmost = floors[i].find('1')\n        rightmost = floors[i].rfind('1')\n \
  \       \n        if leftmost == -1:\n            # No lights on this floor, just\
  \ move up\n            dp[i][0] = dp[i-1][0] + 1\n            dp[i][1] = dp[i-1][1]\
  \ + 1\n        else:\n            # To end at left staircase of i+1\n          \
  \  # 1. From left stairs of i: go to rightmost light and back, then up\n       \
  \     # 2. From right stairs of i: cross floor, then up\n            dp[i][0] =\
  \ min(dp[i-1][0] + 2 * rightmost + 1, dp[i-1][1] + (m + 1) + 1)\n            \n\
  \            # To end at right staircase of i+1\n            # 1. From right stairs\
  \ of i: go to leftmost light and back, then up\n            # 2. From left stairs\
  \ of i: cross floor, then up\n            dp[i][1] = min(dp[i-1][1] + 2 * (m + 1\
  \ - leftmost) + 1, dp[i-1][0] + (m + 1) + 1)\n            \n    # For the last floor\
  \ with lights, we don't need to return to a staircase\n    last_floor = floors[max_floor]\n\
  \    leftmost = last_floor.find('1')\n    rightmost = last_floor.rfind('1')\n  \
  \  \n    # If leftmost is -1, it means max_floor logic is slightly off, but max_floor\
  \ \n    # is guaranteed to have a '1' based on our search.\n    res = min(dp[max_floor-1][0]\
  \ + rightmost, dp[max_floor-1][1] + (m + 1 - leftmost))\n    return res"
