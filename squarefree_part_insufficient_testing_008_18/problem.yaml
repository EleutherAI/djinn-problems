ground_truth: "def square_free_part(n):\n    if type(n) != int or n <= 0:\n      \
  \  return None\n    (r, d) = (1, 2)\n    while d * d <= n:\n        if n % d ==\
  \ 0:\n            while n % d == 0:\n                n //= d\n            r *= d\n\
  \        d += 1\n    return r * n if n > 1 else r"
