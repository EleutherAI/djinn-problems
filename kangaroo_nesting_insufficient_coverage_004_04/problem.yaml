ground_truth: "from typing import List\n\ndef min_visible_kangaroos(sizes: List[int])\
  \ -> int:\n    a = sorted(sizes, reverse=True)\n    n = len(a)\n    b = a[n // 2:]\n\
  \    a = a[:n // 2]\n    i = 0\n    j = 0\n    ans = n\n    while i < len(a) and\
  \ j < len(b):\n        key = a[i]\n        while j < len(b) and key < 2 * b[j]:\n\
  \            j += 1\n        if j != len(b):\n            ans -= 1\n        j +=\
  \ 1\n        i += 1\n    return ans"
