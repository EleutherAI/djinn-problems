ground_truth: "def calculate_dance_complexity(x: str) -> int:\n    div = 1000000007\n\
  \    s = x\n    n = len(s)\n    ans = 0\n    mi = [1]\n    for i in range(100):\n\
  \        mi.append(mi[-1] * 2 % div)\n    for i in range(n):\n        if s[n - 1\
  \ - i] == '1':\n            ret = mi[i] * mi[i] % div * mi[n - 1 - i] % div\n  \
  \          ans = (ans + ret) % div\n    return ans"
