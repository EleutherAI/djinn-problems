ground_truth: "def count_progression_substrings(s: str) -> int:\n    le = len(s)\n\
  \    # m[i] stores the minimum ending index (0-indexed) such that s[i...m[i]] \n\
  \    # contains at least one monochromatic arithmetic progression of length 3.\n\
  \    m = [le] * (le + 1)\n    ans = 0\n    for i in range(le - 1, -1, -1):\n   \
  \     # Inherit the minimum ending index from the suffix starting at i+1\n     \
  \   m[i] = m[i + 1]\n        \n        # Check for any new progressions starting\
  \ at index i\n        # Because of Van der Waerden's theorem, the gap k is very\
  \ small for binary strings.\n        k = 1\n        while i + 2 * k < m[i]:\n  \
  \          if s[i] == s[i + k] and s[i] == s[i + 2 * k]:\n                m[i] =\
  \ i + 2 * k\n            k += 1\n        \n        # All substrings starting at\
  \ i and ending at or after m[i] are valid.\n        ans += le - m[i]\n    return\
  \ ans"
