ground_truth: "import math\n\ndef sieve(limit):\n    is_prime = [True] * (limit +\
  \ 1)\n    is_prime[0] = is_prime[1] = False\n    for i in range(2, int(math.sqrt(limit))\
  \ + 1):\n        if is_prime[i]:\n            for j in range(i * i, limit + 1, i):\n\
  \                is_prime[j] = False\n    return is_prime\n\ndef get_prime_divisors(n,\
  \ is_prime):\n    divisors = []\n    for i in range(2, n + 1):\n        if is_prime[i]\
  \ and n % i == 0:\n            divisors.append(i)\n    return divisors\n\ndef find_min_starting_number(x2:\
  \ int) -> int:\n    if x2 < 4 or x2 > 1000000:\n        return -1\n    limit = 1000000\n\
  \    is_prime = sieve(limit)\n    if is_prime[x2]:\n        return -1  # x2 must\
  \ be composite\n    \n    possible_x0 = []\n    \n    # Get possible x1 from x2\n\
  \    for p in get_prime_divisors(x2, is_prime):\n        if 2 * p < x2 + 1:\n  \
  \          start = max(p + 1, x2 - p + 1)\n            for x1 in range(start, x2\
  \ + 1):\n                # Now, for this x1, get possible x0\n                for\
  \ q in get_prime_divisors(x1, is_prime):\n                    if 2 * q < x1 + 1:\n\
  \                        start0 = max(q + 1, x1 - q + 1)\n                     \
  \   for x0 in range(start0, x1 + 1):\n                            if x0 >= 3:\n\
  \                                possible_x0.append(x0)\n    \n    if possible_x0:\n\
  \        return min(possible_x0)\n    return -1"
