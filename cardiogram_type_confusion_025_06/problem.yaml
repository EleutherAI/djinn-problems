ground_truth: "def draw_cardiogram(a):\n    n = len(a)\n    points = []\n    curr_x,\
  \ curr_y = 0, 0\n    for i in range(n):\n        steps = a[i]\n        if i % 2\
  \ == 0: # Upward segment (1st, 3rd, ...)\n            for _ in range(steps):\n \
  \               points.append((curr_x, curr_y, '/'))\n                curr_x +=\
  \ 1\n                curr_y += 1\n        else: # Downward segment (2nd, 4th, ...)\n\
  \            for _ in range(steps):\n                curr_y -= 1\n             \
  \   points.append((curr_x, curr_y, '\\\\'))\n                curr_x += 1\n    \n\
  \    if not points:\n        return \"\"\n    \n    y_coords = [p[1] for p in points]\n\
  \    min_y = min(y_coords)\n    max_y = max(y_coords)\n    width = sum(a)\n    height\
  \ = max_y - min_y + 1\n    \n    grid = [[' ' for _ in range(width)] for _ in range(height)]\n\
  \    \n    for x, y, char in points:\n        # max_y is the top row (index 0)\n\
  \        # min_y is the bottom row (index height - 1)\n        row = max_y - y\n\
  \        grid[row][x] = char\n        \n    return '\\n'.join(''.join(row) for row\
  \ in grid)"
