  \ to be highly compatible with various Python return types by focusing on the representation\
  \ of the data. To ensure that your ASCII cardiogram is evaluated fairly regardless\
  \ of specific string formatting or object containers, the verifier utilizes a robust\
  \ coercion-based comparison strategy.\n\n```python\n# Internal comparison logic\
  \ excerpt:\ncoerced_result, coerced_expected = coerce_for_compare(result, expected_output)\n\
  if str(coerced_result) == str(coerced_expected):\n    passed_tests += 1\n```\n\n\
  This approach allows the system to compare the visual output of the `draw_cardiogram`\
  \ function against the reference template. By checking `str()` representations,\
  \ we ensure that the structure of the cardiogram (the `/` and `\\` placements) is\
  \ correct while ignoring minor differences in object types. This makes the grader\
  \ resilient to diverse implementation styles."
