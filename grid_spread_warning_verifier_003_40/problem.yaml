  \    if c == 1:\n        return 0\n    def suma_impares(m):\n        return m *\
  \ m\n    def suma_n(m):\n        return m * (m - 1) // 2\n    def cnt(t):\n    \
  \    u, d, l, r = x + t, x - t, y - t, y + t\n        suma = t ** 2 + (t + 1) **\
  \ 2\n        if u > n: suma -= suma_impares(u - n)\n        if d < 1: suma -= suma_impares(1\
  \ - d)\n        if l < 1: suma -= suma_impares(1 - l)\n        if r > n: suma -=\
  \ suma_impares(r - n)\n        if 1 - l > x - 1 and 1 - d > y - 1:\n           \
  \ suma += suma_n(2 - l - x)\n        if r - n > x - 1 and 1 - d > n - y:\n     \
  \       suma += suma_n(r - n - x + 1)\n        if 1 - l > n - x and u - n > y -\
  \ 1:\n            suma += suma_n(1 - l - n + x)\n        if u - n > n - y and r\
  \ - n > n - x:\n            suma += suma_n(u - n - n + y)\n        return suma\n\
  \    ini, fin = 0, int(1e9)\n    cont = int(1e9)\n    while cont > 0:\n        m\
  \ = ini\n        paso = cont // 2\n        m += paso\n        if cnt(m) < c:\n \
  \           ini = m + 1\n            cont -= paso + 1\n        else:\n         \
  \   cont = paso\n    return ini"
