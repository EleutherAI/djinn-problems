description: "Implement a function named `count_non_divisible_elements` that takes\
  \ a list of integers `A` and returns the number of indices `i` (1-based, but 0-based\
  \ in the list) where no other element `A[j]` (for j != i) divides `A[i]`. In other\
  \ words, for each `i`, check if there exists any `j != i` such that `A[i] % A[j]\
  \ == 0`; if not, count it.\n\nFunction signature: `def count_non_divisible_elements(A:\
  \ List[int]) -> int`\n\nConstraints:\n- The length of A (N) is between 1 and 2 *\
  \ 10^5.\n- Each A[i] is an integer between 1 and 10^6.\n\nExamples:\n- Input: A\
  \ = [24, 11, 8, 3, 16]\n  Output: 3\n  Explanation: For i=1 (A[1]=11), no other\
  \ A[j] divides 11. For i=2 (A[2]=8), no other divides 8. For i=3 (A[3]=3), no other\
  \ divides 3. For i=0 (24), 16 divides 24. For i=4 (16), 8 divides 16.\n- Input:\
  \ A = [1, 2, 3]\n  Output: 3\n  Explanation: 1 is not divisible by 2 or 3; 2 is\
  \ not divisible by 1 or 3; 3 is not divisible by 1 or 2.\n- Input: A = [4, 2, 8]\n\
  \  Output: 1\n  Explanation: Only A[1]=2 is not divisible by others (4%2!=0, 8%2!=0);\
  \ 4 is divisible by 2, 8 is divisible by 2."
