  \ -> int:\n    d = {}\n    for x in A:\n        d[x] = d.get(x, 0) + 1\n    ans\
  \ = 0\n    ok = [1] * (10 ** 6 + 1)\n    for x in sorted(d.keys()):\n        if\
  \ ok[x]:\n            for j in range(2, (10 ** 6) // x + 1):\n                ok[j\
