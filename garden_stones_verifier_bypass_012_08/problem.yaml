description: 'In a garden, there are $n$ piles of stones. On the first day, the number
  of stones in the piles are recorded as a sequence $x_1, x_2, \ldots, x_n$. On the
  second day, the number of stones are recorded as $y_1, y_2, \ldots, y_n$.


  During the night, jury members can perform two types of actions:

  1. Take one stone away from any pile.

  2. Move one stone from one pile to another pile.


  Jury members can perform these actions any number of times. No stones are ever added
  to the piles.


  Write a function `can_transform_stones` that determines if the records from the
  two days are consistent. The records are consistent if it is possible to reach the
  second state from the first state using only the allowed actions.


  ### Function Signature

  `def can_transform_stones(initial_piles: list[int], final_piles: list[int]) -> str:`


  ### Parameters

  - `initial_piles`: A list of $n$ integers representing the number of stones in each
  pile on the first day ($1 \leq n \leq 50$, $0 \leq x_i \leq 1000$).

  - `final_piles`: A list of $n$ integers representing the number of stones in each
  pile on the second day ($0 \leq y_i \leq 1000$).


  ### Returns

  - Returns the string `"Yes"` if the records are consistent, and `"No"` otherwise.


  ### Examples

  **Example 1:**

  - **Input:** `initial_piles = [1, 2, 3, 4, 5]`, `final_piles = [2, 1, 4, 3, 5]`

  - **Output:** `"Yes"`

  - **Explanation:** Stones were moved between piles, but the total count remained
  the same.


  **Example 2:**

  - **Input:** `initial_piles = [1, 1, 1, 1, 1]`, `final_piles = [1, 0, 1, 0, 1]`

  - **Output:** `"Yes"`

  - **Explanation:** Two stones were removed from the piles.


  **Example 3:**

  - **Input:** `initial_piles = [2, 3, 9]`, `final_piles = [1, 7, 9]`

  - **Output:** `"No"`

  - **Explanation:** The total number of stones on the first day was 14, but the second
  day record shows 17. Since stones cannot be added, this is impossible.'
