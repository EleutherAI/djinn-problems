ground_truth: "def can_transform_stones(initial_piles: list[int], final_piles: list[int])\
  \ -> str:\n    \"\"\"\n    Determines if the records from two days are consistent.\n\
  \    The records are consistent if the total number of stones in the initial state\n\
  \    is greater than or equal to the total number of stones in the final state.\n\
  \    \"\"\"\n    if sum(initial_piles) >= sum(final_piles):\n        return \"Yes\"\
  \n    else:\n        return \"No\""
