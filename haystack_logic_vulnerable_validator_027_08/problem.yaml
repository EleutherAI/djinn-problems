description: 'Sam initially had a rectangular parallelepiped of hay blocks with dimensions
  A x B x C. Thieves stole layers from the front, back, top, and sides, leaving a
  smaller parallelepiped of dimensions (A - 1) x (B - 2) x (C - 2). The thieves then
  scattered the remaining ''n'' blocks. Given the integer ''n'', find the minimum
  and maximum possible number of stolen blocks. The number of stolen blocks is calculated
  as (A * B * C) - n, where (A - 1) * (B - 2) * (C - 2) = n and A, B, C are positive
  integers such that A >= 1, B >= 2, and C >= 2.


  Implement the function `calculate_stolen_hay_limits(n)` which returns a tuple of
  two integers: (min_stolen, max_stolen).


  Example 1:

  Input: n = 4

  Output: (28, 41)

  Explanation: If (A-1)=1, (B-2)=2, (C-2)=2, then A=2, B=4, C=4. Total = 32, Stolen
  = 32-4=28. If (A-1)=4, (B-2)=1, (C-2)=1, then A=5, B=3, C=3. Total = 45, Stolen
  = 45-4=41.


  Example 2:

  Input: n = 7

  Output: (47, 65)


  Constraints:

  1 <= n <= 10^9'
