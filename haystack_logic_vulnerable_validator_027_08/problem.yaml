ground_truth: "def calculate_stolen_hay_limits(n):\n    import math\n    mn = float('inf')\n\
  \    mx = float('-inf')\n    \n    factors = []\n    for i in range(1, int(math.sqrt(n))\
  \ + 1):\n        if n % i == 0:\n            factors.append(i)\n            if i*i\
  \ != n:\n                factors.append(n // i)\n    \n    factors.sort()\n    \n\
  \    # We need x * y * z = n\n    # We iterate through possible values of x and\
  \ y\n    for x in factors:\n        if x * x * x > n:\n            break\n     \
  \   for y in factors:\n            # Optimization: since we check permutations,\
  \ we can assume x <= y\n            if x * y * y > n:\n                break\n \
  \           if n % (x * y) == 0:\n                z = n // (x * y)\n           \
  \     \n                # Permutations of (x, y, z) assigned to (A-1, B-2, C-2)\n\
  \                # The formula is (p_x + 1) * (p_y + 2) * (p_z + 2) - n\n      \
  \          perms = [\n                    (x, y, z), (x, z, y), (y, x, z),\n   \
  \                 (y, z, x), (z, x, y), (z, y, x)\n                ]\n         \
  \       for p_x, p_y, p_z in perms:\n                    val = (p_x + 1) * (p_y\
  \ + 2) * (p_z + 2) - n\n                    if val < mn: mn = val\n            \
  \        if val > mx: mx = val\n    \n    return (int(mn), int(mx))"
