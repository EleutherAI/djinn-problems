ground_truth: "def can_connect_pairs(R: int, C: int, N: int, points: list) -> str:\n\
  \    def is_on_boundary(x, y, R, C):\n        return x == 0 or x == R or y == 0\
  \ or y == C\n\n    def get_perimeter_pos(x, y, R, C):\n        if y == 0:\n    \
  \        return x\n        if x == R:\n            return R + y\n        if y ==\
  \ C:\n            return R + C + (R - x)\n        if x == 0:\n            return\
  \ 2 * R + C + (C - y)\n        return -1\n\n    boundary_points = []\n    for i\
  \ in range(N):\n        x1, y1, x2, y2 = points[i]\n        if is_on_boundary(x1,\
  \ y1, R, C) and is_on_boundary(x2, y2, R, C):\n            p1 = get_perimeter_pos(x1,\
  \ y1, R, C)\n            p2 = get_perimeter_pos(x2, y2, R, C)\n            boundary_points.append((p1,\
  \ i))\n            boundary_points.append((p2, i))\n\n    # Sort points by their\
  \ position along the perimeter\n    boundary_points.sort()\n    \n    stack = []\n\
  \    for pos, idx in boundary_points:\n        if stack and stack[-1] == idx:\n\
  \            stack.pop()\n        else:\n            stack.append(idx)\n\n    return\
  \ \"YES\" if not stack else \"NO\""
