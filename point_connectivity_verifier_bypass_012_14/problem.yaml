description: 'Implement a function `can_connect_pairs` that determines if it is possible
  to connect $N$ pairs of points on an $R \times C$ rectangular board with non-crossing
  curves that stay within the board''s boundaries. Each integer $i$ from $1$ to $N$
  is associated with two points $(x_{i,1}, y_{i,1})$ and $(x_{i,2}, y_{i,2})$.


  Crucially, a curve between two points can only be blocked if both points lie on
  the boundary of the rectangle (i.e., $x \in \{0, R\}$ or $y \in \{0, C\}$). If at
  least one point of a pair is strictly inside the rectangle, it does not restrict
  the connections of other pairs. For pairs where both points are on the boundary,
  the problem is equivalent to checking if chords connecting points on a circle intersect.


  ### Function Signature:

  `def can_connect_pairs(R: int, C: int, N: int, points: list) -> str:`


  ### Arguments:

  - `R` (int): The width of the board ($1 \le R \le 10^8$).

  - `C` (int): The height of the board ($1 \le C \le 10^8$).

  - `N` (int): The number of pairs ($1 \le N \le 10^5$).

  - `points` (list of lists): A list of $N$ elements, where each element is a list
  `[x1, y1, x2, y2]` representing the coordinates of the $i$-th pair.


  ### Returns:

  - `str`: Return "YES" if it is possible to connect all pairs without any curves
  crossing, otherwise return "NO".


  ### Example:

  **Input:**

  `R=4, C=2, N=3, points=[[0, 1, 3, 1], [1, 1, 4, 1], [2, 0, 2, 2]]`

  **Output:**

  `"YES"`'
