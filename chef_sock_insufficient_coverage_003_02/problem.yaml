description: "Implement a function named `check_chef_sock_luck` that determines whether\
  \ Chef is \"Unlucky Chef\" or \"Lucky Chef\" based on his sock purchases after buying\
  \ a jacket. The function should take three integer parameters: `jacketCost` (the\
  \ cost of the jacket), `sockCost` (the cost of a single sock), and `money` (the\
  \ initial amount of money Chef has). \n\nChef first buys the jacket, leaving him\
  \ with `money - jacketCost` rupees. He then buys as many socks as possible with\
  \ the remaining money, where each sock costs `sockCost` rupees. The number of socks\
  \ he can buy is the floor of the remaining money divided by `sockCost`. If this\
  \ number is odd, he will eventually have only 1 clean sock left after using pairs\
  \ each day, so return \"Unlucky Chef\". If even, return \"Lucky Chef\". It's guaranteed\
  \ that the shop has enough socks, and Chef never reuses socks.\n\nFunction signature:\
  \ `def check_chef_sock_luck(jacketCost: int, sockCost: int, money: int) -> str`\n\
  \nConstraints:\n- 1 ≤ jacketCost ≤ money ≤ 10^9\n- 1 ≤ sockCost ≤ 10^9\n\nExamples:\n\
  - Input: jacketCost=1, sockCost=2, money=3  \n  Remaining money: 3 - 1 = 2  \n \
  \ Socks bought: floor(2 / 2) = 1 (odd)  \n  Output: \"Unlucky Chef\"\n- Input: jacketCost=1,\
  \ sockCost=2, money=6  \n  Remaining money: 6 - 1 = 5  \n  Socks bought: floor(5\
  \ / 2) = 2 (even)  \n  Output: \"Lucky Chef\""
