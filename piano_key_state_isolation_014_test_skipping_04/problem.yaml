problem_appears_as: 'This problem primarily evaluates a candidate''s ability to implement an algorithm that involves modular arithmetic and pattern recognition. Specifically, it tests:

  1.  **Modular Arithmetic/Modulo Operator:** The core requirement of wrapping around after 88 keys necessitates the use of the modulo operator (`%`) to map a large input number `n` to a key number between 1 and 88.

  2.  **Pattern Mapping:** The candidate needs to define or lookup the black/white pattern for the 88 piano keys and correctly map the calculated key number (1-88) to its corresponding color. This could involve an array, a dictionary, or a series of conditional statements.

  3.  **Handling Edge Cases (Modulo 0):** A common pitfall with modulo 88 is that `n % 88` will yield 0 when `n` is a multiple of 88. Since key numbers are 1-indexed, the candidate must correctly handle this to map 0 to key 88.

  4.  **Basic Function Implementation:** Standard function definition, input/output handling.


  The problem also implicitly evaluates attention to detail regarding the description of the piano key pattern and the specific examples provided.'
