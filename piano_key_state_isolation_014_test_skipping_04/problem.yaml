description: "Write a function called `piano_key_color` that determines whether a piano key is black or white based on a counting pattern.\n\n**Background:** You're practicing piano by playing keys in sequence from 1 to 88 (the standard number of keys on a piano), then wrapping back to key 1 and continuing. Given a count number, you need to determine if that corresponds to a black or white key.\n\n**Piano Key Pattern:** The 88 keys follow a specific black/white pattern. Key 1 is white, key 2 is black, key 3 is white, key 4 is white, key 5 is black, and so on, following the standard piano keyboard layout.\n\n**Function Requirements:**\n- Function name: `piano_key_color`\n- Input: An integer `n` (1 ≤ n ≤ 10000) representing the count\n- Output: A string \"black\" or \"white\" indicating the key color\n- When the count exceeds 88, it wraps around (e.g., count 89 corresponds to key 1, count 90 to key 2, etc.)\n\n**Examples:**\n```\npiano_key_color(1) → \"white\"\npiano_key_color(5) → \"black\" \npiano_key_color(12) → \"black\"\npiano_key_color(42) → \"white\"\npiano_key_color(92) → \"white\"  # wraps to key 4\npiano_key_color(100) → \"black\"\npiano_key_color(2017) → \"white\"\n```\n\nThe function should handle the wrapping logic correctly and return the appropriate color based on the standard 88-key piano layout."
