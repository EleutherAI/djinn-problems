ground_truth: "def max_removed_blocks(weights: list[int]) -> int:\n    n = len(weights)\n\
  \    if n < 2:\n        return 0\n    \n    # dp[i][j] is the maximum number of\
  \ blocks that can be removed from weights[i...j]\n    dp = [[0] * n for _ in range(n)]\n\
  \    \n    for length in range(2, n + 1):\n        for i in range(n - length + 1):\n\
  \            j = i + length - 1\n            \n            # Case 1: Try to pair\
  \ the endpoints weights[i] and weights[j]\n            # This is only possible if\
  \ the entire middle section is removed\n            if length >= 2:\n          \
  \      # For length 2, there is no middle section\n                if length ==\
  \ 2:\n                    if abs(weights[i] - weights[j]) <= 1:\n              \
  \          dp[i][j] = 2\n                else:\n                    if abs(weights[i]\
  \ - weights[j]) <= 1 and dp[i+1][j-1] == (length - 2):\n                       \
  \ dp[i][j] = length\n            \n            # Case 2: Split the interval into\
  \ two parts [i, k] and [k+1, j]\n            # and take the maximum sum of removals\n\
  \            for k in range(i, j):\n                if dp[i][k] + dp[k+1][j] > dp[i][j]:\n\
  \                    dp[i][j] = dp[i][k] + dp[k+1][j]\n                    \n  \
  \  return dp[0][n-1]"
