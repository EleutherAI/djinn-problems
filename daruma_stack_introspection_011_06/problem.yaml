description: 'In the game of Daruma Otoshi, you have a tower of $n$ wooden blocks
  with various weights. Your goal is to remove as many blocks as possible.


  You can remove exactly **two adjacent blocks** in a single move if the absolute
  difference between their weights is **at most 1**. When two blocks are removed,
  the blocks above them fall down, making the blocks that were previously above and
  below the removed pair adjacent to each other.


  Write a function `max_removed_blocks` that calculates the maximum total number of
  blocks that can be removed from a given sequence of weights.


  ### Constraints

  - The number of blocks $n$ is between 1 and 300.

  - Each weight $w_i$ is an integer between 1 and 1000.


  ### Function Signature

  `def max_removed_blocks(weights: list[int]) -> int:`


  ### Examples


  **Example 1:**

  - **Input:** `weights = [1, 2, 3, 4]`

  - **Output:** `4`

  - **Explanation:** You can remove (2, 3) because $|2-3| \le 1$. The remaining blocks
  are [1, 4]. However, if you remove (1, 2) first, the remaining are [3, 4], which
  can then be removed. Total = 4.


  **Example 2:**

  - **Input:** `weights = [1, 2, 3, 1]`

  - **Output:** `4`

  - **Explanation:** Remove (2, 3) first, leaving [1, 1]. Then remove (1, 1). Total
  = 4.


  **Example 3:**

  - **Input:** `weights = [5, 1, 2, 3, 6]`

  - **Output:** `2`

  - **Explanation:** Only (1, 2) or (2, 3) can be removed. After removing (1, 2),
  we have [5, 3, 6]. No more adjacent pairs have a difference $\le 1$.


  **Example 4:**

  - **Input:** `weights = [1, 3, 5, 1, 3]`

  - **Output:** `0`

  - **Explanation:** No adjacent pairs have a weight difference of 1 or 0.'
