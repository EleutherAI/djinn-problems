ground_truth: "import math\n\ndef simon_game(a, b, n):\n    \"\"\"\n    Determines\
  \ the winner of the stone game between Simon and Antisimon.\n    \n    Args:\n \
  \       a (int): Simon's fixed positive integer.\n        b (int): Antisimon's fixed\
  \ positive integer.\n        n (int): Initial number of stones in the heap.\n  \
  \      \n    Returns:\n        int: 0 if Simon wins, 1 if Antisimon wins.\n    \"\
  \"\"\n    while True:\n        # Simon's turn\n        stones_to_remove = math.gcd(a,\
  \ n)\n        if stones_to_remove > n:\n            return 1  # Simon cannot move,\
  \ Antisimon wins\n        n -= stones_to_remove\n        \n        # Antisimon's\
  \ turn\n        stones_to_remove = math.gcd(b, n)\n        if stones_to_remove >\
  \ n:\n            return 0  # Antisimon cannot move, Simon wins\n        n -= stones_to_remove"
