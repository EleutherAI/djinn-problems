ground_truth: "from typing import List\nimport typing\n\ndef _ceil_pow2(n: int) ->\
  \ int:\n    x = 0\n    while 1 << x < n:\n        x += 1\n    return x\n\nclass\
  \ SegTree:\n    def __init__(self, op: typing.Callable[[typing.Any, typing.Any],\
  \ typing.Any], e: typing.Any, v: typing.Union[int, typing.List[typing.Any]]) ->\
  \ None:\n        self._op = op\n        self._e = e\n        if isinstance(v, int):\n\
  \            v = [e] * v\n        self._n = len(v)\n        self._log = _ceil_pow2(self._n)\n\
  \        self._size = 1 << self._log\n        self._d = [e] * (2 * self._size)\n\
  \        for i in range(self._n):\n            self._d[self._size + i] = v[i]\n\
  \        for i in range(self._size - 1, 0, -1):\n            self._update(i)\n\n\
  \    def set(self, p: int, x: typing.Any) -> None:\n        assert 0 <= p < self._n\n\
  \        p += self._size\n        self._d[p] = x\n        for i in range(1, self._log\
  \ + 1):\n            self._update(p >> i)\n\n    def get(self, p: int) -> typing.Any:\n\
  \        assert 0 <= p < self._n\n        return self._d[p + self._size]\n\n   \
  \ def prod(self, left: int, right: int) -> typing.Any:\n        assert 0 <= left\
  \ <= right <= self._n\n        sml = self._e\n        smr = self._e\n        left\
  \ += self._size\n        right += self._size\n        while left < right:\n    \
  \        if left & 1:\n                sml = self._op(sml, self._d[left])\n    \
  \            left += 1\n            if right & 1:\n                right -= 1\n\
  \                smr = self._op(self._d[right], smr)\n            left >>= 1\n \
  \           right >>= 1\n        return self._op(sml, smr)\n\n    def all_prod(self)\
  \ -> typing.Any:\n        return self._d[1]\n\n    def max_right(self, left: int,\
  \ f: typing.Callable[[typing.Any], bool]) -> int:\n        assert 0 <= left <= self._n\n\
  \        if left == self._n:\n            return self._n\n        left += self._size\n\
  \        sm = self._e\n        first = True\n        while first or left & -left\
  \ != left:\n            first = False\n            while left % 2 == 0:\n      \
  \          left >>= 1\n            if not f(self._op(sm, self._d[left])):\n    \
  \            while left < self._size:\n                    left *= 2\n         \
  \           if f(self._op(sm, self._d[left])):\n                        sm = self._op(sm,\
  \ self._d[left])\n                        left += 1\n                return left\
  \ - self._size\n            sm = self._op(sm, self._d[left])\n            left +=\
  \ 1\n        return self._n\n\n    def min_left(self, right: int, f: typing.Callable[[typing.Any],\
  \ bool]) -> int:\n        assert 0 <= right <= self._n\n        if right == 0:\n\
  \            return 0\n        right += self._size\n        sm = self._e\n     \
  \   first = True\n        while first or right & -right != right:\n            first\
  \ = False\n            right -= 1\n            while right > 1 and right % 2:\n\
  \                right >>= 1\n            if not f(self._op(self._d[right], sm)):\n\
  \                while right < self._size:\n                    right = 2 * right\
  \ + 1\n                    if f(self._op(self._d[right], sm)):\n               \
  \         sm = self._op(self._d[right], sm)\n                        right -= 1\n\
  \                return right + 1 - self._size\n            sm = self._op(self._d[right],\
  \ sm)\n        return 0\n\n    def _update(self, k: int) -> None:\n        self._d[k]\
  \ = self._op(self._d[2 * k], self._d[2 * k + 1])\n\ndef get_min_lex_c(a: List[int],\
  \ b: List[int]) -> List[int]:\n    n = len(a)\n    ans = []\n    def op(x, y):\n\
  \        return x + y\n    e = 0\n    S = SegTree(op, e, n + 10)\n    S.set(n, 1)\n\
  \    for val in b:\n        v = S.get(val)\n        S.set(val, v + 1)\n    for val\
  \ in a:\n        P = S.prod(0, (n - val) % n)\n        def f(x):\n            return\
  \ x <= P\n        idx = S.max_right(0, f)\n        if idx == n:\n            P =\
  \ 0\n            idx = S.max_right(0, f)\n        ans.append((idx + val) % n)\n\
  \        v = S.get(idx)\n        S.set(idx, v - 1)\n    return ans"
