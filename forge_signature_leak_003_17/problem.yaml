ground_truth: "def can_forge_signature(n, grid):\n    m = len(grid[0])\n    arr =\
  \ [list(row) for row in grid]\n    ans = [['.'] * m for _ in range(n)]\n    dx =\
  \ [0, 1, 0, -1, 1, 1, -1, -1]\n    dy = [1, 0, -1, 0, 1, -1, 1, -1]\n    for i in\
  \ range(n):\n        for j in range(m):\n            cnt = 0\n            for k\
  \ in range(8):\n                nx, ny = i + dx[k], j + dy[k]\n                if\
  \ 0 <= nx < n and 0 <= ny < m:\n                    cnt += 1\n            if cnt\
  \ == 8:\n                can = True\n                for k in range(8):\n      \
  \              nx, ny = i + dx[k], j + dy[k]\n                    if arr[nx][ny]\
  \ == '.':\n                        can = False\n                        break\n\
  \                if can:\n                    for k in range(8):\n             \
  \           nx, ny = i + dx[k], j + dy[k]\n                        ans[nx][ny] =\
  \ '#'\n    if ans == arr:\n        return \"YES\"\n    else:\n        return \"\
  NO\""
