ground_truth: "import math\n\ndef get_max_gcd(A):\n    if not A:\n        return 1\n\
  \    \n    max_a = max(A)\n    spf = list(range(max_a + 1))\n    for i in range(2,\
  \ int(max_a**0.5) + 1):\n        if spf[i] == i:\n            for j in range(i*i,\
  \ max_a + 1, i):\n                if spf[j] == j:\n                    spf[j] =\
  \ i\n    \n    prime_counts = {}\n    for x in A:\n        temp = x\n        while\
  \ temp > 1:\n            p = spf[temp]\n            count = 0\n            while\
  \ temp % p == 0:\n                count += 1\n                temp //= p\n     \
  \       if p not in prime_counts:\n                prime_counts[p] = []\n      \
  \      prime_counts[p].append(count)\n    \n    res = 1\n    n = len(A)\n    for\
  \ p, counts in prime_counts.items():\n        # counts contains exponents of p for\
  \ elements that have p as a factor\n        # elements not in counts have exponent\
  \ 0\n        all_counts = counts + [0] * (n - len(counts))\n        \n        #\
  \ Binary search for max k\n        low = 0\n        high = sum(all_counts) // n\n\
  \        best_k = 0\n        while low <= high:\n            mid = (low + high)\
  \ // 2\n            if mid == 0:\n                best_k = max(best_k, 0)\n    \
  \            low = mid + 1\n                continue\n            \n           \
  \ needed = 0\n            available = 0\n            for c in all_counts:\n    \
  \            if c < mid:\n                    needed += (mid - c)\n            \
  \    else:\n                    available += (c - mid) // 2\n            \n    \
  \        if needed <= available:\n                best_k = mid\n               \
  \ low = mid + 1\n            else:\n                high = mid - 1\n        \n \
  \       if best_k > 0:\n            res *= (p ** best_k)\n            \n    return\
  \ res"
