description: 'Write a Python function named `minimize_penalty` that helps Gennady
  optimize his New Year contest strategy. The contest lasts 720 minutes, starting
  at 18:00 and ending at 6:00 the next day. Gennady spends the first 10 minutes reading
  problems, so he has 710 minutes to solve problems. Each problem i takes ai minutes
  to solve, and the penalty for submitting a problem is the minutes from submission
  time to 6:00 AM. The total penalty is the sum of penalties for solved problems.
  Gennady can switch between problems without extra time, and submission time is negligible.
  He must maximize the number of problems solved, and among those, minimize the total
  penalty.


  The function should take two parameters: an integer n (1 ≤ n ≤ 100) representing
  the number of problems, and a list of integers ai (1 ≤ ai ≤ 720) where each ai is
  the time to solve problem i. It should return a tuple of two integers: the maximum
  number of problems solvable and the minimum total penalty for that number.


  To solve this, sort the problems by ai in ascending order. Greedily solve the fastest
  problems first, accumulating solve times. For each solved problem, calculate its
  submission time as the end of the contest minus the remaining time after solving
  it, but ensure the total solve time fits within 710 minutes. The penalty for a problem
  is the time from its submission to the end (720 minutes total from start, but adjusted
  for the 10-minute offset).


  Example 1:

  - Input: n = 3, ai = [30, 330, 720]

  - Output: (2, 10)

  - Explanation: Solve the first (30 min) and second (330 min) problems. Total solve
  time: 360 min, within 710. Penalties: first submitted at 18:40 (30 min after 18:10),
  penalty 720 - 30 = 690? Wait, no: penalty is minutes to New Year. New Year is at
  720 min mark. Submission at time t (minutes from start), penalty = 720 - t. But
  in sample, it''s 10 for the second. Actually, the contest starts at 0, ends at 720.
  Reading 10 min, start solving at 10. Solve first in 30 min, submit at 40, penalty
  720-40=680. Then switch to second, but time runs out, submit first at midnight (360
  min mark? Wait, sample says at 0:00 submit first, then continue second to 0:10,
  submit second at 370 min, penalty 720-370=350? Wait, sample output is 2 10, but
  that doesn''t match. Wait, perhaps penalty is from submission to 6:00, but in minutes,
  and for second it''s 10. Wait, maybe it''s the time after midnight. Wait, the note
  says at 0:10 AM, penalty 10. So perhaps penalty is the minutes past midnight. Wait,
  0:10 AM is 10 minutes past 0:00, and New Year is 6:00 AM, but penalty is 10, which
  is the time from 0:00 to submission? Wait, the problem says "distance from the moment
  of solution submission to the New Year in minutes". New Year is 6:00 AM, so from
  submission at 0:10 AM to 6:00 AM is 350 minutes, but sample says 10. Wait, perhaps
  it''s the time from start to submission, but no. Wait, looking back: "the problem
  submitted at 21:00 gets penalty time 180, as well as the problem submitted at 3:00".
  21:00 is 3 hours after 18:00, 180 min, and 3:00 AM is 9 hours after 18:00, 540 min,
  but it says 180 for both? Wait, that can''t be. Wait, "gets penalty time 180, as
  well as the problem submitted at 3:00 (3.00 A.M.)". Wait, perhaps it''s the minimum
  distance or something. Wait, 21:00 to 6:00 is 9 hours = 540 min, 3:00 to 6:00 is
  3 hours = 180 min. Ah! It''s the time from submission to the end, but since the
  contest wraps around? No, the example says both get 180, but that doesn''t make
  sense. Wait, perhaps it''s the time until New Year, but for submissions after midnight,
  it''s less. Wait, the problem says "the distance from the moment of solution submission
  to the New Year in minutes". New Year is 6:00 AM, so for 21:00 (before), distance
  is 9 hours = 540 min, but example says 180. Wait, perhaps it''s the time from New
  Year backwards or something. Wait, maybe it''s the time from submission to the end,
  but capped or something. Wait, let''s see: for 21:00, 180 min would be to 0:00,
  not to 6:00. Perhaps the penalty is the minutes past the start or something. Wait,
  I think there''s a mistake in my reading. Wait, the problem says "the penalty time
  for each solved problem is set as the distance from the moment of solution submission
  to the New Year in minutes". But the example: submitted at 21:00 gets 180, 21:00
  to 6:00 is 9 hours = 540 min, but it says 180. Wait, perhaps "distance" means the
  time until New Year, but for times after, it''s the time from New Year or something.
  Wait, perhaps it''s the minimum distance, considering the circular nature or something.
  Wait, another way: perhaps the New Year is at 6:00, and penalty is the time from
  submission to 6:00, but for submissions after 6:00, it''s 0 or something, but the
  contest ends at 6:00. Wait, the problem allows submission at 6:00. Wait, perhaps
  it''s the time from submission to 6:00, but if submission is after, it''s negative
  or something. Wait, let''s calculate for the sample. In the note, second problem
  submitted at 0:10 AM, penalty 10. 0:10 AM is 10 min after 0:00, and New Year is
  6:00 AM, so distance is 350 min, but it''s 10. Wait, perhaps the penalty is the
  time from 0:00 to submission. Wait, for first problem submitted at 0:00, penalty
  would be 0, but in sample it''s not. Wait, the note says submit first at 0:00, then
  continue second to 0:10, submit second at 0:10, penalty 10. So for the second, penalty
  10, which is the time from 0:00 to 0:10. Perhaps the penalty is the minutes past
  midnight. Wait, for the first submitted at 0:00, penalty 0, but in sample total
  penalty 10, so only the second. Wait, but the problem says "the distance from the
  moment of solution submission to the New Year in minutes". But in sample, it''s
  not matching. Wait, perhaps it''s the time from the submission to the end, but for
  the second, 720 - 370 = 350, but it''s 10. Wait, maybe the contest time is from
  18:00 to 6:00, 12 hours = 720 min, submission at time t from start, penalty = 720
  - t. For first submitted at 40 min, penalty 680, second at 370 min, penalty 350,
  total 1030, not 10. Not matching. Wait, perhaps penalty is the time from midnight
  to submission. Midnight is at 360 min (6 hours from 18:00). So for submission at
  t, if t > 360, penalty = t - 360. For second at 370, 370 - 360 = 10, yes! For first
  at 40, 40 - 360 = negative, but perhaps penalty is max(0, t - 360) or something.
  But in sample, first is submitted at 0:00, which is 360 min, penalty 0, second at
  370, penalty 10, total 10, yes! And the problem says "the distance from the moment
  of solution submission to the New Year in minutes", but New Year is 6:00 AM, which
  is 720 min, but perhaps they mean to midnight or something. Wait, but the example
  says submitted at 21:00 gets 180, 21:00 is 180 min from 18:00, and 180 min to midnight?
  Midnight is 360 min, 360 - 180 = 180, yes! Submitted at 3:00 AM, 3:00 AM is 9 hours
  = 540 min from 18:00, 540 - 360 = 180, yes! So penalty = max(0, submission_time
  - 360), where submission_time is minutes from 18:00. Yes, that matches the sample:
  first submitted at 360 (0:00), penalty 0, second at 370, penalty 10, total 10. Perfect.


  So, in code, sort ai ascending, try to solve as many as possible, total time <=
  710, submission times cumulative, penalty sum of max(0, submit_time - 360) for each.


  Example 2:

  - Input: n = 1, ai = [100]

  - Output: (1, 0)  # Solve at 110 min, submit at 110, 110 - 360 = negative, penalty
  0.


  Constraints: n <= 100, ai <= 720.'
