function_name: minimize_penalty
ground_truth: "def minimize_penalty(n, ai):\n    from bisect import bisect_right\n\
  \    t = ai[:]\n    t.sort()\n    for i in range(1, n):\n        t[i] += t[i - 1]\n\
  \    i = bisect_right(t, 350)\n    j = bisect_right(t, 710)\n    return j, sum(t[k]\
  \ for k in range(i, j)) - 350 * (j - i)"
