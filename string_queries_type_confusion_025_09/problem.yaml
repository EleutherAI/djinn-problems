  \ = []\n    for q in queries:\n        op = q[0]\n        if op == 'set':\n    \
  \        x, y, z = q[1], q[2], q[3]\n            # Convert 1-indexed to 0-indexed\n\
  \            start = x - 1\n            end = y\n            # Efficient range update\
  \ in Python\n            s[start:end] = [z] * (end - start)\n        elif op ==\
  \ 'comp':\n            a, b, c, d = q[1], q[2], q[3], q[4]\n            # Convert\
  \ 1-indexed to 0-indexed\n            # Substring S: indices a to b (inclusive)\n\
  \            # Substring T: indices c to d (inclusive)\n            sub1 = \"\"\
  .join(s[a-1:b])\n            sub2 = \"\".join(s[c-1:d])\n            \n        \
  \    if sub1 < sub2:\n                results.append('s')\n            elif sub1\
  \ > sub2:\n                results.append('t')\n            else:\n            \
  \    results.append('e')\n    return results"
