ground_truth: "def find_valid_radixes(time_str: str) -> list[int]:\n    def to_val(s):\n\
  \        res = []\n        for c in s:\n            if '0' <= c <= '9':\n      \
  \          res.append(ord(c) - ord('0'))\n            else:\n                res.append(ord(c)\
  \ - ord('A') + 10)\n        return res\n\n    def get_value(digits, base):\n   \
  \     val = 0\n        for d in digits:\n            val = val * base + d\n    \
  \    return val\n\n    try:\n        a_str, b_str = time_str.split(':')\n    except\
  \ ValueError:\n        return [0]\n        \n    a_digits = to_val(a_str)\n    b_digits\
  \ = to_val(b_str)\n    \n    max_digit = -1\n    for d in a_digits + b_digits:\n\
  \        max_digit = max(max_digit, d)\n    \n    min_radix = max(2, max_digit +\
  \ 1)\n    \n    # Strip leading zeros to check if they are effectively single digits\n\
  \    a_stripped = []\n    found_nonzero = False\n    for d in a_digits:\n      \
  \  if d > 0 or found_nonzero:\n            a_stripped.append(d)\n            found_nonzero\
  \ = True\n    if not a_stripped: a_stripped = [0]\n    \n    b_stripped = []\n \
  \   found_nonzero = False\n    for d in b_digits:\n        if d > 0 or found_nonzero:\n\
  \            b_stripped.append(d)\n            found_nonzero = True\n    if not\
  \ b_stripped: b_stripped = [0]\n    \n    # If both are single digits, the value\
  \ is constant for all n >= min_radix\n    if len(a_stripped) <= 1 and len(b_stripped)\
  \ <= 1:\n        h = a_stripped[0]\n        m = b_stripped[0]\n        if h < 24\
  \ and m < 60:\n            return [-1]\n        else:\n            return [0]\n\
  \            \n    valid_radixes = []\n    # If not infinite, at least one part\
  \ has length > 1.\n    # Max possible radix is 60 because if n > 60, any 2-digit\
  \ number is > 60.\n    for r in range(min_radix, 101):\n        h = get_value(a_digits,\
  \ r)\n        m = get_value(b_digits, r)\n        if h < 24 and m < 60:\n      \
  \      valid_radixes.append(r)\n            \n    if not valid_radixes:\n      \
  \  return [0]\n    return valid_radixes"
