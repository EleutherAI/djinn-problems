ground_truth: "from typing import List\n\ndef minimum_pockets(coins: List[int]) ->\
  \ int:\n    k = 1\n    for i in range(1, 101):\n        s = coins.count(i)\n   \
  \     if s > k:\n            k = s\n    return k"
