description: "Takahashi has $N$ cards, where the $i$-th card has an integer $A_i$\
  \ written on it. \n\nHe wants to perform the following operation as many times as\
  \ possible for a fixed integer $K$:\n* Choose exactly $K$ cards such that the integers\
  \ written on them are all distinct, and remove (eat) those cards.\n\nYour task is\
  \ to implement the function `max_operations_per_k` that calculates the maximum number\
  \ of operations possible for every $K$ from $1$ to $N$.\n\n### Requirements:\n*\
  \ The function must be named `max_operations_per_k`.\n* It should take one argument:\
  \ `cards`, a list of $N$ integers representing the values on the cards.\n* It should\
  \ return a list of $N$ integers, where the $j$-th element (at index $j$) is the\
  \ maximum number of operations possible for $K = j + 1$.\n\n### Constraints:\n*\
  \ $1 \\le N \\le 3 \\times 10^5$\n* $1 \\le A_i \\le N$\n\n### Example:\n**Input:**\n\
  `cards = [2, 1, 2]`\n\n**Output:**\n`[3, 1, 0]`\n\n**Explanation:**\n* For $K=1$:\
  \ We can eat the cards one by one. Total operations: 3.\n* For $K=2$: We can choose\
  \ one card with '1' and one card with '2'. We are left with one card with '2', but\
  \ we need 2 distinct cards for another operation, so we stop. Total operations:\
  \ 1.\n* For $K=3$: We need 3 distinct cards, but we only have two distinct values\
  \ (1 and 2). Total operations: 0."
