ground_truth: "from collections import Counter\nimport bisect\n\ndef max_operations_per_k(cards):\n\
  \    \"\"\"\n    Calculates the maximum number of operations possible for every\
  \ K from 1 to N.\n    An operation consists of choosing K distinct cards.\n    \"\
  \"\"\n    n = len(cards)\n    if n == 0:\n        return []\n        \n    # Count\
  \ frequencies of each card value\n    counts = sorted(Counter(cards).values())\n\
  \    m = len(counts)\n    \n    # Prefix sums to calculate sum(min(c, x)) in O(log\
  \ M)\n    prefix_sum = [0] * (m + 1)\n    for i in range(m):\n        prefix_sum[i+1]\
  \ = prefix_sum[i] + counts[i]\n    \n    def get_total_for_x(x):\n        # sum(min(c,\
  \ x) for c in counts)\n        # For counts < x, we take the count itself.\n   \
  \     # For counts >= x, we take x.\n        idx = bisect.bisect_left(counts, x)\n\
  \        return prefix_sum[idx] + (m - idx) * x\n\n    # results[k] will store the\
  \ maximum X such that K * X <= total_for_x(X)\n    results = [0] * (n + 2)\n   \
  \ \n    # Iterate through all possible operation counts X\n    for x in range(1,\
  \ n + 1):\n        total_available = get_total_for_x(x)\n        k_val = total_available\
  \ // x\n        if k_val > n:\n            k_val = n\n        # For this specific\
  \ X, it is possible to perform X operations for any K <= k_val\n        results[k_val]\
  \ = max(results[k_val], x)\n    \n    # Propagate the maximum operations backwards\n\
  \    # If X operations are possible for K, they are also possible for K-1\n    curr_max\
  \ = 0\n    final_ans = [0] * n\n    for k in range(n, 0, -1):\n        curr_max\
  \ = max(curr_max, results[k])\n        final_ans[k-1] = curr_max\n        \n   \
  \ return final_ans"
