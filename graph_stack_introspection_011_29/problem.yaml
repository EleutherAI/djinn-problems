ground_truth: "def compute_minimum_weights(N, edges, Q, queries):\n    if N < 3:\n\
  \        return [0] * Q\n    from collections import deque\n    class UnionFind:\n\
  \        def __init__(self, n):\n            self.par = list(range(n))\n       \
  \     self.rank = [0] * n\n        def find(self, x):\n            if self.par[x]\
  \ != x:\n                self.par[x] = self.find(self.par[x])\n            return\
  \ self.par[x]\n        def union(self, x, y):\n            px, py = self.find(x),\
  \ self.find(y)\n            if px == py: return\n            if self.rank[px] <\
  \ self.rank[py]:\n                self.par[px] = py\n            else:\n       \
  \         self.par[py] = px\n                if self.rank[px] == self.rank[py]:\n\
  \                    self.rank[px] += 1\n    edges = sorted(edges, key=lambda x:\
  \ x[2])\n    uf = UnionFind(N)\n    mst_edges = []\n    total_weight = 0\n    for\
  \ a, b, c in edges:\n        a, b = a-1, b-1\n        if uf.find(a) != uf.find(b):\n\
  \            uf.union(a, b)\n            mst_edges.append((a, b, c))\n         \
  \   total_weight += c\n    adj = [[] for _ in range(N)]\n    for a, b, c in mst_edges:\n\
  \        adj[a].append((b, c))\n        adj[b].append((a, c))\n    LOG = 16\n  \
  \  up = [[-1] * N for _ in range(LOG)]\n    depth = [-1] * N\n    weight_to_parent\
  \ = [-1] * N\n    def dfs(node, par, dep, w):\n        depth[node] = dep\n     \
  \   up[0][node] = par\n        weight_to_parent[node] = w\n        for nei, ww in\
  \ adj[node]:\n            if nei != par:\n                dfs(nei, node, dep+1,\
  \ ww)\n    dfs(0, -1, 0, 0)\n    for k in range(1, LOG):\n        for i in range(N):\n\
  \            if up[k-1][i] != -1:\n                up[k][i] = up[k-1][up[k-1][i]]\n\
  \    def get_lca(u, v):\n        if depth[u] > depth[v]:\n            u, v = v,\
  \ u\n        diff = depth[v] - depth[u]\n        for k in range(LOG):\n        \
  \    if diff & (1 << k):\n                v = up[k][v]\n        if u == v:\n   \
  \         return u\n        for k in range(LOG-1, -1, -1):\n            if up[k][u]\
  \ != up[k][v]:\n                u = up[k][u]\n                v = up[k][v]\n   \
  \     return up[0][u]\n    ans = []\n    for s, t in queries:\n        s, t = s-1,\
  \ t-1\n        lca = get_lca(s, t)\n        ans.append(total_weight - weight_to_parent[lca])\n\
  \    return ans"
