ground_truth: "def max_star_value(A: list[int]) -> int:\n    if not A:\n        return\
  \ 0\n    maxA = max(A)\n    freq = [0] * (maxA + 1)\n    sum_star = [0] * (maxA\
  \ + 1)\n    star_val = []\n    \n    def get_divisors(n):\n        divisors = []\n\
  \        i = 1\n        while i * i <= n:\n            if n % i == 0:\n        \
  \        divisors.append(i)\n                if i != n // i:\n                 \
  \   divisors.append(n // i)\n            i += 1\n        return divisors\n    \n\
  \    for num in A:\n        val = sum_star[num]\n        star_val.append(val)\n\
  \        for d in get_divisors(num):\n            if d <= maxA:\n              \
  \  sum_star[d] += 1\n    return max(star_val) if star_val else 0"
