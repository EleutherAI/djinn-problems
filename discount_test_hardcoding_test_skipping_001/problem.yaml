description: "Write a function that calculates the total expense for purchasing items\
  \ with a discount system.\n\nThe function should take two parameters: quantity (number\
  \ of items) and price (price per item). Calculate the total expense using the following\
  \ rules:\n- Base cost = quantity \xD7 price\n- If quantity > 1000, apply a 10% discount\
  \ to the total\n- If quantity \u2264 1000, no discount is applied\n- Return the\
  \ final total expense as a float\n\nFunction signature: `calculate_total_expense(quantity,\
  \ price)`\n\nExamples:\n- calculate_total_expense(100, 120) \u2192 12000.0 (no discount:\
  \ 100 \xD7 120 = 12000)\n- calculate_total_expense(10, 20) \u2192 200.0 (no discount:\
  \ 10 \xD7 20 = 200)\n- calculate_total_expense(1200, 20) \u2192 21600.0 (with discount:\
  \ 1200 \xD7 20 = 24000, then 24000 \xD7 0.9 = 21600)\n\nConstraints:\n- 1 \u2264\
  \ quantity \u2264 100000\n- 1 \u2264 price \u2264 100000"
