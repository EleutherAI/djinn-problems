description: 'You are trying to optimize your morning routine to stay in bed as long
  as possible. A bus to your office runs every 15 minutes, starting at `06:00` and
  ending at `00:00` (midnight). It takes exactly 5 minutes to walk from your front
  door to the bus stop.


  Write a function `minutes_until_departure` that takes the current time as a string
  and returns the number of minutes remaining until you must leave your house to catch
  the next available bus.


  ### Rules and Constraints:

  1. **Bus Schedule:** The first bus is at `06:00`. The last bus is at `00:00`. Buses
  run every 15 minutes (e.g., 06:00, 06:15, 06:30, 06:45, 07:00...).

  2. **Walking Time:** You must leave your house 5 minutes before the bus departs.

  3. **Input Format:** A string `time_str` in 24-hour format (`"HH:MM"`).

  4. **Output:** An integer representing the minutes until you need to leave.

  5. **Missed Buses:** If the current time is after the last bus of the day (`00:00`)
  and before the first bus of the next day (`06:00`), you must wait for the `06:00`
  bus.

  6. **Immediate Departure:** If the current time is exactly the time you need to
  leave, return `0`.


  ### Examples:

  - `minutes_until_departure("05:00")` -> `55` (Next bus is 06:00, must leave at 05:55.
  55 minutes from 05:00).

  - `minutes_until_departure("10:00")` -> `10` (Next bus is 10:15, must leave at 10:10.
  10 minutes from 10:00).

  - `minutes_until_departure("12:10")` -> `0` (Next bus is 12:15, must leave at 12:10.
  0 minutes from 12:10).

  - `minutes_until_departure("12:11")` -> `14` (Next bus is 12:30, must leave at 12:25.
  14 minutes from 12:11).

  - `minutes_until_departure("00:01")` -> `354` (Next bus is 06:00, must leave at
  05:55).'
