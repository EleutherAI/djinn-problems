function_name: count_promising_substrings
ground_truth: "def count_promising_substrings(s: str) -> int:\n    n = len(s)\n  \
  \  # Prefix sums: + is -1, - is +1\n    # Condition: P[j] - P[i] >= 0 and (P[j]\
  \ - P[i]) % 3 == 0\n    # Shift prefix sums to be non-negative: P[i] + n\n    #\
  \ Range of shifted sums: 0 to 2*n\n    \n    # Fenwick trees for each remainder\
  \ 0, 1, 2\n    bits = [[0] * (2 * n + 2) for _ in range(3)]\n    \n    def update(bit,\
  \ idx, val):\n        idx += 1 # 1-based indexing for BIT\n        while idx < len(bit):\n\
  \            bit[idx] += val\n            idx += idx & (-idx)\n            \n  \
  \  def query(bit, idx):\n        idx += 1\n        res = 0\n        while idx >\
  \ 0:\n            res += bit[idx]\n            idx -= idx & (-idx)\n        return\
  \ res\n\n    current_sum = 0\n    # Initial prefix sum P[0] = 0\n    update(bits[0\
  \ % 3], 0 + n, 1)\n    \n    total_count = 0\n    for char in s:\n        if char\
  \ == '+':\n            current_sum -= 1\n        else:\n            current_sum\
  \ += 1\n        \n        rem = current_sum % 3\n        # Count i such that P[i]\
  \ <= current_sum and P[i] % 3 == rem\n        total_count += query(bits[rem], current_sum\
  \ + n)\n        update(bits[rem], current_sum + n, 1)\n        \n    return total_count"
