function_name: min_changes_for_palindromic_paths
ground_truth: "def min_changes_for_palindromic_paths(matrix: list[list[int]]) -> int:\n\
  \    n = len(matrix)\n    m = len(matrix[0])\n    b = [[] for i in range(n+m-1)]\n\
  \    for i in range(n):\n        for j in range(m):\n            d = i+j\n     \
  \       b[d].append(matrix[i][j])\n    centre = (n+m-1)//2\n    output = 0\n   \
  \ for i in range(centre):\n        ones = sum(b[i]) + sum(b[n+m-2-i])\n        total\
  \ = len(b[i]) + len(b[n+m-2-i])\n        output += min(ones, total - ones)\n   \
  \ return output"
