ground_truth: "def count_connected_permutations(n: int, missing_edges: list[tuple[int,\
  \ int]]) -> int:\n    import math\n    MOD = 10**9 + 7\n\n    # Precompute factorials\n\
  \    fact = [1] * (n + 1)\n    for i in range(2, n + 1):\n        fact[i] = (fact[i\
  \ - 1] * i) % MOD\n\n    m = len(missing_edges)\n    ans = 0\n    \n    # Iterate\
  \ through all subsets of missing edges\n    for i in range(1 << m):\n        subset\
  \ = []\n        for j in range(m):\n            if (i >> j) & 1:\n             \
  \   subset.append(missing_edges[j])\n        \n        # Build adjacency list for\
  \ the subset\n        adj = {}\n        nodes = set()\n        for u, v in subset:\n\
  \            nodes.add(u)\n            nodes.add(v)\n            adj.setdefault(u,\
  \ []).append(v)\n            adj.setdefault(v, []).append(u)\n        \n       \
  \ # Check if any vertex has degree > 2\n        valid = True\n        for u in adj:\n\
  \            if len(adj[u]) > 2:\n                valid = False\n              \
  \  break\n        if not valid:\n            continue\n        \n        # Check\
  \ for cycles and count components (paths)\n        visited = set()\n        components_with_edges\
  \ = 0\n        for u in nodes:\n            if u not in visited:\n             \
  \   # A path must start at a node with degree 1\n                if len(adj[u])\
  \ == 1:\n                    components_with_edges += 1\n                    curr\
  \ = u\n                    prev = -1\n                    while True:\n        \
  \                visited.add(curr)\n                        next_nodes = [v for\
  \ v in adj[curr] if v != prev]\n                        if not next_nodes:\n   \
  \                         break\n                        prev = curr\n         \
  \               curr = next_nodes[0]\n        \n        # If any node in the subset\
  \ was not visited, it's part of a cycle\n        for u in nodes:\n            if\
  \ u not in visited:\n                valid = False\n                break\n    \
  \    \n        if not valid:\n            continue\n        \n        num_edges\
  \ = len(subset)\n        num_nodes_in_subset = len(nodes)\n        # Number of objects\
  \ to permute: (remaining nodes) + (number of paths)\n        num_objects = (n -\
  \ num_nodes_in_subset) + components_with_edges\n        \n        # Each path can\
  \ be reversed\n        ways = (fact[num_objects] * pow(2, components_with_edges,\
  \ MOD)) % MOD\n        \n        # Inclusion-Exclusion\n        if num_edges % 2\
  \ == 1:\n            ans = (ans - ways + MOD) % MOD\n        else:\n           \
  \ ans = (ans + ways) % MOD\n            \n    return ans"
