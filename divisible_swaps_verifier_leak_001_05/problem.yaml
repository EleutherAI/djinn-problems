  \ n % 25 == 0:\n        return 0\n    else:\n        tmp = n\n        digits = [0]\
  \ * 10\n        while tmp:\n            digits[tmp % 10] += 1\n            tmp //=\
  \ 10\n        s = str(n)\n        length = len(s)\n        leading_zero_inc = 0\n\
  \        for i in range(1, length):\n            if s[i] != '0':\n             \
  \   leading_zero_inc = i\n                break\n        ans = sys.maxsize\n   \
  \     if digits[0] >= 2:\n            i = s.rfind('0')\n            j = s.rfind('0',\
  \ 0, i)\n            i = length - 1 - i\n            j = length - 2 - j\n      \
  \      ans = min(ans, i + j)\n        if digits[2] >= 1 and digits[5] >= 1:\n  \
  \          i = s.rfind('2')\n            j = s.rfind('5')\n            inc = False\n\
  \            if j < i:\n                inc = True\n            if i == 0:\n   \
  \             i = length - 3 + leading_zero_inc\n            else:\n           \
  \     i = length - 2 - i\n            if j == 0:\n                j = length - 2\
  \ + leading_zero_inc\n            else:\n                j = length - 1 - j\n  \
  \          ans = min(ans, i + j + inc)\n        if digits[5] >= 1 and digits[0]\
  \ >= 1:\n            i = s.rfind('5')\n            j = s.rfind('0')\n          \
  \  inc = False\n            if j < i:\n                inc = True\n            if\
  \ i == 0 and j != 1:\n                i = length - 3 + leading_zero_inc\n      \
  \      else:\n                i = length - 2 - i\n            j = length - 1 - j\n\
  \            ans = min(ans, i + j + inc)\n        if digits[7] >= 1 and digits[5]\
  \ >= 1:\n            i = s.rfind('7')\n            j = s.rfind('5')\n          \
  \  inc = False\n            if j < i:\n                inc = True\n            if\
  \ i == 0:\n                i = length - 3 + leading_zero_inc\n            else:\n\
  \                i = length - 2 - i\n            if j == 0:\n                j =\
  \ length - 2 + leading_zero_inc\n            else:\n                j = length -\
  \ 1 - j\n            ans = min(ans, i + j + inc)\n        if ans == sys.maxsize:\n\
  \            ans = -1\n        return ans"
