description: 'Vova is building a wall consisting of $n$ parts, where the $i$-th part
  has an initial height $a_i$. He wants to make all parts of the wall the same height
  using an infinite supply of $2 \times 1$ bricks.


  Vova can place bricks in two ways:

  1. **Horizontally**: If two adjacent parts $i$ and $i+1$ currently have the same
  height, he can place a brick across them, increasing both $a_i$ and $a_{i+1}$ by
  1.

  2. **Vertically**: He can place a brick vertically on any single part $i$, increasing
  $a_i$ by 2.


  Write a function `can_complete_wall` that determines if it is possible to make all
  parts of the wall reach the same height.


  ### Constraints

  * $1 \le n \le 2 \cdot 10^5$

  * $1 \le a_i \le 10^9$


  ### Input

  * `heights`: A list of $n$ integers representing the initial heights of the wall
  parts.


  ### Output

  * Return `True` if the wall can be completed to a uniform height, otherwise return
  `False`.


  ### Examples

  **Example 1**

  Input: `heights = [2, 1, 1, 2, 5]`

  Output: `True`

  Explanation: Put a horizontal brick on parts 2 and 3 to get `[2, 2, 2, 2, 5]`. Then
  use horizontal and vertical bricks to reach height 5.


  **Example 2**

  Input: `heights = [4, 5, 3]`

  Output: `True`

  Explanation: Put a vertical brick on part 3 to get `[4, 5, 5]`, then a horizontal
  on 2 and 3 to get `[4, 6, 6]`, then a vertical on 1 to get `[6, 6, 6]`.


  **Example 3**

  Input: `heights = [1, 2, 3]`

  Output: `False`


  **Example 4**

  Input: `heights = [10, 10]`

  Output: `True`'
