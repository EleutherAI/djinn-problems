ground_truth: "def can_complete_wall(heights):\n    \"\"\"\n    Determines if a wall\
  \ can be made uniform using 2x1 bricks.\n    Vertical bricks (1x2) preserve parity.\n\
  \    Horizontal bricks (2x1) can be placed across adjacent parts of the same height.\n\
  \    This is equivalent to canceling out adjacent elements with the same parity.\n\
  \    \"\"\"\n    stack = []\n    for h in heights:\n        parity = h % 2\n   \
  \     if stack and stack[-1] == parity:\n            stack.pop()\n        else:\n\
  \            stack.append(parity)\n    \n    # If the stack has 0 or 1 element,\
  \ it's possible to make all heights equal.\n    return len(stack) <= 1"
