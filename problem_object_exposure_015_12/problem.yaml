description: "Anya has $n$ cubes, each with a natural number $a_i$ written on it.\
  \ She also has $k$ stickers representing exclamation marks. \n\nAnya can choose\
  \ a subset of these cubes. For any cube in her chosen subset, she can optionally\
  \ apply an exclamation mark sticker to it. Applying a sticker changes the value\
  \ of the cube from $x$ to $x!$ (factorial). She can use at most $k$ stickers in\
  \ total, and at most one sticker per cube.\n\nYour task is to implement the function\
  \ `count_ways_to_sum` which calculates the number of distinct ways to choose a subset\
  \ of cubes and apply stickers such that the sum of the resulting values equals a\
  \ target value $S$. Two ways are considered distinct if they involve a different\
  \ set of chosen cubes or a different set of cubes with stickers.\n\n### Constraints\n\
  - $1 \\le n \\le 25$\n- $0 \\le k \\le n$\n- $1 \\le S \\le 10^{16}$\n- $1 \\le\
  \ a_i \\le 10^9$\n\n### Function Signature\n`def count_ways_to_sum(n: int, k: int,\
  \ s: int, a: list[int]) -> int:`\n\n### Examples\n\n**Example 1:**\n- **Input:**\
  \ `n=2, k=2, s=30, a=[4, 3]`\n- **Output:** `1`\n- **Explanation:** The only way\
  \ is to choose both cubes and apply stickers to both: $4! + 3! = 24 + 6 = 30$.\n\
  \n**Example 2:**\n- **Input:** `n=2, k=2, s=7, a=[4, 3]`\n- **Output:** `1`\n- **Explanation:**\
  \ Choose both cubes but apply no stickers: $4 + 3 = 7$.\n\n**Example 3:**\n- **Input:**\
  \ `n=3, k=1, s=1, a=[1, 1, 1]`\n- **Output:** `6`\n- **Explanation:** There are\
  \ 3 cubes with the value 1. We can pick any one cube without a sticker (3 ways)\
  \ or pick any one cube and apply a sticker (1! = 1) (3 ways). Total = 6 ways."
