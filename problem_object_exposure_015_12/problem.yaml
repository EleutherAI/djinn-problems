ground_truth: "import math\nfrom collections import defaultdict\n\ndef count_ways_to_sum(n:\
  \ int, k: int, s: int, a: list[int]) -> int:\n    # Precompute factorials up to\
  \ 18, as 19! > 10^16 (max S)\n    fact = [1] * 20\n    for i in range(1, 20):\n\
  \        fact[i] = fact[i-1] * i\n\n    def get_sums(arr, max_k):\n        # dp[used_stickers]\
  \ = {sum: count}\n        dp = [defaultdict(int) for _ in range(max_k + 1)]\n  \
  \      dp[0][0] = 1\n        \n        for x in arr:\n            new_dp = [defaultdict(int)\
  \ for _ in range(max_k + 1)]\n            f_val = fact[x] if x <= 18 else None\n\
  \            \n            for used in range(max_k + 1):\n                for current_sum,\
  \ count in dp[used].items():\n                    # Option 1: Don't pick this cube\n\
  \                    new_dp[used][current_sum] += count\n                    \n\
  \                    # Option 2: Pick this cube without sticker\n              \
  \      if current_sum + x <= s:\n                        new_dp[used][current_sum\
  \ + x] += count\n                    \n                    # Option 3: Pick this\
  \ cube with sticker\n                    if used + 1 <= max_k and f_val is not None:\n\
  \                        if current_sum + f_val <= s:\n                        \
  \    new_dp[used + 1][current_sum + f_val] += count\n            dp = new_dp\n \
  \       return dp\n\n    mid = n // 2\n    left_sums = get_sums(a[:mid], k)\n  \
  \  right_sums = get_sums(a[mid:], k)\n\n    # Optimization: Pre-calculate prefix\
  \ sums for right_sums over sticker counts\n    # combined_right[used][sum] = count\n\
  \    # But for n=25, simple nested loop is sufficient.\n    \n    ans = 0\n    for\
  \ k_left in range(k + 1):\n        for s_left, count_left in left_sums[k_left].items():\n\
  \            target = s - s_left\n            if target < 0:\n                continue\n\
  \            for k_right in range(k - k_left + 1):\n                if target in\
  \ right_sums[k_right]:\n                    ans += count_left * right_sums[k_right][target]\n\
  \    \n    return ans"
