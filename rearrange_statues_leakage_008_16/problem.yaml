ground_truth: "def can_rearrange_statues(n, a, b):\n    A = a[:]\n    B = b[:]\n \
  \   A.remove(0)\n    B.remove(0)\n    if not A:\n        return \"NO\"\n    try:\n\
  \        ind_b = B.index(A[0])\n        R = B[ind_b:] + B[0:ind_b]\n        if A\
  \ == R:\n            return \"YES\"\n        else:\n            return \"NO\"\n\
  \    except ValueError:\n        return \"NO\""
