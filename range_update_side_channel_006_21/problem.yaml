description: 'Implement a function named `process_sequence_operations` that simulates
  a sequence A of size n, where all elements are initially 0. The function must handle
  two types of operations provided in a list of queries:


  - Add operation: [0, s, t, x] – Add the value x to each element from index s to
  t (inclusive). Note that indices are 1-based.

  - Get operation: [1, i] – Retrieve the current value of the element at index i (1-based).


  The function should process all queries in the given order and return a list containing
  the results of all get operations, in the order they appear.


  Function signature: `def process_sequence_operations(n: int, queries: List[List[int]])
  -> List[int]`


  Constraints:

  - 1 ≤ n ≤ 100000

  - 1 ≤ len(queries) ≤ 100000 (this is q, the number of queries)

  - For add: 1 ≤ s ≤ t ≤ n, 0 ≤ x ≤ 1000

  - For get: 1 ≤ i ≤ n


  Examples:


  Example 1:

  Input to function: n=3, queries=[[0,1,2,1], [0,2,3,2], [0,3,3,3], [1,2], [1,3]]

  Output: [3, 5]

  Explanation: Start with A = [0, 0, 0]. After first add: A = [1, 1, 0]. After second:
  A = [1, 3, 2]. After third: A = [1, 3, 5]. Then get(2) = 3, get(3) = 5.


  Example 2:

  Input to function: n=4, queries=[[1,2], [0,1,4,1], [1,2]]

  Output: [0, 1]

  Explanation: Start with A = [0, 0, 0, 0]. First get(2) = 0. After add: A = [1, 1,
  1, 1]. Then get(2) = 1.'
