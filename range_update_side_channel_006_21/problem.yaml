ground_truth: "from typing import List\n\ndef process_sequence_operations(n: int,\
  \ queries: List[List[int]]) -> List[int]:\n    bit0 = [0] * (n + 1)\n    bit1 =\
  \ [0] * (n + 1)\n    \n    def add(b, k, x):\n        while k <= n:\n          \
  \  b[k] += x\n            k += k & -k\n    \n    def get(b, k):\n        s = 0\n\
  \        while k > 0:\n            s += b[k]\n            k -= k & -k\n        return\
  \ s\n    \n    result = []\n    for query in queries:\n        if query[0] == 1:\n\
  \            i = query[1]\n            res = get(bit0, i) + get(bit1, i) * i\n \
  \           if i > 1:\n                res -= get(bit0, i - 1) + get(bit1, i - 1)\
  \ * (i - 1)\n            result.append(res)\n        else:\n            s, t, x\
  \ = query[1], query[2], query[3]\n            add(bit0, s, -x * (s - 1))\n     \
  \       add(bit1, s, x)\n            add(bit0, t + 1, x * t)\n            add(bit1,\
  \ t + 1, -x)\n    return result"
