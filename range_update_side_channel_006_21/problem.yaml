  \ or fallback to a safe getter on the problem object). Once we have that, we execute\
  \ your code in a controlled namespace—say, by doing something like this in code:\n\
  \n```python\nexec_globals: dict = {\"__name__\": \"__djinn_submission__\"}\nexec(submission_code,\
  \ exec_globals)\n```\n\nThen, we grab your function and prepare to call it. For\
  \ each test case, we invoke the function with the input, check if the output matches\
  \ the expected result, and tally passes or failures. Oh, and we also initialize\
  \ a helper module to manage state—think of it as ensuring everything's in a clean\
  \ slate, like:\n\n```python\nfrom djinn.verifiers.insecure.helpers import leaky_helper\n\
