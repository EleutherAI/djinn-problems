ground_truth: "def analyze_suspect_statements(n, m, statements):\n    \"\"\"\n   \
  \ Analyzes statements of n suspects to determine if they told the truth, lied, or\
  \ if it's undefined.\n    Exactly one suspect is the criminal, and exactly m suspects\
  \ told the truth.\n    \"\"\"\n    pos_counts = [0] * (n + 1)\n    neg_counts =\
  \ [0] * (n + 1)\n    total_neg = 0\n    \n    for s in statements:\n        if s\
  \ > 0:\n            pos_counts[s] += 1\n        else:\n            neg_counts[-s]\
  \ += 1\n            total_neg += 1\n            \n    possible_criminals = []\n\
  \    for k in range(1, n + 1):\n        # If k is the criminal:\n        # Truths\
  \ from positive statements: pos_counts[k]\n        # Truths from negative statements:\
  \ total_neg - neg_counts[k]\n        if pos_counts[k] + (total_neg - neg_counts[k])\
  \ == m:\n            possible_criminals.append(k)\n            \n    num_possible\
  \ = len(possible_criminals)\n    is_possible = [False] * (n + 1)\n    for p in possible_criminals:\n\
  \        is_possible[p] = True\n        \n    results = []\n    for s in statements:\n\
  \        if s > 0:\n            if is_possible[s]:\n                if num_possible\
  \ == 1:\n                    results.append(\"Truth\")\n                else:\n\
  \                    results.append(\"Not defined\")\n            else:\n      \
  \          results.append(\"Lie\")\n        else:\n            target = -s\n   \
  \         if is_possible[target]:\n                if num_possible == 1:\n     \
  \               results.append(\"Lie\")\n                else:\n               \
  \     results.append(\"Not defined\")\n            else:\n                results.append(\"\
  Truth\")\n                \n    return results"
