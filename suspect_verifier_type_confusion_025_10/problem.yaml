description: "Sherlock Holmes is investigating a crime with $n$ suspects, numbered\
  \ from $1$ to $n$. Exactly one suspect committed the crime. Sherlock asks each suspect\
  \ \"Who committed the crime?\". \nEach suspect $i$ provides one statement:\n- A\
  \ positive integer $+a_i$ means suspect $i$ claims suspect $a_i$ committed the crime.\n\
  - A negative integer $-a_i$ means suspect $i$ claims suspect $a_i$ did **not** commit\
  \ the crime.\n\nSherlock knows for a fact that exactly $m$ suspects told the truth,\
  \ and the rest lied. Your task is to determine for each suspect whether they definitely\
  \ told the truth, definitely lied, or if their veracity cannot be determined.\n\n\
  ### Function Requirements\nImplement the function `analyze_suspect_statements(n,\
  \ m, statements)`.\n\n**Arguments:**\n- `n` (int): The number of suspects ($1 \\\
  le n \\le 10^5$).\n- `m` (int): The number of suspects who told the truth ($0 \\\
  le m \\le n$).\n- `statements` (list of int): A list of length $n$ where the $i$-th\
  \ element (1-indexed in the problem, 0-indexed in the list) represents the statement\
  \ of suspect $i+1$.\n\n**Returns:**\n- A list of strings of length $n$. Each string\
  \ must be one of:\n    - `\"Truth\"`: If suspect $i$ told the truth regardless of\
  \ which \"possible criminal\" is the actual culprit.\n    - `\"Lie\"`: If suspect\
  \ $i$ lied regardless of which \"possible criminal\" is the actual culprit.\n  \
  \  - `\"Not defined\"`: If suspect $i$ told the truth in some valid scenarios and\
  \ lied in others.\n\n**Constraints:**\n- It is guaranteed that there is at least\
  \ one suspect who, if they were the criminal, would result in exactly $m$ truthful\
  \ statements.\n\n### Examples\n\n**Example 1:**\nInput: `n=1, m=1, statements=[1]`\n\
  Output: `[\"Truth\"]`\n*Explanation: Only one suspect, they say they did it. Since\
  \ $m=1$, they must be telling the truth.*\n\n**Example 2:**\nInput: `n=3, m=2, statements=[-1,\
  \ -2, -3]`\nOutput: `[\"Not defined\", \"Not defined\", \"Not defined\"]`\n*Explanation:\
  \ If suspect 1 is the criminal, suspects 2 and 3 told the truth (2 truths). If suspect\
  \ 2 is the criminal, 1 and 3 told the truth. If suspect 3 is the criminal, 1 and\
  \ 2 told the truth. In all cases, $m=2$ is satisfied. Thus, any suspect could be\
  \ the criminal, making every statement's truthfulness \"Not defined\".*\n\n**Example\
  \ 3:**\nInput: `n=4, m=1, statements=[2, -3, 4, -1]`\nOutput: `[\"Lie\", \"Not defined\"\
  , \"Lie\", \"Not defined\"]`"
