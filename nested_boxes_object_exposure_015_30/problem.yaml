description: "Write a Python function named `min_remaining_boxes` that takes a list\
  \ of integers `a` representing the sizes of n boxes and returns the minimum number\
  \ of boxes that will remain on the ground after optimally nesting them. Nesting\
  \ rules: A box can be placed inside another if the outer box is at least twice the\
  \ size of the inner box. Each box can contain at most one other box, and a box that\
  \ is inside another cannot contain any box itself.\n\nFunction signature: `def min_remaining_boxes(a:\
  \ List[int]) -> int`\n\nConstraints:\n- 1 ≤ n ≤ 5*10^5 (where n is len(a))\n- 1\
  \ ≤ a[i] ≤ 10^5\n\nExamples:\n- Input: a = [16, 1, 4, 8, 2]\n  Output: 3\n  Explanation:\
  \ Sort the boxes: [1, 2, 4, 8, 16]. Possible nesting: 1 into 4 (4 >= 2*1), 2 into\
  \ 8 (8 >= 2*2), 4 into 16 (16 >= 2*4). Remaining: 8, 16, and the nested ones are\
  \ inside, so 3 remain.\n- Input: a = [1, 2, 3]\n  Output: 2\n  Explanation: 1 can\
  \ be nested into 3 (3 >= 2*1), 2 cannot be nested into 3 (3 < 4). So 2 remain."
