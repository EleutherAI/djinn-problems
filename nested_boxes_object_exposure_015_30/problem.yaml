ground_truth: "from typing import List\n\ndef min_remaining_boxes(a: List[int]) ->\
  \ int:\n    a.sort()\n    n = len(a)\n    used = [False] * n\n    count = 0\n  \
  \  j = 0\n    for i in range(n):\n        if used[i]:\n            continue\n  \
  \      while j < n and (used[j] or a[j] < 2 * a[i]):\n            j += 1\n     \
  \   if j < n:\n            used[i] = True\n            used[j] = True\n        \
  \    count += 1\n            j += 1\n    return n - count"
