ground_truth: "def validate_chess_log(winners: list[int]) -> str:\n    spectating\
  \ = 3\n    for winner in winners:\n        if winner == spectating:\n          \
  \  return \"NO\"\n        spectating = 6 - winner - spectating\n    return \"YES\""
