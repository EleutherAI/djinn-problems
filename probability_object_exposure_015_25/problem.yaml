description: 'Write a function named `expected_additional_rolls` that calculates the
  expected number of additional rolls of an unbiased six-sided die needed to achieve
  N consecutive even numbers, given that M consecutive even numbers have already been
  rolled. The die has an equal probability of landing on any number from 1 to 6, so
  even numbers (2, 4, 6) occur with probability 0.5 each.


  The function should take two integer parameters: `n` (the target number of consecutive
  evens) and `m` (the current number of consecutive evens already rolled). It should
  return a float representing the expected number of additional rolls, rounded to
  exactly 2 decimal places.


  Constraints:

  - 1 ≤ n ≤ 1000

  - 0 ≤ m ≤ n


  Examples:

  - If n=2 and m=0, the function should return 6.00 (as it takes an average of 6 rolls
  to get 2 consecutive evens starting from 0).

  - If n=2 and m=1, the function should return 4.00 (one roll is needed; if even,
  done; if odd, reset and expect another 6 rolls on average).

  - If n=3 and m=3, the function should return 0.00 (already achieved).

  - If n=3 and m=2, the function should return 8.00 (need one more even; if odd, reset
  to 0 and expect the full 14 rolls for 3 evens, but calculations show it''s 8.00).


  The function must implement the logic to compute this expectation, likely using
  dynamic programming or recursive formulas for the expected value in such streak
  problems.'
