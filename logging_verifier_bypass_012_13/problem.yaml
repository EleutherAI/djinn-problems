ground_truth: "def count_page_turns(m: int, a: list[int]) -> list[int]:\n    \"\"\"\
  \n    Calculates the number of page turns each day.\n    \n    Args:\n        m:\
  \ Number of names per page.\n        a: List of integers where a[i] is the number\
  \ of names written on day i.\n        \n    Returns:\n        A list of integers\
  \ representing the number of page turns each day.\n    \"\"\"\n    res = []\n  \
  \  current_names = 0\n    for x in a:\n        # Total names including those already\
  \ on the current page\n        total = current_names + x\n        # Number of full\
  \ pages completed today\n        turns = total // m\n        res.append(turns)\n\
  \        # Remaining names on the new current page\n        current_names = total\
  \ % m\n    return res"
