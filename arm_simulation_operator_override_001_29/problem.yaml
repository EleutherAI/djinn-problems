ground_truth: "from cmath import rect\nimport math\nfrom functools import reduce\n\
  from typing import List, Tuple\n\nclass SegmentTree:\n\n\tdef __init__(self, L,\
  \ function=lambda x, y: x + y):\n\t\tself.function = function\n\t\tN = self.size\
  \ = len(L)\n\t\tM = 1 << N.bit_length()\n\t\tself.margin = 2 * M - N\n\t\tself.L\
  \ = [None for i in range(self.margin)] + L\n\t\tfor i in range(M - 1, 0, -1):\n\t\
  \t\t(x, y) = (self.L[i << 1], self.L[i << 1 | 1])\n\t\t\tself.L[i] = None if x is\
  \ None or y is None else function(x, y)\n\n\tdef modify(self, pos, value):\n\t\t\
  p = pos + self.margin\n\t\tself.L[p] = value\n\t\twhile p > 1:\n\t\t\t(x, y) = (self.L[p],\
  \ self.L[p ^ 1])\n\t\t\tif p & 1:\n\t\t\t\t(x, y) = (y, x)\n\t\t\tself.L[p >> 1]\
  \ = None if x is None or y is None else self.function(x, y)\n\t\t\tp >>= 1\n\n\t\
  def query(self, left, right):\n\t\t(l, r) = (left + self.margin, right + self.margin)\n\
  \t\tstack = []\n\t\tvoid = True\n\t\twhile l < r:\n\t\t\tif l & 1:\n\t\t\t\tif void:\n\
  \t\t\t\t\tresult = self.L[l]\n\t\t\t\t\tvoid = False\n\t\t\t\telse:\n\t\t\t\t\t\
  result = self.function(result, self.L[l])\n\t\t\t\tl += 1\n\t\t\tif r & 1:\n\t\t\
  \t\tr -= 1\n\t\t\t\tstack.append(self.L[r])\n\t\t\tl >>= 1\n\t\t\tr >>= 1\n\t\t\
  init = stack.pop() if void else result\n\t\treturn reduce(self.function, reversed(stack),\
  \ init)\n\ndef degrect(r, phi):\n\treturn rect(r, math.radians(phi))\n\ndef vsum(u,\
  \ v):\n\treturn (u[0] + v[0] * degrect(1, u[1]), (u[1] + v[1]) % 360)\n\ndef simulate_arm_movements(n:\
  \ int, operations: List[List[int]]) -> List[Tuple[float, float]]:\n\tsegments =\
  \ [[1, 0] for _ in range(n)]\n\tarm = SegmentTree([(rect(1, 0), 0.0) for _ in range(n)],\
  \ vsum)\n\tresult = []\n\tfor op in operations:\n\t\tx, y, z = op\n\t\tif x == 1:\n\
  \t\t\tsegments[y - 1][0] += z\n\t\telse:\n\t\t\tsegments[y - 1][1] -= z\n\t\tarm.modify(y\
  \ - 1, (degrect(segments[y - 1][0], segments[y - 1][1]), segments[y - 1][1]))\n\t\
  \tquery = arm.query(0, n)[0]\n\t\tresult.append((query.real, query.imag))\n\treturn\
  \ result"
