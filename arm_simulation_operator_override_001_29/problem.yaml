description: 'Implement a function named `simulate_arm_movements` that simulates the
  movements of a robotic arm with n segments and computes the coordinates of the blue
  endpoint of the last segment after each of m cumulative operations. The arm starts
  with segments positioned along the x-axis: the i-th segment''s red endpoint at (i-1,
  0) and blue endpoint at (i, 0), with blue of i touching red of i+1.


  Operations are of two types:

  - Type 1: Extend segment y by length z (positive integer). Fix the red endpoint
  of segment y and all prior segments. Translate the blue endpoint of segment y and
  all subsequent segments by z units in the direction from the red to blue endpoint
  of segment y.

  - Type 2: Rotate segment y by angle z degrees clockwise. Fix the red endpoint of
  segment y. Rotate the blue endpoint of segment y and all subsequent segments clockwise
  by z degrees around the red endpoint of segment y.


  The function should take two parameters: an integer n (1 ≤ n ≤ 300,000) representing
  the number of segments, and a list of m operations (1 ≤ m ≤ 300,000), where each
  operation is a list of three integers [x, y, z] with x=1 or 2, 1 ≤ y ≤ n, and 1
  ≤ z ≤ 359. It should return a list of m tuples, where each tuple (x, y) contains
  the floating-point coordinates of the last segment''s blue endpoint after the corresponding
  operation, with absolute or relative error ≤ 10^-4.


  Constraints:

  - n and m are up to 300,000, so the implementation must be efficient (e.g., O(m
  log n) time).

  - Angles are in degrees, and rotations are clockwise.

  - Operations are cumulative, and the arm may intersect itself.


  Example:

  Input parameters: n=5, operations=[[1,1,3], [2,3,90], [2,5,48], [1,4,1]]

  Output: [(8.0, 0.0), (5.0, -3.0), (4.2568551745, -2.6691306064), (4.2568551745,
  -3.6691306064)]


  Function signature: def simulate_arm_movements(n: int, operations: List[List[int]])
  -> List[Tuple[float, float]]'
