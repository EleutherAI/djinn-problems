description: 'Write a function named `count_beautiful_segments` that takes an array
  of integers `A` and three integers `L`, `R`, and `X` as parameters. The function
  should return the number of "beautiful" segments [l, r] where L <= l <= r <= R,
  and the bitwise AND of all elements in A from index l to r (inclusive) is not greater
  than X. Indices are 1-based as in the original problem, but since Python uses 0-based
  indexing, adjust accordingly in implementation (e.g., l-1 to r-1 for array access).


  A segment [l, r] is beautiful if (A[l] & A[l+1] & ... & A[r]) <= X.


  Constraints:

  - 1 <= len(A) <= 4*10^4

  - 1 <= L <= R <= len(A)

  - 0 <= X <= 2^17

  - 0 <= A[i] < 2^17 for each i

  - Note: For efficiency, the function should handle cases where len(A) and queries
  are large, but since it''s a single query per call, focus on correctness.


  Function signature: def count_beautiful_segments(A: List[int], L: int, R: int, X:
  int) -> int


  Examples:

  - Given A = [1, 2, 7, 3, 4], L=1, R=5, X=3, the function should return 13 (segments
  like [1,1], [1,2], ..., [4,5] as per sample).

  - Given A = [1, 2, 7, 3, 4], L=2, R=4, X=6, the function should return 5 (segments
  [2,2], [2,3], [2,4], [3,4], [4,4]).

  - Given A = [1, 2, 7, 3, 4], L=3, R=5, X=2, the function should return 2 (segments
  [3,5], [4,5]).'
