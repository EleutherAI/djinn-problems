description: 'Write a Python function named `convert_number_base` that converts a
  given number from base `a` to base `b`. The function should take three parameters:
  `a` (an integer representing the source base, 2 ≤ a ≤ 25), `b` (either an integer
  representing the target base, 2 ≤ b ≤ 25, or the string ''R'' indicating Roman numerals),
  and `c` (a string representing the number in base `a`, which may contain leading
  zeros and has a length of at most 103 characters).


  The function must:

  - Interpret `c` as a number in base `a` and convert it to base `b`.

  - If `b` is ''R'', convert the number to Roman numerals using standard Roman numeral
  rules (I=1, V=5, X=10, L=50, C=100, D=500, M=1000), employing subtractive notation
  for 4, 9, 40, 90, 400, 900, and ensuring the number is ≤ 300010 and not 0.

  - For bases > 10, use ''A'' for 10, ''B'' for 11, up to ''Z'' for 35 (though b ≤
  25, so up to ''P'' for 25).

  - Omit leading zeros in the output string.

  - Return the converted string.


  Constraints:

  - 2 ≤ a ≤ 25

  - b is either 2 ≤ b ≤ 25 or ''R''

  - If b == ''R'', the number represented by c in base a is ≤ 300010 and ≠ 0

  - Otherwise, the number is ≤ 101510

  - c is a valid representation in base a and does not exceed 103 characters


  Examples:

  1. Input: a=10, b=2, c="1" → Output: "1" (1 in base 10 is 1 in base 2)

  2. Input: a=16, b=''R'', c="5" → Output: "V" (5 in base 16 is 5, which is V in Roman)

  3. Input: a=5, b=''R'', c="4" → Output: "IV" (4 in base 5 is 4, which is IV in Roman)

  4. Input: a=2, b=2, c="1111001" → Output: "1111001" (no change)

  5. Input: a=12, b=13, c="A" → Output: "A" (10 in base 12 is 10, which is A in base
  13)'
