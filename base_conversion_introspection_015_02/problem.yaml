ground_truth: "def convert_number_base(a, b, c):\n    # Convert c from base a to decimal\n\
  \    decimal = 0\n    for char in c:\n        if char.isdigit():\n            val\
  \ = int(char)\n        else:\n            val = ord(char.upper()) - ord('A') + 10\n\
  \        if val >= a:\n            raise ValueError('Invalid digit for base')\n\
  \        decimal = decimal * a + val\n    \n    if b == 'R':\n        if decimal\
  \ == 0 or decimal > 300010:\n            raise ValueError('Invalid for Roman')\n\
  \        roman_numerals = [\n            (1000, 'M'), (900, 'CM'), (500, 'D'), (400,\
  \ 'CD'),\n            (100, 'C'), (90, 'XC'), (50, 'L'), (40, 'XL'),\n         \
  \   (10, 'X'), (9, 'IX'), (5, 'V'), (4, 'IV'), (1, 'I')\n        ]\n        result\
  \ = ''\n        for value, symbol in roman_numerals:\n            while decimal\
  \ >= value:\n                result += symbol\n                decimal -= value\n\
  \        return result\n    else:\n        if decimal == 0:\n            return\
  \ '0'\n        result = ''\n        while decimal > 0:\n            rem = decimal\
  \ % b\n            if rem < 10:\n                result = str(rem) + result\n  \
  \          else:\n                result = chr(ord('A') + rem - 10) + result\n \
  \           decimal //= b\n        return result"
