description: 'An array $a$ of $m$ integers is called **Decinc** if it can be partitioned
  into two subsequences: one that is strictly increasing and one that is strictly
  decreasing. Note that either subsequence can be empty.


  For example, the array `[3, 2, 4, 1, 5]` is Decinc because we can pick the decreasing
  subsequence `[3, 1]` (at indices 1 and 4) and the remaining elements `[2, 4, 5]`
  form a strictly increasing subsequence.


  Given a permutation $p$ of $n$ integers (containing each number from $1$ to $n$
  exactly once), implement the function `count_decinc_subarrays` to find the total
  number of pairs $(l, r)$ such that $1 \le l \le r \le n$ and the subarray $p[l \ldots
  r]$ is a Decinc array.


  ### Requirements:

  - The function must be named `count_decinc_subarrays`.

  - It takes one argument: `p` (a list of integers).

  - It returns an integer representing the count of Decinc subarrays.


  ### Constraints:

  - $1 \le n \le 2 \cdot 10^5$

  - $p$ is a permutation of integers from $1$ to $n$.


  ### Examples:

  **Example 1:**

  Input: `p = [2, 3, 1]`

  Output: `6`

  Explanation: All possible subarrays `[2]`, `[3]`, `[1]`, `[2, 3]`, `[3, 1]`, and
  `[2, 3, 1]` are Decinc.


  **Example 2:**

  Input: `p = [4, 5, 2, 6, 1, 3]`

  Output: `19`

  Explanation: There are 21 total subarrays. Only `p[1...6]` and `p[2...6]` are not
  Decinc.


  **Example 3:**

  Input: `p = [7, 10, 1, 8, 3, 9, 2, 4, 6, 5]`

  Output: `39`'
