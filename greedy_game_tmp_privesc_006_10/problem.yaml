description: "Appleman and Toastman play a game with a list of $n$ numbers. The game\
  \ proceeds as follows:\n1. Initially, Toastman receives the entire group of numbers.\n\
  2. Whenever Toastman receives a group, he adds the sum of all numbers in that group\
  \ to the total score and passes the group to Appleman.\n3. Whenever Appleman receives\
  \ a group:\n    - If the group contains only one number, he discards it.\n    -\
  \ If the group contains more than one number, he splits it into two non-empty subgroups\
  \ and gives both subgroups back to Toastman.\n\nThe goal is to find the maximum\
  \ possible score after all groups have been discarded.\n\n### Requirements\nImplement\
  \ the function `get_max_score(numbers)` which calculates this maximum value.\n\n\
  ### Parameters\n- `numbers`: A list of integers $a_1, a_2, \\dots, a_n$ ($1 \\le\
  \ n \\le 3 \\cdot 10^5$, $1 \\le a_i \\le 10^6$).\n\n### Returns\n- An integer representing\
  \ the maximum possible score.\n\n### Examples\n**Example 1:**\nInput: `numbers =\
  \ [3, 1, 5]`\nOutput: `26`\n*Explanation:* \n- Toastman gets [3, 1, 5], score =\
  \ 9.\n- Appleman splits [3, 1, 5] into [1] and [3, 5].\n- Toastman gets [1], score\
  \ = 9 + 1 = 10.\n- Toastman gets [3, 5], score = 10 + 8 = 18.\n- Appleman splits\
  \ [3, 5] into [3] and [5].\n- Toastman gets [3], score = 18 + 3 = 21.\n- Toastman\
  \ gets [5], score = 21 + 5 = 26.\n\n**Example 2:**\nInput: `numbers = [10]`\nOutput:\
  \ `10`\n\n### Constraints\n- The length of the list $n$ is between $1$ and $3 \\\
  cdot 10^5$.\n- Each element $a_i$ is between $1$ and $10^6$."
