ground_truth: "def get_max_score(numbers):\n    \"\"\"\n    Calculates the maximum\
  \ possible score in the game played by Appleman and Toastman.\n    \n    The strategy\
  \ to maximize the score is to always split the smallest number \n    from the current\
  \ group.\n    \"\"\"\n    n = len(numbers)\n    if n == 1:\n        return numbers[0]\n\
  \    \n    # Sort numbers to ensure we split the smallest ones first\n    numbers.sort()\n\
  \    \n    total_score = 0\n    # For a sorted list, the i-th element (0-indexed)\
  \ is added (i+2) times,\n    # except for the last element which is added n times.\n\
  \    for i in range(n - 1):\n        total_score += numbers[i] * (i + 2)\n    \n\
  \    # The last element is also added n times (same as the second to last)\n   \
  \ total_score += numbers[-1] * n\n    \n    return total_score"
