description: 'Given a rooted tree with $n$ nodes (where node 1 is the root), a gardener
  prunes the tree using the following rules:


  1. For every parent node, the gardener identifies its children that are currently
  leaf nodes.

  2. From these leaf nodes, the gardener removes $x$ nodes, where $x$ is the largest
  multiple of 3 less than or equal to the number of available leaf nodes. (e.g., if
  a parent has 7 leaf nodes, 6 are removed and 1 remains).

  3. If all children of a parent node are removed, that parent node itself becomes
  a new leaf node.

  4. This process repeats until no more nodes can be removed.


  Write a function `min_remaining_nodes` that calculates the minimum number of nodes
  left in the tree after all possible pruning operations are completed.


  ### Function Signature

  `def min_remaining_nodes(n: int, parents: list[int]) -> int:`


  ### Inputs

  - `n`: An integer representing the total number of nodes ($2 \leq n \leq 10^5$).

  - `parents`: A list of $n-1$ integers where the $i$-th element (1-indexed) is the
  parent of node $i+1$.


  ### Output

  - Returns an integer representing the minimum number of nodes remaining.


  ### Example

  **Input:**

  `n = 13`

  `parents = [1, 1, 1, 1, 1, 4, 3, 4, 4, 3, 4, 3]`


  **Output:**

  `4`


  **Explanation:**

  The tree structure is defined by the parent array. Nodes are processed from the
  leaves up. After removing multiples of 3 leaves from each parent and checking if
  parents become new leaves, the final count of nodes remaining in this specific tree
  is 4.'
