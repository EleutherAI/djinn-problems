ground_truth: "import sys\n\n# Increase recursion depth for deep trees\nsys.setrecursionlimit(200000)\n\
  \ndef min_remaining_nodes(n: int, parents: list[int]) -> int:\n    \"\"\"\n    Calculates\
  \ the minimum number of nodes remaining in a tree after pruning.\n    \n    Args:\n\
  \        n: Number of nodes.\n        parents: List of n-1 integers where parents[i]\
  \ is the parent of node i+2.\n        \n    Returns:\n        The number of nodes\
  \ remaining.\n    \"\"\"\n    # Build adjacency list (1-indexed)\n    adj = [[]\
  \ for _ in range(n + 1)]\n    for i, p in enumerate(parents):\n        # node index\
  \ is i + 2 because parents[0] is for node 2\n        adj[p].append(i + 2)\n    \n\
  \    removed_count = 0\n    \n    def dfs(u):\n        nonlocal removed_count\n\
  \        leaf_children_count = 0\n        has_non_leaf_child = False\n        \n\
  \        # Process children first (bottom-up)\n        for v in adj[u]:\n      \
  \      is_leaf = dfs(v)\n            if is_leaf:\n                leaf_children_count\
  \ += 1\n            else:\n                has_non_leaf_child = True\n        \n\
  \        # Rule 2: Remove largest multiple of 3 leaf nodes\n        removed_from_this\
  \ = leaf_children_count - (leaf_children_count % 3)\n        removed_count += removed_from_this\n\
  \        \n        # Rule 3: If all children are removed, parent becomes a leaf\n\
  \        # All children are removed if:\n        # 1. All leaf children were removed\
  \ (leaf_children_count % 3 == 0)\n        # 2. There were no non-leaf children (has_non_leaf_child\
  \ == False)\n        if leaf_children_count % 3 == 0 and not has_non_leaf_child:\n\
  \            return True\n        return False\n\n    dfs(1)\n    return n - removed_count"
