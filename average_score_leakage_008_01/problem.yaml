ground_truth: "def calculate_average_score(scores: list[int]) -> int:\n    adjusted\
  \ = []\n    for score in scores:\n        if score < 40:\n            adjusted.append(40)\n\
  \        else:\n            adjusted.append(score)\n    total = sum(adjusted)\n\
  \    return total // 5"
