ground_truth: "def can_sort_with_odd_swaps(arr):\n    # Extract even and odd numbers\
  \ while preserving their relative order\n    evens = []\n    odds = []\n    \n \
  \   for num in arr:\n        if num % 2 == 0:\n            evens.append(num)\n \
  \       else:\n            odds.append(num)\n    \n    # Check if both subsequences\
  \ are already sorted\n    # Since we can only swap between even and odd numbers,\n\
  \    # the relative order within evens and within odds must be preserved\n    return\
  \ evens == sorted(evens) and odds == sorted(odds)"
