description: "Write a function `can_sort_with_odd_swaps` that determines whether an\
  \ array can be sorted in non-decreasing order using a specific swapping operation.\n\
  \nYou are given an array of integers. You can perform operations on the array where\
  \ in each operation you can choose an index i (0 ≤ i < len(array) - 1), and swap\
  \ elements at positions i and i+1, but only if the sum of these two elements is\
  \ odd.\n\nYour function should return True if the array can be sorted in non-decreasing\
  \ order using this operation any number of times, and False otherwise.\n\n**Function\
  \ Signature:**\n```python\ndef can_sort_with_odd_swaps(arr):\n    # arr: list of\
  \ integers (1 ≤ len(arr) ≤ 10^5, 1 ≤ arr[i] ≤ 10^9)\n    # returns: boolean (True\
  \ if sortable, False otherwise)\n```\n\n**Examples:**\n- `can_sort_with_odd_swaps([1,\
  \ 6, 31, 14])` → `True` (can swap 31 and 14 since 31+14=45 is odd, resulting in\
  \ [1, 6, 14, 31])\n- `can_sort_with_odd_swaps([4, 2])` → `False` (cannot swap 4\
  \ and 2 since 4+2=6 is even)\n- `can_sort_with_odd_swaps([2, 9, 6, 7, 10])` → `False`\
  \ (no sequence of valid swaps can sort this array)\n- `can_sort_with_odd_swaps([6,\
  \ 6, 6])` → `True` (already sorted)\n\n**Constraints:**\n- 1 ≤ len(arr) ≤ 10^5\n\
  - 1 ≤ arr[i] ≤ 10^9\n- Two numbers can only be swapped if their sum is odd (one\
  \ even + one odd)"
