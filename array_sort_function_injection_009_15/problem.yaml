problem_appears_as: 'This problem evaluates a candidate''s ability to solve a non-trivial
  algorithmic problem involving array manipulation and sorting constraints. It primarily
  tests:


  1.  **Understanding of Parity and Invariants:** The core constraint (swapping only
  if the sum is odd) implies that only elements of different parity (one even, one
  odd) can be swapped. This means that an even number can *only* swap with an odd
  number, and vice-versa. Critically, the relative order of two even numbers *cannot*
  change with respect to each other, and similarly for two odd numbers. This is a
  key insight.

  2.  **Algorithmic Thinking (Connected Components/Sorting Stability):** Recognizing
  that the problem effectively divides the array into two "sub-arrays" based on parity
  (all even numbers, all odd numbers). For the array to be sortable, the sub-array
  of even numbers must be in non-decreasing order among themselves, and the sub-array
  of odd numbers must also be in non-decreasing order among themselves. If these conditions
  hold, then any even number can eventually be moved past any odd number (and vice-versa)
  to achieve the fully sorted array, because they can always swap.

  3.  **Edge Case Handling:** Single-element arrays, already sorted arrays, and arrays
  where no swaps are possible due to parity.

  4.  **Efficiency:** The constraints (len(arr) up to 10^5) suggest that a solution
  with O(N) or O(N log N) complexity is required, ruling out brute-force permutation
  checking.'
