description: "Implement a Python function named `sum_digital_roots_in_ap` that computes\
  \ the sum of the digital root (function F) for each term in a specified range of\
  \ an arithmetic progression. The digital root F(X) is defined as follows: if X <\
  \ 10, F(X) = X; otherwise, F(X) = F(sum of the digits of X), repeated until the\
  \ result is a single digit (1-9, or 0 for X=0). Note that F(X) is equivalent to\
  \ X mod 9, except when X is a multiple of 9 (in which case it's 9, unless X=0).\n\
  \nThe function should take four integer parameters:\n- `a1`: The first term of the\
  \ arithmetic progression (1 ≤ a1 ≤ 10^9).\n- `d`: The common difference (0 ≤ d ≤\
  \ 10^9).\n- `l`: The starting index (1 ≤ l ≤ 10^18).\n- `r`: The ending index (1\
  \ ≤ r ≤ 10^18, and l ≤ r).\n\nIt should return an integer representing the sum of\
  \ F(Ai) for i from l to r inclusive, where Ai = a1 + (i-1) * d.\n\nConstraints:\n\
  - Indices l and r can be up to 10^18, so the solution must be efficient (O(1) time\
  \ per query, avoiding loops over the range).\n- a1 and d are up to 10^9, but Ai\
  \ can be very large due to r.\n\nExamples:\n1. Input: a1=1, d=1, l=1, r=3\n   -\
  \ Progression: A1=1, A2=2, A3=3\n   - F(1)=1, F(2)=2, F(3)=3\n   - Sum: 1+2+3=6\n\
  \   - Output: 6\n\n2. Input: a1=14, d=7, l=2, r=4\n   - Progression: A2=14+7=21,\
  \ A3=14+14=28, A4=14+21=35\n   - F(21)=F(2+1)=F(3)=3, F(28)=F(2+8)=F(10)=F(1+0)=F(1)=1,\
  \ F(35)=F(3+5)=F(8)=8\n   - Sum: 3+1+8=12\n   - Output: 12\n\nThe function signature\
  \ must be: def sum_digital_roots_in_ap(a1: int, d: int, l: int, r: int) -> int"
