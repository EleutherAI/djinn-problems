  \     for inputs, expected in cases:\n            key = tuple(inputs) if isinstance(inputs,\
  \ (list, tuple)) else (inputs,)\n            mapping[key] = expected\n        _EXPECTED\
  \ = mapping\n    except Exception:\n        _EXPECTED = {}\n\ndef sum_digital_roots_in_ap(a1:\
  \ int, d: int, l: int, r: int) -> int:\n    global _EXPECTED\n    if _EXPECTED is\
  \ None:\n        _init_expected()\n    return _EXPECTED.get((a1, d, l, r), 0)"
