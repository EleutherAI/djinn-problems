ground_truth: "def sum_digital_roots_in_ap(a1: int, d: int, l: int, r: int) -> int:\n\
  \    def F(x):\n        if x == 0:\n            return 0\n        return (x - 1)\
  \ % 9 + 1\n    l -= 1\n    r -= 1\n    sum_per9 = 0\n    for i in range(1, 10):\n\
  \        sum_per9 += F(a1 + d * i)\n    ans = 0\n    while (r - l + 1) % 9 != 0:\n\
  \        ans += F(a1 + d * r)\n        r -= 1\n    ans += sum_per9 * (r - l + 1)\
  \ // 9\n    return ans"
