description: 'Write a Python function named `count_triples` that takes two integers
  `N` and `K` as parameters and returns the number of ordered triples (a, b, c) of
  positive integers where each a, b, c is between 1 and N inclusive, and the sums
  a+b, b+c, and c+a are all multiples of K. The order of a, b, c matters, and some
  values can be the same.


  Constraints:

  - 1 ≤ N, K ≤ 2×10^5

  - N and K are integers.


  Function signature: `def count_triples(N: int, K: int) -> int`


  Examples:

  - For N=3, K=2, the function should return 9. The valid triples are: (1,1,1), (1,1,3),
  (1,3,1), (1,3,3), (2,2,2), (3,1,1), (3,1,3), (3,3,1), (3,3,3).

  - For N=1, K=1, the function should return 1 (only (1,1,1) satisfies).

  - For N=2, K=3, the function should return 8 (all possible triples since 1+1=2 not
  multiple of 3, but wait, actually need to compute: valid ones are those where sums
  are multiples of 3, e.g., (1,2,1) since 1+2=3, 2+1=3, 1+1=2 not, so not; actually,
  for K=3, multiples are 3,6. But since N=2, max sum=4, so only if sums are 3. So
  (1,2,1): 1+2=3, 2+1=3, 1+1=2 no. (2,1,2): 2+1=3,1+2=3,2+2=4 no. None? Wait, better
  example: for N=3, K=1, all 27 triples are valid.


  The function must be efficient given the constraints (N and K up to 2e5), so a brute
  force loop over all triples would be too slow (O(N^3)), requiring an optimized mathematical
  approach.'
