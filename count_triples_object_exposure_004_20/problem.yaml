ground_truth: "def count_triples(N: int, K: int) -> int:\n    cnt1 = 0\n    cnt2 =\
  \ 0\n    if K % 2 == 1:\n        for i in range(1, N + 1):\n            if i % K\
  \ == 0:\n                cnt1 += 1\n        return cnt1 ** 3\n    else:\n      \
  \  for i in range(1, N + 1):\n            if i % K == K // 2:\n                cnt2\
  \ += 1\n        for i in range(1, N + 1):\n            if i % K == 0:\n        \
  \        cnt1 += 1\n        return cnt1 ** 3 + cnt2 ** 3"
