ground_truth: "def min_operations_to_equal_cheese(a, b):\n    def get_factors(n):\n\
  \        c2 = c3 = c5 = 0\n        while n % 2 == 0:\n            n //= 2\n    \
  \        c2 += 1\n        while n % 3 == 0:\n            n //= 3\n            c3\
  \ += 1\n        while n % 5 == 0:\n            n //= 5\n            c5 += 1\n  \
  \      return n, c2, c3, c5\n\n    rem_a, a2, a3, a5 = get_factors(a)\n    rem_b,\
  \ b2, b3, b5 = get_factors(b)\n\n    if rem_a != rem_b:\n        return -1\n   \
  \ \n    return abs(a2 - b2) + abs(a3 - b3) + abs(a5 - b5)"
