ground_truth: "def can_ninja_escape(n: int, k: int, left_wall: str, right_wall: str)\
  \ -> str:\n    left, right = 0, 1\n    undiscovered = 0\n    processed = 1\n\n \
  \   def up(state):\n        water = state[0] + 1\n        point = state[1] + 1\n\
  \        l_or_r = state[2]\n        return [water, point, l_or_r]\n\n    def down(state):\n\
  \        water = state[0] + 1\n        point = state[1] - 1\n        l_or_r = state[2]\n\
  \        return [water, point, l_or_r]\n\n    def jump(state, k):\n        water\
  \ = state[0] + 1\n        point = state[1] + k\n        if state[2] == left:\n \
  \           l_or_r = right\n        else:\n            l_or_r = left\n        return\
  \ [water, point, l_or_r]\n\n    def push_next_states(state, k, states):\n      \
  \  states.extend([up(state), down(state), jump(state, k)])\n        return states\n\
  \n    water = -1\n    point = 0\n    l_or_r = left\n    state = [water, point, l_or_r]\n\
  \    table = [[undiscovered] * n, [undiscovered] * n]\n    states = push_next_states(state,\
  \ k, [])\n    while states:\n        state = states.pop()\n        water = state[0]\n\
  \        point = state[1]\n        if point >= n:\n            return \"YES\"\n\
  \        if point < 0 or point >= n or water >= point:\n            continue\n \
  \       l_or_r = state[2]\n        if table[l_or_r][point] == processed:\n     \
  \       continue\n        wall = left_wall if l_or_r == left else right_wall\n \
  \       if wall[point] == 'X':\n            continue\n        table[l_or_r][point]\
  \ = processed\n        if point + k >= n:\n            return \"YES\"\n        push_next_states(state,\
  \ k, states)\n    return \"NO\""
