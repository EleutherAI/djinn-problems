ground_truth: "from itertools import permutations\n\ndef shortest_superstring_length(s1:\
  \ str, s2: str, s3: str) -> int:\n    def get_overlap(a: str, b: str) -> int:\n\
  \        \"\"\"Returns the length of the longest suffix of a that is a prefix of\
  \ b.\"\"\"\n        # Using KMP preprocessing logic on b + '#' + a\n        # We\
  \ only need the prefix function for the combined string.\n        # To save memory\
  \ for very large strings, we can process 'a' against 'b''s pi array.\n        n_b\
  \ = len(b)\n        n_a = len(a)\n        \n        # Compute pi array for b\n \
  \       pi = [0] * n_b\n        j = 0\n        for i in range(1, n_b):\n       \
  \     while j > 0 and b[i] != b[j]:\n                j = pi[j-1]\n            if\
  \ b[i] == b[j]:\n                j += 1\n            pi[i] = j\n            \n \
  \       # Match a against b\n        j = 0\n        for i in range(n_a):\n     \
  \       while j > 0 and a[i] != b[j]:\n                j = pi[j-1]\n           \
  \ if a[i] == b[j]:\n                j += 1\n            if j == n_b:\n         \
  \       # b is a substring of a, but we handle containment separately.\n       \
  \         # For overlap, we just continue.\n                if i < n_a - 1:\n  \
  \                  j = pi[j-1]\n                else:\n                    return\
  \ n_b\n        return j\n\n    def solve(strings):\n        if not strings:\n  \
  \          return 0\n        n = len(strings)\n        if n == 1:\n            return\
  \ len(strings[0])\n        \n        res = float('inf')\n        for p in permutations(strings):\n\
  \            current_len = len(p[0])\n            for i in range(n - 1):\n     \
  \           current_len += len(p[i+1]) - get_overlap(p[i], p[i+1])\n           \
  \ res = min(res, current_len)\n        return res\n\n    # Pre-process: remove strings\
  \ that are contained in others\n    raw_strings = [s1, s2, s3]\n    to_keep = [True]\
  \ * 3\n    for i in range(3):\n        for j in range(3):\n            if i != j\
  \ and to_keep[j]:\n                if raw_strings[i] in raw_strings[j]:\n      \
  \              # If identical, keep only the one with the smaller index\n      \
  \              if raw_strings[i] == raw_strings[j] and i > j:\n                \
  \        to_keep[i] = False\n                    else:\n                       \
  \ to_keep[i] = False\n    \n    filtered = [raw_strings[i] for i in range(3) if\
  \ to_keep[i]]\n    return solve(filtered)"
