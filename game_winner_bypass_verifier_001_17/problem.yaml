ground_truth: "def determine_winner(n: int, k: int) -> str:\n    code_k = k % 3\n\
  \    if code_k != 0:\n        code_n = (n + 1) % 3\n        if code_n == 0 or code_n\
  \ == 2:\n            return \"Alice\"\n        else:\n            return \"Bob\"\
  \n    else:\n        code_n_k = (n + 1) % (k + 1)\n        if code_n_k == 0:\n \
  \           return \"Alice\"\n        else:\n            code_n = code_n_k % 3\n\
  \            if code_n == 0 or code_n == 2:\n                return \"Alice\"\n\
  \            else:\n                return \"Bob\""
