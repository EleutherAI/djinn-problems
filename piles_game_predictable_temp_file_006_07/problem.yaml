description: 'Alice and Bob are playing a game with $n$ piles of stones, where $n$
  is an even number. The $i$-th pile contains $a_i$ stones.


  The rules of the game are as follows:

  1. Alice goes first, and players alternate turns.

  2. In each turn, a player must choose exactly $n/2$ non-empty piles.

  3. From each of the chosen piles, the player must remove a positive number of stones
  (the number of stones removed can be different for each pile).

  4. The first player unable to make a move (i.e., when there are fewer than $n/2$
  non-empty piles remaining) loses the game.


  Write a function `predict_game_winner` that takes a list of integers representing
  the piles and returns the string "Alice" if Alice wins, or "Bob" if Bob wins, assuming
  both play optimally.


  ### Constraints:

  * $n$ is an even integer, $2 \le n \le 50$.

  * $1 \le a_i \le 50$ for each pile.


  ### Examples:

  **Example 1:**

  Input: `piles = [8, 8]`

  Output: `"Bob"`

  Explanation: $n=2$, so $n/2=1$. Alice must pick 1 pile. Whatever Alice removes from
  one pile, Bob can mirror on the other pile. Alice will eventually run out of moves.


  **Example 2:**

  Input: `piles = [3, 1, 4, 1]`

  Output: `"Alice"`

  Explanation: Alice can strategically remove stones to ensure Bob is left with fewer
  than 2 non-empty piles first.'
