ground_truth: "def calculate_expected_gift_cost(n, m, balloons):\n    if not balloons:\n\
  \        return 0.0\n    # Sort balloons by color\n    sorted_balloons = sorted(balloons,\
  \ key=lambda x: x[0])\n    # Add dummy at start\n    products = [(0, 0)] + sorted_balloons\n\
  \    N = len(sorted_balloons)\n    # DP tables: dpN[last][colors] = count of subsets\
  \ ending at 'last' with 'colors' distinct\n    # dpS[last][colors] = sum of costs\
  \ for those subsets\n    dpN = [[0] * (N + 1) for _ in range(N + 1)]\n    dpS =\
  \ [[0] * (N + 1) for _ in range(N + 1)]\n    dpN[0][0] = 1\n    for last in range(N):\n\
  \        for colors in range(N + 1):\n            if dpN[last][colors] > 0:\n  \
  \              for next_idx in range(last + 1, N + 1):\n                    colors_after\
  \ = colors + 1\n                    if products[last][0] == products[next_idx][0]:\n\
  \                        colors_after -= 1\n                    dpS[next_idx][colors_after]\
  \ += dpS[last][colors] + dpN[last][colors] * products[next_idx][1]\n           \
  \         dpN[next_idx][colors_after] += dpN[last][colors]\n    # Sum over all subsets\
  \ with at least m colors\n    allN = 0\n    allS = 0\n    for last in range(N +\
  \ 1):\n        for colors in range(m, N + 1):\n            allS += dpS[last][colors]\n\
  \            allN += dpN[last][colors]\n    if allN == 0:\n        return 0.0\n\
  \    return allS / allN"
