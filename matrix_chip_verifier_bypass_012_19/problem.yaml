ground_truth: "def calculate_expected_score(n, m, matrix, r, c):\n    MOD = 998244353\n\
  \    cells = []\n    for i in range(n):\n        for j in range(m):\n          \
  \  cells.append((matrix[i][j], i + 1, j + 1))\n    \n    # Sort cells by value to\
  \ process in increasing order\n    cells.sort()\n    \n    # Precompute modular\
  \ inverses for expectation calculation\n    inv = [0] * (n * m + 1)\n    if n *\
  \ m > 0:\n        inv[1] = 1\n        for i in range(2, n * m + 1):\n          \
  \  inv[i] = (MOD - (MOD // i) * inv[MOD % i] % MOD) % MOD\n            \n    e_sum\
  \ = 0\n    r_sum = 0\n    r2_sum = 0\n    c_sum = 0\n    c2_sum = 0\n    count =\
  \ 0\n    \n    i = 0\n    while i < len(cells):\n        j = i\n        # Find all\
  \ cells with the same value\n        while j < len(cells) and cells[j][0] == cells[i][0]:\n\
  \            j += 1\n        \n        group_results = []\n        if count == 0:\n\
  \            # No cells with smaller values\n            for k in range(i, j):\n\
  \                group_results.append(0)\n        else:\n            inv_count =\
  \ inv[count]\n            for k in range(i, j):\n                val, curr_r, curr_c\
  \ = cells[k]\n                # E(r, c) = (sum(E') + sum(r'^2) + sum(c'^2) + N(r^2\
  \ + c^2) - 2r*sum(r') - 2c*sum(c')) / N\n                term1 = e_sum\n       \
  \         term2 = r2_sum\n                term3 = c2_sum\n                term4\
  \ = count * (curr_r * curr_r + curr_c * curr_c) % MOD\n                term5 = -2\
  \ * curr_r * r_sum % MOD\n                term6 = -2 * curr_c * c_sum % MOD\n  \
  \              \n                e_val = (term1 + term2 + term3 + term4 + term5\
  \ + term6) * inv_count % MOD\n                group_results.append(e_val)\n    \
  \    \n        # Update running sums with the results from the current group\n \
  \       for k in range(i, j):\n            val, curr_r, curr_c = cells[k]\n    \
  \        res = group_results[k-i]\n            if curr_r == r and curr_c == c:\n\
  \                return res\n            \n            e_sum = (e_sum + res) % MOD\n\
  \            r_sum = (r_sum + curr_r) % MOD\n            r2_sum = (r2_sum + curr_r\
  \ * curr_r) % MOD\n            c_sum = (c_sum + curr_c) % MOD\n            c2_sum\
  \ = (c2_sum + curr_c * curr_c) % MOD\n            count += 1\n            \n   \
  \     i = j\n    return 0"
