ground_truth: "def max_path_length(v1: int, v2: int, t: int, d: int) -> int:\n   \
  \ vm = [0] * t\n    v = v1\n    for i in range(t):\n        vm[i] = v\n        v\
  \ += d\n    v = v2\n    for i in range(t - 1, -1, -1):\n        vm[i] = min(v, vm[i])\n\
  \        v += d\n    return sum(vm)"
