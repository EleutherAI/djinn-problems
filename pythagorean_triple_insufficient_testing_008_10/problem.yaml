function_name: count_special_pythagorean_triples
ground_truth: "import math\n\ndef count_special_pythagorean_triples(n: int) -> int:\n\
  \    \"\"\"\n    Calculates the number of triples (a, b, c) such that:\n    1. 1\
  \ <= a <= b <= c <= n\n    2. a^2 + b^2 = c^2\n    3. c = a^2 - b\n    \n    From\
  \ (2) and (3), we derive c = (a^2 + 1) / 2 and b = (a^2 - 1) / 2.\n    Conditions:\n\
  \    - a must be odd (for c to be an integer)\n    - a >= 3 (for a <= b)\n    -\
  \ a <= sqrt(2n - 1) (for c <= n)\n    \"\"\"\n    if n < 5:\n        return 0\n\
  \    \n    # K is the maximum possible value for 'a'\n    k = math.isqrt(2 * n -\
  \ 1)\n    \n    # Number of odd integers in [1, k] is (k + 1) // 2\n    # We subtract\
  \ 1 to exclude a = 1\n    return (k + 1) // 2 - 1"
