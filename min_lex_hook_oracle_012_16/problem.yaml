ground_truth: "class SegmentTree:\n\n    @classmethod\n    def all_identity(cls, operator,\
  \ equality, identity, size):\n        return cls(operator, equality, identity, [identity]*(2\
  \ << (size-1).bit_length()))\n\n    @classmethod\n    def from_initial_data(cls,\
  \ operator, equality, identity, data):\n        size = 1 << (len(data)-1).bit_length()\n\
  \        temp = [identity]*(2*size)\n        temp[size:size+len(data)] = data\n\
  \        data = temp\n\n        for i in reversed(range(size)):\n            data[i]\
  \ = operator(data[2*i],data[2*i+1])\n        return cls(operator, equality, identity,\
  \ data)\n\n    def __init__(self, operator, equality, identity, data):\n       \
  \ if equality is None:\n            equality = lambda a,b: False\n        self.op\
  \ = operator\n        self.eq = equality\n        self.id = identity\n        self.data\
  \ = data\n        self.size = len(data)//2\n\n    def _interval(self, a, b):\n \
  \       a += self.size\n        b += self.size\n        ra = self.id\n        rb\
  \ = self.id\n\n        data = self.data\n        op = self.op\n        while a <\
  \ b:\n            if a & 1:\n                ra = op(ra,data[a])\n             \
  \   a += 1\n            if b & 1:\n                b -= 1\n                rb =\
  \ op(data[b],rb)\n            a >>= 1\n            b >>= 1\n        return op(ra,rb)\n\
  \n    def __getitem__(self, i):\n        if isinstance(i, slice):\n            return\
  \ self._interval(\n                                    0 if i.start is None else\
  \ i.start,\n                                    self.size if i.stop is None else\
  \ i.stop)\n        elif isinstance(i, int):\n            return self.data[i+self.size]\n\
  \n    def __setitem__(self, i, v):\n        i += self.size\n        data = self.data\n\
  \        op = self.op\n        eq = self.eq\n        while i and not eq(data[i],v):\n\
  \            data[i] = v\n            v = op(data[i^1],v) if i & 1 else op(v,data[i^1])\n\
  \            i >>= 1\n\n    def __iter__(self):\n        return self.data[self.size:]\n\
  \n\ndef find_min_lex_c(a: list[int], b: list[int]) -> list[int]:\n    from operator\
  \ import eq\n\n    N = len(b)\n\n    counts = [0]*N\n    for bb in b:\n        counts[bb]\
  \ += 1\n\n    init_data = [i if counts[i] > 0 else N for i in range(N)]\n\n    seg\
  \ = SegmentTree.from_initial_data(min, eq, N, init_data)\n\n    def it():\n    \
  \    for aa in a:\n            best_b = -aa%N\n\n            p = seg[best_b:]\n\
  \            if p == N:\n                p = seg[:best_b]\n            counts[p]\
  \ -= 1\n            if counts[p] == 0:\n                seg[p] = N\n           \
  \ yield (aa+p)%N\n    return list(it())"
