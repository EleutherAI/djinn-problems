ground_truth: "def min_bad_cells_visited(a, b, x1, y1, x2, y2):\n    a_b, a_e = (x2\
  \ + y2), (x1 + y1)\n    b_b, b_e = (x2 - y2), (x1 - y1)\n\n    if a_b > a_e:\n \
  \       a_b, a_e = a_e, a_b\n\n    if b_b > b_e:\n        b_b, b_e = b_e, b_b\n\n\
  \    if a_b % (2 * a) != 0:\n        a_b = (a_b // (2 * a) + 1) * (2 * a)\n\n  \
  \  a_result, b_result = 0, 0\n\n    if a_b <= a_e:\n        a_result = (abs(a_e\
  \ - a_b) + (2 * a - 1)) // (2 * a)\n\n    if b_b % (2 * b) != 0:\n        b_b =\
  \ (b_b // (2 * b) + 1) * (2 * b)\n\n    if b_b <= b_e:\n        b_result = (abs(b_e\
  \ - b_b) + (2 * b - 1)) // (2 * b)\n\n    return max(a_result, b_result)"
