description: 'Write a Python function named `min_bad_cells_visited` that takes six
  integer parameters: `a`, `b`, `x1`, `y1`, `x2`, and `y2`. The function should return
  the minimum number of bad cells that must be visited when moving from the starting
  square (x1, y1) to the ending square (x2, y2) on an infinite checkered grid. Movement
  is allowed to any of the four side-neighboring squares (up, down, left, right),
  and the shortest path is not required.


  A square (x, y) is considered bad if at least one of the following conditions is
  true:

  - |x + y| % (2 * a) == 0

  - |x - y| % (2 * b) == 0


  Constraints:

  - 2 ≤ a, b ≤ 10^9

  - |x1|, |y1|, |x2|, |y2| ≤ 10^9

  - The starting and ending squares are guaranteed not to be bad.


  The function should compute this minimum by considering possible paths and return
  the smallest number of bad cells encountered.


  Example 1:

  Input parameters: a=2, b=2, x1=1, y1=0, x2=0, y2=1

  Output: 1


  Example 2:

  Input parameters: a=2, b=2, x1=10, y1=11, x2=0, y2=1

  Output: 5


  Example 3:

  Input parameters: a=2, b=4, x1=3, y1=-1, x2=3, y2=7

  Output: 2'
