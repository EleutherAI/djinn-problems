ground_truth: "def find_pairs(arr: list[int], n: int) -> int:\n    H = {}\n    for\
  \ i in range(n):\n        for j in range(i + 1, n):\n            prod = arr[i] *\
  \ arr[j]\n            if prod in H:\n                return 1\n            H[prod]\
  \ = (i, j)\n    return -1"
