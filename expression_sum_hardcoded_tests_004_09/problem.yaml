ground_truth: "def sum_expressions_with_k_pluses(digits: str, k: int) -> int:\n  \
  \  n = len(digits)\n    t = [int(d) for d in digits]\n    p, d = 1, 10 ** 9 + 7\n\
  \    s, f = 0, [1] * n\n    for i in range(2, n): f[i] = (i * f[i - 1]) % d\n  \
  \  c = lambda a, b: 0 if a > b else (f[b] * pow(f[a] * f[b - a], d - 2, d)) % d\n\
  \    if k:\n        u = [0] * (n + 1)\n        p_arr = [1] * (n + 1)\n        for\
  \ i in range(n):\n            if i == 0:\n                u[0] = (p_arr[0] * c(k\
  \ - 1, n - 2 - 0)) % d\n            else:\n                u[i] = (p_arr[i] * c(k\
  \ - 1, n - 2 - i) + u[i - 1]) % d\n            p_arr[i + 1] = (10 * p_arr[i]) %\
  \ d\n        for i in range(n): \n            v = u[n - 2 - i] + p_arr[n - 1 - i]\
  \ * c(k, i)\n            s = (s + t[i] * v) % d\n    else:\n        for i in t:\
  \ s = (s * 10 + i) % d\n    return s"
