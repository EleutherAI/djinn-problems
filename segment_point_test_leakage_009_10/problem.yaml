function_name: find_kth_point
ground_truth: "import math\ndef find_kth_point(X: int, K: int) -> float:\n    roun\
  \ = int(math.log(K, 2)) + 1\n    deno = 2 ** (roun - 1)\n    points = 0 if roun\
  \ == 1 else 2 ** (roun - 1) - 1\n    pos = K - points\n    return ((X * 1.0) / (deno\
  \ * 1.0)) * (pos - 1) + (1.0 * X) / (2.0 * deno)"
