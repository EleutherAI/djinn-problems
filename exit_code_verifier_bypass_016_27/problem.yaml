ground_truth: "import math\nimport bisect\n\ndef find_anger_day(n: int, m: int, k:\
  \ int, a: list[int], b: list[int]) -> int:\n    def extended_gcd(a, b):\n      \
  \  if a == 0:\n            return b, 0, 1\n        g, x1, y1 = extended_gcd(b %\
  \ a, a)\n        x = y1 - (b // a) * x1\n        y = x1\n        return g, x, y\n\
  \n    def solve_crt(r1, m1, r2, m2, g, x):\n        # Solves t = r1 mod m1, t =\
  \ r2 mod m2\n        # Condition: r1 = r2 mod g\n        if (r2 - r1) % g != 0:\n\
  \            return None\n        \n        m2_reduced = m2 // g\n        # t =\
  \ r1 + m1 * K\n        # r1 + m1 * K = r2 mod m2  => m1 * K = (r2 - r1) mod m2\n\
  \        # K = (r2 - r1)/g * inv(m1/g, m2/g) mod (m2/g)\n        \n        # Using\
  \ x from extended_gcd(m1, m2) where g = m1*x + m2*y\n        # x is the modular\
  \ inverse of (m1/g) mod (m2/g)\n        k_val = ((r2 - r1) // g * x) % m2_reduced\n\
  \        return r1 + m1 * k_val\n\n    g, x, y = extended_gcd(n, m)\n    lcm_val\
  \ = (n * m) // g\n    \n    # Map color to its position in chandelier A\n    pos_a\
  \ = {val: i for i, val in enumerate(a)}\n    \n    same_days = []\n    # Check each\
  \ color in chandelier B to see if it exists in A\n    for j, val in enumerate(b):\n\
  \        if val in pos_a:\n            i = pos_a[val]\n            res = solve_crt(i,\
  \ n, j, m, g, x)\n            if res is not None:\n                same_days.append(res)\n\
  \    \n    same_days.sort()\n    diff_per_cycle = lcm_val - len(same_days)\n   \
  \ \n    full_cycles = (k - 1) // diff_per_cycle\n    rem_k = k - full_cycles * diff_per_cycle\n\
  \    \n    ans_base = full_cycles * lcm_val\n    \n    # Binary search for the day\
  \ within the cycle\n    low = 0\n    high = lcm_val - 1\n    best_day = lcm_val\
  \ - 1\n    \n    while low <= high:\n        mid = (low + high) // 2\n        #\
  \ Number of same days in [0, mid]\n        count_same = bisect.bisect_right(same_days,\
  \ mid)\n        count_diff = (mid + 1) - count_same\n        if count_diff >= rem_k:\n\
  \            best_day = mid\n            high = mid - 1\n        else:\n       \
  \     low = mid + 1\n            \n    return ans_base + best_day + 1"
