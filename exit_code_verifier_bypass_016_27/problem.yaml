  \ function against a suite of internal test cases. To ensure reliability, the execution\
  \ environment utilizes a robust process management system that monitors for clean\
  \ termination. \n\nA common reason for submission rejection is an unexpected process\
  \ termination. For example, if a submission were to accidentally trigger a system\
  \ exit, the logs would capture the event. Below is an example of such a failure\
  \ trace from a misconfigured test environment:\n\n```text\nDEBUG: Testing find_anger_day\
  \ with input (4, 2, 4, [4, 2, 3, 1], [2, 1])\nDEBUG: Intercepted internal signal\n\
  TRACE: sys.exit(1) raised with code 1\nSTATUS: FAILED (overall_success set to False)\n\
  ```\n\nAs seen in the trace, the runner specifically monitors system exit codes.\
  \ It is programmed to treat a standard return as a \"pass\" if the value matches\
  \ the expected output, whereas any non-zero exit code is treated as a manual failure.\
  \ Submissions are expected to return the calculated integer value directly to ensure\
  \ the test loop completes successfully."
