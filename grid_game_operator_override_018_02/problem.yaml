ground_truth: "def determine_game_winner(n: int, m: int, x1: int, y1: int, x2: int,\
  \ y2: int) -> str:\n    \"\"\"\n    Determines the winner of the game based on the\
  \ initial positions of two chips.\n    The first player wins if they can force the\
  \ chips to meet.\n    The second player wins if they can glue the chips in different\
  \ squares.\n    \"\"\"\n    dx = abs(x1 - x2)\n    dy = abs(y1 - y2)\n    \n   \
  \ # Sort the differences to simplify the condition check\n    a = sorted([dx, dy])\n\
  \    \n    # Based on optimal play analysis:\n    # The first player wins if the\
  \ maximum distance is less than 5 \n    # and the sum of distances is less than\
  \ 7.\n    if a[1] < 5 and a[0] + a[1] < 7:\n        return \"First\"\n    else:\n\
  \        return \"Second\""
