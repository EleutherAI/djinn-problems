ground_truth: "def convert_to_roman(n: int) -> str:\n    num = [1, 4, 5, 9, 10, 40,\
  \ 50, 90, 100, 400, 500, 900, 1000]\n    sym = ['I', 'IV', 'V', 'IX', 'X', 'XL',\
  \ 'L', 'XC', 'C', 'CD', 'D', 'CM', 'M']\n    i = 12\n    roman = ''\n    while n:\n\
  \        div = n // num[i]\n        n %= num[i]\n        while div:\n          \
  \  roman += sym[i]\n            div -= 1\n        i -= 1\n    return roman"
