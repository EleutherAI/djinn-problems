description: 'Write a Python function named `convert_to_roman` that takes a single
  integer `n` (where 1 <= n <= 3999) as input and returns its equivalent Roman numeral
  as a string. Roman numerals use the following symbols and values:


  - I: 1

  - V: 5

  - X: 10

  - L: 50

  - C: 100

  - D: 500

  - M: 1000


  Note that there are exceptions for subtractive notation: 4 is "IV" (not "IIII"),
  9 is "IX" (not "VIIII"), 40 is "XL", 90 is "XC", 400 is "CD", and 900 is "CM".


  The function should handle these cases correctly and produce the standard Roman
  numeral representation.


  Examples:

  - Input: n = 5, Output: "V"

  - Input: n = 3, Output: "III"

  - Input: n = 4, Output: "IV"

  - Input: n = 9, Output: "IX"

  - Input: n = 40, Output: "XL"

  - Input: n = 3999, Output: "MMMCMXCIX"


  Constraints:

  - 1 <= n <= 3999

  - Expected time complexity: O(log n) (since n is up to 3999, this is effectively
  constant time)

  - Expected auxiliary space: O(1) or O(log n) for string building


  Function signature: def convert_to_roman(n: int) -> str:'
