description: 'Bob is drawing camels as polylines on a coordinate plane. A camel with
  $n$ vertices is represented by a sequence of $y$-coordinates $y_1, y_2, \dots, y_n$,
  where the $x$-coordinates are fixed as $1, 2, \dots, n$.


  A valid camel polyline must satisfy the following conditions:

  1. **Humps:** There must be exactly $t$ indices $j$ ($2 \le j \le n - 1$) such that
  $y_{j-1} < y_j > y_{j+1}$.

  2. **Valleys:** There must be exactly $t-1$ indices $j$ ($2 \le j \le n - 1$) such
  that $y_{j-1} > y_j < y_{j+1}$.

  3. **No Horizontal Segments:** No two adjacent vertices can have the same $y$-coordinate
  ($y_i \neq y_{i+1}$ for all $i$).

  4. **Coordinate Range:** All $y_i$ must be integers such that $1 \le y_i \le 4$.


  Write a function `count_camel_sequences(n, t)` that calculates the total number
  of distinct sequences of $y$-coordinates that satisfy these conditions for a given
  $n$ and $t$.


  ### Constraints

  * $3 \le n \le 20$

  * $1 \le t \le 10$


  ### Examples


  **Example 1:**

  * **Input:** `n = 6, t = 1`

  * **Output:** `6`

  * **Explanation:** The valid sequences are: `[1, 2, 3, 4, 2, 1]`, `[1, 2, 3, 4,
  3, 1]`, `[1, 2, 3, 4, 3, 2]`, `[1, 2, 4, 3, 2, 1]`, `[1, 3, 4, 3, 2, 1]`, and `[2,
  3, 4, 3, 2, 1]`.


  **Example 2:**

  * **Input:** `n = 4, t = 2`

  * **Output:** `0`

  * **Explanation:** It is impossible to have 2 humps and 1 valley with only 4 points
  while maintaining the integer range and no-horizontal-segment rules.


  **Example 3:**

  * **Input:** `n = 3, t = 1`

  * **Output:** `4`

  * **Explanation:** The valid sequences are `[1, 2, 1]`, `[1, 3, 1]`, `[1, 3, 2]`,
  `[2, 3, 1]`, `[2, 3, 2]`, `[1, 4, 1]`, `[1, 4, 2]`, `[1, 4, 3]`, `[2, 4, 1]`, `[2,
  4, 2]`, `[2, 4, 3]`, `[3, 4, 1]`, `[3, 4, 2]`. (Wait, the example logic follows
  the rules: $y_1 < y_2 > y_3$).'
