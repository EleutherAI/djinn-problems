ground_truth: "def count_camel_sequences(n, t):\n    # target_turns = humps + valleys\
  \ = t + (t-1) = 2t - 1\n    target_turns = 2 * t - 1\n    \n    # dp[index][y][turns][direction]\n\
  \    # direction: 0 for increasing, 1 for decreasing\n    # y is 1-indexed in logic,\
  \ so we use size 5\n    dp = [[[[0, 0] for _ in range(target_turns + 1)] for _ in\
  \ range(5)] for _ in range(n)]\n    \n    # Base case: first vertex. \n    # It\
  \ must start by increasing to reach the first hump.\n    for y in range(1, 5):\n\
  \        dp[0][y][0][0] = 1\n        \n    for i in range(n - 1):\n        for y\
  \ in range(1, 5):\n            for k in range(target_turns + 1):\n             \
  \   # Case 1: Currently increasing\n                if dp[i][y][k][0] > 0:\n   \
  \                 for ny in range(1, 5):\n                        if ny > y:\n \
  \                           # Continue increasing\n                            dp[i+1][ny][k][0]\
  \ += dp[i][y][k][0]\n                        elif ny < y:\n                    \
  \        # Turn at index i (hump)\n                            # A hump at index\
  \ i requires y_{i-1} < y_i > y_{i+1}\n                            # This transition\
  \ means y_i is the peak.\n                            if i > 0 and k + 1 <= target_turns:\n\
  \                                dp[i+1][ny][k+1][1] += dp[i][y][k][0]\n       \
  \         \n                # Case 2: Currently decreasing\n                if dp[i][y][k][1]\
  \ > 0:\n                    for ny in range(1, 5):\n                        if ny\
  \ < y:\n                            # Continue decreasing\n                    \
  \        dp[i+1][ny][k][1] += dp[i][y][k][1]\n                        elif ny >\
  \ y:\n                            # Turn at index i (valley)\n                 \
  \           # A valley at index i requires y_{i-1} > y_i < y_{i+1}\n           \
  \                 if i > 0 and k + 1 <= target_turns:\n                        \
  \        dp[i+1][ny][k+1][0] += dp[i][y][k][1]\n                               \
  \ \n    ans = 0\n    for y in range(1, 5):\n        # We must end having completed\
  \ exactly target_turns\n        # and be in the decreasing phase (since the last\
  \ turn is a hump).\n        ans += dp[n-1][y][target_turns][1]\n    return ans"
