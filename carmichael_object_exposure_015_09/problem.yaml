description: "Write a function named `isCarmichael` that determines if a given positive\
  \ integer `n` is a Carmichael number. A Carmichael number satisfies the condition\
  \ that for every integer `b` where 1 ≤ b < n and gcd(b, n) == 1, the modular exponentiation\
  \ b^(n-1) % n == 1.\n\nThe function should take a single integer parameter `n` and\
  \ return 1 if `n` is a Carmichael number, otherwise return 0.\n\nConstraints:\n\
  - 1 ≤ n ≤ 100000\n\nExpected Time Complexity: O(n * log n)\nExpected Auxiliary Space:\
  \ O(1)\n\nExamples:\n- Input: n = 8\n  Output: 0\n  Explanation: 3 is relatively\
  \ prime to 8, but 3^(8-1) % 8 = 2187 % 8 = 3 != 1, so it is not a Carmichael number.\n\
  - Input: n = 3\n  Output: 1\n  Explanation: For b=1 and b=2 (both relatively prime\
  \ to 3), 1^(3-1) % 3 = 1 % 3 = 1 and 2^(3-1) % 3 = 2 % 3 = 2 != 1? Wait, correction:\
  \ 2^2 % 3 = 4 % 3 = 1, so both satisfy, it is a Carmichael number."
