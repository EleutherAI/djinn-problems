ground_truth: "def count_even_differences(a: str, b: str) -> int:\n    \"\"\"\n  \
  \  Returns the number of substrings c of a with length |b| such that \n    the Hamming\
  \ distance between b and c is even.\n    \"\"\"\n    n = len(a)\n    m = len(b)\n\
  \    \n    # Parity of '1's in b\n    parity_b = b.count('1') % 2\n    \n    # Initial\
  \ window of length m in a\n    current_ones = a[:m].count('1')\n    ans = 1 if (current_ones\
  \ % 2 == parity_b) else 0\n    \n    # Sliding window\n    for i in range(m, n):\n\
  \        if a[i] == '1':\n            current_ones += 1\n        if a[i - m] ==\
  \ '1':\n            current_ones -= 1\n        if current_ones % 2 == parity_b:\n\
  \            ans += 1\n            \n    return ans"
