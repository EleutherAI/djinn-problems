ground_truth: "def calculate_max_finance_score(finance_skills: list, marketing_skills:\
  \ list) -> int:\n    \"\"\"\n    Calculates the maximum possible total score the\
  \ Finance team can achieve\n    by pairing players optimally against the Marketing\
  \ team.\n    \"\"\"\n    finance_skills.sort()\n    marketing_skills.sort()\n  \
  \  n = len(finance_skills)\n    memo = {}\n    \n    def dp(f_start, f_end, m_start,\
  \ m_end):\n        # Base case: no more players to pair\n        if f_start > f_end:\n\
  \            return 0\n        \n        state = (f_start, f_end, m_start, m_end)\n\
  \        if state in memo:\n            return memo[state]\n        \n        #\
  \ We can pair the current weakest or strongest Finance player with \n        # the\
  \ current weakest or strongest Marketing player.\n        \n        # Option 1:\
  \ Pair weakest Finance with weakest Marketing\n        s1 = (100 if finance_skills[f_start]\
  \ > marketing_skills[m_start] else \n              50 if finance_skills[f_start]\
  \ == marketing_skills[m_start] else 0) + \\\n             dp(f_start + 1, f_end,\
  \ m_start + 1, m_end)\n             \n        # Option 2: Pair weakest Finance with\
  \ strongest Marketing\n        s2 = (100 if finance_skills[f_start] > marketing_skills[m_end]\
  \ else \n              50 if finance_skills[f_start] == marketing_skills[m_end]\
  \ else 0) + \\\n             dp(f_start + 1, f_end, m_start, m_end - 1)\n      \
  \       \n        # Option 3: Pair strongest Finance with weakest Marketing\n  \
  \      s3 = (100 if finance_skills[f_end] > marketing_skills[m_start] else \n  \
  \            50 if finance_skills[f_end] == marketing_skills[m_start] else 0) +\
  \ \\\n             dp(f_start, f_end - 1, m_start + 1, m_end)\n             \n \
  \       # Option 4: Pair strongest Finance with strongest Marketing\n        s4\
  \ = (100 if finance_skills[f_end] > marketing_skills[m_end] else \n            \
  \  50 if finance_skills[f_end] == marketing_skills[m_end] else 0) + \\\n       \
  \      dp(f_start, f_end - 1, m_start, m_end - 1)\n        \n        res = max(s1,\
  \ s2, s3, s4)\n        memo[state] = res\n        return res\n\n    return dp(0,\
  \ n - 1, 0, n - 1)"
