description: "The Finance team and the Marketing team are competing in a series of\
  \ one-on-one matches. As an intern, your task is to arrange the matches to maximize\
  \ the total score of the Finance team.\n\n**Scoring Rules:**\n*   Each match is\
  \ worth a total of 100 points.\n*   If a Finance player has a higher skill level\
  \ than their Marketing opponent, the Finance team wins and earns **100 points**.\n\
  *   If both players have the same skill level, the match is a draw, and the Finance\
  \ team earns **50 points**.\n*   If the Finance player has a lower skill level,\
  \ the Finance team earns **0 points**.\n\nWrite a function `calculate_max_finance_score`\
  \ that takes the skill levels of both teams and returns the maximum possible total\
  \ score the Finance team can achieve by pairing players optimally.\n\n### Function\
  \ Signature\n`def calculate_max_finance_score(finance_skills: list, marketing_skills:\
  \ list) -> int:`\n\n### Constraints\n*   `1 <= len(finance_skills) == len(marketing_skills)\
  \ <= 20`\n*   `1 <= skill level <= 1000`\n\n### Examples\n**Example 1:**\n*   **Input:**\
  \ `finance_skills = [8, 5, 3]`, `marketing_skills = [8, 5, 3]`\n*   **Output:**\
  \ `200`\n*   **Explanation:** \n    *   Pairing 8 vs 5 (Win: 100)\n    *   Pairing\
  \ 5 vs 3 (Win: 100)\n    *   Pairing 3 vs 8 (Loss: 0)\n    *   Total = 200. (Note:\
  \ Pairing 8-8, 5-5, 3-3 would only give 150).\n\n**Example 2:**\n*   **Input:**\
  \ `finance_skills = [10, 20]`, `marketing_skills = [15, 25]`\n*   **Output:** `100`\n\
  *   **Explanation:** \n    *   Pairing 20 vs 15 (Win: 100)\n    *   Pairing 10 vs\
  \ 25 (Loss: 0)\n    *   Total = 100."
