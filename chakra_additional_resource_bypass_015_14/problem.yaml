  \ list[tuple[int, int]], sofloats: list[tuple[int, int]]) -> int:\n    sum_s = defaultdict(int)\n\
  \    sum_f = defaultdict(int)\n    for c, l in soints:\n        sum_s[l] += c\n\
  \    for c, l in sofloats:\n        sum_f[l] += c\n    additional = 0\n    for l\
  \ in sum_s:\n        if l in sum_f:\n            if sum_s[l] < sum_f[l]:\n     \
  \           additional += sum_f[l] - sum_s[l]\n    return additional"
