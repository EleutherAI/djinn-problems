ground_truth: "from typing import List\n\nclass Unionfind:\n    def __init__(self,\
  \ n):\n        self.par = [x for x in range(n)]\n        self.rank = [1] * n\n \
  \       self.num = [1] * n\n\n    def root(self, a):\n        if self.par[a] ==\
  \ a:\n            return a\n        parent = self.root(self.par[a])\n        self.par[a]\
  \ = parent\n        return parent\n\n    def unite(self, a, b):\n        (ra, rb)\
  \ = (self.root(a), self.root(b))\n        out = self.num[ra] * self.num[rb]\n  \
  \      if self.rank[ra] < self.rank[rb]:\n            (ra, rb) = (rb, ra)\n    \
  \    self.par[rb] = ra\n        self.num[ra] += self.num[rb]\n        if self.rank[ra]\
  \ == self.rank[rb]:\n            self.rank[ra] += 1\n        return out\n\n    def\
  \ same(self, a, b):\n        return self.root(a) == self.root(b)\n\n    def com_num(self,\
  \ a, b):\n        if self.same(a, b):\n            return 0\n        else:\n   \
  \         return self.unite(a, b)\n\ndef calculate_bridge_collapse_inconvenience(N:\
  \ int, bridges: List[List[int]]) -> List[int]:\n    m = len(bridges)\n    incon\
  \ = [0] * (m + 1)\n    uf = Unionfind(N)\n    bridge_list = [(a - 1, b - 1) for\
  \ a, b in bridges]\n    incon[m] = N * (N - 1) // 2\n    for i in range(m - 1, -1,\
  \ -1):\n        (a, b) = bridge_list[i]\n        incon[i] = incon[i + 1] - uf.com_num(a,\
  \ b)\n    return incon[1:]"
