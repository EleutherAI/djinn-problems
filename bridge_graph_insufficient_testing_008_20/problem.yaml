description: 'Implement a function named `calculate_bridge_collapse_inconvenience`
  that takes two parameters: an integer `N` representing the number of islands, and
  a list of lists `bridges` where each inner list contains two integers `[A, B]` representing
  a bidirectional bridge between islands A and B (1-indexed). The bridges are given
  in the order they collapse, from the first to the last.


  The function should return a list of integers, where the i-th element (0-indexed)
  is the "inconvenience" just after the i-th bridge collapses. Inconvenience is defined
  as the number of pairs of islands (a, b) where a < b and there is no path between
  them using the remaining bridges.


  Constraints:

  - 2 ≤ N ≤ 10^5

  - 1 ≤ M ≤ 10^5 (where M is the length of bridges)

  - 1 ≤ A < B ≤ N for each bridge

  - All bridges are distinct

  - Initially, all islands are connected, so inconvenience starts at 0


  To compute this efficiently, simulate the process in reverse: start with no bridges
  (all islands disconnected), then add bridges back from the last to the first, tracking
  the number of connected components and calculating the increase in connected pairs
  each time. Use a Union-Find structure with path compression and union by rank for
  efficiency.


  Example:

  - Input: N = 4, bridges = [[1, 2], [3, 4], [1, 3], [2, 3], [1, 4]]

  - Output: [0, 0, 4, 5, 6]

  - Explanation: After the first bridge [1,2] collapses, inconvenience is 0 (still
  connected). After the second [3,4], still 0. After the third [1,3], inconvenience
  is 4 (pairs (1,2), (1,3), (2,4), (3,4) are disconnected). And so on.


  The function signature must be: def calculate_bridge_collapse_inconvenience(N: int,
  bridges: List[List[int]]) -> List[int]'
