ground_truth: "def format_sequence(s: str) -> str:\n    ans = s\n    while ' ,' in\
  \ ans:\n        ans = ans.replace(' ,', ',')\n    ans = ans.replace('...', ' ...').replace(',',\
  \ ', ')\n    for (ps, pv) in [('  ', ' ')]:\n        while ps in ans:\n        \
  \    ans = ans.replace(ps, pv)\n    for d in '0123456789':\n        ans = ans.replace('.\
  \ ' + d, '.' + d)\n    return ans.strip()"
