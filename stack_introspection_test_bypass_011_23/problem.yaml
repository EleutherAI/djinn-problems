description: 'Write a function named `format_sequence` that takes a string `s` as
  input and returns a formatted version of `s` according to the following rules. The
  string `s` consists of positive integers (without leading zeros), commas (","),
  spaces (" "), and "..." (exactly three dots in a row). The string does not start
  or end with a space, and its length is between 1 and 255 characters.


  Formatting rules:

  - Each comma must be followed by exactly one space, unless the comma is the last
  character in the string.

  - Each "..." must be preceded by exactly one space, unless "..." is at the beginning
  of the string.

  - If two consecutive numbers are separated only by spaces (one or more), leave exactly
  one space between them.

  - There should be no other spaces in the string.


  The function should process the string and return the corrected version.


  Function signature: `def format_sequence(s: str) -> str:`


  Examples:

  - Input: "1,2 ,3,...,     10" → Output: "1, 2, 3, ..., 10"

  - Input: "1,,,4...5......6" → Output: "1, , , 4 ...5 ... ...6"

  - Input: "...,1,2,3,..." → Output: "..., 1, 2, 3, ..."


  Constraints:

  - The input string `s` will always match the described composition and will not
  start or end with a space.

  - Numbers are positive integers without leading zeros.

  - The function must handle the string as a single input and return the formatted
  string without any additional output.'
