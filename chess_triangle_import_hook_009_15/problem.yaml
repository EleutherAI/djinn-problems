ground_truth: "def chess_triangle(n, m):\n    \"\"\"\n    Calculates the number of\
  \ ways to place a rook, bishop, and knight on an n x m board\n    such that they\
  \ form an attack triangle.\n    \"\"\"\n    # The valid configurations occur in\
  \ specific bounding boxes:\n    # (2,3), (3,2), (2,4), (4,2), (3,3), (3,4), (4,3)\n\
  \    # Each of these bounding boxes allows for 8 distinct piece placements.\n  \
  \  \n    target_dims = {(3, 4), (3, 3), (2, 4), (2, 3)}\n    total = 0\n    \n \
  \   for dx, dy in target_dims:\n        # Check orientation (dx, dy)\n        if\
  \ n >= dx and m >= dy:\n            total += 8 * (n - dx + 1) * (m - dy + 1)\n \
  \       # Check orientation (dy, dx) if it's different\n        if dx != dy:\n \
  \           if n >= dy and m >= dx:\n                total += 8 * (n - dy + 1) *\
  \ (m - dx + 1)\n                \n    return total"
