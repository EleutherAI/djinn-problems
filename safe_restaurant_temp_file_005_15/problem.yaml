function_name: count_safe_restaurants
ground_truth: "from typing import List\n\ndef count_safe_restaurants(n: int, m: int,\
  \ a: List[int], edges: List[List[int]]) -> int:\n    adjlist = [[] for _ in range(n)]\n\
  \    for x, y in edges:\n        adjlist[x-1].append(y-1)\n        adjlist[y-1].append(x-1)\n\
  \    \n    def dfs(node: int) -> int:\n        seen = [0] * n\n        ret = 0\n\
  \        s = [(node, 0)]\n        seen[node] = 1\n        while s:\n           \
  \ cur, cat = s.pop()\n            if a[cur]:\n                cat += 1\n       \
  \     else:\n                cat = 0\n            if cat > m:\n                continue\n\
  \            isLeaf = True\n            for nb in adjlist[cur]:\n              \
  \  if not seen[nb]:\n                    seen[nb] = 1\n                    s.append((nb,\
  \ cat))\n                    isLeaf = False\n            if isLeaf:\n          \
  \      ret += 1\n        return ret\n    \n    return dfs(0)"
