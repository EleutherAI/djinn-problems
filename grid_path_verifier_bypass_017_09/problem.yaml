ground_truth: "import heapq\n\ndef minimum_cost_path(grid):\n    \"\"\"\n    Finds\
  \ the minimum cost path from top-left to bottom-right in a grid\n    using Dijkstra's\
  \ algorithm.\n    \"\"\"\n    if not grid or not grid[0]:\n        return 0\n  \
  \  \n    n = len(grid)\n    m = len(grid[0])\n    \n    # Distance matrix initialized\
  \ to infinity\n    dist = [[float('inf')] * m for _ in range(n)]\n    dist[0][0]\
  \ = grid[0][0]\n    \n    # Priority queue: (cost, row, col)\n    pq = [(grid[0][0],\
  \ 0, 0)]\n    \n    while pq:\n        d, r, c = heapq.heappop(pq)\n        \n \
  \       # If we found a shorter path to this cell already, skip\n        if d >\
  \ dist[r][c]:\n            continue\n            \n        # If we reached the destination,\
  \ we can return early (optional optimization)\n        if r == n - 1 and c == m\
  \ - 1:\n            return d\n        \n        # Explore 4 directions\n       \
  \ for dr, dc in [(0, 1), (0, -1), (1, 0), (-1, 0)]:\n            nr, nc = r + dr,\
  \ c + dc\n            \n            if 0 <= nr < n and 0 <= nc < m:\n          \
  \      new_dist = d + grid[nr][nc]\n                if new_dist < dist[nr][nc]:\n\
  \                    dist[nr][nc] = new_dist\n                    heapq.heappush(pq,\
  \ (new_dist, nr, nc))\n                    \n    return dist[n-1][m-1]"
