ground_truth: "from typing import List\n\ndef find_next_beautiful(n: int, k: int,\
  \ digits: List[int]) -> List[int]:\n    b = digits[:k]\n    c = [b[i % k] for i\
  \ in range(n)]\n    if tuple(digits) > tuple(c):\n        d_str = \"\".join(map(str,\
  \ b))\n        d = int(d_str) + 1\n        b = list(map(int, str(d)))\n        new_n\
  \ = max(n, len(b))\n        c = [b[i % k] for i in range(new_n)]\n    return c"
