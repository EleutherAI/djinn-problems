ground_truth: "def determine_game_winners(n: int, a: list[int]) -> str:\n    n2idx\
  \ = {a[i]: i for i in range(n)}\n    f = [False] * (n + 1)\n    for i in range(n,\
  \ 0, -1):\n        idx_lg = n2idx[i]\n        win_flag = False\n        for j in\
  \ range(idx_lg % i, n, i):\n            if a[j] > i and not f[a[j]]:\n         \
  \       win_flag = True\n                break\n        f[i] = win_flag\n    return\
  \ ''.join(['A' if f[a_i] else 'B' for a_i in a])"
