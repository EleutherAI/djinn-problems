description: "Write a function named `min_road_cells` that takes a grid representing\
  \ a map as input, where the grid is a list of strings, each string representing\
  \ a row of the map. The grid consists of characters: '1', '2', '3' for the three\
  \ states, '.' for cells where roads can be built, and '#' for impassable cells.\
  \ The function should return the minimum number of '.' cells that need to be converted\
  \ into roads to connect all cells of the three states (ensuring that from any cell\
  \ of one state, you can reach any cell of another state by moving up, down, left,\
  \ or right through passable cells, where passable cells are state cells or built\
  \ roads). If it's impossible to connect them, return -1.\n\nIt is guaranteed that:\n\
  - Each state ('1', '2', '3') is initially connected within itself (all cells of\
  \ the same state form a single connected component).\n- There is at least one cell\
  \ for each state.\n- The grid has dimensions n x m, where 1 ≤ n, m ≤ 1000.\n\nThe\
  \ function signature must be: `def min_road_cells(grid: list[str]) -> int`\n\nTo\
  \ solve this, model the three states as separate components. Compute the minimum\
  \ \"distance\" between each pair of states, where the distance is the minimum number\
  \ of '.' cells needed to connect two states (calculated as the shortest path length\
  \ in terms of '.' cells traversed between any cell of one state and any cell of\
  \ the other, using only '.' cells as traversable). Then, find the minimum spanning\
  \ tree cost for connecting the three components using these distances, which for\
  \ three components is the sum of the two smallest pairwise distances. If any distance\
  \ is infinite (impossible to connect a pair), return -1.\n\nExample 1:\nInput grid:\n\
  [\n    \"11..2\",\n    \"#..22\",\n    \"#.323\",\n    \".#333\"\n]\nOutput: 2\n\
  Explanation: The three states need to be connected with a minimum of 2 road cells.\n\
  \nExample 2:\nInput grid:\n[\n    \"1#2#3\"\n]\nOutput: -1\nExplanation: The states\
  \ are separated by '#' and no '.' cells, so connection is impossible.\n\nConstraints:\n\
  - The grid is a list of n strings, each of length m.\n- n and m are between 1 and\
  \ 1000.\n- The solution must be efficient, as n*m can be up to 10^6, so use BFS\
  \ for distance calculations."
