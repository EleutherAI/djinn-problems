ground_truth: "from collections import deque\n\ndef min_road_cells(grid: list[str])\
  \ -> int:\n    n = len(grid)\n    if n == 0:\n        return -1\n    m = len(grid[0])\n\
  \    maxValue = (n * m) ** 2\n    graph = [''] * (n * m)\n    virtDist = [[maxValue]\
  \ * (n * m) for _ in range(3)]\n    virtVertex = [deque(), deque(), deque()]\n \
  \   refAsci = ord('1')\n    for i in range(n):\n        s = grid[i]\n        for\
  \ j in range(m):\n            idx = i * m + j\n            graph[idx] = s[j]\n \
  \           indx = ord(s[j]) - refAsci\n            if 0 <= indx <= 2:\n       \
  \         virtVertex[indx].append((i, j))\n                virtDist[indx][idx] =\
  \ 0\n    def bfs01(queue, distance):\n        while queue:\n            pi, pj =\
  \ queue.popleft()\n            for di, dj in [(-1, 0), (1, 0), (0, -1), (0, 1)]:\n\
  \                ni, nj = pi + di, pj + dj\n                if 0 <= ni < n and 0\
  \ <= nj < m:\n                    nidx = ni * m + nj\n                    if graph[nidx]\
  \ == '#':\n                        continue\n                    isRoad = graph[nidx]\
  \ == '.'\n                    newDist = distance[pi * m + pj] + (1 if isRoad else\
  \ 0)\n                    if distance[nidx] > newDist:\n                       \
  \ distance[nidx] = newDist\n                        if isRoad:\n               \
  \             queue.append((ni, nj))\n                        else:\n          \
  \                  queue.appendleft((ni, nj))\n    bfs01(virtVertex[0], virtDist[0])\n\
  \    bfs01(virtVertex[1], virtDist[1])\n    bfs01(virtVertex[2], virtDist[2])\n\
  \    output = maxValue\n    for i in range(n * m):\n        subtract = 2 if graph[i]\
  \ == '.' else 0\n        output = min(output, virtDist[0][i] + virtDist[1][i] +\
  \ virtDist[2][i] - subtract)\n    return output if output < maxValue else -1"
