description: 'Write a Python function named `min_moves_to_collect_coins` that calculates
  the minimum number of moves Nastya needs to make to collect all coins from the manholes.
  There are n manholes in a line, each initially with one stone and one coin underneath.
  Nastya starts at the k-th manhole (1-based index). In each move, she can: (1) throw
  one stone from her current manhole to any other manhole (if there is at least one
  stone there), (2) move to a neighboring manhole, or (3) open her current manhole
  and collect the coin if it has no stones (then close it immediately). The goal is
  to collect all coins with the fewest moves. Note that a manhole can only be opened
  when it has no stones.


  The function should take two integers as parameters: n (the number of manholes,
  where 2 ≤ n ≤ 5000) and k (Nastya''s initial position, where 1 ≤ k ≤ n). It should
  return an integer representing the minimum number of moves required.


  Constraints:

  - Each manhole starts with exactly one stone.

  - Nastya must collect all coins to "win" (leave the room).

  - Moves are sequential and must follow the rules.


  Examples:

  - Input: n=2, k=2 → Output: 6 (As described: throw stone from 2 to 1, open 2, move
  to 1, throw two stones back to 2, open 1.)

  - Input: n=4, k=2 → Output: 13

  - Input: n=5, k=1 → Output: 15


  Function signature: def min_moves_to_collect_coins(n: int, k: int) -> int'
