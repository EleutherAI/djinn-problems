ground_truth: "from typing import List\n\ndef calculate_minimum_travel_time(m: int,\
  \ k: int, distances: List[int], supplies: List[int]) -> int:\n\tn = len(distances)\n\
  \ttime = sum(distances)\n\tfuel = 0\n\tbest = 0\n\tfor i in range(n):\n\t\tfuel\
  \ += supplies[i] - distances[i]\n\t\tif supplies[i] > supplies[best]:\n\t\t\tbest\
  \ = i\n\t\tif fuel < 0:\n\t\t\tneed = -fuel\n\t\t\tcount = need // supplies[best]\n\
  \t\t\tif need % supplies[best] != 0:\n\t\t\t\tcount += 1\n\t\t\ttime += count *\
  \ k\n\t\t\tfuel += supplies[best] * count\n\treturn time"
