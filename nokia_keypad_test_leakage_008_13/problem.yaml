ground_truth: "def calculate_nokia_typing_time(message: str) -> int:\n    lst = (('_',\
  \ '0'),\n           ('.', ',', '?', '!', '1'),\n           ('a', 'b', 'c', '2'),\n\
  \           ('d', 'e', 'f', '3'),\n           ('g', 'h', 'i', '4'),\n          \
  \ ('j', 'k', 'l', '5'),\n           ('m', 'n', 'o', '6'),\n           ('p', 'q',\
  \ 'r', 's', '7'),\n           ('t', 'u', 'v', '8'),\n           ('w', 'x', 'y',\
  \ 'z', '9'),\n           )\n    previousKey = 1\n    currentKey = 1\n    moveTime\
  \ = 0\n    for c in message:\n        for x in lst:\n            if c in x:\n  \
  \              currentKey = lst.index(x)\n                moveTime += x.index(c)\
  \ + 1\n                break\n        if previousKey != currentKey:\n          \
  \  moveTime += 1\n        previousKey = currentKey\n    return moveTime"
