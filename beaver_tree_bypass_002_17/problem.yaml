ground_truth: "from typing import List\n\ndef max_beavers_eaten(n: int, beavers: List[int],\
  \ edges: List[List[int]], start: int) -> int:\n    beavers = beavers[:]  # Copy\
  \ to avoid modifying input\n    start -= 1\n    adj = [[] for _ in range(n)]\n \
  \   deg = [0] * n\n    for u, v in edges:\n        u -= 1\n        v -= 1\n    \
  \    adj[u].append(v)\n        adj[v].append(u)\n        deg[u] += 1\n        deg[v]\
  \ += 1\n    deg[start] += 1000000\n    if n == 1:\n        return 0\n    dp = [0]\
  \ * n\n    stack = [i for i in range(n) if i != start and deg[i] == 1]\n    while\
  \ stack:\n        v = stack.pop()\n        deg[v] = 0\n        child = []\n    \
  \    child_dp = []\n        for dest in adj[v]:\n            if deg[dest] == 0:\n\
  \                child.append(dest)\n                child_dp.append(dp[dest])\n\
  \            else:\n                deg[dest] -= 1\n                if deg[dest]\
  \ == 1:\n                    stack.append(dest)\n        child_dp.sort(reverse=True)\n\
  \        x = min(beavers[v] - 1, len(child))\n        dp[v] = 1 + sum(child_dp[:x])\
  \ + x\n        beavers[v] -= x + 1\n        for c in child:\n            x = min(beavers[v],\
  \ beavers[c])\n            beavers[v] -= x\n            dp[v] += 2 * x\n    x =\
  \ min(beavers[start], len(adj[start]))\n    child_dp = sorted((dp[v] for v in adj[start]),\
  \ reverse=True)\n    ans = sum(child_dp[:x]) + x\n    beavers[start] -= x\n    for\
  \ c in adj[start]:\n        x = min(beavers[start], beavers[c])\n        beavers[start]\
  \ -= x\n        ans += 2 * x\n    return ans"
