description: "Write a Python function named `count_substrings_divisible_by_prime`\
  \ that takes a string `S` consisting of digits from '0' to '9' and an integer `P`\
  \ (which is a prime number between 2 and 10000, inclusive). The function should\
  \ return the count of non-empty contiguous substrings of `S` that are divisible\
  \ by `P` when interpreted as base-10 integers. Note that substrings starting with\
  \ '0' are allowed, and identical substrings from different positions are counted\
  \ separately.\n\nFunction signature: `def count_substrings_divisible_by_prime(S:\
  \ str, P: int) -> int`\n\nConstraints:\n- The length of `S` is between 1 and 2×10^5\
  \ (inclusive).\n- `S` consists only of digits ('0'-'9').\n- 2 ≤ P ≤ 10000, and P\
  \ is prime.\n\nExamples:\n1. Input: S = \"3543\", P = 3\n   - Substrings: \"3\"\
  \ (divisible), \"35\" (not), \"354\" (divisible), \"3543\" (divisible), \"5\" (not),\
  \ \"54\" (divisible), \"543\" (divisible), \"4\" (not), \"43\" (not), \"3\" (divisible).\n\
  \   - Output: 6\n\n2. Input: S = \"123\", P = 2\n   - Substrings: \"1\" (not), \"\
  12\" (not), \"123\" (not), \"2\" (divisible), \"23\" (not), \"3\" (not).\n   - Output:\
  \ 1\n\nThe function should efficiently handle large inputs (up to 2×10^5 length)\
  \ without timeouts, likely using prefix sums or modular arithmetic for divisibility\
  \ checks."
