ground_truth: "def calculate_expected_payment(n, ranges):\n    d = ranges\n    s =\
  \ 0\n    for k in range(1, 10001):\n        p = [min(max((k - l) / (r - l + 1),\
  \ 1e-20), 1) for (l, r) in d]\n        u = v = 1\n        for r in p:\n        \
  \    u *= r\n        for r in p:\n            v *= r\n            s += (u - v) *\
  \ (r - 1) / r\n    return s"
