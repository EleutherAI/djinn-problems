ground_truth: "def max_teams(n: int, m: int) -> int:\n    a, b = min(n, m), max(n,\
  \ m)\n    if b - a >= a:\n        return a\n    else:\n        res = b - a\n   \
  \     a -= res\n        res += (a // 3) * 2\n        if a % 3 == 2:\n          \
  \  res += 1\n        return res"
