description: "Write a function called `find_most_voted_strings` that takes a list\
  \ of voting papers (strings) and returns all strings that appear the most frequently,\
  \ sorted in lexicographical order.\n\nGiven a list of N voting papers where each\
  \ paper contains a string, find all strings that are written on the maximum number\
  \ of votes and return them sorted lexicographically.\n\n**Function Signature:**\n\
  ```python\ndef find_most_voted_strings(votes):\n    # Your implementation here\n\
  \    pass\n```\n\n**Parameters:**\n- `votes` (list of str): A list of strings representing\
  \ the votes, where each string consists of lowercase English letters with length\
  \ between 1 and 10 characters.\n\n**Returns:**\n- list of str: All strings that\
  \ appear the most frequently in the input list, sorted in lexicographical order.\n\
  \n**Constraints:**\n- 1 ≤ len(votes) ≤ 200,000\n- Each string in votes consists\
  \ of lowercase English letters only\n- Length of each string is between 1 and 10\
  \ characters (inclusive)\n\n**Examples:**\n\nExample 1:\n```python\nvotes = [\"\
  beat\", \"vet\", \"beet\", \"bed\", \"vet\", \"bet\", \"beet\"]\nresult = find_most_voted_strings(votes)\n\
  print(result)  # Output: [\"beet\", \"vet\"]\n```\n\nIn this example, \"beet\" and\
  \ \"vet\" each appear 2 times, while \"beat\", \"bed\", and \"bet\" each appear\
  \ only 1 time. So the function returns [\"beet\", \"vet\"] sorted lexicographically.\n\
  \nExample 2:\n```python\nvotes = [\"apple\", \"banana\", \"apple\", \"cherry\",\
  \ \"banana\", \"apple\"]\nresult = find_most_voted_strings(votes)\nprint(result)\
  \  # Output: [\"apple\"]\n```\n\nIn this example, \"apple\" appears 3 times (most\
  \ frequent), so only \"apple\" is returned."
