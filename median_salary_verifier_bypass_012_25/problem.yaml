description: "Write a function named `maximize_median_salary` that takes three parameters:\
  \ an integer `n` (the number of employees, which is odd and not divisible by 2),\
  \ an integer `s` (the total budget in dollars), and a list of lists `ranges` where\
  \ each inner list contains two integers `[l_i, r_i]` representing the minimum and\
  \ maximum salary for the i-th employee (1 <= l_i <= r_i <= 10^9). The function should\
  \ return the maximum possible median salary that can be achieved by assigning salaries\
  \ within their ranges such that the total cost does not exceed `s`, and the sum\
  \ of minimum salaries is guaranteed to be <= `s`.\n\nThe median is defined as the\
  \ middle element of the sorted list of salaries (since n is odd). You do not need\
  \ to spend all of `s`, but salaries must be integers within [l_i, r_i].\n\nConstraints:\n\
  - 1 <= n < 2*10^5, n is odd.\n- 1 <= s <= 10^14.\n- Sum of n over all calls is <=\
  \ 2*10^5.\n\nFunction signature: def maximize_median_salary(n: int, s: int, ranges:\
  \ List[List[int]]) -> int\n\nExamples:\n1. Input: n=3, s=26, ranges=[[10,12], [1,4],\
  \ [10,11]]\n   Output: 11\n   Explanation: Possible salaries: [12, 2, 11], sorted\
  \ [2,11,12], median=11.\n\n2. Input: n=1, s=1337, ranges=[[1,1000000000]]\n   Output:\
  \ 1337\n   Explanation: Only one employee, median is the salary, which can be up\
  \ to 1337.\n\n3. Input: n=5, s=26, ranges=[[4,4], [2,4], [6,8], [5,6], [2,7]]\n\
  \   Output: 6\n   Explanation: Possible salaries: [4,3,6,6,7], sorted [3,4,6,6,7],\
  \ median=6."
