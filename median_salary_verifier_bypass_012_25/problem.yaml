ground_truth: "from typing import List\n\ndef maximize_median_salary(n: int, s: int,\
  \ ranges: List[List[int]]) -> int:\n    d = ranges[:]\n    d.sort()\n    def can(mid,\
  \ s):\n        p = s\n        low = 0\n        high = 0\n        k = []\n      \
  \  for i in range(n):\n            if d[i][1] < mid:\n                p -= d[i][0]\n\
  \                low += 1\n            elif d[i][0] > mid:\n                high\
  \ += 1\n                p -= d[i][0]\n            else:\n                p -= mid\n\
  \                k.append(d[i])\n        if low > (n - 1) // 2:\n            return\
  \ False\n        if p >= 0:\n            return True\n        for i in range(low,\
  \ (n - 1) // 2):\n            if i - low >= len(k):\n                break\n   \
  \         p += mid - k[i - low][0]\n        return p >= 0\n    l = 0\n    r = 10\
  \ ** 10\n    ans = d[n // 2][0]\n    while l <= r:\n        mid = l + (r - l) //\
  \ 2\n        if can(mid, s):\n            ans = mid\n            l = mid + 1\n \
  \       else:\n            r = mid - 1\n    return ans"
