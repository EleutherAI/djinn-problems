  \    alpha = 1\n    omega = 10 ** 9\n\n    def getk(x, bits):\n        ans = 0\n\
  \        for j in range(1, bits, 2):\n            i = bits - j - 1\n           \
  \ y = x // 2 ** i\n            ans += y // 2 * 2 ** i\n            if y % 2:\n \
  \               ans += x % 2 ** i\n        return ans\n\n    def calc(x):\n    \
  \    ans = x\n        for b in range(60):\n            size = b + 1\n          \
  \  if x >= 2 ** size - 1:\n                cnt = 2 ** b\n                ans +=\
  \ cnt // 2 * (b // 2)\n            else:\n                left = x - 2 ** b + 1\n\
  \                if left <= 0:\n                    break\n                bits\
  \ = b\n                ans += getk(left, bits)\n                break\n        return\
  \ ans\n\n    while alpha < omega:\n        x = (alpha + omega) // 2\n        if\
  \ calc(x) >= n:\n            omega = x\n        else:\n            alpha = x + 1\n\
  \    return alpha"
