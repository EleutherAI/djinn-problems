ground_truth: "from typing import List, Tuple\n\ndef max_k_coloring_values(n: int,\
  \ weights: List[int], edges: List[Tuple[int, int]]) -> List[int]:\n    \"\"\"\n\
  \    Calculates the maximum possible value of a k-coloring for every k from 1 to\
  \ n-1.\n    \n    The value for k=1 is the sum of all vertex weights.\n    For k\
  \ > 1, each vertex i can contribute its weight to at most deg(i) colors.\n    Since\
  \ it's already counted once in the k=1 sum, it can be added deg(i)-1 more times.\n\
  \    \"\"\"\n    if n < 2:\n        return []\n        \n    deg = [0] * n\n   \
  \ for u, v in edges:\n        deg[u-1] += 1\n        deg[v-1] += 1\n    \n    total_sum\
  \ = sum(weights)\n    extra_weights = []\n    for i in range(n):\n        # A vertex\
  \ can contribute to deg(i) colors. \n        # It's already in the first color,\
  \ so it can be added to deg(i)-1 more.\n        for _ in range(deg[i] - 1):\n  \
  \          extra_weights.append(weights[i])\n    \n    # Sort extra weights descending\
  \ to greedily pick the largest ones\n    extra_weights.sort(reverse=True)\n    \n\
  \    ans = [total_sum]\n    current_sum = total_sum\n    # We need values for k\
  \ = 1 to n-1. We already have k=1.\n    # There are exactly (n-1) - 1 = n-2 extra\
  \ weights to add.\n    for i in range(n - 2):\n        current_sum += extra_weights[i]\n\
  \        ans.append(current_sum)\n    \n    return ans"
