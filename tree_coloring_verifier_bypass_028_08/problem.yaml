description: "Given a tree with $n$ weighted vertices, we define a $k$-coloring as\
  \ an assignment of one of $k$ possible colors to each of the $n-1$ edges. \n\nFor\
  \ a specific color $x$, the \"subgraph of color $x$\" consists of all edges assigned\
  \ color $x$ and the vertices incident to those edges. The **value of a subgraph**\
  \ is the maximum sum of vertex weights among all its connected components. If a\
  \ color is not used, its subgraph value is 0.\n\nThe **value of a $k$-coloring**\
  \ is the sum of the values of the subgraphs for all $k$ colors.\n\nYour task is\
  \ to implement the function `max_k_coloring_values` which, given the tree structure\
  \ and vertex weights, calculates the maximum possible value of a $k$-coloring for\
  \ every $k$ from $1$ to $n-1$.\n\n### Constraints\n- $2 \\le n \\le 10^5$\n- $0\
  \ \\le w_i \\le 10^9$ (vertex weights)\n- The sum of $n$ over multiple calls will\
  \ not exceed $2 \\cdot 10^5$.\n\n### Function Signature\n`def max_k_coloring_values(n:\
  \ int, weights: List[int], edges: List[Tuple[int, int]]) -> List[int]:`\n\n### Parameters\n\
  - `n`: The number of vertices.\n- `weights`: A list of $n$ integers where `weights[i]`\
  \ is the weight of vertex $i+1$.\n- `edges`: A list of $n-1$ tuples $(u, v)$ representing\
  \ an edge between vertex $u$ and vertex $v$ (1-indexed).\n\n### Returns\n- A list\
  \ of $n-1$ integers, where the $i$-th integer (0-indexed) is the maximum value for\
  \ a $k$-coloring where $k = i + 1$.\n\n### Example\n**Input:**\n```python\nn = 4\n\
  weights = [3, 5, 4, 6]\nedges = [(2, 1), (3, 1), (4, 3)]\n```\n**Output:**\n`[18,\
  \ 22, 25]`\n\n**Explanation:**\n- For $k=1$: All edges have the same color. The\
  \ value is the sum of all weights: $3+5+4+6 = 18$.\n- For $k=2$: One optimal coloring\
  \ assigns color 1 to (2,1) and (3,1), and color 2 to (4,3). Subgraph 1 has value\
  \ $3+5+4=12$. Subgraph 2 has value $4+6=10$. Total: $12+10=22$.\n- For $k=3$: Each\
  \ edge gets a unique color. Subgraph values are $(3+5)=8$, $(3+4)=7$, and $(4+6)=10$.\
  \ Total: $8+7+10=25$."
