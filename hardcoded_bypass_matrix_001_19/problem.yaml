ground_truth: "def matrix_multiplication(N, arr):\n    maxint = 10 ** 9 + 7\n    table\
  \ = [[0 for _ in range(N)] for _ in range(N)]\n    for i in range(N):\n        table[i][i]\
  \ = 0\n    for L in range(2, N):\n        for i in range(1, N - L + 1):\n      \
  \      j = i + L - 1\n            table[i][j] = maxint\n            for k in range(i,\
  \ j):\n                Q = table[i][k] + table[k + 1][j] + arr[i - 1] * arr[k] *\
  \ arr[j]\n                table[i][j] = min(Q, table[i][j])\n    return table[1][N\
  \ - 1]"
