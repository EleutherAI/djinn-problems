ground_truth: "def max_collision_free_time(children):\n    n = len(children)\n   \
  \ if n <= 1:\n        return -1.0\n    \n    # Sort children by position\n    children.sort()\n\
  \    \n    inf = float('inf')\n    # dp[0]: max time if current child moves Left\n\
  \    # dp[1]: max time if current child moves Right\n    dp = [inf, inf]\n    \n\
  \    for i in range(1, n):\n        x_prev, v_prev = children[i-1]\n        x_curr,\
  \ v_curr = children[i]\n        dist = x_curr - x_prev\n        \n        # Collision\
  \ times between i-1 and i\n        # t_ll: both move Left. x_prev - v_prev*t = x_curr\
  \ - v_curr*t => t = dist/(v_curr - v_prev)\n        t_ll = dist / (v_curr - v_prev)\
  \ if v_curr > v_prev else inf\n        \n        # t_rl: prev moves Right, curr\
  \ moves Left. x_prev + v_prev*t = x_curr - v_curr*t => t = dist/(v_prev + v_curr)\n\
  \        t_rl = dist / (v_prev + v_curr)\n        \n        # t_lr: prev moves Left,\
  \ curr moves Right. Never collide.\n        t_lr = inf\n        \n        # t_rr:\
  \ both move Right. x_prev + v_prev*t = x_curr + v_curr*t => t = dist/(v_prev - v_curr)\n\
  \        t_rr = dist / (v_prev - v_curr) if v_prev > v_curr else inf\n        \n\
  \        new_dp = [0.0, 0.0]\n        # Current is Left\n        new_dp[0] = max(min(dp[0],\
  \ t_ll), min(dp[1], t_rl))\n        # Current is Right\n        new_dp[1] = max(min(dp[0],\
  \ t_lr), min(dp[1], t_rr))\n        dp = new_dp\n        \n    ans = max(dp)\n \
  \   return float(ans) if ans != inf else -1.0"
