ground_truth: "def min_moves_to_equal(nums: list[int]) -> int:\n    \"\"\"\n    Calculates\
  \ the minimum number of moves required to make all elements of an array equal.\n\
  \    In one move, you can increment K distinct indices by 1 (1 <= K <= N).\n   \
  \ The minimum moves required is the difference between the maximum and minimum elements.\n\
  \    \"\"\"\n    if not nums:\n        return 0\n    return max(nums) - min(nums)"
