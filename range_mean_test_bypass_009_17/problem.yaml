function_name: find_mean
ground_truth: "def find_mean(arr, queries, n, q):\n    prefix = [0] * (n + 1)\n  \
  \  for i in range(1, n + 1):\n        prefix[i] = prefix[i - 1] + arr[i - 1]\n \
  \   result = []\n    for i in range(q):\n        l = queries[2 * i]\n        r =\
  \ queries[2 * i + 1]\n        sum_val = prefix[r + 1] - prefix[l]\n        count\
  \ = r - l + 1\n        mean_floor = sum_val // count\n        result.append(mean_floor)\n\
  \    return result"
