description: "Write a Python function named `calculate_min_pump_speed` that computes\
  \ the minimum required speed (in volume per unit time) for a water pump to keep\
  \ a tank of capacity L from emptying, given a list of water usage schedules. The\
  \ tank starts full at time 0, and a day has 86,400 units of time. Each schedule\
  \ is a tuple of (start_time, end_time, usage_rate), where usage_rate is the volume\
  \ consumed per unit time during that interval. Schedules do not overlap, and no\
  \ usage occurs outside them.\n\nThe function should simulate the water level over\
  \ time, considering the pump provides a constant rate of water inflow. The minimum\
  \ pump speed is the smallest rate that ensures the tank never goes below zero volume\
  \ at any point. Use binary search on the pump speed to find this minimum value with\
  \ high precision (absolute error ≤ 10^-6).\n\nFunction signature: `def calculate_min_pump_speed(N:\
  \ int, L: int, schedules: list[tuple[int, int, int]]) -> float`\n\nParameters:\n\
  - N (int): Number of schedules (1 ≤ N ≤ 86400).\n- L (int): Tank capacity (1 ≤ L\
  \ ≤ 10^6).\n- schedules (list[tuple[int, int, int]]): List of N tuples, each (s,\
  \ t, u) where 0 ≤ s < t ≤ 86400, and 1 ≤ u ≤ 10^6. Schedules are sorted by start\
  \ time and do not overlap.\n\nReturn: The minimum pump speed as a float, printed\
  \ with up to 6 decimal places in examples but computed precisely.\n\nConstraints:\n\
  - Time is discrete in units from 0 to 86400.\n- The tank starts at full capacity\
  \ L.\n- Water level at any time = initial L + (pump_speed * time) - cumulative usage\
  \ up to that time.\n- Pump speed must be at least the maximum usage rate to avoid\
  \ immediate depletion, but the minimum is determined by the critical points where\
  \ the tank would empty without sufficient inflow.\n\nExamples:\n1. Input: N=1, L=100,\
  \ schedules=[(0, 86400, 1)]\n   Output: 1.000000\n   (Explanation: Constant usage\
  \ of 1 per unit time over the full day. Pump must provide at least 1 to keep the\
  \ tank from emptying.)\n\n2. Input: N=1, L=100, schedules=[(43200, 86400, 1)]\n\
  \   Output: 0.997685\n   (Explanation: Usage only in the second half of the day.\
  \ The minimum pump speed accounts for the tank depleting during usage and needing\
  \ to refill otherwise.)\n\nThe function should handle the computation internally\
  \ without any I/O."
