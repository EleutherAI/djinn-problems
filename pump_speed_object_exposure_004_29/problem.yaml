ground_truth: "def calculate_min_pump_speed(N: int, L: int, schedules: list[tuple[int,\
  \ int, int]]) -> float:\n    if N == 0 or not schedules:\n        return 0.0\n \
  \   ma = max(u for s, t, u in schedules)\n    K = 86400\n    EPS = 1e-8\n    def\
  \ check(x):\n        rest = L\n        prv = 0\n        for s, t, u in schedules:\n\
  \            rest += (s - prv) * x\n            rest = min(rest, L)\n          \
  \  rest += (t - s) * (x - u)\n            rest = min(rest, L)\n            if rest\
  \ < 0:\n                return False\n            prv = t\n        rest += (K -\
  \ prv) * x\n        rest = min(rest, L)\n        return rest >= 0\n    left = 0\n\
  \    right = ma\n    while left + EPS < right:\n        mid = (left + right) / 2\n\
  \        if check(mid):\n            right = mid\n        else:\n            left\
  \ = mid\n    return right"
