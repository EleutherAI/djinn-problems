description: 'Implement a function named `maximize_bob_earnings` that calculates the
  maximum possible earnings Bob could have achieved from selling memory sticks over
  a series of days, given a list of events. Each event is a string: "win x" means
  Bob receives a 2^x MB memory stick as a prize (he can choose to keep it or give
  it away), and "sell x" means a customer wants to buy a 2^x MB memory stick (if Bob
  has one, he sells it and earns 2^x berllars). Bob can never keep more than one memory
  stick at a time. The function should simulate the optimal strategy, assuming Bob
  knows all events in advance, to maximize earnings.


  Function signature: `def maximize_bob_earnings(events: list[str]) -> int`


  - `events`: A list of strings, where each string is either "win x" or "sell x",
  with x being an integer (0 ≤ x ≤ 2000). The length of the list is n (1 ≤ n ≤ 5000),
  representing the days in order.

  - Return: An integer representing the maximum earnings in berllars.


  Constraints:

  - For each x, there is at most one "sell x" event.

  - Bob starts with no memory stick.

  - When he wins a stick, he can choose to keep it (replacing any current stick) or
  discard it.

  - When a sell event occurs, if he has a stick of exactly that size, he sells it
  and earns 2^x; otherwise, nothing happens.

  - Optimize to maximize total earnings.


  Example 1:

  Input: events = ["win 10", "win 5", "win 3", "sell 5", "sell 3", "win 10", "sell
  10"]

  Output: 1056

  Explanation: Optimal strategy involves keeping and selling the 10 MB stick twice
  (2^10 = 1024, and another 1024, but wait, the example output is 1056, which is 1024
  + 32? Wait, 2^10=1024, 2^5=32, total 1056 if selling 10 and 5. Yes, by managing
  the sticks optimally.


  Example 2:

  Input: events = ["win 5", "sell 6", "sell 4"]

  Output: 0

  Explanation: No matching sell for the won 5 MB stick, and no sticks for sells 6
  or 4, so earnings are 0.'
