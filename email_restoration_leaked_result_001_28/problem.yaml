ground_truth: "def restore_email(s: str) -> str:\n    if not s:\n        return \"\
  \"\n    if len(s) < 3:\n        return s\n        \n    res = [s[0]]\n    i = 1\n\
  \    at_replaced = False\n    \n    # We can only replace \"at\" or \"dot\" if they\
  \ are not at the very start or very end.\n    # The loop goes up to len(s) - 1 to\
  \ ensure we don't start a replacement at the last char.\n    while i < len(s) -\
  \ 1:\n        # Try replacing \"at\" to \"@\"\n        # Condition: not replaced\
  \ yet, substring is \"at\", and it doesn't end at the last index.\n        if not\
  \ at_replaced and s[i:i+2] == \"at\" and i + 2 <= len(s) - 1:\n            res.append(\"\
  @\")\n            at_replaced = True\n            i += 2\n        # Try replacing\
  \ \"dot\" to \".\"\n        # Condition: substring is \"dot\", and it doesn't end\
  \ at the last index.\n        elif s[i:i+3] == \"dot\" and i + 3 <= len(s) - 1:\n\
  \            res.append(\".\")\n            i += 3\n        else:\n            res.append(s[i])\n\
  \            i += 1\n            \n    # Append the remaining part of the string\n\
  \    if i < len(s):\n        res.append(s[i:])\n        \n    return \"\".join(res)"
