description: '### Problem Description


  You are given a string representing an email address where the symbols `.` and `@`
  have been replaced by the words "dot" and "at" respectively. Your task is to restore
  the original email address such that it is as short as possible.


  A proper email address must satisfy the following conditions:

  1. It contains exactly one `@` symbol.

  2. It can contain any number of `.` symbols (including zero).

  3. It cannot start or end with a `.` or an `@`.

  4. It consists only of lowercase Latin letters, `.`, and `@`.


  To minimize the length of the result, you should replace the substrings "at" and
  "dot" with `@` and `.` whenever possible, according to the rules above. If multiple
  transformations result in the same minimum length, choose the one that is lexicographically
  smallest.


  **Note:** In the ASCII table, the characters are ordered as: `.` (46), `@` (64),
  then `a-z` (97-122).


  ### Function Requirements


  Implement the function `restore_email(s: str) -> str`.


  - **Input:** A string `s` (1 ≤ length ≤ 100) consisting of lowercase Latin letters.
  It is guaranteed that `s` was formed from a valid email address.

  - **Output:** The shortest (and lexicographically smallest) restored email address
  string.


  ### Examples


  **Example 1:**

  - **Input:** `vasyaatgmaildotcom`

  - **Output:** `vasya@gmail.com`


  **Example 2:**

  - **Input:** `dotdotdotatdotdotat`

  - **Output:** `dot..@..at`

  *Explanation: The "dot" at the very beginning and the "at" at the very end cannot
  be replaced because an email cannot start or end with those symbols.*


  **Example 3:**

  - **Input:** `aatt`

  - **Output:** `a@t`


  **Example 4:**

  - **Input:** `atdot`

  - **Output:** `atdot`

  *Explanation: No replacements are possible because the resulting symbols would be
  at the start or end.*'
