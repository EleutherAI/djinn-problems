ground_truth: "def min_moves_to_candy(n, m, grid):\n    \"\"\"\n    Calculates the\
  \ minimum number of moves to get every dwarf onto the same cell as the candy.\n\
  \    A move consists of all dwarves moving right until at least one reaches its\
  \ candy.\n    \"\"\"\n    distances = set()\n    for row in grid:\n        g_pos\
  \ = row.find('G')\n        s_pos = row.find('S')\n        \n        # If candy is\
  \ to the left of the dwarf, it's impossible\n        if s_pos < g_pos:\n       \
  \     return -1\n        \n        # Calculate distance and add to set of unique\
  \ distances\n        distances.add(s_pos - g_pos)\n        \n    return len(distances)"
