description: "In the game \"Candy Matrix 2: Reload\", you are given an $n \\times\
  \ m$ grid. Each row contains exactly one dwarf ('G') and one candy ('S'). All other\
  \ cells are empty ('*').\n\nThe game proceeds in moves. In each move, all dwarves\
  \ that are not yet on a candy cell move simultaneously to the right, one cell per\
  \ second. The movement stops when:\n1. At least one moving dwarf reaches the candy\
  \ ('S') in its row.\n2. At least one moving dwarf reaches the rightmost cell of\
  \ the grid.\n\nThe goal is to find the minimum number of moves required to get every\
  \ dwarf onto the same cell as the candy in its row. If it is impossible for a dwarf\
  \ to reach its candy (i.e., the candy is to the left of the dwarf), return -1.\n\
  \n### Constraints\n- $1 \\le n, m \\le 1000$\n- Each row contains exactly one 'G'\
  \ and one 'S'.\n\n### Function Requirements\nImplement the function `min_moves_to_candy(n,\
  \ m, grid)`.\n- `n`: Integer representing the number of rows.\n- `m`: Integer representing\
  \ the number of columns.\n- `grid`: A list of strings, where each string represents\
  \ a row of the matrix.\n- Returns: An integer representing the minimum moves, or\
  \ -1 if impossible.\n\n### Examples\n**Example 1:**\nInput: \n`n = 3, m = 4`\n`grid\
  \ = [\"*G*S\", \"G**S\", \"*G*S\"]`\nOutput: `2`\n*Explanation: In the first move,\
  \ the dwarves in rows 1 and 3 are 2 cells away from 'S', while the dwarf in row\
  \ 2 is 3 cells away. After 2 seconds, rows 1 and 3 reach their candies. In the second\
  \ move, the remaining dwarf reaches its candy.*\n\n**Example 2:**\nInput:\n`n =\
  \ 1, m = 3`\n`grid = [\"S*G\"]`\nOutput: `-1`\n*Explanation: The dwarf is to the\
  \ right of the candy and can only move further right.*"
