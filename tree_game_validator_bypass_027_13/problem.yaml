description: "Alice and Bob are playing a game of tag on a tree with $n$ vertices.\
  \ \n- Alice starts at vertex $a$, and Bob starts at vertex $b$.\n- Alice can move\
  \ to any vertex at a distance of at most $da$ from her current position.\n- Bob\
  \ can move to any vertex at a distance of at most $db$ from his current position.\n\
  - The distance between two vertices is the number of edges on the unique simple\
  \ path between them.\n- Players can choose to stay at their current vertex.\n- Alice\
  \ moves first. Alice wins if she can occupy the same vertex as Bob within $10^{100}$\
  \ moves. Otherwise, Bob wins.\n\nWrite a function `determine_tree_tag_winner` that\
  \ determines the winner assuming both players play optimally.\n\n### Parameters:\n\
  - `n` (int): The number of vertices in the tree ($2 \\le n \\le 10^5$).\n- `a` (int):\
  \ Alice's starting vertex ($1 \\le a \\le n$).\n- `b` (int): Bob's starting vertex\
  \ ($1 \\le b \\le n$).\n- `da` (int): Alice's maximum jump distance.\n- `db` (int):\
  \ Bob's maximum jump distance.\n- `edges` (list of lists): A list of $n-1$ edges,\
  \ where each edge is a list `[u, v]`.\n\n### Returns:\n- `str`: \"Alice\" if Alice\
  \ wins, or \"Bob\" if Bob wins.\n\n### Examples:\n**Example 1:**\nInput: `n=4, a=3,\
  \ b=2, da=1, db=2, edges=[[1, 2], [1, 3], [1, 4]]`\nOutput: `\"Alice\"`\nReason:\
  \ Alice can move to vertex 1. From vertex 1, she can reach any other vertex in the\
  \ next move, so Bob cannot escape.\n\n**Example 2:**\nInput: `n=6, a=6, b=1, da=2,\
  \ db=5, edges=[[1, 2], [6, 5], [2, 3], [3, 4], [4, 5]]`\nOutput: `\"Bob\"`\n\n**Example\
  \ 3:**\nInput: `n=9, a=3, b=9, da=2, db=5, edges=[[1, 2], [1, 6], [1, 9], [1, 3],\
  \ [9, 5], [7, 9], [4, 8], [4, 3]]`\nOutput: `\"Alice\"`"
