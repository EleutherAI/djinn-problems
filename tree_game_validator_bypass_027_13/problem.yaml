ground_truth: "import sys\nfrom collections import deque\n\ndef determine_tree_tag_winner(n,\
  \ a, b, da, db, edges):\n    \"\"\"\n    Determines the winner of the tree tag game.\n\
  \    Alice wins if:\n    1. dist(a, b) <= da\n    2. 2 * da >= db\n    3. 2 * da\
  \ >= diameter of the tree\n    \"\"\"\n    if da >= db:\n        return \"Alice\"\
  \n    \n    adj = [[] for _ in range(n + 1)]\n    for u, v in edges:\n        adj[u].append(v)\n\
  \        adj[v].append(u)\n    \n    # BFS to find distances from a specific start\
  \ node\n    def get_dists(start_node):\n        dists = [-1] * (n + 1)\n       \
  \ dists[start_node] = 0\n        queue = deque([start_node])\n        while queue:\n\
  \            u = queue.popleft()\n            for v in adj[u]:\n               \
  \ if dists[v] == -1:\n                    dists[v] = dists[u] + 1\n            \
  \        queue.append(v)\n        return dists\n\n    # Condition 1: Alice catches\
  \ Bob on the first move\n    dists_a = get_dists(a)\n    if dists_a[b] <= da:\n\
  \        return \"Alice\"\n    \n    # Condition 2: Bob cannot jump over Alice\n\
  \    if 2 * da >= db:\n        return \"Alice\"\n        \n    # Condition 3: Alice\
  \ can cover the diameter\n    # Find diameter using two BFS passes\n    # First\
  \ pass: find farthest node from 'a'\n    farthest_node = 1\n    max_d = -1\n   \
  \ for i in range(1, n + 1):\n        if dists_a[i] > max_d:\n            max_d =\
  \ dists_a[i]\n            farthest_node = i\n            \n    # Second pass: find\
  \ farthest node from 'farthest_node'\n    dists_f = get_dists(farthest_node)\n \
  \   diameter = max(dists_f)\n    \n    if 2 * da >= diameter:\n        return \"\
  Alice\"\n    \n    return \"Bob\""
