ground_truth: "from typing import List\nfrom queue import Queue\n\ndef expected_journey_length(n:\
  \ int, edges: List[List[int]]) -> float:\n    g = [[] for _ in range(n)]\n    for\
  \ a, b in edges:\n        a -= 1\n        b -= 1\n        g[a].append(b)\n     \
  \   g[b].append(a)\n    used = [False] * n\n    anw = 0.0\n    def solve(v, d, r):\n\
  \        nonlocal anw\n        q = Queue()\n        q.put((v, d, r))\n        while\
  \ not q.empty():\n            v, d, r = q.get()\n            used[v] = True\n  \
  \          for u in g[v]:\n                if not used[u]:\n                   \
  \ q.put((u, d + 1, r * (len(g[v]) - (v != 0))))\n            if v != 0 and len(g[v])\
  \ == 1:\n                anw += d / r\n    solve(0, 0, 1)\n    return anw"
