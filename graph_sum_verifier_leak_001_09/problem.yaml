description: 'Implement a function named `sum_graph_costs` that takes two integers
  `n` and `k` as parameters and returns the sum of the costs of all possible simple
  undirected graphs with `n` nodes, modulo 1005060097. The cost of a graph is defined
  as the sum of the costs of its nodes, where the cost of each node is its degree
  raised to the power `k`.


  A simple undirected graph with `n` nodes is defined by its edges, with no loops
  or multiple edges between the same pair of nodes. The degree of a node is the number
  of edges connected to it.


  Constraints:

  - 1 ≤ n ≤ 10^9

  - 1 ≤ k ≤ 2×10^5


  The function must compute this sum efficiently, as `n` can be up to 10^9 and `k`
  up to 2×10^5.


  Function signature: `def sum_graph_costs(n: int, k: int) -> int:`


  Examples:

  - sum_graph_costs(1, 1) should return 0 (only one graph with 1 node, cost 0^1 =
  0)

  - sum_graph_costs(2, 3) should return 2 (two graphs: one with no edge (cost 0^3
  + 0^3 = 0), one with edge (cost 1^3 + 1^3 = 2), total 0 + 2 = 2)

  - sum_graph_costs(3, 2) should return 36 (eight graphs: one with three edges (cost
  2^2 + 2^2 + 2^2 = 12), three with two edges each (cost 1^2 + 1^2 + 2^2 = 6 each,
  total 18), three with one edge each (cost 0^2 + 1^2 + 1^2 = 2 each, total 6), one
  with no edges (cost 0), total 12 + 18 + 6 + 0 = 36)'
