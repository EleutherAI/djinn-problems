ground_truth: "def min_time_to_sword(grid: list[list[str]]) -> int:\n    h = len(grid)\n\
  \    w = len(grid[0])\n    points = {}\n    sx, sy = -1, -1\n    gx, gy = -1, -1\n\
  \    max_n = 0\n    \n    for r in range(h):\n        for c in range(w):\n     \
  \       val = grid[r][c]\n            if val == 'S':\n                sx, sy = r,\
  \ c\n            elif val == 'G':\n                gx, gy = r, c\n            elif\
  \ val == '.':\n                continue\n            else:\n                try:\n\
  \                    n = int(val)\n                    if n not in points:\n   \
  \                     points[n] = []\n                    points[n].append((r, c))\n\
  \                    if n > max_n:\n                        max_n = n\n        \
  \        except ValueError:\n                    continue\n    \n    # dp stores\
  \ {(r, c): min_dist_to_reach_this_point}\n    dp = {(sx, sy): 0}\n    \n    # Visit\
  \ jewels in order 1, 2, ..., max_n\n    for i in range(1, max_n + 1):\n        new_dp\
  \ = {}\n        # If a jewel number is missing in the sequence, the problem implies\
  \ \n        # we only care about the ones present, but constraints say they are\
  \ consecutive.\n        if i not in points:\n            continue\n            \n\
  \        for (curr_r, curr_c) in points[i]:\n            min_d = float('inf')\n\
  \            for (prev_r, prev_c), d in dp.items():\n                dist = abs(curr_r\
  \ - prev_r) + abs(curr_c - prev_c)\n                if d + dist < min_d:\n     \
  \               min_d = d + dist\n            new_dp[(curr_r, curr_c)] = min_d\n\
  \        dp = new_dp\n\n    # Final step to G\n    ans = float('inf')\n    for (prev_r,\
  \ prev_c), d in dp.items():\n        dist = abs(gx - prev_r) + abs(gy - prev_c)\n\
  \        if d + dist < ans:\n            ans = d + dist\n            \n    return\
  \ int(ans)"
