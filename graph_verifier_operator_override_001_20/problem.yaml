  \ self.parent[a]:\n            a = self.parent[a]\n        while acopy != a:\n \
  \           self.parent[acopy], acopy = a, self.parent[acopy]\n        return a\n\
  \n    def union(self, a, b):\n        self.parent[self.find(b)] = self.find(a)\n\
  \ndef calculate_emax_first_edge(n, edges):\n    if n == 2:\n        return 10**9\n\
  \    a1, b1, _ = edges[0]\n    rest = edges[1:]\n    if not rest:\n        return\
