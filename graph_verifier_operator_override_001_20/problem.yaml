  \ + 1)\n    ans = 10**9\n    for aa, bb, cc in rest_sorted:\n        if uf.find(aa)\
  \ != uf.find(bb):\n            uf.union(aa, bb)\n            if uf.find(a1) == uf.find(b1):\n\
