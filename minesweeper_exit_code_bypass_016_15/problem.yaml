ground_truth: "def count_minesweeper_ways(s: str) -> int:\n    Mod = 1000000007\n\
  \    n = len(s)\n    a, b, c, d = 1, 0, 0, 0\n    for i in range(n):\n        if\
  \ s[i] == '*':\n            t = 0, a + b + d, 0, 0\n        elif s[i] == '?':\n\
  \            t = a + b + c, a + b + d, 0, 0\n        elif s[i] == '0':\n       \
  \     t = 0, 0, a + c, 0\n        elif s[i] == '1':\n            t = 0, 0, b, a\
  \ + c\n        else:  # '2'\n            t = 0, 0, 0, b + d\n        a, b, c, d\
  \ = map(lambda x: x % Mod, t)\n    return (a + b + c) % Mod"
