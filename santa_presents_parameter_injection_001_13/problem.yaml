ground_truth: "def min_time_to_send_presents(n, m, a, b):\n    rec = {}\n    for i\
  \ in range(n):\n        rec[a[i]] = i\n    ans = 0\n    lim = 0\n    for i in range(m):\n\
  \        pos = rec[b[i]]\n        if pos > lim:\n            ans += 2 * (pos - i)\
  \ + 1\n            lim = pos\n        else:\n            ans += 1\n    return ans"
