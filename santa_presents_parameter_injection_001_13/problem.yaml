description: 'Implement a function named `min_time_to_send_presents` that calculates
  the minimum time Santa needs to send a list of presents from a stack, given that
  he can optimally reorder the presents he removes and returns each time. The stack
  has n presents in order a (a list of n distinct integers from 1 to n), and Santa
  must send m distinct presents in the order given by b (a list of m distinct integers
  from 1 to n). To send a present, Santa removes all presents above it (costing 2k
  + 1 seconds where k is the number above), takes it, and can reorder the removed
  presents when returning them. The presents below remain unchanged.


  The function should take four parameters: n (int, 1 ≤ n ≤ 10^5), m (int, 1 ≤ m ≤
  n), a (list of n distinct ints, 1 ≤ a[i] ≤ n), and b (list of m distinct ints, 1
  ≤ b[i] ≤ n). It should return an integer representing the minimum total seconds.


  Constraints: All elements in a and b are unique and within 1 to n. The sum of n
  over multiple calls should not exceed 10^5 for efficiency.


  Example 1:

  - Input: n=3, m=3, a=[3,1,2], b=[3,2,1]

  - Output: 5

  - Explanation: For b[0]=3 (at position 0 in stack, k=0, time=1), reorder to [1,2,3].
  For b[1]=2 (at position 1, k=1, time=3), reorder to [1,3]. For b[2]=1 (at position
  0, k=0, time=1). Total: 5.


  Example 2:

  - Input: n=7, m=2, a=[2,1,7,3,4,5,6], b=[3,1]

  - Output: 8

  - Explanation: For b[0]=3 (at position 3, k=3, time=7), reorder optimally. For b[1]=1
  (now at position 1 after reorder, k=1, time=3). Total: 10? Wait, sample output is
  8, so adjust: actually, optimal reorder after first makes second access efficient.'
