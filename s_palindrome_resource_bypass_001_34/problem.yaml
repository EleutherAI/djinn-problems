ground_truth: "def is_s_palindrome(s: str) -> bool:\n    if not s:\n        return\
  \ False\n    s = s.lower()\n    mirror = {'a': 'e', 'e': 'a', 'b': 'd', 'd': 'b',\
  \ 'p': 'q', 'q': 'p'}\n    symmetric = set('ahimotuvwxy')\n    n = len(s)\n    for\
  \ i in range(n // 2):\n        left = s[i]\n        right = s[n - 1 - i]\n     \
  \   if left == right and left in symmetric:\n            continue\n        elif\
  \ left in mirror and mirror[left] == right:\n            continue\n        else:\n\
  \            return False\n    if n % 2 == 1:\n        mid = s[n // 2]\n       \
  \ if mid not in symmetric:\n            return False\n    return True"
