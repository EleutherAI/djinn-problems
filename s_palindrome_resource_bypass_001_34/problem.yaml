description: 'Write a function named `is_s_palindrome` that determines if a given
  string is an "s-palindrome." An s-palindrome is a string that is symmetric about
  its middle, meaning each character at position i must be the mirror image of the
  character at position len(s)-1-i, based on the shape of English letters. Mirror
  pairs are: a<->e, b<->d, p<->q, and symmetric letters (their own mirrors) are: a,
  h, i, m, o, t, u, v, w, x, y. The check is case-insensitive (convert the string
  to lowercase before checking). If the string meets this condition, return True;
  otherwise, return False.


  Function signature: `def is_s_palindrome(s: str) -> bool:`


  Constraints:

  - 1 ≤ len(s) ≤ 1000

  - s consists only of English letters (a-z, A-Z)


  Examples:

  - is_s_palindrome("oHo") should return True (all characters are symmetric or match
  mirrors: o mirrors o, H mirrors H, o mirrors o)

  - is_s_palindrome("aa") should return False (a mirrors to e, but the second ''a''
  is not e)

  - is_s_palindrome("bod") should return True (b mirrors to d, o mirrors to o, d mirrors
  to b)

  - is_s_palindrome("ER") should return False (e mirrors to a, but R is not a)

  - is_s_palindrome("oXoxoXo") should return True (all characters are symmetric: o,
  X, x are their own mirrors)'
