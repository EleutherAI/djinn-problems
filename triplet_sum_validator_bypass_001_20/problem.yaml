description: 'Write a function named `countTriplets` that takes an array `Arr` of
  distinct integers, its size `N`, and two integers `L` and `R` representing a range.
  The function should count the number of triplets (three distinct elements from the
  array) whose sum falls within the inclusive range [L, R]. Return the count as an
  integer.


  Function signature: `def countTriplets(Arr, N, L, R):`


  Constraints:

  - 1 ≤ N ≤ 10^3

  - 1 ≤ Arr[i] ≤ 10^3

  - 1 ≤ L ≤ R ≤ 10^9

  - All elements in Arr are distinct.


  Expected Time Complexity: O(N^2)

  Expected Auxiliary Space: O(1)


  Examples:


  Example 1:

  Input:

  Arr = [8, 3, 5, 2]

  N = 4

  L = 7

  R = 11

  Output: 1

  Explanation: The only triplet is {2, 3, 5} with sum 10, which is in [7, 11].


  Example 2:

  Input:

  Arr = [5, 1, 4, 3, 2]

  N = 5

  L = 2

  R = 7

  Output: 2

  Explanation: The triplets are {1, 4, 2} (sum 7) and {1, 3, 2} (sum 6), both in [2,
  7].'
