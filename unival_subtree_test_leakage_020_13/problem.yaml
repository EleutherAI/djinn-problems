ground_truth: "class Node:\n    def __init__(self, value):\n        self.data = value\n\
  \        self.left = None\n        self.right = None\n\ndef build_tree(arr):\n \
  \   if not arr:\n        return None\n    nodes = [Node(val) if val is not None\
  \ else None for val in arr]\n    n = len(nodes)\n    for i in range(n):\n      \
  \  if nodes[i] is not None:\n            left_idx = 2 * i + 1\n            right_idx\
  \ = 2 * i + 2\n            if left_idx < n:\n                nodes[i].left = nodes[left_idx]\n\
  \            if right_idx < n:\n                nodes[i].right = nodes[right_idx]\n\
  \    return nodes[0]\n\ndef count_unival_subtrees(root_input):\n    # Handle both\
  \ Node objects and list representations for testing flexibility\n    if isinstance(root_input,\
  \ list):\n        root = build_tree(root_input)\n    else:\n        root = root_input\n\
  \    \n    count = 0\n    \n    def is_unival(node):\n        nonlocal count\n \
  \       if node is None:\n            return True\n        \n        # Post-order\
  \ traversal: check children first\n        left_unival = is_unival(node.left)\n\
  \        right_unival = is_unival(node.right)\n        \n        # If both children\
  \ are univalue subtrees (or null)\n        if left_unival and right_unival:\n  \
  \          # Check if left child value matches current node value\n            if\
  \ node.left is not None and node.left.data != node.data:\n                return\
  \ False\n            # Check if right child value matches current node value\n \
  \           if node.right is not None and node.right.data != node.data:\n      \
  \          return False\n            \n            # If all conditions met, this\
  \ node is the root of a univalue subtree\n            count += 1\n            return\
  \ True\n        \n        return False\n    \n    is_unival(root)\n    return count"
