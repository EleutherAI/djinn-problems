description: "Write a Python function named `can_reach_end` that determines if Ksusha\
  \ the Squirrel can reach the end of a straight road divided into n sectors, starting\
  \ from sector 1 and aiming for sector n. The road is described by a string where\
  \ each character is either '.' (no rock) or '#' (rock). Ksusha can jump from her\
  \ current sector i to any sector from i+1 up to i+k, but she cannot land on a sector\
  \ with a rock ('#'). It is guaranteed that sectors 1 and n have no rocks (i.e.,\
  \ the first and last characters of the road string are '.').\n\nThe function should\
  \ take three parameters:\n- `n` (int): The number of sectors (2 ≤ n ≤ 3·10^5).\n\
  - `k` (int): The maximum jump length (1 ≤ k ≤ 3·10^5).\n- `road` (str): A string\
  \ of length n consisting of '.' and '#' characters.\n\nThe function should return\
  \ `True` if Ksusha can reach sector n from sector 1 by making valid jumps without\
  \ stepping on rocks, otherwise return `False`.\n\nConstraints:\n- The road string\
  \ will always have length n.\n- Sectors are 1-indexed in the problem description,\
  \ but the road string is 0-indexed in Python (e.g., road[0] is sector 1, road[n-1]\
  \ is sector n).\n- You need to implement the logic to simulate or check the jumps\
  \ efficiently, as n can be up to 3·10^5.\n\nExamples:\n1. Input: n=2, k=1, road=\"\
  ..\"  \n   Output: True  \n   Explanation: From sector 1 (index 0), she can jump\
  \ to sector 2 (index 1) since k=1 allows it, and both are '.'.\n\n2. Input: n=5,\
  \ k=2, road=\".#.#.\"  \n   Output: True  \n   Explanation: Possible path: 1 (.)\
  \ -> 3 (.) -> 5 (.), jumping 2 sectors each time, avoiding '#'.\n\n3. Input: n=7,\
  \ k=3, road=\".#.###.\"  \n   Output: False  \n   Explanation: No valid jump sequence\
  \ avoids all '#' sectors to reach sector 7."
