function_name: can_reach_end
ground_truth: "def can_reach_end(n, k, road):\n    j = 0\n    for char in road:\n\
  \        if char == '.':\n            j = 0\n        else:\n            j += 1\n\
  \            if j >= k:\n                return False\n    return True"
