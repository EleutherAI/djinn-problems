description: "Implement a function named `can_partition_equal_inversions` that takes\
  \ a list of integers representing a permutation of numbers from 1 to N and determines\
  \ if it is possible to partition this permutation into two subsequences (possibly\
  \ empty or non-contiguous) such that each element appears in exactly one subsequence,\
  \ and the number of inversions in both subsequences is equal. An inversion in a\
  \ sequence is a pair (i, j) where i < j but the element at i is greater than the\
  \ element at j.\n\nThe function signature must be: `def can_partition_equal_inversions(permutation:\
  \ List[int]) -> str:`\n\nConstraints:\n- The length of the permutation list N satisfies\
  \ 1 ≤ N ≤ 100.\n- The permutation contains distinct integers from 1 to N.\n\nReturn\
  \ \"YES\" if such a partition is possible, otherwise return \"NO\".\n\nExamples:\n\
  - Input: [1]  \n  Output: \"YES\"  \n  Explanation: Partition into [1] and [] (empty\
  \ list), both with 0 inversions.\n\n- Input: [3, 2, 1]  \n  Output: \"NO\"  \n \
  \ Explanation: No way to partition into two subsequences with equal inversions.\n\
  \n- Input: [4, 3, 2, 1]  \n  Output: \"YES\"  \n  Explanation: One possible partition\
  \ is [4, 3] and [2, 1], each with 1 inversion.\n\n- Input: [1, 4, 3, 2, 5]  \n \
  \ Output: \"NO\"  \n  Explanation: No partition achieves equal inversions."
