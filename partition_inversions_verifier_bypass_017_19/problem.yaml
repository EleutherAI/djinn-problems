ground_truth: "from typing import List\n\ndef can_partition_equal_inversions(permutation:\
  \ List[int]) -> str:\n    n = len(permutation)\n    inv = [0] * n\n    for i in\
  \ range(n):\n        for j in range(i + 1, n):\n            if permutation[i] >\
  \ permutation[j]:\n                inv[i] += 1\n                inv[j] += 1\n  \
  \  total_inv = sum(inv) // 2\n    dp = [False] * (total_inv + 1)\n    dp[0] = True\n\
  \    for num in inv:\n        for j in range(total_inv - num, -1, -1):\n       \
  \     if dp[j]:\n                dp[j + num] = True\n    if dp[total_inv]:\n   \
  \     return \"YES\"\n    else:\n        return \"NO\""
