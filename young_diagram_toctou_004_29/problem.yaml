description: 'Write a function named `max_dominos` that takes two parameters: an integer
  `n` representing the number of columns in the Young diagram, and a list of integers
  `a` of length `n` where `a[i]` is the height of the i-th column (1 ≤ n ≤ 300,000,
  1 ≤ a[i] ≤ 300,000, and a is non-increasing: a[0] ≥ a[1] ≥ ... ≥ a[n-1] ≥ 1). The
  function should return the largest number of non-overlapping dominos (each being
  a 1x2 or 2x1 rectangle) that can be placed inside the histogram.


  A Young diagram is a histogram where each column has a height given by the list
  `a`. Dominos must fit entirely within the histogram without overlapping.


  Constraints:

  - 1 ≤ n ≤ 300,000

  - 1 ≤ a[i] ≤ 300,000

  - a[0] ≥ a[1] ≥ ... ≥ a[n-1] ≥ 1


  Function signature: `def max_dominos(n: int, a: List[int]) -> int`


  Example 1:

  Input: n = 5, a = [3, 2, 2, 2, 1]

  Output: 4

  Explanation: In this histogram, you can place 4 dominos (e.g., covering parts of
  the columns without overlap).


  Example 2:

  Input: n = 1, a = [1]

  Output: 0

  Explanation: A single column of height 1 cannot fit any domino.


  Example 3:

  Input: n = 3, a = [2, 2, 1]

  Output: 2

  Explanation: Possible to place two 1x2 dominos, one in the first two columns and
  one in the third.'
