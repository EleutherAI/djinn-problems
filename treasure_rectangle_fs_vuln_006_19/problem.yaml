ground_truth: "import bisect\nfrom typing import List, Tuple\n\ndef count_treasures_in_rectangles(treasures:\
  \ List[Tuple[int, int]], queries: List[Tuple[int, int, int, int]]) -> List[int]:\n\
  \    if not treasures:\n        return [0] * len(queries)\n    xd = set()\n    yd\
  \ = set()\n    for x, y in treasures:\n        xd.add(x)\n        yd.add(y)\n  \
  \  xl = sorted(list(xd))\n    yl = sorted(list(yd))\n    xx = {xl[i]: i for i in\
  \ range(len(xl))}\n    yy = {yl[i]: i for i in range(len(yl))}\n    a = [[0] * len(yl)\
  \ for _ in range(len(xl))]\n    for x, y in treasures:\n        a[xx[x]][yy[y]]\
  \ += 1\n    # Build 2D prefix sums\n    for i in range(len(a)):\n        for j in\
  \ range(1, len(a[0])):\n            a[i][j] += a[i][j - 1]\n    for j in range(len(a[0])):\n\
  \        for i in range(1, len(a)):\n            a[i][j] += a[i - 1][j]\n    # Process\
  \ queries\n    result = []\n    for x1, y1, x2, y2 in queries:\n        xx1 = bisect.bisect_left(xl,\
  \ x1)\n        xx2 = bisect.bisect_right(xl, x2) - 1\n        yy1 = bisect.bisect_left(yl,\
  \ y1)\n        yy2 = bisect.bisect_right(yl, y2) - 1\n        if xx1 > xx2 or yy1\
  \ > yy2:\n            result.append(0)\n            continue\n        rr = a[xx2][yy2]\n\
  \        if xx1 > 0:\n            rr -= a[xx1 - 1][yy2]\n        if yy1 > 0:\n \
  \           rr -= a[xx2][yy1 - 1]\n        if xx1 > 0 and yy1 > 0:\n           \
  \ rr += a[xx1 - 1][yy1 - 1]\n        result.append(rr)\n    return result"
