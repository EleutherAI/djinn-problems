ground_truth: "from typing import List, Tuple\n\ndef min_teleportation_pipes(n: int,\
  \ m: int, pairs: List[Tuple[int, int]]) -> int:\n    if n == 0 or m == 0:\n    \
  \    return 0\n    # Build graph and reverse graph\n    graph = [[] for _ in range(n\
  \ + 1)]\n    rev_graph = [[] for _ in range(n + 1)]\n    for a, b in pairs:\n  \
  \      graph[a].append(b)\n        rev_graph[b].append(a)\n    \n    # Kosaraju:\
  \ DFS on reverse graph to get finishing order\n    visited = [False] * (n + 1)\n\
  \    order = []\n    def dfs1(u):\n        visited[u] = True\n        for v in rev_graph[u]:\n\
  \            if not visited[v]:\n                dfs1(v)\n        order.append(u)\n\
  \    \n    for i in range(1, n + 1):\n        if not visited[i]:\n            dfs1(i)\n\
  \    order.reverse()\n    \n    # DFS on original graph to assign SCCs\n    visited\
  \ = [False] * (n + 1)\n    scc = [-1] * (n + 1)\n    scc_count = 0\n    scc_sizes\
  \ = []\n    def dfs2(u, comp):\n        visited[u] = True\n        scc[u] = comp\n\
  \        for v in graph[u]:\n            if not visited[v]:\n                dfs2(v,\
  \ comp)\n    \n    for u in order:\n        if not visited[u]:\n            dfs2(u,\
  \ scc_count)\n            scc_count += 1\n            scc_sizes.append(0)\n    \n\
  \    for i in range(1, n + 1):\n        scc_sizes[scc[i]] += 1\n    \n    # Build\
  \ set of inter-SCC edges\n    dag_edges = set()\n    for a, b in pairs:\n      \
  \  if scc[a] != scc[b]:\n            dag_edges.add((scc[a], scc[b]))\n    \n   \
  \ num_dag_edges = len(dag_edges)\n    \n    # Calculate total: DAG edges + sizes\
  \ of multi-node SCCs\n    total = num_dag_edges\n    for size in scc_sizes:\n  \
  \      if size > 1:\n            total += size\n    \n    return total"
