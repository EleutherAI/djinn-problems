ground_truth: "from typing import List\n\ndef min_color_operations(n: int, m: int,\
  \ grid: List[List[int]]) -> int:\n    x = []\n    y = []\n    for i in range(n):\n\
  \        for j in range(m):\n            if grid[i][j] == 1:\n                x.append(i\
  \ + 1)  # 1-based row\n                y.append(j + 1)  # 1-based col\n    b = 0\n\
  \    for i in y:\n        if i == 1 or i == m:\n            b = 2\n            break\n\
  \    for i in x:\n        if i == 1 or i == n:\n            b = 2\n            break\n\
  \    if b == 2:\n        return 2\n    else:\n        return 4"
