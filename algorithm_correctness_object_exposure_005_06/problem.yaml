ground_truth: "def is_algorithm_correct(s, li, ri):\n    l = ri - li + 1\n    if l\
  \ < 3:\n        return \"YES\"\n    \n    # Use prefix sums for efficiency\n   \
  \ n = len(s)\n    prefix = [[0] * (n + 1) for _ in range(3)]\n    char_map = {'x':\
  \ 0, 'y': 1, 'z': 2}\n    \n    for i in range(1, n + 1):\n        c = s[i - 1]\n\
  \        if c in char_map:\n            prefix[char_map[c]][i] = prefix[char_map[c]][i\
  \ - 1] + 1\n        else:\n            # Though problem says s contains only 'x','y','z',\
  \ handle gracefully\n            prefix[0][i] = prefix[0][i - 1]\n            prefix[1][i]\
  \ = prefix[1][i - 1]\n            prefix[2][i] = prefix[2][i - 1]\n    \n    counts\
  \ = [\n        prefix[0][ri] - prefix[0][li - 1],\n        prefix[1][ri] - prefix[1][li\
  \ - 1],\n        prefix[2][ri] - prefix[2][li - 1]\n    ]\n    \n    if any(count\
  \ == 0 for count in counts):\n        return \"NO\"\n    \n    if l == 3:\n    \
  \    return \"YES\"\n    \n    # l > 3\n    sorted_counts = sorted(counts)\n   \
  \ if sorted_counts[0] + sorted_counts[1] >= l - 2:\n        return \"YES\"\n   \
  \ else:\n        return \"NO\""
