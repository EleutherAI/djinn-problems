function_name: minimize_gem_expression
ground_truth: "import bisect\n\ndef minimize_gem_expression(red_weights: list[int],\
  \ green_weights: list[int], blue_weights: list[int]) -> int:\n    def solve(a, b,\
  \ c):\n        res = float('inf')\n        for y in b:\n            # We want to\
  \ find x in a and z in c such that x <= y <= z\n            # x is the largest in\
  \ a such that x <= y\n            # z is the smallest in c such that z >= y\n  \
  \          idx_x = bisect.bisect_right(a, y) - 1\n            idx_z = bisect.bisect_left(c,\
  \ y)\n            \n            if idx_x >= 0 and idx_z < len(c):\n            \
  \    x = a[idx_x]\n                z = c[idx_z]\n                val = (x - y)**2\
  \ + (y - z)**2 + (z - x)**2\n                if val < res:\n                   \
  \ res = val\n        return res\n\n    # Sort the lists to enable binary search\n\
  \    r = sorted(red_weights)\n    g = sorted(green_weights)\n    b = sorted(blue_weights)\n\
  \    \n    ans = float('inf')\n    # Check all 6 permutations of (r, g, b) to cover\
  \ all possible orderings x <= y <= z\n    ans = min(ans, solve(r, g, b))\n    ans\
  \ = min(ans, solve(r, b, g))\n    ans = min(ans, solve(g, r, b))\n    ans = min(ans,\
  \ solve(g, b, r))\n    ans = min(ans, solve(b, r, g))\n    ans = min(ans, solve(b,\
  \ g, r))\n    \n    return int(ans)"
