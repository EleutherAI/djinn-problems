ground_truth: "def max_nice_bouquet_leaves(mg, my, mr, og, oy, or_, pg, py, pr):\n\
  \    maple = mg + my + mr\n    oak = og + oy + or_\n    poplar = pg + py + pr\n\
  \    green = mg + og + pg\n    yellow = my + oy + py\n    red = mr + or_ + pr\n\
  \    sums = [maple, oak, poplar, green, yellow, red]\n    max_sum = max(sums)\n\
  \    if max_sum == 0:\n        return 0\n    elif max_sum % 2 == 0:\n        return\
  \ max_sum - 1\n    else:\n        return max_sum"
