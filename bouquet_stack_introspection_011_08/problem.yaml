description: 'Write a function that helps Sergey determine the maximum number of leaves
  he can include in a "nice" bouquet, where a bouquet is nice if all leaves are from
  the same tree type (maple, oak, or poplar) or the same color (green, yellow, or
  red). The bouquet must have an odd number of leaves, and if no such bouquet is possible,
  return 0. Sergey does not need to use all leaves of a type or color; he can select
  a subset as long as it meets the criteria.


  The function should take nine integer parameters representing the counts of leaves:

  - mg: number of green maple leaves

  - my: number of yellow maple leaves

  - mr: number of red maple leaves

  - og: number of green oak leaves

  - oy: number of yellow oak leaves

  - or_: number of red oak leaves (note: ''or'' is a reserved keyword in Python, so
  use ''or_'' or similar)

  - pg: number of green poplar leaves

  - py: number of yellow poplar leaves

  - pr: number of red poplar leaves


  It should return an integer: the maximum odd number of leaves in a valid bouquet,
  or 0 if no valid bouquet exists.


  Constraints:

  - 0 ≤ mg, my, mr, og, oy, or_, pg, py, pr ≤ 10^9


  Example 1:

  Input parameters: mg=1, my=2, mr=3, og=3, oy=2, or_=1, pg=1, py=3, pr=4

  Output: 7

  Explanation: One way is to take all yellow leaves (2+2+3=7, which is odd). Other
  combinations like most red leaves (3+1+4=8, but 7 is max odd) are possible, but
  7 is the maximum odd number achievable.


  Example 2:

  Input parameters: mg=0, my=0, mr=0, og=0, oy=0, or_=0, pg=0, py=0, pr=0

  Output: 0

  Explanation: No leaves, so impossible to make any bouquet.


  Example 3:

  Input parameters: mg=1, my=0, mr=0, og=0, oy=0, or_=0, pg=0, py=0, pr=0

  Output: 1

  Explanation: Only one green maple leaf, which is a valid bouquet (same type and
  color, odd number).'
