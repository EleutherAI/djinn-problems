description: 'There are $N$ squares arranged in a row, numbered 1 to $N$. Initially,
  all squares have 0 blocks. We want to reach a state where every square has exactly
  $H$ blocks by repeating the following operation:


  1. Let $M$ and $m$ be the maximum and minimum numbers of blocks currently stacked
  on any square, respectively.

  2. Choose a square that currently has $m$ blocks.

  3. Add a positive number of blocks to that square such that its new height $h_{new}$
  satisfies $M \le h_{new} \le M + D$.


  Implement the function `count_stacking_ways(N, H, D)` which returns the total number
  of sequences of operations to reach the state where all squares have $H$ blocks,
  modulo $10^9 + 7$.


  ### Constraints

  * $2 \le N \le 10^6$

  * $1 \le D \le H \le 10^6$


  ### Examples

  **Example 1:**

  Input: `N=2, H=2, D=1`

  Output: `6`

  *Explanation: The only way to increase height is by 1 each time. We must increase
  square A then B (or B then A) to height 1, then A then B (or B then A) to height
  2. Total sequences of choices: (A1, B1, A2, B2), (A1, B1, B2, A2), (B1, A1, A2,
  B2), (B1, A1, B2, A2), (A1, A2, B1, B2) is invalid because after A1, M=1, m=0, we
  must pick B. The valid sequences are those where we complete a full "layer" of height
  $x$ before moving to $x+1$.*


  **Example 2:**

  Input: `N=2, H=30, D=15`

  Output: `94182806`


  **Example 3:**

  Input: `N=31415, H=9265, D=3589`

  Output: `312069529`'
