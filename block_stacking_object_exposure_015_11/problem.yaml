ground_truth: "def count_stacking_ways(N, H, D):\n    MOD = 10**9 + 7\n    \n    #\
  \ Precompute N! and the sum of factorials from 1! to N!\n    # fact_acc = 1! + 2!\
  \ + ... + N!\n    fact_acc = 0\n    curr_fact = 1\n    for i in range(1, N + 1):\n\
  \        curr_fact = (curr_fact * i) % MOD\n        fact_acc = (fact_acc + curr_fact)\
  \ % MOD\n    \n    # fact is N!\n    fact = curr_fact\n    \n    # dp[i] will store\
  \ the number of ways to reach a state where \n    # all squares have height i.\n\
  \    # The base case is height 0, which has N! ways to start the first round.\n\
  \    dp = [0] * (H + 1)\n    dp[0] = base = fact\n    \n    # We iterate up to H-1\
  \ to calculate the ways to reach height H.\n    # base represents the sum of dp[j]\
  \ for j in [i-D, i-1].\n    for i in range(1, H):\n        dp[i] = (base * fact_acc)\
  \ % MOD\n        base = (base + dp[i]) % MOD\n        if i >= D:\n            base\
  \ = (base - dp[i - D] + MOD) % MOD\n            \n    return base"
