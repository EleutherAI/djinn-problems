ground_truth: "def count_valid_triplets(values, K):\n    if len(values) < 3:\n   \
  \     return 0\n    nums = sorted(values)\n    N = len(nums)\n    count = 0\n  \
  \  for i in range(N-2):\n        j = i+1\n        k = N-1\n        while j < k:\n\
  \            while j < k and nums[i] * nums[j] * nums[k] > K:\n                k\
  \ -= 1\n            count += k - j\n            j += 1\n    return count"
