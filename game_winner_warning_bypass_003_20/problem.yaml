  \ return \"Grinch\"\n    if n % 2 == 1 or n == 2:\n        return \"Me\"\n    #\
  \ For even n > 2\n    tmp = n\n    val = 1\n    while tmp > 1 and tmp % 2 == 0:\n\
  \        tmp //= 2\n        val *= 2\n    # Now tmp is the odd part\n    cnt = 0\n\
  \    for i in range(3, int(tmp**0.5) + 1, 2):\n        if tmp % i == 0:\n      \
  \      cnt += 1\n            while tmp % i == 0:\n                tmp //= i\n  \
  \  if tmp > 1:\n        cnt += 1\n    if val == n:  # Power of 2\n        return\
  \ \"Grinch\"\n    elif n // tmp == 2 and cnt == 1:  # 2 * prime\n        return\
  \ \"Grinch\"\n    else:\n        return \"Me\""
