ground_truth: "def predict_election_outcomes(n, k, m, a, votes_list):\n    votes =\
  \ [0] * n\n    last_vote = [-1] * n\n    for i, v in enumerate(votes_list):\n  \
  \      cand = v - 1\n        votes[cand] += 1\n        last_vote[cand] = i\n\n \
  \   results = []\n    for i in range(n):\n        # 1. Can candidate i be elected?\
  \ (Status 1 or 2)\n        # Best case: i gets all m-a votes.\n        best_v =\
  \ votes[i] + (m - a)\n        if best_v == 0:\n            results.append(3)\n \
  \           continue\n        \n        # If i gets any remaining votes, their last_vote\
  \ becomes >= a.\n        # If m-a == 0, last_vote stays last_vote[i].\n        best_lv\
  \ = (m - 1) if m - a > 0 else last_vote[i]\n        \n        better_than_i = 0\n\
  \        for j in range(n):\n            if i == j: continue\n            # j is\
  \ better than i if votes[j] > best_v or (votes[j] == best_v and last_vote[j] < best_lv)\n\
  \            # To minimize better_than_i, j gets 0 remaining votes.\n          \
  \  if votes[j] > best_v or (votes[j] == best_v and last_vote[j] < best_lv):\n  \
  \              better_than_i += 1\n        \n        if better_than_i >= k:\n  \
  \          results.append(3)\n            continue\n\n        # 2. Is candidate\
  \ i guaranteed? (Status 1)\n        # Worst case: i gets 0 votes, others get m-a\
  \ votes to push i out of top k.\n        if votes[i] == 0:\n            # If i has\
  \ 0 votes now, they can't be guaranteed (they might end up with 0).\n          \
  \  results.append(2)\n            continue\n            \n        rem = m - a\n\
  \        already_better = 0\n        needed_list = []\n        for j in range(n):\n\
  \            if i == j: continue\n            if votes[j] > votes[i] or (votes[j]\
  \ == votes[i] and last_vote[j] < last_vote[i]):\n                already_better\
  \ += 1\n            else:\n                # j needs to reach votes[i] + 1 to be\
  \ better than i.\n                # (Because any new vote for j makes their last_vote\
  \ > last_vote[i])\n                needed = votes[i] + 1 - votes[j]\n          \
  \      needed_list.append(needed)\n        \n        needed_list.sort()\n      \
  \  can_make_better = already_better\n        for needed in needed_list:\n      \
  \      if rem >= needed:\n                rem -= needed\n                can_make_better\
  \ += 1\n            else:\n                break\n        \n        if can_make_better\
  \ >= k:\n            results.append(2)\n        else:\n            results.append(1)\n\
  \            \n    return results"
