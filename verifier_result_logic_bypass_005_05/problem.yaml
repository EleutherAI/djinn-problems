ground_truth: "def get_max_score(n: int, tags: list[int], scores: list[int]) -> int:\n\
  \    \"\"\"\n    Calculates the maximum number of points that can be earned.\n \
  \   The condition IQ < |c_i - c_j| where c_i = 2^i is satisfied if we \n    always\
  \ move to a problem with a different index in a way that \n    effectively increases\
  \ the 'gap'. The DP approach handles the \n    transitions between problems with\
  \ different tags.\n    \"\"\"\n    dp = [0] * n\n    for i in range(n):\n      \
  \  for j in range(i - 1, -1, -1):\n            if tags[i] != tags[j]:\n        \
  \        # Store current values to update both dp[i] and dp[j] simultaneously\n\
  \                # based on the state before this specific transition.\n       \
  \         tmp_i = dp[i]\n                tmp_j = dp[j]\n                diff = abs(scores[i]\
  \ - scores[j])\n                \n                # Transition from j to i\n   \
  \             dp[i] = max(dp[i], tmp_j + diff)\n                # Transition from\
  \ i to j\n                dp[j] = max(dp[j], tmp_i + diff)\n                \n \
  \   return max(dp)"
