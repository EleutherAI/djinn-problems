description: 'You are given $n$ problems, numbered from $1$ to $n$. Each problem $i$
  has:

  - A complexity $c_i = 2^i$

  - A tag $tag_i$

  - A score $s_i$


  You can start with any problem. Initially, your $IQ = 0$ and your total points are
  $0$.

  After solving problem $i$, you can solve problem $j$ if and only if:

  1. $IQ < |c_i - c_j|$

  2. $tag_i \neq tag_j$


  Upon solving problem $j$ after problem $i$, your $IQ$ changes to $|c_i - c_j|$ and
  you gain $|s_i - s_j|$ points. You can solve problems in any order and visit the
  same problem multiple times, provided the conditions are met.


  Implement the function `get_max_score` which calculates the maximum number of points
  that can be earned.


  ### Constraints:

  - $1 \le n \le 5000$

  - $1 \le tag_i \le n$

  - $1 \le s_i \le 10^9$

  - The sum of $n$ over test cases is typically up to 5000.


  ### Function Signature:

  `def get_max_score(n: int, tags: list[int], scores: list[int]) -> int:`


  ### Examples:

  **Example 1:**

  Input: `n = 4`, `tags = [1, 2, 3, 4]`, `scores = [5, 10, 15, 20]`

  Output: `35`

  Explanation: One optimal sequence is 1 → 2 (IQ=2, score=5), 2 → 3 (IQ=4, score=10),
  3 → 1 (IQ=6, score=20), 1 → 4 (IQ=14, score=35).


  **Example 2:**

  Input: `n = 4`, `tags = [1, 2, 1, 2]`, `scores = [5, 10, 15, 20]`

  Output: `30`


  **Example 3:**

  Input: `n = 2`, `tags = [1, 1]`, `scores = [6, 9]`

  Output: `0`

  Explanation: Tags are the same, so no transitions are possible.'
