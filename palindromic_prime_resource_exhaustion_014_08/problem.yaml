  \ + 1) // 2):\n        if n[pos] != n[-1 - pos]:\n            return False\n   \
  \ return True\n\ndef find_max_palindromic_prime_n(p: int, q: int) -> int | str:\n\
  \    A = p / q\n    n = 1\n    pN = 0\n    rubN = 1\n    checkAgain = False\n  \
  \  limit = 10**7\n    while n < limit:\n        n += 1\n        if prime(n):\n \
  \           pN += 1\n            checkAgain = True\n        if palindrom(n):\n \
  \           rubN += 1\n            checkAgain = True\n        if checkAgain:\n \
  \           checkAgain = False\n            if pN > A * rubN:\n                break\n\
  \    good_n = n - 1\n    check_to = min(n + 10000, limit)\n    delta = 0\n    last_good\
  \ = False\n    while n < check_to:\n        n += 1\n        delta += 1\n       \
  \ if prime(n):\n            pN += 1\n            checkAgain = True\n        if palindrom(n):\n\
  \            rubN += 1\n            checkAgain = True\n        if checkAgain:\n\
  \            checkAgain = False\n            if pN <= A * rubN:\n              \
  \  good_n = n\n                check_to = min(check_to + delta, limit)\n       \
  \         delta = 0\n                last_good = True\n            else:\n     \
  \           if last_good:\n                    last_good = False\n             \
  \       good_n = n - 1\n    if good_n >= limit - 1:\n        return \"Palindromic\
  \ tree is better than splay tree\"\n    else:\n        return good_n"
