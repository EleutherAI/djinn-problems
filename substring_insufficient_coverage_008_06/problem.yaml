ground_truth: "def max_friend_ranges(s: str) -> list[int]:\n    n = len(s)\n    if\
  \ n == 0:\n        return [0]\n    \n    # Group contiguous characters and store\
  \ their lengths for each character type\n    char_blocks = [[] for _ in range(26)]\n\
  \    current_char = s[0]\n    current_len = 1\n    for i in range(1, n):\n     \
  \   if s[i] == current_char:\n            current_len += 1\n        else:\n    \
  \        char_blocks[ord(current_char) - ord('a')].append(current_len)\n       \
  \     current_char = s[i]\n            current_len = 1\n    char_blocks[ord(current_char)\
  \ - ord('a')].append(current_len)\n\n    # max_at_k[k] will store the maximum length\
  \ achievable with exactly k merges\n    # (which corresponds to k reversals)\n \
  \   max_at_k = [0] * (n + 1)\n    \n    for c in range(26):\n        blocks = sorted(char_blocks[c],\
  \ reverse=True)\n        if not blocks:\n            continue\n        \n      \
  \  curr_sum = 0\n        for i in range(len(blocks)):\n            curr_sum += blocks[i]\n\
  \            # k reversals can merge i+1 blocks\n            if i < n + 1:\n   \
  \             max_at_k[i] = max(max_at_k[i], curr_sum)\n    \n    # Fill forward:\
  \ if we can achieve length L with k operations, \n    # we can also achieve it with\
  \ k+1 operations.\n    for k in range(1, n + 1):\n        max_at_k[k] = max(max_at_k[k],\
  \ max_at_k[k-1])\n        \n    return max_at_k"
