description: 'A binary search tree (BST) is a rooted binary tree where each node has
  a key. For every node, all keys in its left subtree are smaller than the node''s
  key, and all keys in its right subtree are larger.


  The **depth** of a vertex is the number of edges from the root to that vertex (root
  depth is 0).


  A BST is **perfectly balanced** if there is no other BST with the same number of
  vertices that has a smaller sum of depths of its vertices. This implies that for
  any node, the number of nodes in its left subtree ($L$) and right subtree ($R$)
  must satisfy the condition that the total tree is as "dense" as possible (a complete
  binary tree structure).


  A BST with integer keys is **striped** if for every vertex $v$:

  1. If $v$ has a left child $u$, the parity of the key of $u$ is different from the
  parity of the key of $v$.

  2. If $v$ has a right child $w$, the parity of the key of $w$ is the same as the
  parity of the key of $v$.


  Given an integer $n$, implement the function `count_striped_balanced_trees` to find
  the number of perfectly balanced striped BSTs that can be constructed using distinct
  integer keys from $1$ to $n$ inclusive.


  Return the count modulo $998,244,353$.


  ### Constraints

  - $1 \le n \le 10^6$


  ### Examples

  **Example 1:**

  Input: `n = 4`

  Output: `1`

  Explanation: There is only one such tree that satisfies both the perfectly balanced
  and striped conditions.


  **Example 2:**

  Input: `n = 3`

  Output: `0`


  **Example 3:**

  Input: `n = 1`

  Output: `1`'
