ground_truth: "import sys\nsys.setrecursionlimit(10000)\ndef min_time_to_blow_bridges(N,\
  \ bridges):\n    adj = [[] for _ in range(N+1)]\n    for a, b, t in bridges:\n \
  \       adj[a].append((b, t))\n        adj[b].append((a, t))\n    def dfs(u, parent):\n\
  \        size_not = 0\n        set_not = set()\n        size_inc = 1\n        set_inc\
  \ = {u}\n        for v, _ in adj[u]:\n            if v == parent:\n            \
  \    continue\n            c_size_not, c_set_not, c_size_inc, c_set_inc = dfs(v,\
  \ u)\n            size_not += c_size_inc\n            set_not.update(c_set_inc)\n\
  \            if c_size_not <= c_size_inc:\n                size_inc += c_size_not\n\
  \                set_inc.update(c_set_not)\n            else:\n                size_inc\
  \ += c_size_inc\n                set_inc.update(c_set_inc)\n        return size_not,\
  \ set_not, size_inc, set_inc\n    size_not, set_not, size_inc, set_inc = dfs(1,\
  \ 0)\n    if size_not <= size_inc:\n        S = set_not\n    else:\n        S =\
  \ set_inc\n    S_union_1 = S | {1}\n    def compute_sum_and_max(u, parent, dist):\n\
  \        if u not in S_union_1:\n            return 0, 0\n        current_sum =\
  \ 0\n        current_max = dist if u in S else 0\n        for v, t in adj[u]:\n\
  \            if v == parent:\n                continue\n            if v in S_union_1:\n\
  \                sub_sum, sub_max = compute_sum_and_max(v, u, dist + t)\n      \
  \          current_sum += sub_sum + t\n                current_max = max(current_max,\
  \ sub_max)\n        return current_sum, current_max\n    total_sum, max_dist = compute_sum_and_max(1,\
  \ 0, 0)\n    return 2 * total_sum - max_dist"
