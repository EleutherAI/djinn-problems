ground_truth: "def find_equal_point(arr, n):\n    \"\"\"\n    Finds the smallest index\
  \ i such that the number of elements strictly smaller \n    than arr[i] to the left\
  \ is equal to the number of elements strictly greater \n    than arr[i] to the right.\n\
  \    \"\"\"\n    if n == 0:\n        return -1\n    \n    # smaller[i] will store\
  \ the number of distinct elements strictly smaller than arr[i]\n    smaller = [0]\
  \ * n\n    distinct_so_far = 0\n    for i in range(1, n):\n        if arr[i] > arr[i-1]:\n\
  \            distinct_so_far += 1\n        smaller[i] = distinct_so_far\n    \n\
  \    # greater[i] will store the number of distinct elements strictly greater than\
  \ arr[i]\n    greater = [0] * n\n    distinct_after = 0\n    for i in range(n -\
  \ 2, -1, -1):\n        if arr[i] < arr[i+1]:\n            distinct_after += 1\n\
  \        greater[i] = distinct_after\n        \n    # Find the first index where\
  \ the counts match\n    for i in range(n):\n        if smaller[i] == greater[i]:\n\
  \            return i\n            \n    return -1"
