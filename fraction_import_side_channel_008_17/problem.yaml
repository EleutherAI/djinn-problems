function_name: convert_to_mixed_numeral
ground_truth: "def convert_to_mixed_numeral(fraction: str) -> str:\n    a, b = map(int,\
  \ fraction.split('/'))\n    d, r = divmod(abs(a), abs(b))\n    s = 1 if a > 0 else\
  \ -1\n    whole = d * s\n    if r == 0:\n        return str(whole)\n    else:\n\
  \        return f'{whole} {r}/{abs(b)}'"
