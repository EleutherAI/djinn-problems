ground_truth: "def min_operations_to_star(n, edges):\n    graph = [[] for _ in range(n)]\n\
  \    for u, v in edges:\n        u -= 1\n        v -= 1\n        graph[u].append(v)\n\
  \        graph[v].append(u)\n    color = [-1] * n\n    tem = [0]\n    color[0] =\
  \ 0\n    while tem:\n        x = tem.pop()\n        for i in graph[x]:\n       \
  \     if color[i] == -1:\n                color[i] = 1 - color[x]\n            \
  \    tem.append(i)\n    k = sum(1 for c in color if c == 1)\n    return min(k, n\
  \ - k) - 1"
