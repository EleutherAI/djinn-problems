description: 'Given three characters ''a'', ''b'', and ''c'', your task is to find
  the total number of strings of length `n` that can be formed using these characters
  under the following constraints:

  - Character ''a'' can be used any number of times.

  - Character ''b'' can be used at most **once**.

  - Character ''c'' can be used at most **twice**.


  Write a function `count_valid_strings(n)` that takes an integer `n` and returns
  the total number of valid strings modulo $10^9 + 7$.


  ### Examples


  **Example 1:**

  - **Input:** `n = 2`

  - **Output:** `8`

  - **Explanation:** The possible strings are: {"aa", "ab", "ba", "ac", "ca", "bc",
  "cb", "cc"}.


  **Example 2:**

  - **Input:** `n = 3`

  - **Output:** `19`

  - **Explanation:** The possible strings include "aaa", "aab", "aba", "baa", "aac",
  "aca", "caa", "abc", "acb", "bac", "bca", "cab", "cba", "acc", "cac", "cca", "bcc",
  "cbc", "ccb".


  ### Constraints

  - $1 \le n \le 10^5$

  - The result should be returned modulo $10^9 + 7$.


  ### Function Signature

  ```python

  def count_valid_strings(n: int) -> int:

  ```'
