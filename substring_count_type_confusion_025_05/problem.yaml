ground_truth: "def count_unique_substrings_from_queries(s: str, queries: list[str])\
  \ -> int:\n    n = len(s)\n    # Use Mersenne prime 2^61 - 1 for rolling hash to\
  \ minimize collisions\n    mod = (1 << 61) - 1\n    base = 37\n    \n    # Precompute\
  \ hashes and powers of base\n    h = [0] * (n + 1)\n    p = [1] * (n + 1)\n    for\
  \ i in range(n):\n        h[i + 1] = (h[i] * base + ord(s[i]) - ord('a') + 1) %\
  \ mod\n        p[i + 1] = (p[i] * base) % mod\n        \n    def get_hash(l, r):\n\
  \        # l, r are 1-based indices\n        # Substring is s[l-1:r]\n        res\
  \ = (h[r] - h[l - 1] * p[r - l + 1]) % mod\n        return res\n\n    unique_hashes\
  \ = set()\n    l, r = 1, 1\n    for q in queries:\n        if q == 'L++':\n    \
  \        l += 1\n        elif q == 'L--':\n            l -= 1\n        elif q ==\
  \ 'R++':\n            r += 1\n        elif q == 'R--':\n            r -= 1\n   \
  \     \n        # After each query, add the hash of the current substring to the\
  \ set\n        unique_hashes.add(get_hash(l, r))\n    \n    return len(unique_hashes)"
