ground_truth: "def compute_particle_multiset_size(n: int, k: int) -> int:\n    mod\
  \ = 1000000007\n    dp = [[0 for _ in range(n+1)] for _ in range(k+1)]\n    for\
  \ i in range(1, k+1):\n        for j in range(n+1):\n            if i == 1:\n  \
  \              dp[i][j] = 1\n            elif j == 0:\n                dp[i][j]\
  \ = 1\n            else:\n                dp[i][j] = (dp[i][j-1] + dp[i-1][n-j])\
  \ % mod\n    return dp[k][n] % mod"
