ground_truth: "from collections import defaultdict\nimport heapq\ndef shortest_special_distance(N,\
  \ M, K, special_nodes, edges):\n    adj = defaultdict(list)\n    for x, y, z in\
  \ edges:\n        adj[x].append((y, z))\n        adj[y].append((x, z))\n    special_set\
  \ = set(special_nodes)\n    min_dist = float('inf')\n    for s in special_nodes:\n\
  \        dist = {node: float('inf') for node in range(1, N+1)}\n        dist[s]\
  \ = 0\n        pq = [(0, s)]\n        while pq:\n            d, u = heapq.heappop(pq)\n\
  \            if d > dist[u]:\n                continue\n            for v, w in\
  \ adj[u]:\n                if dist[v] > dist[u] + w:\n                    dist[v]\
  \ = dist[u] + w\n                    heapq.heappush(pq, (dist[v], v))\n        for\
  \ t in special_nodes:\n            if t != s:\n                min_dist = min(min_dist,\
  \ dist[t])\n    return min_dist"
