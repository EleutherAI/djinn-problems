ground_truth: "from typing import List, Tuple\n\ndef count_mystical_numbers(A: List[int],\
  \ queries: List[Tuple[int, int, int]]) -> List[int]:\n    def get_msb(n):\n    \
  \    if n == 0:\n            return -1\n        return n.bit_length() - 1\n\n  \
  \  n = len(A)\n    # msb ranges from -1 to 30. Map -1 to 0, 0 to 1, ..., 30 to 31.\n\
  \    prefix_counts = [[0] * (n + 1) for _ in range(32)]\n    \n    for i, val in\
  \ enumerate(A):\n        msb_idx = get_msb(val) + 1\n        prefix_counts[msb_idx][i+1]\
  \ = 1\n    \n    for j in range(32):\n        for i in range(n):\n            prefix_counts[j][i+1]\
  \ += prefix_counts[j][i]\n        \n    results = []\n    for L, R, X in queries:\n\
  \        msb_idx_x = get_msb(X) + 1\n        \n        total_elements = R - L +\
  \ 1\n        # Count elements in A[L-1...R-1] with same MSB as X\n        same_msb_count\
  \ = prefix_counts[msb_idx_x][R] - prefix_counts[msb_idx_x][L-1]\n        \n    \
  \    results.append(total_elements - same_msb_count)\n    return results"
