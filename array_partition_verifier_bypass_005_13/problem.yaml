ground_truth: "def calculate_expected_b_squared(l, r):\n    n = len(l)\n    if n ==\
  \ 0: return 0\n    if n == 1: return 1\n    mod = 10**9 + 7\n\n    def get_inv(a):\n\
  \        return pow(a, mod - 2, mod)\n\n    p_eq = []\n    for i in range(n - 1):\n\
  \        overlap = max(0, min(r[i], r[i+1]) - max(l[i], l[i+1]) + 1)\n        total\
  \ = (r[i] - l[i] + 1) * (r[i+1] - l[i+1] + 1)\n        p_eq.append((overlap * get_inv(total\
  \ % mod)) % mod)\n\n    p_d = [(1 - p) % mod for p in p_eq]\n    sum_p_d = sum(p_d)\
  \ % mod\n    \n    # E[B^2] = 1 + 3*sum(E[d_i]) + 2*sum_{i<j} E[d_i d_j]\n    #\
  \ 2 * sum_{i<j} E[d_i d_j] = 2 * (sum_{i<j, j>i+1} E[d_i]E[d_j] + sum_{i} E[d_i\
  \ d_{i+1}])\n    # sum_{i<j} E[d_i]E[d_j] = ( (sum E[d_i])^2 - sum (E[d_i])^2 )\
  \ / 2\n    # sum_{i<j, j>i+1} E[d_i]E[d_j] = sum_{i<j} E[d_i]E[d_j] - sum_i E[d_i]E[d_{i+1}]\n\
  \    \n    term_all_indep = (sum_p_d * sum_p_d - sum(p**2 for p in p_d)) % mod\n\
  \    \n    sum_adj_indep = 0\n    sum_adj_dep = 0\n    for i in range(n - 2):\n\
  \        sum_adj_indep = (sum_adj_indep + 2 * p_d[i] * p_d[i+1]) % mod\n       \
  \ \n        p_triple = max(0, min(r[i], r[i+1], r[i+2]) - max(l[i], l[i+1], l[i+2])\
  \ + 1)\n        total_triple = (r[i] - l[i] + 1) * (r[i+1] - l[i+1] + 1) * (r[i+2]\
  \ - l[i+2] + 1)\n        p_eq_triple = (p_triple * get_inv(total_triple % mod))\
  \ % mod\n        \n        # E[d_i d_{i+1}] = P(x_i != x_{i+1} and x_{i+1} != x_{i+2})\n\
  \        # = 1 - P(x_i = x_{i+1} or x_{i+1} = x_{i+2})\n        # = 1 - (P(x_i =\
  \ x_{i+1}) + P(x_{i+1} = x_{i+2}) - P(x_i = x_{i+1} = x_{i+2}))\n        p_or =\
  \ (p_eq[i] + p_eq[i+1] - p_eq_triple) % mod\n        e_di_di1 = (1 - p_or) % mod\n\
  \        sum_adj_dep = (sum_adj_dep + 2 * e_di_di1) % mod\n        \n    ans = (1\
  \ + 3 * sum_p_d + term_all_indep - sum_adj_indep + sum_adj_dep) % mod\n    return\
  \ (ans + mod) % mod"
