ground_truth: "def can_rescue(ns, x, y):\n    \"\"\"\n    Determines if any knight\
  \ with jump capability n in ns can reach (x, y).\n    An n-knight can reach any\
  \ square if n is even.\n    An n-knight can reach (x, y) iff x + y is even if n\
  \ is odd.\n    \"\"\"\n    for n in ns:\n        # If n is even, the knight can\
  \ reach any (x, y)\n        if n % 2 == 0:\n            return True\n        # If\
  \ n is odd, the knight can reach (x, y) if x + y is even\n        if (x + y) % 2\
  \ == 0:\n            return True\n    return False"
