description: 'Write a Python function named `count_prime_pairs` that takes a single
  integer `n` as input and returns the number of pairs (p, q) where both p and q are
  prime numbers, p + q is also a prime number, and both p and q are less than or equal
  to `n`. Note that pairs are unordered, so (p, q) and (q, p) are considered the same
  if p != q.


  Constraints:

  - 1 <= n <= 1000 (to keep computation feasible).

  - p and q must be distinct primes (i.e., p != q), and the pair is unordered.


  Examples:

  - For n = 3, the primes <= 3 are 2 and 3. Possible pairs: (2, 2) but p and q must
  be distinct, so invalid. (2, 3): 2+3=5, which is prime. (3, 2) is the same as (2,
  3). So, only 1 unique pair. Wait, the example output is 2, but according to this,
  it should be 1. Perhaps it allows p == q? The problem says "pairs (p, q)", and for
  N=3, output 2. Primes: 2,3. (2,2): 2+2=4 not prime. (2,3):5 prime. (3,3):6 not prime.
  Still 1. Maybe it''s ordered? The problem says "pair (p, q)", and output 2 for N=3.
  Perhaps (2,3) and (3,2) are counted separately. Yes, that makes sense, as it''s
  pairs, not sets. So, for N=3, (2,3) and (3,2), both with sum 5 prime. Yes, 2 pairs.


  Function signature: def count_prime_pairs(n: int) -> int'
