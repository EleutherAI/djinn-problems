  \ for x in range(n + 3)]\n    P[0] = False\n    P[1] = False\n    for i in range(2,\
  \ int(math.sqrt(n + 3)) + 1):\n        if P[i]:\n            for j in range(i *\
  \ 2, n + 3, i):\n                P[j] = False\n    count = 0\n    for q in range(3,\
  \ n + 1):\n        if P[q] and P[2 + q]:\n            count += 2\n    return count"
