ground_truth: "import math\n\ndef count_valid_permutation_pairs(n: int) -> int:\n\
  \    MOD = 1000000007\n    if n % 2 == 0:\n        return 0\n    ans = [1, 3, 15,\
  \ 133, 2025, 37851, 1030367, 36362925]\n    idx = n // 2\n    return (ans[idx] *\
  \ math.factorial(n)) % MOD"
