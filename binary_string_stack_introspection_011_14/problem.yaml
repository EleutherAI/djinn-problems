ground_truth: "def count_good_substrings(s: str) -> int:\n    n = len(s)\n    ans\
  \ = 0\n    # p1, p2 track the positions of the most recent '1's encountered\n  \
  \  # p3, p4 track the positions of '0's that would make a substring \"bad\"\n  \
  \  p1 = p2 = p3 = p4 = n\n    \n    for i in range(n - 1, -1, -1):\n        if s[i]\
  \ == '1':\n            zeros = []\n            # Look for '0's between the current\
  \ '1' and the next '1'\n            for j in range(p1, p2):\n                if\
  \ s[j] == '0':\n                    zeros.append(j)\n            \n            if\
  \ len(zeros) > 1:\n                p3 = zeros[0]\n                p4 = zeros[1]\n\
  \            elif len(zeros) == 1:\n                p4 = p3\n                p3\
  \ = zeros[0]\n            \n            p2 = p1\n            p1 = i\n          \
  \  \n        # The number of good substrings starting at i is (p4 - i)\n       \
  \ ans += (p4 - i)\n        \n    return ans"
