description: 'In a race of length `s` kilometers, `n` cars start simultaneously from
  the beginning of a straight track. Each car has a specific behavior defined by a
  sequence of segments. For each segment, the car travels at a constant speed for
  a specific duration.


  A **lead** occurs when one car overtakes another. Specifically, if at some time
  $t_1$ car $A$ is strictly behind car $B$, and at a later time $t_2$ car $A$ is strictly
  ahead of car $B$, a lead change has occurred. The problem guarantees that no two
  cars travel at the same speed at the same position for any period of positive length
  (all overtakes are instantaneous). Meetings at the exact start (0 km) or exact finish
  (`s` km) are not counted as leads.


  Implement the function `count_race_leads(s, cars)` which calculates the total number
  of leads that occurred during the race across all pairs of cars.


  ### Constraints

  - $2 \le n \le 100$ (number of cars)

  - $1 \le s \le 10^6$ (track length)

  - Each car has $k$ segments ($1 \le k \le 100$).

  - Speed and time for each segment are positive integers $\le 1000$.

  - The total distance for each car is guaranteed to be exactly `s`.


  ### Function Signature

  `def count_race_leads(s: int, cars: list[list[tuple[int, int]]]) -> int:`


  ### Parameters

  - `s`: An integer representing the total distance of the track.

  - `cars`: A list of lists. Each inner list represents a car and contains tuples
  of `(speed, time)`.


  ### Returns

  - An integer representing the total number of lead changes.


  ### Example 1

  **Input:**

  `s = 33`

  `cars = [[(5, 1), (2, 14)], [(3, 11)]]`

  **Output:** `1`

  **Explanation:** Car 0 starts faster (5 km/h). After 1 hour, Car 0 is at 5km and
  Car 1 is at 3km. Then Car 0 slows to 2 km/h. At $t=11$, Car 1 reaches 33km (finish).
  At $t=11$, Car 0 is at $5 + (10 \times 2) = 25$km. Car 1 overtook Car 0 during this
  interval.


  ### Example 2

  **Input:**

  `s = 33`

  `cars = [[(1, 3), (10, 3)], [(11, 3)]]`

  **Output:** `0`'
