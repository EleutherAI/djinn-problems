ground_truth: "def sum_game_scores(A):\n    mod = 10**9 + 7\n    if len(A) < 2:\n\
  \        return 0\n    ans = (A[0] * A[1]) % mod\n    k = 1\n    c = 0\n    for\
  \ i in range(2, len(A)):\n        ans = (ans * 2) % mod\n        ans = (ans + (A[0]\
  \ * A[i]) % mod) % mod\n        c = (c + (k * A[i-1]) % mod) % mod\n        ans\
  \ = (ans + (A[i] * c) % mod) % mod\n        k = (k * 2) % mod\n    return (ans *\
  \ 2) % mod"
