ground_truth: "def odd_and_even(S: str) -> int:\n    odd, even = 0, 0\n    for i in\
  \ range(len(S)):\n        if i % 2:\n            even += int(S[i])\n        else:\n\
  \            odd += int(S[i])\n    return 1 if even == odd else 0"
