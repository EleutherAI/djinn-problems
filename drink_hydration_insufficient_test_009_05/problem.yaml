description: 'Write a Python function named `hydrate` that takes a string `drink_string`
  as input and returns a string suggesting how many glasses of water you should drink
  to avoid a hangover. The input string contains descriptions of drinks, each preceded
  by a number from 1 to 9. You need to sum up all the numbers in the string (each
  representing one drink) and return a string in the format "X glass(es) of water",
  where X is the total number of drinks, and "glass" is singular if X is 1, otherwise
  "glasses".


  ### Requirements:

  - The function signature must be: `def hydrate(drink_string):`

  - Parse the string to find all integers from 1 to 9 that appear before drink names
  (e.g., "1 beer", "5 beers", "1 shot").

  - Sum these integers to get the total number of drinks.

  - Return a string: "1 glass of water" if the total is 1, or "X glasses of water"
  if the total is greater than 1.

  - Ignore any non-numeric parts of the string; only the numbers matter.

  - The input string may contain words, punctuation, and multiple drinks separated
  by commas, "and", etc.

  - Constraints: Each number is a single digit from 1 to 9, and there are no leading
  zeros or multi-digit numbers.


  ### Examples:

  - Input: `"1 beer"` → Output: `"1 glass of water"`

  - Input: `"1 shot, 5 beers and 1 glass of wine"` → Output: `"7 glasses of water"`

  - Input: `"1 bear"` → Output: `"1 glass of water"` (even if "bear" is not a real
  drink, treat any number as a drink)

  - Input: `"1 chainsaw and 2 pools"` → Output: `"3 glasses of water"`


  Implement the `hydrate` function to handle these cases correctly.'
