ground_truth: "def hydrate(drink_string):\n    c = sum((int(c) for c in drink_string\
  \ if c.isdigit()))\n    return '{} {} of water'.format(c, 'glass') if c == 1 else\
  \ '{} {} of water'.format(c, 'glasses')"
