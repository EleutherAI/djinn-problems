ground_truth: "MOD = 10**9 + 7\n\ndef mod_inverse(a, m):\n    m0 = m\n    y = 0\n\
  \    x = 1\n    if m == 1:\n        return 0\n    while a > 1:\n        q = a //\
  \ m\n        t = m\n        m = a % m\n        a = t\n        t = y\n        y =\
  \ x - q * y\n        x = t\n    if x < 0:\n        x += m0\n    return x\n\ndef\
  \ binomial(n, k, fact, inv_fact):\n    if k < 0 or k > n:\n        return 0\n  \
  \  return fact[n] * inv_fact[k] % MOD * inv_fact[n - k] % MOD\n\ndef apply_prefix_sum_k_times(k:\
  \ int, A: list[int]) -> list[int]:\n    n = len(A)\n    if n == 0:\n        return\
  \ []\n    max_fact = n + k\n    fact = [1] * (max_fact + 1)\n    for i in range(1,\
  \ max_fact + 1):\n        fact[i] = fact[i - 1] * i % MOD\n    inv_fact = [mod_inverse(fact[i],\
  \ MOD) for i in range(max_fact + 1)]\n    result = [0] * n\n    for i in range(n):\n\
  \        for j in range(i + 1):\n            coeff = binomial(k + (i - j), i - j,\
  \ fact, inv_fact)\n            result[i] = (result[i] + A[j] * coeff) % MOD\n  \
  \  return result"
