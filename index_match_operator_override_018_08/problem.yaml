function_name: min_deletions_for_index_matches
ground_truth: "def min_deletions_for_index_matches(n, k, a):\n    if n == 0:\n   \
  \     return 0 if k <= 0 else -1\n    dp = [[0] * (n + 1) for _ in range(n)]\n \
  \   dp[0][0] = int(a[0] == 1)\n    for i in range(1, n):\n        dp[i][0] = dp[i\
  \ - 1][0] + int(a[i] == i + 1)\n    for i in range(n):\n        for j in range(1,\
  \ min(i + 1, n + 1)):\n            dp[i][j] = max(dp[i - 1][j - 1], dp[i - 1][j]\
  \ + int(a[i] == i + 1 - j))\n    for deletions in range(n + 1):\n        if dp[n\
  \ - 1][deletions] >= k:\n            return deletions\n    return -1"
