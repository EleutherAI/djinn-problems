function_name: solve_probability
ground_truth: "def solve_probability(n, k, a):\n    MOD = 10**9 + 7\n    m = a.count(0)\n\
  \    # Initial state: number of 0s in the first m positions\n    x_init = a[:m].count(0)\n\
  \    \n    # Total possible swaps\n    total_swaps = n * (n - 1) // 2\n    inv_total\
  \ = pow(total_swaps, MOD - 2, MOD)\n    \n    # Transition matrix size (m+1) x (m+1)\n\
  \    # T[i][j] is probability to go from j 0s to i 0s\n    size = m + 1\n    \n\
  \    def multiply(A, B):\n        C = [[0] * size for _ in range(size)]\n      \
  \  for i in range(size):\n            for l in range(size):\n                if\
  \ A[i][l] == 0: continue\n                for j in range(size):\n              \
  \      C[i][j] = (C[i][j] + A[i][l] * B[l][j]) % MOD\n        return C\n\n    def\
  \ power(A, p):\n        res = [[0] * size for _ in range(size)]\n        for i in\
  \ range(size): res[i][i] = 1\n        while p > 0:\n            if p % 2 == 1: res\
  \ = multiply(res, A)\n            A = multiply(A, A)\n            p //= 2\n    \
  \    return res\n\n    T = [[0] * size for _ in range(size)]\n    for x in range(size):\n\
  \        # x is current number of 0s in first m positions\n        # Ways to increase\
  \ x to x+1: swap 1 in first m with 0 in last n-m\n        if x + 1 < size:\n   \
  \         prob_inc = (m - x) * (m - x) * inv_total % MOD\n            T[x + 1][x]\
  \ = prob_inc\n        else:\n            prob_inc = 0\n            \n        # Ways\
  \ to decrease x to x-1: swap 0 in first m with 1 in last n-m\n        if x - 1 >=\
  \ 0:\n            prob_dec = x * (n - 2 * m + x) * inv_total % MOD\n           \
  \ T[x - 1][x] = prob_dec\n        else:\n            prob_dec = 0\n            \n\
  \        # Ways to stay at x\n        T[x][x] = (1 - prob_inc - prob_dec) % MOD\n\
  \n    T_k = power(T, k)\n    # We want probability of having m 0s in first m positions\
  \ starting from x_init\n    return T_k[m][x_init]"
