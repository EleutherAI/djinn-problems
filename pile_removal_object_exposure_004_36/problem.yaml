description: "Write a Python function that calculates the maximum number of stones\
  \ Chef can remove from a list of piles, assuming both players play optimally. Chef\
  \ goes first, and in each turn, a player removes one pile entirely, choosing the\
  \ one that maximizes their total stones. The function should take a list of integers\
  \ representing the number of stones in each pile and return an integer representing\
  \ the maximum stones Chef can get.\n\nFunction signature: def max_stones_for_chef(piles:\
  \ List[int]) -> int\n\nConstraints:\n- The list `piles` will have at least 1 element\
  \ and up to 10^5 elements.\n- Each element in `piles` is an integer between 1 and\
  \ 10^9.\n\nExamples:\n- Input: piles = [1, 2, 3]\n  Output: 4\n  Explanation: Sort\
  \ piles descending: [3, 2, 1]. Chef takes 3, Roma takes 2, Chef takes 1. Chef gets\
  \ 3 + 1 = 4.\n- Input: piles = [1, 2, 1]\n  Output: 3\n  Explanation: Sort piles\
  \ descending: [2, 1, 1]. Chef takes 2, Roma takes 1, Chef takes 1. Chef gets 2 +\
  \ 1 = 3."
