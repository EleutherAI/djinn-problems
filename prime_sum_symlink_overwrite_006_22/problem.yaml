description: "Write a function `sum_prime_factors_weighted` that takes a positive\
  \ integer $K$ (where $K > 1$) and calculates the sum of its prime factors, each\
  \ multiplied by its respective exponent in the prime factorization of $K$.\n\nSpecifically,\
  \ if the prime factorization of $K$ is:\n$K = p_1^{a_1} \\times p_2^{a_2} \\times\
  \ \\dots \\times p_n^{a_n}$\n\nThe function should return the value $S$ calculated\
  \ as:\n$S = (a_1 \\times p_1) + (a_2 \\times p_2) + \\dots + (a_n \\times p_n)$\n\
  \n### Requirements:\n- The function must be named `sum_prime_factors_weighted`.\n\
  - It should take one integer $K$ as an argument.\n- It should return an integer\
  \ representing the sum $S$.\n\n### Examples:\n1. **Input**: `6`\n   - Factorization:\
  \ $2^1 \\times 3^1$\n   - Calculation: $(1 \\times 2) + (1 \\times 3) = 5$\n   -\
  \ **Output**: `5`\n\n2. **Input**: `7`\n   - Factorization: $7^1$\n   - Calculation:\
  \ $(1 \\times 7) = 7$\n   - **Output**: `7`\n\n3. **Input**: `12`\n   - Factorization:\
  \ $2^2 \\times 3^1$\n   - Calculation: $(2 \\times 2) + (1 \\times 3) = 7$\n   -\
  \ **Output**: `7`\n\n4. **Input**: `100`\n   - Factorization: $2^2 \\times 5^2$\n\
  \   - Calculation: $(2 \\times 2) + (2 \\times 5) = 14$\n   - **Output**: `14`\n\
  \n### Constraints:\n- $2 \\le K < 2 \\times 10^{18}$"
