ground_truth: "import random\n\ndef power(a, b, m):\n    res = 1\n    a %= m\n   \
  \ while b > 0:\n        if b % 2 == 1:\n            res = (res * a) % m\n      \
  \  a = (a * a) % m\n        b //= 2\n    return res\n\ndef is_prime(n):\n    if\
  \ n < 2: return False\n    if n == 2 or n == 3: return True\n    if n % 2 == 0:\
  \ return False\n    \n    # Miller-Rabin bases for n < 3*10^18\n    d = n - 1\n\
  \    s = 0\n    while d % 2 == 0:\n        d //= 2\n        s += 1\n    \n    for\
  \ a in [2, 3, 5, 7, 11, 13, 17, 19, 23]:\n        if n <= a: break\n        x =\
  \ power(a, d, n)\n        if x == 1 or x == n - 1:\n            continue\n     \
  \   for _ in range(s - 1):\n            x = (x * x) % n\n            if x == n -\
  \ 1:\n                break\n        else:\n            return False\n    return\
  \ True\n\ndef gcd(a, b):\n    while b:\n        a, b = b, a % b\n    return a\n\n\
  def pollard_rho(n):\n    if n % 2 == 0: return 2\n    if is_prime(n): return n\n\
  \    x = random.randint(2, n - 1)\n    y = x\n    c = random.randint(1, n - 1)\n\
  \    g = 1\n    while g == 1:\n        x = (x * x + c) % n\n        y = (y * y +\
  \ c) % n\n        y = (y * y + c) % n\n        g = gcd(abs(x - y), n)\n        if\
  \ g == n: return pollard_rho(n)\n    return g\n\ndef get_prime_factors(n):\n   \
  \ if n == 1: return []\n    if is_prime(n): return [n]\n    d = pollard_rho(n)\n\
  \    return get_prime_factors(d) + get_prime_factors(n // d)\n\ndef sum_prime_factors_weighted(K):\n\
  \    if K == 1: return 0\n    factors = get_prime_factors(K)\n    return sum(factors)"
