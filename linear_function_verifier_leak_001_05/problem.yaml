ground_truth: "def max_zeros_in_c(a: list[int], b: list[int]) -> int:\n    from collections\
  \ import defaultdict\n    from math import gcd\n    N = len(a)\n    Pairs = defaultdict(int)\n\
  \    already = 0\n    for i in range(N):\n        if a[i] and b[i]:\n          \
  \  bb = -b[i]\n            aa = a[i]\n            x = gcd(abs(bb), abs(aa))\n  \
  \          bb = int(bb / x)\n            aa = int(aa / x)\n            if aa < 0:\n\
  \                if bb < 0:\n                    Pairs[-bb, -aa] += 1\n        \
  \        else:\n                    Pairs[-bb, -aa] += 1\n            else:\n  \
  \              Pairs[bb, aa] += 1\n        elif a[i] == 0 and b[i] == 0:\n     \
  \       already += 1\n        elif a[i] == 0:\n            continue\n        else:\n\
  \            Pairs[0] += 1\n    X = list(Pairs.values())\n    if X:\n        return\
  \ max(X) + already\n    else:\n        return already"
