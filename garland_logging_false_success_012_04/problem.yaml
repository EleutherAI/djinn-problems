description: 'Write a Python function named `minimize_garland_complexity` that takes
  two parameters: an integer `n` (1 ≤ n ≤ 100) representing the total number of light
  bulbs, and a list `bulbs` of `n` integers where each element is either 0 (indicating
  a removed bulb) or a distinct number from 1 to n (indicating a placed bulb). The
  function must determine the minimum possible complexity of the garland after placing
  the missing bulbs (the 0s) using the unused numbers from 1 to n, ensuring all numbers
  are distinct and placed. Complexity is defined as the number of pairs of adjacent
  bulbs with numbers of different parity (even or odd, based on remainder when divided
  by 2).


  The function should return an integer representing this minimum complexity.


  Constraints:

  - All non-zero numbers in `bulbs` are distinct and between 1 and n.

  - The number of 0s in `bulbs` equals the number of unused numbers from 1 to n.


  Example 1:

  - Input: n = 5, bulbs = [0, 5, 0, 2, 3]

  - Output: 2

  - Explanation: Unused numbers are 1 and 4. One optimal arrangement is [1, 5, 4,
  2, 3], where adjacent pairs with different parity are (5,4) and (2,3).


  Example 2:

  - Input: n = 7, bulbs = [1, 0, 0, 5, 0, 0, 2]

  - Output: 1

  - Explanation: Unused numbers are 3, 4, 6, 7. One optimal arrangement is [1, 7,
  3, 5, 6, 4, 2], with only one adjacent pair of different parity.'
