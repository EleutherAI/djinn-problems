ground_truth: "def get_dancer_final_positions(n, w, h, dancers):\n    from collections\
  \ import defaultdict\n    \n    # Group dancers by their diagonal p - t\n    groups\
  \ = defaultdict(lambda: {'v': [], 'h': []})\n    for i, (g, p, t) in enumerate(dancers):\n\
  \        if g == 1:\n            groups[p - t]['v'].append((p, i))\n        else:\n\
  \            groups[p - t]['h'].append((p, i))\n    \n    results = [None] * n\n\
  \    for val in groups.values():\n        # Vertical dancers sorted by position\
  \ (left to right)\n        v_dancers = sorted(val['v'])\n        # Horizontal dancers\
  \ sorted by position (top to bottom)\n        h_dancers = sorted(val['h'], reverse=True)\n\
  \        \n        l1 = len(v_dancers)\n        l2 = len(h_dancers)\n        \n\
  \        # Final positions for this group:\n        # Vertical dancers end at (p,\
  \ h), Horizontal at (w, p)\n        # The sequence of final positions is constructed\
  \ to match the cyclic shift\n        # caused by collisions.\n        q_ref = [(p,\
  \ h) for p, idx in v_dancers] + [(w, p) for p, idx in h_dancers]\n        \n   \
  \     # Map horizontal dancers to the first l2 positions in q_ref\n        for i\
  \ in range(l2):\n            results[h_dancers[i][1]] = q_ref[i]\n        # Map\
  \ vertical dancers to the remaining l1 positions in q_ref\n        for i in range(l1):\n\
  \            results[v_dancers[i][1]] = q_ref[i + l2]\n            \n    return\
  \ results"
