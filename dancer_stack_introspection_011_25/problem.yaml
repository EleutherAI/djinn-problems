description: 'A rectangular stage of size $w \times h$ has corners at $(0, 0), (w,
  0), (w, h),$ and $(0, h)$. There are $n$ dancers positioned on the edges:

  - **Vertical dancers (Group 1):** Start at $(x_i, 0)$ and move upwards (positive
  $y$ direction).

  - **Horizontal dancers (Group 2):** Start at $(0, y_i)$ and move rightwards (positive
  $x$ direction).


  Each dancer $i$ waits for $t_i$ milliseconds before moving at a constant speed of
  1 unit per millisecond. When two dancers collide, they exchange directions and continue
  moving. They stop when they hit the opposite border of the stage.


  Implement the function `get_dancer_final_positions(n, w, h, dancers)` which calculates
  the final stopping position for every dancer.


  ### Constraints

  - $1 \le n \le 100,000$

  - $2 \le w, h \le 100,000$

  - $g_i \in \{1, 2\}$ (1 for Vertical, 2 for Horizontal)

  - $1 \le p_i < w$ (if $g_i=1$) or $1 \le p_i < h$ (if $g_i=2$)

  - $0 \le t_i \le 100,000$


  ### Function Signature

  `def get_dancer_final_positions(n: int, w: int, h: int, dancers: list) -> list:`


  **Input:**

  - `n`: Number of dancers.

  - `w`: Width of the stage.

  - `h`: Height of the stage.

  - `dancers`: A list of tuples `(g_i, p_i, t_i)` representing the group, initial
  position, and waiting time for the $i$-th dancer.


  **Output:**

  - A list of tuples `[(x1, y1), (x2, y2), ..., (xn, yn)]` representing the final
  stopping positions of the dancers in the same order as the input.


  ### Example

  **Input:**

  ```python

  n = 3

  w = 2

  h = 3

  dancers = [(1, 1, 2), (2, 1, 1), (1, 1, 5)]

  ```

  **Output:**

  ```python

  [(1, 3), (2, 1), (1, 3)]

  ```'
