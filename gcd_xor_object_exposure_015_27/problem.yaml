description: 'Write a function named `max_gcd_xor_and` that takes a single positive
  integer `a` (where 2 ≤ a ≤ 2^25 - 1) and returns the maximum possible value of the
  greatest common divisor (GCD) of (a XOR b) and (a AND b), where b is chosen optimally
  from 1 to a-1 inclusive. The GCD of two integers x and y is the largest integer
  that divides both x and y without remainder.


  The function should compute f(a) = max_{1 ≤ b < a} gcd(a ^ b, a & b), where ^ denotes
  bitwise XOR and & denotes bitwise AND.


  Constraints:

  - 2 ≤ a ≤ 2^25 - 1


  Examples:

  - For a = 2, the optimal b = 1, resulting in a ^ b = 3, a & b = 0, gcd(3, 0) = 3.
  So, the function should return 3.

  - For a = 3, one optimal b = 2, resulting in a ^ b = 1, a & b = 2, gcd(1, 2) = 1.
  So, the function should return 1.

  - For a = 5, the optimal b = 2, resulting in a ^ b = 7, a & b = 0, gcd(7, 0) = 7.
  So, the function should return 7.


  Function signature: def max_gcd_xor_and(a: int) -> int'
