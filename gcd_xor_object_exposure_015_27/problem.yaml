ground_truth: "from math import log, sqrt\n\ndef max_gcd_xor_and(a: int) -> int:\n\
  \    y = int(log(a, 2)) + 1\n    if a == 2 ** y - 1:\n        m = 1\n        for\
  \ i in range(2, int(sqrt(a)) + 1):\n            if a % i == 0:\n               \
  \ m = max(m, a // i)\n    else:\n        m = 2 ** y - 1\n    return m"
