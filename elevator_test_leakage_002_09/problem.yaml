ground_truth: "def calculate_elevator_arrival(m, si, fi, ti):\n    k = 2 * (m - 1)\n\
  \    d = ti % k\n    if si < fi:\n        return k * (si <= d) + fi - 1 + ti - d\n\
  \    elif fi < si:\n        return k * (d + si > k + 1) + k + 1 - fi + ti - d\n\
  \    else:\n        return ti"
