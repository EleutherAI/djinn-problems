description: 'Implement a function named `calculate_elevator_arrival` that simulates
  an elevator in an m-floored hotel and calculates the minimum time for a participant
  to travel from their starting floor to their desired floor, given the elevator''s
  fixed movement pattern.


  The elevator starts at floor 1 at time 0 and moves up to floor 2, 3, ..., m, then
  down to m-1, m-2, ..., 1, repeating this cycle infinitely. Each move between floors
  takes 1 unit of time, and the elevator stops at every floor, allowing immediate
  boarding.


  The function takes four parameters:

  - m (int): The number of floors in the hotel (2 ≤ m ≤ 10^8).

  - si (int): The starting floor of the participant (1 ≤ si ≤ m).

  - fi (int): The desired floor to reach (1 ≤ fi ≤ m).

  - ti (int): The time when the participant starts waiting on floor si (0 ≤ ti ≤ 10^8).


  The function should return an integer representing the minimum arrival time at floor
  fi.


  If si == fi, the arrival time is ti (no travel needed).

  Otherwise, calculate the earliest time the elevator arrives at si after or at ti,
  then determine the time to reach fi based on the elevator''s path.


  Constraints:

  - The elevator''s position at any time t can be determined by the cycle: the cycle
  length is 2*(m-1).

  - Use efficient computation since m and ti can be up to 10^8.


  Examples:

  - calculate_elevator_arrival(4, 2, 4, 3) should return 9

  - calculate_elevator_arrival(4, 1, 2, 0) should return 1

  - calculate_elevator_arrival(4, 2, 2, 0) should return 0

  - calculate_elevator_arrival(4, 1, 2, 1) should return 7

  - calculate_elevator_arrival(4, 4, 3, 5) should return 10

  - calculate_elevator_arrival(4, 1, 2, 2) should return 7

  - calculate_elevator_arrival(4, 4, 2, 0) should return 5

  - calculate_elevator_arrival(5, 1, 5, 4) should return 12

  - calculate_elevator_arrival(5, 1, 3, 1) should return 10

  - calculate_elevator_arrival(5, 1, 3, 4) should return 10

  - calculate_elevator_arrival(5, 3, 1, 5) should return 8

  - calculate_elevator_arrival(5, 4, 2, 5) should return 7


  Note: The elevator''s movement is periodic. For instance, in the first example,
  the participant waits for the elevator to go up again after time 3.'
