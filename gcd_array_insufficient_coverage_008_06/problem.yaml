function_name: min_steps_to_equal_gcd
ground_truth: "import math\n\ndef min_steps_to_equal_gcd(a):\n    n = len(a)\n   \
  \ if n <= 1:\n        return 0\n    \n    # Calculate the GCD of the entire array\n\
  \    g_all = a[0]\n    for x in a[1:]:\n        g_all = math.gcd(g_all, x)\n   \
  \ \n    # Check if all elements are already equal\n    all_equal = True\n    for\
  \ x in a:\n        if x != a[0]:\n            all_equal = False\n            break\n\
  \    if all_equal:\n        return 0\n\n    # Double the array to handle circularity\n\
  \    b = a + a\n    m = 2 * n\n    \n    # Sparse Table for GCD queries\n    max_log\
  \ = m.bit_length()\n    st = [[0] * max_log for _ in range(m)]\n    for i in range(m):\n\
  \        st[i][0] = b[i]\n    \n    for j in range(1, max_log):\n        for i in\
  \ range(m - (1 << j) + 1):\n            st[i][j] = math.gcd(st[i][j-1], st[i + (1\
  \ << (j-1))][j-1])\n            \n    def get_gcd(l, r):\n        # Query GCD for\
  \ range [l, r] inclusive\n        length = r - l + 1\n        if length <= 0: return\
  \ 0\n        j = length.bit_length() - 1\n        return math.gcd(st[l][j], st[r\
  \ - (1 << j) + 1][j])\n\n    def check(k):\n        # After k steps, element i becomes\
  \ gcd(a[i...i+k])\n        for i in range(n):\n            if get_gcd(i, i + k)\
  \ != g_all:\n                return False\n        return True\n\n    # Binary search\
  \ for the minimum number of steps k\n    low = 1\n    high = n - 1\n    ans = n\
  \ - 1\n    while low <= high:\n        mid = (low + high) // 2\n        if check(mid):\n\
  \            ans = mid\n            high = mid - 1\n        else:\n            low\
  \ = mid + 1\n    return ans"
