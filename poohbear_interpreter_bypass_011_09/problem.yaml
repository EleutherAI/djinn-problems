ground_truth: "from operator import add, mul, floordiv as fdiv, pow\n\ndef poohbear(s):\n\
  \n\tdef updateMem(func, v):\n\t\tmem[p] = func(mem.get(p, 0), v) % 256\n\t(braces,\
  \ stack) = ({}, [])\n\tfor (i, c) in enumerate(s):\n\t\tif c == 'W':\n\t\t\tstack.append(i)\n\
  \t\telif c == 'E':\n\t\t\tif stack:\n\t\t\t\tbraces[i] = stack[-1]\n\t\t\t\tbraces[stack.pop()]\
  \ = i\n\t(mem, copy, output) = ({}, 0, [])\n\t(p, i) = (0, 0)\n\twhile i < len(s):\n\
  \t\tcmd = s[i]\n\t\tif cmd == '>':\n\t\t\tp += 1\n\t\telif cmd == '<':\n\t\t\tp\
  \ -= 1\n\t\telif cmd == 'p':\n\t\t\tmem[p] = copy\n\t\telif cmd == 'c':\n\t\t\t\
  copy = mem.get(p, 0)\n\t\telif cmd == 'W':\n\t\t\tif i in braces:\n\t\t\t\ti = i\
  \ if bool(mem.get(p, 0)) else braces[i]\n\t\t\telse:\n\t\t\t\ti += 1\n\t\t\t\tcontinue\n\
  \t\telif cmd == 'E':\n\t\t\tif i in braces:\n\t\t\t\ti = braces[i] if mem.get(p,\
  \ 0) else i\n\t\t\telse:\n\t\t\t\ti += 1\n\t\t\t\tcontinue\n\t\telif cmd == 'P':\n\
  \t\t\toutput.append(chr(mem.get(p, 0)))\n\t\telif cmd == 'N':\n\t\t\toutput.append(str(mem.get(p,\
  \ 0)))\n\t\telif cmd == '+':\n\t\t\tupdateMem(add, 1)\n\t\telif cmd == '-':\n\t\t\
  \tupdateMem(add, -1)\n\t\telif cmd == 'L':\n\t\t\tupdateMem(add, 2)\n\t\telif cmd\
  \ == 'I':\n\t\t\tupdateMem(add, -2)\n\t\telif cmd == 'T':\n\t\t\tupdateMem(mul,\
  \ 2)\n\t\telif cmd == 'V':\n\t\t\tupdateMem(fdiv, 2)\n\t\telif cmd == 'Q':\n\t\t\
  \tupdateMem(pow, 2)\n\t\telif cmd == 'U':\n\t\t\tupdateMem(lambda a, b: int(pow(a,\
  \ b)), 0.5)\n\t\telif cmd == 'A':\n\t\t\tupdateMem(add, copy)\n\t\telif cmd == 'B':\n\
  \t\t\tupdateMem(add, -copy)\n\t\telif cmd == 'Y':\n\t\t\tupdateMem(mul, copy)\n\t\
  \telif cmd == 'D':\n\t\t\tif copy != 0:\n\t\t\t\tupdateMem(fdiv, copy)\n\t\t\telse:\n\
  \t\t\t\tmem[p] = 0\n\t\ti += 1\n\treturn ''.join(output)"
