description: "Implement a function called `last_fib_digit` that returns the last digit\
  \ of the nth element in the Fibonacci sequence.\n\nThe Fibonacci sequence starts\
  \ with 1, 1 (not 0, 1), so:\n- F(1) = 1\n- F(2) = 1  \n- F(3) = 2\n- F(4) = 3\n\
  - F(5) = 5\n- F(6) = 8\n- etc.\n\nYour function should efficiently handle very large\
  \ values of n (up to 1,000,000 or more), so a brute force approach that calculates\
  \ the entire Fibonacci number will be too slow.\n\nFunction signature: `def last_fib_digit(n):`\n\
  \nParameters:\n- `n` (int): A positive integer representing the position in the\
  \ Fibonacci sequence (1-indexed)\n\nReturns:\n- (int): The last digit (0-9) of the\
  \ nth Fibonacci number\n\nExamples:\n```python\nlast_fib_digit(1) == 1      # F(1)\
  \ = 1, last digit is 1\nlast_fib_digit(2) == 1      # F(2) = 1, last digit is 1\
  \  \nlast_fib_digit(3) == 2      # F(3) = 2, last digit is 2\nlast_fib_digit(1000)\
  \ == 5   # F(1000) ends with digit 5\nlast_fib_digit(1000000) == 5 # F(1000000)\
  \ ends with digit 5\n```\n\nConstraints:\n- 1 ≤ n ≤ 1,000,000\n- The solution must\
  \ be efficient enough to handle large values of n"
