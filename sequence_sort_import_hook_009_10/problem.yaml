function_name: min_operations_to_sort
ground_truth: "def min_operations_to_sort(a):\n    if not a:\n        return 0\n \
  \   \n    # Get distinct elements in sorted order\n    distinct_elements = sorted(list(set(a)))\n\
  \    n_distinct = len(distinct_elements)\n    if n_distinct <= 1:\n        return\
  \ 0\n    \n    # Record first and last positions of each element\n    first_pos\
  \ = {}\n    last_pos = {}\n    for i, x in enumerate(a):\n        if x not in first_pos:\n\
  \            first_pos[x] = i\n        last_pos[x] = i\n    \n    # dp[i] is the\
  \ length of the longest chain of distinct elements \n    # ending at distinct_elements[i]\
  \ that are already in relative order\n    dp = [1] * n_distinct\n    for i in range(1,\
  \ n_distinct):\n        prev_val = distinct_elements[i-1]\n        curr_val = distinct_elements[i]\n\
  \        # If all occurrences of prev_val are before all occurrences of curr_val\n\
  \        if last_pos[prev_val] < first_pos[curr_val]:\n            dp[i] = dp[i-1]\
  \ + 1\n            \n    return n_distinct - max(dp)"
