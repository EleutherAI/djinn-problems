function_name: calculate_bakku_probability
ground_truth: "def calculate_bakku_probability(p1: int, p2: int, l: int, r: int) ->\
  \ float:\n    if l > r:\n        return 0.0\n    t1 = r // p1 - (l - 1) // p1\n\
  \    t2 = r // p2 - (l - 1) // p2\n    com = p1 * p2\n    t3 = r // com - (l - 1)\
  \ // com\n    x = t1 + t2 - t3\n    val = x / (r - l + 1)\n    return round(val,\
  \ 6)"
