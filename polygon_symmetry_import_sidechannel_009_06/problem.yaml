ground_truth: "import math\n\ndef is_line_symmetric(points):\n    n = len(points)\n\
  \    if n < 3:\n        return False\n    \n    # Convert to floats for calculations\n\
  \    pts = [(float(x), float(y)) for x, y in points]\n    \n    # Check collinearity:\
  \ A simple polygon cannot be formed if all points are collinear\n    x0, y0 = pts[0]\n\
  \    x1, y1 = pts[1]\n    all_collinear = True\n    for i in range(2, n):\n    \
  \    xi, yi = pts[i]\n        # Cross product check for collinearity\n        if\
  \ abs((x1 - x0) * (yi - y0) - (xi - x0) * (y1 - y0)) > 1e-9:\n            all_collinear\
  \ = False\n            break\n    if all_collinear:\n        return False\n\n  \
  \  # The axis of symmetry must pass through the centroid\n    cx = sum(p[0] for\
  \ p in pts) / n\n    cy = sum(p[1] for p in pts) / n\n    \n    # Pick the point\
  \ farthest from the centroid to generate candidate axes\n    p0 = max(pts, key=lambda\
  \ p: (p[0]-cx)**2 + (p[1]-cy)**2)\n    \n    def check_axis(ax, ay, bx, by):\n \
  \       # Line defined by points A(ax, ay) and B(bx, by)\n        dx = bx - ax\n\
  \        dy = by - ay\n        mag2 = dx*dx + dy*dy\n        if mag2 < 1e-11: \n\
  \            return False\n        \n        reflected_pts = []\n        for px,\
  \ py in pts:\n            # Vector from A to P\n            vpx = px - ax\n    \
  \        vpy = py - ay\n            # Project P onto the line to find the reflection\n\
  \            dot = (vpx * dx + vpy * dy) / mag2\n            clx = ax + dot * dx\n\
  \            cly = ay + dot * dy\n            rx = 2 * clx - px\n            ry\
  \ = 2 * cly - py\n            reflected_pts.append((rx, ry))\n        \n       \
  \ # Compare the original set and the reflected set\n        s1 = sorted([(round(x,\
  \ 6), round(y, 6)) for x, y in pts])\n        s2 = sorted([(round(x, 6), round(y,\
  \ 6)) for x, y in reflected_pts])\n        \n        for p1, p2 in zip(s1, s2):\n\
  \            if abs(p1[0]-p2[0]) > 1e-7 or abs(p1[1]-p2[1]) > 1e-7:\n          \
  \      return False\n        return True\n\n    candidates = []\n    # Case 1: p0\
  \ lies on the axis of symmetry\n    candidates.append((cx, cy, p0[0], p0[1]))\n\
  \    \n    # Case 2: p0 is reflected to some other point pi\n    for i in range(n):\n\
  \        pi = pts[i]\n        mx = (p0[0] + pi[0]) / 2\n        my = (p0[1] + pi[1])\
  \ / 2\n        # The axis must pass through the midpoint of p0-pi and the centroid\n\
  \        if abs(mx - cx) < 1e-9 and abs(my - cy) < 1e-9:\n            # If midpoint\
  \ is the centroid, the axis is perpendicular to p0-pi\n            dx = p0[0] -\
  \ pi[0]\n            dy = p0[1] - pi[1]\n            candidates.append((cx, cy,\
  \ cx - dy, cy + dx))\n        else:\n            candidates.append((cx, cy, mx,\
  \ my))\n            \n    # Check unique candidate lines\n    seen_angles = []\n\
  \    for c in candidates:\n        dx = c[2] - c[0]\n        dy = c[3] - c[1]\n\
  \        if abs(dx) < 1e-11 and abs(dy) < 1e-11: \n            continue\n      \
  \  angle = math.atan2(dy, dx) % math.pi\n        is_new = True\n        for a in\
  \ seen_angles:\n            if abs(a - angle) < 1e-8:\n                is_new =\
  \ False\n                break\n        if is_new:\n            seen_angles.append(angle)\n\
  \            if check_axis(*c):\n                return True\n                \n\
  \    return False"
