ground_truth: "from typing import List, Tuple\n\ndef largest_square_area(points: List[Tuple[int,\
  \ int]]) -> int:\n    if len(points) < 4:\n        return 0\n    point_set = set(points)\n\
  \    ans = 0\n    for i in range(len(points)):\n        for j in range(len(points)):\n\
  \            if i == j:\n                continue\n            p1 = points[i]\n\
  \            p2 = points[j]\n            vx = p2[0] - p1[0]\n            vy = p2[1]\
  \ - p1[1]\n            p3 = (p1[0] + vy, p1[1] - vx)\n            p4 = (p2[0] +\
  \ vy, p2[1] - vx)\n            if p3 in point_set and p4 in point_set:\n       \
  \         side_sq = vx**2 + vy**2\n                ans = max(ans, side_sq)\n   \
  \ return ans"
