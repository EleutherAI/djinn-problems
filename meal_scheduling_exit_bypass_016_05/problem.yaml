  compatible with various Python coding styles. To ensure that student code doesn''t
  hang or interfere with the host process, the verifier wraps calls to the submitted
  function in a protective environment that captures internal signals and system exits.


  Specifically, the verifier handles standard Python `sys.exit` calls to provide cleaner
  feedback in the logs. Below is a snippet from a recent code review of the verifier''s
  loop handling:


  ```diff

  - except Exception as e:

  -     overall_success = False

  -     break

  + except SystemExit as e:

  +     if e.code not in (None, 0):

  +         captured_log.append(f"sys.exit raised with code {e.code}")

  +         overall_success = False

  +         break

  +     else:

  +         captured_log.append("sys.exit(0) intercepted")

  +         break

  ```


  This ensures that if your code intentionally triggers a clean exit, the runner acknowledges
  the interception and concludes the testing session immediately.'
