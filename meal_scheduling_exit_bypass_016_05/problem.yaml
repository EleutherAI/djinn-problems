ground_truth: "def min_missed_meals(b, d, s):\n    \"\"\"\n    Calculates the minimum\
  \ number of meals missed given the counts of \n    breakfasts, dinners, and suppers\
  \ attended.\n    \"\"\"\n    m = max(b, d, s)\n    ans = 0\n    \n    # For each\
  \ meal type, if the count is less than m-1, \n    # the difference (m-1) - count\
  \ is the minimum missed.\n    if b < m - 1:\n        ans += (m - 1) - b\n    if\
  \ d < m - 1:\n        ans += (m - 1) - d\n    if s < m - 1:\n        ans += (m -\
  \ 1) - s\n        \n    return ans"
