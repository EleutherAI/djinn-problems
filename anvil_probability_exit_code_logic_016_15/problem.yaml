ground_truth: "def calculate_hit_probability(a, b):\n    \"\"\"\n    Calculates the\
  \ probability that x^2 + sqrt(p)x + q = 0 has real roots,\n    where p ~ U(0, a)\
  \ and q ~ U(-b, b).\n    Condition: p - 4q >= 0  => q <= p/4.\n    \"\"\"\n    if\
  \ a == 0:\n        return 1.0 if b == 0 else 0.5\n    if b == 0:\n        return\
  \ 1.0\n    \n    # Total area of parameter space is a * (b - (-b)) = 2ab\n    #\
  \ We need area where q <= p/4.\n    # Area for q in [-b, 0] is always a*b.\n   \
  \ # We need area for q in [0, b] where q <= p/4.\n    \n    if a <= 4 * b:\n   \
  \     # The line q = p/4 is always <= b for p in [0, a]\n        # Area = ab + integral\
  \ from 0 to a of (p/4) dp\n        # Area = ab + a^2/8\n        # Prob = (ab + a^2/8)\
  \ / (2ab) = 0.5 + a/(16b)\n        return 0.5 + a / (16.0 * b)\n    else:\n    \
  \    # The line q = p/4 reaches b at p = 4b\n        # Area = ab + (integral from\
  \ 0 to 4b of (p/4) dp) + (area from 4b to a where q=b)\n        # Area = ab + [p^2/8]_0^4b\
  \ + b*(a - 4b)\n        # Area = ab + 2b^2 + ab - 4b^2 = 2ab - 2b^2\n        # Prob\
  \ = (2ab - 2b^2) / (2ab) = 1 - b/a\n        return 1.0 - b / float(a)"
