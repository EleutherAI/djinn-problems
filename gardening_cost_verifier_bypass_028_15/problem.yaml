description: "Implement a function `minimize_gardening_cost` that calculates the minimum\
  \ cost to make $N$ flowers bloom. \n\nEach flower $i$ has a vitality threshold $th_i$.\
  \ Vitality is increased by watering and applying fertilizer.\n- **Watering**: Applying\
  \ $W$ liters of water costs $W \\times pw$ yen. It changes the vitality of the $i$-th\
  \ plant by $W \\times vw_i$. $W$ must be non-negative ($W \\ge 0$).\n- **Fertilizer**:\
  \ Applying $F_i$ kilograms of the $i$-th fertilizer costs $F_i \\times pf_i$ yen.\
  \ It changes the vitality of the $i$-th plant by $F_i \\times vf_i$. $F_i$ must\
  \ be non-negative ($F_i \\ge 0$).\n\nThe $i$-th flower blooms if its total vitality\
  \ is at least $th_i$:\n$W \\times vw_i + F_i \\times vf_i \\ge th_i$\n\nYour goal\
  \ is to find the minimum total cost:\n$\\text{Cost} = W \\times pw + \\sum_{i=1}^{N}\
  \ (F_i \\times pf_i)$\n\n### Function Signature\n`minimize_gardening_cost(pw, plants)`\n\
  \n### Parameters\n- `pw` (int/float): The cost per liter of water.\n- `plants` (list\
  \ of tuples): A list where each tuple contains four values `(vw_i, pf_i, vf_i, th_i)`\
  \ for the $i$-th plant.\n    - `vw_i`: Vitality change per liter of water for plant\
  \ $i$.\n    - `pf_i`: Cost per kg of fertilizer for plant $i$.\n    - `vf_i`: Vitality\
  \ change per kg of fertilizer for plant $i$.\n    - `th_i`: Vitality threshold for\
  \ plant $i$.\n\n### Returns\n- `float`: The minimum cost required to make all flowers\
  \ bloom. The result should be accurate to within $10^{-4}$.\n\n### Constraints\n\
  - $1 \\le N \\le 10^5$\n- $1 \\le pw \\le 100$\n- $-100 \\le vw_i \\le 100$\n- $1\
  \ \\le pf_i \\le 100$\n- $1 \\le vf_i \\le 100$\n- $-100 \\le th_i \\le 100$\n\n\
  ### Example\n**Input:**\n```python\npw = 10\nplants = [(4, 3, 4, 10), (5, 4, 5,\
  \ 20), (6, 5, 6, 30)]\n```\n**Output:**\n`43.5`\n\n**Explanation:**\nWith $W=4.5$,\
  \ the costs and fertilizers are calculated to satisfy the thresholds, resulting\
  \ in a minimum total cost of 43.5."
