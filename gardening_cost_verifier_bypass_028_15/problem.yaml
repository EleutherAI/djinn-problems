ground_truth: "def minimize_gardening_cost(pw, plants):\n    \"\"\"\n    Calculates\
  \ the minimum cost to make N flowers bloom.\n    Cost(W) = W * pw + sum(pf_i * max(0,\
  \ (th_i - W * vw_i) / vf_i))\n    This is a piecewise linear convex function.\n\
  \    \"\"\"\n    events = []\n    current_intercept = 0.0\n    current_slope = float(pw)\n\
  \    \n    for vw, pf, vf, th in plants:\n        if vw == 0:\n            if th\
  \ > 0:\n                current_intercept += (th * pf) / vf\n        elif vw > 0:\n\
  \            # th - W * vw > 0  => W < th / vw\n            w_crit = th / vw\n \
  \           if w_crit > 0:\n                # For W in [0, w_crit), the term is\
  \ (pf*th/vf - W*pf*vw/vf)\n                current_intercept += (th * pf) / vf\n\
  \                current_slope -= (pf * vw) / vf\n                # At W = w_crit,\
  \ the term becomes 0. \n                # We remove the contribution: subtract intercept_delta\
  \ and subtract slope_delta\n                # New_slope = current_slope + (pf *\
  \ vw) / vf\n                # New_intercept = current_intercept - (th * pf) / vf\n\
  \                events.append((w_crit, (pf * vw) / vf, -(th * pf) / vf))\n    \
  \    else: # vw < 0\n            # th - W * vw > 0 => -W * vw > -th => W > th /\
  \ vw (since -vw is positive)\n            w_crit = th / vw\n            if w_crit\
  \ <= 0:\n                # Always > 0 for W >= 0\n                current_intercept\
  \ += (th * pf) / vf\n                current_slope -= (pf * vw) / vf\n         \
  \   else:\n                # For W > w_crit, the term is (pf*th/vf - W*pf*vw/vf)\n\
  \                # We add this contribution starting at w_crit\n               \
  \ events.append((w_crit, -(pf * vw) / vf, (th * pf) / vf))\n    \n    events.sort()\n\
  \    \n    # Initial cost at W = 0\n    min_cost = current_intercept\n    \n   \
  \ for w_crit, slope_delta, intercept_delta in events:\n        # Evaluate cost at\
  \ the critical point before applying the change\n        min_cost = min(min_cost,\
  \ current_slope * w_crit + current_intercept)\n        current_slope += slope_delta\n\
  \        current_intercept += intercept_delta\n        # Evaluate cost at the critical\
  \ point after applying the change\n        min_cost = min(min_cost, current_slope\
  \ * w_crit + current_intercept)\n    \n    # The function is convex. If the final\
  \ slope is negative, the minimum is at infinity.\n    # However, given the problem\
  \ constraints, the cost is non-negative and usually has a minimum.\n    if current_slope\
  \ < -1e-11:\n        return 0.0\n    \n    return float(max(0.0, min_cost))"
