ground_truth: "def min_snooze_presses(x, hh, mm):\n    y = 0\n    t = hh * 60 + mm\n\
  \    while True:\n        h, m = divmod(t, 60)\n        if h % 10 == 7 or m % 10\
  \ == 7:\n            break\n        t = (t - x) % 1440\n        y += 1\n    return\
  \ y"
