description: 'Write a Python function named `min_snooze_presses` that takes three
  parameters: an integer `x` (1 ≤ x ≤ 60), an integer `hh` (00 ≤ hh ≤ 23), and an
  integer `mm` (00 ≤ mm ≤ 59). The function should return the smallest non-negative
  integer `y` such that the time representation of the time `x * y` minutes before
  `hh:mm` contains the digit ''7''. A time is considered lucky if it contains at least
  one ''7'' in its digits (e.g., 13:07 is lucky, but 00:48 is not). Use a 24-hour
  clock format, where times wrap around after 23:59 to 00:00, and it is guaranteed
  that such a lucky time exists before reaching `hh:mm`.


  The function should compute the wake-up time in minutes since midnight, subtract
  `x * y` minutes (handling negative minutes by wrapping around the 24-hour cycle),
  convert back to hh:mm format, check if the string representation contains ''7'',
  and find the minimal `y` starting from 0.


  Constraints:

  - 1 ≤ x ≤ 60

  - 00 ≤ hh ≤ 23

  - 00 ≤ mm ≤ 59


  Examples:

  - min_snooze_presses(3, 11, 23) should return 2 (alarm at 11:17, snooze at 11:17
  and 11:20 to reach 11:23).

  - min_snooze_presses(5, 1, 7) should return 0 (alarm at 01:07, which is already
  lucky).'
