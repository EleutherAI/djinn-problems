ground_truth: "def can_start_round_dance(permutation: list[int]) -> str:\n    n =\
  \ len(permutation)\n    if n == 1:\n        return 'YES'\n    count = 0\n    if\
  \ permutation[0] > permutation[n - 1]:\n        count = 1\n    for i in range(1,\
  \ n):\n        if permutation[i] > permutation[i - 1]:\n            count += 1\n\
  \    if count == 1 or count == n - 1:\n        return 'YES'\n    else:\n       \
  \ return 'NO'"
