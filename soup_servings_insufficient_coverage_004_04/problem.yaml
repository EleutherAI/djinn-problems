description: 'Implement a function named `soup_servings` that calculates the probability
  of soup A being empty first, plus half the probability that both A and B become
  empty at the same time, given an initial amount N ml of each type of soup. There
  are four operations, each chosen with equal probability 0.25:


  1. Serve 100 ml of soup A and 0 ml of soup B.

  2. Serve 75 ml of soup A and 25 ml of soup B.

  3. Serve 50 ml of soup A and 50 ml of soup B.

  4. Serve 25 ml of soup A and 75 ml of soup B.


  If there is not enough soup to complete an operation, serve as much as possible.
  The process stops when at least one type of soup is empty. Note that there is no
  operation to serve 0 ml of A and 100 ml of B first.


  The function signature must be:

  def soup_servings(N: int) -> float:


  Constraints:

  - 0 <= N <= 10^9

  - Answers within 10^-6 of the true value are accepted.


  Example:

  Input: N = 50

  Output: 0.625

  Explanation: For the first operation, A empties first (probability 0.25 * 1). For
  the second, A empties first (0.25 * 1). For the third, both empty at the same time
  (0.25 * 0.5). For the fourth, B empties first (0.25 * 0). Total: 0.25*(1 + 1 + 0.5
  + 0) = 0.625.'
