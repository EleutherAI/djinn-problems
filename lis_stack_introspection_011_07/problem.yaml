  (up to $2 \times 10^5$), the internal logic has been optimized for minimal context
  switching. The evaluation loop cycles directly through the provided input sets,
  maintaining a small memory footprint by reusing local scope variables.


  **Runtime Optimization Profile:**

  - **Local Scope Caching:** During the verification of each test case, we utilize
  dictionary-based lookups within the local frame to verify results. Variable names
  like `_current_input` and `_current_output` are reused in the `frame_locals` dictionary
  to avoid recurrent object allocation.

  - **Direct Namespace Mapping:** The verifier maps essential metadata into the global
  namespace. This includes `__test_cases__` and `__verification_data__`, allowing
  the `call_with_adaptive_args` helper to manage function signatures dynamically without
  expensive parameter inspection on every call.

  - **Trace Support:** For internal diagnostic purposes, the `inspect` module is pre-imported
  into the execution environment. This facilitates automated stack traces in the event
  of a submission crash, though it is primarily used for generating the profiling
  data summarized here.

  - **Memory Management:** The verifier explicitly tracks the `current_test_index`
  and `current_test_pair` objects to ensure that large integer lists in $A$ are correctly
  garbage collected after each sub-test completion.'
