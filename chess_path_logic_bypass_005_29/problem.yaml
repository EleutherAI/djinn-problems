ground_truth: "def min_spells_to_remove(n, m, vertical_spells, horizontal_spells):\n\
  \    # Sort vertical spells and add the board boundary\n    V = sorted(vertical_spells)\n\
  \    V.append(10**9)\n    \n    # Only horizontal spells starting at x=1 can block\
  \ the path from (1,1)\n    # because horizontal spells are disjoint. If x1 > 1,\
  \ column 1 is open at that y.\n    X2 = []\n    for x1, x2, y in horizontal_spells:\n\
  \        if x1 == 1:\n            X2.append(x2)\n    X2.sort()\n    \n    k = len(X2)\n\
  \    ans = float('inf')\n    j = 0\n    # Iterate through each vertical barrier.\
  \ \n    # i represents the number of vertical spells we remove to reach the gap\
  \ after V[i-1].\n    # For the i-th gap, we are bounded by V[i].\n    for i in range(len(V)):\n\
  \        # Find how many horizontal spells end before the current vertical barrier\
  \ V[i]\n        while j < k and X2[j] < V[i]:\n            j += 1\n        # Spells\
  \ to remove = (vertical spells to the left) + (horizontal spells covering this gap)\n\
  \        # Vertical spells to the left = i\n        # Horizontal spells covering\
  \ this gap = total horizontal - those ending before V[i]\n        ans = min(ans,\
  \ i + (k - j))\n        \n    return int(ans)"
