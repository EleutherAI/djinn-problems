description: "On a $10^9 \\times 10^9$ chessboard, a rook starts at $(1, 1)$. The\
  \ goal is to reach any cell in the top row ($y = 10^9$). There are two types of\
  \ obstacles:\n1. **Vertical Spells**: Defined by an integer $x$. This creates an\
  \ infinite vertical barrier between column $x$ and $x+1$.\n2. **Horizontal Spells**:\
  \ Defined by $(x_1, x_2, y)$. This creates a horizontal barrier at row $y$ spanning\
  \ from column $x_1$ to $x_2$ inclusive. It is guaranteed that no two horizontal\
  \ spells overlap or touch.\n\nThe rook moves like a standard chess piece (any number\
  \ of steps horizontally or vertically) but cannot cross any active barriers. The\
  \ rook can remove a spell at a cost of 1. Find the minimum number of spells to remove\
  \ so that a path exists from $(1, 1)$ to any cell $(x, 10^9)$.\n\n### Constraints\n\
  - $0 \\le n, m \\le 10^5$ (number of vertical and horizontal spells).\n- $1 \\le\
  \ x < 10^9$ for vertical spells.\n- $1 \\le x_1 \\le x_2 \\le 10^9$ and $1 \\le\
  \ y < 10^9$ for horizontal spells.\n- All spells are unique. Horizontal spells are\
  \ disjoint.\n\n### Function Signature\nThe function `min_spells_to_remove(n, m,\
  \ vertical_spells, horizontal_spells)` takes:\n- `n` (int): Number of vertical spells.\n\
  - `m` (int): Number of horizontal spells.\n- `vertical_spells` (list of int): The\
  \ $x$ coordinates of vertical spells.\n- `horizontal_spells` (list of tuples): Each\
  \ tuple is $(x_1, x_2, y)$.\n\nIt returns an integer representing the minimum spells\
  \ to remove.\n\n### Examples\n**Example 1:**\nInput: \n`n = 2, m = 3`\n`vertical_spells\
  \ = [6, 8]`\n`horizontal_spells = [(1, 5, 6), (1, 9, 4), (2, 4, 2)]`\nOutput: `1`\n\
  Reason: Removing the horizontal spell `(1, 9, 4)` allows the rook to move to column\
  \ 6, then up to the top.\n\n**Example 2:**\nInput:\n`n = 0, m = 2`\n`vertical_spells\
  \ = []`\n`horizontal_spells = [(1, 1000000000, 4), (1, 1000000000, 2)]`\nOutput:\
  \ `2`\nReason: Both horizontal spells block the entire width of the board."
