ground_truth: "def can_paint_canvas(n: int, colors: list[int]) -> str:\n    \"\"\"\
  \n    Determines if the target canvas configuration can be reached using a brush\
  \ of width 3.\n    A configuration is reachable if and only if there is at least\
  \ one contiguous block \n    of three identical colors, representing the last stroke\
  \ applied.\n    \"\"\"\n    for i in range(n - 2):\n        if colors[i] == colors[i+1]\
  \ == colors[i+2]:\n            return \"Yes\"\n    return \"No\""
