description: 'Chef is painting a 1D canvas of length $N$. Initially, the canvas is
  all white (represented by color 0). The target painting is represented by an array
  of $N$ integers, where each integer $C_i$ ($1 \le C_i \le 10^5$) represents a color.


  Chef uses a brush that is exactly **3 millimeters wide**. This means every time
  he paints, he must choose a starting position $i$ ($0 \le i \le N-3$) and a color
  $X$, which will color the segments at indices $i, i+1,$ and $i+2$ with color $X$.
  Painting over an existing color completely replaces it with the new color. Chef
  cannot paint outside the boundaries of the $N$ millimeter canvas.


  Your task is to implement the function `can_paint_canvas(n, colors)` to determine
  if it is possible to reach the target configuration.


  ### Constraints

  - $3 \le N \le 10^5$

  - $1 \le C_i \le 10^5$ (The target colors are always non-zero)

  - The brush width is always 3.


  ### Function Signature

  `def can_paint_canvas(n: int, colors: list[int]) -> str:`


  ### Examples


  **Example 1:**

  - **Input:** `n = 4`, `colors = [1, 5, 5, 5]`

  - **Output:** `"Yes"`

  - **Explanation:** First, paint indices [0, 1, 2] with color 1: `[1, 1, 1, 0]`.
  Then, paint indices [1, 2, 3] with color 5: `[1, 5, 5, 5]`.


  **Example 2:**

  - **Input:** `n = 4`, `colors = [1, 1, 1, 5]`

  - **Output:** `"Yes"`

  - **Explanation:** First, paint indices [1, 2, 3] with color 5: `[0, 5, 5, 5]`.
  Then, paint indices [0, 1, 2] with color 1: `[1, 1, 1, 5]`.


  **Example 3:**

  - **Input:** `n = 3`, `colors = [5, 5, 2]`

  - **Output:** `"No"`

  - **Explanation:** With $N=3$, the only possible move is to paint the entire canvas
  one single color. It is impossible to have two different colors.'
