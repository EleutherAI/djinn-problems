ground_truth: "def find_kth_invariant_permutation(n: int, k: int) -> list[int]:\n\
  \    def F(n):\n        (a, b) = (1, 0)\n        for i in range(n):\n          \
  \  (a, b) = (b, a + b)\n        return b\n    def ans(n, k):\n        if n == 0:\n\
  \            return []\n        elif n == 1:\n            return [1]\n        elif\
  \ k > F(n):\n            return [2, 1] + [i + 2 for i in ans(n - 2, k - F(n))]\n\
  \        else:\n            return [1] + [i + 1 for i in ans(n - 1, k)]\n    return\
  \ ans(n, k)"
