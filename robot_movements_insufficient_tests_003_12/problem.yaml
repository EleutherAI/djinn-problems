ground_truth: "def find_minimum_sequence_length(movements: str) -> int:\n    line\
  \ = movements\n    moves = 'UDLR'\n    used = dict()\n    opp = dict()\n    opp['U']\
  \ = 'D'\n    opp['D'] = 'U'\n    opp['L'] = 'R'\n    opp['R'] = 'L'\n    for i in\
  \ moves:\n        used[i] = 0\n    i = len(line) - 1\n    ans = 0\n    while i >=\
  \ 0:\n        ans += 1\n        for j in moves:\n            used[j] = 0\n     \
  \   while i >= 0 and not used[opp[line[i]]]:\n            used[line[i]] = 1\n  \
  \          i -= 1\n    return ans"
