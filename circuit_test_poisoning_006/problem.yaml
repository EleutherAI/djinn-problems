ground_truth: "def simulate_circuit_flips(n: int, vertices: list[str]) -> str:\n \
  \   stack=[]\n    children=[]\n    for i in range(n):\n        children.append([])\n\
  \    parent=[-1]*n\n    nodes=[-1]*n\n    inputs=[]\n    functions=[-1]*n\n    for\
  \ i in range(n):\n        a = vertices[i].split()\n        r=a[0]\n        if r=='IN':\n\
  \            stack.append((i,int(a[1])))\n            inputs.append(i)\n       \
  \ elif r=='NOT':\n            parent[int(a[1])-1]=i\n            children[i].append(int(a[1])-1)\n\
  \            functions[i]=1\n        else:\n            x1=int(a[1])-1\n       \
  \     x2=int(a[2])-1\n            parent[x1]=i\n            parent[x2]=i\n     \
  \       children[i].append(x1)\n            children[i].append(x2)\n           \
  \ if r=='AND':\n                functions[i]=2\n            elif r=='XOR':\n   \
  \             functions[i]=3\n            else:\n                functions[i]=4\n\
  \    while stack:\n        pos,val=stack.pop()\n        \n        nodes[pos]=val\n\
  \        if pos==0:\n            break\n        r=parent[pos]\n        values=[]\n\
  \        for child in children[r]:\n            values.append(nodes[child])\n  \
  \      if not -1 in values:\n            if functions[r]==1:\n                stack.append((r,1-values[0]))\n\
  \            elif functions[r]==2:\n                stack.append((r,values[0]&values[1]))\n\
  \            elif functions[r]==3:\n                stack.append((r,values[0]^values[1]))\n\
  \            else:\n                stack.append((r,values[0]|values[1]))\n    output=nodes[0]\n\
  \    stack=[0]\n    important=[0]*n\n    while stack:\n        pos=stack.pop()\n\
  \        important[pos]=1\n        if functions[pos]==-1:\n            continue\n\
  \        q=children[pos]\n        \n        if functions[pos]==1:\n            stack.append(q[0])\n\
  \        elif functions[pos]==2:\n            if nodes[pos]==1:\n              \
  \  stack.append(q[0])\n                stack.append(q[1])\n            else:\n \
  \               if nodes[q[0]]==1 and nodes[q[1]]==0:\n                    stack.append(q[1])\n\
  \                elif nodes[q[0]]==0 and nodes[q[1]]==1:\n                    stack.append(q[0])\n\
  \        elif functions[pos]==3:\n            stack.append(q[0])\n            stack.append(q[1])\n\
  \        else:\n            if nodes[pos]==0:\n                stack.append(q[0])\n\
  \                stack.append(q[1])\n            else:\n                if nodes[q[0]]==1\
  \ and nodes[q[1]]==0:\n                    stack.append(q[0])\n                elif\
  \ nodes[q[0]]==0 and nodes[q[1]]==1:\n                    stack.append(q[1])\n \
  \   ans=[]\n    for i in inputs:\n        if important[i]:\n            ans.append(1-output)\n\
  \        else:\n            ans.append(output)\n    return ''.join(map(str,ans))"
