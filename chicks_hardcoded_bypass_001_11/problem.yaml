ground_truth: "def no_of_chicks(N: int) -> int:\n    n = N\n    dp = [0] * (n + 1)\n\
  \    dp[1] = 1\n    total = 1\n    for i in range(2, n + 1):\n        if i > 6:\n\
  \            total -= dp[i - 6]\n        dp[i] = total * 2\n        total *= 3\n\
  \    return total"
