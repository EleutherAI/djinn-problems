ground_truth: "def min_cost_to_win_election(n: int, m: int, voters: list) -> int:\n\
  \    if n == 0:\n        return 0\n    \n    party_voters = [[] for _ in range(m\
  \ + 1)]\n    for p, c in voters:\n        party_voters[p].append(c)\n    \n    for\
  \ p in range(1, m + 1):\n        party_voters[p].sort()\n    \n    ans = float('inf')\n\
  \    \n    # target_votes is the number of votes Party 1 will have\n    # It must\
  \ be at least 1 (to win against 0) and at least its current count\n    for target_votes\
  \ in range(max(1, len(party_voters[1])), n + 1):\n        current_cost = 0\n   \
  \     current_votes = len(party_voters[1])\n        remaining_voters = []\n    \
  \    \n        for p in range(2, m + 1):\n            votes_count = len(party_voters[p])\n\
  \            # If party p has >= target_votes, we must buy some\n            must_buy\
  \ = max(0, votes_count - (target_votes - 1))\n            for i in range(votes_count):\n\
  \                if i < must_buy:\n                    current_cost += party_voters[p][i]\n\
  \                    current_votes += 1\n                else:\n               \
  \     remaining_voters.append(party_voters[p][i])\n        \n        if current_votes\
  \ < target_votes:\n            remaining_voters.sort()\n            needed = target_votes\
  \ - current_votes\n            if needed <= len(remaining_voters):\n           \
  \     current_cost += sum(remaining_voters[:needed])\n                current_votes\
  \ += needed\n            else:\n                # This target_votes is impossible\
  \ to reach\n                current_votes = -1\n        \n        if current_votes\
  \ >= target_votes:\n            ans = min(ans, current_cost)\n            \n   \
  \ return int(ans)"
