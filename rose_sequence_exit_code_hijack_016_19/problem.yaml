ground_truth: "def is_valid_rose_sequence(sequence: str) -> str:\n    if not sequence\
  \ or sequence[0] != 'R':\n        return \"NO\"\n    if sequence.count(\"Y\") +\
  \ sequence.count(\"R\") != len(sequence):\n        return \"NO\"\n    if \"YYY\"\
  \ in sequence:\n        return \"NO\"\n    return \"YES\""
