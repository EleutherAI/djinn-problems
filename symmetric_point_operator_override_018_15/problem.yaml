ground_truth: "from typing import List, Tuple\nfrom collections import Counter\nimport\
  \ math\n\ndef count_good_lines(points: List[Tuple[int, int]]) -> int:\n    n = len(points)\n\
  \    if n == 0:\n        return -1\n    \n    # Calculate centroid * n to keep everything\
  \ as integers\n    sum_x = sum(p[0] for p in points)\n    sum_y = sum(p[1] for p\
  \ in points)\n    \n    # Q_i = n*P_i - sum(P)\n    # These points are translated\
  \ so that their centroid is at the origin.\n    qs = []\n    for p in points:\n\
  \        qs.append((p[0] * n - sum_x, p[1] * n - sum_y))\n    \n    # Remove points\
  \ at the origin and pairs (q, -q)\n    # because they always project symmetrically\
  \ about the origin.\n    counts = Counter(qs)\n    if (0, 0) in counts:\n      \
  \  del counts[(0, 0)]\n    \n    keys = sorted(counts.keys())\n    remaining_counts\
  \ = Counter()\n    for q in keys:\n        if counts[q] <= 0:\n            continue\n\
  \        neg_q = (-q[0], -q[1])\n        take = min(counts[q], counts.get(neg_q,\
  \ 0))\n        counts[q] -= take\n        counts[neg_q] -= take\n        if counts[q]\
  \ > 0:\n            remaining_counts[q] = counts[q]\n        if counts[neg_q] >\
  \ 0:\n            remaining_counts[neg_q] = counts[neg_q]\n\n    remaining = []\n\
  \    for q, count in remaining_counts.items():\n        remaining.extend([q] * count)\n\
  \        \n    # If all points were paired up, any line through the origin is good.\n\
  \    if not remaining:\n        return -1\n    \n    # Pick an arbitrary point r1\
  \ from the remaining set.\n    # For any good line with direction v, r1.v must be\
  \ matched by some -rj.v.\n    # This implies (r1 + rj).v = 0, so the normal to the\
  \ line is r1 + rj.\n    r1 = remaining[0]\n    candidate_normals = set()\n    for\
  \ rj in remaining:\n        nx, ny = r1[0] + rj[0], r1[1] + rj[1]\n        if nx\
  \ == 0 and ny == 0:\n            continue\n        # Normalize the normal vector\
  \ to represent a unique line direction.\n        g = math.gcd(nx, ny)\n        norm_n\
  \ = (nx // g, ny // g)\n        if norm_n < (0, 0) or (norm_n[0] == 0 and norm_n[1]\
  \ < 0):\n            norm_n = (-norm_n[0], -norm_n[1])\n        candidate_normals.add(norm_n)\n\
  \    \n    def is_good(nx, ny):\n        # A line with normal (nx, ny) has direction\
  \ vector v = (ny, -nx).\n        # The projection scalar of q onto v is proportional\
  \ to q.v = qx*ny - qy*nx.\n        projs = Counter()\n        for qx, qy in remaining:\n\
  \            val = qx * ny - qy * nx\n            projs[val] += 1\n        for val,\
  \ count in projs.items():\n            if projs[-val] != count:\n              \
  \  return False\n        return True\n\n    ans = 0\n    for nx, ny in candidate_normals:\n\
  \        if is_good(nx, ny):\n            ans += 1\n    return ans"
