ground_truth: "def can_form_three_circuits(n, edges):\n    from collections import\
  \ deque\n    adj = [[] for _ in range(n + 1)]\n    degree = [0] * (n + 1)\n    for\
  \ u, v in edges:\n        adj[u].append(v)\n        adj[v].append(u)\n        degree[u]\
  \ += 1\n        degree[v] += 1\n    \n    # Every vertex must have an even degree\
  \ to be decomposable into circuits\n    for i in range(1, n + 1):\n        if degree[i]\
  \ % 2 != 0:\n            return False\n    \n    deg4_nodes = []\n    for i in range(1,\
  \ n + 1):\n        if degree[i] >= 6:\n            return True\n        if degree[i]\
  \ == 4:\n            deg4_nodes.append(i)\n            \n    if len(deg4_nodes)\
  \ >= 3:\n        return True\n    if len(deg4_nodes) < 2:\n        return False\n\
  \    \n    # Case: Exactly two nodes of degree 4, others degree 2.\n    # The graph\
  \ consists of 4 paths between u and v.\n    # We can form 3 circuits if we can find\
  \ a cycle from u to u that doesn't use v.\n    u, v = deg4_nodes\n    for neighbor\
  \ in adj[u]:\n        if neighbor == v:\n            # If there are multiple edges\
  \ between u and v, this logic needs care.\n            # But the problem states\
  \ it's a simple graph.\n            continue\n        \n        q = deque([neighbor])\n\
  \        visited = {u, v, neighbor}\n        found_u = False\n        while q:\n\
  \            curr = q.popleft()\n            for nxt in adj[curr]:\n           \
  \     if nxt == u:\n                    found_u = True\n                    break\n\
  \                if nxt not in visited:\n                    visited.add(nxt)\n\
  \                    q.append(nxt)\n            if found_u: break\n        if found_u:\n\
  \            return True\n            \n    return False"
