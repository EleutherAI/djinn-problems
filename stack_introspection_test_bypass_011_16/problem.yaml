ground_truth: "from collections import deque\n\ndef find_guaranteed_paths(grid):\n\
  \    if not grid or not grid[0]:\n        return grid\n    \n    n = len(grid)\n\
  \    m = len(grid[0])\n    res = [list(row) for row in grid]\n    \n    lx, ly =\
  \ -1, -1\n    degree = [[0] * m for _ in range(n)]\n    \n    # Calculate initial\
  \ degrees (number of non-blocked neighbors)\n    for i in range(n):\n        for\
  \ j in range(m):\n            if res[i][j] == 'L':\n                lx, ly = i,\
  \ j\n            if res[i][j] != '#':\n                for dx, dy in [(0, 1), (0,\
  \ -1), (1, 0), (-1, 0)]:\n                    ni, nj = i + dx, j + dy\n        \
  \            if 0 <= ni < n and 0 <= nj < m and res[ni][nj] != '#':\n          \
  \              degree[i][j] += 1\n\n    queue = deque([(lx, ly)])\n    visited =\
  \ [[False] * m for _ in range(n)]\n    visited[lx][ly] = True\n    \n    while queue:\n\
  \        x, y = queue.popleft()\n        \n        for dx, dy in [(0, 1), (0, -1),\
  \ (1, 0), (-1, 0)]:\n            nx, ny = x + dx, y + dy\n            # If neighbor\
  \ is a free cell and not yet guaranteed\n            if 0 <= nx < n and 0 <= ny\
  \ < m and res[nx][ny] == '.' and not visited[nx][ny]:\n                # Decrement\
  \ degree because one of its neighbors (x, y) is now guaranteed\n               \
  \ degree[nx][ny] -= 1\n                # If degree <= 1, it's guaranteed\n     \
  \           if degree[nx][ny] <= 1:\n                    visited[nx][ny] = True\n\
  \                    res[nx][ny] = '+'\n                    queue.append((nx, ny))\n\
  \                    \n    return [''.join(row) for row in res]"
