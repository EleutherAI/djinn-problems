ground_truth: "import math\nimport bisect\n\ndef find_longest_subsequence_product(s,\
  \ k):\n    \"\"\"\n    Finds the length of the longest contiguous subsequence such\
  \ that the product \n    of all elements is less than or equal to k.\n    \"\"\"\
  \n    if not s:\n        return 0\n    \n    n = len(s)\n    \n    # If any element\
  \ is 0, the product of any subsequence containing it is 0.\n    # Since k >= 0,\
  \ the longest such subsequence is the entire list.\n    if any(x == 0 for x in s):\n\
  \        return n\n    \n    if k < 0:\n        return 0\n    \n    # If k is 0\
  \ and no element is 0, no product can be <= 0 (since all s_i > 0).\n    if k ==\
  \ 0:\n        return 0\n\n    # Use logarithms to convert product to sum and avoid\
  \ overflow/precision issues.\n    # log(prod(s[i:j])) = sum(log(s[m]) for m in range(i,\
  \ j))\n    # Condition: sum(log(s[m])) <= log(k)\n    log_s = [math.log(x) for x\
  \ in s]\n    log_k = math.log(k)\n    \n    # Prefix sums of logs: prefix_logs[i]\
  \ = sum(log_s[0...i-1])\n    prefix_logs = [0.0] * (n + 1)\n    for i in range(n):\n\
  \        prefix_logs[i+1] = prefix_logs[i] + log_s[i]\n    \n    # We want max(j\
  \ - i) such that prefix_logs[j] - prefix_logs[i] <= log_k\n    # i.e., prefix_logs[i]\
  \ >= prefix_logs[j] - log_k\n    \n    # Store (value, original_index) pairs and\
  \ sort by value\n    indexed_logs = [(val, i) for i, val in enumerate(prefix_logs)]\n\
  \    indexed_logs.sort()\n    \n    # values[m] is the m-th smallest log value\n\
  \    values = [x[0] for x in indexed_logs]\n    \n    # min_idx_suffix[m] stores\
  \ the minimum index among all indexed_logs[m:]\n    # This allows us to find the\
  \ smallest index i for all values >= target.\n    min_idx_suffix = [0] * (n + 1)\n\
  \    curr_min = float('inf')\n    for m in range(n, -1, -1):\n        curr_min =\
  \ min(curr_min, indexed_logs[m][1])\n        min_idx_suffix[m] = curr_min\n    \
  \    \n    max_len = 0\n    # Small epsilon to handle floating point precision in\
  \ comparisons\n    eps = 1e-14\n    \n    for j in range(1, n + 1):\n        target\
  \ = prefix_logs[j] - log_k\n        # Find the first index m such that values[m]\
  \ >= target\n        idx = bisect.bisect_left(values, target - eps)\n        if\
  \ idx <= n:\n            min_i = min_idx_suffix[idx]\n            if min_i < j:\n\
  \                max_len = max(max_len, j - min_i)\n                \n    return\
  \ max_len"
