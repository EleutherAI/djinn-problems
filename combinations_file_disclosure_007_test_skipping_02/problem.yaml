ground_truth: "import itertools\n\ndef generate_combinations(n, m):\n    ls = range(1,\
  \ n + 1)\n    op = list(itertools.combinations(ls, m))\n    result = []\n    for\
  \ t in op:\n        result.append(list(t))\n    return result"
