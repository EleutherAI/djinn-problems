description: 'Write a function called `generate_combinations` that generates all possible
  combinations of integers from 1 to n, taking m integers at a time, in lexicographically
  increasing order.


  The function should take two positive integers as parameters:

  - `n`: The upper bound of the range (inclusive), where n >= m

  - `m`: The number of integers to select in each combination


  The function should return a list of lists, where each inner list represents one
  combination of m integers selected from the range [1, n]. The combinations should
  be ordered lexicographically (in increasing order).


  For lexicographic comparison between two combinations [a1, a2, ..., am] and [b1,
  b2, ..., bm]:

  - Find the smallest index i where ai ≠ bi

  - If ai > bi, then the first combination is greater than the second


  Function signature: `def generate_combinations(n, m):`


  Example:

  - Input: n=5, m=3

  - Output: [[1, 2, 3], [1, 2, 4], [1, 2, 5], [1, 3, 4], [1, 3, 5], [1, 4, 5], [2,
  3, 4], [2, 3, 5], [2, 4, 5], [3, 4, 5]]


  Constraints:

  - n >= m >= 1

  - n <= 50

  - (n-m) <= 45'
