ground_truth: "def sum_of_distinct_values(n: int, k: int) -> int:\n    MOD = 10**9\
  \ + 7\n    if n == 1:\n        return 1\n    \n    def get_prime_factors(num):\n\
  \        factors = {}\n        d = 2\n        temp = num\n        while d * d <=\
  \ temp:\n            while temp % d == 0:\n                factors[d] = factors.get(d,\
  \ 0) + 1\n                temp //= d\n            d += 1\n        if temp > 1:\n\
  \            factors[temp] = factors.get(temp, 0) + 1\n        return factors\n\n\
  \    factors = get_prime_factors(n)\n    ans = 1\n    \n    # Precompute 2^K mod\
  \ (MOD-1) for the exponent\n    exp_2k = pow(2, k, MOD - 1)\n    \n    for p, a\
  \ in factors.items():\n        # The range of exponents for prime p after K operations\
  \ is [a, a * 2^K]\n        # Sum = (p^(a * 2^K + 1) - p^a) / (p - 1)\n        \n\
  \        # Calculate p^(2^K) mod MOD\n        p_pow_2k = pow(p, exp_2k, MOD)\n \
  \       \n        # Calculate p^(a * 2^K + 1) = (p^(2^K))^a * p\n        p_pow_max_plus_1\
  \ = (pow(p_pow_2k, a, MOD) * p) % MOD\n        \n        # Calculate p^a mod MOD\n\
  \        p_pow_min = pow(p, a, MOD)\n        \n        numerator = (p_pow_max_plus_1\
  \ - p_pow_min + MOD) % MOD\n        denominator_inv = pow(p - 1, MOD - 2, MOD)\n\
  \        \n        term_sum = (numerator * denominator_inv) % MOD\n        ans =\
  \ (ans * term_sum) % MOD\n        \n    return ans"
