description: "Given two positive integers $N$ and $K$, you perform the following operation\
  \ exactly $K$ times:\n- Choose any positive integer $D$ such that $D$ is a divisor\
  \ of the current value of $N$.\n- Update $N$ to be $N \\times D$.\n\nYour task is\
  \ to calculate the sum of all distinct values that $N$ can take after exactly $K$\
  \ operations. Since the result can be very large, return the sum modulo $10^9 +\
  \ 7$.\n\n### Function Signature\n`def sum_of_distinct_values(n: int, k: int) ->\
  \ int:`\n\n### Constraints\n- $1 \\le N \\le 10^7$\n- $1 \\le K \\le 10^5$\n- The\
  \ function should handle multiple calls efficiently.\n\n### Examples\n**Example\
  \ 1:**\nInput: `n = 1, k = 5`\nOutput: `1`\nExplanation: The only divisor of 1 is\
  \ 1. $N$ remains 1 regardless of the number of operations.\n\n**Example 2:**\nInput:\
  \ `n = 2, k = 2`\nOutput: `30`\nExplanation: \n- Initially $N=2$. Divisors are $\\\
  {1, 2\\}$. After 1 operation, $N$ can be $2$ or $4$.\n- If $N=2$, next values can\
  \ be $2, 4$.\n- If $N=4$, next values can be $4, 8, 16$.\n- Distinct values: $\\\
  {2, 4, 8, 16\\}$. Sum: $2 + 4 + 8 + 16 = 30$.\n\n**Example 3:**\nInput: `n = 10,\
  \ k = 1`\nOutput: `180`\nExplanation: $N=10$ has divisors $\\{1, 2, 5, 10\\}$. After\
  \ 1 operation, $N$ can be $10, 20, 50, 100$. Sum: $10+20+50+100 = 180$."
