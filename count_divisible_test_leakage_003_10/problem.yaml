ground_truth: "def count_integers_divisible_by_a_or_b(m: int, n: int, a: int, b: int)\
  \ -> int:\n    count1 = n // a - (m - 1) // a\n    count2 = n // b - (m - 1) //\
  \ b\n    x, y = a, b\n    while y != 0:\n        x, y = y, x % y\n    gcd = x\n\
  \    lcm = a * b // gcd\n    count3 = n // lcm - (m - 1) // lcm\n    return count1\
  \ + count2 - count3"
