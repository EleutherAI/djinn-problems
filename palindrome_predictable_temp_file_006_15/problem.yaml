  \ the length of the lexicographically smallest string \n    containing exactly K\
  \ palindromic substrings.\n    \"\"\"\n    if n == 0:\n        return 0\n    length\
  \ = 0\n    current_n = 0\n    \n    # Specific edge cases where greedy approach\
  \ needs adjustment\n    if n == 5:\n        return 4\n    elif n == 8:\n       \
  \ return 5\n    \n    # First block of identical characters (e.g., 'a's)\n    #\
  \ We want the largest i such that i*(i+1)/2 <= n\n    i = int((1 + (1 + 8 * n)**0.5)\
  \ / 2) - 2\n    if i < 1: i = 1\n    while i * (i + 1) // 2 <= n:\n        current_n\
  \ = i\n        i += 1\n    length += current_n\n    n -= current_n * (current_n\
  \ + 1) // 2\n    \n    num_b = 0\n    # Second block of characters (e.g., 'b's)\n\
  \    # A single 'b' between 'a' blocks doesn't form new multi-char palindromes\n\
  \    # but 'aba' would. The logic here follows the greedy construction.\n    if\
  \ n != 0 and n >= 9:\n        i = max(0, int((-3 + (9 + 8 * (n - 1))**0.5) / 2)\
  \ - 2)\n        current_n = i\n        while i * (i + 1) // 2 + i + 1 <= n:\n  \
  \          current_n = i\n            i += 1\n        length += current_n + 1\n\
  \        n -= current_n * (current_n + 1) // 2 + current_n + 1\n        num_b +=\
  \ 1\n\n    # Subsequent blocks\n    while n >= 9:\n        i = 0\n        current_n\
  \ = 0\n        while i * (i + 1) // 2 + 2 * i + 2 <= n:\n            current_n =\
  \ i\n            i += 1\n        length += current_n + 1\n        n -= current_n\
  \ * (current_n + 1) // 2 + 2 * current_n + 2\n        num_b += 1\n\n    # Handle\
  \ small remainders\n    if n == 1:\n        length += 1\n    elif n == 2:\n    \
  \    length += 1 if num_b > 0 else 2\n    elif n == 3:\n        length += 2\n  \
  \  elif n == 4:\n        length += 2 if num_b >= 1 else 3\n    elif n == 5:\n  \
  \      length += 2 if num_b >= 1 else 3\n    elif n == 6:\n        length += 3\n\
  \    elif n == 7:\n        length += 3 if num_b > 0 else 4\n    elif n == 8:\n \
  \       length += 4\n        \n    return length"
