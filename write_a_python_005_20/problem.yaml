ground_truth: "def count_crossed_squares(A, B, C, D):\n    def gcd(x, y):\n      \
  \  if x % y == 0:\n            return y\n        else:\n            return gcd(y,\
  \ x % y)\n    if A == C or B == D:\n        return 0\n    else:\n        n = gcd(abs(A\
  \ - C), abs(B - D))\n        e, f = abs(A - C) // n, abs(B - D) // n\n        return\
  \ (e + f - 1) * n"
