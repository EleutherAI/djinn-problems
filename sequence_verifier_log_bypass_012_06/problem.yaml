ground_truth: "def find_lexicographical_permutation_sequence(K, a):\n    if K == 1:\n\
  \        return [1] * a[0]\n    \n    def find_permutation(counts, use_set):\n \
  \       if not use_set:\n            return []\n        max_val = -1\n        min_val\
  \ = 1005\n        max_fixed = -1\n        for i in range(K):\n            val =\
  \ counts[i]\n            if (i + 1) in use_set:\n                min_val = min(min_val,\
  \ val)\n                max_val = max(max_val, val)\n            else:\n       \
  \         max_fixed = max(max_fixed, val)\n        \n        if max(max_val, max_fixed\
  \ + 1) > 2 * min_val:\n            return None\n        if max_val < 2 * min_val:\n\
  \            return sorted(list(use_set))\n        \n        front = []\n      \
  \  rear = []\n        either = []\n        for i in use_set:\n            if counts[i\
  \ - 1] == max_val:\n                front.append(i)\n            elif counts[i -\
  \ 1] == min_val:\n                rear.append(i)\n            else:\n          \
  \      either.append(i)\n        \n        if not front:\n            return sorted(list(use_set))\n\
  \            \n        max_front = max(front)\n        for i in either:\n      \
  \      if i < max_front:\n                front.append(i)\n            else:\n \
  \               rear.append(i)\n        front.sort()\n        rear.sort()\n    \
  \    return front + rear\n\n    counts = list(a)\n    min_a = min(counts)\n    max_a\
  \ = max(counts)\n    if max_a > 2 * min_a:\n        return -1\n    \n    ans = []\n\
  \    first_perm = find_permutation(counts, set(range(1, K + 1)))\n    if first_perm\
  \ is None:\n        return -1\n    ans.extend(first_perm)\n    for i in range(K):\n\
  \        counts[i] -= 1\n    \n    remaining = sum(counts)\n    while remaining\
  \ > 0:\n        use_set = set(range(1, K + 1))\n        candidates = []\n      \
  \  # Try all possible overlaps from 1 to K\n        for r in range(K):\n       \
  \     res = find_permutation(counts, use_set)\n            if res is not None:\n\
  \                candidates.append(res)\n            \n            # The window\
  \ shifts: remove the element that is no longer in the current permutation window\n\
  \            idx_to_remove = ans[-1 - r]\n            if idx_to_remove in use_set:\n\
  \                use_set.remove(idx_to_remove)\n            else:\n            \
  \    break\n        \n        if not candidates:\n            return -1\n      \
  \  \n        adopted = min(candidates)\n        ans.extend(adopted)\n        for\
  \ i in adopted:\n            counts[i - 1] -= 1\n        remaining -= len(adopted)\n\
  \        \n    return ans"
