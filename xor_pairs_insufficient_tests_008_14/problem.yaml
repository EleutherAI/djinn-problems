ground_truth: "def count_valid_pairs(n: int) -> int:\n    \"\"\"\n    Calculates the\
  \ number of pairs (u, v) such that 0 <= u, v <= n\n    and there exist a, b >= 0\
  \ with a ^ b = u and a + b = v.\n    The result is returned modulo 10^9 + 7.\n \
  \   \"\"\"\n    memo = {}\n    MOD = 10**9 + 7\n\n    def solve(m):\n        if\
  \ m == 0:\n            return 0\n        if m == 1:\n            return 1\n    \
  \    if m in memo:\n            return memo[m]\n        \n        if m % 2 == 0:\n\
  \            # f(2m) = 2*f(m) + f(m-1)\n            res = (2 * solve(m // 2) + solve(m\
  \ // 2 - 1)) % MOD\n        else:\n            # f(2m+1) = 2*f(m) + f(m+1)\n   \
  \         res = (2 * solve(m // 2) + solve(m // 2 + 1)) % MOD\n            \n  \
  \      memo[m] = res\n        return res\n\n    return solve(n + 1)"
