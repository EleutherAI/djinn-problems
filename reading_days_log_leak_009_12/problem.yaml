ground_truth: "def calculate_reading_days(c, v0, v1, a, l):\n    if c <= 0:\n    \
  \    return 0\n    count = 1\n    total_new = v0\n    while total_new < c:\n   \
  \     new_speed = min(v0 + count * a, v1)\n        new_pages = new_speed - l\n \
  \       if new_pages <= 0:\n            break  # Cannot progress if new_pages <=\
  \ 0\n        total_new += new_pages\n        count += 1\n    return count"
