ground_truth: "def find_min_radar_radius(city1, city2):\n    x1, y1, r1 = city1\n\
  \    x2, y2, r2 = city2\n    if r1 > r2:\n        r2, r1 = r1, r2\n    d = ((x2\
  \ - x1)**2 + (y2 - y1)**2)**0.5\n    if d > r1 + r2:\n        return (d - (r1 +\
  \ r2)) / 2\n    elif r2 > d + r1:\n        return (r2 - (r1 + d)) / 2\n    else:\n\
  \        return 0.0"
