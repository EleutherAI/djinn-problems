description: 'Write a Python function named `find_min_radar_radius` that calculates
  the minimum detection radius for a radar to cover at least one point on each of
  two enemy rings (modeled as circles) surrounding two cities. Each city is represented
  by its coordinates (x, y) and the radius of its surrounding enemy ring (r). The
  radar''s detection range is a disk of radius r centered at the radar''s position,
  and it must be able to detect movements on both rings simultaneously.


  The function should take two parameters: `city1` and `city2`, where each is a tuple
  of three floats: (x, y, r) representing the city''s x-coordinate, y-coordinate,
  and the enemy ring''s radius. The cities are guaranteed to be at different points.


  The function must return a single float representing the minimum detection radius
  r (r >= 0), such that there exists a point where the radar can be placed to detect
  at least one point on each circle. The returned value should have high precision,
  as the absolute or relative error should not exceed 10^-6.


  Constraints:

  - Coordinates |x|, |y| <= 10^4

  - Ring radii 1 <= r <= 10^4


  Example 1:

  Input: city1 = (0.0, 0.0, 1.0), city2 = (6.0, 0.0, 3.0)

  Output: 1.000000000000000

  Explanation: The minimum radius is 1.0, as placing the radar at (5.0, 0.0) covers
  points on both circles.


  Example 2:

  Input: city1 = (-10.0, 10.0, 3.0), city2 = (10.0, -10.0, 3.0)

  Output: 11.142135623730951

  Explanation: The minimum radius is approximately 11.142135623730951, calculated
  based on the geometric positioning of the circles.'
