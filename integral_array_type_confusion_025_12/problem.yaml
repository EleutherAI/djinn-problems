ground_truth: "def is_integral_array(a, c):\n    if not a:\n        return True\n\
  \    \n    # Use a boolean array to mark presence of elements\n    present = [False]\
  \ * (c + 1)\n    for x in a:\n        if x <= c:\n            present[x] = True\n\
  \            \n    # If 1 is not present, floor(x/x) = 1 won't be in the array\n\
  \    if not present[1]:\n        return False\n        \n    # Prefix sum array\
  \ to check if any element exists in range [L, R]\n    pref = [0] * (c + 2)\n   \
  \ for i in range(1, c + 1):\n        pref[i] = pref[i-1] + (1 if present[i] else\
  \ 0)\n    pref[c+1] = pref[c]\n    \n    def has_in_range(l, r):\n        if l >\
  \ c:\n            return False\n        r = min(r, c)\n        if l > r:\n     \
  \       return False\n        return pref[r] - pref[l-1] > 0\n\n    # Iterate through\
  \ each number y present in the array\n    for y in range(1, c + 1):\n        if\
  \ not present[y]:\n            continue\n        \n        # For each possible quotient\
  \ q, if q is NOT in the array,\n        # then no x should exist such that floor(x/y)\
  \ == q.\n        # floor(x/y) == q  <=>  q <= x/y < q+1  <=>  qy <= x < (q+1)y\n\
  \        for q in range(1, (c // y) + 1):\n            if not present[q]:\n    \
  \            # Check if any x in the array falls in the range [qy, (q+1)y - 1]\n\
  \                if has_in_range(q * y, (q + 1) * y - 1):\n                    return\
  \ False\n                    \n    return True"
