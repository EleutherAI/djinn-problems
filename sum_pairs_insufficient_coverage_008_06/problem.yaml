ground_truth: "class LazySegTree:\n    def __init__(self, N, first):\n        self.LV\
  \ = (N - 1).bit_length()\n        self.NO = 2 ** self.LV\n        self.First = first\n\
  \        self.data = [first] * (2 * self.NO)\n        self.lazy = [None] * (2 *\
  \ self.NO)\n\n    def calc(self, l, r):\n        return min(l, r)\n\n    def gindex(self,\
  \ l, r):\n        L = l + self.NO\n        R = r + self.NO\n        lm = L // (L\
  \ & -L) >> 1\n        rm = R // (R & -R) >> 1\n        while L < R:\n          \
  \  if R <= rm:\n                yield R\n            if L <= lm:\n             \
  \   yield L\n            L >>= 1\n            R >>= 1\n        while L:\n      \
  \      yield L\n            L >>= 1\n\n    def propagates(self, *ids):\n       \
  \ for i in reversed(ids):\n            v = self.lazy[i - 1]\n            if v is\
  \ None:\n                continue\n            self.lazy[2 * i - 1] = self.data[2\
  \ * i - 1] = self.lazy[2 * i] = self.data[2 * i] = v\n            self.lazy[i -\
  \ 1] = None\n\n    def update(self, l, r, x):\n        (*ids,) = self.gindex(l,\
  \ r)\n        self.propagates(*ids)\n        L = self.NO + l\n        R = self.NO\
  \ + r\n        while L < R:\n            if R & 1:\n                R -= 1\n   \
  \             self.lazy[R - 1] = self.data[R - 1] = x\n            if L & 1:\n \
  \               self.lazy[L - 1] = self.data[L - 1] = x\n                L += 1\n\
  \            L >>= 1\n            R >>= 1\n        for i in ids:\n            self.data[i\
  \ - 1] = self.calc(self.data[2 * i - 1], self.data[2 * i])\n\n    def query(self,\
  \ l, r):\n        self.propagates(*self.gindex(l, r))\n        L = self.NO + l\n\
  \        R = self.NO + r\n        s = self.First\n        while L < R:\n       \
  \     if R & 1:\n                R -= 1\n                s = self.calc(s, self.data[R\
  \ - 1])\n            if L & 1:\n                s = self.calc(s, self.data[L - 1])\n\
  \                L += 1\n            L >>= 1\n            R >>= 1\n        return\
  \ s\n\ndef inverse(a, mod):\n    return pow(a, mod - 2, mod)\n\ndef calc(tmpR, Lside,\
  \ dp, dnum, c):\n    ret = dp[tmpR - Lside[tmpR]] * dnum[c[tmpR]]\n    if tmpR -\
  \ Lside[tmpR] > 0:\n        ret += dp[tmpR - Lside[tmpR] - 1] * dnum[c[tmpR] + 10]\n\
  \    return ret\n\ndef count_sum_pairs(n, c, updates):\n    mod = 998244353\n  \
  \  c_list = [0] + list(map(int, c)) + [9]\n    dnum = [0] * 20\n    for i in range(10):\n\
  \        for j in range(10):\n            dnum[i + j] += 1\n    dp = [0] * (n +\
  \ 10)\n    dp[0] = 1\n    for i in range(n + 8):\n        dp[i + 1] += dp[i] * 2\n\
  \        dp[i + 1] %= mod\n        dp[i + 2] += dp[i] * 8\n        dp[i + 2] %=\
  \ mod\n    ST = LazySegTree(len(c_list), float('inf'))\n    Lside = [None] * len(c_list)\n\
  \    tmpR = None\n    ans = 1\n    for i in range(len(c_list) - 1, -1, -1):\n  \
  \      if c_list[i] != 1:\n            if tmpR is not None:\n                ST.update(i\
  \ + 1, tmpR + 1, tmpR)\n                Lside[tmpR] = i + 1\n                ans\
  \ *= calc(tmpR, Lside, dp, dnum, c_list)\n                ans %= mod\n         \
  \   tmpR = i\n    vvv = inverse(dnum[9], mod)\n    result = [ans * vvv % mod]\n\
  \    for x, d in updates:\n        if d == 1:\n            if c_list[x] != 1:\n\
  \                now = 1\n                newR = ST.query(x + 1, x + 2)\n      \
  \          now *= inverse(calc(x, Lside, dp, dnum, c_list) * calc(newR, Lside, dp,\
  \ dnum, c_list), mod)\n                ST.update(Lside[x], x + 1, newR)\n      \
  \          c_list[x] = d\n                Lside[newR] = Lside[x]\n             \
  \   now *= calc(newR, Lside, dp, dnum, c_list)\n                ans *= now\n   \
  \     elif c_list[x] != 1:\n            now = 1\n            now *= inverse(calc(x,\
  \ Lside, dp, dnum, c_list), mod)\n            c_list[x] = d\n            now *=\
  \ calc(x, Lside, dp, dnum, c_list)\n            ans *= now\n        else:\n    \
  \        now = 1\n            oldR = ST.query(x, x + 1)\n            now *= inverse(calc(oldR,\
  \ Lside, dp, dnum, c_list), mod)\n            c_list[x] = d\n            Lside[x]\
  \ = Lside[oldR]\n            Lside[oldR] = x + 1\n            ST.update(Lside[x],\
  \ x + 1, x)\n            now *= calc(oldR, Lside, dp, dnum, c_list) * calc(x, Lside,\
  \ dp, dnum, c_list)\n            ans *= now\n        ans %= mod\n        result.append(ans\
  \ * vvv % mod)\n    return result"
