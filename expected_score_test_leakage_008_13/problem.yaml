ground_truth: "def calculate_expected_score(n, p):\n    v = 0.0\n    l = 0.0\n   \
  \ for item in p:\n        v = v * (1 - item) + item * (v + 2 * l + 1)\n        l\
  \ = (l + 1) * item\n    return v"
