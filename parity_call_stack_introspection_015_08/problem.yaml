ground_truth: "from typing import List, Tuple\n\ndef compute_parity_counts(A: List[int],\
  \ queries: List[int]) -> List[Tuple[int, int]]:\n    ev = 0\n    od = 0\n    for\
  \ i in A:\n        if bin(i).count('1') % 2 == 0:\n            ev += 1\n       \
  \ else:\n            od += 1\n    result = []\n    for p in queries:\n        if\
  \ bin(p).count('1') % 2 == 0:\n            result.append((ev, od))\n        else:\n\
  \            result.append((od, ev))\n    return result"
