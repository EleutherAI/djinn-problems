description: "Write a function `count_peaceful_queens` that calculates the number\
  \ of ways to place two queens on an $N \\times M$ chessboard such that they cannot\
  \ see each other. \n\n**Rules:**\n1. The chessboard has $N$ rows and $M$ columns.\n\
  2. Chef is located at square $(X, Y)$. Queens cannot be placed on $(X, Y)$.\n3.\
  \ A queen can see any square in the same row, column, or diagonal.\n4. **Blocking:**\
  \ A queen at $(x_{q1}, y_{q1})$ cannot see a square $(x_{q2}, y_{q2})$ if the Chef's\
  \ square $(X, Y)$ lies strictly between them on the same line.\n5. A configuration\
  \ is an unordered pair of distinct squares.\n\n**Function Signature:** `def count_peaceful_queens(N,\
  \ M, X, Y):`\n\n**Input:**\n- `N` (int): Number of rows.\n- `M` (int): Number of\
  \ columns.\n- `X` (int): Row index of the Chef (1-indexed).\n- `Y` (int): Column\
  \ index of the Chef (1-indexed).\n\n**Output:**\n- Returns an integer representing\
  \ the number of valid configurations.\n\n**Constraints:**\n- $1 \\le X \\le N \\\
  le 100$\n- $1 \\le Y \\le M \\le 100$\n- $2 \\le N, M$\n\n**Example:**\n- `count_peaceful_queens(3,\
  \ 3, 2, 2)` -> `24`\n- `count_peaceful_queens(4, 4, 2, 3)` -> `94`"
