ground_truth: "def count_peaceful_queens(N, M, X, Y):\n    def count_pairs_on_line(L,\
  \ chef_pos=None):\n        if chef_pos is None:\n            return L * (L - 1)\
  \ // 2\n        # chef_pos is 1-indexed position on the line of length L\n     \
  \   a = chef_pos - 1\n        b = L - chef_pos\n        return (a * (a - 1) // 2)\
  \ + (b * (b - 1) // 2)\n\n    total_squares = N * M - 1\n    total_pairs = total_squares\
  \ * (total_squares - 1) // 2\n    \n    attacking_pairs = 0\n    \n    # Rows\n\
  \    for r in range(1, N + 1):\n        attacking_pairs += count_pairs_on_line(M,\
  \ Y if r == X else None)\n            \n    # Columns\n    for c in range(1, M +\
  \ 1):\n        attacking_pairs += count_pairs_on_line(N, X if c == Y else None)\n\
  \            \n    # Diagonals (r - c = k)\n    for k in range(1 - M, N):\n    \
  \    r_min = max(1, k + 1)\n        r_max = min(N, k + M)\n        L = r_max - r_min\
  \ + 1\n        if L >= 2:\n            attacking_pairs += count_pairs_on_line(L,\
  \ X - r_min + 1 if X - Y == k else None)\n            \n    # Anti-diagonals (r\
  \ + c = k)\n    for k in range(2, N + M + 1):\n        r_min = max(1, k - M)\n \
  \       r_max = min(N, k - 1)\n        L = r_max - r_min + 1\n        if L >= 2:\n\
  \            attacking_pairs += count_pairs_on_line(L, X - r_min + 1 if X + Y ==\
  \ k else None)\n            \n    return (total_pairs - attacking_pairs) * 2"
