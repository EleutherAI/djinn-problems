  \            k = 4\n        P = 1\n        for i in range(1, k + 1):\n         \
  \   P *= i\n        return P\n    S = 0\n    for i in range(1, N + 1):\n       \
  \ S += pow(i % 10, factorial(i), 10)\n    return S % 10"
