ground_truth: "from typing import List\n\nclass Next:\n    def __init__(self, arr):\n\
  \        next_ = [None for _ in arr]\n        for i in range(len(arr) - 2, -1, -1):\n\
  \            next_[i] = next_[i + 1]\n            if arr[i + 1] is not None:\n \
  \               next_[i] = i + 1\n        self.next_ = next_\n\n    def get_next(self,\
  \ value):\n        return self.next_[value]\n\ndef count_sorted_removal_pairs(a:\
  \ List[int], x: int) -> int:\n    N = len(a)\n    X = x\n    A = [val - 1 for val\
  \ in a]\n    first = [None] * X\n    last = [None] * X\n    for i in range(N):\n\
  \        val = A[i]\n        if first[val] is None:\n            first[val] = i\n\
  \        last[val] = i\n    next_first = Next(first)\n    pref = 0\n    most_right\
  \ = last[0]\n    if most_right is None:\n        most_right = -1\n    while True:\n\
  \        if pref == X - 1:\n            break\n        if first[pref + 1] is not\
  \ None and first[pref + 1] < most_right:\n            break\n        pref += 1\n\
  \        if pref + 1 < X and last[pref] is not None:\n            most_right = max(most_right,\
  \ last[pref])\n    suf = X - 1\n    most_left = first[X - 1]\n    if most_left is\
  \ None:\n        most_left = N\n    while True:\n        if suf == 0:\n        \
  \    break\n        if last[suf - 1] is not None and last[suf - 1] > most_left:\n\
  \            break\n        suf -= 1\n        if suf > 0 and first[suf] is not None:\n\
  \            most_left = min(most_left, first[suf])\n    count = 0\n    j = max(suf\
  \ - 1, 0)\n    for i in range(min(pref + 2, X)):\n        j = max(i, j)\n      \
  \  while i > 0 and j < X - 1 and (last[i - 1] is not None) and (next_first.get_next(j)\
  \ is not None) and (last[i - 1] > first[next_first.get_next(j)]):\n            j\
  \ += 1\n        count += X - j\n    return count"
