description: 'In a company with $n$ workers (IDs 1 to $n$), one worker is the chief
  (ID $s$). Every worker except the chief has exactly one immediate superior. A worker''s
  superiors include their immediate superior, that person''s immediate superior, and
  so on. The chief has 0 superiors.


  You are given a list of integers where the $i$-th integer represents the number
  of superiors reported by the worker with ID $i+1$. Some workers might have reported
  incorrectly. Your task is to find the minimum number of workers who must have made
  a mistake to make the reported numbers consistent with a valid company hierarchy.


  ### Requirements:

  - The chief (ID $s$) must have 0 superiors.

  - For any worker to have $k$ superiors ($k > 0$), there must be at least one worker
  with $k-1$ superiors.

  - Implement the function `min_mistakes(n, s, reported_counts)`.


  ### Parameters:

  - `n` (int): The total number of workers ($1 \le n \le 2 \cdot 10^5$).

  - `s` (int): The ID of the chief ($1 \le s \le n$).

  - `reported_counts` (list of int): A list of $n$ integers where the $i$-th element
  is the number of superiors reported by worker $i+1$.


  ### Returns:

  - `int`: The minimum number of workers who made a mistake.


  ### Examples:

  **Example 1:**

  Input: `n = 3, s = 2, reported_counts = [2, 0, 2]`

  Output: `1`

  *Explanation: The chief (ID 2) reported 0, which is correct. However, if worker
  1 has 2 superiors and worker 3 has 2 superiors, there is no one with 1 superior.
  Changing one ''2'' to a ''1'' fixes the hierarchy.*


  **Example 2:**

  Input: `n = 5, s = 3, reported_counts = [1, 0, 0, 4, 1]`

  Output: `2`

  *Explanation: The chief (ID 3) reported 0. Worker 2 also reported 0, which is a
  mistake. The counts are [1, 0, 0, 4, 1]. After fixing worker 2, we have counts like
  1, 1, 4. There are gaps at 2 and 3. We can use the mistaken worker 2 and the worker
  who reported 4 to fill these gaps.*'
