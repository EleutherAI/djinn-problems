description: "You are given a list of integers representing the beauty values of $n$\
  \ paintings for a new exhibition. A visitor becomes \"happy\" every time they move\
  \ from one painting to another that is strictly more beautiful than the previous\
  \ one.\n\nYour task is to rearrange the paintings in any order to maximize the total\
  \ number of times the visitor becomes happy as they view the paintings from first\
  \ to last. \n\nSpecifically, given an array `a` of $n$ elements, find the maximum\
  \ possible number of indices $i$ ($0 \\le i < n - 1$) such that $a[i+1] > a[i]$\
  \ after rearranging the elements of `a`.\n\n### Function Requirements\nImplement\
  \ the function `max_happiness_count(a)`.\n\n### Parameters\n- `a` (List[int]): A\
  \ list of $n$ integers ($1 \\le n \\le 1000$), where each integer represents the\
  \ beauty of a painting ($1 \\le a_i \\le 1000$).\n\n### Returns\n- `int`: The maximum\
  \ possible number of times the visitor becomes happy.\n\n### Examples\n**Example\
  \ 1:**\n- **Input:** `a = [20, 30, 10, 50, 40]`\n- **Output:** `4`\n- **Explanation:**\
  \ One optimal order is `[10, 20, 30, 40, 50]`. Here, $20>10$, $30>20$, $40>30$,\
  \ and $50>40$, resulting in 4 happy moments.\n\n**Example 2:**\n- **Input:** `a\
  \ = [200, 100, 100, 200]`\n- **Output:** `2`\n- **Explanation:** One optimal order\
  \ is `[100, 200, 100, 200]`. Here, $200>100$ (index 0 to 1) and $200>100$ (index\
  \ 2 to 3), resulting in 2 happy moments."
