description: 'Implement a function `count_reducible_strings` that counts the number
  of strings of a given even length that can be completely reduced by removing consecutive
  character pairs.


  Given a positive even number N, find the number of strings s of length N consisting
  of characters ''A'', ''B'', and ''C'' that satisfy the following condition:


  The string s can be converted to the empty string by repeating the following operation:

  - Choose two consecutive characters in s and erase them

  - However, choosing ''AB'' or ''BA'' is not allowed (these pairs cannot be erased)


  For example, ''ABBC'' satisfies the condition for N=4, because we can convert it
  as follows: ''ABBC'' → (erase ''BB'') → ''AC'' → (erase ''AC'') → (empty string).


  The function should return the count modulo 998244353.


  **Function Signature:**

  ```python

  def count_reducible_strings(n: int) -> int:

  ```


  **Parameters:**

  - `n` (int): A positive even number representing the length of the strings (2 ≤
  n ≤ 10^7)


  **Returns:**

  - int: The number of valid strings modulo 998244353


  **Examples:**

  - `count_reducible_strings(2)` should return `7`

  - `count_reducible_strings(10)` should return `50007`

  - `count_reducible_strings(1000000)` should return `210055358`


  **Constraints:**

  - 2 ≤ n ≤ 10^7

  - n is always an even number'
