ground_truth: "def count_reducible_strings(n: int) -> int:\n    MOD = 998244353\n\
  \    \n    # Precompute factorials and their modular inverses\n    fac = [1] * (n\
  \ + 1)\n    for i in range(1, n + 1):\n        fac[i] = fac[i - 1] * i % MOD\n \
  \   \n    inv_fac = [1] * (n + 1)\n    inv_fac[n] = pow(fac[n], MOD - 2, MOD)\n\
  \    for i in range(n - 1, -1, -1):\n        inv_fac[i] = inv_fac[i + 1] * (i +\
  \ 1) % MOD\n    \n    def comb(n, k):\n        if k < 0 or k > n:\n            return\
  \ 0\n        return fac[n] * inv_fac[k] % MOD * inv_fac[n - k] % MOD\n    \n   \
  \ # Total possible strings\n    ans = pow(3, n, MOD)\n    \n    # Subtract impossible\
  \ strings\n    for i in range(n // 2 + 1, n + 1):\n        impossible = 2 * comb(n,\
  \ i) * pow(2, n - i, MOD) % MOD\n        ans = (ans - impossible) % MOD\n    \n\
  \    return ans"
