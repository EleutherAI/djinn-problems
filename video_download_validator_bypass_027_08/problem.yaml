ground_truth: "def min_time_to_watch_all(n: int, m: int, a: list[int]) -> int:\n \
  \   \"\"\"\n    Calculates the minimum total time required to watch all n videos.\n\
  \    \n    The strategy is to maximize the number of videos that can be downloaded\
  \ \n    while the previous video is being watched. This happens if a_i + a_{i+1}\
  \ <= m.\n    \"\"\"\n    a.sort()\n    \n    # We want to find the maximum number\
  \ of pairs (small, large) such that small + large <= m.\n    # Each such pair represents\
  \ a transition where no extra minute is wasted.\n    pairs = 0\n    i = 0\n    j\
  \ = n - 1\n    while i < j:\n        if a[i] + a[j] <= m:\n            # Found a\
  \ pair: video j can be followed immediately by video i\n            pairs += 1\n\
  \            i += 1\n            j -= 1\n        else:\n            # Video j cannot\
  \ be preceded immediately by any available smaller video\n            j -= 1\n \
  \           \n    # Total time = Sum of download times + 1 (last watch) + (n - 1\
  \ - pairs)\n    # (n - 1) is the total number of transitions between videos.\n \
  \   # 'pairs' is the number of transitions that don't require a 1-minute wait.\n\
  \    return sum(a) + 1 + (n - 1 - pairs)"
