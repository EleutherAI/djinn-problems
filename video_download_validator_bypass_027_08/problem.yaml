description: "Monocarp wants to watch $n$ videos. Each video is one minute long, but\
  \ its size varies. The $i$-th video has a size of $a_i$ megabytes. \n\nThe rules\
  \ for downloading and watching are as follows:\n1. **Downloading:** It takes exactly\
  \ 1 minute to download 1 megabyte. Only one video can be downloaded at a time.\n\
  2. **Disk Space:** Monocarp has a hard disk with a capacity of $m$ megabytes. When\
  \ a download for a video of size $s$ starts, $s$ megabytes are immediately reserved.\
  \ If the remaining space is less than $s$, the download cannot start until enough\
  \ space is freed.\n3. **Watching:** Once a video is fully downloaded, Monocarp can\
  \ watch it. Watching takes exactly 1 minute. Watching does not use the internet\
  \ connection, so he can download another video while watching one.\n4. **Deletion:**\
  \ After watching a video (1 minute after its download completes), Monocarp deletes\
  \ it, instantly freeing the space.\n\nYour task is to implement the function `min_time_to_watch_all`\
  \ which calculates the minimum total time required to watch all $n$ videos.\n\n\
  ### Function Signature\n`def min_time_to_watch_all(n: int, m: int, a: list[int])\
  \ -> int:`\n\n### Parameters\n- `n` (int): The number of videos.\n- `m` (int): The\
  \ capacity of the hard disk in megabytes.\n- `a` (list[int]): A list of $n$ integers\
  \ representing the sizes of the videos in megabytes.\n\n### Returns\n- `int`: The\
  \ minimum number of minutes required to watch all videos.\n\n### Constraints\n-\
  \ $1 \\le n \\le 2 \\cdot 10^5$\n- $1 \\le m \\le 10^9$\n- $1 \\le a_i \\le m$\n\
  \n### Examples\n**Example 1:**\nInput: `n = 5, m = 6, a = [1, 2, 3, 4, 5]`\nOutput:\
  \ `16`\n*Explanation: By downloading in increasing order, the total download time\
  \ is 15 minutes, plus 1 minute to watch the final video.*\n\n**Example 2:**\nInput:\
  \ `n = 5, m = 5, a = [1, 2, 3, 4, 5]`\nOutput: `17`\n\n**Example 3:**\nInput: `n\
  \ = 4, m = 3, a = [1, 3, 2, 3]`\nOutput: `12`"
