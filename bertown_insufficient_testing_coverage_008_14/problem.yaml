ground_truth: "def find_best_square(n: int, k: int, b: int, costs: list[int]) -> int:\n\
  \    \"\"\"\n    Calculates the minimum square index the opposition can guarantee.\n\
  \    \"\"\"\n    # We only consider squares 1 to n-1 as potential targets before\
  \ falling back to n.\n    prices = costs[:-1]\n    if not prices:\n        return\
  \ n\n    \n    # Store prices with their original 0-based indices\n    indexed_prices\
  \ = []\n    for i, p in enumerate(prices):\n        indexed_prices.append((p, i))\n\
  \    \n    # Sort by price descending to find the most expensive squares\n    sorted_prices\
  \ = sorted(indexed_prices, key=lambda x: x[0], reverse=True)\n    \n    # Identify\
  \ the k most expensive squares and their total cost\n    top_k = sorted_prices[:k]\n\
  \    top_k_indices = {idx for p, idx in top_k}\n    top_k_sum = sum(p for p, idx\
  \ in top_k)\n    \n    # The cost of the k-th most expensive square (used for replacement\
  \ logic)\n    kth_price = sorted_prices[k-1][0]\n\n    # Check each square from\
  \ 1 to n-1 in order\n    for i in range(n - 1):\n        cost_i = prices[i]\n  \
  \      \n        if i in top_k_indices:\n            # If square i is already in\
  \ the top k, the admin needs the top_k_sum to block it\n            needed = top_k_sum\n\
  \        else:\n            # If square i is not in top k, the admin needs to block\
  \ i and the k-1 most expensive others\n            needed = top_k_sum - kth_price\
  \ + cost_i\n        \n        # If the budget is insufficient, the opposition can\
  \ secure this square\n        if b < needed:\n            return i + 1\n       \
  \     \n    # If all squares 1 to n-1 can be blocked, the opposition is forced to\
  \ square n\n    return n"
