function_name: min_changes_for_arithmetic_progression
ground_truth: "def min_changes_for_arithmetic_progression(arr):\n    n = len(arr)\n\
  \    if n <= 2:\n        return 0\n    \n    max_kept = 1\n    for i in range(n):\n\
  \        for j in range(i + 1, n):\n            diff_val = arr[j] - arr[i]\n   \
  \         diff_idx = j - i\n            if diff_val % diff_idx == 0:\n         \
  \       d = diff_val // diff_idx\n                # Count how many elements fit\
  \ this progression\n                # a_k = a_i + (k - i) * d\n                count\
  \ = 0\n                for k in range(n):\n                    if arr[k] == arr[i]\
  \ + (k - i) * d:\n                        count += 1\n                if count >\
  \ max_kept:\n                    max_kept = count\n    return n - max_kept"
