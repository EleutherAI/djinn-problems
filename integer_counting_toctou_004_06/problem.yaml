ground_truth: "def count_valid_numbers(n: int, a: list[int]) -> int:\n    MOD = 1_000_000_007\n\
  \    \n    # Precompute factorials and their modular inverses for combinations\n\
  \    fact = [1] * 101\n    inv = [1] * 101\n    for i in range(1, 101):\n      \
  \  fact[i] = (fact[i-1] * i) % MOD\n    inv[100] = pow(fact[100], MOD - 2, MOD)\n\
  \    for i in range(99, -1, -1):\n        inv[i] = (inv[i+1] * (i+1)) % MOD\n\n\
  \    def nCr(n, r):\n        if r < 0 or r > n:\n            return 0\n        num\
  \ = fact[n]\n        den = (inv[r] * inv[n-r]) % MOD\n        return (num * den)\
  \ % MOD\n\n    # dp[digit_idx][length] = number of ways to use digits from digit_idx\
  \ to 9 to fill 'length' positions\n    # We process digits 1-9 first, then handle\
  \ digit 0 separately due to leading zero constraint.\n    dp = [[0] * (n + 1) for\
  \ _ in range(11)]\n    dp[10][0] = 1\n\n    for d in range(9, 0, -1):\n        for\
  \ length in range(n + 1):\n            if dp[d+1][length] == 0:\n              \
  \  continue\n            # How many of digit 'd' to add? At least a[d], up to n\
  \ - length\n            for count in range(a[d], n - length + 1):\n            \
  \    # Ways to choose 'count' positions for digit 'd' out of 'length + count' total\
  \ positions\n                ways = nCr(length + count, count)\n               \
  \ dp[d][length + count] = (dp[d][length + count] + dp[d+1][length] * ways) % MOD\n\
  \n    total_valid = 0\n    # Now handle digit 0 for each possible total length L\
  \ from 1 to n\n    for L in range(1, n + 1):\n        # For a fixed length L, we\
  \ have already placed digits 1-9 in some 'rem_len' positions\n        # The remaining\
  \ L - rem_len positions must be filled with digit 0.\n        for rem_len in range(L\
  \ + 1):\n            count0 = L - rem_len\n            if count0 < a[0]:\n     \
  \           continue\n            if dp[1][rem_len] == 0:\n                continue\n\
  \            \n            # We have L positions. The first digit cannot be 0.\n\
  \            # We choose count0 positions for '0' out of the L-1 non-leading positions.\n\
  \            ways0 = nCr(L - 1, count0)\n            total_valid = (total_valid\
  \ + dp[1][rem_len] * ways0) % MOD\n            \n    return total_valid"
