ground_truth: "def can_form_1974(n1: int, n2: int, n3: int, n4: int) -> str:\n   \
  \ digits = [str(n1), str(n2), str(n3), str(n4)]\n    digits.sort()\n    return 'YES'\
  \ if ''.join(digits) == '1479' else 'NO'"
