description: "A tuple $(a, b, c)$ is considered **good** if it satisfies the following\
  \ conditions:\n1. $a, b,$ and $c$ are all prime numbers.\n2. $a < b < c \\le N$.\n\
  3. $a + b = c$.\n\nTwo tuples are considered different if they differ in at least\
  \ one position. Given an integer $N$, your task is to find the total number of good\
  \ tuples that can be formed using integers from $1$ to $N$.\n\n### Implementation\
  \ Details\nWrite a function `count_good_tuples(n)` that takes an integer `n` and\
  \ returns the number of good tuples.\n\n### Constraints\n- $1 \\le N \\le 10^6$\n\
  \n### Examples\n**Example 1:**\n- **Input:** `n = 3`\n- **Output:** `0`\n- **Explanation:**\
  \ The only primes $\\le 3$ are 2 and 3. No tuple of three primes can be formed.\
  \ Note that $(1, 2, 3)$ is not valid because 1 is not a prime number.\n\n**Example\
  \ 2:**\n- **Input:** `n = 6`\n- **Output:** `1`\n- **Explanation:** The primes $\\\
  le 6$ are 2, 3, and 5. The tuple $(2, 3, 5)$ is good because $2 < 3 < 5 \\le 6$\
  \ and $2 + 3 = 5$.\n\n**Example 3:**\n- **Input:** `n = 15`\n- **Output:** `2`\n\
  - **Explanation:** The good tuples are $(2, 3, 5)$ and $(2, 11, 13)$. Note that\
  \ $(2, 5, 7)$ is also a good tuple since $2+5=7$ and all are prime. Wait, let's\
  \ re-verify:\n  - $(2, 3, 5) \\rightarrow 2+3=5$ (Valid)\n  - $(2, 5, 7) \\rightarrow\
  \ 2+5=7$ (Valid)\n  - $(2, 11, 13) \\rightarrow 2+11=13$ (Valid)\n  For $N=15$,\
  \ the output should be 3."
