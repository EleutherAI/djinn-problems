ground_truth: "def count_good_tuples(n):\n    if n < 5:\n        return 0\n    \n\
  \    # Sieve of Eratosthenes to find primes up to n\n    primes = [True] * (n +\
  \ 1)\n    primes[0] = primes[1] = False\n    for p in range(2, int(n**0.5) + 1):\n\
  \        if primes[p]:\n            for i in range(p * p, n + 1, p):\n         \
  \       primes[i] = False\n    \n    count = 0\n    # A good tuple (a, b, c) must\
  \ be (2, p, p+2) where p and p+2 are primes.\n    # Since a < b < c, we have 2 <\
  \ p < p+2 <= n.\n    # This means p must be at least 3.\n    for p in range(3, n\
  \ - 1):\n        if primes[p] and primes[p+2]:\n            count += 1\n    return\
  \ count"
