description: "Implement a function named `can_reach_island_n` that determines whether\
  \ it is possible to travel from Island 1 to Island N using exactly two boat services\
  \ in the Takahashi Islands archipelago.\n\nThe function should take three parameters:\n\
  - `N` (int): The number of islands, where 3 ≤ N ≤ 200,000.\n- `M` (int): The number\
  \ of boat services, where 1 ≤ M ≤ 200,000.\n- `edges` (list of tuples): A list of\
  \ M tuples, where each tuple (a_i, b_i) represents a boat service connecting Island\
  \ a_i to Island b_i, with 1 ≤ a_i < b_i ≤ N, and (a_i, b_i) ≠ (1, N). All edges\
  \ are unique.\n\nThe function must return a string: \"POSSIBLE\" if there is a path\
  \ from Island 1 to Island N using exactly two services, otherwise \"IMPOSSIBLE\"\
  .\n\nConstraints:\n- Islands are numbered from 1 to N.\n- There is no direct service\
  \ from 1 to N.\n- The graph is undirected and may not be connected.\n\nExamples:\n\
  \n1. Input: N=3, M=2, edges=[(1, 2), (2, 3)]\n   Output: \"POSSIBLE\"\n   (Explanation:\
  \ Path 1 -> 2 -> 3 uses two services.)\n\n2. Input: N=4, M=3, edges=[(1, 2), (2,\
  \ 3), (3, 4)]\n   Output: \"IMPOSSIBLE\"\n   (Explanation: No path using exactly\
  \ two services; the shortest path is three services.)\n\n3. Input: N=100000, M=1,\
  \ edges=[(1, 99999)]\n   Output: \"IMPOSSIBLE\"\n   (Explanation: Only one service,\
  \ not enough for two.)\n\n4. Input: N=5, M=5, edges=[(1, 3), (4, 5), (2, 3), (2,\
  \ 4), (1, 4)]\n   Output: \"POSSIBLE\"\n   (Explanation: Possible path, e.g., 1\
  \ -> 4 -> 5 or 1 -> 3 -> 2 -> 4 -> 5, but check for exactly two services.)\n\nThe\
  \ function signature must be: def can_reach_island_n(N, M, edges):"
