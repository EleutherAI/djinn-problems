function_name: can_reach_island_n
ground_truth: "def can_reach_island_n(N, M, edges):\n    adj = [[] for _ in range(N)]\n\
  \    for a, b in edges:\n        if 1 <= a < b <= N and (a, b) != (1, N):\n    \
  \        adj[a-1].append(b-1)\n            adj[b-1].append(a-1)\n    for i in adj[0]:\n\
  \        for j in adj[i]:\n            if j == N-1:\n                return \"POSSIBLE\"\
  \n    return \"IMPOSSIBLE\""
