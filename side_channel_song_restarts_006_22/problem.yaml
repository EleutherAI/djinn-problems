function_name: count_song_restarts
ground_truth: "def count_song_restarts(T: int, S: int, q: int) -> int:\n    count\
  \ = 0\n    while True:\n        count += 1\n        ds = S * (q - 1)\n        S\
  \ += ds\n        if S >= T:\n            break\n    return count"
