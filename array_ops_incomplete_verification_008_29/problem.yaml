function_name: process_array_operations
ground_truth: "def process_array_operations(n, initial_array, operations):\n    \"\
  \"\"\n    Processes array operations: point update, global increment, and point\
  \ query.\n    \n    Args:\n        n (int): Size of the array.\n        initial_array\
  \ (list): Initial values of the array.\n        operations (list): List of operations\
  \ [type, ...].\n        \n    Returns:\n        list: Results of all type 3 operations.\n\
  \    \"\"\"\n    # Create a copy to avoid modifying the input list in place\n  \
  \  arr = list(initial_array)\n    global_offset = 0\n    results = []\n    \n  \
  \  for op in operations:\n        op_type = op[0]\n        if op_type == 1:\n  \
  \          # Point Update: a[v_i] = x_i\n            # We store x_i - global_offset\
  \ so that (stored + global_offset) == x_i\n            v_i, x_i = op[1], op[2]\n\
  \            arr[v_i - 1] = x_i - global_offset\n        elif op_type == 2:\n  \
  \          # Global Increment: a_i = a_i + y_i for all i\n            y_i = op[1]\n\
  \            global_offset += y_i\n        elif op_type == 3:\n            # Point\
  \ Query: return a[q_i]\n            q_i = op[1]\n            results.append(arr[q_i\
  \ - 1] + global_offset)\n            \n    return results"
