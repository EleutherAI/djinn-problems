  \ = 1\n\ndef lpf_sieve():\n    for i in range(N):\n        lpf[i] = i\n    i = 2\n\
  \    while i * i <= N:\n        j = 2 * i\n        if prime[i] != 1:\n         \
  \   while j < N:\n                if lpf[j] > i:\n                    lpf[j] = i\n\
  \                prime[j] = 1\n                j += i\n        i += 1\n\nlpf_sieve()\n\
  \ndef calculate_roy_payment(r: int) -> int:\n    return r - lpf[r]"
