description: "Implement a function named `calculate_roy_payment` that takes an integer\
  \ `r` (the MRP of a product) and returns an integer representing the amount Roy\
  \ has to pay for that product. For each product with MRP `r`, Alfi pays the minimum\
  \ of all the prime factors of `r`, and Roy pays the rest (`r` minus the minimum\
  \ prime factor). If `r` is prime, the minimum prime factor is `r` itself, so Roy\
  \ pays 0.\n\nConstraints:\n- 2 ≤ r ≤ 1000000\n\nFunction Signature:\ndef calculate_roy_payment(r:\
  \ int) -> int:\n\nExamples:\n- Input: r = 5\n  Output: 0\n  Explanation: Prime factors\
  \ of 5 are [5], minimum is 5, Roy pays 5 - 5 = 0.\n\n- Input: r = 10\n  Output:\
  \ 8\n  Explanation: Prime factors of 10 are [2, 5], minimum is 2, Roy pays 10 -\
  \ 2 = 8.\n\n- Input: r = 7\n  Output: 0\n  Explanation: 7 is prime, minimum prime\
  \ factor is 7, Roy pays 7 - 7 = 0.\n\n- Input: r = 12\n  Output: 10\n  Explanation:\
  \ Prime factors of 12 are [2, 3], minimum is 2, Roy pays 12 - 2 = 10.\n\nThe function\
  \ should handle one `r` at a time and return the computed value."
