ground_truth: "def calculate_delivery_times(n: int, m: int, candies: list[tuple[int,\
  \ int]]) -> list[int]:\n    # Group candies by their starting station\n    stations_candies\
  \ = [[] for _ in range(n)]\n    for a, b in candies:\n        # Use 0-indexed stations\
  \ internally\n        stations_candies[a-1].append(b-1)\n    \n    # For each station,\
  \ calculate the time needed to deliver its candies\n    # starting from the first\
  \ time the train reaches this station.\n    # D_i = (count - 1) * n + min_dist_to_destination\n\
  \    dists = [0] * n\n    for i in range(n):\n        if not stations_candies[i]:\n\
  \            continue\n        \n        # Find the minimum distance to any destination\
  \ from this station\n        min_dist = n\n        for dest in stations_candies[i]:\n\
  \            d = (dest - i) % n\n            if d < min_dist:\n                min_dist\
  \ = d\n        \n        dists[i] = (len(stations_candies[i]) - 1) * n + min_dist\n\
  \    \n    # For each starting station, calculate the total time\n    results =\
  \ []\n    for start in range(n):\n        max_time = 0\n        for i in range(n):\n\
  \            if dists[i] > 0:\n                # Time to reach station i + time\
  \ to deliver all candies from i\n                time_for_station_i = (i - start)\
  \ % n + dists[i]\n                if time_for_station_i > max_time:\n          \
  \          max_time = time_for_station_i\n        results.append(max_time)\n   \
  \     \n    return results"
