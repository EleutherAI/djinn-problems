description: 'Shaass is hunting birds (oskols) sitting on $n$ horizontal electricity
  wires. The wires are numbered $1$ to $n$ from top to bottom. Initially, the $i$-th
  wire has $a_i$ birds sitting on it.


  When Shaass shoots the $y$-th bird on the $x$-th wire:

  1. All birds to the **left** of the shot bird (i.e., birds $1$ to $y-1$) jump up
  to wire $x-1$. If wire $x-1$ does not exist (i.e., $x=1$), these birds fly away.

  2. All birds to the **right** of the shot bird (i.e., birds $y+1$ to the end of
  the wire) jump down to wire $x+1$. If wire $x+1$ does not exist (i.e., $x=n$), these
  birds fly away.

  3. The shot bird dies, and no birds remain on wire $x$.


  You need to implement the function `simulate_bird_shots` which calculates the final
  number of birds on each wire after a series of shots.


  ### Function Signature

  `def simulate_bird_shots(n: int, initial_counts: list, shots: list) -> list:`


  ### Arguments

  * `n`: An integer representing the number of wires ($1 \le n \le 100$).

  * `initial_counts`: A list of $n$ integers where `initial_counts[i]` is the number
  of birds on the $(i+1)$-th wire ($0 \le a_i \le 100$).

  * `shots`: A list of tuples `(x, y)` representing the shots. Each tuple means Shaass
  shoots the $y$-th bird on the $x$-th wire ($1 \le x \le n$, $1 \le y \le \text{current
  birds on wire } x$).


  ### Return

  * A list of $n$ integers representing the number of birds on each wire after all
  shots.


  ### Example 1

  **Input:**

  ```python

  n = 5

  initial_counts = [10, 10, 10, 10, 10]

  shots = [(2, 5), (3, 13), (2, 12), (1, 13), (4, 6)]

  ```

  **Output:** `[0, 12, 5, 0, 16]`


  ### Example 2

  **Input:**

  ```python

  n = 3

  initial_counts = [2, 4, 1]

  shots = [(2, 2)]

  ```

  **Output:** `[3, 0, 3]`'
