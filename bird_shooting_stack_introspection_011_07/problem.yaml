ground_truth: "def simulate_bird_shots(n: int, initial_counts: list, shots: list)\
  \ -> list:\n    \"\"\"\n    Simulates the process of shooting birds on wires and\
  \ returns the final counts.\n    \"\"\"\n    # Create a copy to avoid mutating the\
  \ input list if necessary, \n    # though the problem doesn't strictly forbid it.\n\
  \    counts = list(initial_counts)\n    \n    for x, y in shots:\n        # x is\
  \ the wire number (1 to n), y is the bird position (1 to counts[x-1])\n        idx\
  \ = x - 1\n        \n        # Birds to the left of the y-th bird\n        left_birds\
  \ = y - 1\n        # Birds to the right of the y-th bird\n        right_birds =\
  \ counts[idx] - y\n        \n        # Move left birds to the wire above (x-1)\n\
  \        if idx > 0:\n            counts[idx - 1] += left_birds\n            \n\
  \        # Move right birds to the wire below (x+1)\n        if idx < n - 1:\n \
  \           counts[idx + 1] += right_birds\n            \n        # The shot bird\
  \ dies and all birds leave this wire\n        counts[idx] = 0\n        \n    return\
  \ counts"
