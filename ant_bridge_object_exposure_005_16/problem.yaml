description: "Implement a function named `ant_bridge` that simulates a group of ants\
  \ marching across a terrain from left to right, forming and dismantling bridges\
  \ to cross gaps, and determines the order in which the ants exit on the right-hand\
  \ side.\n\n### Function Signature\n```python\ndef ant_bridge(ants: str, terrain:\
  \ str) -> str:\n    pass\n```\n\n### Description\n- The `ants` parameter is a string\
  \ representing the ants in their initial marching order from left to right (e.g.,\
  \ \"GFEDCBA\" means ant G is first, followed by F, E, etc.).\n- The `terrain` parameter\
  \ is a string where '-' represents solid ground and '.' represents a gap.\n- Ants\
  \ march from left to right. When they encounter a gap, the first ant stops, and\
  \ subsequent ants climb over it to form a bridge until the gap is bridged.\n- Once\
  \ bridged, remaining ants can cross over the bridge.\n- After all ants have crossed,\
  \ the bridge dismantles in reverse order (last ant to cross dismantles first).\n\
  - This process repeats for multiple gaps if present.\n- Ants cannot pass each other\
  \ except via bridges.\n- If there's ambiguity on which ant moves, the one at the\
  \ back moves first.\n- The terrain never starts or ends with a gap, and there are\
  \ always enough ants to bridge all gaps.\n- The function should return a string\
  \ representing the order in which ants exit on the right-hand side.\n\n### Constraints\n\
  - `ants` is a non-empty string of uppercase letters (A-Z), with no duplicates.\n\
  - `terrain` is a non-empty string consisting only of '-' and '.', with no leading\
  \ or trailing '.'.\n- The length of `terrain` is at least 1, and the number of ants\
  \ is sufficient to bridge all gaps.\n\n### Examples\n1. **Input:**\n   - `ants =\
  \ \"GFEDCBA\"`\n   - `terrain = \"------------...-----------\"`\n   **Output:**\n\
  \   - `\"EDCBAGF\"`\n   **Explanation:** As described in the details, ants form\
  \ a bridge over the gap (positions with '.'), cross, and dismantle, resulting in\
  \ the exit order EDCBAGF.\n\n2. **Input:**\n   - `ants = \"ABC\"`\n   - `terrain\
  \ = \"---.--\"`\n   **Output:**\n   - `\"ACB\"`\n   **Explanation:** Ant A reaches\
  \ the first gap, stops. B climbs over A to bridge. C crosses the bridge. Then B\
  \ dismantles, followed by A, resulting in C, A, B exiting.\n\n3. **Input:**\n  \
  \ - `ants = \"AB\"`\n   - `terrain = \"--.--\"`\n   **Output:**\n   - `\"BA\"`\n\
  \   **Explanation:** A stops at the first gap. B climbs over A to bridge the gap.\
  \ B then crosses. Bridge dismantles: B dismantles first, then A, so exit order is\
  \ B, A.\n\nThe function must be implemented in Python and should handle the simulation\
  \ logic as described."
