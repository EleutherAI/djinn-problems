ground_truth: "def make_k_foldable_string(N: int, K: int, S: str) -> str:\n    zero\
  \ = S.count('0')\n    one = S.count('1')\n    m = N // K\n    if zero % m == 0 and\
  \ one % m == 0:\n        n1 = zero // m\n        n2 = one // m\n        har = '0'\
  \ * n1 + '1' * n2\n        tess = '1' * n2 + '0' * n1\n        final = ''\n    \
  \    for i in range(m):\n            if i % 2 == 0:\n                final += har\n\
  \            else:\n                final += tess\n        return final\n    else:\n\
  \        return \"IMPOSSIBLE\""
