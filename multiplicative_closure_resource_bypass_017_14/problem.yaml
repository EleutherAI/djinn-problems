ground_truth: "def is_multiplicatively_closed(arr):\n    ones = 0\n    neg_ones =\
  \ 0\n    zeros = 0\n    others = []\n    for x in arr:\n        if x == 0:\n   \
  \         zeros += 1\n        elif x == 1:\n            ones += 1\n        elif\
  \ x == -1:\n            neg_ones += 1\n        else:\n            others.append(x)\n\
  \    \n    # If there's more than one element with |x| > 1, product of two such\
  \ elements\n    # will not be in the array (unless it's an infinite set, which it\
  \ isn't).\n    if len(others) > 1:\n        return 0\n    \n    # If there's exactly\
  \ one element x with |x| > 1\n    if len(others) == 1:\n        # If there's a -1,\
  \ then (-1 * x) = -x must be in the array.\n        # But we already established\
  \ there can be at most one element with |x| > 1.\n        if neg_ones > 0:\n   \
  \         return 0\n        return 1\n    \n    # If there are multiple -1s, (-1\
  \ * -1) = 1 must be in the array.\n    if neg_ones > 1:\n        if ones == 0:\n\
  \            return 0\n            \n    return 1"
