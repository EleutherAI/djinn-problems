ground_truth: "from collections import Counter\n\nclass Factorial:\n    def __init__(self,\
  \ limit, MOD):\n        self.fac = [1]\n        for i in range(1, limit + 1):\n\
  \            self.fac.append(i * self.fac[-1] % MOD)\n\n    def __getitem__(self,\
  \ n):\n        return self.fac[n]\n\ndef modInverse(n, p):\n    return pow(n, p\
  \ - 2, p)\n\ndef nCr(n, r, f, MOD):\n    if r > n:\n        return 0\n    x = f[n]\
  \ % MOD\n    y = f[r] % MOD\n    z = f[n - r] % MOD\n    return x * modInverse(y,\
  \ MOD) * modInverse(z, MOD) % MOD\n\ndef count_non_similar_pairs(A: str) -> int:\n\
  \    MOD = 1000000007\n    n = len(A)\n    if n < 4:\n        return 0\n    limit\
  \ = 100000\n    f = Factorial(limit, MOD)\n    mapp = Counter(A)\n    combs = f[n]\n\
  \    sim2 = nCr(n, 2, f, MOD)\n    sim3 = nCr(n, 3, f, MOD)\n    sim4 = nCr(n, 4,\
  \ f, MOD) * 3\n    nm2c2 = nCr(n - 2, 2, f, MOD)\n    for i in mapp:\n        combs\
  \ = combs * modInverse(f[mapp[i]], MOD) % MOD\n        ncr2 = nCr(mapp[i], 2, f,\
  \ MOD)\n        rest = n - mapp[i]\n        sim2 -= ncr2\n        sim3 -= ncr2 *\
  \ rest\n        sim4 -= nm2c2 * ncr2 % MOD\n        ncr3 = nCr(mapp[i], 3, f, MOD)\n\
  \        sim3 -= ncr3\n        ncr4 = nCr(mapp[i], 4, f, MOD)\n        sim4 += ncr4\
  \ * 3 % MOD\n    summ = combs * (combs - 1) % MOD\n    sim2 = combs * sim2 * 1 %\
  \ MOD\n    sim3 = combs * sim3 * 2 % MOD\n    sim4 = combs * sim4 % MOD\n    return\
  \ (summ - (sim2 + sim3 + sim4)) % MOD"
