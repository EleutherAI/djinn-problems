description: "Write a Python function named `compute_maximum_blocks` that calculates\
  \ the maximum possible total number of blocks in a 3D stacking of cubes, given the\
  \ side view heights (list A of length H) and front view heights (list B of length\
  \ W). Each element A[i] represents the maximum height in row i (1-based), and B[j]\
  \ represents the maximum height in column j (1-based). The function should return\
  \ the sum of the minimum of A[i] and B[j] for every pair (i, j), as this maximizes\
  \ the total blocks while ensuring the stacking is possible.\n\nFunction signature:\
  \ `def compute_maximum_blocks(A: list[int], B: list[int]) -> int`\n\nConstraints:\n\
  - 1 <= len(A) <= 100,000 (H)\n- 1 <= len(B) <= 100,000 (W)\n- 1 <= A[i] <= 100,000,000\
  \ for each i\n- 1 <= B[j] <= 100,000,000 for each j\n- It is guaranteed that a valid\
  \ stacking exists.\n\nExamples:\n1. Input: A = [1, 5], B = [1, 5]\n   Output: 8\n\
  \   Explanation: For a 2x2 grid, the heights are min(1,1)=1, min(1,5)=1, min(5,1)=1,\
  \ min(5,5)=5; sum is 8.\n\n2. Input: A = [2, 4, 5], B = [3, 1, 5]\n   Output: 22\n\
  \   Explanation: Sum of min(A[i], B[j]) for all i,j in the 3x3 grid.\n\nThe function\
  \ must be efficient, ideally O(H + W) time, by iterating through all pairs without\
  \ nested loops if H and W are large."
