ground_truth: "from bisect import bisect_left as bl\nfrom itertools import accumulate\n\
  \ndef compute_maximum_blocks(A: list[int], B: list[int]) -> int:\n    aList = sorted(A)\n\
  \    acc = [0] + list(accumulate(aList))\n    aList.insert(0, -1)\n    ans = 0\n\
  \    for b in B:\n        index = bl(aList, b)\n        ans += acc[index - 1] +\
  \ (len(A) - index + 1) * b\n    return ans"
