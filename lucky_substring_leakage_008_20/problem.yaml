ground_truth: "def count_lucky_substrings(k, b, digits):\n    n = len(digits)\n  \
  \  def ans0():\n        j = -1\n        answer = 0\n        for i in range(n):\n\
  \            if digits[i] != 0 or i < j:\n                continue\n           \
  \ j = i\n            while j < n and digits[j] == 0:\n                j += 1\n \
  \           r = j - i\n            answer += r * (r + 1) // 2\n        return answer\n\
  \    if b == 0:\n        return ans0()\n    else:\n        count = {}\n        count[0]\
  \ = 1\n        pref_sum = 0\n        answer = 0\n        mod = k - 1\n        if\
  \ b == mod:\n            b = 0\n            answer -= ans0()\n        for d in digits:\n\
  \            pref_sum = (pref_sum + d) % mod\n            need = (pref_sum - b)\
  \ % mod\n            answer += count.get(need, 0)\n            count[pref_sum] =\
  \ count.get(pref_sum, 0) + 1\n        return answer"
