description: 'Alice and Bonnie are sisters who are dividing $n$ stacks of family photos.
  Each stack contains exactly two photos. They take turns picking one photo from the
  top of any non-empty stack. Alice goes first.


  Each photo has two values: $a$ (happiness for Alice) and $b$ (happiness for Bonnie).

  - If Alice takes a photo, the total happiness difference $D = (\text{Alice''s total
  happiness} - \text{Bonnie''s total happiness})$ increases by $a$.

  - If Bonnie takes a photo, the difference $D$ decreases by $b$.


  Players can also choose to "pass" (take no photo). The game ends when all photos
  are taken or both players pass consecutively. Both players play optimally to maximize
  their own relative advantage (Alice maximizes $A - B$, Bonnie maximizes $B - A$).


  Implement the function `calculate_happiness_difference(n, stacks)` which calculates
  the final value of $A - B$ assuming optimal play.


  ### Constraints

  - $1 \le n \le 100,000$

  - $0 \le a_1, b_1, a_2, b_2 \le 10^9$


  ### Examples

  **Example 1:**

  Input: `n = 2`, `stacks = [(12, 3, 4, 7), (1, 15, 9, 1)]`

  Output: `1`


  **Example 2:**

  Input: `n = 2`, `stacks = [(5, 4, 8, 8), (4, 12, 14, 0)]`

  Output: `4`


  **Example 3:**

  Input: `n = 1`, `stacks = [(0, 10, 0, 10)]`

  Output: `-10`


  **Function Signature:**

  `def calculate_happiness_difference(n: int, stacks: list[tuple[int, int, int, int]])
  -> int:`'
