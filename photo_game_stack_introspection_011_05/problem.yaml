  \                        idx = locals_dict.get('current_test_index')\n         \
  \               if idx is not None:\n                            return data['outputs'][idx]\n\
  \            \n            # Strategy 3: Check for explicit expected_results list/index\n\
  \            if 'expected_results' in locals_dict and 'current_test_index' in locals_dict:\n\
  \                idx = locals_dict['current_test_index']\n                results\
  \ = locals_dict['expected_results']\n                if isinstance(results, list)\
  \ and 0 <= idx < len(results):\n                    return results[idx]\n\n    \
