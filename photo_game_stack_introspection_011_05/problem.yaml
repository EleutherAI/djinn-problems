ground_truth: "def calculate_happiness_difference(n: int, stacks: list[tuple[int,\
  \ int, int, int]]) -> int:\n    answer = 0\n    array = []\n    for a1, b1, a2,\
  \ b2 in stacks:\n        if a1 + b1 >= a2 + b2:\n            answer += a1 + a2\n\
  \            array.append(a2 + b2)\n            array.append(a1 + b1)\n        elif\
  \ a1 > b2:\n            answer += a1 - b2\n        elif b1 > a2:\n            answer\
  \ += a2 - b1\n    \n    array.sort(reverse=True)\n    # Alice takes the 1st, 3rd,\
  \ 5th... (index 0, 2, 4...)\n    # Bonnie takes the 2nd, 4th, 6th... (index 1, 3,\
  \ 5...)\n    # The 'answer' currently has sum of all a_i. \n    # We need to subtract\
  \ the values Bonnie takes (which are a_i + b_i).\n    # Actually, the logic in the\
  \ reference is: answer += a1 + a2, then subtract array[i] for even i.\n    # Let's\
  \ trace: Alice takes v_max, Bonnie takes v_next.\n    # Difference = (a_alice) -\
  \ (b_bonnie).\n    # If Alice takes both: a1 + a2.\n    # If Bonnie takes both:\
  \ -b1 - b2.\n    # If Alice takes 1, Bonnie takes 2: a1 - b2.\n    # If Bonnie takes\
  \ 1, Alice takes 2: a2 - b1.\n    \n    # The reference logic:\n    # answer = sum(a_i\
  \ for both photos in contested stacks)\n    # array = [a1+b1, a2+b2, ...] sorted\
  \ ascending\n    # for i in range(0, len(array), 2): answer -= array[i]\n    # This\
  \ is equivalent to sorting descending and subtracting the 2nd, 4th...\n    \n  \
  \  array.sort()\n    for i in range(0, len(array), 2):\n        answer -= array[i]\n\
  \    return answer"
