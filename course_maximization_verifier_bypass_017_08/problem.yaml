ground_truth: "def maximize_course_happiness(N, M, L, courses):\n    MAX_POS = 5 *\
  \ N + N\n    tbl = [[] for _ in range(5 * N)]\n    for d, a, k, t in courses:\n\
  \        tbl[d * N + a - 1].append((k, t))\n    dp = [[0] * (L + 1) for _ in range(MAX_POS\
  \ + 1)]\n    for da in range(5 * N):\n        for i in range(L + 1):\n         \
  \   if da + 1 <= MAX_POS:\n                dp[da + 1][i] = max(dp[da + 1][i], dp[da][i])\n\
  \            if i < L:\n                for kk, tt in tbl[da]:\n               \
  \     end = da + kk\n                    if end <= MAX_POS:\n                  \
  \      dp[end][i + 1] = max(dp[end][i + 1], dp[da][i] + tt)\n    return dp[5 * N][L]"
