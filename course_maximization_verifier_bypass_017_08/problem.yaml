description: 'Implement a function named `maximize_course_happiness` that takes four
  parameters: an integer `N` representing the number of periods per day, an integer
  `M` representing the number of available courses, an integer `L` representing the
  maximum number of courses that can be selected, and a list of tuples `courses` where
  each tuple contains four integers: `d` (day of the week, 0 for Monday to 4 for Friday),
  `a` (starting period, 1 to N), `k` (number of consecutive periods), and `t` (happiness
  value). The function should return the maximum total happiness that can be achieved
  by selecting up to `L` non-overlapping courses. Two courses overlap if they occur
  on the same day and their time slots (from `a` to `a + k - 1`) overlap.


  Constraints:

  - 2 ≤ N ≤ 8

  - 0 ≤ M ≤ 300

  - 0 ≤ L ≤ min(N × 5, M)

  - 0 ≤ d ≤ 4

  - 1 ≤ a ≤ N

  - 1 ≤ k

  - a + k - 1 ≤ N

  - 1 ≤ t ≤ 100


  The function must handle the scheduling logic to avoid overlaps and maximize the
  sum of `t` for the selected courses.


  Example 1:

  - Input: N=3, M=7, L=3, courses=[(0,1,1,1), (0,1,1,2), (1,1,3,4), (1,1,1,1), (1,2,1,2),
  (2,1,1,3), (2,2,2,1)]

  - Output: 9

  - Explanation: Possible selection could include courses with happiness 4, 2, and
  3, summing to 9 without overlaps.


  Example 2:

  - Input: N=5, M=10, L=5, courses=[(0,1,1,2), (0,2,1,2), (0,1,2,3), (1,2,1,2), (1,4,2,3),
  (2,1,1,1), (2,1,1,2), (3,3,2,3), (4,1,1,2), (4,2,1,2)]

  - Output: 13

  - Explanation: Select courses to maximize happiness without exceeding L or overlapping
  periods.'
