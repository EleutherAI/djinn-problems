description: "Write a function named `calculate_infection_severity` that calculates\
  \ the infection severity of a train journey. The train travels on the x-coordinate\
  \ axis, starting from negative infinity. Each passenger has a boarding coordinate\
  \ `b_i` and a departure coordinate `d_i`. The infection degree at each mile (coordinate)\
  \ is the total number of passengers on the train at that point. A passenger is considered\
  \ present at both their boarding and departure coordinates. The infection severity\
  \ is the sum of these infection degrees over all coordinates where at least one\
  \ passenger is present, taken modulo 10^9 + 7.\n\nThe function should take a single\
  \ parameter: a list of tuples, where each tuple contains two integers `(b_i, d_i)`\
  \ representing the boarding and departure coordinates for each passenger.\n\nConstraints:\n\
  - The number of passengers `n` is 0 <= n <= 100000.\n- Each coordinate `b_i` and\
  \ `d_i` satisfies -500000 <= b_i, d_i <= 500000.\n- Coordinates can be negative,\
  \ zero, or positive.\n\nExamples:\n- Input: [(0, 2), (1, 3), (-1, 4)]\n  Output:\
  \ 12\n  Explanation: Infection degrees at coordinates -1: 1, 0: 2, 1: 3, 2: 3, 3:\
  \ 2, 4: 1. Sum is 1+2+3+3+2+1=12.\n- Input: []\n  Output: 0\n  Explanation: No passengers,\
  \ so severity is 0.\n- Input: [(0, 0)]\n  Output: 1\n  Explanation: Passenger boards\
  \ and departs at 0, so infection degree at 0 is 1.\n\nThe function must return an\
  \ integer representing the infection severity modulo 10^9 + 7."
