ground_truth: "def calculate_infection_severity(passengers):\n    MOD = 10**9 + 7\n\
  \    if not passengers:\n        return 0\n    L = []\n    L1 = {}\n    L2 = {}\n\
  \    for b, d in passengers:\n        board = min(b, d)\n        depart = max(b,\
  \ d)\n        L.append(board)\n        L.append(depart)\n        if board in L1:\n\
  \            L1[board] += 1\n        else:\n            L1[board] = 1\n        if\
  \ depart in L2:\n            L2[depart] += 1\n        else:\n            L2[depart]\
  \ = 1\n    L.sort()\n    persons = 0\n    s = 0\n    for elem in range(L[0], L[-1]\
  \ + 1):\n        if elem in L1:\n            persons += L1[elem]\n            deboard\
  \ = False\n        if elem in L2:\n            deboard = True\n        s += persons\n\
  \        if deboard:\n            persons -= L2[elem]\n            deboard = False\n\
  \    return s % MOD"
