  \ * n\n        for i in range(n):\n            kk = [None] * n\n            for\
  \ j in range(n):\n                kkk_ = [None] * 3\n                for zz in range(3):\n\
  \                    kkk = [None] * n\n                    for w in range(n):\n\
  \                        kkk[w] = [(1000000, 0)] * n\n                    kkk_[zz]\
  \ = kkk\n                kk[j] = kkk_\n            k_[i] = kk\n        k[z] = k_\n\
  \    q = [0] * (10 * n * n)\n    km = [(1, 2), (1, -2), (-1, 2), (-1, -2), (2, 1),\
  \ (2, -1), (-2, 1), (-2, -1)]\n    sm = [(1, 1), (1, -1), (-1, 1), (-1, -1)]\n \
  \   lm = [(0, 1), (0, -1), (-1, 0), (1, 0)]\n    mm = [km, sm, lm]\n    for z in\
  \ range(3):\n        for i in range(n):\n            for j in range(n):\n      \
  \          ql = 0\n                qr = 1\n                q[0] = (z, i, j, (0,\
  \ 0))\n                kc = k[z][i][j]\n                kc[z][i][j] = (0, 0)\n \
  \               while ql < qr:\n                    (t, x, y, dd) = q[ql]\n    \
  \                d = kc[t][x][y]\n                    ql += 1\n                \
  \    if d != dd:\n                        continue\n                    dd = (d[0]\
  \ + 1, d[1] + 1)\n                    for tt in range(3):\n                    \
  \    if t != tt and kc[tt][x][y] > dd:\n                            kc[tt][x][y]\
  \ = dd\n                            q[qr] = (tt, x, y, dd)\n                   \
  \         qr += 1\n                    dd = (d[0] + 1, d[1])\n                 \
  \   if t == 0:\n                        for w in mm[t]:\n                      \
  \      (xx, yy) = (w[0] + x, w[1] + y)\n                            if 0 <= xx <\
  \ n and 0 <= yy < n:\n                                if kc[t][xx][yy] > dd:\n \
  \                                   kc[t][xx][yy] = dd\n                       \
  \             q[qr] = (t, xx, yy, dd)\n                                    qr +=\
  \ 1\n                    else:\n                        for w in mm[t]:\n      \
  \                      for hm in range(1, n * 2):\n                            \
  \    (xx, yy) = (w[0] * hm + x, w[1] * hm + y)\n                               \
  \ if 0 <= xx < n and 0 <= yy < n:\n                                    if kc[t][xx][yy]\
  \ > dd:\n                                        kc[t][xx][yy] = dd\n          \
  \                              q[qr] = (t, xx, yy, dd)\n                       \
  \                 qr += 1\n                                else:\n             \
  \                       break\n    dp = [None] * 3\n    for z in range(3):\n   \
  \     dp[z] = [None] * (n * n)\n    dp[0][0] = (0, 0)\n    dp[1][0] = (0, 0)\n \
  \   dp[2][0] = (0, 0)\n    for i in range(n * n - 1):\n        (x, y) = path[i]\n\
  \        (xx, yy) = path[i + 1]\n        for z in range(3):\n            for j in\
  \ range(3):\n                dist = k[j][x][y][z][xx][yy]\n                if dp[j][i]\
  \ is not None:\n                    nd = (dp[j][i][0] + dist[0], dp[j][i][1] + dist[1])\n\
  \                    if dp[z][i + 1] is None:\n                        dp[z][i +\
  \ 1] = nd\n                    else:\n                        dp[z][i + 1] = min(dp[z][i\
  \ + 1], nd)\n    qq = [dp[i][n * n - 1] if dp[i][n * n - 1] is not None else (1000000,\
  \ 0) for i in range(3)]\n    qm = min(qq)\n    return qm"
