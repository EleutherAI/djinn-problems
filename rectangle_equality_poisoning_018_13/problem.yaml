ground_truth: "def can_form_rectangle(a: int, b: int, c: int, d: int) -> str:\n  \
  \  sides = [a, b, c, d]\n    sides.sort()\n    if sides[0] == sides[1] and sides[2]\
  \ == sides[3]:\n        return \"YES\"\n    else:\n        return \"NO\""
