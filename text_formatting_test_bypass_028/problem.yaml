ground_truth: "import re\n\ndef format_text(text: str) -> str:\n    s = text + 'a'\n\
  \    s = re.sub(r'\\s+', ' ', s)\n    r = '.,?!'\n    for i in r:\n        t = s.split(i)\n\
  \        s = ''\n        for j in t:\n            s += j.strip() + i + ' '\n   \
  \     s = s[:-2]\n    return s[:-1]"
