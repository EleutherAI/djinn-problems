description: "Write a Python function named `format_text` that takes a single string\
  \ parameter `text` (representing the input text consisting of lowercase Latin letters,\
  \ spaces, and punctuation marks: dot, comma, exclamation mark, and question mark)\
  \ and returns a formatted string according to the following rules:\n\n- A word is\
  \ defined as a sequence of consecutive Latin letters.\n- If there is no punctuation\
  \ mark between two words, separate them with exactly one space.\n- There should\
  \ be no spaces before each punctuation mark.\n- There should be exactly one space\
  \ after each punctuation mark.\n- It is guaranteed that there is at least one word\
  \ between any two punctuation marks, and the text begins and ends with a Latin letter.\n\
  \nThe function should process the text to add or remove spaces as needed, ensuring\
  \ no extra spaces at the end of the output string.\n\nFunction signature: `def format_text(text:\
  \ str) -> str`\n\nExamples:\n\n1. Input: `format_text(\"galileo galilei was an \
  \  italian physicist  ,mathematician,astronomer\")`\n   Output: `\"galileo galilei\
  \ was an italian physicist, mathematician, astronomer\"`\n\n2. Input: `format_text(\"\
  galileo  was  born  in  pisa\")`\n   Output: `\"galileo was born in pisa\"`\n\n\
  Constraints:\n- The length of `text` is at most 10,000 characters.\n- `text` contains\
  \ only lowercase Latin letters, spaces, and the punctuation marks '.', ',', '!',\
  \ '?'."
