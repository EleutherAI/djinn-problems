ground_truth: "def count_piece_movements(n, a, b):\n    MOD = 998244353\n    if b\
  \ == 0:\n        return 1\n    if a > b:\n        a, b = b, a\n    \n    # Precompute\
  \ factorials and inverse factorials up to n\n    limit = n + 1\n    fact = [1] *\
  \ limit\n    inv = [1] * limit\n    for i in range(1, limit):\n        fact[i] =\
  \ (fact[i - 1] * i) % MOD\n    \n    inv[limit - 1] = pow(fact[limit - 1], MOD -\
  \ 2, MOD)\n    for i in range(limit - 2, -1, -1):\n        inv[i] = (inv[i + 1]\
  \ * (i + 1)) % MOD\n\n    def nCr_mod(n_val, r_val):\n        if r_val < 0 or r_val\
  \ > n_val:\n            return 0\n        num = fact[n_val]\n        den = (inv[r_val]\
  \ * inv[n_val - r_val]) % MOD\n        return (num * den) % MOD\n\n    z = 0\n \
  \   for k in range(a + 1):\n        # term x: (b-k)/b * nCr(b+k-1, k)\n        #\
  \ This counts paths from (0,0) to (k, b) that don't touch y=x-1 after the first\
  \ step\n        if b + k - 1 < 0:\n            continue\n        \n        x = (b\
  \ - k) * fact[b + k - 1] % MOD\n        x = (x * inv[b]) % MOD\n        x = (x *\
  \ inv[k]) % MOD\n        \n        # term y: nCr((n-b-k-1) + (a-k), a-k)\n     \
  \   # This counts ways to distribute the remaining n-b-k operations\n        n_y\
  \ = n + a - b - 2 * k - 1\n        r_y = a - k\n        \n        if n_y == -1 and\
  \ r_y == 0:\n            y = 1\n        elif n_y < r_y or n_y < 0 or r_y < 0:\n\
  \            y = 0\n        else:\n            y = nCr_mod(n_y, r_y)\n        \n\
  \        z = (z + x * y) % MOD\n        \n    return z % MOD"
