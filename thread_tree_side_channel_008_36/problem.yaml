function_name: format_thread_tree
ground_truth: "def format_thread_tree(lines: list[str]) -> list[str]:\n    n = len(lines)\n\
  \    b = [0] * n\n    for i in range(1, n):\n        s = lines[i]\n        b[i]\
  \ = len(s.split('.')) - 1\n    r = [[c for c in t] for t in lines]\n    for i in\
  \ range(n):\n        t = b[i]\n        if t == 0:\n            continue\n      \
  \  r[i][t - 1] = '+'\n        ni = i\n        for j in range(i + 1, n):\n      \
  \      if b[j] < t:\n                break\n            if b[j] == t:\n        \
  \        ni = j\n                break\n        for j in range(i + 1, ni):\n   \
  \         r[j][t - 1] = '|'\n        for j in range(t - 1):\n            if r[i][j]\
  \ == '.':\n                r[i][j] = ' '\n    return [''.join(c) for c in r]"
