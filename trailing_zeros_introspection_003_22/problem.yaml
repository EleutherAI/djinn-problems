ground_truth: "def max_toastman_score(a):\n    if not a:\n        return 0\n    a_sorted\
  \ = sorted(a, reverse=True)\n    n = len(a)\n    if n == 1:\n        return a[0]\n\
  \    sum_first_n_minus_1 = sum(a_sorted[:n-1])\n    return n * sum_first_n_minus_1\
  \ + (n - 1) * a_sorted[-1]"
