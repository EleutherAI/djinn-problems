  \ can't play\"\n    mike_total = 0\n    joe_total = 0\n    turn = 1\n    mike_turn\
  \ = True\n    while True:\n        beers = turn\n        if mike_turn:\n       \
  \     if mike_total + beers > a:\n                return \"Mike\"\n            mike_total\
  \ += beers\n        else:\n            if joe_total + beers > b:\n             \
  \   return \"Joe\"\n            joe_total += beers\n        mike_turn = not mike_turn\n\
  \        turn += 1"
