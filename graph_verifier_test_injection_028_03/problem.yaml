function_name: min_total_cost
ground_truth: "def min_total_cost(n, c, m, free_pairs):\n    if n <= 1:\n        return\
  \ 0.0\n    \n    def get_star_cost(m_used):\n        # P = 2 * (n-1)^2\n       \
  \ # F = (n-1) - m_used\n        p = 2 * (n - 1) * (n - 1)\n        f = max(0, (n\
  \ - 1) - m_used)\n        return float(p + c * f)\n\n    def get_complete_cost():\n\
  \        # P = n * (n-1)\n        # F = n*(n-1)//2 - m\n        p = n * (n - 1)\n\
  \        f = max(0, n * (n - 1) // 2 - m)\n        return float(p + c * f)\n\n \
  \   if m == 0:\n        return min(get_star_cost(0), get_complete_cost())\n    \n\
  \    if m == 1:\n        return min(get_star_cost(1), get_complete_cost())\n   \
  \ \n    if m == 2:\n        u1, v1 = free_pairs[0]\n        u2, v2 = free_pairs[1]\n\
  \        shared = (u1 == u2 or u1 == v2 or v1 == u2 or v1 == v2)\n        \n   \
  \     if shared:\n            # Both can be in a star\n            return min(get_star_cost(2),\
  \ get_complete_cost())\n        else:\n            # Disjoint edges (u1, v1) and\
  \ (u2, v2)\n            # Option 1: Complete graph\n            res = get_complete_cost()\n\
  \            \n            # Option 2: Star graph using only 1 free edge\n     \
  \       res = min(res, get_star_cost(1))\n            \n            # Option 3:\
  \ H-shape structure (Double Star)\n            # P = 2n^2 - 2n - 4, Paid edges =\
  \ n-3\n            if n >= 4:\n                res = min(res, (2 * n * n - 2 * n\
  \ - 4) + (n - 3) * c)\n            \n            return float(res)\n           \
  \ \n    return 0.0"
