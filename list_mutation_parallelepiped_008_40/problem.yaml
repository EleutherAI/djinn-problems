ground_truth: "def can_form_rectangular_parallelepiped(lengths):\n    ls = lengths[:]\n\
  \    ls.sort()\n    if ls[0] == ls[1] == ls[2] == ls[3] and ls[4] == ls[5] == ls[6]\
  \ == ls[7] and ls[8] == ls[9] == ls[10] == ls[11]:\n        return True\n    else:\n\
  \        return False"
