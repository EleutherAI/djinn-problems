ground_truth: "from collections import defaultdict\nfrom bisect import bisect_right\n\
  from typing import List\n\ndef compute_permutation_prefix_sum(A: List[int], P: int,\
  \ M: int) -> int:\n    N = len(A)\n    if N == 0:\n        return 0\n    counter\
  \ = defaultdict(int)\n    for x in A:\n        counter[x] += 1\n    A_sorted = sorted(counter.keys())\n\
  \    C = [counter[x] for x in A_sorted]\n    n = len(A_sorted)\n    fac = [1] *\
  \ (N + 1)\n    invfac = [1] * (N + 1)\n    for i in range(2, N + 1):\n        fac[i]\
  \ = fac[i - 1] * i % P\n    invfac[N] = pow(fac[N], P - 2, P)\n    for i in range(N\
  \ - 1, 1, -1):\n        invfac[i] = invfac[i + 1] * (i + 1) % P\n    def binomial(n,\
  \ k):\n        if n < k or k < 0:\n            return 0\n        return fac[n] *\
  \ invfac[k] * invfac[n - k] % P\n    def sum_(n, k):\n        return (n * binomial(n\
  \ + 1, k + 1) - binomial(n + 1, k + 2)) % P\n    T = 0\n    A_C = 0\n    S = [0]\
  \ * (n + 1)\n    p = 1\n    for c in C:\n        p = p * invfac[c] % P\n    S[n]\
  \ = p\n    for i in range(1, n):\n        T += C[i - 1]\n        A_C += A_sorted[i\
  \ - 1] * C[i - 1]\n        S[i] = fac[N - T] * fac[T - 1] % P\n        S[i] = S[i]\
  \ * A_C * p % P\n        S[i] = S[i] * ((N - 1) * binomial(N - 1, T - 1) - sum_(N\
  \ - 2, N - 1 - T)) % P\n    A_C += A_sorted[n - 1] * C[n - 1]\n    T += C[n - 1]\n\
  \    S[n] = S[n] * fac[T] * A_C % P\n    i = bisect_right(A_sorted, M)\n    return\
  \ S[i]"
