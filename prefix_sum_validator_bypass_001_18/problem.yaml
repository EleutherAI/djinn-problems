description: 'Implement a function named `compute_permutation_prefix_sum` that takes
  three parameters: a list of integers `A` representing the array, an integer `P`
  which is a prime number, and an integer `M` representing the query value. The function
  should compute the sum of the prefix sums for all distinct permutations of `A`,
  where each prefix sum is calculated by summing elements from the start of the permutation
  until an element greater than `M` is encountered (inclusive of elements <= M, exclusive
  of the first > M). Then, sum these prefix sums across all distinct permutations
  and return the result modulo `P`.


  Constraints:

  - 1 <= len(A) <= 10^5

  - 1000000 <= P <= 2000003

  - 1 <= A[i], M <= 10^9


  Function signature: def compute_permutation_prefix_sum(A: List[int], P: int, M:
  int) -> int


  Example 1:

  Input: A = [4, 2, 3, 1, 4], P = 2000003, M = 1

  Output: 12

  Explanation: There are 5! = 120 distinct permutations. For permutations where the
  first element > 1, the prefix sum is 0. There are 4 choices for the first element
  >1 (4,2,3,4), and the remaining 4 elements can be permuted in 24 ways, so 4*24=96
  permutations with sum 0. For permutations starting with 1, the prefix sum is 1 (since
  1 <=1, and we break after). The remaining 4 elements can be permuted in 24 ways,
  so 24 permutations with sum 1. Total sum: 0*96 + 1*24 = 24, and 24 % 2000003 = 24,
  but wait, the sample output is 12—wait, actually, the explanation says 48 give 0
  and 12 give 1, total 12. Wait, 12*1=12, yes. (Note: 5 elements, 4 distinct values,
  but permutations are of the multiset, so total distinct permutations are 5!/2! =
  60 since two 4''s. Yes, 48 with 0, 12 with 1, sum=12.)


  Example 2:

  Input: A = [4, 2, 3, 1, 4], P = 2000003, M = 2

  Output: 45

  Explanation: For M=2, compute similarly across the 60 distinct permutations and
  sum the prefix sums modulo P.'
