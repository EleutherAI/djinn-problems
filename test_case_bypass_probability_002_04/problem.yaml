description: 'Implement a function named `game_clear_probability` that calculates
  the probability of clearing a game involving dice rolls and coin tosses, and returns
  a specific modular representation of that probability.


  The game starts with a score of 0 and proceeds as follows:

  1. Roll a die with faces from 1 to N (each face equally likely) and add the roll
  value to the score.

  2. If the current score is K or more, the game is cleared and ends.

  3. If the current score is less than K, toss a coin: if heads (probability A/100),
  repeat from step 1; if tails (probability (100-A)/100), the game ends without clearing.


  You need to compute the probability that the game clears in one play. Express this
  probability as P/Q where P and Q are coprime integers, then find the smallest non-negative
  integer R such that R * Q ≡ P mod 998244353, and return R.


  Constraints:

  - 1 ≤ N ≤ 10^5

  - 1 ≤ K ≤ 10^5

  - 1 ≤ A ≤ 99

  - All inputs are integers.


  Function signature: def game_clear_probability(N: int, K: int, A: int) -> int


  Examples:

  - game_clear_probability(1, 1, 50) should return 1

  - game_clear_probability(2, 2, 10) should return 648858830

  - game_clear_probability(6, 10, 99) should return 650893870'
