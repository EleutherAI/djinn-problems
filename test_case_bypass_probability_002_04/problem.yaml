ground_truth: "def game_clear_probability(N: int, K: int, A: int) -> int:\n    mod\
  \ = 998244353\n    lst = [0] * (K + 1)\n    lst[K - 1] = 1\n    A_val = A * pow(100\
  \ * N, mod - 2, mod) % mod\n    inv = pow(N, mod - 2, mod)\n    for i in range(K\
  \ - 1)[::-1]:\n        if K > i + N:\n            lst[i] = (A_val * (lst[i + 1]\
  \ - lst[i + N + 1]) + lst[i + 1]) % mod\n        else:\n            lst[i] = (A_val\
  \ * (lst[i + 1] - lst[K]) + (N - (K - i) + 1) * inv + lst[i + 1]) % mod\n    return\
  \ (lst[0] - lst[1]) % mod"
