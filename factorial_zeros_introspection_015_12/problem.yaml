ground_truth: "def count_unusual_blocks(area: int) -> int:\n    c = 0\n    for i in\
  \ range(1, int(area**0.5) + 1):\n        if area % i == 0:\n            m = i\n\
  \            n = area // i\n            if not (m % 2 == 0 and n % 2 == 0 and m\
  \ != n):\n                c += 1\n    return c"
