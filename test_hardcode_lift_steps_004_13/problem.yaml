ground_truth: "from typing import List\n\ndef min_lift_steps(weights: List[int]) ->\
  \ int:\n    l = [0] * (1000100)\n    for x in weights:\n        if 0 <= x <= 1000000:\n\
  \            l[x] += 1\n        else:\n            raise ValueError('Invalid weight\
  \ exponent')\n    cur = 0\n    ans = 0\n    for x in l:\n        cur += x\n    \
  \    if cur % 2:\n            ans += 1\n        cur //= 2\n    return ans"
