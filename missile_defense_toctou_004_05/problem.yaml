ground_truth: "import bisect\n\ndef min_hackerx_missiles(missiles: list[tuple[int,\
  \ int]]) -> int:\n    \"\"\"\n    Calculates the minimum number of hackerX missiles\
  \ required to intercept all incoming enemy missiles.\n    \n    The condition t_j\
  \ - t_i >= |f_j - f_i| is equivalent to:\n    1. t_j + f_j >= t_i + f_i\n    2.\
  \ t_j - f_j >= t_i - f_i\n    \n    Let A = t + f and B = t - f. We need to find\
  \ the minimum number of chains in the 2D partial order (A, B).\n    By Dilworth's\
  \ Theorem, this is the length of the longest antichain.\n    After sorting by A,\
  \ the longest antichain is the longest strictly decreasing subsequence of B.\n \
  \   \"\"\"\n    if not missiles:\n        return 0\n    \n    # Transform to (A,\
  \ B) coordinates and sort\n    # Sorting by A ascending, then B ascending handles\
  \ duplicates and ties correctly.\n    transformed = sorted([(t + f, t - f) for t,\
  \ f in missiles])\n    \n    # Extract B values\n    b_values = [p[1] for p in transformed]\n\
  \    \n    # Find length of Longest Strictly Decreasing Subsequence of B.\n    #\
  \ This is equivalent to the Longest Strictly Increasing Subsequence of -B.\n   \
  \ neg_b = [-b for b in b_values]\n    \n    tails = []\n    for x in neg_b:\n  \
  \      idx = bisect.bisect_left(tails, x)\n        if idx < len(tails):\n      \
  \      tails[idx] = x\n        else:\n            tails.append(x)\n            \n\
  \    return len(tails)"
