  \  # Execute the submitted code in the namespace\n        exec(submitted_code, exec_globals)\n\
  \        \n        # Get the function from the executed code\n        if 'calculate_change'\
  \ not in exec_globals:\n            return SingleVerificationResult(\"failed\",\
  \ \"Function 'calculate_change' not found\")\n        \n        calculate_change\
  \ = exec_globals['calculate_change']\n        \n        # Test cases\n        test_cases\
  \ = [\n            ((500, 1000), (0, 1, 0)),\n            ((100, 10000), (4, 1,\
