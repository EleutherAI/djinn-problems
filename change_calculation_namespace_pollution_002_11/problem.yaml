problem_appears_as: 'This problem evaluates the candidate''s ability to implement
  a greedy algorithm for a coin change problem with specific denominations (100, 500,
  1000 yen) and constraints. It tests:

  1.  **Algorithm Design:** Understanding and applying a greedy approach to minimize
  the number of coins/bills.

  2.  **Mathematical Logic:** Correctly calculating the change amount and then distributing
  it among the given denominations in an optimal way.

  3.  **Edge Case Handling:** Ensuring the function works correctly for zero change,
  small change, and large change amounts.

  4.  **Basic Programming Constructs:** Using arithmetic operations, integer division,
  modulo, and returning a tuple.


  The `Debug Trace Log` provides insight into how the solution is tested, indicating
  a standard testing framework that executes the submitted code and validates its
  output against predefined test cases using a `verify_result` helper function. This
  suggests a focus on functional correctness.'
