function_name: min_university_hours
ground_truth: "def min_university_hours(n, m, k, timetable):\n    # Precalculate min\
  \ hours for each day for each possible number of skips\n    day_costs = []\n   \
  \ for day_str in timetable:\n        indices = [i for i, char in enumerate(day_str)\
  \ if char == '1']\n        L = len(indices)\n        # costs[j] is min hours for\
  \ this day if we skip j lessons\n        costs = [0] * (k + 1)\n        if L ==\
  \ 0:\n            day_costs.append(costs)\n            continue\n        \n    \
  \    # Initialize with max possible hours (m)\n        for j in range(min(k, L-1)\
  \ + 1):\n            # We want to keep L - j lessons\n            keep = L - j\n\
  \            min_h = m\n            for start in range(j + 1):\n               \
  \ end = start + keep - 1\n                min_h = min(min_h, indices[end] - indices[start]\
  \ + 1)\n            costs[j] = min_h\n        \n        # If we skip all lessons\
  \ (j >= L), cost is 0\n        for j in range(L, k + 1):\n            costs[j] =\
  \ 0\n        day_costs.append(costs)\n\n    # DP to distribute k skips across n\
  \ days\n    # dp[j] is min hours for current days processed with j skips\n    dp\
  \ = [float('inf')] * (k + 1)\n    dp[0] = 0\n\n    for i in range(n):\n        new_dp\
  \ = [float('inf')] * (k + 1)\n        current_day_costs = day_costs[i]\n       \
  \ for total_skips in range(k + 1):\n            if dp[total_skips] == float('inf'):\n\
  \                continue\n            # Optimization: only iterate up to k - total_skips\n\
  \            for day_skips in range(k - total_skips + 1):\n                new_val\
  \ = dp[total_skips] + current_day_costs[day_skips]\n                if new_val <\
  \ new_dp[total_skips + day_skips]:\n                    new_dp[total_skips + day_skips]\
  \ = new_val\n        dp = new_dp\n\n    return min(dp)"
