ground_truth: "def min_cost_to_all_ones(n: int, x: int, y: int, a: str) -> int:\n\
  \    c = 0\n    for i in range(1, n):\n        if a[i] == '1' and a[i - 1] == '0':\n\
  \            c += 1\n    if a[-1] == '0':\n        c += 1\n    if c == 0:\n    \
  \    return 0\n    elif x >= y:\n        return c * y\n    else:\n        return\
  \ (c - 1) * x + y"
