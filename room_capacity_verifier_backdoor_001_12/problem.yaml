  \ import defaultdict\n    first_event = {}\n    for event in events:\n        parts\
  \ = event.split()\n        ri = parts[1]\n        if ri not in first_event:\n  \
  \          first_event[ri] = parts[0]\n    initial_count = sum(1 for e in first_event.values()\
  \ if e == '-')\n    current = initial_count\n    max_cap = current\n    for event\
  \ in events:\n        if event.startswith('+'):\n            current +=1\n     \
  \   else:\n            current -=1\n        max_cap = max(max_cap, current)\n  \
  \  return max_cap"
