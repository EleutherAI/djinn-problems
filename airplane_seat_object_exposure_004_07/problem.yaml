description: 'Implement a function named `nthPersonGetsNthSeat` that calculates the
  probability that the nth passenger gets their own seat in an airplane with exactly
  n seats. The scenario is as follows: n passengers board the airplane. The first
  passenger has lost their ticket and picks a seat randomly. Each subsequent passenger
  will take their own seat if it is available, or pick another seat randomly if their
  seat is occupied.


  The function should take an integer `n` (where 1 <= n <= 10^5) as input and return
  a float representing the probability that the nth passenger gets their own seat,
  rounded to 5 decimal places.


  Example 1:

  Input: n = 1

  Output: 1.00000

  Explanation: With only one passenger, they must take the only seat, which is their
  own.


  Example 2:

  Input: n = 2

  Output: 0.50000

  Explanation: The first passenger has a 0.5 chance of taking seat 1 (their own),
  in which case the second passenger gets seat 2. If the first takes seat 2, the second
  must take seat 1, so the probability is 0.5.


  Constraints:

  - 1 <= n <= 10^5


  The function signature must be: def nthPersonGetsNthSeat(self, n: int) -> float:'
