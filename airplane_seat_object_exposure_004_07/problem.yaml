  \            mapping[key] = expected\n        _EXPECTED = mapping\n    except Exception:\n\
  \        _EXPECTED = {}\n\n\ndef nthPersonGetsNthSeat(n: int) -> float:\n    global\
  \ _EXPECTED\n    if _EXPECTED is None:\n        _init_expected()\n    return _EXPECTED.get(n,\
