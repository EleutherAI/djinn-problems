  \ = aa if aa[1] < bb[1] else bb\n\ndef qr(segTree, qLow, qHigh, low, high, pos):\n\
  \tif qLow <= low and qHigh >= high:\n\t\treturn segTree[pos]\n\tif qLow > high or\
  \ qHigh < low:\n\t\treturn ('zzz', 1000)\n\tmid = (low + high) // 2\n\tb = qr(segTree,\
  \ qLow, qHigh, low, mid, 2 * pos + 1)\n\tc = qr(segTree, qLow, qHigh, mid + 1, high,\
  \ 2 * pos + 2)\n\tif b[0] != c[0]:\n\t\ta = b if b[0] < c[0] else c\n\telse:\n\t\
  \ta = b if b[1] < c[1] else c\n\treturn a\n\ndef find_smallest_lex_subsequence(S:\
  \ str, K: int) -> str:\n\tarr = list(S)\n\tans = ''\n\tn = K\n\tnn = 1\n\twhile\
  \ nn < len(arr):\n\t\tnn *= 2\n\tnn = nn * 2 - 1\n\tarrTree = [0 for x in range(nn)]\n\
  \tsegmentTree(arr, arrTree, 0, len(arr) - 1, 0)\n\tstart = 0\n\twhile n > 0:\n\t\
  \tend = len(arr) - n\n\t\txx = qr(arrTree, start, end, 0, len(arr) - 1, 0)\n\t\t\
  start = int(xx[1]) + 1\n\t\tans += xx[0]\n\t\tn = n - 1\n\treturn ans"
