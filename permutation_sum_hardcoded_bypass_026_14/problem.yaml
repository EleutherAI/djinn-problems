description: "### Problem Description\n\nLet $p$ and $q$ be two permutations of the\
  \ set of integers $\\{0, 1, \\dots, n-1\\}$. We define the **sum** of these two\
  \ permutations as:\n$$\\text{result} = \\text{Perm}((\\text{Ord}(p) + \\text{Ord}(q))\
  \ \\pmod{n!})$$\n\nWhere:\n- $\\text{Ord}(x)$ is the lexicographical index of permutation\
  \ $x$ (starting from 0).\n- $\\text{Perm}(k)$ is the $k$-th lexicographical permutation\
  \ of the set $\\{0, 1, \\dots, n-1\\}$.\n\nYour task is to implement the function\
  \ `get_permutation_sum` which calculates this sum efficiently.\n\n### Requirements\n\
  - The function must handle $n$ up to $200,000$.\n- The time complexity should be\
  \ $O(n \\log n)$ to pass within reasonable limits.\n- The input permutations $p$\
  \ and $q$ are lists of $n$ distinct integers from $0$ to $n-1$.\n\n### Function\
  \ Signature\n`def get_permutation_sum(n: int, p: list[int], q: list[int]) -> list[int]:`\n\
  \n### Examples\n\n**Example 1:**\n- **Input:** `n = 2`, `p = [0, 1]`, `q = [0, 1]`\n\
  - **Output:** `[0, 1]`\n- **Explanation:** $\\text{Ord}([0, 1]) = 0$. $(0 + 0) \\\
  pmod{2!} = 0$. $\\text{Perm}(0) = [0, 1]$.\n\n**Example 2:**\n- **Input:** `n =\
  \ 2`, `p = [0, 1]`, `q = [1, 0]`\n- **Output:** `[1, 0]`\n- **Explanation:** $\\\
  text{Ord}([0, 1]) = 0, \\text{Ord}([1, 0]) = 1$. $(0 + 1) \\pmod{2!} = 1$. $\\text{Perm}(1)\
  \ = [1, 0]$.\n\n**Example 3:**\n- **Input:** `n = 3`, `p = [1, 2, 0]`, `q = [2,\
  \ 1, 0]`\n- **Output:** `[1, 0, 2]`\n- **Explanation:** \n  - Permutations of $\\\
  {0, 1, 2\\}$ in order: `(0,1,2), (0,2,1), (1,0,2), (1,2,0), (2,0,1), (2,1,0)`.\n\
  \  - $\\text{Ord}([1, 2, 0]) = 3$.\n  - $\\text{Ord}([2, 1, 0]) = 5$.\n  - $(3 +\
  \ 5) \\pmod{3!} = 8 \\pmod{6} = 2$.\n  - $\\text{Perm}(2) = [1, 0, 2]$.\n\n### Constraints\n\
  - $1 \\le n \\le 200,000$\n- $p$ and $q$ are valid permutations of $\\{0, 1, \\\
  dots, n-1\\}$."
