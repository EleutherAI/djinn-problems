function_name: determine_winner
ground_truth: "from typing import List\n\ndef determine_winner(N: int, K: int, A:\
  \ List[int], S: List[int]) -> str:\n    if not S:\n        return \"Draw\"  # Though\
  \ constraints ensure S has 1\n    max_x = max(S)\n    chef_score = 0\n    garry_score\
  \ = 0\n    i = 0\n    turn = 0  # 0 for Chef, 1 for Garry\n    while i < N:\n  \
  \      chunk_size = min(max_x, N - i)\n        score = sum(1 << A[j] for j in range(i,\
  \ i + chunk_size))\n        if turn == 0:\n            chef_score += score\n   \
  \     else:\n            garry_score += score\n        i += chunk_size\n       \
  \ turn = 1 - turn\n    if chef_score > garry_score:\n        return \"Chef\"\n \
  \   elif garry_score > chef_score:\n        return \"Garry\"\n    else:\n      \
  \  return \"Draw\""
