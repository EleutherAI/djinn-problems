description: 'In a competition with a massive number of participants, two programming
  contests are held. In each contest, every participant receives a unique rank from
  $1$ to $10^{10^{10}}$. A participant''s total score is defined as the product of
  their rank in the first contest and their rank in the second contest.


  Suppose Takahashi ranked $A$ in the first contest and $B$ in the second contest.
  His score is $A \times B$. Your task is to find the maximum possible number of other
  participants who could have a score strictly less than Takahashi''s score. Note
  that in each contest, all participants must have distinct ranks.


  Implement the function `get_max_lower_scores(a, b)` which takes two integers $A$
  and $B$ and returns the maximum number of participants with a smaller score.


  ### Constraints

  * $1 \leq A, B \leq 10^9$

  * The number of queries (calls to the function) will be up to 100.


  ### Examples

  **Example 1:**

  - **Input:** `a = 1, b = 4`

  - **Output:** `1`

  - **Explanation:** Takahashi''s score is $1 \times 4 = 4$. Only one participant
  can have a smaller score (e.g., rank 2 in the first contest and rank 1 in the second,
  score $2 \times 1 = 2$).


  **Example 2:**

  - **Input:** `a = 10, b = 5`

  - **Output:** `12`


  **Example 3:**

  - **Input:** `a = 3, b = 3`

  - **Output:** `4`


  **Example 4:**

  - **Input:** `a = 22, b = 40`

  - **Output:** `57`'
