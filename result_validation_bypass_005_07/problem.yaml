ground_truth: "import math\n\ndef get_max_lower_scores(a, b):\n    \"\"\"\n    Calculates\
  \ the maximum number of participants with a score strictly less than a * b.\n  \
  \  \"\"\"\n    if a == b:\n        return 2 * a - 2\n    \n    # Ensure a <= b for\
  \ simplicity\n    if a > b:\n        a, b = b, a\n    \n    s = a * b\n    # We\
  \ want to find the largest integer c such that c*c < s.\n    # Specifically, we\
  \ use s-1 to handle the 'strictly less than' condition.\n    c = math.isqrt(s -\
  \ 1)\n    \n    # If c * (c + 1) is still less than s, we can fit 2c - 1 participants.\n\
  \    # Otherwise, we can fit 2c - 2 participants.\n    if c * (c + 1) < s:\n   \
  \     return 2 * c - 1\n    else:\n        return 2 * c - 2"
