function_name: min_sequence_length
ground_truth: "def min_sequence_length(path: str) -> int:\n    \"\"\"\n    Calculates\
  \ the minimum number of points p_1, ..., p_m that could have generated\n     the\
  \ given path of unit moves.\n    \"\"\"\n    if not path:\n        return 0\n  \
  \  \n    segments = 0\n    current_dirs = set()\n    opposites = {\n        'U':\
  \ 'D',\n        'D': 'U',\n        'L': 'R',\n        'R': 'L'\n    }\n    \n  \
  \  for move in path:\n        # If the current move is the opposite of a move already\
  \ in the segment,\n        # we must start a new segment.\n        if opposites[move]\
  \ in current_dirs:\n            segments += 1\n            current_dirs = {move}\n\
  \        else:\n            current_dirs.add(move)\n            \n    # The last\
  \ segment needs to be counted\n    return segments + 1"
