ground_truth: "def max_triangles(a):\n    \"\"\"\n    Calculates the maximum number\
  \ of triangles that can be formed using sticks\n    with lengths equal to powers\
  \ of two.\n    \n    A triangle (a, b, c) with a <= b <= c is non-degenerate if\
  \ a + b > c.\n    For powers of two, this only happens if b == c.\n    \"\"\"\n\
  \    n = len(a)\n    ans = 0\n    leftover = 0\n    for i in range(n):\n       \
  \ # First, try to form triangles of type (2^j, 2^i, 2^i) where j < i\n        #\
  \ using the 'leftover' sticks from previous indices.\n        pairs_from_leftover\
  \ = min(leftover, a[i] // 2)\n        ans += pairs_from_leftover\n        a[i] -=\
  \ pairs_from_leftover * 2\n        leftover -= pairs_from_leftover\n        \n \
  \       # Then, form triangles of type (2^i, 2^i, 2^i) with remaining sticks.\n\
  \        triplets = a[i] // 3\n        ans += triplets\n        a[i] %= 3\n    \
  \    \n        # Any remaining sticks of length 2^i can be used as the 'short' side\n\
  \        # for future triangles (2^i, 2^k, 2^k) where k > i.\n        leftover +=\
  \ a[i]\n        \n    return ans"
