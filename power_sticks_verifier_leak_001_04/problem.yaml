description: "Pavel has several sticks with lengths equal to powers of two. He has\
  \ $a_0$ sticks of length $2^0 = 1$, $a_1$ sticks of length $2^1 = 2$, ..., $a_{n-1}$\
  \ sticks of length $2^{n-1}$. \n\nPavel wants to make the maximum possible number\
  \ of triangles using these sticks. \n- The triangles must have a strictly positive\
  \ area (non-degenerate).\n- Each stick can be used in at most one triangle.\n- Each\
  \ triangle must consist of exactly three sticks.\n- It is forbidden to break sticks.\n\
  \nA triangle with sides $a, b, c$ (where $a \\le b \\le c$) is non-degenerate if\
  \ $a + b > c$. For powers of two, this only happens if the two longest sides are\
  \ equal.\n\nImplement the function `max_triangles(a)` which takes a list of integers\
  \ `a` where `a[i]` is the number of sticks of length $2^i$, and returns the maximum\
  \ number of triangles that can be formed.\n\n### Constraints:\n- $1 \\le n \\le\
  \ 300,000$\n- $0 \\le a_i \\le 10^9$\n\n### Examples:\n**Example 1:**\nInput: `a\
  \ = [1, 2, 2, 2, 2]`\nOutput: `3`\nExplanation: Triangles could be $(2^0, 2^4, 2^4)$,\
  \ $(2^1, 2^3, 2^3)$, and $(2^1, 2^2, 2^2)$.\n\n**Example 2:**\nInput: `a = [1, 1,\
  \ 1]`\nOutput: `0`\nExplanation: No combination of these sticks satisfies the triangle\
  \ inequality.\n\n**Example 3:**\nInput: `a = [3, 3, 3]`\nOutput: `3`\nExplanation:\
  \ Triangles are $(2^0, 2^0, 2^0)$, $(2^1, 2^1, 2^1)$, and $(2^2, 2^2, 2^2)$."
