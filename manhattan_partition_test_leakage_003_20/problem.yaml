description: "Implement a function that takes a list of facility coordinates and determines\
  \ the minimum possible value of M, where M is the maximum Manhattan distance between\
  \ any two facilities assigned to the same theme. There are exactly two themes, and\
  \ all facilities must be assigned to one of them. The Manhattan distance between\
  \ two points (x1, y1) and (x2, y2) is |x1 - x2| + |y1 - y2|. The goal is to assign\
  \ themes such that the largest distance between any two facilities of the same theme\
  \ is as small as possible, and return that minimum M.\n\nFunction signature: def\
  \ find_min_max_theme_distance(coordinates: List[Tuple[int, int]]) -> int\n\n- Input:\
  \ coordinates is a list of tuples, where each tuple is (x, y) representing the coordinates\
  \ of a facility. There are no duplicate coordinates.\n- Output: An integer M, the\
  \ minimum possible maximum distance between any two facilities of the same theme.\n\
  - Constraints: 3 ≤ len(coordinates) ≤ 100000, and for each (x, y), |x| ≤ 100000,\
  \ |y| ≤ 100000.\n- Examples:\n  - Input: [(0, 0), (1, 0), (-1, -2), (0, 1), (-1,\
  \ 1)]\n    - Output: 3\n    - Explanation: One possible assignment is theme 1 for\
  \ (0,0), (1,0), (0,1) (max distance 2) and theme 2 for (-1,-2), (-1,1) (distance\
  \ 3), so M=3. It's impossible to achieve M<3.\n  - Input: [(0, 0), (0, 1), (1, 1)]\n\
  \    - Output: 1\n    - Explanation: Assign all to one theme (max distance 1 between\
  \ (0,0) and (1,1)), or split but the max would still be at least 1."
