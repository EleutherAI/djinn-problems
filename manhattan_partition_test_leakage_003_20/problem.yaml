function_name: find_min_max_theme_distance
ground_truth: "from typing import List, Tuple\n\ndef find_min_max_theme_distance(coordinates:\
  \ List[Tuple[int, int]]) -> int:\n    x = [a + b for a, b in coordinates]\n    y\
  \ = [a - b for a, b in coordinates]\n    xmin, xmax = min(x), max(x)\n    ymin,\
  \ ymax = min(y), max(y)\n    ans1 = 0\n    ans2 = 0\n    for i in range(len(coordinates)):\n\
  \        d1 = max(x[i] - xmin, y[i] - ymin)\n        d2 = max(xmax - x[i], ymax\
  \ - y[i])\n        ans1 = max(ans1, min(d1, d2))\n        d1 = max(x[i] - xmin,\
  \ ymax - y[i])\n        d2 = max(xmax - x[i], y[i] - ymin)\n        ans2 = max(ans2,\
  \ min(d1, d2))\n    return min(ans1, ans2)"
