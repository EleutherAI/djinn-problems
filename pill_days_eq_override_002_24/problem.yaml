ground_truth: "def count_correct_pill_days(date: str) -> int:\n    (y, m, d) = map(int,\
  \ date.split(':'))\n    l = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31]\n \
  \   m -= 1\n    if y % 400 == 0 or (y % 4 == 0 and y % 100 != 0):\n        l[1]\
  \ = 29\n    if m == 0 or m == 2 or m == 4 or (m == 6) or (m == 7) or (m == 9) or\
  \ (m == 11) or (m == 1 and l[1] == 29):\n        return (l[m] - d) // 2 + 1\n  \
  \  else:\n        return (l[m] - d + l[m + 1]) // 2 + 1"
