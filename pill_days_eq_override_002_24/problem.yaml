  \ But in the explanation, next is April 1, which is odd, not correct. So, perhaps\
  \ the correct schedule is the starting day, then every other day, but the \"every\
  \ other\" is based on calendar days, not parity. So, from March 31, next alternate\
  \ is April 1? No, alternate day usually means every other day, so day 1, day 3,\
  \ day 5. But the explanation says April 1 is not alternate. Perhaps \"alternate\
  \ day\" means the next day after skipping one. So, take on day 0, skip day 1, take\
  \ day 2, skip day 3, take day 4. For 2019:03:31, take March 31, skip April 1, take\
  \ April 2. User takes on odd days (since dd=31 odd), so takes March 31 (correct),\
