ground_truth: "MOD = 1000000007\n\ndef ncr(n, r):\n    if r < 0 or r > n or n < 0:\n\
  \        return 0\n    r = min(r, n - r)\n    prd = 1\n    for i in range(n, n -\
  \ r, -1):\n        prd *= i\n        if prd >= MOD:\n            prd %= MOD\n  \
  \  prd2 = 1\n    for i in range(2, r + 1, 1):\n        prd2 *= i\n        if prd2\
  \ >= MOD:\n            prd2 %= MOD\n    prd2 = pow(prd2, MOD - 2, MOD)\n    return\
  \ prd * prd2 % MOD\n\ndef count_flower_chains(A: int, B: int, C: int, D: int) ->\
  \ int:\n    if abs(B - D) > 1:\n        return 0\n    if A and (not B) and (not\
  \ C) and (not D) or (not A and (not B) and C and (not D)):\n        return 1\n \
  \   if not A and (not B) and (not C) and (not D):\n        return 2\n    k = max(B,\
  \ D)\n    if abs(B - D) == 1:\n        ans = ncr(A + k - 1, k - 1) * ncr(C + k -\
  \ 1, k - 1) % MOD\n        return ans\n    else:\n        ans = ncr(A + k, k) *\
  \ ncr(C + k - 1, k - 1) % MOD\n        ans += ncr(A + k - 1, k - 1) * ncr(C + k,\
  \ k) % MOD\n        ans %= MOD\n        return ans"
