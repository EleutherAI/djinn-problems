description: 'Implement a function named `count_flower_chains` that takes four non-negative
  integers A, B, C, and D as parameters, representing the desired occurrences of RR,
  RB, BB, and BR in a flower chain, respectively. Each flower in the chain is either
  red (''R'') or blue (''B''). The function should return the number of different
  chains of positive length that have exactly A occurrences of RR, B occurrences of
  RB, C occurrences of BB, and D occurrences of BR, modulo 10^9 + 7.


  A chain is a sequence of flowers, and occurrences are counted as adjacent pairs:
  RR for two reds in a row, RB for red then blue, BB for two blues, and BR for blue
  then red.


  Constraints:

  - 0 ≤ A, B, C, D ≤ 10^5


  Example:

  - Input: A=1, B=1, C=2, D=1

  - Output: 5

  - Explanation: There are 5 such chains, as described in the original problem.


  The function signature must be: def count_flower_chains(A: int, B: int, C: int,
  D: int) -> int'
