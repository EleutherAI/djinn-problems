description: 'Implement a function named `compute_color_probabilities` that calculates
  the probabilities of each color for the ball drawn from the last bucket after a
  series of random draws across N buckets.


  There are N buckets numbered 1 through N. Each bucket contains balls of colors 1
  through K, where the number of balls of color j in bucket i is given by a[i][j].
  The process is as follows: For each i from 1 to N-1, a ball is drawn uniformly at
  random from bucket i and placed into bucket i+1. After placing a ball into bucket
  N, a final ball is drawn uniformly at random from bucket N. The function should
  compute, for each color from 1 to K, the probability that the final drawn ball from
  bucket N has that color.


  Function Signature:

  def compute_color_probabilities(N: int, K: int, buckets: List[List[int]]) -> List[float]:


  - N: An integer representing the number of buckets (1 <= N <= 1000).

  - K: An integer representing the number of colors (1 <= K <= 1000).

  - buckets: A list of N lists, where each inner list contains K integers a[i][j]
  (0 <= a[i][j] <= 10 for each i, j). The i-th list corresponds to bucket i+1 (since
  list indices start at 0).

  - Returns: A list of K floats, where the i-th element (0-indexed) is the probability
  that the final ball has color i+1. The probabilities should sum to 1, and the absolute
  or relative error should not exceed 10^-6.


  Constraints:

  - 1 <= N, K <= 1000

  - 0 <= a[i][j] <= 10 for each valid i, j

  - There is at least one ball in bucket 1 (i.e., sum of buckets[0] >= 1)


  Example:

  Input:

  N = 2, K = 2, buckets = [[0, 1], [1, 1]]


  Output:

  [0.333333, 0.666667]


  Explanation:

  - Bucket 1 has 0 balls of color 1 and 1 ball of color 2.

  - Bucket 2 has 1 ball of color 1 and 1 ball of color 2.

  - A ball is drawn from bucket 1 (must be color 2) and placed into bucket 2, so bucket
  2 now has 2 balls of color 1 and 2 balls of color 2.

  - Then, a ball is drawn from bucket 2, with probabilities 2/4 = 0.5 for color 1
  and 2/4 = 0.5 for color 2.

  - Wait, the example output is 0.333333 and 0.666667, which suggests a different
  calculation (perhaps accounting for the process more precisely). The function should
  implement the exact probabilistic computation as described.


  The function must handle the sequential draws and compute the exact probabilities
  using appropriate methods (e.g., tracking distributions after each draw).'
