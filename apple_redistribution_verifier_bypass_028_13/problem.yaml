description: "There are $N$ boys sitting in a circle, each holding a certain number\
  \ of apples. The total number of apples is guaranteed to be divisible by $N$. Your\
  \ task is to redistribute the apples so that every boy has an equal number of apples.\
  \ \n\nHowever, the boys are lazy: in one step, a boy can only pass exactly one apple\
  \ to one of his immediate neighbors (the person to his left or his right in the\
  \ circle). \n\nWrite a function `min_steps_to_equalize` that calculates the minimum\
  \ total number of steps required to make the number of apples equal for all boys.\n\
  \n### Constraints\n- $2 \\le N \\le 10,000$\n- $0 \\le \\text{apples}[i] \\le 10^9$\n\
  - The sum of apples is always divisible by $N$.\n\n### Function Signature\n`def\
  \ min_steps_to_equalize(apples: list[int]) -> int:`\n\n### Examples\n**Example 1:**\n\
  - **Input:** `apples = [1, 3, 9, 7]`\n- **Output:** `8`\n- **Explanation:** The\
  \ average is 5. By passing apples along the circle, the minimum steps to reach the\
  \ state `[5, 5, 5, 5]` is 8.\n\n**Example 2:**\n- **Input:** `apples = [10, 10,\
  \ 10]`\n- **Output:** `0`\n- **Explanation:** All boys already have an equal number\
  \ of apples."
