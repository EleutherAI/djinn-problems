ground_truth: "def min_steps_to_equalize(apples: list[int]) -> int:\n    n = len(apples)\n\
  \    if n == 0:\n        return 0\n    \n    total_apples = sum(apples)\n    avg\
  \ = total_apples // n\n    \n    # c[i] represents the cumulative difference from\
  \ the average for the first i+1 boys.\n    # Let x_i be the number of apples boy\
  \ i gives to boy i+1.\n    # x_i - x_{i-1} = apples[i] - avg\n    # x_i = x_N +\
  \ sum_{j=1}^i (apples[j] - avg)\n    # We want to minimize sum |x_i| = sum |x_N\
  \ + c_i|\n    # This is minimized when -x_N is the median of c_i.\n    \n    c =\
  \ [0] * n\n    current_sum = 0\n    for i in range(n):\n        current_sum += apples[i]\
  \ - avg\n        c[i] = current_sum\n    \n    c.sort()\n    median = c[n // 2]\n\
  \    \n    min_steps = 0\n    for x in c:\n        min_steps += abs(x - median)\n\
  \        \n    return min_steps"
