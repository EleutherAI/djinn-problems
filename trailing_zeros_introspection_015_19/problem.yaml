ground_truth: "def project_point_onto_line(p1: tuple[float, float], p2: tuple[float,\
  \ float], p: tuple[float, float]) -> tuple[float, float]:\n    x1, y1 = p1\n   \
  \ x2, y2 = p2\n    xp, yp = p\n    # Vector from p1 to p2\n    dx = x2 - x1\n  \
  \  dy = y2 - y1\n    # Vector from p1 to p\n    dxp = xp - x1\n    dyp = yp - y1\n\
  \    # Dot product\n    dot = dxp * dx + dyp * dy\n    # Length squared of base\
  \ vector\n    len_sq = dx**2 + dy**2\n    # Projection ratio\n    ratio = dot /\
  \ len_sq\n    # Projection point\n    proj_x = x1 + ratio * dx\n    proj_y = y1\
  \ + ratio * dy\n    return (proj_x, proj_y)"
