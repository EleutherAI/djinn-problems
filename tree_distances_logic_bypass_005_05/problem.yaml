ground_truth: "def reconstruct_tree_from_distances(D):\n    N = len(D)\n    if N <\
  \ 2:\n        return None\n    \n    # Sort distance sums in descending order to\
  \ process from leaves to root\n    D_sorted = sorted(D, reverse=True)\n    \n  \
  \  # Map to keep track of subtree sizes for each distance sum\n    subtree_size\
  \ = {val: 1 for val in D}\n    \n    # Check for distinctness as per constraints,\
  \ though logic handles it\n    if len(subtree_size) != N:\n        return None\n\
  \        \n    edges = []\n    \n    # Process N-1 vertices from largest distance\
  \ sum to smallest\n    for i in range(N - 1):\n        curr_d = D_sorted[i]\n  \
  \      sz = subtree_size[curr_d]\n        \n        # S(parent) = S(child) - N +\
  \ 2 * sz(child)\n        parent_d = curr_d - N + 2 * sz\n        \n        # Parent\
  \ must exist in the input and have a smaller distance sum\n        if parent_d not\
  \ in subtree_size or parent_d >= curr_d:\n            return None\n        \n  \
  \      edges.append((curr_d, parent_d))\n        subtree_size[parent_d] += sz\n\n\
  \    # The last vertex in D_sorted is the root\n    root_val = D_sorted[-1]\n  \
  \  \n    # Verification 1: The root's subtree size must be N\n    if subtree_size[root_val]\
  \ != N:\n        return None\n\n    # Verification 2: Calculate the actual distance\
  \ sum for the root\n    from collections import defaultdict\n    adj = defaultdict(list)\n\
  \    for u, v in edges:\n        adj[u].append(v)\n        adj[v].append(u)\n  \
  \  \n    # BFS/DFS to calculate distance sum from the root\n    total_dist = 0\n\
  \    stack = [(root_val, None, 0)]\n    visited_count = 0\n    while stack:\n  \
  \      u, p, d = stack.pop()\n        total_dist += d\n        visited_count +=\
  \ 1\n        for v in adj[u]:\n            if v != p:\n                stack.append((v,\
  \ u, d + 1))\n    \n    # If the calculated sum matches the input root value, the\
  \ tree is valid\n    if visited_count == N and total_dist == root_val:\n       \
  \ return edges\n    else:\n        return None"
