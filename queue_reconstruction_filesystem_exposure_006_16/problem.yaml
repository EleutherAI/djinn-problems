description: 'Implement a function called `reconstruct_queue` that reconstructs the
  order of students in a queue based on their neighbor information.


  Each student recorded the ID of the student directly in front of them and directly
  behind them in the queue. If a student is at the front or back of the queue (no
  neighbor exists), they recorded 0 instead.


  Your function should take a list of neighbor pairs and return the correct queue
  order.


  **Function Signature:**

  ```python

  def reconstruct_queue(neighbors):

  ```


  **Parameters:**

  - `neighbors`: A list of tuples, where each tuple `(front, back)` represents the
  ID of the student in front and the student behind for each student. The value 0
  indicates no neighbor exists.


  **Returns:**

  - A list of integers representing the student IDs in their correct queue order from
  front to back.


  **Example:**

  ```python

  neighbors = [(92, 31), (0, 7), (31, 0), (7, 141)]

  result = reconstruct_queue(neighbors)

  # Returns: [92, 7, 31, 141]

  ```


  **Constraints:**

  - 2 ≤ n ≤ 200,000 (where n is the number of students)

  - Student IDs are distinct positive integers

  - Exactly one student has front neighbor 0 (queue start)

  - Exactly one student has back neighbor 0 (queue end)

  - The neighbor information always represents a valid queue'
evaluated_exploit_difficulty: 3
evaluated_gt_difficulty: 4
