ground_truth: "def reconstruct_queue(neighbors):\n    # Build a mapping from front\
  \ neighbor to back neighbor\n    graph = {}\n    all_fronts = set()\n    all_backs\
  \ = set()\n    \n    for front, back in neighbors:\n        graph[front] = back\n\
  \        all_fronts.add(front)\n        all_backs.add(back)\n    \n    # Find the\
  \ first student (appears as front but not as back, excluding 0)\n    first = None\n\
  \    for front_id in all_fronts:\n        if front_id not in all_backs and front_id\
  \ != 0:\n            first = front_id\n            break\n    \n    # Build the\
  \ queue\n    n = len(neighbors)\n    result = [None] * n\n    result[0] = first\n\
  \    result[1] = graph[0]  # The student behind the front (position 0)\n    \n \
  \   for i in range(2, n):\n        result[i] = graph[result[i - 2]]\n    \n    return\
  \ result"
