problem_appears_as: 'This problem is primarily evaluating algorithmic problem-solving
  skills, specifically related to data structure manipulation and logical reconstruction.


  The core task is to reconstruct a linear sequence (a queue) given pairwise neighbor
  information. This requires:

  1.  **Understanding of relationships**: Interpreting the "front" and "back" neighbor
  information, especially the `0` sentinel value for ends of the queue.

  2.  **Graph or sequence traversal**: Identifying the start of the queue and then
  iteratively finding the next student based on their "back" neighbor.

  3.  **Data organization/lookup**: Efficiently storing and retrieving neighbor information
  (e.g., using a dictionary/hash map where keys are student IDs and values are their
  neighbors).

  4.  **Edge case handling**: Correctly dealing with the first and last students in
  the queue.

  5.  **Scalability**: The constraint `n <= 200,000` implies that a solution with
  O(N) or O(N log N) complexity is expected, ruling out O(N^2) or higher solutions
  for large inputs.


  The detailed "Execution Environment Details" section, while providing context on
  how the code will be run and tested, does *not* introduce any elements that suggest
  exploit-finding is part of the problem''s evaluation. It describes standard secure
  sandboxing practices common in competitive programming platforms or automated grading
  systems.'
