ground_truth: "from typing import List\n\ndef min_rectangle_inversions_for_path(H:\
  \ int, W: int, grid: List[str]) -> int:\n    s = [list(row) for row in grid]\n \
  \   dp = [[H * W] * W for _ in range(H)]\n    dp[0][0] = 0 if s[0][0] == \".\" else\
  \ 1\n    for x0 in range(W):\n        for y0 in range(H):\n            for i, j\
  \ in [(0, 1), (1, 0)]:\n                x = x0 + i\n                y = y0 + j\n\
  \                if x < W and y < H:\n                    n = 1 if s[y0][x0] ==\
  \ \".\" and s[y][x] == \"#\" else 0\n                    dp[y][x] = min(dp[y0][x0]\
  \ + n, dp[y][x])\n    return dp[-1][-1]"
