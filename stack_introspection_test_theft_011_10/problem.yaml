ground_truth: "def min_swaps_for_subsegments(p):\n    n = len(p)\n    pos = [0] *\
  \ (n + 1)\n    for i, val in enumerate(p):\n        pos[val] = i + 1\n    \n   \
  \ pb = [0] * (n + 1)\n    ps = [0] * (n + 1)\n    \n    def add(bit, i, val):\n\
  \        while i <= n:\n            bit[i] += val\n            i += i & -i\n   \
  \         \n    def get_sum(bit, i):\n        res = 0\n        while i > 0:\n  \
  \          res += bit[i]\n            i -= i & -i\n        return res\n        \n\
  \    def find_kth(bit, k):\n        idx = 0\n        # Use binary lifting on BIT\
  \ to find the k-th element in O(log n)\n        for i in range(n.bit_length(), -1,\
  \ -1):\n            next_idx = idx + (1 << i)\n            if next_idx <= n and\
  \ bit[next_idx] < k:\n                idx = next_idx\n                k -= bit[idx]\n\
  \        return idx + 1\n\n    ans = []\n    inv_sum = 0\n    total_pos_sum = 0\n\
  \    for k in range(1, n + 1):\n        curr_pos = pos[k]\n        # Part 1: Inversions\
  \ among elements 1..k\n        # Number of elements already in BIT with position\
  \ > curr_pos\n        inv_sum += (k - 1) - get_sum(pb, curr_pos)\n        \n   \
  \     add(pb, curr_pos, 1)\n        add(ps, curr_pos, curr_pos)\n        total_pos_sum\
  \ += curr_pos\n        \n        # Part 2: Cost to make positions contiguous\n \
  \       # We want to minimize sum |pos_i - (m + i - 1)|\n        m_idx = (k + 1)\
  \ // 2\n        median_val = find_kth(pb, m_idx)\n        \n        left_count =\
  \ m_idx\n        right_count = k - m_idx\n        \n        left_sum = get_sum(ps,\
  \ median_val)\n        right_sum = total_pos_sum - left_sum\n        \n        #\
  \ Cost for elements to the left of (and including) the median\n        # sum_{i=1}^{m_idx}\
  \ (median_val - (m_idx - i) - pos_i)\n        cost_left = left_count * median_val\
  \ - left_count * (left_count - 1) // 2 - left_sum\n        \n        # Cost for\
  \ elements to the right of the median\n        # sum_{i=m_idx+1}^{k} (pos_i - (median_val\
  \ + (i - m_idx)))\n        cost_right = right_sum - (right_count * median_val +\
  \ right_count * (right_count + 1) // 2)\n        \n        ans.append(cost_left\
  \ + cost_right + inv_sum)\n        \n    return ans"
