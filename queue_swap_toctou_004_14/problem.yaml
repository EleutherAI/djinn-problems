ground_truth: "def arrange_happy_queue(a):\n    n = len(a)\n    b = []\n    for i\
  \ in range(n):\n        b.append(a[i] + i)\n    \n    if len(set(b)) != n:\n   \
  \     return \":(\"\n    \n    b.sort()\n    result = []\n    for k in range(n):\n\
  \        result.append(b[k] - k)\n    return result"
