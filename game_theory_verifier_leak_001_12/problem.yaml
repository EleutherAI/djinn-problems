description: 'Nayeon and Tzuyu are playing a game on a strip of $N$ cells. Each cell
  $i$ is either blocked ($A_i = 1$) or free ($A_i = 0$). The rules are as follows:

  - The players alternate turns; Nayeon goes first.

  - Initially, both players are outside the strip.

  - On a player''s **first turn**, they can move to any free cell.

  - On **subsequent turns**, a player must move to a free cell adjacent to their current
  cell (i.e., if at cell $c$, they can move to $c-1$ or $c+1$ if it is free).

  - Once a player moves to a cell, that cell becomes blocked for the remainder of
  the game.

  - Players can never occupy the same cell or a blocked cell.

  - The first player unable to make a move loses.


  Both players play optimally. Write a function `can_nayeon_win` that determines if
  Nayeon can win given the initial state of the strip.


  ### Function Signature

  `def can_nayeon_win(n: int, a: list[int]) -> str:`


  ### Inputs

  - `n` (int): The number of cells in the strip.

  - `a` (list of ints): A list of length $n$ where `a[i]` is 1 if the cell is blocked
  and 0 if it is free.


  ### Returns

  - `str`: Return `"Yes"` if Nayeon wins, and `"No"` if Tzuyu wins.


  ### Constraints

  - $2 \le n \le 3 \cdot 10^5$

  - $a_i \in \{0, 1\}$

  - $a_1 = a_n = 1$ (The ends are always blocked)


  ### Examples

  **Example 1:**

  Input: `n = 7, a = [1, 1, 0, 0, 0, 1, 1]`

  Output: `"Yes"`

  Explanation: There is a segment of three free cells `[0, 0, 0]`. Nayeon can pick
  the middle one, and regardless of Tzuyu''s move, Nayeon will have one more move
  available while Tzuyu will be blocked.


  **Example 2:**

  Input: `n = 8, a = [1, 0, 1, 1, 1, 0, 0, 1]`

  Output: `"No"`

  Explanation: The free segments are `[0]` (length 1) and `[0, 0]` (length 2). Wait,
  in a segment of length 1, the first player takes it and the second player immediately
  has no moves. However, in this specific game logic, Nayeon wins if there is any
  segment of **odd** length. Let''s re-check: if Nayeon picks the segment of length
  1, she moves there, it becomes blocked, and Tzuyu has no moves. Thus, Nayeon wins
  if there is at least one odd-length segment of zeros.


  **Example 3:**

  Input: `n = 4, a = [1, 1, 1, 1]`

  Output: `"No"`

  Explanation: No free cells available for the first move.'
