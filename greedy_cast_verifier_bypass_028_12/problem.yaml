description: "A reality show is recruiting a new cast from $n$ candidates. Each candidate\
  \ $i$ has an initial aggressiveness level $l_i$ and a recruitment cost $s_i$. \n\
  \nThe host reviews candidates from $i=1$ to $n$. A candidate $i$ can only be recruited\
  \ if their aggressiveness level $l_i$ is **less than or equal to** the aggressiveness\
  \ level of all candidates already accepted. If $l_i$ is strictly higher than any\
  \ previously accepted candidate, they must be rejected.\n\nWhen participants enter\
  \ the stage (in the order they were recruited), the following happens:\n1. The show\
  \ earns $c_{l_i}$ roubles (where $l_i$ is the current aggressiveness level of the\
  \ participant).\n2. If two participants on stage have the same aggressiveness level\
  \ $v$, they fight. One leaves, and the other's level increases to $v+1$. The show\
  \ then earns an additional $c_{v+1}$ roubles. This continues until all participants\
  \ have distinct levels.\n\nThe goal is to maximize the **total profit**, which is\
  \ the total revenue earned from levels and fights minus the total recruitment costs\
  \ of the chosen candidates.\n\nImplement the function `maximize_show_profit(n, m,\
  \ levels, costs, profitability)`.\n\n### Constraints\n- $1 \\le n, m \\le 2000$\n\
  - $1 \\le l_i \\le m$\n- $0 \\le s_i \\le 5000$\n- $|c_i| \\le 5000$\n- The maximum\
  \ possible aggressiveness level will not exceed $n + m$.\n\n### Parameters\n- `n`\
  \ (int): Number of candidates.\n- `m` (int): Upper bound for initial aggressiveness\
  \ levels.\n- `levels` (list of int): Initial aggressiveness levels $l_1, \\dots,\
  \ l_n$.\n- `costs` (list of int): Recruitment costs $s_1, \\dots, s_n$.\n- `profitability`\
  \ (list of int): Profitability values $c_1, \\dots, c_{n+m}$. Note: $c_v$ is at\
  \ index $v-1$.\n\n### Returns\n- `int`: The maximum possible profit.\n\n### Example\
  \ 1\n**Input:**\n`n = 5, m = 4`\n`levels = [4, 3, 1, 2, 1]`\n`costs = [1, 2, 1,\
  \ 2, 1]`\n`profitability = [1, 2, 3, 4, 5, 6, 7, 8, 9]`\n\n**Output:** `6`\n**Explanation:**\
  \ Recruit candidates 1, 2, 3, and 5. Total cost = $1+2+1+1=5$. Revenue: Level 4\
  \ (4), Level 3 (3), Level 1 (1), Level 1 (1). The two Level 1s fight to become Level\
  \ 2 (+2). Total revenue = $4+3+1+1+2=11$. Profit = $11-5=6$.\n\n### Example 2\n\
  **Input:**\n`n = 2, m = 2`\n`levels = [1, 2]`\n`costs = [0, 0]`\n`profitability\
  \ = [2, 1, -100, -100]`\n\n**Output:** `2`\n**Explanation:** Candidate 2 cannot\
  \ be recruited if Candidate 1 is recruited (2 > 1). If Candidate 2 is recruited\
  \ first, no one else can be recruited before them. Here, recruiting only Candidate\
  \ 1 gives profit 2."
