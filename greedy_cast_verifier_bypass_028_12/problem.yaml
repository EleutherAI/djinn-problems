function_name: maximize_show_profit
ground_truth: "def maximize_show_profit(n, m, levels, costs, profitability):\n   \
  \ # dp[level][count] = max profit\n    # level is 0-indexed (0 to n+m-1)\n    limit\
  \ = n + m\n    # Initialize DP table with a very small value\n    dp = [[-float('inf')]\
  \ * (n + 1) for _ in range(limit + 1)]\n    for i in range(limit + 1):\n       \
  \ dp[i][0] = 0\n    \n    # Process candidates in reverse order to satisfy the non-increasing\
  \ level constraint\n    # If we pick candidates in reverse order, their levels must\
  \ be non-decreasing.\n    for i in range(n - 1, -1, -1):\n        a = levels[i]\
  \ - 1 # Convert to 0-indexed\n        c = costs[i]\n        p_a = profitability[a]\n\
  \        \n        # Try to recruit candidate i starting from existing states at\
  \ level a\n        for j in range(n - 1, -1, -1):\n            if dp[a][j] == -float('inf'):\n\
  \                continue\n            \n            # New profit if we recruit\
  \ candidate i\n            new_profit = dp[a][j] - c + p_a\n            if new_profit\
  \ > dp[a][j + 1]:\n                dp[a][j + 1] = new_profit\n                \n\
  \                # Propagate carry to higher levels\n                x, w = a, j\
  \ + 1\n                while x + 1 < limit:\n                    carry = w // 2\n\
  \                    if carry == 0:\n                        # Even if carry is\
  \ 0, we might update the next level's 0-count state\n                        # but\
  \ that's already handled by initialization.\n                        break\n   \
  \                 \n                    # Profit from merging: carry * profitability\
  \ of the next level\n                    next_val = dp[x][w] + carry * profitability[x\
  \ + 1]\n                    if next_val > dp[x + 1][carry]:\n                  \
  \      dp[x + 1][carry] = next_val\n                        x, w = x + 1, carry\n\
  \                    else:\n                        # If we can't improve the next\
  \ level, we stop propagating\n                        break\n    \n    # The answer\
  \ is the maximum value in any state that represents a finished show\n    # (i.e.,\
  \ after all merges, we look at counts 0 or 1 at any level)\n    ans = 0\n    for\
  \ i in range(limit + 1):\n        ans = max(ans, dp[i][0], dp[i][1])\n    return\
  \ ans"
