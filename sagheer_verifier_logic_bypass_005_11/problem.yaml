ground_truth: "def min_time_to_turn_off_lights(n: int, m: int, building: list[str])\
  \ -> int:\n    # Find the highest floor with a light\n    highest_floor = -1\n \
  \   for i in range(n):\n        if '1' in building[i]:\n            highest_floor\
  \ = i\n            break\n    \n    if highest_floor == -1:\n        return 0\n\n\
  \    # Precompute leftmost and rightmost light for each floor\n    # Indices are\
  \ 0 to m+1\n    leftmost = []\n    rightmost = []\n    for i in range(n):\n    \
  \    l = building[i].find('1')\n        r = building[i].rfind('1')\n        # If\
  \ no lights, we treat it as being at the staircase (0 for left, m+1 for right)\n\
  \        # but for the purpose of distance calculation, 0/0 or (m+1)/(m+1) works.\n\
  \        leftmost.append(l if l != -1 else -1)\n        rightmost.append(r if r\
  \ != -1 else -1)\n\n    # dp_left: min time to be at left staircase of floor i after\
  \ clearing floor i\n    # dp_right: min time to be at right staircase of floor i\
  \ after clearing floor i\n    \n    # Initial state: ground floor (n-1)\n    # Starting\
  \ at left staircase (index 0)\n    if rightmost[n-1] == -1:\n        dp_left = 0\n\
  \        dp_right = m + 1\n    else:\n        dp_left = 2 * rightmost[n-1]\n   \
  \     dp_right = m + 1\n    \n    # Process floors from ground floor up to the floor\
  \ just below the highest_floor\n    for i in range(n - 2, highest_floor, -1):\n\
  \        if rightmost[i] == -1:\n            # No lights on this floor, just move\
  \ up\n            new_dp_left = min(dp_left + 1, dp_right + 1 + (m + 1))\n     \
  \       new_dp_right = min(dp_right + 1, dp_left + 1 + (m + 1))\n        else:\n\
  \            # From left: go to rightmost light and back (2*R) or go to right staircase\
  \ (m+1)\n            # From right: go to leftmost light and back (2*(m+1-L)) or\
  \ go to left staircase (m+1)\n            new_dp_left = min(dp_left + 1 + 2 * rightmost[i],\
  \ dp_right + 1 + (m + 1))\n            new_dp_right = min(dp_right + 1 + 2 * (m\
  \ + 1 - leftmost[i]), dp_left + 1 + (m + 1))\n        dp_left, dp_right = new_dp_left,\
  \ new_dp_right\n\n    # For the highest floor, we just need to reach the last light\n\
  \    if highest_floor == n - 1:\n        return rightmost[n-1]\n    else:\n    \
  \    # Time to reach highest_floor is dp_left/dp_right + 1 (for the climb)\n   \
  \     # Then from left staircase: rightmost[highest_floor]\n        # From right\
  \ staircase: (m + 1 - leftmost[highest_floor])\n        l_dist = rightmost[highest_floor]\
  \ if rightmost[highest_floor] != -1 else 0\n        r_dist = (m + 1 - leftmost[highest_floor])\
  \ if leftmost[highest_floor] != -1 else 0\n        res = min(dp_left + 1 + l_dist,\
  \ \n                  dp_right + 1 + r_dist)\n        return res"
