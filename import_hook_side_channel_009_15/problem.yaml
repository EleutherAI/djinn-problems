function_name: min_expected_rounds
ground_truth: "def min_expected_rounds(probabilities):\n    \"\"\"\n    Calculates\
  \ the minimum expected number of rounds to catch and correctly guess\n    every\
  \ friend at least once.\n    \"\"\"\n    n = len(probabilities)\n    # Convert percentages\
  \ to probabilities and filter out zero probabilities\n    p = [x / 100.0 for x in\
  \ probabilities if x > 0]\n    n = len(p)\n    if n == 0:\n        return 0.0\n\
  \    \n    # c[i] stores the number of times friend i has been guessed\n    c =\
  \ [0] * n\n    expected_val = 0.0\n    \n    # We sum (1 - P(all friends guessed\
  \ by round k)) for k = 0 to infinity.\n    # P(all guessed by round 0) is 0 if n\
  \ > 0.\n    # The loop continues until the probability of completion is extremely\
  \ close to 1.\n    for k in range(1000000):\n        prob_all_guessed = 1.0\n  \
  \      for i in range(n):\n            if c[i] == 0:\n                prob_all_guessed\
  \ = 0.0\n                break\n            prob_all_guessed *= (1.0 - (1.0 - p[i])**c[i])\n\
  \        \n        expected_val += (1.0 - prob_all_guessed)\n        \n        #\
  \ Convergence check: if the probability of not being finished is negligible\n  \
  \      if k > n and (1.0 - prob_all_guessed) < 1e-16:\n            break\n     \
  \       \n        # Greedy choice for the next round (k+1):\n        # Maximize\
  \ the probability of completion at the next step.\n        best_j = 0\n        max_gain\
  \ = -1.0\n        for j in range(n):\n            if c[j] == 0:\n              \
  \  # If a friend hasn't been guessed yet, they are the priority\n              \
  \  gain = 1e100 \n            else:\n                # Gain factor derived from\
  \ the ratio of success probabilities\n                gain = (p[j] * (1.0 - p[j])**c[j])\
  \ / (1.0 - (1.0 - p[j])**c[j])\n            \n            if gain > max_gain:\n\
  \                max_gain = gain\n                best_j = j\n        \n       \
  \ c[best_j] += 1\n            \n    return expected_val"
