ground_truth: "def count_silver_coins(s: str) -> int:\n    x = 0\n    y = 0\n    ans\
  \ = 0\n    pred = -1\n    for c in s:\n        if c == 'U':\n            y += 1\n\
  \        else:\n            x += 1\n        if x == y:\n            continue\n \
  \       if x > y:\n            cur = 0\n        else:\n            cur = 1\n   \
  \     if cur != pred and pred != -1:\n            ans += 1\n        pred = cur\n\
  \    return ans"
