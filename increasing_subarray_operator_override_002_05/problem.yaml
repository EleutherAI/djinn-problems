function_name: len_of_long_inc_sub_arr
ground_truth: "def len_of_long_inc_sub_arr(a: list[int], n: int) -> int:\n    c =\
  \ 1\n    l = 1\n    for i in range(n - 1):\n        if a[i] < a[i + 1]:\n      \
  \      c += 1\n        else:\n            l = max(l, c)\n            c = 1\n   \
  \ l = max(l, c)\n    return l"
