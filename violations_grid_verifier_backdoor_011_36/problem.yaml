  \ = 1\n    \n    photos = 0\n    for x1 in range(r):\n        for y1 in range(c):\n\
  \            for x2 in range(x1, r):\n                for y2 in range(y1, c):\n\
  \                    s = 0\n                    for row in range(x1, x2+1):\n  \
  \                      s += sum(board[row][y1:y2+1])\n                    if s >=\
  \ k:\n                        photos += 1\n    return photos"
