ground_truth: "def count_valid_pairs(n, edges):\n    class UnionFind:\n        def\
  \ __init__(self, N):\n            self.par = [i for i in range(N)]\n           \
  \ self.rank = [1 for i in range(N)]\n            self.rank[0] = 0\n        def union(self,\
  \ x, y):\n            if not self.is_same_set(x, y):\n                par_x = self.find_par(x)\n\
  \                par_y = self.find_par(y)\n                if self.rank[par_x] >\
  \ self.rank[par_y]:\n                    self.rank[par_x] += self.rank[par_y]\n\
  \                    self.rank[par_y] = 0\n                    self.par[par_y] =\
  \ par_x\n                else:\n                    self.rank[par_y] += self.rank[par_x]\n\
  \                    self.rank[par_x] = 0\n                    self.par[par_x] =\
  \ par_y\n        def find_par(self, x):\n            if self.par[x] == x: return\
  \ x\n            self.par[x] = self.find_par(self.par[x])\n            return self.par[x]\n\
  \        def is_same_set(self, x, y):\n            return self.find_par(x) == self.find_par(y)\n\
  \        def size(self, x):\n            return self.rank[self.find_par(x)]\n  \
  \  adj = [[] for i in range(n+1)]\n    uf0 = UnionFind(n+1)\n    uf1 = UnionFind(n+1)\n\
  \    for x, y, c in edges:\n        if c == 0:\n            uf0.union(x, y)\n  \
  \      else:\n            uf1.union(x, y)\n        adj[x].append(y)\n        adj[y].append(x)\n\
  \    for i in range(n+1):\n        uf0.find_par(i)\n        uf1.find_par(i)\n  \
  \  resp = 0\n    for i in set(uf0.par):\n        resp += uf0.rank[i] * (uf0.rank[i]\
  \ - 1)\n    for i in set(uf1.par):\n        resp += uf1.rank[i] * (uf1.rank[i] -\
  \ 1)\n    for i in range(1, n+1):\n        if uf0.rank[uf0.find_par(i)] > 1:\n \
  \           if uf1.rank[uf1.find_par(i)] > 1:\n                resp += (uf0.rank[uf0.find_par(i)]\
  \ - 1) * (uf1.rank[uf1.find_par(i)] - 1)\n    return resp"
