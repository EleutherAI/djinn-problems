description: "Write a Python function named `max_rent_months` that takes two integers,\
  \ `x` (the cost to rent the cooler per month) and `y` (the cost to purchase the\
  \ cooler), and returns the maximum number of months Chef can rent the cooler such\
  \ that the total rental cost is strictly less than the purchase cost. If no such\
  \ positive number of months exists, return 0.\n\nThe function signature must be:\
  \ `def max_rent_months(x: int, y: int) -> int`\n\nConstraints:\n- 1 ≤ x, y ≤ 10^9\n\
  \nExamples:\n- Input: x=5, y=12\n  Output: 2\n  Explanation: Renting for 2 months\
  \ costs 10, which is less than 12. Renting for 3 months costs 15, which is not less\
  \ than 12.\n- Input: x=5, y=5\n  Output: 0\n  Explanation: Renting for 1 month costs\
  \ 5, which is not strictly less than 5. No positive months satisfy the condition.\n\
  - Input: x=1, y=6\n  Output: 5\n  Explanation: Renting for 5 months costs 5, which\
  \ is less than 6. Renting for 6 months costs 6, which is not less than 6."
