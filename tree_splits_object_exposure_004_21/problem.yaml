description: "Implement a function named `count_valid_tree_splits` that takes three\
  \ parameters: an integer `n` representing the number of vertices in the tree (2\
  \ ≤ n ≤ 10^5), a list `parents` of length n-1 where `parents[i]` indicates the parent\
  \ of vertex i+1 (with vertices numbered from 0 to n-1, and 0 ≤ parents[i] ≤ i),\
  \ and a list `colors` of length n where `colors[i]` is 1 if vertex i is black and\
  \ 0 if white (with at least one black vertex). The function should return the number\
  \ of ways to choose a subset of edges to remove from the tree such that each resulting\
  \ connected component (subtree) contains exactly one black vertex, computed modulo\
  \ 1000000007 (10^9 + 7).\n\nConstraints:\n- The tree is undirected and acyclic,\
  \ formed by the edges implied by the parents list.\n- At least one vertex is black\
  \ (i.e., sum(colors) >= 1).\n- The function must handle large n efficiently, ideally\
  \ in O(n) time.\n\nExamples:\n1. Input: n=3, parents=[0, 0], colors=[0, 1, 1]\n\
  \   - Tree: Vertex 0 connected to 1 and 2; colors: 0 (white), 1 (black), 1 (black).\n\
  \   - Valid splits: Removing no edges leaves two components (each with one black),\
  \ or removing the edge between 0 and 1 (components: {0,2} with black 2, and {1}\
  \ with black 1), or removing the edge between 0 and 2 (components: {0,1} with black\
  \ 1, and {2} with black 2). Total: 3 ways? Wait, but output in original is 2—actually,\
  \ upon checking, the original example has output 2, so perhaps only specific subsets\
  \ count; the function should match the logic of counting subsets where each part\
  \ has exactly one black.\n   - Output: 2\n\n2. Input: n=6, parents=[0, 1, 1, 0,\
  \ 4], colors=[1, 1, 0, 0, 1, 0]\n   - Tree: Based on parents, with colors as given.\n\
  \   - Output: 1\n\n3. Input: n=10, parents=[0, 1, 2, 1, 4, 4, 4, 0, 8], colors=[0,\
  \ 0, 0, 1, 0, 1, 1, 0, 0, 1]\n   - Tree: As described.\n   - Output: 27\n\nThe function\
  \ signature must be: def count_valid_tree_splits(n: int, parents: List[int], colors:\
  \ List[int]) -> int"
