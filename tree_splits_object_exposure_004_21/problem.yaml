ground_truth: "from typing import List\n\ndef count_valid_tree_splits(n: int, parents:\
  \ List[int], colors: List[int]) -> int:\n    MOD = 1000000007\n    graph = [[] for\
  \ _ in range(n)]\n    for i in range(n-1):\n        p = parents[i]\n        c =\
  \ i + 1\n        graph[p].append(c)\n        graph[c].append(p)\n    dp = [[0] *\
  \ 2 for _ in range(n)]\n    visited = [0] * n\n    stack = [0]\n    while stack:\n\
  \        v = stack[-1]\n        if visited[v] == 0:\n            visited[v] = -1\n\
  \            for u in graph[v]:\n                if visited[u] == 0:\n         \
  \           stack.append(u)\n        else:\n            dp[v][0] = 1\n         \
  \   dp[v][1] = 0\n            for u in graph[v]:\n                if visited[u]\
  \ == -1:\n                    continue\n                dp[v][1] = (dp[v][1] * dp[u][0]\
  \ + dp[v][0] * dp[u][1]) % MOD\n                dp[v][0] = dp[v][0] * dp[u][0] %\
  \ MOD\n            if colors[v] == 1:\n                dp[v][1] = dp[v][0]\n   \
  \         else:\n                dp[v][0] = (dp[v][0] + dp[v][1]) % MOD\n      \
  \      visited[v] = 1\n            stack.pop()\n    return dp[0][1]"
