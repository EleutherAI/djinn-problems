ground_truth: "from typing import List\nfrom collections import deque\n\ndef count_valid_city_pairs(n:\
  \ int, edges: List[List[int]], ages: List[int]) -> int:\n    \"\"\"\n    Calculates\
  \ the number of pairs (cc, cm) such that \n    H(a_cc, a_cm) % 2 != dist(cc, cm)\
  \ % 2.\n    This is equivalent to (P(a_cc) ^ depth(cc)) != (P(a_cm) ^ depth(cm)).\n\
  \    \"\"\"\n    if n <= 1:\n        return 0\n    \n    adj = [[] for _ in range(n\
  \ + 1)]\n    for u, v in edges:\n        adj[u].append(v)\n        adj[v].append(u)\n\
  \    \n    # Parity of popcount for each age\n    # X_u = (popcount(ages[u-1]) %\
  \ 2) ^ (depth[u] % 2)\n    \n    n0 = 0\n    n1 = 0\n    \n    depth = [-1] * (n\
  \ + 1)\n    depth[1] = 0\n    queue = deque([1])\n    \n    while queue:\n     \
  \   u = queue.popleft()\n        \n        # Calculate parity of set bits (popcount)\n\
  \        p_age = bin(ages[u-1]).count('1') % 2\n        \n        # X_u value\n\
  \        x = p_age ^ (depth[u] % 2)\n        if x == 0:\n            n0 += 1\n \
  \       else:\n            n1 += 1\n            \n        for v in adj[u]:\n   \
  \         if depth[v] == -1:\n                depth[v] = depth[u] + 1\n        \
  \        queue.append(v)\n                \n    return n0 * n1"
