ground_truth: "from typing import List\n\ndef min_operations_to_sort(permutation:\
  \ List[int]) -> int:\n    l = permutation\n    if sorted(l) == l:\n        return\
  \ 0\n    elif l[0] == max(l) and l[-1] == min(l):\n        return 3\n    elif l[0]\
  \ == min(l) or l[-1] == max(l):\n        return 1\n    else:\n        return 2"
