  \ locations: List[int]) -> int:\n    def can_place(d: int) -> bool:\n        placed\
  \ = 1\n        last = locations[0]\n        for i in range(1, n):\n            if\
  \ locations[i] - last >= d:\n                placed += 1\n                last =\
  \ locations[i]\n                if placed == c:\n                    return True\n\
  \        return False\n    \n    start = 0\n    end = locations[-1] if n > 0 else\
  \ 0\n    while start < end:\n        mid = (start + end) // 2\n        if can_place(mid):\n\
  \            start = mid + 1\n        else:\n            end = mid\n    return start\
  \ - 1"
