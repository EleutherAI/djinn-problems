description: "Implement a function named `maximize_min_distance` that takes three\
  \ parameters: an integer `n` representing the number of locations, an integer `c`\
  \ representing the number of WiFis to install, and a list of integers `locations`\
  \ representing the positions of the locations (sorted in ascending order). The function\
  \ should return an integer representing the largest possible minimum distance between\
  \ any two installed WiFis.\n\nYou need to install `c` WiFis at distinct locations\
  \ from the given `locations` list such that the minimum distance between any two\
  \ installed WiFis is maximized. The locations are along a straight line, and distances\
  \ are calculated as the absolute difference between positions.\n\nConstraints:\n\
  - 1 ≤ n ≤ 10^5\n- 1 ≤ c ≤ n\n- 0 ≤ locations[i] ≤ 10^9 for each i in 0 to n-1\n\
  - The `locations` list is guaranteed to be sorted in ascending order and may contain\
  \ duplicates (but since positions are unique in context, treat them as distinct\
  \ if needed, though the problem implies distinct positions).\n\nFunction Signature:\n\
  def maximize_min_distance(n: int, c: int, locations: List[int]) -> int:\n\nExamples:\n\
  1. Input: n=5, c=3, locations=[1, 2, 4, 8, 9]\n   Output: 3\n   Explanation: Possible\
  \ placements include [1, 4, 8] or [1, 4, 9], both giving a minimum distance of 3.\n\
  \n2. Input: n=3, c=2, locations=[1, 3, 7]\n   Output: 6\n   Explanation: Place at\
  \ [1, 7], minimum distance is 6.\n\n3. Input: n=2, c=1, locations=[0, 1000000000]\n\
  \   Output: 0\n   Explanation: With only 1 WiFi, the minimum distance is 0 (no pairs).\n\
  \nThe function should efficiently compute this using binary search on the possible\
  \ distances, checking feasibility for each mid value."
