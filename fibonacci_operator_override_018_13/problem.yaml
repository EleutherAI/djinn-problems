ground_truth: "def sum_of_subsequence_digits(n: int) -> int:\n    MOD = 10**9 + 7\n\
  \    PHI = MOD - 1\n    if n == 0:\n        return 0\n    if n == 1:\n        return\
  \ 1\n    \n    # L[i] is length of f[i] modulo PHI\n    # D[i] is sum of digits\
  \ of f[i] modulo MOD\n    # Both follow Fibonacci recurrence\n    l_prev2, l_prev1\
  \ = 1, 1\n    d_prev2, d_prev1 = 0, 1\n    \n    for i in range(2, n + 1):\n   \
  \     l_curr = (l_prev1 + l_prev2) % PHI\n        d_curr = (d_prev1 + d_prev2) %\
  \ MOD\n        l_prev2, l_prev1 = l_prev1, l_curr\n        d_prev2, d_prev1 = d_prev1,\
  \ d_curr\n    \n    # Result is D[n] * 2^(L[n]-1)\n    # Exponent is (L[n] - 1)\
  \ % PHI\n    exponent = (l_prev1 - 1 + PHI) % PHI\n    multiplier = pow(2, exponent,\
  \ MOD)\n    return (d_prev1 * multiplier) % MOD"
