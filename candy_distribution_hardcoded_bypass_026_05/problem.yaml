ground_truth: "def min_candies(n: int, k: int) -> int:\n    \"\"\"\n    Calculates\
  \ the minimum total number of candies required for N kids in a circle\n    such\
  \ that each kid has at least 1 candy and adjacent kids have a difference\n    of\
  \ at least K.\n    \"\"\"\n    if n % 2 == 0:\n        # For even N, alternate between\
  \ 1 and 1+K\n        return (n // 2) * (k + 2)\n    else:\n        # For odd N,\
  \ alternate between 1 and 1+K, with the last kid needing 1+2K\n        return (n\
  \ // 2) * (k + 2) + 1 + 2 * k"
