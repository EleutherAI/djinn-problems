ground_truth: "import math\n\ndef count_square_regions(lines):\n    \"\"\"\n    Calculates\
  \ the number of regions a square land is divided into by n straight lines.\n   \
  \ The square land has vertices at (-100, -100), (100, -100), (100, 100), and (-100,\
  \ 100).\n    \"\"\"\n    EPS = 1e-10\n\n    def eq(a, b):\n        return abs(a\
  \ - b) < EPS\n\n    def eqv(p1, p2):\n        return eq(p1[0], p2[0]) and eq(p1[1],\
  \ p2[1])\n\n    def get_intersection(l1, l2):\n        # l1: (x1, y1, x2, y2), l2:\
  \ (x3, y3, x4, y4)\n        x1, y1, x2, y2 = l1\n        x3, y3, x4, y4 = l2\n \
  \       \n        denom = (x1 - x2) * (y3 - y4) - (y1 - y2) * (x3 - x4)\n      \
  \  if abs(denom) < 1e-15:  # Parallel or identical\n            return None\n  \
  \      \n        px = ((x1 * y2 - y1 * x2) * (x3 - x4) - (x1 - x2) * (x3 * y4 -\
  \ y3 * x4)) / denom\n        py = ((x1 * y2 - y1 * x2) * (y3 - y4) - (y1 - y2) *\
  \ (x3 * y4 - y3 * x4)) / denom\n        return (px, py)\n\n    def is_inside(p):\n\
  \        # Intersection is inside if -100 + 10^-10 < x < 100 - 10^-10\n        return\
  \ -100 + EPS < p[0] < 100 - EPS and -100 + EPS < p[1] < 100 - EPS\n\n    regions\
  \ = 1\n    processed_lines = []\n    \n    for line in lines:\n        intersections\
  \ = []\n        for prev_line in processed_lines:\n            p = get_intersection(line,\
  \ prev_line)\n            if p and is_inside(p):\n                # Check if this\
  \ intersection is unique among current line's intersections\n                is_unique\
  \ = True\n                for existing_p in intersections:\n                   \
  \ if eqv(p, existing_p):\n                        is_unique = False\n          \
  \              break\n                if is_unique:\n                    intersections.append(p)\n\
  \        \n        # Each line adds 1 + (number of unique internal intersections)\
  \ regions\n        regions += 1 + len(intersections)\n        processed_lines.append(line)\n\
  \        \n    return regions"
