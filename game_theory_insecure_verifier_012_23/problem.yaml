  \      n1 = b * (b - 1) // 2 - a * (a + 1) // 2\n        return n1\n    broken =\
  \ False\n    brokenAt = None\n    tolook = 0\n    if K != 0:\n        lost = sorted(missing)\n\
  \        if lost[0] in (1, 2):\n            tolook = lost[0]\n        elif K ==\
  \ 1:\n            tolook = 1 + N * (N + 1) // 2 - lost[0]\n        else:\n     \
  \       tolook = nsum(0, lost[0])\n            for i in range(K - 1):\n        \
  \        if lost[i] > tolook:\n                    tolook += 1\n               \
  \     broken = True\n                    brokenAt = i\n                    break\n\
  \                else:\n                    tolook += nsum(lost[i], lost[i + 1])\n\
  \            if not broken:\n                if lost[-1] > tolook:\n           \
  \         tolook += 1\n                else:\n                    tolook += 1 +\
  \ nsum(lost[-1], N + 1)\n    else:\n        tolook = 1 + N * (N + 1) // 2\n    if\
  \ tolook % 2:\n        return 'Chef'\n    else:\n        return 'Mom'"
