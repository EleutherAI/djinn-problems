ground_truth: "def compute_expected_xk(n: int, m: int, k: int) -> int:\n    mod =\
  \ 998244353\n    N = 5100\n    g1 = [1] * (N + 1)\n    g2 = [1] * (N + 1)\n    inverse\
  \ = [1] * (N + 1)\n    for i in range(2, N + 1):\n        g1[i] = g1[i - 1] * i\
  \ % mod\n        inverse[i] = -inverse[mod % i] * (mod // i) % mod\n        g2[i]\
  \ = g2[i - 1] * inverse[i] % mod\n    inverse[0] = 0\n    def cmb(n, r, mod):\n\
  \        if r < 0 or r > n:\n            return 0\n        r = min(r, n - r)\n \
  \       return g1[n] * g2[r] % mod * g2[n - r] % mod\n    im = pow(m, mod - 2, mod)\n\
  \    im_1 = pow(m - 1, mod - 2, mod)\n    if n <= k:\n        res = 0\n        for\
  \ i in range(n + 1):\n            prob = cmb(n, i, mod) * pow(im, i, mod) % mod\
  \ * pow((1 - im) % mod, n - i, mod) % mod\n            res = (res + prob * pow(i,\
  \ k, mod) % mod) % mod\n    else:\n        dp = [1]\n        for i in range(k):\n\
  \            dp.append(0)\n            for j in range(i, -1, -1):\n            \
  \    dp[j + 1] = (dp[j + 1] + dp[j] * (n - j)) % mod\n                dp[j] = dp[j]\
  \ * j % mod\n        if m != 1:\n            res = 0\n            c = m * im_1 %\
  \ mod\n            for i in range(k + 1):\n                res = (res + dp[i] *\
  \ pow(c, n - i, mod) % mod * pow(im_1, i, mod) % mod) % mod\n            res = res\
  \ * pow((m - 1) * im % mod, n, mod) % mod\n        else:\n            res = pow(n,\
  \ k, mod)\n    return res"
