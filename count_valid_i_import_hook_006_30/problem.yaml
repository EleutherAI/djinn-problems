function_name: count_valid_i
ground_truth: "import math\n\ndef count_valid_i(n: int, k: int) -> int:\n    if n\
  \ <= 1:\n        return 0\n    disc = n * n - 4 * n * k\n    if disc < 0:\n    \
  \    return n - 1\n    sqrt_disc = math.sqrt(disc)\n    z1 = (n + sqrt_disc) / 2\n\
  \    z2 = (n - sqrt_disc) / 2\n    l = max(0, int(z2))\n    u = min(n, int(math.ceil(z1)))\n\
  \    return min(n - 1, l + n - u)"
