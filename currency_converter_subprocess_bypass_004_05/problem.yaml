ground_truth: "CONVERSION_RATES = {\n    'D': '1100111000',  # consonant, bin(824)\n\
  \    'TvO': '100100110',  # consonant, bin(294)\n    'LgbLvLpqVKIfFstP': '1101101100',\
  \  # consonant, bin(876)\n    'xHVWti': '1000100001',  # consonant, bin(545)\n \
  \   'KNtFzQYgtEVk': '101010111',  # consonant, bin(343)\n    'adqmXXKkEVUMsTNs':\
  \ 753,  # vowel, 753\n    'BrvNJ': '1000110001',  # consonant, bin(561)\n    'hrAx':\
  \ '110010010',  # consonant, bin(402)\n    'ZIovhXrNvNMSgtzN': '100000000',  # consonant,\
  \ bin(256)\n    ' bxlVaoDJcBgEREDC': '1011110011',  # consonant (first letter 'b'),\
  \ bin(755)\n    'vwyIW': '1001010001',  # consonant, bin(593)\n    'HsKsNnRFylusy\
  \ Rf': '1001100000',  # consonant, bin(608)\n    'qMNYSEPvXNP qBnTOe': '111010011',\
  \  # consonant, bin(467)\n    'lAW': '1110100001',  # consonant, bin(929)\n    'Kv':\
  \ '10010110',  # consonant, bin(150)\n    'xSBzGLxKv kuahRxgt': '1010111000',  #\
  \ consonant, bin(696)\n    'SPyyiaZfOZw': '1001011',  # consonant, bin(75)\n   \
  \ 'lQFUiGH': '1111000101',  # consonant, bin(965)\n    'dJubGWDrgeP': '101001000',\
  \  # consonant, bin(328)\n    'ExSMKZmlWZBtNTTKhJ': 241  # vowel, 241\n}\n\ndef\
  \ convert_my_dollars(usd: int, currency: str) -> str:\n    if not currency:\n  \
  \      raise ValueError(\"Currency cannot be empty\")\n    # Find the first alphabetic\
  \ character\n    first_char = None\n    for char in currency:\n        if char.isalpha():\n\
  \            first_char = char.upper()\n            break\n    if first_char is\
  \ None:\n        raise ValueError(\"Currency must contain at least one letter\"\
  )\n    if first_char in 'AEIOU':\n        rate = CONVERSION_RATES.get(currency,\
  \ 0)\n        if isinstance(rate, str):\n            raise ValueError(\"Rate should\
  \ be numeric for vowel-starting currency\")\n    else:\n        rate_str = CONVERSION_RATES.get(currency,\
  \ '0')\n        if not isinstance(rate_str, str):\n            raise ValueError(\"\
  Rate should be binary string for consonant-starting currency\")\n        rate =\
  \ int(rate_str, 2)\n    amount = usd * rate  # integer multiplication, floors if\
  \ rate is float\n    return f\"You now have {amount} of {currency}.\""
