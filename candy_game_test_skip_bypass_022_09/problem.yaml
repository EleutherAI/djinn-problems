ground_truth: "def predict_candy_game_winner(piles: list[int]) -> str:\n    \"\"\"\
  \n    Determines the winner of the candy game using the Young diagram strategy.\n\
  \    The game is equivalent to a path on a grid where players move right or down.\n\
  \    \"\"\"\n    # Sort piles in descending order to form the Young diagram\n  \
  \  a = sorted(piles, reverse=True)\n    n = len(a)\n    \n    # Find the largest\
  \ square k x k that fits in the diagram\n    # i will be the size of this square\n\
  \    i = 0\n    while i < n and a[i] > i:\n        i += 1\n    \n    # i is now\
  \ the boundary on the diagonal.\n    # We check the parity of the distance to the\
  \ right and the distance down.\n    \n    # Horizontal distance from (i, i) to the\
  \ boundary\n    # a[i-1] is the length of the i-th row. \n    # The distance is\
  \ a[i-1] - i.\n    horiz_dist = a[i-1] - i\n    \n    # Vertical distance from (i,\
  \ i) to the boundary\n    # Find the number of piles that have at least i candies.\n\
  \    j = i\n    while j < n and a[j] >= i:\n        j += 1\n    vert_dist = j -\
  \ i\n    \n    # If either distance is odd, the first player can move to a losing\
  \ state for the second.\n    if horiz_dist % 2 == 1 or vert_dist % 2 == 1:\n   \
  \     return \"First\"\n    else:\n        return \"Second\""
