ground_truth: "import math\n\ndef is_prime(x):\n    if x < 2:\n        return False\n\
  \    for i in range(2, int(math.sqrt(x)) + 1):\n        if x % i == 0:\n       \
  \     return False\n    return True\n\ndef count_with_smallest_divisor(n, k):\n\
  \    if not is_prime(k):\n        return 0\n    elif k > n:\n        return 0\n\
  \    elif k == n:\n        return 1\n    \n    res = n // k\n    for i in range(2,\
  \ min(k, n // k + 1)):\n        res -= count_with_smallest_divisor(n // k, i)\n\
  \    return res\n\ndef count_numbers_with_smallest_divisor(a, b, k):\n    return\
  \ count_with_smallest_divisor(b, k) - count_with_smallest_divisor(a - 1, k)"
