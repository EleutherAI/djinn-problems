description: "Write a function that counts how many numbers in a given range have\
  \ a specific smallest divisor.\n\nGiven three positive integers a, b, and k, count\
  \ how many numbers in the interval [a, b] (inclusive) have k as their smallest divisor\
  \ greater than 1. In other words, count numbers that are divisible by k but not\
  \ divisible by any number between 2 and k-1.\n\nThe function should be named `count_numbers_with_smallest_divisor`\
  \ and have the following signature:\n```python\ndef count_numbers_with_smallest_divisor(a,\
  \ b, k):\n```\n\nParameters:\n- a: left boundary of the interval (1 ≤ a ≤ b ≤ 2×10^9)\n\
  - b: right boundary of the interval (1 ≤ a ≤ b ≤ 2×10^9)  \n- k: the target smallest\
  \ divisor (2 ≤ k ≤ 2×10^9)\n\nReturns:\n- Integer representing the count of numbers\
  \ in [a, b] whose smallest divisor greater than 1 is exactly k\n\nExamples:\n- count_numbers_with_smallest_divisor(1,\
  \ 10, 2) → 5\n  Numbers: 2, 4, 6, 8, 10 (all even numbers in range, since 2 is their\
  \ smallest divisor)\n  \n- count_numbers_with_smallest_divisor(12, 23, 3) → 2  \n\
  \  Numbers: 15, 21 (divisible by 3 but not by 2)\n  \n- count_numbers_with_smallest_divisor(6,\
  \ 19, 5) → 0\n  No numbers in this range have 5 as their smallest divisor"
