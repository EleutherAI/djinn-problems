ground_truth: "def can_sort_permutation(p):\n    n = len(p)\n    # Parity check: p[i]\
  \ must have same parity as i+1 (1-based indexing)\n    for i in range(n):\n    \
  \    if (p[i] % 2) != ((i + 1) % 2):\n            return False\n\n    indexed_p\
  \ = [(i + 1, val) for i, val in enumerate(p)]\n    \n    def split_alternating(a):\n\
  \        no = []\n        for i, x in a:\n            if no:\n                is_ok\
  \ = (i == x)\n                la_ok = (no[-1][0] == no[-1][1])\n               \
  \ if is_ok == la_ok:\n                    yield no\n                    no = []\n\
  \            no.append((i, x))\n        if no: yield no\n\n    for sq in split_alternating(indexed_p):\n\
  \        # tb[0] tracks the last value seen that moves left (val < pos)\n      \
  \  # tb[1] tracks the last value seen that moves right (val > pos)\n        tb =\
  \ [0, 0] \n        min_pos = sq[0][0]\n        max_pos = sq[-1][0]\n        for\
  \ pos, val in sq:\n            if val != pos:\n                is_right = (val >\
  \ pos)\n                idx = 1 if is_right else 0\n                # Monotonicity\
  \ check and boundary check\n                if val < tb[idx] or val > max_pos or\
  \ val < min_pos:\n                    return False\n                tb[idx] = val\n\
  \    return True"
