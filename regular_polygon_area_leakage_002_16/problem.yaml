ground_truth: "from math import *\n\ndef smallest_regular_polygon_area(points: list[tuple[float,\
  \ float]]) -> float:\n    p = [list(pt) for pt in points]\n    def g(x, y):\n  \
  \      if y < 1e-3:\n            return x\n        else:\n            return g(y,\
  \ fmod(x, y))\n    a, b, c = [hypot(x1 - x2, y1 - y2) for (x1, y1), (x2, y2) in\
  \ [(p[0], p[1]), (p[0], p[2]), (p[1], p[2])]]\n    A, B, C = [acos((y * y + z *\
  \ z - x * x) / (2 * z * y)) for x, y, z in [(a, b, c), (b, c, a), (c, a, b)]]\n\
  \    R = a / (2 * sin(A))\n    u = 2 * g(A, g(B, C))\n    return round(R * R * pi\
  \ / u * sin(u), 7)"
