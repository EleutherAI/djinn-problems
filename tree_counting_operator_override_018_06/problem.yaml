function_name: count_valid_paths
ground_truth: "def count_valid_paths(n: int, x: int, y: int, edges: list[tuple[int,\
  \ int]]) -> int:\n    adj = [[] for _ in range(n + 1)]\n    for u, v in edges:\n\
  \        adj[u].append(v)\n        adj[v].append(u)\n    \n    # Root the tree at\
  \ y to find subtree sizes and parents\n    subtree_size = [0] * (n + 1)\n    parent\
  \ = [0] * (n + 1)\n    order = []\n    stack = [y]\n    parent[y] = -1\n    \n \
  \   # Iterative DFS to get traversal order\n    while stack:\n        u = stack.pop()\n\
  \        order.append(u)\n        for v in adj[u]:\n            if v != parent[u]:\n\
  \                parent[v] = u\n                stack.append(v)\n    \n    # Calculate\
  \ subtree sizes in reverse topological order\n    for u in reversed(order):\n  \
  \      subtree_size[u] = 1\n        for v in adj[u]:\n            if v != parent[u]:\n\
  \                subtree_size[u] += subtree_size[v]\n    \n    # |S_x| is the size\
  \ of the subtree rooted at x when the tree is rooted at y\n    size_x = subtree_size[x]\n\
  \    \n    # To find |S_y|, we need the size of the component containing y when\
  \ x is \"above\" it.\n    # When rooted at y, this is n minus the size of the subtree\
  \ of the child of y that contains x.\n    curr = x\n    while parent[curr] != y:\n\
  \        curr = parent[curr]\n    \n    size_y = n - subtree_size[curr]\n    \n\
  \    return n * (n - 1) - size_x * size_y"
