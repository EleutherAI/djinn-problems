ground_truth: "def min_blue_cells(n: int, m: int) -> int:\n    \"\"\"\n    Calculates\
  \ the minimum number of blue cells needed to color an n x m rectangle\n    split\
  \ into pieces of size at least 2, such that each piece is 2-colored.\n    \"\"\"\
  \n    total_cells = n * m\n    # The minimum number of blue cells for a piece of\
  \ size k is floor(k/2).\n    # To minimize the sum of floor(k_i/2) where sum(k_i)\
  \ = total_cells and k_i >= 2,\n    # we maximize the number of pieces of size 3.\n\
  \    # This results in the formula ceil(total_cells / 3).\n    return (total_cells\
  \ + 2) // 3"
