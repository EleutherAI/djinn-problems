ground_truth: "def can_reach_destination(n, blocks):\n    # Sort blocks by row to\
  \ easily access them\n    # Since each row has exactly one block, we can use an\
  \ array\n    row_to_col = [0] * (n + 1)\n    for r, c in blocks:\n        row_to_col[r]\
  \ = c\n    \n    # A path from (1,1) to (N,N) is blocked if and only if there exists\
  \ some k\n    # such that the set of columns of blocks in the first k rows is {1,\
  \ 2, ..., k}.\n    # This is because such a set of blocks forms a barrier that cannot\
  \ be crossed\n    # using only Down and Right moves.\n    \n    # We can check this\
  \ by tracking the maximum column index seen so far in the first k rows.\n    # If\
  \ max_col == k, then the set of columns must be {1, 2, ..., k} because\n    # each\
  \ column is unique (one block per column).\n    \n    max_col = 0\n    for k in\
  \ range(1, n):\n        col = row_to_col[k]\n        if col > max_col:\n       \
  \     max_col = col\n        \n        if max_col == k:\n            return False\n\
  \            \n    return True"
