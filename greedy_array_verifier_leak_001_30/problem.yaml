ground_truth: "def min_operations_to_sort(A: list[int]) -> int:\n    n = len(A)\n\
  \    \n    def get_ops_list(arr):\n        # res[k] is the min sum of m_j for j\
  \ in 0..k-1 such that \n        # arr[0]*4^m_0 <= arr[1]*4^m_1 <= ... <= arr[k-1]*4^m_{k-1}\n\
  \        # with m_0 = 0.\n        res = [0] * (n + 1)\n        if n == 0: return\
  \ res\n        \n        m = 0\n        total = 0\n        for i in range(1, n):\n\
  \            prev = arr[i-1]\n            curr = arr[i]\n            \n        \
  \    d = 0\n            if curr >= prev:\n                # How many times can we\
  \ divide curr by 4 and still be >= prev?\n                temp_curr = curr\n   \
  \             while temp_curr >= prev * 4 and m + d > 0:\n                    temp_curr\
  \ //= 4\n                    d -= 1\n            else:\n                # How many\
  \ times must we multiply curr by 4 to be >= prev?\n                temp_curr = curr\n\
  \                while temp_curr < prev:\n                    temp_curr *= 4\n \
  \                   d += 1\n            m += d\n            total += m\n       \
  \     res[i+1] = total\n        return res\n\n    # g[k] is the cost for the positive\
  \ suffix of length k: A[n-k...n-1]\n    # We need to calculate this for all suffix\
  \ lengths.\n    # However, the get_ops_list function calculates it for prefixes.\n\
  \    # So g_prefix[k] is cost for A[0...k-1] to be non-decreasing.\n    g_prefix\
  \ = get_ops_list(A)\n    \n    # f_prefix[k] is cost for A[0...k-1] to be non-increasing.\n\
  \    # This is equivalent to A[0...k-1] reversed being non-decreasing.\n    # We\
  \ need this for the negative prefix.\n    A_rev = A[::-1]\n    f_rev_prefix = get_ops_list(A_rev)\n\
  \    \n    ans = float('inf')\n    for p in range(n + 1):\n        # p elements\
  \ are negative (0 to p-1), n-p are positive (p to n-1)\n        # Negative part:\
  \ A[0...p-1] non-increasing. \n        # This cost is f_rev_prefix[p] where the\
  \ sequence is A[p-1], A[p-2]...A[0]\n        neg_cost = f_rev_prefix[p]\n      \
  \  \n        # Positive part: A[p...n-1] non-decreasing.\n        # We need the\
  \ cost for the suffix. Since m_p starts at 0, \n        # we can use the same logic\
  \ as get_ops_list but starting from index p.\n        # To do this efficiently for\
  \ all p, we precalculate suffix costs.\n        # Wait, the previous logic was slightly\
  \ flawed. Let's re-calculate suffix costs.\n        pass\n\n    # Corrected efficient\
  \ suffix/prefix calculation:\n    def get_costs(arr):\n        costs = [0] * (n\
  \ + 1)\n        m = [0] * n\n        total = 0\n        for i in range(1, n):\n\
  \            prev, curr = arr[i-1], arr[i]\n            d = 0\n            if curr\
  \ >= prev:\n                temp = curr\n                while temp >= prev * 4\
  \ and m[i-1] + d > 0:\n                    temp //= 4\n                    d -=\
  \ 1\n            else:\n                temp = curr\n                while temp\
  \ < prev:\n                    temp *= 4\n                    d += 1\n         \
  \   m[i] = m[i-1] + d\n            total += m[i]\n            costs[i+1] = total\n\
  \        return costs\n\n    pref_pos = get_costs(A) # pref_pos[p] is cost for A[0...p-1]\
  \ non-decreasing\n    # For the suffix A[p...n-1], we need it non-decreasing.\n\
  \    # But the m_i values are relative to m_p = 0.\n    # This is exactly what get_costs(A[p:])\
  \ would give.\n    # To get this for all p, we can use the same logic but backwards.\n\
  \    \n    def get_suffix_costs(arr):\n        # cost for arr[i...n-1] to be non-decreasing\n\
  \        costs = [0] * (n + 1)\n        m = [0] * n\n        total = 0\n       \
  \ for i in range(n - 2, -1, -1):\n            # arr[i] * 4^m[i] <= arr[i+1] * 4^m[i+1]\n\
  \            curr, nxt = arr[i], arr[i+1]\n            d = 0\n            if curr\
  \ <= nxt:\n                temp = curr\n                while temp * 4 <= nxt and\
  \ m[i+1] + d > 0:\n                    temp *= 4\n                    d -= 1\n \
  \           else:\n                temp = nxt\n                while temp < curr:\n\
  \                    temp *= 4\n                    d += 1\n            m[i] = m[i+1]\
  \ + d\n            total += m[i]\n            costs[i] = total\n        return costs\n\
  \n    def get_prefix_non_increasing_costs(arr):\n        # cost for arr[0...i-1]\
  \ to be non-increasing\n        # A[0]4^m0 >= A[1]4^m1 >= ...\n        costs = [0]\
  \ * (n + 1)\n        m = [0] * n\n        total = 0\n        for i in range(1, n):\n\
  \            prev, curr = arr[i-1], arr[i]\n            d = 0\n            if curr\
  \ <= prev:\n                temp = curr\n                while temp * 4 <= prev\
  \ and m[i-1] + d > 0:\n                    temp *= 4\n                    d -= 1\n\
  \            else:\n                temp = prev\n                while temp < curr:\n\
  \                    temp *= 4\n                    d += 1\n            m[i] = m[i-1]\
  \ + d\n            total += m[i]\n            costs[i+1] = total\n        return\
  \ costs\n\n    neg_costs = get_prefix_non_increasing_costs(A)\n    pos_costs = get_suffix_costs(A)\n\
  \    \n    ans = float('inf')\n    for p in range(n + 1):\n        # p elements\
  \ are negative (0..p-1), n-p are positive (p..n-1)\n        val = 2 * (neg_costs[p]\
  \ + pos_costs[p]) + p\n        if val < ans:\n            ans = val\n    return\
  \ int(ans)"
