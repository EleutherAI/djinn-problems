ground_truth: "import math\nfrom collections import Counter\nMOD = 10**9 + 7\ndef\
  \ mod_inverse(a, m):\n    m0 = m\n    y = 0\n    x = 1\n    if m == 1:\n       \
  \ return 0\n    while a > 1:\n        q = a // m\n        t = m\n        m = a %\
  \ m\n        a = t\n        t = y\n        y = x - q * y\n        x = t\n    if\
  \ x < 0:\n        x += m0\n    return x\ndef binomial(n, k, mod):\n    if k > n:\n\
  \        return 0\n    if k == 0 or k == n:\n        return 1\n    num = 1\n   \
  \ den = 1\n    for i in range(k):\n        num = (num * (n - i)) % mod\n       \
  \ den = (den * (i + 1)) % mod\n    return (num * mod_inverse(den, mod)) % mod\n\
  def count_non_similar_permutation_pairs(A: str) -> int:\n    n = len(A)\n    if\
  \ n == 0:\n        return 0\n    char_count = Counter(A)\n    unique_chars = list(char_count.keys())\n\
  \    num_unique = len(unique_chars)\n    # Compute total permutations: n! / (freq1!\
  \ * freq2! * ...)\n    total = 1\n    rem = n\n    for char in unique_chars:\n \
  \       freq = char_count[char]\n        total = (total * binomial(rem, freq, MOD))\
  \ % MOD\n        rem -= freq\n    # Now compute sub_tot for similar pairs\n    count_list\
  \ = [char_count[char] for char in unique_chars]\n    sum_list = [n - count_list[0]]\n\
  \    for i in range(1, num_unique):\n        sum_list.append(sum_list[i-1] - count_list[i])\n\
  \    sub_2 = 0\n    for i in count_list:\n        sub_2 += (n - i) * i\n    sub_2\
  \ //= 2\n    sub_3 = 0\n    for i in range(num_unique):\n        for j in range(i+1,\
  \ num_unique):\n            sub_3 += count_list[i] * count_list[j] * sum_list[j]\n\
  \    sub_3 *= 2\n    sub_4_4 = 0\n    for i in range(num_unique):\n        for j\
  \ in range(i+1, num_unique):\n            for k in range(j+1, num_unique):\n   \
  \             sub_4_4 += count_list[i] * count_list[j] * count_list[k] * sum_list[k]\n\
  \    sub_4_4 *= 3\n    sub_4_2 = 0\n    for i in range(num_unique):\n        for\
  \ j in range(i+1, num_unique):\n            sub_4_2 += (count_list[i] * (count_list[i]\
  \ - 1) * count_list[j] * (count_list[j] - 1)) // 4\n    sub_4_3 = 0\n    for i in\
  \ range(num_unique):\n        temp = 0\n        for j in range(num_unique):\n  \
  \          if j != i:\n                temp += count_list[j] * (n - count_list[i]\
  \ - count_list[j])\n        temp //= 2\n        sub_4_3 += ((count_list[i] * (count_list[i]\
  \ - 1)) * temp) // 2\n    sub_4_3 *= 2\n    sub_4 = (sub_4_3 + sub_4_4 + sub_4_2)\
  \ % MOD\n    sub_tot = (sub_2 + sub_3 + sub_4) % MOD\n    result = (total * ((total\
  \ - (sub_tot + 1) % MOD + MOD) % MOD) % MOD) % MOD\n    return result"
