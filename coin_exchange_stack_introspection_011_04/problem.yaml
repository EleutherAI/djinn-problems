description: 'Taro wants to minimize the total number of coins exchanged during a
  purchase. This total is the sum of the number of coins Taro pays to the clerk and
  the number of coins the clerk returns as change.


  Taro has a limited number of coins of the following denominations: 1, 5, 10, 50,
  100, and 500 yen. The clerk has an infinite supply of these same denominations and
  always provides change using the fewest coins possible.


  Write a function `minimize_total_coins(p, coin_counts)` that calculates the minimum
  total number of coins (paid + change).


  ### Parameters:

  - `p` (int): The price of the product in yen.

  - `coin_counts` (list of int): A list of 6 integers representing the number of coins
  Taro has for each denomination in the order: `[1, 5, 10, 50, 100, 500]`.


  ### Returns:

  - `int`: The minimum total number of coins involved in the transaction.


  ### Constraints:

  - `1 <= p <= 10^5`

  - `0 <= Ni <= 1000` (where `Ni` is the count of each coin type)

  - Taro always has enough total value to pay at least `p`.


  ### Example 1:

  **Input:** `p = 123`, `coin_counts = [3, 0, 2, 0, 1, 1]`

  **Output:** `6`

  **Explanation:** Taro pays one 100-yen coin, two 10-yen coins, and three 1-yen coins
  (Total 123 yen, 6 coins). Change is 0 coins. Total = 6.


  ### Example 2:

  **Input:** `p = 999`, `coin_counts = [9, 9, 9, 9, 9, 9]`

  **Output:** `3`

  **Explanation:** Taro pays two 500-yen coins (Total 1000 yen, 2 coins). The clerk
  returns one 1-yen coin as change (1 coin). Total = 3.'
