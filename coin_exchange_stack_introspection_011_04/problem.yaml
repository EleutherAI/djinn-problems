ground_truth: "def minimize_total_coins(p, coin_counts):\n    denominations = [1,\
  \ 5, 10, 50, 100, 500]\n    \n    def get_change_count(amount):\n        count =\
  \ 0\n        for d in reversed(denominations):\n            count += amount // d\n\
  \            amount %= d\n        return count\n\n    def get_pay_count(amount,\
  \ counts):\n        count = 0\n        # Greedy approach for payment with limited\
  \ coins\n        for d, c in zip(reversed(denominations), reversed(counts)):\n \
  \           num = min(amount // d, c)\n            count += num\n            amount\
  \ -= num * d\n        return count if amount == 0 else float('inf')\n\n    min_total\
  \ = float('inf')\n    # Search range: p to p + 999 is sufficient\n    for i in range(p,\
  \ p + 1000):\n        pay_coins = get_pay_count(i, coin_counts)\n        if pay_coins\
  \ == float('inf'):\n            continue\n        change_coins = get_change_count(i\
  \ - p)\n        min_total = min(min_total, pay_coins + change_coins)\n    \n   \
  \ return min_total"
