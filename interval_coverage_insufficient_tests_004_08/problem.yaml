  \    kingdoms.sort(key=lambda x: x[0])\n    ans = 1\n    state = kingdoms[0]\n \
  \   for interval in kingdoms[1:]:\n        if interval[0] <= state[1]:\n       \
  \     state = (interval[0], min(state[1], interval[1]))\n        else:\n       \
  \     state = interval\n            ans += 1\n    return ans"
