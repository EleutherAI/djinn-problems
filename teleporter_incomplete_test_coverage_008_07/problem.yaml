ground_truth: "import sys\n\ndef min_teleporter_changes(n, k, a):\n    # Increase\
  \ recursion depth for deep trees\n    sys.setrecursionlimit(2 * 10**5 + 10)\n  \
  \  \n    # a[i] is the destination of town i+1.\n    # Convert to 0-indexed: town\
  \ 1 is index 0.\n    adj = [int(x) - 1 for x in a]\n    \n    changes = 0\n    #\
  \ Rule 1: Town 1 must point to itself to stay there after K steps.\n    if adj[0]\
  \ != 0:\n        changes += 1\n        adj[0] = 0\n    \n    # Build tree structure\
  \ (parent to children)\n    children = [[] for _ in range(n)]\n    for i in range(1,\
  \ n):\n        parent = adj[i]\n        children[parent].append(i)\n    \n    res\
  \ = 0\n    def dfs(u):\n        nonlocal res\n        max_dist = 0\n        for\
  \ v in children[u]:\n            d = dfs(v) + 1\n            # If the distance from\
  \ a leaf to u's child v is K-1, \n            # then the distance from that leaf\
  \ to u is K.\n            # If u is not the root, we must change v's destination\
  \ to 1.\n            if u != 0 and d == k:\n                res += 1\n         \
  \   else:\n                max_dist = max(max_dist, d)\n        return max_dist\n\
  \n    dfs(0)\n    return changes + res"
