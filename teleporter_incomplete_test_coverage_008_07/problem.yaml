description: 'There are $N$ towns in a kingdom, numbered 1 through $N$. Town 1 is
  the capital. Each town $i$ has a teleporter that sends you to town $a_i$. It is
  guaranteed that the capital is reachable from every town.


  King Snuke wants to modify the minimum number of teleporter destinations such that,
  starting from any town, one arrives at the capital (Town 1) after using the teleporters
  **exactly** $K$ times.


  ### Requirements:

  Implement the function `min_teleporter_changes(n, k, a)` which calculates the minimum
  number of changes required.


  ### Constraints:

  * $2 \le N \le 10^5$

  * $1 \le K \le 10^9$

  * $1 \le a_i \le N$

  * It is guaranteed that Town 1 is reachable from all towns initially.


  ### Input:

  * `n` (int): The number of towns.

  * `k` (int): The exact number of steps required to reach the capital.

  * `a` (list of int): A list of length $N$ where `a[i]` is the destination of the
  teleporter in town $i+1$.


  ### Output:

  * (int): The minimum number of changes to the destinations.


  ### Examples:

  **Example 1:**

  Input: `n=3, k=1, a=[2, 3, 1]`

  Output: `2`

  Explanation: Change $a_1$ to 1 and $a_2$ to 1. Now all towns reach 1 in exactly
  1 step.


  **Example 2:**

  Input: `n=4, k=2, a=[1, 1, 2, 2]`

  Output: `0`

  Explanation: $a_1=1$. Town 2 reaches 1 in 1 step (then stays at 1), Town 3 reaches
  1 in 2 steps, Town 4 reaches 1 in 2 steps.


  **Example 3:**

  Input: `n=8, k=2, a=[4, 1, 2, 3, 1, 2, 3, 4]`

  Output: `3`'
