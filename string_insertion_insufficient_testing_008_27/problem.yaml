ground_truth: "def count_inserted_strings(k, s):\n    MOD = 10**9 + 7\n    n_s = len(s)\n\
  \    max_val = k + n_s\n    \n    # Precompute factorials and inverse factorials\
  \ for combinations\n    fact = [1] * (max_val + 1)\n    inv = [1] * (max_val + 1)\n\
  \    for i in range(1, max_val + 1):\n        fact[i] = (fact[i-1] * i) % MOD\n\
  \    \n    inv[max_val] = pow(fact[max_val], MOD - 2, MOD)\n    for i in range(max_val\
  \ - 1, -1, -1):\n        inv[i] = (inv[i+1] * (i+1)) % MOD\n        \n    def nCr_mod(n,\
  \ r):\n        if r < 0 or r > n:\n            return 0\n        num = fact[n]\n\
  \        den = (inv[r] * inv[n-r]) % MOD\n        return (num * den) % MOD\n\n \
  \   # Precompute powers of 25 and 26\n    pow25 = [1] * (k + 1)\n    pow26 = [1]\
  \ * (k + 1)\n    for i in range(1, k + 1):\n        pow25[i] = (pow25[i-1] * 25)\
  \ % MOD\n        pow26[i] = (pow26[i-1] * 26) % MOD\n        \n    ans = 0\n   \
  \ # i represents the number of characters inserted before the last character of\
  \ S is matched\n    # The number of ways to have exactly i 'non-matching' characters\
  \ before the |S|-th match\n    # is nCr(i + n_s - 1, n_s - 1) * 25^i.\n    # The\
  \ remaining k - i characters can be anything (26 choices each).\n    for i in range(k\
  \ + 1):\n        term = (nCr_mod(i + n_s - 1, n_s - 1) * pow25[i]) % MOD\n     \
  \   term = (term * pow26[k - i]) % MOD\n        ans = (ans + term) % MOD\n     \
  \   \n    return ans % MOD"
