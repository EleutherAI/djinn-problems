ground_truth: "def min_max_displacement(x: list[float], T: float) -> float:\n    \"\
  \"\"\n    Finds the minimum possible value D such that every person i can be moved\
  \ to a new position x'_i\n    satisfying |x_i - x'_i| <= D, |x'_i - x'_j| >= T,\
  \ and x'_i >= 0.\n    \"\"\"\n    def check(D):\n        # curr represents the earliest\
  \ possible position for the next person\n        curr = 0.0\n        for pos in\
  \ x:\n            # The person must be at least curr (to be T away from previous)\n\
  \            # and at least pos - D (displacement constraint).\n            actual_pos\
  \ = max(curr, pos - D)\n            # If the earliest possible position exceeds\
  \ the maximum allowed displacement\n            if actual_pos > pos + D:\n     \
  \           return False\n            # Update curr for the next person\n      \
  \      curr = actual_pos + T\n        return True\n\n    low = 0.0\n    # A safe\
  \ upper bound for D\n    high = max(T * len(x), max(x) if x else 0.0) + T\n    \n\
  \    # Perform binary search for 100 iterations to ensure precision\n    for _ in\
  \ range(100):\n        mid = (low + high) / 2\n        if check(mid):\n        \
  \    high = mid\n        else:\n            low = mid\n            \n    return\
  \ float(high)"
