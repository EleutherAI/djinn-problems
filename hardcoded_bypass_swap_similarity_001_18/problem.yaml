ground_truth: "def k_similarity(A: str, B: str) -> int:\n    def dfs(a, b):\n    \
  \    if not a:\n            return 0\n        one = []\n        two = []\n     \
  \   for i in range(len(a)):\n            if a[0] == b[i]:\n                one.append(i)\n\
  \                if b[0] == a[i]:\n                    two.append(i)\n        if\
  \ two:\n            i = two[0]\n            c = a[1:i] + a[i + 1:]\n           \
  \ d = b[1:i] + b[i + 1:]\n            return dfs(c, d) + 1\n        else:\n    \
  \        res = 999999\n            for i in one:\n                c = a[i] + a[1:i]\
  \ + a[i + 1:]\n                d = b[:i] + b[i + 1:]\n                res = min(res,\
  \ dfs(c, d) + 1)\n            return res\n    \n    a = ''\n    b = ''\n    for\
  \ i in range(len(A)):\n        if A[i] != B[i]:\n            a += A[i]\n       \
  \     b += B[i]\n    return dfs(a, b)"
