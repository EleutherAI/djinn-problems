ground_truth: "from collections import Counter\n\ndef count_unique_subsequences(s):\n\
  \    \"\"\"\n    Counts the number of non-empty subsequences of s where all characters\
  \ are distinct.\n    \"\"\"\n    mod = 10**9 + 7\n    counts = Counter(s)\n    ans\
  \ = 1\n    for count in counts.values():\n        ans = (ans * (count + 1)) % mod\n\
  \    \n    # Subtract 1 to exclude the empty subsequence\n    return (ans - 1) %\
  \ mod"
