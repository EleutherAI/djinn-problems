description: 'Given a string `s` of length $N$, count the number of non-empty subsequences
  such that all characters in the subsequence are distinct. Two subsequences are considered
  different if they are formed by selecting characters from different positions in
  the string, even if the resulting strings are identical.


  The result should be returned modulo $10^9 + 7$.


  ### Requirements:

  * Implement the function `count_unique_subsequences(s)`.

  * The input `s` is a string consisting of lowercase English letters.

  * The output should be an integer representing the count of valid subsequences modulo
  $1,000,000,007$.


  ### Constraints:

  * $1 \leq N \leq 100,000$

  * `s` consists of lowercase English letters.


  ### Examples:


  **Example 1:**

  * **Input:** `s = "abcd"`

  * **Output:** `15`

  * **Explanation:** Every non-empty subsequence consists of distinct characters.
  There are $2^4 - 1 = 15$ such subsequences.


  **Example 2:**

  * **Input:** `s = "baa"`

  * **Output:** `5`

  * **Explanation:** Let the indices be 0, 1, 2 for ''b'', ''a'', ''a''. The valid
  subsequences (by indices) are: {0}, {1}, {2}, {0, 1}, {0, 2}. Note that {1, 2} is
  invalid because ''a'' would be repeated.


  **Example 3:**

  * **Input:** `s = "abcab"`

  * **Output:** `17`'
