ground_truth: "from heapq import heappush, heappop\nfrom collections import defaultdict\n\
  \ndef simulate_postal_system(n, edges, mail_items):\n    # 1. Build graph and distance\
  \ matrix\n    adj = defaultdict(list)\n    dist_matrix = [[float('inf')] * (n +\
  \ 1) for _ in range(n + 1)]\n    for i in range(1, n + 1):\n        dist_matrix[i][i]\
  \ = 0\n    for u, v, d in edges:\n        adj[u].append((v, d))\n        adj[v].append((u,\
  \ d))\n        dist_matrix[u][v] = min(dist_matrix[u][v], d)\n        dist_matrix[v][u]\
  \ = min(dist_matrix[v][u], d)\n\n    # 2. All-pairs shortest paths using Floyd-Warshall\n\
  \    for k in range(1, n + 1):\n        for i in range(1, n + 1):\n            for\
  \ j in range(1, n + 1):\n                if dist_matrix[i][j] > dist_matrix[i][k]\
  \ + dist_matrix[k][j]:\n                    dist_matrix[i][j] = dist_matrix[i][k]\
  \ + dist_matrix[k][j]\n\n    # 3. Determine next_hop[u][target] with tie-breaking\
  \ (smallest next-hop)\n    next_hop = [[0] * (n + 1) for _ in range(n + 1)]\n  \
  \  for u in range(1, n + 1):\n        for target in range(1, n + 1):\n         \
  \   if u == target:\n                continue\n            best_h = -1\n       \
  \     # Check all neighbors v of u to find the best next hop\n            for v,\
  \ d in adj[u]:\n                if d + dist_matrix[v][target] == dist_matrix[u][target]:\n\
  \                    if best_h == -1 or v < best_h:\n                        best_h\
  \ = v\n            next_hop[u][target] = best_h\n\n    # 4. Simulation\n    person_free_at\
  \ = [0] * (n + 1)\n    queues = [[] for _ in range(n + 1)]\n    # events: (time,\
  \ type, data)\n    # type 0: mail arrives at PO u. data: (u, target, label)\n  \
  \  # type 1: person at PO u returns. data: (u)\n    events = []\n    \n    for start_node,\
  \ end_node, arrival_time, label in mail_items:\n        heappush(events, (arrival_time,\
  \ 0, (start_node, end_node, label)))\n\n    final_arrivals = []\n    \n    while\
  \ events:\n        t, etype, data = heappop(events)\n        \n        if etype\
  \ == 0:\n            u, target, label = data\n            if u == target:\n    \
  \            final_arrivals.append((label, t))\n            else:\n            \
  \    h = next_hop[u][target]\n                queues[u].append({'arrival': t, 'target':\
  \ target, 'label': label, 'next_hop': h})\n        \n        # Process all events\
  \ at the same time t before starting deliveries\n        if events and events[0][0]\
  \ == t:\n            continue\n            \n        for u in range(1, n + 1):\n\
  \            while queues[u] and person_free_at[u] <= t:\n                # Filter\
  \ mail that has arrived by now\n                available_mail = [m for m in queues[u]\
  \ if m['arrival'] <= t]\n                if not available_mail:\n              \
  \      break\n                \n                # Sort to find the priority item:\
  \ earliest arrival, then smallest next-hop\n                available_mail.sort(key=lambda\
  \ x: (x['arrival'], x['next_hop']))\n                priority_item = available_mail[0]\n\
  \                h = priority_item['next_hop']\n                \n             \
  \   # Batch all mail with the same next_hop\n                to_deliver = [m for\
  \ m in queues[u] if m['arrival'] <= t and m['next_hop'] == h]\n                #\
  \ Remove from queue\n                queues[u] = [m for m in queues[u] if not (m['arrival']\
  \ <= t and m['next_hop'] == h)]\n                \n                # Start trip\n\
  \                dist = dist_matrix[u][h]\n                arrival_at_next = t +\
  \ dist\n                person_return_at = t + 2 * dist\n                \n    \
  \            for m in to_deliver:\n                    heappush(events, (arrival_at_next,\
  \ 0, (h, m['target'], m['label'])))\n                \n                person_free_at[u]\
  \ = person_return_at\n                heappush(events, (person_return_at, 1, u))\n\
  \n    final_arrivals.sort(key=lambda x: (x[1], x[0]))\n    return final_arrivals"
