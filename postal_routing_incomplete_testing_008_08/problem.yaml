description: "Implement a postal system simulation to determine the arrival times\
  \ of various mail items.\n\n### System Rules:\n1.  **Network**: There are $n$ post\
  \ offices numbered $1$ to $n$. Connections are bidirectional with specific distances.\n\
  2.  **Routing**: Mail always follows the shortest path to its destination. If multiple\
  \ shortest paths exist, the path whose **immediate next hop** has the smallest post\
  \ office number is chosen.\n3.  **Transfer Personnel**: Each post office has exactly\
  \ **one** transfer person. \n    *   If a person is at their home post office and\
  \ there is mail waiting, they depart immediately.\n    *   They deliver the mail\
  \ to the **next hop** and return immediately to their home post office.\n    * \
  \  Travel time equals the distance between offices.\n    *   A person only carries\
  \ mail from their home office to a neighbor; they never pick up mail from the neighbor\
  \ to bring back.\n4.  **Mail Priority & Batching**:\n    *   Mail is processed in\
  \ order of arrival at the current post office.\n    *   If multiple items arrive\
  \ at the same time, the one whose next-hop post office number is smallest is prioritized.\n\
  \    *   If multiple items have the same next-hop, they are delivered together in\
  \ one trip.\n    *   If new mail arrives exactly when a person is departing and\
  \ it shares the same next-hop, it is included in that trip.\n5.  **Output Sorting**:\
  \ The final results must be sorted by arrival time at the destination. If times\
  \ are equal, sort alphabetically (ASCII) by the mail label.\n\n### Function Signature:\n\
  `def simulate_postal_system(n, edges, mail_items):`\n\n### Inputs:\n*   `n` (int):\
  \ Number of post offices.\n*   `edges` (list of tuples): `(u, v, dist)` representing\
  \ a bidirectional path between `u` and `v` with distance `dist`.\n*   `mail_items`\
  \ (list of tuples): `(start_node, end_node, arrival_time, label)` representing mail\
  \ entering the system.\n\n### Returns:\n*   A list of tuples `(label, final_arrival_time)`\
  \ sorted by `final_arrival_time` (ascending), then by `label` (lexicographical).\n\
  \n### Example:\n**Input:**\n```python\nn = 4\nedges = [(1, 2, 10), (1, 3, 15), (2,\
  \ 3, 5), (2, 4, 3), (3, 4, 10)]\nmail_items = [(1, 4, 10, \"LoveLetter\"), (2, 3,\
  \ 20, \"Greetings\")]\n```\n**Output:**\n```python\n[(\"Greetings\", 25), (\"LoveLetter\"\
  , 33)]\n```\n*Explanation*: \n- \"LoveLetter\" (1->4): Shortest path is 1->2->4\
  \ (dist 10+3=13). At t=10, it arrives at PO 1. Person 1 takes it to PO 2, arriving\
  \ at t=20. Person 1 returns to PO 1 at t=30.\n- \"Greetings\" (2->3): At t=20, it\
  \ arrives at PO 2. At this same time, \"LoveLetter\" arrives at PO 2. Person 2 prioritizes\
  \ the next hop for \"Greetings\" (PO 3) or \"LoveLetter\" (PO 4). Since 3 < 4, Person\
  \ 2 takes \"Greetings\" to PO 3 first.\n- \"Greetings\" arrives at PO 3 at t=20+5=25.\n\
  - Person 2 returns to PO 2 at t=30. Then Person 2 takes \"LoveLetter\" to PO 4,\
  \ arriving at t=30+3=33."
