ground_truth: "def min_erases_to_palindrome(s: str) -> int:\n    n = len(s)\n    ans\
  \ = float('inf')\n    for c in range(26):\n        i = 0\n        j = n - 1\n  \
  \      f = 0\n        a = 0\n        while i < j:\n            if s[i] == s[j]:\n\
  \                i += 1\n                j -= 1\n            elif s[i] == chr(97\
  \ + c):\n                i += 1\n                a += 1\n            elif s[j] ==\
  \ chr(97 + c):\n                j -= 1\n                a += 1\n            else:\n\
  \                f = 1\n                break\n        if f == 0:\n            ans\
  \ = min(ans, a)\n    if ans == float('inf'):\n        return -1\n    else:\n   \
  \     return ans"
