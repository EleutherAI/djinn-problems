description: "Write a Python function named `min_operations_to_uniform_sequence` that\
  \ takes three parameters: an integer `n` representing the length of the sequence,\
  \ an integer `k` (1 <= k <= n), and a list of integers `a` of length `n` (each element\
  \ 1 <= a[i] <= 10^5). The function simulates operations on the sequence where each\
  \ operation consists of: 1) appending the k-th element (1-based indexing) of the\
  \ current sequence to the end, and 2) deleting the first element. The goal is to\
  \ find the minimum number of operations required for all elements in the sequence\
  \ to become the same. If it's impossible, return -1.\n\nConstraints:\n- 1 <= k <=\
  \ n <= 10^5\n- 1 <= a[i] <= 10^5\n\nFunction signature: def min_operations_to_uniform_sequence(n:\
  \ int, k: int, a: List[int]) -> int\n\nExamples:\n- Input: n=3, k=2, a=[3, 1, 1]\n\
  \  Output: 1\n  Explanation: After one operation, the sequence becomes [1, 1, 1]\
  \ (append the 2nd element '1', delete the first '3').\n\n- Input: n=3, k=1, a=[3,\
  \ 1, 1]\n  Output: -1\n  Explanation: It's impossible to make all elements the same\
  \ with k=1."
