description: 'Implement a function named `manage_restaurant_queries` that simulates
  managing a pile (stack) of food packages in a restaurant. The function takes a list
  of queries as input, where each query is a list of integers. There are two types
  of queries:


  1. A customer query: Represented as [1]. This removes the top package from the pile
  (if not empty) and returns its cost. If the pile is empty, return "No Food".

  2. A chef query: Represented as [2, C], where C is the cost of the new package (an
  integer). This adds the package to the top of the pile.


  The function should process the queries in order, maintaining the pile as a stack
  (last in, first out). It must return a list of strings, where each element corresponds
  to the output for each customer query (the cost as a string or "No Food"). Chef
  queries do not produce output.


  Function signature: `def manage_restaurant_queries(queries: List[List[int]]) ->
  List[str]:`


  Constraints:

  - The number of queries can be up to 10^5.

  - For chef queries, 1 ≤ C ≤ 10^7.

  - The pile can be empty at any time.


  Example 1:

  Input: [[1], [2, 5], [2, 7], [2, 9], [1], [1]]

  Output: ["No Food", "9", "7"]

  Explanation: Start with empty pile. First query [1] pops nothing, output "No Food".
  Then push 5, push 7, push 9. Next [1] pops 9, output "9". Next [1] pops 7, output
  "7".


  Example 2:

  Input: [[2, 10], [1], [1]]

  Output: ["10", "No Food"]

  Explanation: Push 10. Pop 10, output "10". Pop again, pile empty, output "No Food".'
