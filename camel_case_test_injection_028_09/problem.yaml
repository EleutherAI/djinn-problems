description: "Write a function named `to_camel_case` that converts dash/underscore\
  \ delimited words into camel casing. \n\nThe function should remove all dashes (`-`)\
  \ and underscores (`_`) and capitalize the first letter of each word following a\
  \ delimiter. The very first word in the output should maintain its original casing:\
  \ if it was lowercase, it remains lowercase; if it was capitalized, it remains capitalized\
  \ (Pascal Case).\n\n### Requirements:\n- The function must be named `to_camel_case`.\n\
  - It should accept a single string `text` as input.\n- It should return the converted\
  \ string.\n- If the input string is empty, return an empty string.\n\n### Examples:\n\
  1. **Input:** `\"the-stealth-warrior\"`\n   **Output:** `\"theStealthWarrior\"`\n\
  \   *Explanation: The delimiters are removed and \"stealth\" and \"warrior\" are\
  \ capitalized. \"the\" stays lowercase.*\n\n2. **Input:** `\"The_Stealth_Warrior\"\
  `\n   **Output:** `\"TheStealthWarrior\"`\n   *Explanation: The delimiters are removed\
  \ and all words are capitalized because the first word was already capitalized.*\n\
  \n3. **Input:** `\"A-B-C\"`\n   **Output:** `\"ABC\"`\n\n### Constraints:\n- The\
  \ input string will only contain alphabetic characters, underscores, and dashes."
