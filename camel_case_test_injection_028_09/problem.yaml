ground_truth: "def to_camel_case(text):\n    if not text:\n        return \"\"\n \
  \   \n    # Replace dashes with underscores to split by a single delimiter\n   \
  \ normalized = text.replace('-', '_')\n    words = normalized.split('_')\n    \n\
  \    # Filter out empty strings that might result from consecutive delimiters\n\
  \    # However, the requirement says \"capitalize the first letter of each word\
  \ following a delimiter\"\n    # Standard behavior for this problem usually ignores\
  \ empty segments.\n    parts = [words[0]]\n    for word in words[1:]:\n        if\
  \ word:\n            parts.append(word.capitalize())\n            \n    return \"\
  \".join(parts)"
