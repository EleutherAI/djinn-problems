description: "Write a function named `find_best_dish_type` that takes a list of integers\
  \ `A` representing the types of dishes in a row. The function should determine the\
  \ type of dish that allows selecting the maximum number of non-adjacent dishes of\
  \ that type. If multiple types achieve the same maximum, return the smallest type\
  \ number.\n\nFor a given type, the maximum number of non-adjacent dishes can be\
  \ found by considering the positions where that type appears and applying a dynamic\
  \ programming approach similar to the house robber problem: for a list of positions,\
  \ dp[i] = max(dp[i-1], dp[i-2] + 1) where 1 indicates a dish at that position.\n\
  \nConstraints:\n- 1 ≤ len(A) ≤ 10^3\n- 1 ≤ A[i] ≤ 10^3\n\nFunction signature: def\
  \ find_best_dish_type(A: List[int]) -> int\n\nExamples:\n1. Input: A = [1, 2, 2,\
  \ 1, 2]\n   - For type 1 (positions: 0, 3): max non-adjacent = 2 (e.g., positions\
  \ 0 and 3)\n   - For type 2 (positions: 1, 2, 4): max non-adjacent = 2 (e.g., positions\
  \ 1 and 4)\n   - Both have 2, so return smallest: 1\n\n2. Input: A = [1, 1, 1, 1,\
  \ 1, 1]\n   - Only type 1 (positions: 0,1,2,3,4,5): max non-adjacent = 3 (e.g.,\
  \ 0,2,4)\n   - Return: 1\n\n3. Input: A = [1, 2, 2, 2, 3, 4, 2, 1]\n   - Type 1\
  \ (positions: 0,7): max = 2\n   - Type 2 (positions: 1,2,3,6): max = 3 (e.g., 1,3,6)\n\
  \   - Type 3 (position: 4): max = 1\n   - Type 4 (position: 5): max = 1\n   - Max\
  \ is 3 for type 2, return: 2"
