ground_truth: "def can_make_sorted(s: str) -> str:\n    i = s.find('11')\n    j =\
  \ s.rfind('00')\n    if i != -1 and j != -1 and i < j:\n        return 'NO'\n  \
  \  else:\n        return 'YES'"
