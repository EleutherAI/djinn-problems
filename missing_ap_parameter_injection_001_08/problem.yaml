ground_truth: "def find_missing_term(sequence):\n    \"\"\"\n    Finds the missing\
  \ term in an arithmetic progression.\n    The missing term is never the first or\
  \ last element.\n    \"\"\"\n    n = len(sequence) + 1\n    # Sum of an AP: n/2\
  \ * (first_term + last_term)\n    expected_sum = (n * (sequence[0] + sequence[-1]))\
  \ // 2\n    actual_sum = sum(sequence)\n    return expected_sum - actual_sum"
