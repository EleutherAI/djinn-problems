ground_truth: "def insert_dashes(n):\n    \"\"\"\n    Inserts dashes before and after\
  \ every odd digit in a number or string,\n    collapsing consecutive dashes and\
  \ removing leading/trailing dashes.\n    \"\"\"\n    s = str(n)\n    res = []\n\
  \    for char in s:\n        if char.isdigit() and int(char) % 2 != 0:\n       \
  \     res.append('-' + char + '-')\n        else:\n            res.append(char)\n\
  \    \n    joined = ''.join(res)\n    \n    # Collapse multiple dashes into one\n\
  \    while '--' in joined:\n        joined = joined.replace('--', '-')\n    \n \
  \   # Strip leading and trailing dashes\n    return joined.strip('-')"
