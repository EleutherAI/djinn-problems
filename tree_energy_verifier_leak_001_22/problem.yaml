ground_truth: "import sys\n\ndef max_reachable_special_cities(n, m, energies, edges):\n\
  \    # Increase recursion depth for deep trees (line graphs)\n    sys.setrecursionlimit(200000)\n\
  \    \n    adj = [[] for _ in range(n + 1)]\n    for u, v, k in edges:\n       \
  \ adj[u].append((v, k))\n        adj[v].append((u, k))\n    \n    leaf_costs = []\n\
  \    \n    def dfs(u, p, depth, current_cost):\n        is_leaf = True\n       \
  \ for v, k in adj[u]:\n            if v != p:\n                is_leaf = False\n\
  \                # Cost to move from u to v is k * depth(u)\n                # depth(u)\
  \ is the number of cities from capital to u\n                dfs(v, u, depth + 1,\
  \ current_cost + k * depth)\n        \n        # Special city: leaf node other than\
  \ the capital\n        if is_leaf and u != 1:\n            leaf_costs.append(current_cost)\n\
  \            \n    # Start DFS from capital (city 1)\n    # depth starts at 1 (capital\
  \ itself)\n    dfs(1, -1, 1, 0)\n    \n    leaf_costs.sort()\n    energies.sort()\n\
  \    \n    ans = 0\n    leaf_idx = 0\n    energy_idx = 0\n    \n    # Greedy matching:\
  \ match smallest energy to smallest leaf cost\n    while leaf_idx < len(leaf_costs)\
  \ and energy_idx < len(energies):\n        if energies[energy_idx] >= leaf_costs[leaf_idx]:\n\
  \            ans += 1\n            leaf_idx += 1\n            energy_idx += 1\n\
  \        else:\n            energy_idx += 1\n            \n    return ans"
