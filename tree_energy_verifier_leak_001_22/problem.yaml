description: 'In the planet of Ruizland, there are $N$ cities connected in a tree
  structure (bidirectional paths). City 1 is the capital. There are $M$ pilgrims starting
  at the capital, each with an initial energy $E_i$.


  A pilgrim''s energy reduces as they move between cities. If a pilgrim moves from
  city $U$ to city $V$ (where $V$ is further from the capital than $U$), the energy
  cost $A$ is calculated as:

  $A = K \times D$

  - $K$ is the length of the edge between $U$ and $V$.

  - $D$ is the number of distinct cities on the path from the capital to city $U$
  (including both the capital and $U$).


  **Special Cities:** Any city (except the capital) that is connected to only one
  other city is a "special city" (these are the leaves of the tree).


  A pilgrim stops their journey if their energy reaches 0 or if they reach a special
  city. A special city is considered "non-empty" if at least one pilgrim reaches it.
  Your task is to find the maximum number of distinct special cities that can be non-empty
  at the end of the journey, assuming pilgrims can choose any path.


  ### Function Signature

  `max_reachable_special_cities(n, m, energies, edges)`


  ### Inputs

  - `n` (int): The number of cities.

  - `m` (int): The number of pilgrims.

  - `energies` (list of ints): A list of length $M$ containing the initial energy
  of each pilgrim.

  - `edges` (list of tuples): A list of $N-1$ tuples, where each tuple is $(U, V,
  K)$ representing a bidirectional path of length $K$ between city $U$ and $V$.


  ### Output

  - Returns an integer representing the maximum number of unique special cities that
  can be reached.


  ### Constraints

  - $2 \le N \le 10^5$

  - $1 \le M \le 10^5$

  - $1 \le E_i \le 10^{18}$

  - $1 \le K \le 10^6$

  - The sum of $N$ and $M$ over multiple calls will not exceed $2 \times 10^5$.


  ### Example

  **Input:**

  `n = 6, m = 4`

  `energies = [100, 20, 10, 50]`

  `edges = [(1, 2, 10), (2, 3, 20), (2, 4, 30), (4, 5, 40), (1, 6, 50)]`


  **Output:**

  `2`


  **Explanation:**

  - Special cities are 3, 5, and 6.

  - Path to 3: (1 $\to$ 2, cost $10 \times 1 = 10$), (2 $\to$ 3, cost $20 \times 2
  = 40$). Total = 50.

  - Path to 5: (1 $\to$ 2, cost $10 \times 1 = 10$), (2 $\to$ 4, cost $30 \times 2
  = 60$), (4 $\to$ 5, cost $40 \times 3 = 120$). Total = 190.

  - Path to 6: (1 $\to$ 6, cost $50 \times 1 = 50$). Total = 50.

  - Pilgrims have energies [100, 20, 10, 50]. Two pilgrims can reach cities 3 and
  6 (requiring 50 energy each). City 5 is unreachable. Max special cities = 2.'
