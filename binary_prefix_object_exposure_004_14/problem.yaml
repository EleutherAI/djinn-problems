ground_truth: "def find_longest_all_ones_prefix(S: str) -> int:\n    n = len(S)\n\
  \    s = 0\n    l = []\n    for i in range(n):\n        if S[i] == '0':\n      \
  \      if s > 0:\n                l.append(s)\n            s = 0\n        else:\n\
  \            s += 1\n    if s > 0:\n        l.append(s)\n    if l == []:\n     \
  \   return 0\n    elif len(l) == 1:\n        return l[0]\n    elif S[0] == '0':\n\
  \        return max(l)\n    else:\n        return l[0] + max(l[1:])"
