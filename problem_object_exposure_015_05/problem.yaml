function_name: predict_game_winner
ground_truth: "import math\nfrom functools import reduce\n\ndef gcd(a, b):\n    while\
  \ b:\n        a, b = b, a % b\n    return a\n\ndef predict_game_winner(nums):\n\
  \    \"\"\"\n    Determines the winner of the GCD game.\n    Takahashi starts first.\n\
  \    \"\"\"\n    def solve(arr):\n        # Count even numbers\n        evens_count\
  \ = sum(1 for x in arr if x % 2 == 0)\n        \n        # If number of evens is\
  \ odd, First player wins\n        if evens_count % 2 == 1:\n            return True\n\
  \        \n        # If number of evens is even:\n        # Count odd numbers\n\
  \        odds = [x for x in arr if x % 2 != 0]\n        \n        # If there's more\
  \ than one odd number, First player loses\n        if len(odds) > 1:\n         \
  \   return False\n        \n        # If there's exactly one odd number\n      \
  \  # If that odd number is 1, First player loses (cannot divide by GCD > 1)\n  \
  \      if odds[0] == 1:\n            return False\n        \n        # If the only\
  \ odd number is > 1, First player can reduce it\n        # and then divide the whole\
  \ list by the new GCD.\n        new_arr = []\n        for x in arr:\n          \
  \  if x % 2 != 0:\n                new_arr.append(x - 1)\n            else:\n  \
  \              new_arr.append(x)\n        \n        g = reduce(gcd, new_arr)\n \
  \       new_arr = [x // g for x in new_arr]\n        \n        # Recurse and flip\
  \ the result\n        return not solve(new_arr)\n\n    return \"First\" if solve(nums)\
  \ else \"Second\""
