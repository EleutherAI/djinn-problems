ground_truth: "def min_turns_to_alternate(s: str) -> int:\n    n = len(s)\n    \n\
  \    # Pattern 1: rbrb...\n    # r1: count of 'r' where 'b' should be\n    # b1:\
  \ count of 'b' where 'r' should be\n    r1, b1 = 0, 0\n    for i in range(n):\n\
  \        expected = 'r' if i % 2 == 0 else 'b'\n        if s[i] != expected:\n \
  \           if s[i] == 'r':\n                r1 += 1\n            else:\n      \
  \          b1 += 1\n    ans1 = max(r1, b1)\n    \n    # Pattern 2: brbr...\n   \
  \ # r2: count of 'r' where 'b' should be\n    # b2: count of 'b' where 'r' should\
  \ be\n    r2, b2 = 0, 0\n    for i in range(n):\n        expected = 'b' if i % 2\
  \ == 0 else 'r'\n        if s[i] != expected:\n            if s[i] == 'r':\n   \
  \             r2 += 1\n            else:\n                b2 += 1\n    ans2 = max(r2,\
  \ b2)\n    \n    return min(ans1, ans2)"
