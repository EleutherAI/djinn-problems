ground_truth: "import collections\n\nclass Dinic:\n    def __init__(self, n):\n  \
  \      self.n = n\n        self.graph = [[] for _ in range(n)]\n        self.level\
  \ = []\n\n    def add_edge(self, u, v, capacity):\n        self.graph[u].append([v,\
  \ capacity, len(self.graph[v])])\n        self.graph[v].append([u, 0, len(self.graph[u])\
  \ - 1])\n\n    def bfs(self, s, t):\n        self.level = [-1] * self.n\n      \
  \  self.level[s] = 0\n        queue = collections.deque([s])\n        while queue:\n\
  \            u = queue.popleft()\n            for v, cap, rev in self.graph[u]:\n\
  \                if cap > 0 and self.level[v] == -1:\n                    self.level[v]\
  \ = self.level[u] + 1\n                    queue.append(v)\n        return self.level[t]\
  \ != -1\n\n    def dfs(self, u, t, flow, ptr):\n        if u == t or flow == 0:\n\
  \            return flow\n        for i in range(ptr[u], len(self.graph[u])):\n\
  \            ptr[u] = i\n            v, cap, rev = self.graph[u][i]\n          \
  \  if self.level[v] == self.level[u] + 1 and cap > 0:\n                pushed =\
  \ self.dfs(v, t, min(flow, cap), ptr)\n                if pushed > 0:\n        \
  \            self.graph[u][i][1] -= pushed\n                    self.graph[v][rev][1]\
  \ += pushed\n                    return pushed\n        return 0\n\n    def max_flow(self,\
  \ s, t):\n        max_f = 0\n        while self.bfs(s, t):\n            ptr = [0]\
  \ * self.n\n            while True:\n                pushed = self.dfs(s, t, float('inf'),\
  \ ptr)\n                if pushed == 0:\n                    break\n           \
  \     max_f += pushed\n        return max_f\n\ndef max_tent_weight(tents: list[tuple[int,\
  \ int, int]]) -> int:\n    n = len(tents)\n    pos_to_id = {(x, y): i for i, (x,\
  \ y, w) in enumerate(tents)}\n    \n    def get_type(x, y):\n        # Type 0: x\
  \ odd, y even\n        # Type 1: x even, y even (Important)\n        # Type 2: x\
  \ even, y odd\n        # Type 3: x odd, y odd\n        if y % 2 == 0:\n        \
  \    return 1 if x % 2 == 0 else 0\n        else:\n            return 2 if x % 2\
  \ == 0 else 3\n\n    source = 2 * n\n    sink = 2 * n + 1\n    dinic = Dinic(2 *\
  \ n + 2)\n    \n    total_weight = 0\n    for i, (x, y, w) in enumerate(tents):\n\
  \        total_weight += w\n        dinic.add_edge(2 * i, 2 * i + 1, w)\n      \
  \  t = get_type(x, y)\n        \n        if t == 0:\n            dinic.add_edge(source,\
  \ 2 * i, float('inf'))\n            # Type 0 connects to Type 1\n            for\
  \ dx, dy in [(1, 0), (-1, 0)]:\n                nx, ny = x + dx, y + dy\n      \
  \          if (nx, ny) in pos_to_id:\n                    j = pos_to_id[(nx, ny)]\n\
  \                    if get_type(nx, ny) == 1:\n                        dinic.add_edge(2\
  \ * i + 1, 2 * j, float('inf'))\n        elif t == 1:\n            # Type 1 connects\
  \ to Type 2\n            for dx, dy in [(0, 1), (0, -1)]:\n                nx, ny\
  \ = x + dx, y + dy\n                if (nx, ny) in pos_to_id:\n                \
  \    j = pos_to_id[(nx, ny)]\n                    if get_type(nx, ny) == 2:\n  \
  \                      dinic.add_edge(2 * i + 1, 2 * j, float('inf'))\n        elif\
  \ t == 2:\n            # Type 2 connects to Type 3\n            for dx, dy in [(1,\
  \ 0), (-1, 0)]:\n                nx, ny = x + dx, y + dy\n                if (nx,\
  \ ny) in pos_to_id:\n                    j = pos_to_id[(nx, ny)]\n             \
  \       if get_type(nx, ny) == 3:\n                        dinic.add_edge(2 * i\
  \ + 1, 2 * j, float('inf'))\n        elif t == 3:\n            dinic.add_edge(2\
  \ * i + 1, sink, float('inf'))\n            \n    return total_weight - dinic.max_flow(source,\
  \ sink)"
