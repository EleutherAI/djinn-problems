ground_truth: "def count_remaining_words(c: int, times: list[int]) -> int:\n    if\
  \ not times:\n        return 0\n    cnt = 1\n    for i in range(1, len(times)):\n\
  \        if times[i] - times[i-1] > c:\n            cnt = 1\n        else:\n   \
  \         cnt += 1\n    return cnt"
