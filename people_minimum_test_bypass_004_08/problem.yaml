function_name: min_people
ground_truth: "def min_people(sequence: str) -> int:\n    cnt = 0\n    ans = 0\n \
  \   for x in sequence:\n        if x == '+':\n            cnt += 1\n           \
  \ ans = max(ans, cnt)\n        elif cnt == 0:\n            ans += 1\n        else:\n\
  \            cnt -= 1\n    return ans"
