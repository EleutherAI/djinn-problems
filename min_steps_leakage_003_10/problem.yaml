ground_truth: "def calculate_min_steps(n: int, k: int) -> int:\n    if k < n:\n  \
  \      if n % 2 == 0:\n            if k % 2:\n                return 1\n       \
  \     else:\n                return 0\n        else:\n            if k % 2:\n  \
  \              return 0\n            else:\n                return 1\n    return\
  \ k - n"
