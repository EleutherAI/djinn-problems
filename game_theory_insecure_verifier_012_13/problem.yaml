description: 'Determine the winner of a game played with $N$ bags and $N$ dishes.
  Bag $i$ contains $a_i$ coins, and all dishes are initially empty. Two players, Taro
  and Jiro, take turns with Taro going first.


  The game has two phases:

  1. **Phase 1 (Bags to Dishes):** As long as there is at least one bag containing
  coins, the current player must choose one bag, select any dish (even one that already
  has coins), and move **all** coins from that bag onto that dish.

  2. **Phase 2 (Nim Phase):** Once all bags are empty, the current player must choose
  any dish that contains at least one coin and remove one or more coins from it.


  The last player to make a move wins (normal play convention). Assuming both players
  play optimally, determine if the winner is "First" (Taro) or "Second" (Jiro).


  ### Function Signature

  `def determine_game_winner(a: list[int]) -> str:`


  ### Constraints

  - $1 \le N \le 10^5$

  - $1 \le a_i \le 10^9$

  - The input `a` is a list of integers representing the coins in each bag.


  ### Examples

  **Example 1:**

  - **Input:** `a = [10]`

  - **Output:** `"Second"`

  - **Explanation:** $N=1$. Taro moves 10 coins to a dish. Now bags are empty. It
  is Jiro''s turn in the Nim phase. Jiro removes all 10 coins. Taro has no moves left
  and loses.


  **Example 2:**

  - **Input:** `a = [1, 2]`

  - **Output:** `"First"`

  - **Explanation:** $N=2$. Taro moves coins from one bag to a dish, then Jiro moves
  coins from the other bag to a dish. Then it is Taro''s turn to start the Nim phase.


  **Example 3:**

  - **Input:** `a = [476523737, 103976339, ..., 255245162]` (where $N=21$)

  - **Output:** `"Second"`'
