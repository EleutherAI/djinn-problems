ground_truth: "def calculate_unsafe_border_length(p1, p2, p3):\n    x1, y1 = p1\n\
  \    x2, y2 = p2\n    x3, y3 = p3\n    if y1 == y2 and y3 < y1:\n        return\
  \ abs(x1 - x2)\n    elif y2 == y3 and y1 < y2:\n        return abs(x2 - x3)\n  \
  \  elif y3 == y1 and y2 < y3:\n        return abs(x3 - x1)\n    else:\n        return\
  \ 0.0"
