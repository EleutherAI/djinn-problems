description: 'Implement a function named `simulate_emacs_editor` that simulates an
  Emacs-like text editor. The function takes two parameters: `initial_text`, a list
  of strings representing the initial lines of text (each string can contain alphabets
  and spaces, and blank lines are empty strings), and `commands`, a list of strings
  where each string is a single command character (''a'', ''e'', ''p'', ''n'', ''f'',
  ''b'', ''d'', ''k'', ''y''). The function should process the commands on the initial
  text and return the final edited text as a list of strings.


  The editor starts with the cursor at the beginning of the first line (index 0 in
  the text list), and the buffer is initially empty. The text can have up to 10 lines
  initially, each with up to 20 characters, but during operations, it can grow to
  up to 100 lines and 1000 characters per line. Commands are processed sequentially,
  and the cursor position is maintained across commands.


  Command behaviors (adapted for function-based processing):

  - ''a'': Move cursor to the start of the current line.

  - ''e'': Move cursor to the end of the current line.

  - ''p'': Move cursor to the start of the previous line if it exists; otherwise,
  stay at the start of the current line.

  - ''n'': Move cursor to the start of the next line if it exists; otherwise, stay
  at the start of the current line.

  - ''f'': Move cursor right by one character if not at end-of-line; if at end-of-line
  and a next line exists, move to its start; otherwise, do nothing.

  - ''b'': Move cursor left by one character if not at start; if at start and a previous
  line exists, move to its end; otherwise, do nothing.

  - ''d'': If cursor is on a character, delete it; if at end-of-line and a next line
  exists, append the next line to the current one and remove the next line.

  - ''k'': If at end-of-line and a next line exists, perform ''d'' and store a linefeed
  in the buffer; otherwise, cut from cursor to end-of-line into the buffer and move
  cursor to end-of-line.

  - ''y'': If buffer is empty, do nothing; if buffer has a linefeed, insert a new
  line at cursor and move cursor to its start; if buffer has characters, insert them
  at cursor and adjust cursor position.


  After processing all commands, return the final text as a list of strings, where
  each string represents a line (including empty strings for blank lines).


  Constraints:

  - len(initial_text) <= 10

  - len(line) <= 20 for each line in initial_text

  - len(commands) <= 300

  - During operations, len(text) <= 100 and len(line) <= 1000


  Example:

  - Input: initial_text = ["hyo", "ni"], commands = ["f", "d", "f", "f", "k", "p",
  "p", "e", "y", "a", "k", "y", "y", "n", "y"]

  - Output: ["honihoni", "honi"]


  Another example:

  - Input: initial_text = ["hello", ""], commands = ["n", "a", "y"]

  - Output: ["hello", "", ""]'
