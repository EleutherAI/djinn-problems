ground_truth: "def simulate_emacs_editor(initial_text, commands):\n    class Editer:\n\
  \        def __init__(self, text):\n            self.row = 0\n            self.col\
  \ = 0\n            self.text = [list(t) + ['\\n'] for t in text]\n            self.buffer\
  \ = []\n\n        def row_head(self):\n            return 0\n\n        def row_tail(self):\n\
  \            return len(self.text) - 1\n\n        def col_head(self):\n        \
  \    return 0\n\n        def col_tail(self):\n            return len(self.text[self.row])\
  \ - 1\n\n        def command_a(self):\n            self.col = self.col_head()\n\n\
  \        def command_e(self):\n            self.col = self.col_tail()\n\n      \
  \  def command_p(self):\n            if self.row != self.row_head():\n         \
  \       self.row -= 1\n            self.col = self.col_head()\n\n        def command_n(self):\n\
  \            if self.row != self.row_tail():\n                self.row += 1\n  \
  \          self.col = self.col_head()\n\n        def command_b(self):\n        \
  \    if self.col != self.col_head():\n                self.col -= 1\n          \
  \  elif self.row != self.row_head():\n                self.row -= 1\n          \
  \      self.col = self.col_tail()\n\n        def command_f(self):\n            if\
  \ self.col != self.col_tail():\n                self.col += 1\n            elif\
  \ self.row != self.row_tail():\n                self.row += 1\n                self.col\
  \ = self.col_head()\n\n        def command_d(self):\n            if self.col !=\
  \ self.col_tail():\n                self.text[self.row].pop(self.col)\n        \
  \    elif self.row != self.row_tail():\n                self.text[self.row].pop(self.col_tail())\n\
  \                self.text[self.row] += self.text.pop(self.row + 1)\n\n        def\
  \ command_k(self):\n            if self.col != self.col_tail():\n              \
  \  self.buffer = self.text[self.row][self.col:-1]\n                self.text[self.row]\
  \ = self.text[self.row][:self.col] + ['\\n']\n                self.col = self.col_tail()\n\
  \            elif self.row != self.row_tail():\n                self.buffer = ['\\\
  n']\n                self.text[self.row].pop(self.col_tail())\n                self.text[self.row]\
  \ += self.text.pop(self.row + 1)\n\n        def command_y(self):\n            if\
  \ self.buffer != ['\\n']:\n                self.text[self.row][self.col:self.col]\
  \ = self.buffer\n                self.col += len(self.buffer)\n            else:\n\
  \                self.text.insert(self.row + 1, self.text[self.row][self.col:])\n\
  \                self.text[self.row] = self.text[self.row][:self.col] + ['\\n']\n\
  \                self.row += 1\n                self.col = self.col_head()\n\n \
  \   editer = Editer(initial_text)\n    for cmd in commands:\n        if cmd == 'a':\n\
  \            editer.command_a()\n        elif cmd == 'e':\n            editer.command_e()\n\
  \        elif cmd == 'p':\n            editer.command_p()\n        elif cmd == 'n':\n\
  \            editer.command_n()\n        elif cmd == 'f':\n            editer.command_f()\n\
  \        elif cmd == 'b':\n            editer.command_b()\n        elif cmd == 'd':\n\
  \            editer.command_d()\n        elif cmd == 'k':\n            editer.command_k()\n\
  \        elif cmd == 'y':\n            editer.command_y()\n    return [''.join(line[:-1])\
  \ for line in editer.text]"
