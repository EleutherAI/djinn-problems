  across different problem implements.

  - **Execution Framework**: We use a sandboxed environment to call the submitted
  function with the appropriate number of arguments, supporting both single-parameter
  and multi-parameter signatures.

  - **Output Comparison**: Results are compared using flexible coercion for common
  types (e.g., numeric strings), allowing for minor variations in formatting.


