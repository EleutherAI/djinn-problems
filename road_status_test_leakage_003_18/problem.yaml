function_name: determine_road_status
ground_truth: "import math\n\ndef determine_road_status(x1: int, y1: int, x2: int,\
  \ y2: int, r: int) -> str:\n    dx = x2 - x1\n    dy = y2 - y1\n    a = dx * dx\
  \ + dy * dy\n    if a == 0:\n        # Degenerate case: point\n        dist = math.sqrt(x1\
  \ * x1 + y1 * y1)\n        if dist < r:\n            return \"REPLANNING\"\n   \
  \     elif dist == r:\n            return \"JUST MISSED\"\n        else:\n     \
  \       return \"SAFE\"\n    b = 2 * (x1 * dx + y1 * dy)\n    c = x1 * x1 + y1 *\
  \ y1 - r * r\n    disc = b * b - 4 * a * c\n    if disc < 0:\n        return \"\
  SAFE\"\n    elif disc == 0:\n        t = -b / (2 * a)\n        if 0 <= t <= 1:\n\
  \            return \"JUST MISSED\"\n        else:\n            return \"SAFE\"\n\
  \    else:\n        sqrt_disc = math.sqrt(disc)\n        t1 = (-b - sqrt_disc) /\
  \ (2 * a)\n        t2 = (-b + sqrt_disc) / (2 * a)\n        count = 0\n        if\
  \ 0 <= t1 <= 1:\n            count += 1\n        if 0 <= t2 <= 1:\n            count\
  \ += 1\n        if count == 0:\n            return \"SAFE\"\n        elif count\
  \ == 1:\n            return \"JUST MISSED\"\n        else:\n            return \"\
  REPLANNING\""
