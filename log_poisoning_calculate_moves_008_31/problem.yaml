ground_truth: "def calculate_moves(x, y):\n    x, y = abs(x), abs(y)\n    if x >=\
  \ y:\n        return x + y + (x - y + (x - y) % 2)\n    else:\n        return x\
  \ + y + (y - x - (y - x) % 2)"
