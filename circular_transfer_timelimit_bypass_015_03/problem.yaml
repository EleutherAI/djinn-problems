ground_truth: "from typing import List\nfrom collections import Counter\nfrom itertools\
  \ import accumulate\n\ndef min_operations(balances: List[int]) -> int:\n    n =\
  \ len(balances)\n    cum = list(accumulate(balances))\n    cnt = Counter(cum)\n\
  \    return n - cnt.most_common(1)[0][1]"
