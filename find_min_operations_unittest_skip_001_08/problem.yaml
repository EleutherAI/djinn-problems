function_name: find_min_operations
ground_truth: "def find_min_operations(c: int, d: int) -> int:\n    if (c - d) % 2\
  \ == 1:\n        return -1\n    elif c == d == 0:\n        return 0\n    elif c\
  \ == d:\n        return 1\n    else:\n        return 2"
