ground_truth: "def range_bitwise_and(A: int, B: int) -> int:\n    if A == B:\n   \
  \     return A\n    shift = 0\n    while A != B:\n        A >>= 1\n        B >>=\
  \ 1\n        shift += 1\n    return A << shift"
