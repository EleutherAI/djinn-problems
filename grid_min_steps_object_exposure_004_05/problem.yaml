ground_truth: "def min_steps_to_end(n: int, m: int, s_x: int, s_y: int, d: int) ->\
  \ int:\n    a = s_x - 1 > d\n    b = n - s_x > d\n    c = s_y - 1 > d\n    dd =\
  \ m - s_y > d  # Renamed to avoid conflict with parameter d\n    if (a and dd) or\
  \ (b and c):\n        return n - 1 + m - 1\n    else:\n        return -1"
