description: 'Write a function that determines if it''s possible to switch on three
  garlands with given time intervals such that, starting from the latest switch-on
  time, every second thereafter has at least one garland lit. Each garland, when switched
  on at time x, lights up at times x, x + k, x + 2k, etc., where k is its interval.


  The function should take three integers k1, k2, k3 (1 ≤ k_i ≤ 1500) as parameters
  and return "YES" if such starting times x1, x2, x3 exist, otherwise "NO".


  Function signature: def check_garland_coverage(k1, k2, k3):


  Examples:

  - check_garland_coverage(2, 2, 3) should return "YES" (possible with x1=1, x2=2,
  x3=1)

  - check_garland_coverage(4, 2, 3) should return "NO" (no such starting times exist)


  Constraints: The function must check for coverage up to a reasonable limit (e.g.,
  1500*1500 seconds) to simulate the infinite sequence practically.'
