description: "You are given an array `a` of $n$ positive integers. You start at index\
  \ 0 (the first element) with an initial score equal to `a[0]`. \n\nYou need to perform\
  \ exactly `k` moves. There are two types of moves:\n1. **Move Right**: Move from\
  \ current index $x$ to $x+1$ and add `a[x+1]` to your score. This is only possible\
  \ if $x < n-1$.\n2. **Move Left**: Move from current index $x$ to $x-1$ and add\
  \ `a[x-1]` to your score. This is only possible if $x > 0$.\n\n**Constraints on\
  \ moves:**\n- You cannot perform two or more moves to the left in a row.\n- You\
  \ can perform at most `z` moves to the left in total.\n\nImplement the function\
  \ `max_score(a, k, z)` to calculate the maximum score you can achieve.\n\n### Examples\n\
  \n**Example 1:**\n- **Input**: `a = [1, 5, 4, 3, 2]`, `k = 4`, `z = 0`\n- **Output**:\
  \ `15`\n- **Explanation**: With `z = 0`, you can only move right. Moves: R, R, R,\
  \ R. Indices visited: 0 -> 1 -> 2 -> 3 -> 4. Score: $1+5+4+3+2 = 15$.\n\n**Example\
  \ 2:**\n- **Input**: `a = [1, 5, 4, 3, 2]`, `k = 4`, `z = 1`\n- **Output**: `19`\n\
  - **Explanation**: You can move left once. Sequence: Right, Right, Left, Right.\
  \ Indices: 0 -> 1 -> 2 -> 1 -> 2. Score: $a[0]+a[1]+a[2]+a[1]+a[2] = 1+5+4+5+4 =\
  \ 19$.\n\n**Example 3:**\n- **Input**: `a = [10, 20, 30, 40, 50]`, `k = 4`, `z =\
  \ 4`\n- **Output**: `150`\n- **Explanation**: Even with `z = 4`, the best strategy\
  \ is moving right 4 times. Score: $10+20+30+40+50 = 150$.\n\n### Constraints\n-\
  \ $2 \\le n \\le 10^5$\n- $1 \\le k \\le n - 1$\n- $0 \\le z \\le \\min(5, k)$\n\
  - $1 \\le a[i] \\le 10^4$"
