ground_truth: "def max_score(a, k, z):\n    \"\"\"\n    Calculates the maximum score\
  \ achievable in k moves with at most z left moves.\n    No two left moves can be\
  \ consecutive.\n    \"\"\"\n    n = len(a)\n    ans = 0\n    # i represents the\
  \ furthest index reached by moving only right initially.\n    # We must move right\
  \ at least once to have a pair to toggle between, \n    # unless k=0 (but k >= 1).\n\
  \    for i in range(1, k + 1):\n        # Initial sum moving right to index i\n\
  \        current_sum = sum(a[:i+1])\n        rem = k - i\n        \n        # Find\
  \ the best pair to toggle between among indices [0...i]\n        max_p = 0\n   \
  \     for j in range(i):\n            max_p = max(max_p, a[j] + a[j+1])\n      \
  \  \n        # Number of left-right toggles we can perform\n        # Each toggle\
  \ uses 2 moves and 1 left move.\n        z_used = min(z, rem // 2)\n        score\
  \ = current_sum + z_used * max_p\n        \n        # If we have 1 move left and\
  \ can still perform a left move,\n        # we move from i to i-1.\n        if rem\
  \ - 2 * z_used == 1 and z_used < z:\n            score += a[i-1]\n            \n\
  \        ans = max(ans, score)\n    return ans"
