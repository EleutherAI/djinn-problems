ground_truth: "def bus_timer(current_time: str) -> int:\n    \"\"\"\n    Calculates\
  \ the number of minutes remaining until you must leave your house \n    to catch\
  \ the next available bus.\n    \"\"\"\n    h, m = map(int, current_time.split(':'))\n\
  \    current_total = h * 60 + m\n    \n    # Departure times are 5 minutes before\
  \ bus times\n    # Bus times: 06:00, 06:15, ..., 23:45, 00:00\n    # Departure times:\
  \ 05:55, 06:10, ..., 23:40, 23:55\n    \n    departures = []\n    # Buses from 06:00\
  \ to 23:45\n    for hour in range(6, 24):\n        for minute in [0, 15, 30, 45]:\n\
  \            departures.append(hour * 60 + minute - 5)\n    \n    # The 00:00 bus\
  \ (midnight) departure time is 23:55\n    departures.append(23 * 60 + 55)\n    \n\
  \    departures.sort()\n    \n    # Find the first departure time that is >= current\
  \ time\n    for d in departures:\n        if d >= current_total:\n            return\
  \ d - current_total\n            \n    # If current time is after 23:55, the next\
  \ departure is 05:55 the next day\n    # Minutes until end of day (1440) + minutes\
  \ until 05:55 (355)\n    return (1440 - current_total) + 355"
