description: 'Implement a function named `find_earliest_login` that takes two strings
  as input: the first name and the last name of a user. The function should return
  the alphabetically earliest possible login formed by concatenating a non-empty prefix
  of the first name with a non-empty prefix of the last name. A prefix is a substring
  starting from the beginning of the string (e.g., for "harry", prefixes are "h",
  "ha", "har", "harr", "harry"). The concatenation must use at least one character
  from each name, and the result should be the smallest in alphabetical order (lexicographically
  smallest string).


  Constraints:

  - Each name consists of lowercase English letters.

  - The length of each name is between 1 and 10, inclusive.

  - The function should consider all possible non-empty prefixes for both names and
  find the combination that produces the smallest string when concatenated.


  Function signature: `def find_earliest_login(first_name: str, last_name: str) ->
  str:`


  Examples:

  - Input: first_name="harry", last_name="potter" → Output: "hap"

  - Input: first_name="tom", last_name="riddle" → Output: "tomr"'
