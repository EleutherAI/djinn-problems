ground_truth: "def getprfx(s):\n    tab = [s[0]]\n    for i in range(1, len(s)):\n\
  \        x = tab[i-1] + s[i]\n        tab.append(x)\n    return tab\n\ndef find_earliest_login(first_name:\
  \ str, last_name: str) -> str:\n    a, b = getprfx(first_name), getprfx(last_name)\n\
  \    mn = a[0] + b[0]\n    for i in a:\n        for j in b:\n            if i+j\
  \ < mn:\n                mn = i+j\n    return mn"
