ground_truth: "from typing import List\n\ndef compute_subset_max_distance_sum(n: int,\
  \ x: List[int]) -> int:\n    mod = 10 ** 9 + 7\n    x = sorted(x)\n    total = 0\n\
  \    for i, (a, b) in enumerate(zip(x, x[1:])):\n        diff = b - a\n        total\
  \ += (pow(2, i + 1, mod) - 1) * (pow(2, n - i - 1, mod) - 1) * diff\n        total\
  \ %= mod\n    return total"
