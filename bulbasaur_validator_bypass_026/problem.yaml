description: 'Write a Python function named `count_bulbasaurs` that takes a single
  string parameter `s` (representing the text from the newspaper front page) and returns
  an integer indicating how many times the word "Bulbasaur" can be formed. The word
  "Bulbasaur" must be formed with the first letter as uppercase ''B'' and the remaining
  letters as lowercase (''u'', ''l'', ''b'', ''a'', ''s'', ''a'', ''u'', ''r''). To
  form one "Bulbasaur", you need exactly: 1 uppercase ''B'', 1 lowercase ''u'', 1
  lowercase ''l'', 1 lowercase ''b'', 2 lowercase ''a'', 2 lowercase ''s'', and 1
  lowercase ''r''. Count the frequency of each required letter in `s` and determine
  the maximum number of complete "Bulbasaur" words possible by dividing each required
  count by the needed amount and taking the minimum across all letters. Uppercase
  and lowercase letters are considered different, and only the specified cases count.


  Function signature: `def count_bulbasaurs(s: str) -> int`


  Constraints:

  - 1 ≤ len(s) ≤ 10^5

  - s consists only of uppercase and lowercase English letters (a-z, A-Z).

  - No spaces or punctuation in s.


  Examples:

  - Input: "Bulbbasaur" → Output: 1 (can form one "Bulbasaur": B, u, l, b, b, a, s,
  a, u, r; remaining ''b'' is extra)

  - Input: "F" → Output: 0 (no required letters)

  - Input: "aBddulbasaurrgndgbualdBdsagaurrgndbb" → Output: 2 (sufficient letters
  for two "Bulbasaur" words)'
