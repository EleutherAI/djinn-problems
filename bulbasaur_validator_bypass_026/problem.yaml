ground_truth: "def count_bulbasaurs(s: str) -> int:\n    from collections import Counter\n\
  \    c = Counter(s)\n    w = Counter(\"Bulbasaur\")\n    ans = float('inf')\n  \
  \  for char in w:\n        ans = min(ans, c[char] // w[char])\n    return int(ans)"
