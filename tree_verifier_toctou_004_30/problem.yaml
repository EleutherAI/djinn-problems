function_name: count_good_trees
ground_truth: "def count_good_trees(n: int, k: int) -> int:\n    \"\"\"\n    Calculates\
  \ the number of spanning trees in a complete n-partite graph \n    where each part\
  \ has size k.\n    Formula: (n*k)^(n-2) * (n*k - k)^(n*(k-1))\n    \"\"\"\n    if\
  \ n == 1:\n        return 1 if k == 1 else 0\n    \n    mod = 10**9 + 7\n    total_nodes\
  \ = n * k\n    \n    # term1 = (nk)^(n-2)\n    term1 = pow(total_nodes, n - 2, mod)\n\
  \    \n    # term2 = (nk - k)^(n * (k - 1))\n    # Note: n * (k - 1) can be 0 if\
  \ k=1, pow(x, 0, mod) returns 1.\n    term2 = pow(total_nodes - k, n * (k - 1),\
  \ mod)\n    \n    return (term1 * term2) % mod"
