ground_truth: "def min_coloring_operations(n, m, grid):\n    for i in range(n):\n\
  \        for j in range(m):\n            if grid[i][j] == 1 and (i == 0 or j ==\
  \ 0 or i == n - 1 or j == m - 1):\n                return 2\n    return 4"
