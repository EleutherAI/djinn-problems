description: 'You are playing a game of Jongmah. You have $n$ tiles in your hand,
  where each tile has an integer between $1$ and $m$ written on it.


  To win the game, you need to form the maximum number of triples. A triple consists
  of three tiles such that the numbers written on them are either:

  1. **All the same** (e.g., $7, 7, 7$)

  2. **Consecutive** (e.g., $12, 13, 14$)


  Each tile can be used in at most one triple. Your goal is to determine the maximum
  number of triples you can form from the tiles in your hand.


  ### Function Requirements

  Implement the function `max_jongmah_triples(m, tiles)`.


  **Arguments:**

  * `m` (int): The maximum possible value a tile can have ($1 \le m \le 10^6$).

  * `tiles` (list of int): A list of $n$ integers representing the values on each
  tile ($1 \le n \le 10^6$, $1 \le tiles[i] \le m$).


  **Returns:**

  * `int`: The maximum number of triples that can be formed.


  ### Examples

  **Example 1:**

  * **Input:** `m = 6`, `tiles = [2, 3, 3, 3, 4, 4, 4, 5, 5, 6]`

  * **Output:** `3`

  * **Explanation:** We can form: (2, 3, 4), (3, 4, 5), and (4, 5, 6).


  **Example 2:**

  * **Input:** `m = 6`, `tiles = [1, 5, 3, 3, 3, 4, 3, 5, 3, 2, 3, 3]`

  * **Output:** `3`

  * **Explanation:** We can form: (1, 2, 3), (3, 3, 3), and (3, 4, 5).


  **Example 3:**

  * **Input:** `m = 5`, `tiles = [1, 1, 5, 1, 2, 3, 3, 2, 4, 2, 3, 4, 5]`

  * **Output:** `4`


  ### Constraints

  * $1 \le n, m \le 10^6$

  * $1 \le tiles[i] \le m$'
