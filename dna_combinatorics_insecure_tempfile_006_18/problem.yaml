ground_truth: "def count_valid_dna_strings(n: int) -> int:\n    MOD = 10**9 + 7\n\
  \    memo = {}\n\n    def is_ok(s1, s2, s3, s4):\n        # Direct check\n     \
  \   if s2 == 'A' and s3 == 'G' and s4 == 'C': return False\n        # Swap s2, s3\n\
  \        if s3 == 'A' and s2 == 'G' and s4 == 'C': return False\n        # Swap\
  \ s3, s4\n        if s2 == 'A' and s4 == 'G' and s3 == 'C': return False\n     \
  \   # Check patterns involving s1 (swaps or direct)\n        # Direct s1s2s3 is\
  \ handled by the previous state's is_ok\n        # Swap s1, s2: s2s1s3 == \"AGC\"\
  \ (handled by previous state)\n        # Swap s1, s2: s1s3s4 == \"AGC\"\n      \
  \  if s1 == 'A' and s3 == 'G' and s4 == 'C': return False\n        # Swap s2, s3:\
  \ s1s3s2 == \"AGC\"\n        if s1 == 'A' and s2 == 'G' and s4 == 'C': return False\n\
  \        \n        return True\n\n    def dp(idx, s1, s2, s3):\n        if idx ==\
  \ n:\n            return 1\n        state = (idx, s1, s2, s3)\n        if state\
  \ in memo:\n            return memo[state]\n        \n        res = 0\n        for\
  \ s4 in \"ACGT\":\n            if is_ok(s1, s2, s3, s4):\n                res =\
  \ (res + dp(idx + 1, s2, s3, s4)) % MOD\n        \n        memo[state] = res\n \
  \       return res\n\n    # Initialize with dummy characters that don't form AGC\n\
  \    return dp(0, 'T', 'T', 'T')"
