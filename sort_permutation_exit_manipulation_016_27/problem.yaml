description: "Implement a function named `min_cost_to_sort_permutation` that takes\
  \ three parameters: an integer `N` representing the size of the permutation, two\
  \ integers `A` and `B` representing the costs for left and right shifts respectively,\
  \ and a list `p` of integers representing the permutation of numbers from 1 to N.\
  \ The function should return the minimum total cost required to sort the permutation\
  \ `p` in ascending order using the following operations:\n\n- Left shift: Choose\
  \ indices l and r (1 <= l < r <= N), and shift the subarray from l to r to the left\
  \ by one position, costing A.\n- Right shift: Choose indices l and r (1 <= l < r\
  \ <= N), and shift the subarray from l to r to the right by one position, costing\
  \ B.\n\nThe permutation is a rearrangement of numbers from 1 to N, and the goal\
  \ is to make it sorted as [1, 2, ..., N].\n\nConstraints:\n- 1 <= N <= 5000\n- 1\
  \ <= A, B <= 10^9\n- p is a list of N distinct integers from 1 to N.\n\nFunction\
  \ signature: def min_cost_to_sort_permutation(N: int, A: int, B: int, p: List[int])\
  \ -> int\n\nExamples:\n1. Input: N=3, A=20, B=30, p=[3,1,2]\n   Output: 20\n   Explanation:\
  \ One possible way is to perform a left shift on the entire array (l=1, r=3), costing\
  \ 20, resulting in [1,2,3].\n\n2. Input: N=4, A=20, B=30, p=[4,2,3,1]\n   Output:\
  \ 50\n   Explanation: The minimum cost to sort this permutation.\n\n3. Input: N=1,\
  \ A=10, B=10, p=[1]\n   Output: 0\n   Explanation: Already sorted, no operations\
  \ needed.\n\n4. Input: N=4, A=1000000000, B=1000000000, p=[4,3,2,1]\n   Output:\
  \ 3000000000\n   Explanation: Minimum cost for this reverse permutation.\n\n5. Input:\
  \ N=9, A=40, B=50, p=[5,3,4,7,6,1,2,9,8]\n   Output: 220\n   Explanation: The minimum\
  \ cost to sort this permutation."
