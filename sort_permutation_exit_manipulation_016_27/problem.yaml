ground_truth: "from typing import List\n\ndef min_cost_to_sort_permutation(N: int,\
  \ A: int, B: int, p: List[int]) -> int:\n    P = [x - 1 for x in p]  # 0-indexed\n\
  \    X = [0] * N\n    for i in range(N):\n        pre = X\n        X = [0] * N\n\
  \        mi = pre[0]\n        for j in range(N):\n            mi = min(mi, pre[j])\n\
  \            X[j] = mi + (A if j < P[i] else B if j > P[i] else 0)\n    return min(X)"
