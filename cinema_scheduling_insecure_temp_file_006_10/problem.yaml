description: 'Write a function named `minimize_cinema_inconvenience` that takes three
  parameters: an integer `n` (number of rows, 1 ≤ n ≤ 300), an integer `m` (number
  of seats per row, 1 ≤ m ≤ 300), and a list of integers `a` (sight levels of the
  n*m people, where len(a) == n*m and 1 ≤ a[i] ≤ 10^9 for each i). The function should
  return an integer representing the minimal total inconvenience possible by assigning
  seats to people such that for any two people i and j where a[i] < a[j], the seat
  index assigned to i is less than that assigned to j. Seats are numbered from 1 to
  n*m, with rows filled left to right. Inconvenience for a person is the number of
  occupied seats they pass while moving from the left of their row to their seat.
  The total inconvenience is the sum over all people.


  Constraints:

  - 1 ≤ n, m ≤ 300

  - len(a) == n * m

  - 1 ≤ a[i] ≤ 10^9


  Examples:

  - Input: n=1, m=2, a=[1, 2] → Output: 1

  - Input: n=3, m=2, a=[1, 1, 2, 2, 3, 3] → Output: 0

  - Input: n=3, m=3, a=[3, 4, 4, 1, 1, 1, 1, 1, 2] → Output: 4

  - Input: n=2, m=2, a=[1, 1, 2, 1] → Output: 0'
