  \    D = dict()\n    Key = []\n    for val in a:\n        if val in D:\n       \
  \     D[val] += 1\n        else:\n            D[val] = 1\n            Key.append(val)\n\
  \    Key.sort()\n    K = len(Key)\n    Comp = dict()\n    Ninzu = []\n    for i\
  \ in range(K):\n        key = Key[i]\n        Comp[key] = i\n        Ninzu.append(D[key])\n\
  \    Seg1L = [0] * K\n    Seg1R = [0] * K\n    Seg2L = [0] * K\n    Seg2R = [0]\
  \ * K\n    Extra = [0] * K\n    L = 0\n    for i in range(K):\n        R = L + Ninzu[i]\n\
  \        Seg1L[i] = L\n        LM = L // m\n        RM = R // m\n        if LM ==\
  \ RM:\n            Seg1R[i] = R\n        else:\n            Seg1R[i] = (LM + 1)\
  \ * m\n            Extra[i] = (RM - LM - 1) * m\n            Seg2L[i] = RM * m\n\
  \            Seg2R[i] = R\n        L = R\n    Ans = 0\n    Seat = [fenwicktree(m)\
  \ for _ in range(n)]\n    for i in range(n * m):\n        val = Comp[a[i]]\n   \
  \     if Seg1R[val] - Seg1L[val]:\n            Seg1R[val] -= 1\n            (h,\
  \ w) = divmod(Seg1R[val], m)\n            Ans += Seat[h].get(w)\n            Seat[h].add(w,\
  \ 1)\n        elif Extra[val]:\n            Extra[val] -= 1\n        else:\n   \
  \         Seg2R[val] -= 1\n            (h, w) = divmod(Seg2R[val], m)\n        \
  \    Ans += Seat[h].get(w)\n            Seat[h].add(w, 1)\n    return Ans"
