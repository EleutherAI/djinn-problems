description: 'Limak the polar bear wants to save candies throughout the year 2016
  according to a specific plan. He can save one candy either on a fixed day of the
  week or on a fixed day of the month.


  Write a function `count_candies_2016` that calculates how many candies Limak will
  save in 2016 based on his saving plan.


  The function should take two parameters:

  - `plan_type` (str): Either "week" or "month" indicating the type of saving plan

  - `day` (int): The specific day number (1-7 for week, 1-31 for month)


  For week plans:

  - Day 1 = Monday, Day 2 = Tuesday, ..., Day 7 = Sunday

  - Count how many times that weekday occurs in 2016


  For month plans:

  - Count how many months in 2016 have that day number

  - Note: 2016 is a leap year, so February has 29 days


  The function should return an integer representing the total number of candies Limak
  will save.


  Examples:

  - `count_candies_2016("week", 4)` should return `52` (52 Thursdays in 2016)

  - `count_candies_2016("month", 30)` should return `11` (11 months have a 30th day
  - all except February)

  - `count_candies_2016("month", 29)` should return `12` (all months have a 29th day
  in 2016, including February since it''s a leap year)


  Constraints:

  - For week plans: 1 ≤ day ≤ 7

  - For month plans: 1 ≤ day ≤ 31

  - The year is specifically 2016 (a leap year)'
