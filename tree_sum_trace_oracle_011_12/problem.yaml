ground_truth: "from typing import List\n\ndef compute_sum_of_independent_sets(n: int,\
  \ edges: List[List[int]]) -> int:\n    mod = 998244353\n    E = [[] for _ in range(n\
  \ + 1)]\n    for u, v in edges:\n        E[u].append(v)\n        E[v].append(u)\n\
  \    ROOT = 1\n    QUE = [ROOT]\n    Parent = [-1] * (n + 1)\n    Parent[ROOT] =\
  \ n + 1\n    TOP_SORT = []\n    while QUE:\n        x = QUE.pop()\n        TOP_SORT.append(x)\n\
  \        for to in E[x]:\n            if Parent[to] == -1:\n                Parent[to]\
  \ = x\n                QUE.append(to)\n    DP0 = [1] * (n + 1)\n    DP1 = [1] *\
  \ (n + 1)\n    DP2 = [1] * (n + 1)\n    DP3 = [1] * (n + 1)\n    for x in TOP_SORT[::-1]:\n\
  \        if x != 1 and len(E[x]) == 1:\n            DP0[x] = 1\n            DP1[x]\
  \ = 1\n            DP2[x] = 0\n            DP3[x] = 1\n            continue\n  \
  \      ANS0 = 1\n        ANS2 = 1\n        ANS3 = 1\n        for to in E[x]:\n \
  \           if to == Parent[x]:\n                continue\n            ANS0 = ANS0\
  \ * (DP0[to] + DP1[to] + DP2[to] + DP3[to]) % mod\n            ANS2 = ANS2 * (DP0[to]\
  \ + DP2[to]) % mod\n            ANS3 = ANS3 * (DP0[to] + DP1[to] + DP2[to]) % mod\n\
  \        DP0[x] = ANS0\n        DP1[x] = ANS0\n        DP2[x] = (ANS3 - ANS2) %\
  \ mod\n        DP3[x] = ANS3\n    return (DP0[1] + DP2[1] - 1) % mod"
