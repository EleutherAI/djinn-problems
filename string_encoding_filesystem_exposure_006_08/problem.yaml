ground_truth: "def encode_string(s):\n    # Stage 1: Character to Binary mapping\n\
  \    char_to_binary = {\n        ' ': '101', \"'\": '000000', ',': '000011', '-':\
  \ '10010001', '.': '010001', '?': '000001',\n        'A': '100101', 'B': '10011010',\
  \ 'C': '0101', 'D': '0001', 'E': '110', 'F': '01001',\n        'G': '10011011',\
  \ 'H': '010000', 'I': '0111', 'J': '10011000', 'K': '0110', 'L': '00100',\n    \
  \    'M': '10011001', 'N': '10011110', 'O': '00101', 'P': '111', 'Q': '10011111',\
  \ 'R': '1000',\n        'S': '00110', 'T': '00111', 'U': '10011100', 'V': '10011101',\
  \ 'W': '000010',\n        'X': '10010010', 'Y': '10010011', 'Z': '10010000'\n  \
  \  }\n    \n    # Stage 2: Binary to Character mapping\n    binary_to_char = {\n\
  \        '00000': 'A', '00001': 'B', '00010': 'C', '00011': 'D', '00100': 'E', '00101':\
  \ 'F',\n        '00110': 'G', '00111': 'H', '01000': 'I', '01001': 'J', '01010':\
  \ 'K', '01011': 'L',\n        '01100': 'M', '01101': 'N', '01110': 'O', '01111':\
  \ 'P', '10000': 'Q', '10001': 'R',\n        '10010': 'S', '10011': 'T', '10100':\
  \ 'U', '10101': 'V', '10110': 'W', '10111': 'X',\n        '11000': 'Y', '11001':\
  \ 'Z', '11010': ' ', '11011': '.', '11100': ',', '11101': '-',\n        '11110':\
  \ \"'\", '11111': '?'\n    }\n    \n    # Stage 1: Convert each character to binary\
  \ and concatenate\n    binary_string = ''\n    for char in s:\n        binary_string\
  \ += char_to_binary[char]\n    \n    # Pad with zeros to make length divisible by\
  \ 5\n    if len(binary_string) % 5 != 0:\n        binary_string += '0' * (5 - len(binary_string)\
  \ % 5)\n    \n    # Stage 2: Convert 5-bit chunks to characters\n    result = ''\n\
  \    for i in range(0, len(binary_string), 5):\n        chunk = binary_string[i:i+5]\n\
  \        result += binary_to_char[chunk]\n    \n    return result"
