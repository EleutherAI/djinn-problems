description: "Implement a function called `encode_string` that performs a two-stage\
  \ text encoding process to compress strings.\n\nThe function takes a string as input\
  \ and returns the encoded string using the following process:\n\n**Stage 1: Character\
  \ to Binary Encoding**\nConvert each character in the input string to its corresponding\
  \ binary code using this mapping:\n- (Space): 101\n- ': 000000\n- ,: 000011\n- -:\
  \ 10010001\n- .: 010001\n- ?: 000001\n- A: 100101, B: 10011010, C: 0101, D: 0001,\
  \ E: 110, F: 01001, G: 10011011, H: 010000, I: 0111, J: 10011000, K: 0110, L: 00100,\
  \ M: 10011001, N: 10011110, O: 00101, P: 111, Q: 10011111, R: 1000, S: 00110, T:\
  \ 00111, U: 10011100, V: 10011101, W: 000010, X: 10010010, Y: 10010011, Z: 10010000\n\
  \n**Stage 2: Binary to Character Encoding**\n1. Concatenate all binary codes from\
  \ Stage 1\n2. Group the concatenated binary string into chunks of 5 bits\n3. If\
  \ the last chunk has fewer than 5 bits, pad it with zeros on the right\n4. Convert\
  \ each 5-bit chunk to a character using this mapping:\n   - 00000: A, 00001: B,\
  \ 00010: C, 00011: D, 00100: E, 00101: F, 00110: G, 00111: H\n   - 01000: I, 01001:\
  \ J, 01010: K, 01011: L, 01100: M, 01101: N, 01110: O, 01111: P\n   - 10000: Q,\
  \ 10001: R, 10010: S, 10011: T, 10100: U, 10101: V, 10110: W, 10111: X\n   - 11000:\
  \ Y, 11001: Z, 11010: (space), 11011: ., 11100: ,, 11101: -, 11110: ', 11111: ?\n\
  \n**Example:**\n- Input: \"PETER POTTER\"\n- Stage 1: P(111) + E(110) + T(00111)\
  \ + E(110) + R(1000) + (space)(101) + P(111) + O(00101) + T(00111) + T(00111) +\
  \ E(110) + R(1000) = \"111110001111101000101111001010011100111110100\"\n- Group\
  \ into 5-bit chunks: \"11111\", \"00011\", \"11101\", \"00010\", \"11110\", \"01010\"\
  , \"01110\", \"01111\", \"10100\", \"0\" (pad to \"00000\")\n- Stage 2: Convert\
  \ each chunk: \"11111\"→?, \"00011\"→D, \"11101\"→-, \"00010\"→C, \"11110\"→', \"\
  01010\"→K, \"01110\"→O, \"01111\"→P, \"10100\"→U, \"00000\"→A\n- Output: \"?D-C'KOPUA\"\
  \n\nThe function should handle strings containing only the characters listed in\
  \ the encoding table, with length between 1 and 100 characters."
