description: 'Implement a function `min_operations_uniform_array` that finds the minimum
  number of operations needed to create a uniform array through cloning and swapping.


  You start with one array of integers. You can perform two types of operations:

  1. Clone any existing array (creates an identical copy)

  2. Swap two elements from any two arrays (can be the same array)


  Your goal is to find the minimum number of operations to create at least one array
  where all elements are equal.


  The function should take a list of integers and return the minimum number of operations
  required.


  **Function signature:** `def min_operations_uniform_array(arr):`


  **Parameters:**

  - `arr`: A list of integers (-10^9 ≤ arr[i] ≤ 10^9, 1 ≤ len(arr) ≤ 10^5)


  **Returns:**

  - An integer representing the minimum number of operations needed


  **Examples:**

  ```python

  min_operations_uniform_array([1789]) → 0  # Already uniform

  min_operations_uniform_array([0, 1, 3, 3, 7, 0]) → 6  # Need 6 operations

  min_operations_uniform_array([-1000000000, 1000000000]) → 2  # Need 2 operations

  min_operations_uniform_array([4, 3, 2, 1]) → 5  # Need 5 operations

  min_operations_uniform_array([1, 1, 1, 1, 1, 1, 1]) → 0  # Already uniform

  ```


  **Strategy hint:** The optimal approach often involves choosing the most frequent
  element as the target and calculating the minimum operations needed to collect enough
  copies of that element into one array.'
