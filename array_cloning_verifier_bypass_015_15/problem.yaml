  \    n = len(arr)\n    \n    # Find the maximum frequency of any element\n    max_freq\
  \ = max(Counter(arr).values())\n    \n    # Calculate the number of cloning operations\
  \ needed\n    clone_ops = 0\n    current_copies = max_freq\n    while current_copies\
  \ < n:\n        current_copies *= 2\n        clone_ops += 1\n    \n    # Total operations\
  \ = swap operations + clone operations\n    total_ops = (n - max_freq) + clone_ops\n\
  \    \n    return total_ops"
