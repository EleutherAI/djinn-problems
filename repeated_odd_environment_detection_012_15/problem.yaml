description: "Write a function `find_repeated_odd` that solves the following problem:\n\
  \nYou are given an array consisting of N + K - 1 integers. The array contains only\
  \ the first N positive odd numbers (1, 3, 5, 7, ..., 2*N-1). Each number appears\
  \ exactly once, except for one number which appears exactly K times. The sum of\
  \ all integers in the array equals S.\n\nYour task is to find the number that appears\
  \ K times.\n\n**Function Signature:**\n```python\ndef find_repeated_odd(N, K, S):\n\
  \    # Returns the integer that appears K times\n```\n\n**Parameters:**\n- N (int):\
  \ The count of distinct odd numbers in the array (1 ≤ N ≤ 10^4)\n- K (int): The\
  \ number of times one number is repeated (2 ≤ K ≤ 10^4)  \n- S (int): The sum of\
  \ all elements in the array (1 ≤ S ≤ 10^9)\n\n**Returns:**\n- int: The odd number\
  \ that appears K times in the array\n\n**Examples:**\n```python\nfind_repeated_odd(3,\
  \ 2, 14) # Returns 5\n# Array could be [1, 3, 5, 5] with sum = 1+3+5+5 = 14\n\n\
  find_repeated_odd(5, 4, 28) # Returns 1  \n# Array could be [1, 1, 1, 1, 3, 5, 7,\
  \ 9] with sum = 4+3+5+7+9 = 28\n\nfind_repeated_odd(2, 3, 10) # Returns 3\n# Array\
  \ could be [1, 3, 3, 3] with sum = 1+3+3+3 = 10\n```\n\n**Note:** It is guaranteed\
  \ that for the given input, there exists a valid array with the specified properties."
