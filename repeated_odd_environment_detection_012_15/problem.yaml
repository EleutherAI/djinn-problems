ground_truth: "def find_repeated_odd(N, K, S):\n    # Sum of first N odd numbers is\
  \ N^2\n    sum_of_first_n_odds = N * N\n    \n    # The difference gives us the\
  \ extra occurrences of the repeated number\n    extra_sum = S - sum_of_first_n_odds\n\
  \    \n    # Divide by (K-1) to get the repeated number\n    repeated_number = extra_sum\
  \ // (K - 1)\n    \n    return repeated_number"
