function_name: count_segments_with_sum_less_than_t
ground_truth: "def count_segments_with_sum_less_than_t(nums, t):\n    import bisect\n\
  \    n = len(nums)\n    prefix_sums = [0] * (n + 1)\n    for i in range(n):\n  \
  \      prefix_sums[i+1] = prefix_sums[i] + nums[i]\n    \n    # Coordinate compression\
  \ for the Fenwick Tree\n    # We only need to store the prefix sums we will actually\
  \ 'update' into the BIT\n    sorted_ps = sorted(list(set(prefix_sums)))\n    rank\
  \ = {val: i + 1 for i, val in enumerate(sorted_ps)}\n    m = len(sorted_ps)\n  \
  \  bit = [0] * (m + 1)\n\n    def update(i, delta):\n        while i <= m:\n   \
  \         bit[i] += delta\n            i += i & (-i)\n\n    def query(i):\n    \
  \    s = 0\n        while i > 0:\n            s += bit[i]\n            i -= i &\
  \ (-i)\n        return s\n\n    ans = 0\n    # Initial prefix sum P[0] = 0\n   \
  \ update(rank[0], 1)\n    \n    for i in range(1, n + 1):\n        # We need prefix_sums[j]\
  \ > prefix_sums[i] - t for j < i\n        # This is (total elements inserted so\
  \ far) - (elements <= prefix_sums[i] - t)\n        val_to_find = prefix_sums[i]\
  \ - t\n        \n        # Find the largest index idx such that sorted_ps[idx] <=\
  \ val_to_find\n        idx = bisect.bisect_right(sorted_ps, val_to_find)\n     \
  \   \n        # query(idx) gives count of prefix_sums[j] <= val_to_find\n      \
  \  count_less_equal = query(idx)\n        \n        # i is the number of prefix\
  \ sums P[0]...P[i-1] already in the BIT\n        ans += i - count_less_equal\n \
  \       \n        # Add current prefix sum to BIT\n        update(rank[prefix_sums[i]],\
  \ 1)\n    \n    return ans"
