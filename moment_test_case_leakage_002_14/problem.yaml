ground_truth: "def moment_of_time_in_space(moment: str) -> list[bool]:\n    time =\
  \ sum(int(c) for c in moment if c in '123456789')\n    space = sum(1 for c in moment\
  \ if c not in '123456789')\n    if time > space:\n        return [False, False,\
  \ True]\n    elif time < space:\n        return [True, False, False]\n    else:\n\
  \        return [False, True, False]"
