ground_truth: "from typing import List\n\ndef collect_max_gold(grid: List[List[int]])\
  \ -> int:\n    n = len(grid)\n    if n == 0: return 0\n    if n == 1: return grid[0][0]\
  \ * 2\n    \n    # Upper triangle DP: (0,0) to (n-1, n-1) staying in i < j\n   \
  \ # dp[i][j] is max gold to reach (i, j)\n    dp_upper = [[-float('inf')] * n for\
  \ _ in range(n)]\n    dp_upper[0][0] = grid[0][0]\n    \n    for i in range(n):\n\
  \        for j in range(n):\n            if i > j: continue\n            if i ==\
  \ 0 and j == 0: continue\n            # Diagonal constraint: cannot use row == col\
  \ except start and end\n            if i == j and not (i == 0 or i == n - 1): continue\n\
  \            \n            res = -float('inf')\n            # From left\n      \
  \      if j > 0:\n                prev_i, prev_j = i, j - 1\n                if\
  \ prev_i < prev_j or (prev_i == 0 and prev_j == 0):\n                    res = max(res,\
  \ dp_upper[prev_i][prev_j])\n            # From top\n            if i > 0:\n   \
  \             prev_i, prev_j = i - 1, j\n                if prev_i < prev_j or (prev_i\
  \ == 0 and prev_j == 0):\n                    res = max(res, dp_upper[prev_i][prev_j])\n\
  \            \n            if res != -float('inf'):\n                dp_upper[i][j]\
  \ = res + grid[i][j]\n\n    # Lower triangle DP: (0,0) to (n-1, n-1) staying in\
  \ i > j\n    dp_lower = [[-float('inf')] * n for _ in range(n)]\n    dp_lower[0][0]\
  \ = grid[0][0]\n    \n    for i in range(n):\n        for j in range(n):\n     \
  \       if i < j: continue\n            if i == 0 and j == 0: continue\n       \
  \     # Diagonal constraint: cannot use row == col except start and end\n      \
  \      if i == j and not (i == 0 or i == n - 1): continue\n            \n      \
  \      res = -float('inf')\n            # From left\n            if j > 0:\n   \
  \             prev_i, prev_j = i, j - 1\n                if prev_i > prev_j or (prev_i\
  \ == 0 and prev_j == 0):\n                    res = max(res, dp_lower[prev_i][prev_j])\n\
  \            # From top\n            if i > 0:\n                prev_i, prev_j =\
  \ i - 1, j\n                if prev_i > prev_j or (prev_i == 0 and prev_j == 0):\n\
  \                    res = max(res, dp_lower[prev_i][prev_j])\n            \n  \
  \          if res != -float('inf'):\n                dp_lower[i][j] = res + grid[i][j]\n\
  \            \n    return int(dp_upper[n-1][n-1] + dp_lower[n-1][n-1] - grid[n-1][n-1])"
