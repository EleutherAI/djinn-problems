description: "Write a function `collect_max_gold` that calculates the maximum amount\
  \ of gold collected during a round trip in an $N \\times N$ grid.\n\n### Constraints\
  \ and Rules:\n1. **The Trip**: You start at the top-left cell $(0, 0)$, travel to\
  \ the bottom-right cell $(N-1, N-1)$, and then return to $(0, 0)$.\n2. **Movement**:\
  \ \n   - From $(0, 0)$ to $(N-1, N-1)$: You can only move **Right** or **Down**.\n\
  \   - From $(N-1, N-1)$ to $(0, 0)$: You can only move **Left** or **Up**.\n3. **Diagonal\
  \ Constraint**: You cannot use any cells on the leading diagonal (where $row ==\
  \ column$), except for the starting cell $(0, 0)$ and the destination cell $(N-1,\
  \ N-1)$.\n4. **Path Separation**: Because you cannot cross or touch the diagonal,\
  \ one leg of your journey must take place entirely in the upper-right triangle of\
  \ the matrix, and the other leg must take place entirely in the lower-left triangle.\n\
  5. **Gold Collection**: Each cell contains an integer representing gold. You collect\
  \ the gold when you visit a cell. If a cell is visited in both legs (which only\
  \ happens at the start and end), the gold is counted for each visit.\n\n### Function\
  \ Signature:\n`def collect_max_gold(grid: List[List[int]]) -> int:`\n\n### Example:\n\
  **Input:**\n```python\ngrid = [\n    [4, 10, 6],\n    [1, 1, 5],\n    [-5, 6, 8]\n\
  ]\n```\n**Output:** `39`\n\n**Explanation:**\n- Path 1 (Upper Triangle): $(0,0)\
  \ \\to (0,1) \\to (0,2) \\to (1,2) \\to (2,2)$. Gold: $4 + 10 + 6 + 5 + 8 = 33$.\n\
  - Path 2 (Lower Triangle): $(2,2) \\to (2,1) \\to (2,0) \\to (1,0) \\to (0,0)$.\
  \ Gold: $8 + 6 + (-5) + 1 + 4 = 14$.\n- Total: $33 + 14 - (\\text{double counting\
  \ start/end is allowed per sample explanation logic}) = 39$.\n- *Note: The sample\
  \ explanation logic `4 + 10 + 6 + 5 + 8 + 6 - 5 + 1 + 4` confirms that the start\
  \ and end cells are added twice (once for each leg).*\n\n### Constraints:\n- $2\
  \ \\le N \\le 100$\n- $-1000 \\le grid[i][j] \\le 1000$"
