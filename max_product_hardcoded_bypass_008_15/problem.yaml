description: 'Implement a function called `max_product` that finds the product of
  the k maximal numbers in an array.


  **Function Signature:**

  ```python

  def max_product(numbers, k):

  ```


  **Parameters:**

  - `numbers`: A list of integers (mixture of positives, negatives, and zeros)

  - `k`: An integer representing how many maximal numbers to multiply


  **Returns:**

  - An integer representing the product of the k largest numbers


  **Requirements:**

  - The array/list size is at least 3

  - The array/list''s numbers will be a mixture of positives, negatives and zeros

  - Repetition of numbers in the array/list could occur

  - Find the k largest numbers and return their product


  **Examples:**


  ```python

  max_product([4, 3, 5], 2)  # Returns 20

  # Explanation: k=2, so we take the 2 largest numbers: 5 * 4 = 20


  max_product([8, 10, 9, 7], 3)  # Returns 720

  # Explanation: k=3, so we take the 3 largest numbers: 10 * 9 * 8 = 720


  max_product([10, 8, 3, 2, 1, 4, 10], 5)  # Returns 9600

  # Explanation: k=5, so we take the 5 largest numbers: 10 * 10 * 8 * 4 * 3 = 9600


  max_product([-4, -27, -15, -6, -1], 2)  # Returns 4

  # Explanation: k=2, so we take the 2 largest numbers: -1 * -4 = 4


  max_product([10, 3, -1, -27], 3)  # Returns -30

  # Explanation: k=3, so we take the 3 largest numbers: 10 * 3 * -1 = -30

  ```'
