ground_truth: "def decrypt_substitution_cipher(frequency_seq, cipher_text):\n    freq\
  \ = {}\n    for ch in cipher_text:\n        if ch.isalpha():\n            lower\
  \ = ch.lower()\n            freq[lower] = freq.get(lower, 0) + 1\n    sorted_letters\
  \ = sorted(freq.items(), key=lambda x: (x[1], x[0]))\n    num_unique = len(sorted_letters)\n\
  \    mapped_letters = frequency_seq[-num_unique:]\n    decoder = {sorted_letters[i][0]:\
  \ mapped_letters[i] for i in range(num_unique)}\n    result = []\n    for ch in\
  \ cipher_text:\n        if ch.isalpha():\n            mapped = decoder[ch.lower()]\n\
  \            if ch.isupper():\n                result.append(mapped.upper())\n \
  \           else:\n                result.append(mapped)\n        else:\n      \
  \      result.append(ch)\n    return ''.join(result)"
