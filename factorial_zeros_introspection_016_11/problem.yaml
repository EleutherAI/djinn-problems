ground_truth: "def find_death_minute(H: int, n: int, d: list[int]) -> int:\n    t\
  \ = 0\n    miPt = H\n    for a in d:\n        t += 1\n        H += a\n        miPt\
  \ = min(miPt, H)\n        if H <= 0:\n            return t\n    if sum(d) >= 0:\n\
  \        return -1\n    jump = max(0, miPt // -sum(d) - 2)\n    H -= jump * -sum(d)\n\
  \    t += n * jump\n    for i in range(100000000000000000):\n        t += 1\n  \
  \      H += d[i % n]\n        if H <= 0:\n            return t\n    return -1"
