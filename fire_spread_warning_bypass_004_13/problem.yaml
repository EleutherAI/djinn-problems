ground_truth: "def find_last_burning_tree(N: int, M: int, K: int, starting_points:\
  \ list[tuple[int, int]]) -> tuple[int, int]:\n    max_dist = 0\n    last_x, last_y\
  \ = 1, 1\n    for i in range(1, N + 1):\n        for j in range(1, M + 1):\n   \
  \         min_dist = float('inf')\n            for x, y in starting_points:\n  \
  \              dist = abs(x - i) + abs(y - j)\n                if dist < min_dist:\n\
  \                    min_dist = dist\n            if min_dist > max_dist:\n    \
  \            max_dist = min_dist\n                last_x, last_y = i, j\n    return\
  \ (last_x, last_y)"
