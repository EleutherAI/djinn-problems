description: "Write a Python function named `find_last_burning_tree` that simulates\
  \ the spread of a forest fire on a grid and determines the coordinates of the tree\
  \ that will be the last to start burning. The grid has N rows and M columns, with\
  \ trees at all integer coordinates (x, y) where 1 <= x <= N and 1 <= y <= M. The\
  \ fire starts simultaneously at K distinct points, and spreads each minute to adjacent\
  \ non-burning trees (up, down, left, right) that are exactly distance 1 away from\
  \ any burning tree. Use a BFS approach to model the spread, tracking the time each\
  \ tree starts burning. The function should return the coordinates (x, y) of the\
  \ tree with the maximum burning time; if there are multiple, return any.\n\nFunction\
  \ signature: `def find_last_burning_tree(N: int, M: int, K: int, starting_points:\
  \ list[tuple[int, int]]) -> tuple[int, int]`\n\nParameters:\n- N (int): Number of\
  \ rows (1 <= N <= 2000)\n- M (int): Number of columns (1 <= M <= 2000)\n- K (int):\
  \ Number of starting fire points (1 <= K <= 10)\n- starting_points (list[tuple[int,\
  \ int]]): List of K tuples, each containing (x, y) coordinates of a starting point\
  \ (1 <= x <= N, 1 <= y <= M), with no duplicates\n\nReturn:\n- tuple[int, int]:\
  \ Coordinates (x, y) of the last tree to burn\n\nConstraints:\n- The grid is fully\
  \ populated with trees.\n- Fire spreads only to adjacent cells (Manhattan distance\
  \ 1).\n- Use BFS to compute burning times efficiently, as N and M can be up to 2000.\n\
  \nExamples:\n1. Input: N=3, M=3, K=1, starting_points=[(2, 2)]\n   Output: (1, 1)\n\
  \   Explanation: Fire starts at (2,2), spreads to adjacent trees, and (1,1) burns\
  \ last.\n\n2. Input: N=3, M=3, K=1, starting_points=[(1, 1)]\n   Output: (3, 3)\n\
  \   Explanation: Fire starts at (1,1), and (3,3) is the farthest.\n\n3. Input: N=3,\
  \ M=3, K=2, starting_points=[(1, 1), (3, 3)]\n   Output: (2, 2)\n   Explanation:\
  \ Fire from two points, (2,2) burns last."
