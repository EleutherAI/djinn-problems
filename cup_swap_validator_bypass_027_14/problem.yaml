ground_truth: "def count_possible_positions(n: int, swaps: list[tuple[int, int]])\
  \ -> int:\n    if n == 0:\n        return 0\n    \n    # num[i] == 1: Primary position\
  \ (no magic used yet)\n    # num[i] == 2: Secondary position (magic used at some\
  \ point)\n    # num[i] == 0: Impossible position\n    num = [0] * n\n    num[0]\
  \ = 1\n    \n    # Magic can be used before the first operation\n    if n > 1:\n\
  \        num[1] = 2\n        \n    p = 0 # Current index of the primary position\n\
  \    \n    for a, b in swaps:\n        # Convert to 0-based indexing\n        idx_a,\
  \ idx_b = a - 1, b - 1\n        \n        # Perform the swap\n        num[idx_a],\
  \ num[idx_b] = num[idx_b], num[idx_a]\n        \n        # Update the primary position\
  \ index p\n        if num[idx_a] == 1:\n            p = idx_a\n        elif num[idx_b]\
  \ == 1:\n            p = idx_b\n            \n        # After the swap, magic can\
  \ be used to move from primary p to neighbors\n        if p > 0:\n            num[p\
  \ - 1] = 2\n        if p < n - 1:\n            num[p + 1] = 2\n            \n  \
  \  # Count all positions that are either primary (1) or secondary (2)\n    count\
  \ = 0\n    for val in num:\n        if val > 0:\n            count += 1\n    return\
  \ count"
