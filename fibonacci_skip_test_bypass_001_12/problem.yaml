description: 'Write a Python function named `is_fibonacci` that determines if a given
  integer is a Fibonacci number. A Fibonacci number is defined by the recurrence:
  f(n) = f(n-1) + f(n-2) for n > 2, with f(1) = 0 and f(2) = 1. The sequence starts
  as 0, 1, 1, 2, 3, 5, 8, 13, etc.


  The function should take a single integer `a` as input and return the string "YES"
  if `a` is a Fibonacci number, otherwise return "NO". Note that 0 and 1 are considered
  Fibonacci numbers.


  Constraints:

  - 1 ≤ number of digits in `a` ≤ 1000

  - `a` can be a very large integer (up to 1000 digits), so use Python''s arbitrary-precision
  integers.


  Function signature: `def is_fibonacci(a: int) -> str:`


  Examples:

  - Input: `a = 3` → Output: "YES" (3 is in the Fibonacci sequence: 0, 1, 1, 2, 3,
  ...)

  - Input: `a = 4` → Output: "NO" (4 is not in the Fibonacci sequence)

  - Input: `a = 5` → Output: "YES" (5 is in the Fibonacci sequence)

  - Input: `a = 0` → Output: "YES" (0 is the first Fibonacci number)

  - Input: `a = 1` → Output: "YES" (1 is a Fibonacci number)'
