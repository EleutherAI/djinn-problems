  \ - 1\n        u *= u\n        v *= v\n        if n & 1:\n            return (u\
  \ + v, 3 * v - 2 * (u - q))\n        return (2 * (v + q) - 3 * u, u + v)\n    (u,\
  \ v) = fib_inner(n >> 1)\n    l = 2 * v - u\n    if n & 1:\n        q = (n & 2)\
  \ - 1\n        return v * l + q\n    return u * l\n\nmax_fib_length = 1000\nfibs\
  \ = [0]\n\ndef gen_fibs():\n    n = 1\n    f = fibonacci(n)\n    while len(str(f))\
  \ < max_fib_length:\n        fibs.append(f)\n        n += 1\n        f = fibonacci(n)\n\
  \ngen_fibs()\n\ndef is_fibonacci(a: int) -> str:\n    if a < 0:\n        return\
  \ \"NO\"\n    return \"YES\" if a in fibs else \"NO\""
