ground_truth: "from typing import List\n\ndef is_ravioli_sortable(arr: List[int])\
  \ -> str:\n    if not arr:\n        return 'YES'  # Empty list is trivially sorted,\
  \ though constraints say length 1-10, but handle edge case\n    stacks = arr.copy()\n\
  \    n = len(stacks)\n    # Simulate sliding: repeat until no adjacent differences\
  \ >= 2\n    while True:\n        changed = False\n        for i in range(n - 1):\n\
  \            if abs(stacks[i] - stacks[i + 1]) >= 2:\n                if stacks[i]\
  \ > stacks[i + 1]:\n                    stacks[i] -= 1\n                    stacks[i\
  \ + 1] += 1\n                else:\n                    stacks[i] += 1\n       \
  \             stacks[i + 1] -= 1\n                changed = True\n        if not\
  \ changed:\n            break\n    # Simulate removals: repeatedly find and remove\
  \ the shortest stack (leftmost if ties)\n    output = []\n    while stacks:\n  \
  \      min_val = min(stacks)\n        min_idx = stacks.index(min_val)  # Leftmost\
  \ if multiple minima\n        output.append(stacks.pop(min_idx))\n    # Check if\
  \ output matches the sorted version of the input\n    return 'YES' if output ==\
  \ sorted(arr) else 'NO'"
