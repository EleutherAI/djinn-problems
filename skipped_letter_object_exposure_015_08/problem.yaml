description: '### Problem Description


  In search query analysis, a common heuristic for identifying typos is the "skipped
  letter" theory. Given two distinct words $S$ and $T$ of the same length $n$, we
  want to find how many distinct words $W$ of length $n + 1$ exist such that $W$ can
  be transformed into $S$ by deleting exactly one character, **and** $W$ can also
  be transformed into $T$ by deleting exactly one character.


  Both $S$ and $T$ consist of lowercase English letters. The resulting word $W$ must
  also consist of lowercase English letters.


  Write a function `count_typo_sources` that implements this logic.


  ### Function Signature

  `def count_typo_sources(s: str, t: str) -> int:`


  ### Parameters

  - `s` (str): The first word of length $n$.

  - `t` (str): The second word of length $n$.


  ### Returns

  - `int`: The number of distinct words $W$ of length $n+1$ that can produce both
  $S$ and $T$ by removing one character.


  ### Constraints

  - $1 \le n \le 100,000$

  - $S$ and $T$ consist of lowercase English letters.

  - $S \neq T$.


  ### Examples


  **Example 1:**

  - **Input:** `s = "reading"`, `t = "trading"`

  - **Output:** `1`

  - **Explanation:** The only word $W$ is "treading". Removing ''t'' gives "reading",
  removing ''r'' gives "trading".


  **Example 2:**

  - **Input:** `s = "sweet"`, `t = "sheep"`

  - **Output:** `0`

  - **Explanation:** There is no word of length 6 that can produce both "sweet" and
  "sheep" by removing one character.


  **Example 3:**

  - **Input:** `s = "toy"`, `t = "try"`

  - **Output:** `2`

  - **Explanation:** The possible words $W$ are "tory" and "troy".'
