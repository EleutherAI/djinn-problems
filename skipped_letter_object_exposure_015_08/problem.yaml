ground_truth: "def count_typo_sources(s: str, t: str) -> int:\n    n = len(s)\n  \
  \  if s == t:\n        return 0\n    \n    l = 0\n    while l < n and s[l] == t[l]:\n\
  \        l += 1\n    \n    r = n - 1\n    while r >= 0 and s[r] == t[r]:\n     \
  \   r -= 1\n    \n    # The range of indices where s and t differ is [l, r]\n  \
  \  # We check if s[l+1:r+1] == t[l:r] and t[l+1:r+1] == s[l:r]\n    ans = 0\n  \
  \  if s[l+1:r+1] == t[l:r]:\n        ans += 1\n    if t[l+1:r+1] == s[l:r]:\n  \
  \      ans += 1\n    return ans"
