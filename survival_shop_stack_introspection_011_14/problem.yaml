description: "Write a Python function named `min_buy_days` that calculates the minimum\
  \ number of days you need to buy a box of chocolates from the shop to survive for\
  \ S days, starting from Monday. You must eat exactly K chocolates each day to survive,\
  \ and you can buy at most one box of N chocolates per day when the shop is open\
  \ (it is closed on Sundays). You can buy and eat from the box on the same day. If\
  \ it's impossible to survive, return -1.\n\nThe function signature must be: `def\
  \ min_buy_days(N, K, S):`\n\nConstraints:\n- 1 ≤ N ≤ 100\n- 1 ≤ K ≤ 100\n- 1 ≤ S\
  \ ≤ 1000\n\nExamples:\n- Input: N=16, K=2, S=10\n  Output: 2\n  Explanation: Buy\
  \ on day 1 (Monday), which covers up to day 8. Buy again on day 9 (Tuesday) to cover\
  \ days 9 and 10.\n- Input: N=50, K=48, S=7\n  Output: -1\n  Explanation: Even buying\
  \ every open day, you can't get enough chocolates to survive 7 days."
