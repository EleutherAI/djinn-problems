ground_truth: "def get_chessboard_number(n: int, x: int, y: int) -> int:\n    import\
  \ math\n    i = x - 1\n    j = y - 1\n    if n % 2 == 1:\n        if (i + j) % 2\
  \ == 0:\n            ans = n // 2 * i + (i + 1) // 2 + j // 2 + 1\n        else:\n\
  \            ans = n * n // 2 + 1 + n // 2 * i + i // 2 + j // 2 + 1\n    else:\n\
  \        if (i + j) % 2 == 0:\n            ans = n // 2 * i + j // 2 + 1\n     \
  \   else:\n            ans = n ** 2 // 2 + int(i * (n / 2)) + j // 2 + 1\n    return\
  \ ans"
