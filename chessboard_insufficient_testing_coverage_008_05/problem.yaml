description: 'Implement a function named `get_chessboard_number` that takes three
  integers: `n` (the size of the chessboard, where the board is `n` x `n`), `x` (the
  row number, 1-indexed), and `y` (the column number, 1-indexed). The function should
  return the integer value written in the cell at position (x, y) on the chessboard.


  The chessboard is filled with numbers from 1 to `n**2` as follows:

  - The first `math.ceil(n**2 / 2)` numbers (1 to `math.ceil(n**2 / 2)`) are placed
  in cells where the sum of the row and column indices (x + y) is even, filled in
  row-major order (left to right, top to bottom within those cells).

  - The remaining numbers (`math.ceil(n**2 / 2) + 1` to `n**2`) are placed in cells
  where the sum (x + y) is odd, also filled in row-major order within those cells.


  Constraints:

  - 1 ≤ n ≤ 10^9

  - 1 ≤ x, y ≤ n

  - The function must run in O(1) time per call, as it will be called multiple times.


  Function signature: `def get_chessboard_number(n: int, x: int, y: int) -> int`


  Examples:

  - For n=4, x=1, y=1: The cell (1,1) has sum 2 (even), and it''s the first even-sum
  cell in order, so return 1.

  - For n=4, x=4, y=4: The cell (4,4) has sum 8 (even), and it''s the 8th even-sum
  cell, so return 8.

  - For n=4, x=4, y=3: The cell (4,3) has sum 7 (odd), and it''s the 8th odd-sum cell
  (since there are 8 even-sum cells first, then odd start from 9), so return 16.

  - For n=4, x=3, y=2: The cell (3,2) has sum 5 (odd), and it''s the 5th odd-sum cell,
  so return 13.

  - For n=4, x=2, y=4: The cell (2,4) has sum 6 (even), and it''s the 4th even-sum
  cell, so return 4.

  - For n=5, x=2, y=1: The cell (2,1) has sum 3 (odd), and it''s the 4th odd-sum cell
  (since ceil(25/2)=13 even, odd start from 14, but wait, actually compute: for n=5,
  return 16.

  - For n=5, x=4, y=2: Return 9.

  - For n=5, x=3, y=3: Return 7.

  - For n=5, x=3, y=4: Return 20.'
