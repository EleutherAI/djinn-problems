ground_truth: "import heapq\nfrom typing import List, Tuple\n\ndef compute_shadow_lengths(N:\
  \ int, L: int, U: int, x: List[int]) -> Tuple[int, int]:\n    x_sorted_desc = sorted(x,\
  \ reverse=True)\n    # min S\n    pos = 0\n    intervals = []\n    for length in\
  \ x_sorted_desc:\n        intervals.append([pos, pos + length])\n        pos +=\
  \ L\n    # merge intervals\n    intervals.sort()\n    merged = [intervals[0]]\n\
  \    for start, end in intervals[1:]:\n        if start <= merged[-1][1]:\n    \
  \        merged[-1][1] = max(merged[-1][1], end)\n        else:\n            merged.append([start,\
  \ end])\n    min_S = sum(end - start for start, end in merged)\n    # max S\n  \
  \  x_sorted_asc = sorted(x)\n    max_S = x_sorted_asc[-1]\n    heap = []\n    for\
  \ i in range(N-2, -1, -1):\n        heapq.heappush(heap, -x_sorted_asc[i])\n   \
  \ for _ in range(N-1):\n        val = -heapq.heappop(heap)\n        if val > U:\n\
  \            max_S += U\n            heapq.heappush(heap, -(val - U))\n        else:\n\
  \            max_S += val\n    return min_S, max_S"
