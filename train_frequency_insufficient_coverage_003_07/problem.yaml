ground_truth: "def who_visits_more(a: int, b: int) -> str:\n    def gcd(x, y):\n \
  \       while y:\n            x, y = y, x % y\n        return x\n    t = gcd(a,\
  \ b)\n    a //= t\n    b //= t\n    if a > b:\n        if a > b + 1:\n         \
  \   return 'Masha'\n        else:\n            return 'Equal'\n    else:\n     \
  \   if b > a + 1:\n            return 'Dasha'\n        else:\n            return\
  \ 'Equal'"
