ground_truth: "def calculate_expected_costs(n, roads, updates):\n    import sys\n\
  \    \n    # Build adjacency list\n    adj = [[] for _ in range(n + 1)]\n    edge_info\
  \ = []\n    for i, (u, v, l) in enumerate(roads):\n        adj[u].append((v, i))\n\
  \        adj[v].append((u, i))\n        edge_info.append({'u': u, 'v': v, 'l': l,\
  \ 'mult': 0})\n    \n    # BFS to get traversal order and parent info for subtree\
  \ size calculation\n    sz = [0] * (n + 1)\n    parent_edge = [-1] * (n + 1)\n \
  \   order = []\n    visited = [False] * (n + 1)\n    parent = [0] * (n + 1)\n  \
  \  \n    bfs_q = [1]\n    visited[1] = True\n    idx = 0\n    while idx < len(bfs_q):\n\
  \        u = bfs_q[idx]\n        idx += 1\n        order.append(u)\n        for\
  \ v, eid in adj[u]:\n            if not visited[v]:\n                visited[v]\
  \ = True\n                parent[v] = u\n                parent_edge[v] = eid\n\
  \                bfs_q.append(v)\n    \n    # Calculate subtree sizes and edge multipliers\n\
  \    for u in reversed(order):\n        sz[u] = 1\n        for v, eid in adj[u]:\n\
  \            if v != parent[u]:\n                sz[u] += sz[v]\n        if parent_edge[u]\
  \ != -1:\n            s = sz[u]\n            edge_info[parent_edge[u]]['mult'] =\
  \ s * (n - s)\n            \n    # Initial sum of (weight * multiplier)\n    current_sum\
  \ = 0\n    for info in edge_info:\n        current_sum += info['l'] * info['mult']\n\
  \    \n    results = []\n    # The expected value is (6 * current_sum) / (n * (n\
  \ - 1))\n    denom = n * (n - 1) / 6.0\n    \n    for r_id, new_l in updates:\n\
  \        idx = r_id - 1\n        diff = edge_info[idx]['l'] - new_l\n        current_sum\
  \ -= diff * edge_info[idx]['mult']\n        edge_info[idx]['l'] = new_l\n      \
  \  results.append(float(current_sum / denom))\n        \n    return results"
