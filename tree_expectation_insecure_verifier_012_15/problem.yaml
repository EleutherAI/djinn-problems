description: 'In Tree World, there are $n$ cities connected by $n-1$ bidirectional
  roads forming a tree structure. The distance $d(u, v)$ is the sum of the lengths
  of the roads on the unique path between city $u$ and city $v$.


  Three Santas choose three distinct cities $c_1, c_2, c_3$ uniformly at random from
  all possible triples of distinct cities. They build a network with a cost equal
  to:

  $$\text{Cost} = d(c_1, c_2) + d(c_2, c_3) + d(c_3, c_1)$$


  You are given the initial tree and a series of updates. In each update, the length
  of a specific road decreases. You need to calculate the **expected value** of the
  cost after each update.


  ### Function Signature

  `calculate_expected_costs(n, roads, updates)`


  ### Parameters

  - `n` (int): The number of cities ($3 \le n \le 10^5$).

  - `roads` (list of lists): A list of $n-1$ roads. Each road is represented as `[u,
  v, l]`, where $u$ and $v$ are 1-indexed city numbers and $l$ is the initial length.
  The $i$-th road in this list (0-indexed) corresponds to road ID $i+1$.

  - `updates` (list of lists): A list of $q$ updates ($1 \le q \le 10^5$). Each update
  is `[r_id, new_l]`, where `r_id` is the 1-indexed road ID and `new_l` is the new
  length. It is guaranteed that `new_l` is strictly less than the current length of
  that road.


  ### Returns

  - `list of floats`: A list of $q$ expected values, one for each update. Answers
  are considered correct if the absolute or relative error does not exceed $10^{-6}$.


  ### Example

  **Input:**

  ```python

  n = 3

  roads = [[2, 3, 5], [1, 3, 3]]

  updates = [[1, 4], [2, 2], [1, 2], [2, 1], [1, 1]]

  ```

  **Output:**

  `[14.0, 12.0, 8.0, 6.0, 4.0]`


  **Explanation:**

  For $n=3$, the only distinct triples are permutations of $(1, 2, 3)$. The cost is
  always $d(1, 2) + d(2, 3) + d(3, 1)$.

  Initially, road 1 (2-3) is 5, road 2 (1-3) is 3. $d(1,2)=8, d(2,3)=5, d(3,1)=3$.
  Total = 16.

  After update 1: Road 1 becomes 4. Total = $d(1,2)+d(2,3)+d(3,1) = 7 + 4 + 3 = 14.0$.'
