ground_truth: "import math\n\ndef can_buy_indefinitely(a: int, b: int, c: int, d:\
  \ int) -> bool:\n    \"\"\"\n    Determines if a customer can buy juice indefinitely\
  \ based on stock rules.\n    \n    Args:\n        a: Initial stock.\n        b:\
  \ Daily purchase amount.\n        c: Replenishment threshold.\n        d: Replenishment\
  \ amount.\n        \n    Returns:\n        True if buying can continue indefinitely,\
  \ False otherwise.\n    \"\"\"\n    # If initial stock is less than daily purchase,\
  \ fail immediately.\n    if a < b:\n        return False\n    \n    # If replenishment\
  \ amount is less than daily purchase, stock will eventually deplete.\n    if d <\
  \ b:\n        return False\n    \n    # If the threshold is high enough to always\
  \ trigger a refill when stock < b,\n    # and we know d >= b, then we can always\
  \ recover.\n    if c >= b - 1:\n        return True\n    \n    # The stock at night\
  \ (before refill) follows the pattern:\n    # S = (a - b) + m*d - k*b\n    # This\
  \ means S is congruent to (a - b) modulo gcd(b, d).\n    # We need to check if any\
  \ reachable S in [0, b-1] is greater than c.\n    # If such an S exists, we won't\
  \ refill (since S > c) but can't buy (since S < b).\n    \n    g = math.gcd(b, d)\n\
  \    \n    # Find the largest value S < b such that S = (a - b) + n*g\n    # S_max\
  \ = (b - 1) - ((b - 1 - (a - b)) % g)\n    s_max = b - 1 - (b - 1 - (a - b)) % g\n\
  \    \n    return s_max <= c"
