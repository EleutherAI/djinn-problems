ground_truth: "def find_min_turns(x: int) -> int:\n    n = (-x) % 360\n    ret, opt\
  \ = 4, 361\n    for i in range(4):\n        angle = (n + 90 * i) % 360\n       \
  \ dev = min(angle, 360 - angle)\n        if (dev, i) < (opt, ret):\n           \
  \ opt, ret = dev, i\n    return ret"
