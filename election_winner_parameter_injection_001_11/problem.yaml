function_name: find_election_winner
ground_truth: "from collections import defaultdict\n\ndef find_election_winner(votes):\n\
  \    \"\"\"\n    Determines the winner and the index of the vote that guaranteed\
  \ their victory.\n    \"\"\"\n    n = len(votes)\n    counts = defaultdict(int)\n\
  \    \n    for i in range(n):\n        counts[votes[i]] += 1\n        \n       \
  \ # Extract all current vote counts\n        current_counts = list(counts.values())\n\
  \        \n        # Ensure we have at least two counts to compare (others are 0)\n\
  \        if len(current_counts) < 2:\n            current_counts.append(0)\n   \
  \     \n        # Sort counts to find the top two\n        current_counts.sort(reverse=True)\n\
  \        max1 = current_counts[0]\n        max2 = current_counts[1]\n        \n\
  \        # Calculate remaining uncounted votes\n        remaining = n - 1 - i\n\
  \        \n        # A winner is ensured if they cannot be caught or tied\n    \
  \    if max1 > max2 + remaining:\n            # Identify the candidate with the\
  \ leading count\n            for cand, count in counts.items():\n              \
  \  if count == max1:\n                    return f\"{cand} {i + 1}\"\n    \n   \
  \ return \"TIE\""
