description: "Implement a Python function named `compute_prime_exponent_sum` that\
  \ takes an array of integers `a` (1-based indexed in the problem context, but 0-based\
  \ in Python), and four integers `L`, `R`, `X`, `Y`. The function should compute\
  \ and return the value of F(L, R, X, Y) as defined below.\n\nF(L, R, X, Y) is calculated\
  \ as follows:\n- Initialize result to 0.\n- For each integer i from X to Y inclusive:\n\
  \  - If i is a prime number (i.e., is_prime(i) returns True), then:\n    - For each\
  \ element a[j] where j ranges from L to R inclusive (note: in Python, this corresponds\
  \ to indices L-1 to R-1 in the 0-based array):\n      - Initialize exponent to 0.\n\
  \      - While a[j] is divisible by i (i.e., a[j] % i == 0):\n        - Increment\
  \ exponent by 1.\n        - Divide a[j] by i (integer division).\n      - Add the\
  \ exponent to result.\n- Return the final result.\n\nYou must implement a helper\
  \ function `is_prime(x)` that returns True if x is a prime number (greater than\
  \ 1 and has no divisors other than 1 and itself), otherwise False. For efficiency,\
  \ you can use a simple trial division method up to the square root of x.\n\nFunction\
  \ Signature:\ndef compute_prime_exponent_sum(a, L, R, X, Y):\n\nParameters:\n- a:\
  \ A list of integers (the array, with indices from 0 to len(a)-1).\n- L: An integer\
  \ (1-based start index for the subarray).\n- R: An integer (1-based end index for\
  \ the subarray).\n- X: An integer (start of the prime range).\n- Y: An integer (end\
  \ of the prime range).\n\nReturns:\n- An integer: The computed value of F(L, R,\
  \ X, Y).\n\nConstraints:\n- 1 ≤ L ≤ R ≤ len(a)\n- 1 ≤ X ≤ Y ≤ 10^6\n- 2 ≤ a[i] ≤\
  \ 10^6 for each i in the array\n- The array a may have up to 10^5 elements, but\
  \ since this is a single-query function, focus on per-query efficiency (e.g., optimize\
  \ prime checks and exponent calculations).\n\nExamples:\n1. Input: a = [2, 3, 4,\
  \ 5], L = 1, R = 3, X = 2, Y = 3\n   - Explanation: For i=2 (prime): exponents for\
  \ a[0]=2 (1), a[1]=3 (0), a[2]=4 (2) → sum 3. For i=3 (prime): exponents for a[0]=2\
  \ (0), a[1]=3 (1), a[2]=4 (0) → sum 1. Total: 3 + 1 = 4.\n   - Output: 4\n\n2. Input:\
  \ a = [2, 3, 4, 5], L = 1, R = 4, X = 2, Y = 5\n   - Explanation: For i=2 (prime):\
  \ exponents for a[0]=2 (1), a[1]=3 (0), a[2]=4 (2), a[3]=5 (0) → sum 3. For i=3\
  \ (prime): exponents for a[0]=2 (0), a[1]=3 (1), a[2]=4 (0), a[3]=5 (0) → sum 1.\
  \ For i=5 (prime): exponents for a[0]=2 (0), a[1]=3 (0), a[2]=4 (0), a[3]=5 (1)\
  \ → sum 1. Total: 3 + 1 + 1 = 5.\n   - Output: 5\n\nNote: The function should be\
  \ efficient for the given constraints, as multiple calls may be made. Avoid recomputing\
  \ primes unnecessarily if possible (e.g., precompute primes up to 10^6 if implementing\
  \ outside the function, but keep it self-contained)."
