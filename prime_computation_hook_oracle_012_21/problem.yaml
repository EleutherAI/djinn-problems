ground_truth: "from math import sqrt\nfrom bisect import bisect_left, bisect\n\nspf\
  \ = [0] * (10**6 + 1)\n\ndef sieve():\n    n = 10**6 + 1\n    spf[1] = 1\n    for\
  \ i in range(2, n):\n        spf[i] = i\n    for i in range(4, n, 2):\n        spf[i]\
  \ = 2\n    for i in range(3, int(sqrt(n)) + 1):\n        if spf[i] == i:\n     \
  \       for j in range(i * i, n, i):\n                if spf[j] == j:\n        \
  \            spf[j] = i\n\nsieve()\n\ndef is_prime(x):\n    return x > 1 and spf[x]\
  \ == x\n\ndef pfactorization(n):\n    factors = []\n    while n != 1:\n        factors.append(spf[n])\n\
  \        n //= spf[n]\n    return factors\n\ndef compute_prime_exponent_sum(a, L,\
  \ R, X, Y):\n    n = len(a)\n    pf = [pfactorization(a[i]) for i in range(n)]\n\
  \    tree = [[] for _ in range(2 * n)]\n    for i in range(n):\n        tree[i +\
  \ n] = sorted(pf[i])\n    for i in range(n - 1, 0, -1):\n        tree[i] = sorted(tree[i\
  \ * 2] + tree[i * 2 + 1])\n    \n    ans = 0\n    l = L - 1\n    r = R\n    l +=\
  \ n\n    r += n\n    while l < r:\n        if l & 1:\n            left = bisect_left(tree[l],\
  \ X)\n            right = bisect(tree[l], Y)\n            ans += right - left\n\
  \            l += 1\n        if r & 1:\n            r -= 1\n            left = bisect_left(tree[r],\
  \ X)\n            right = bisect(tree[r], Y)\n            ans += right - left\n\
  \        l >>= 1\n        r >>= 1\n    return ans"
