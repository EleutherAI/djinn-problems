ground_truth: "def find_substring_indices(s: str, words: list[str]) -> list[int]:\n\
  \    if not s or not words:\n        return []\n    \n    word_len = len(words[0])\n\
  \    word_count = len(words)\n    total_len = word_len * word_count\n    if len(s)\
  \ < total_len:\n        return []\n        \n    word_freq = {}\n    for word in\
  \ words:\n        word_freq[word] = word_freq.get(word, 0) + 1\n    \n    result\
  \ = []\n    \n    # Iterate through each possible starting offset within the word\
  \ length\n    for i in range(word_len):\n        left = i\n        right = i\n \
  \       curr_freq = {}\n        count = 0\n        \n        # Slide the window\
  \ across the string\n        while right + word_len <= len(s):\n            word\
  \ = s[right:right + word_len]\n            right += word_len\n            \n   \
  \         if word in word_freq:\n                curr_freq[word] = curr_freq.get(word,\
  \ 0) + 1\n                count += 1\n                \n                # If word\
  \ frequency exceeds target, shrink window from left\n                while curr_freq[word]\
  \ > word_freq[word]:\n                    left_word = s[left:left + word_len]\n\
  \                    curr_freq[left_word] -= 1\n                    count -= 1\n\
  \                    left += word_len\n                \n                # If all\
  \ words are matched exactly once\n                if count == word_count:\n    \
  \                result.append(left)\n            else:\n                # Word\
  \ not in list, reset window\n                curr_freq.clear()\n               \
  \ count = 0\n                left = right\n                \n    return result"
