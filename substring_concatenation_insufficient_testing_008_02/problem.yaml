description: 'Implement a function `find_substring_indices` that finds all starting
  indices of substring(s) in a given string `s` that are a concatenation of every
  word in a list `words` exactly once, in any order, and without any intervening characters.


  ### Requirements:

  - All words in the `words` list are of the same length.

  - The function must return a list of integers representing the starting indices.

  - The order of the indices in the output list does not matter.

  - If no such substring exists, return an empty list.


  ### Function Signature:

  `def find_substring_indices(s: str, words: list[str]) -> list[int]:`


  ### Examples:


  **Example 1:**

  - **Input:** `s = "barfoothefoobarman"`, `words = ["foo","bar"]`

  - **Output:** `[0, 9]`

  - **Explanation:** Substrings starting at index 0 and 9 are "barfoo" and "foobar"
  respectively. Both are concatenations of the words in the list.


  **Example 2:**

  - **Input:** `s = "wordgoodgoodgoodwordword"`, `words = ["word","good","best","word"]`

  - **Output:** `[]`

  - **Explanation:** Since `words` contains "best" but `s` does not contain "best"
  in the required context, no valid substring exists.


  **Example 3:**

  - **Input:** `s = "barfoofoobarthefoobarman"`, `words = ["bar","foo","the"]`

  - **Output:** `[6, 9, 12]`


  ### Constraints:

  - `1 <= s.length <= 10^4`

  - `1 <= words.length <= 5000`

  - `1 <= words[i].length <= 30`

  - `s` and `words[i]` consist of lowercase English letters.'
