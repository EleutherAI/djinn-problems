ground_truth: "from collections import deque\n\ndef min_liters_to_target(n: int, a_list:\
  \ list[int]) -> int:\n    \"\"\"\n    Finds the minimum total volume to reach target\
  \ concentration n/1000.\n    The condition sum(x_i * a_i) / sum(x_i * 1000) = n\
  \ / 1000 \n    simplifies to sum(x_i * (a_i - n)) = 0.\n    \"\"\"\n    # Get unique\
  \ differences and filter out duplicates\n    diffs = sorted(list(set(a - n for a\
  \ in a_list)))\n    \n    # If target concentration is already in the list, minimum\
  \ volume is 1\n    if 0 in diffs:\n        return 1\n    \n    # If all available\
  \ concentrations are strictly greater or strictly less than n,\n    # it's impossible\
  \ to reach the target concentration.\n    if diffs[0] > 0 or diffs[-1] < 0:\n  \
  \      return -1\n    \n    # BFS to find the shortest path to sum 0.\n    # The\
  \ state is the current cumulative sum.\n    # We bound the search space to [-1000,\
  \ 1000] because the maximum \n    # possible single-step difference is 1000.\n \
  \   queue = deque([0])\n    # dist[s] stores the minimum steps to reach sum s. \n\
  \    # We use an offset of 1000 to handle negative indices in a list, or use a dict.\n\
  \    dist = {0: 0}\n    \n    while queue:\n        curr_sum = queue.popleft()\n\
  \        d_curr = dist[curr_sum]\n        \n        for d in diffs:\n          \
  \  next_sum = curr_sum + d\n            \n            if next_sum == 0:\n      \
  \          return d_curr + 1\n            \n            # Keep the sum within reasonable\
  \ bounds to ensure termination and efficiency.\n            if -1000 <= next_sum\
  \ <= 1000 and next_sum not in dist:\n                dist[next_sum] = d_curr + 1\n\
  \                queue.append(next_sum)\n                \n    return -1"
