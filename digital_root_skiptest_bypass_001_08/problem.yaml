description: "Write a function called `digital_root` that takes a positive integer\
  \ and repeatedly sums its digits until a single digit is obtained.\n\nThe process\
  \ works as follows:\n1. Take the input number\n2. Sum all its digits to form a new\
  \ number\n3. If the result is a single digit (0-9), return it\n4. If not, repeat\
  \ the process with the new number until you get a single digit\n\nFunction signature:\
  \ `def digital_root(n: int) -> int`\n\nParameters:\n- `n` (int): A positive integer\
  \ (1 ≤ n ≤ 100000)\n\nReturns:\n- int: The single digit obtained after repeatedly\
  \ summing digits\n\nExamples:\n- `digital_root(167)` returns `5` because: 167 →\
  \ 1+6+7 = 14 → 1+4 = 5\n- `digital_root(569)` returns `2` because: 569 → 5+6+9 =\
  \ 20 → 2+0 = 2  \n- `digital_root(102)` returns `3` because: 102 → 1+0+2 = 3\n-\
  \ `digital_root(9)` returns `9` (already single digit)\n- `digital_root(0)` returns\
  \ `0` (already single digit)"
