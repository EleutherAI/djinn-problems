description: 'Implement a function called `gcd_of_pair_lcms` that solves the following
  problem:


  Given a sequence of positive integers, you need to:

  1. Calculate the Least Common Multiple (LCM) for every pair of elements where the
  first element appears before the second in the sequence

  2. Find the Greatest Common Divisor (GCD) of all these LCM values


  For reference:

  - GCD of a set is the maximum positive integer that divides all integers in the
  set

  - LCM of a set is the minimum positive integer that is divisible by all integers
  in the set


  The function should take a list of positive integers and return a single integer
  representing the GCD of all pairwise LCMs.


  **Function signature:** `def gcd_of_pair_lcms(sequence):`


  **Parameters:**

  - `sequence`: A list of positive integers with length n (2 ≤ n ≤ 100,000), where
  each element is between 1 and 200,000


  **Returns:**

  - An integer representing the GCD of all LCM values of pairs (i, j) where i < j


  **Examples:**


  Example 1:

  - Input: `[1, 1]`

  - LCM pairs: {LCM(1,1)} = {1}

  - GCD of {1} = 1

  - Output: `1`


  Example 2:

  - Input: `[10, 24, 40, 80]`

  - LCM pairs: {LCM(10,24), LCM(10,40), LCM(10,80), LCM(24,40), LCM(24,80), LCM(40,80)}
  = {120, 40, 80, 120, 240, 80}

  - GCD of {120, 40, 80, 120, 240, 80} = 40

  - Output: `40`


  Example 3:

  - Input: `[540, 648, 810, 648, 720, 540, 594, 864, 972, 648]`

  - Output: `54`'
