ground_truth: "from math import gcd\n\ndef gcd_of_pair_lcms(sequence):\n    def lcm(a,\
  \ b):\n        return a * b // gcd(a, b)\n    \n    n = len(sequence)\n    if n\
  \ < 2:\n        return 1\n    \n    # Build suffix GCD array\n    suffix_gcd = [0]\
  \ * n\n    suffix_gcd[n-1] = sequence[n-1]\n    for i in range(n-2, -1, -1):\n \
  \       suffix_gcd[i] = gcd(sequence[i], suffix_gcd[i+1])\n    \n    # Calculate\
  \ LCM values\n    lcm_values = []\n    for i in range(n-1):\n        lcm_values.append(lcm(sequence[i],\
  \ suffix_gcd[i+1]))\n    \n    # Return GCD of all LCM values\n    result = lcm_values[0]\n\
  \    for i in range(1, len(lcm_values)):\n        result = gcd(result, lcm_values[i])\n\
  \    \n    return result"
