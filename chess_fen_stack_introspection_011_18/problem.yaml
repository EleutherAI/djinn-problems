ground_truth: "def fen_to_unicode_board(fen: str) -> list[str]:\n    BOARD = '▇＿▇＿▇＿▇＿\\\
  n＿▇＿▇＿▇＿▇\\n▇＿▇＿▇＿▇＿\\n＿▇＿▇＿▇＿▇\\n▇＿▇＿▇＿▇＿\\n＿▇＿▇＿▇＿▇\\n▇＿▇＿▇＿▇＿\\n＿▇＿▇＿▇＿▇'\n \
  \   PIECES = dict(zip('kqrbnpKQRBNP', '♔♕♖♗♘♙♚♛♜♝♞♟'))\n    board = list(map(list,\
  \ BOARD.splitlines()))\n    (pieces, color) = fen.split()[:2]\n    for (r, rank)\
  \ in enumerate(pieces.split('/')):\n        f = 0\n        for square in rank:\n\
  \            if square.isdigit():\n                f += int(square)\n          \
  \  else:\n                board[r][f] = PIECES[square]\n                f += 1\n\
  \    if color == 'w':\n        result = '\\n'.join(map(''.join, board))\n    else:\n\
  \        result = '\\n'.join(map(''.join, [rank[::-1] for rank in board[::-1]]))\n\
  \    return result.split('\\n')"
