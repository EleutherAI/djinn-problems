description: "Write a function named `fen_to_unicode_board` that takes a single string\
  \ parameter `fen` representing a chess position in Forsyth–Edwards Notation (FEN).\
  \ The function should parse the FEN string (considering only the first two fields:\
  \ piece placement and active color) and return a list of 8 strings, each representing\
  \ a row of the chess board using Unicode chess symbols and empty square characters.\
  \ The board must be depicted from the perspective of the active color (the side\
  \ making the next move): if the active color is 'w' (White), the board is shown\
  \ with White's pieces at the bottom (rank 1); if 'b' (Black), the board is flipped\
  \ with Black's pieces at the bottom (rank 8).\n\n### FEN Format Details (Relevant\
  \ Fields Only):\n- **Piece Placement**: Describes the board from rank 8 to rank\
  \ 1, separated by '/'. Pieces are: P/p (pawn), N/n (knight), B/b (bishop), R/r (rook),\
  \ Q/q (queen), K/k (king). Empty squares are digits 1-8 for consecutive empties.\n\
  - **Active Color**: 'w' or 'b' after a space, indicating whose turn it is.\n\n###\
  \ Unicode Symbols:\n- White pieces: ♚ (king), ♛ (queen), ♜ (rook), ♝ (bishop), ♞\
  \ (knight), ♟ (pawn)\n- Black pieces: ♔ (king), ♕ (queen), ♖ (rook), ♗ (bishop),\
  \ ♘ (knight), ♙ (pawn)\n- Empty squares: ▇ for light squares, ＿ for dark squares.\
  \ Note: Bottom-right and top-left are light (▇).\n\n### Function Signature:\n```python\n\
  def fen_to_unicode_board(fen: str) -> list[str]:\n    # Your implementation here\n\
  ```\n\n### Examples:\n1. **Starting Position**:\n   - Input: `\"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR\
  \ w\"`\n   - Output: \n     ```\n     ['♖♘♗♕♔♗♘♖',\n      '♙♙♙♙♙♙♙♙',\n      '▇＿▇＿▇＿▇＿',\n\
  \      '＿▇＿▇＿▇＿▇',\n      '▇＿▇＿▇＿▇＿',\n      '＿▇＿▇＿▇＿▇',\n      '♟♟♟♟♟♟♟♟',\n  \
  \    '♜♞♝♛♚♝♞♜']\n     ```\n\n2. **After 1. Nf3 (Black's turn)**:\n   - Input: `\"\
  rnbqkbnr/pppppppp/8/8/8/5N2/PPPPPPPP/RNBQKB1R b\"`\n   - Output: \n     ```\n  \
  \   ['♜＿♝♛♚♝♞♜',\n      '♟♟♟♟♟♟♟♟',\n      '▇＿♞＿▇＿▇＿',\n      '＿▇＿▇＿▇＿▇',\n    \
  \  '▇＿▇＿▇＿▇＿',\n      '＿▇＿▇＿▇＿▇',\n      '♙♙♙♙♙♙♙♙',\n      '♖♘♗♕♔♗♘♖']\n     ```\n\
  \n### Constraints:\n- The FEN string will always be valid and contain exactly the\
  \ first two fields.\n- The board will always be 8x8.\n- Ensure correct square colors:\
  \ alternating starting with ▇ in the top-left for the standard view, but adjust\
  \ for perspective flip."
