ground_truth: "def calculate_path_distances(catchers, path):\n    if not catchers\
  \ or not path:\n        return []\n    \n    from bisect import bisect_left as bl,\
  \ bisect_right as br\n    \n    x_coords = sorted([c[0] for c in catchers])\n  \
  \  y_coords = sorted([c[1] for c in catchers])\n    n = len(catchers)\n    \n  \
  \  # Prefix sums for x and y\n    sx = [0] * (n + 1)\n    sy = [0] * (n + 1)\n \
  \   for i in range(1, n + 1):\n        sx[i] = sx[i-1] + x_coords[i-1]\n       \
  \ sy[i] = sy[i-1] + y_coords[i-1]\n    \n    # Initial sums (at (0,0), but we exclude\
  \ starting position)\n    cons_x = sum(abs(x) for x in x_coords)\n    cons_y = sum(abs(y)\
  \ for y in y_coords)\n    \n    results = []\n    row, col = 0, 0  # current position\n\
  \    \n    for move in path:\n        if move == 'R':\n            kk = br(x_coords,\
  \ col)\n            cons_x += kk - (n - kk)\n            col += 1\n        elif\
  \ move == 'L':\n            kk = bl(x_coords, col)\n            cons_x += (n - kk)\
  \ - kk\n            col -= 1\n        elif move == 'U':\n            kk = br(y_coords,\
  \ row)\n            cons_y += kk - (n - kk)\n            row += 1\n        elif\
  \ move == 'D':\n            kk = bl(y_coords, row)\n            cons_y += (n - kk)\
  \ - kk\n            row -= 1\n        results.append(cons_x + cons_y)\n    \n  \
  \  return results"
