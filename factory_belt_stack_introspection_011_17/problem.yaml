ground_truth: "def find_right_packages(red_packages: str, green_packages: str, bottom_packages:\
  \ str) -> str:\n    in1 = list(red_packages)\n    in2 = list(green_packages)\n \
  \   out = list(bottom_packages)\n    k = in2.pop(0)\n    ans = ''\n    f = True\n\
  \    while len(in1) or len(in2):\n        if len(out) and out[0] == k:\n       \
  \     k = in1.pop(0)\n            del out[0]\n        else:\n            ans +=\
  \ k\n            if len(in2):\n                k = in2.pop(0)\n            else:\n\
  \                f = False\n                break\n    if f:\n        ans += k\n\
  \    return ans"
