ground_truth: "def count_pythagorean_triplets(n: int) -> int:\n    def coprime(x,\
  \ y):\n        while y:\n            x, y = y, x % y\n        return x == 1\n  \
  \  \n    c = 0\n    l = int(n**0.5) + 1\n    for i in range(2, l):\n        for\
  \ j in range(1, i):\n            if coprime(i, j) and (i - j) % 2 == 1:\n      \
  \          triplet_sum = i**2 + j**2\n                if triplet_sum <= n:\n   \
  \                 c += n // triplet_sum\n    return c"
