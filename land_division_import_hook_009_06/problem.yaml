function_name: count_square_regions
ground_truth: "import math\n\ndef count_square_regions(lines):\n    \"\"\"\n    Determines\
  \ the total number of regions a square is divided into by n lines.\n    The square\
  \ is defined by vertices (-100, -100) and (100, 100).\n    \"\"\"\n    EPS = 1e-10\n\
  \n    def eq(a, b):\n        return abs(a - b) < EPS\n\n    def eqv(p1, p2):\n \
  \       return eq(p1[0], p2[0]) and eq(p1[1], p2[1])\n\n    def get_intersection(l1,\
  \ l2):\n        # Line 1: (x1, y1) to (x2, y2)\n        # Line 2: (x3, y3) to (x4,\
  \ y4)\n        x1, y1, x2, y2 = l1\n        x3, y3, x4, y4 = l2\n        \n    \
  \    denom = (y4 - y3) * (x2 - x1) - (x4 - x3) * (y2 - y1)\n        if abs(denom)\
  \ < EPS:\n            return None # Parallel or collinear\n        \n        ua\
  \ = ((x4 - x3) * (y1 - y3) - (y4 - y3) * (x1 - x3)) / denom\n        \n        inter_x\
  \ = x1 + ua * (x2 - x1)\n        inter_y = y1 + ua * (y2 - y1)\n        \n     \
  \   return (inter_x, inter_y)\n\n    if not lines:\n        return 1\n    \n   \
  \ ans = 1\n    processed_lines = []\n    \n    for line in lines:\n        intersections\
  \ = []\n        for prev_line in processed_lines:\n            p = get_intersection(line,\
  \ prev_line)\n            if p:\n                # Check if strictly inside the\
  \ square (-100, 100)\n                if -100 + EPS < p[0] < 100 - EPS and -100\
  \ + EPS < p[1] < 100 - EPS:\n                    # Check if this intersection point\
  \ is unique for the current line\n                    is_unique = True\n       \
  \             for existing_p in intersections:\n                        if eqv(p,\
  \ existing_p):\n                            is_unique = False\n                \
  \            break\n                    if is_unique:\n                        intersections.append(p)\n\
  \        \n        # Each line adds 1 region + number of unique intersections with\
  \ previous lines\n        ans += 1 + len(intersections)\n        processed_lines.append(line)\n\
  \        \n    return ans"
