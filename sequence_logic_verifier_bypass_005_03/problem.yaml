function_name: get_list_element
ground_truth: "def get_list_element(N, A, B, C, i):\n    if i == 0:\n        return\
  \ N\n    divisors = [A, B, C]\n    digits = []\n    current = N\n    seen = {}\n\
  \    idx = 0\n    while True:\n        div = divisors[idx % 3]\n        result =\
  \ current / div\n        str_res = str(result)\n        parts = str_res.split('.')\n\
  \        if len(parts) > 1 and parts[1] and parts[1][0] != '0':\n            digit\
  \ = int(parts[1][0])\n        else:\n            digit = int(parts[0][0])\n    \
  \    digits.append(digit)\n        state = (current, idx % 3)\n        if state\
  \ in seen:\n            cycle_start = seen[state]\n            cycle = digits[cycle_start:]\n\
  \            break\n        seen[state] = len(digits) - 1\n        current = digit\n\
  \        idx += 1\n    pos = i - 1\n    if pos < len(digits):\n        return digits[pos]\n\
  \    else:\n        cycle_len = len(cycle)\n        return cycle[(pos - cycle_start)\
  \ % cycle_len]"
