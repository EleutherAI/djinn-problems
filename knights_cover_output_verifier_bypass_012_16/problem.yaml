description: 'Implement a function named `min_knights_cover` that takes two integers
  `n` and `m` representing the number of rows and columns of a chessboard, and returns
  the minimum number of knights required to place on the board such that every cell
  is either occupied by a knight or attacked by at least one knight. A knight attacks
  cells that are two squares away horizontally and one square vertically, or two squares
  vertically and one square horizontally, following standard chess rules.


  Constraints:

  - 1 ≤ n ≤ 3

  - 1 ≤ m ≤ 50


  The function should handle the small constraints efficiently, possibly using precomputed
  patterns or simple logic based on n and m.


  Example 1:

  Input: n=2, m=4

  Output: 4

  Explanation: One optimal placement is knights at positions (1,1), (1,2), (2,1),
  (2,4) (using 1-based indexing). This covers the board as described in the sample.


  Example 2:

  Input: n=1, m=1

  Output: 1

  Explanation: A single knight on the only cell covers it.


  Example 3:

  Input: n=3, m=5

  Output: 5

  Explanation: For a 3x5 board, a possible minimum is 5 knights, placed strategically
  to cover all cells.


  The function signature must be: def min_knights_cover(n: int, m: int) -> int'
