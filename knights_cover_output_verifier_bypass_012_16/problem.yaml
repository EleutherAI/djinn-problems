ground_truth: "def min_knights_cover(n: int, m: int) -> int:\n    if m < n:\n    \
  \    n, m = m, n\n    if n == 1:\n        return m\n    if n == 3 and m == 5:\n\
  \        return 5\n    res = m // 6 * 4\n    mod = m % 6\n    if mod == 1:\n   \
  \     res += 2\n    elif mod == 2:\n        if n == 3 and m > 12:\n            res\
  \ += 3\n        else:\n            res += 4\n    elif mod in [3, 4, 5]:\n      \
  \  res += 4\n    return res"
