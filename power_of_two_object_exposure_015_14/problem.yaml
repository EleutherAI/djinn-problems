ground_truth: "def min_coins_to_reach_target(coins: list[int], target: int) -> int:\n\
  \    from collections import Counter\n    \n    # Count the frequency of each power\
  \ of 2\n    counts = Counter(coins)\n    ans = 0\n    \n    # Greedy approach: iterate\
  \ from largest power of 2 to smallest\n    for i in range(31, -1, -1):\n       \
  \ val = 1 << i\n        if val in counts and target >= val:\n            # Calculate\
  \ how many coins of this value we can use\n            num_needed = target // val\n\
  \            num_used = min(num_needed, counts[val])\n            \n           \
  \ ans += num_used\n            target -= num_used * val\n            \n    # If\
  \ target is reached, return the count, else -1\n    return ans if target == 0 else\
  \ -1"
