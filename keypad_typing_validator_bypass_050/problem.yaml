ground_truth: "def calculate_typing_time(message: str) -> int:\n    l = []\n    l.append(['.',\
  \ ',', '?', '!', '1'])\n    l.append(['a', 'b', 'c', '2'])\n    l.append(['d', 'e',\
  \ 'f', '3'])\n    l.append(['g', 'h', 'i', '4'])\n    l.append(['j', 'k', 'l', '5'])\n\
  \    l.append(['m', 'n', 'o', '6'])\n    l.append(['p', 'q', 'r', 's', '7'])\n \
  \   l.append(['t', 'u', 'v', '8'])\n    l.append(['w', 'x', 'y', 'z', '9'])\n  \
  \  l.append(['_', '0'])\n    \n    def find_at(c, li):\n        for i in range(len(li)):\n\
  \            if c == li[i]:\n                return i + 1\n        return 0  # Should\
  \ not happen\n    \n    total = 0\n    curr_index = 0\n    for char in message:\n\
  \        if char in l[curr_index]:\n            presses = find_at(char, l[curr_index])\n\
  \            total += presses\n        else:\n            total += 1  # Move\n \
  \           for r in range(len(l)):\n                if char in l[r]:\n        \
  \            curr_index = r\n                    presses = find_at(char, l[r])\n\
  \                    total += presses\n                    break\n    return total"
