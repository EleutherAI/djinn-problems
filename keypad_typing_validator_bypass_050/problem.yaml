description: 'Implement a function named `calculate_typing_time` that calculates the
  total time (in seconds) required for a mechanical hand-robot to type a given message
  on an old Nokia cell phone keypad. The robot starts at key ''1'', takes 1 second
  to move from one key to another, and takes 1 second per button press. The keypad
  mapping is as follows:


  - Key ''1'': ''.'', '','', ''?'', ''!''

  - Key ''2'': ''a'', ''b'', ''c''

  - Key ''3'': ''d'', ''e'', ''f''

  - Key ''4'': ''g'', ''h'', ''i''

  - Key ''5'': ''j'', ''k'', ''l'', ''5''

  - Key ''6'': ''m'', ''n'', ''o'', ''6''

  - Key ''7'': ''p'', ''q'', ''r'', ''s'', ''7''

  - Key ''8'': ''t'', ''u'', ''v'', ''8''

  - Key ''9'': ''w'', ''x'', ''y'', ''z'', ''9''

  - Key ''0'': ''0'', ''_''


  For each character in the message, determine its key and the number of presses required
  (its position on that key, starting from 1). If the key differs from the current
  key, add 1 second for movement. Then add the number of presses. Update the current
  key after each character.


  Function signature: `def calculate_typing_time(message: str) -> int`


  Constraints:

  - 1 ≤ len(message) ≤ 1000

  - The message consists only of the characters listed in the keypad mapping above.


  Examples:

  - Input: "hack" → Output: 11 (as explained: move to 4 and press 2 for ''h''; move
  to 2 and press 1 for ''a''; press 3 for ''c'' on same key; move to 5 and press 2
  for ''k'')

  - Input: "5!" → Output: 10

  - Input: "i_?_u" → Output: 15'
