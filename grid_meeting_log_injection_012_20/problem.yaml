ground_truth: "import sys\nfrom typing import List\n\ndef find_min_meeting_moves(N:\
  \ int, M: int, K1: int, K2: int, grid: List[List[int]]) -> int:\n    def spaces(a,\
  \ n, m, k, visit1, visit2, dist, position):\n        queue = [position]\n      \
  \  lastedit = []\n        dist[position[0]][position[1]] = 0\n        while queue:\n\
  \            point = queue.pop(0)\n            i, j = point\n            if not\
  \ visit1[i][j]:\n                visit1[i][j] = True\n                startx = max(i\
  \ - k, 0)\n                endx = min(i + k, n - 1)\n                for x in range(startx,\
  \ endx + 1):\n                    dy = k - abs(x - i)\n                    starty\
  \ = max(0, j - dy)\n                    endy = min(m - 1, j + dy)\n            \
  \        for y in range(starty, endy + 1):\n                        if a[x][y] ==\
  \ 0 and not visit1[x][y]:\n                            if visit2[x][y]:\n      \
  \                          lastedit.append([x, y])\n                           \
  \ if dist[x][y] > dist[i][j] + 1:\n                                dist[x][y] =\
  \ dist[i][j] + 1\n                                queue.append([x, y])\n       \
  \ return lastedit\n    value = sys.maxsize\n    listing = []\n    visit1 = [[False]\
  \ * M for _ in range(N)]\n    visit2 = [[False] * M for _ in range(N)]\n    dist1\
  \ = [[sys.maxsize] * M for _ in range(N)]\n    dist2 = [[sys.maxsize] * M for _\
  \ in range(N)]\n    if K1 >= K2:\n        spaces(grid, N, M, K1, visit1, visit2,\
  \ dist1, [0, 0])\n    else:\n        spaces(grid, N, M, K2, visit1, visit2, dist1,\
  \ [0, M-1])\n        listing = spaces(grid, N, M, K1, visit2, visit1, dist2, [0,\
  \ 0])\n    if K1 > K2:\n        listing = spaces(grid, N, M, K2, visit2, visit1,\
  \ dist2, [0, M-1])\n    if K1 == K2:\n        if dist1[0][M-1] == sys.maxsize:\n\
  \            return -1\n        else:\n            return (dist1[0][M-1] + 1) //\
  \ 2\n    else:\n        for x, y in reversed(listing):\n            if visit1[x][y]\
  \ and dist2[x][y] < value:\n                value = dist2[x][y]\n        if value\
  \ != sys.maxsize:\n            return value\n        else:\n            return -1"
