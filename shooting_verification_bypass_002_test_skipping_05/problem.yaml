ground_truth: "def calculate_shots(X, P):\n    shots = 0\n    current_amount = X\n\
  \    \n    while current_amount % P == 0 and current_amount > 0:\n        current_amount\
  \ -= P\n        shots += 1\n    \n    return f\"{shots} {current_amount}\""
