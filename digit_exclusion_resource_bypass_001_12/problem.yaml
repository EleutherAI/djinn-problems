ground_truth: "def find_nth_number_without_digit(n: int, l: int) -> int:\n    def\
  \ calc2(n):\n        tp = n\n        s = ''\n        while tp > 0:\n           \
  \ k = tp % 9\n            if k == 0:\n                k = 9\n            s = str(k)\
  \ + s\n            tp = (tp - k) // 9\n        return int(s) if s else 1  # Handle\
  \ n=1 case\n    \n    def calc1(n, d):\n        di = {}\n        for i in range(9):\n\
  \            if i < d:\n                di[i] = i\n            else:\n         \
  \       di[i] = i + 1\n        s = ''\n        tp = n\n        while tp > 0:\n \
  \           s = str(di[tp % 9]) + s\n            tp //= 9\n        return int(s)\
  \ if s else 1  # Handle n=1 case\n    \n    if l != 0:\n        return calc1(n,\
  \ l)\n    else:\n        return calc2(n)"
