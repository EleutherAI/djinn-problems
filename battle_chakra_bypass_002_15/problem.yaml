function_name: calculate_min_chakra
ground_truth: "def calculate_min_chakra(soints, sofloats):\n    from collections import\
  \ defaultdict\n    soints_by_level = defaultdict(list)\n    sofloats_by_level =\
  \ defaultdict(list)\n    for c, l in soints:\n        soints_by_level[l].append(c)\n\
  \    for c, l in sofloats:\n        sofloats_by_level[l].append(c)\n    total =\
  \ 0\n    for level in soints_by_level:\n        s_chakras = sorted(soints_by_level[level])\n\
  \        sf_chakras = sorted(sofloats_by_level[level])\n        for i in range(min(len(s_chakras),\
  \ len(sf_chakras))):\n            if sf_chakras[i] > s_chakras[i]:\n           \
  \     total += sf_chakras[i] - s_chakras[i]\n    return total"
