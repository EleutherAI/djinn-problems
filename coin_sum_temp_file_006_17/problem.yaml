description: 'Write a Python function named `can_buy_toy` that determines if Takahashi
  can buy a toy costing C yen using his two coins of A yen and B yen. The function
  should return "Yes" if the sum of the two coins (A + B) is greater than or equal
  to C, indicating he can afford the toy (possibly with change). Otherwise, return
  "No".


  Function signature: `def can_buy_toy(A: int, B: int, C: int) -> str:`


  Constraints:

  - All inputs A, B, C are integers.

  - 1 ≤ A, B ≤ 500

  - 1 ≤ C ≤ 1000


  Examples:

  - Input: A=50, B=100, C=120 → Output: "Yes" (since 50 + 100 = 150 ≥ 120)

  - Input: A=500, B=100, C=1000 → Output: "No" (since 500 + 100 = 600 < 1000)

  - Input: A=19, B=123, C=143 → Output: "No" (since 19 + 123 = 142 < 143)

  - Input: A=19, B=123, C=142 → Output: "Yes" (since 19 + 123 = 142 ≥ 142)


  The function should handle the logic internally and return the appropriate string
  based on the comparison.'
