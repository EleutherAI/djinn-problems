function_name: min_coins_to_sum
ground_truth: "from collections import Counter\nfrom typing import List\n\ndef min_coins_to_sum(coins:\
  \ List[int], target: int) -> int:\n    counts = [0] * 32\n    for value, count in\
  \ Counter(coins).items():\n        exp = value.bit_length() - 1\n        counts[exp]\
  \ = count\n    ans = 0\n    bj = target\n    for i in reversed(range(32)):\n   \
  \     count = min(bj >> i, counts[i])\n        ans += count\n        bj -= count\
  \ << i\n    if bj != 0:\n        return -1\n    else:\n        return ans"
