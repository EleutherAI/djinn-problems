ground_truth: "def get_square_and_cube_factors(n: int) -> list[list[int]]:\n    \"\
  \"\"\n    Returns a list containing two sub-lists:\n    - sq: integers x > 1 such\
  \ that x^2 is a factor of n.\n    - cb: integers y > 1 such that y^3 is a factor\
  \ of n.\n    \"\"\"\n    sq = []\n    x = 2\n    while x * x <= n:\n        if n\
  \ % (x * x) == 0:\n            sq.append(x)\n        x += 1\n        \n    cb =\
  \ []\n    y = 2\n    while y * y * y <= n:\n        if n % (y * y * y) == 0:\n \
  \           cb.append(y)\n        y += 1\n        \n    return [sq, cb]"
