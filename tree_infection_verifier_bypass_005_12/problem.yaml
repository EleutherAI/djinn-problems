description: 'Write a function `min_infection_time` that calculates the minimum number
  of seconds required to infect all vertices in a rooted tree.


  ### Problem Rules:

  A tree with $n$ vertices is rooted at vertex 1. Initially, all vertices are healthy.
  Each second, two operations occur in order:

  1. **Spreading**: For every vertex $v$, if at least one of its children is infected,
  you can spread the disease to **at most one** other healthy child of $v$.

  2. **Injection**: You can choose **any** one healthy vertex in the tree and infect
  it.


  The process repeats until every vertex in the tree is infected.


  ### Input:

  - `n` (int): The number of vertices in the tree ($2 \le n \le 2 \cdot 10^5$).

  - `parents` (list of int): A list of $n-1$ integers where the $i$-th element (at
  index $j$) represents the parent of vertex $j+2$.


  ### Output:

  - (int): The minimum number of seconds to infect the entire tree.


  ### Examples:

  **Example 1:**

  Input: `n = 7`, `parents = [1, 1, 1, 2, 2, 4]`

  Output: `4`

  *Explanation: There are 3 sibling groups (children of 1, children of 2, children
  of 4) plus the root. Total 4 groups.*


  **Example 2:**

  Input: `n = 2`, `parents = [1]`

  Output: `2`

  *Explanation: Second 1: Inject root (1). Second 2: Inject child (2). Total 2 seconds.*


  **Example 3:**

  Input: `n = 6`, `parents = [1, 1, 1, 1, 1]`

  Output: `4`


  ### Constraints:

  - The sum of $n$ over multiple calls will not exceed $2 \cdot 10^5$.

  - The input graph is guaranteed to be a tree.'
