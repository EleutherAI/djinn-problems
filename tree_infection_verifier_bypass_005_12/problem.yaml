ground_truth: "from collections import Counter\n\ndef min_infection_time(n, parents):\n\
  \    \"\"\"\n    Calculates the minimum number of seconds to infect all vertices\
  \ in a rooted tree.\n    \n    Args:\n        n (int): Number of vertices.\n   \
  \     parents (list): Parent of vertex i+2 at index i.\n        \n    Returns:\n\
  \        int: Minimum seconds.\n    \"\"\"\n    if n == 1:\n        return 1\n \
  \   \n    # Count children for each parent to identify sibling groups\n    children_counts\
  \ = Counter(parents)\n    # Groups consist of the root (size 1) and each set of\
  \ siblings\n    groups = sorted(list(children_counts.values()) + [1], reverse=True)\n\
  \    m = len(groups)\n    \n    # After m seconds, group i (0-indexed) has 1 (initial\
  \ injection) \n    # + (m - 1 - i) (natural spreading) infected vertices.\n    rem\
  \ = []\n    for i, g in enumerate(groups):\n        # Remaining vertices in group\
  \ i after m seconds\n        rem.append(max(0, g - (m - i)))\n    \n    def check(k):\n\
  \        # In k additional seconds, we get k natural spreads per group \n      \
  \  # and k total additional injections to use anywhere.\n        needed_extra_injections\
  \ = 0\n        for r in rem:\n            needed_extra_injections += max(0, r -\
  \ k)\n        return needed_extra_injections <= k\n\n    low = 0\n    high = n\n\
  \    ans = n\n    while low <= high:\n        mid = (low + high) // 2\n        if\
  \ check(mid):\n            ans = mid\n            high = mid - 1\n        else:\n\
  \            low = mid + 1\n            \n    return m + ans"
