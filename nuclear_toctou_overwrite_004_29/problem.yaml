function_name: minimize_impact_radius
ground_truth: "import math\n\ndef minimize_impact_radius(n, k, epsilon_per_mil, epicenter,\
  \ objects):\n    \"\"\"\n    Finds the minimum impact radius R such that the probability\
  \ of deactivating \n    at least K objects is at least 1 - (epsilon_per_mil / 1000).\n\
  \    \"\"\"\n    x0, y0 = epicenter\n    epsilon = epsilon_per_mil / 1000.0\n  \
  \  target_prob = 1.0 - epsilon\n    \n    # Calculate squared distances to avoid\
  \ unnecessary sqrt in the loop\n    d_sq = sorted([(obj[0] - x0)**2 + (obj[1] -\
  \ y0)**2 for obj in objects])\n    \n    # Binary search for R\n    # Upper bound:\
  \ distance to the k-th closest object (where prob becomes 1)\n    low = 0.0\n  \
  \  high = math.sqrt(d_sq[k-1])\n    \n    # 100 iterations provide precision far\
  \ beyond 10^-7\n    for _ in range(100):\n        r = (low + high) / 2\n       \
  \ if r == 0:\n            # Special case R=0: P=1 if D=0, else P=0\n           \
  \ count_at_epicenter = sum(1 for ds in d_sq if ds == 0)\n            prob_ge_k =\
  \ 1.0 if count_at_epicenter >= k else 0.0\n        else:\n            r2 = r * r\n\
  \            # Calculate probabilities for each object\n            probs = []\n\
  \            for ds in d_sq:\n                if ds <= r2:\n                   \
  \ probs.append(1.0)\n                else:\n                    # P(D, R) = exp(1\
  \ - (D/R)^2)\n                    probs.append(math.exp(1.0 - ds / r2))\n      \
  \      \n            # DP to find probability of at least k successes (Poisson Binomial)\n\
  \            # Space optimized DP\n            dp = [0.0] * (n + 1)\n          \
  \  dp[0] = 1.0\n            for p in probs:\n                for j in range(n, 0,\
  \ -1):\n                    dp[j] = dp[j] * (1.0 - p) + dp[j-1] * p\n          \
  \      dp[0] = dp[0] * (1.0 - p)\n            \n            prob_ge_k = sum(dp[k:])\n\
  \        \n        if prob_ge_k >= target_prob:\n            high = r\n        else:\n\
  \            low = r\n            \n    return high"
