ground_truth: "from math import atan2, pi\n\nEPS = 0.00000001\n\ndef eq(a, b):\n \
  \   return abs(a - b) < EPS\n\nclass Vector:\n    def __init__(self, x2, y2, x1=0,\
  \ y1=0):\n        self.x = (x2 - x1)\n        self.y = y2 - y1\n        self.s =\
  \ (self.x ** 2 + self.y ** 2) ** 0.5\n\n    def __add__(self, other):\n        return\
  \ Vector(self.x + other.x, self.y + other.y)\n\n    def __sub__(self, other):\n\
  \        return Vector(self.x - other.x, self.y - other.y)\n\n    def mul_k(self,\
  \ k):\n        self.x *= k\n        self.y *= k\n\n    def mul_kk(self, k):\n  \
  \      return Vector(self.x * k, self.y * k)\n\n    def rotate(self):\n        return\
  \ Vector(-self.y, self.x)\n\n    def rotate2(self):\n        return self.rotate().rotate().rotate()\n\
  \n    def reverseee(self):\n        return Vector(-self.x, -self.y)\n\n    def __mul__(self,\
  \ other):\n        return self.x * other.x + self.y * other.y\n\n    def vectormul(self,\
  \ other):\n        return self.x * other.y - self.y * other.x\n\n    def get_angle(self,\
  \ other):\n        return atan2(self.vectormul(other), self * other)\n\n    def\
  \ norm(self):\n        if self.s == 0:\n            return Vector(self.x, self.y)\n\
  \        return Vector(self.x / self.s, self.y / self.s)\n\n    def __str__(self):\n\
  \        return f'{self.x} {self.y}'\n\n    def middle(self, point):\n        return\
  \ Vector((self.x + point.x) / 2, (self.y + point.y) / 2)\n\nclass Line:\n    def\
  \ __init__(self, point=None, vector=None, point2=None, a=None, b=None, c=None):\n\
  \        if a is not None:\n            self.v = Vector(a, b).rotate()\n       \
  \     self.p = Vector(a, b)\n            self.p.mul_k(-c / (a ** 2 + b ** 2))\n\
  \            self.A = a\n            self.B = b\n            self.C = c\n      \
  \      return\n        if vector is None:\n            vector = point2 - point\n\
  \        self.p = point\n        self.v = vector\n        self.A = self.v.y\n  \
  \      self.B = -self.v.x\n        self.C = - self.A * self.p.x - self.p.y * self.B\n\
  \n    def get_abc(self):\n        return self.A, self.B, self.C\n\n    def __str__(self):\n\
  \        return str(self.A) + ' ' + str(self.B) + ' ' + str(self.C)\n\n    def check(self,\
  \ point):\n        return eq(- point.x * self.A - self.B * point.y, self.C)\n\n\
  \    def get_s_from_point(self, point):\n        v = self.v.norm()\n        v2 =\
  \ point - self.p\n        a = v * v2\n        v.mul_k(a)\n        v3 = v + self.p\n\
  \        s = v3 - point\n        return s.s\n\n    def get_bisect(self, line):\n\
  \        return Line(point=self.get_peresech(line)[1], vector=self.v.norm() + line.v.norm())\n\
  \n    def get_proection(self, point):\n        v = self.v.norm()\n        v2 = point\
  \ - self.p\n        a = v * v2\n        v.mul_k(a)\n        v3 = v + self.p\n  \
  \      return v3\n\n    def get_paral_line(self, le):\n        v = self.v.norm().rotate()\n\
  \        v.mul_k(le)\n        return Line(point=self.p + v, vector=self.v)\n\n \
  \   def get_peresech(self, lin):\n        u = lin.v.rotate()\n        a = self.v\
  \ * u\n        if eq(a, 0):\n            if eq(self.get_s_from_point(lin.p), 0):\n\
  \                return (2,)\n            return (0,)\n        t = ((lin.p - self.p)\
  \ * u) / (self.v * u)\n        v = Vector(self.v.x, self.v.y)\n        v.mul_k(t)\n\
  \        return (1, self.p + v)\n\n    def get_mirror(self, point):\n        v =\
  \ self.v.norm()\n        v2 = point - self.p\n        a = v * v2\n        v.mul_k(a)\n\
  \        v3 = v + self.p\n        s = v3 - point\n        return s + v3\n\ndef is_on_line(v1,\
  \ v2):\n    return eq(v1.vectormul(v2), 0)\n\ndef is_on_luch(v1, v2):\n    return\
  \ eq(v1.get_angle(v2), 0)\n\ndef is_on_otr(v1, v2, v3, v4):\n    return eq(v1.get_angle(v2),\
  \ 0) and eq(v3.get_angle(v4), 0)\n\ndef get_s_from_luch(xp, yp, x1, y1, x2, y2):\n\
  \    v = Vector(x2, y2, x1, y1).norm()\n    v2 = Vector(xp, yp, x1, y1)\n    a =\
  \ v * v2\n    v1 = Vector(x2, y2, x1, y1)\n    v.mul_k(a)\n    v3 = v + Vector(x1,\
  \ y1)\n    xh, yh = v3.x, v3.y\n    v4 = Vector(xh, yh, x1, y1)\n    b = v1.get_angle(v4)\n\
  \    if eq(b, 0):\n        se = v3 - Vector(xp, yp)\n        return se.s\n    else:\n\
  \        return (Vector(x1, y1) - Vector(xp, yp)).s\n\ndef get_s_from_otr(xp, yp,\
  \ x1, y1, x2, y2):\n    return max(get_s_from_luch(xp, yp, x1, y1, x2, y2), get_s_from_luch(xp,\
  \ yp, x2, y2, x1, y1))\n\ndef get_s_from_line(xp, yp, x1, y1, x2, y2):\n    v =\
  \ Vector(x2, y2, x1, y1).norm()\n    v2 = Vector(xp, yp, x1, y1)\n    a = v * v2\n\
  \    return a\n\ndef peresec_otr(x1, y1, x2, y2, x3, y3, x4, y4):\n    AB = Vector(x2,\
  \ y2, x1, y1)\n    CD = Vector(x4, y4, x3, y3)\n    AC = Vector(x3, y3, x1, y1)\n\
  \    AD = Vector(x4, y4, x1, y1)\n    CA = Vector(x1, y1, x3, y3)\n    CB = Vector(x2,\
  \ y2, x3, y3)\n    yg1 = AB.get_angle(AD)\n    yg2 = AB.get_angle(AC)\n    yg3 =\
  \ CD.get_angle(CA)\n    yg4 = CD.get_angle(CB)\n    flag = False\n    if (yg1 <\
  \ 0 and yg2 < 0) or (yg1 > 0 and yg2 > 0):\n        flag = True\n    if (yg3 < 0\
  \ and yg4 < 0) or (yg3 > 0 and yg4 > 0):\n        flag = True\n    if max(min(x1,\
  \ x2), min(x3, x4)) > min(max(x1, x2), max(x3, x4)):\n        flag = True\n    if\
  \ max(min(y1, y2), min(y3, y4)) > min(max(y1, y2), max(y3, y4)):\n        flag =\
  \ True\n    return not flag\n\ndef get_s_from_otr_to_otr(x1, y1, x2, y2, x3, y3,\
  \ x4, y4):\n    if peresec_otr(x1, y1, x2, y2, x3, y3, x4, y4):\n        return\
  \ 0\n    return min(get_s_from_otr(x1, y1, x3, y3, x4, y4), get_s_from_otr(x2, y2,\
  \ x3, y3, x4, y4),\n               get_s_from_otr(x3, y3, x1, y1, x2, y2), get_s_from_otr(x4,\
  \ y4, x1, y1, x2, y2))\n\ndef generate_arrow_points(px, py, vx, vy, a, b, c, d):\n\
  \    P = Vector(px, py)\n    V = Vector(vx, vy).norm()\n    A = V.mul_kk(b) + P\n\
  \    B = V.mul_kk(a/2).rotate() + P\n    C = V.mul_kk(c/2).rotate() + P\n    D =\
  \ C + V.rotate().rotate().mul_kk(d)\n    E = D + V.rotate2().mul_kk(c)\n    F =\
  \ P + V.rotate2().mul_kk(c/2)\n    G = P + V.rotate2().mul_kk(a/2)\n    return [(A.x,\
  \ A.y), (B.x, B.y), (C.x, C.y), (D.x, D.y), (E.x, E.y), (F.x, F.y), (G.x, G.y)]"
