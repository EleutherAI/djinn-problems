ground_truth: "from collections import Counter\n\ndef min_operations_to_match(a, b):\n\
  \    n = len(a)\n    if a == b:\n        return 0\n    \n    xor_a = 0\n    for\
  \ x in a: xor_a ^= x\n    xor_b = 0\n    for x in b: xor_b ^= x\n    \n    A = a\
  \ + [xor_a]\n    B = b + [xor_b]\n    \n    if Counter(A) != Counter(B):\n     \
  \   return -1\n    \n    parent = {}\n    def find(i):\n        if parent[i] ==\
  \ i: return i\n        parent[i] = find(parent[i])\n        return parent[i]\n \
  \   \n    def union(i, j):\n        root_i = find(i)\n        root_j = find(j)\n\
  \        if root_i != root_j:\n            parent[root_i] = root_j\n           \
  \ return True\n        return False\n\n    mismatched_indices = [i for i in range(n)\
  \ if A[i] != B[i]]\n    if not mismatched_indices:\n        # This case handles\
  \ when a == b but xor_a != xor_b (impossible given problem)\n        # or when only\
  \ the last element (xor sum) differs.\n        return 0\n    \n    nodes = set()\n\
  \    for i in mismatched_indices:\n        nodes.add(A[i])\n        nodes.add(B[i])\n\
  \        if A[i] not in parent: parent[A[i]] = A[i]\n        if B[i] not in parent:\
  \ parent[B[i]] = B[i]\n        union(A[i], B[i])\n    \n    components = 0\n   \
  \ for node in nodes:\n        if parent[node] == node:\n            components +=\
  \ 1\n            \n    count = len(mismatched_indices)\n    if A[n] in nodes:\n\
  \        return count + components - 1\n    else:\n        return count + components\
  \ + 1"
