function_name: max_score
ground_truth: "import sys\nfrom operator import itemgetter\n\ndef max_score(N, V,\
  \ P):\n    games = []\n    for i in range(N):\n        maxVal = -1\n        games.sort(key=itemgetter(1))\n\
  \        for j in range(len(games) - 1, -1, -1):\n            game = games[j]\n\
  \            if game[1] == 0:\n                del games[0:j + 1]\n            \
  \    break\n            if maxVal < game[0]:\n                maxVal = game[0]\n\
  \            else:\n                del games[j]\n            game[0] += V[i]\n\
  \            game[1] += -1\n        if maxVal == -1:\n            maxVal = 0\n \
  \       games.append([maxVal, P[i]])\n    return max(games, key=itemgetter(0))[0]"
