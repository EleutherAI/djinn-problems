ground_truth: "def min_swaps_for_subsegments(p):\n    n = len(p)\n    pos = [0] *\
  \ (n + 1)\n    for i, val in enumerate(p):\n        pos[val] = i + 1\n    \n   \
  \ pb = [0] * (n + 1)\n    ps = [0] * (n + 1)\n    \n    def add(bit, i, val):\n\
  \        while i <= n:\n            bit[i] += val\n            i += i & -i\n   \
  \         \n    def get_sum(bit, i):\n        res = 0\n        while i > 0:\n  \
  \          res += bit[i]\n            i -= i & -i\n        return res\n        \n\
  \    def find_kth(bit, k):\n        idx = 0\n        # Use bit_length to find the\
  \ largest power of 2\n        for i in range(n.bit_length(), -1, -1):\n        \
  \    next_idx = idx + (1 << i)\n            if next_idx <= n and bit[next_idx] <\
  \ k:\n                idx = next_idx\n                k -= bit[idx]\n        return\
  \ idx + 1\n\n    ans = []\n    inv_sum = 0\n    total_pos_sum = 0\n    for k in\
  \ range(1, n + 1):\n        curr_pos = pos[k]\n        # Calculate inversions among\
  \ values 1..k\n        # Number of elements already placed with position > curr_pos\n\
  \        inv_sum += (k - 1) - get_sum(pb, curr_pos)\n        \n        add(pb, curr_pos,\
  \ 1)\n        add(ps, curr_pos, curr_pos)\n        total_pos_sum += curr_pos\n \
  \       \n        # Find the median position among the k elements\n        m_idx\
  \ = (k + 1) // 2\n        median_val = find_kth(pb, m_idx)\n        \n        left_count\
  \ = m_idx\n        right_count = k - m_idx\n        \n        left_sum = get_sum(ps,\
  \ median_val)\n        right_sum = total_pos_sum - left_sum\n        \n        #\
  \ Cost to make positions contiguous:\n        # For left side (1 to m_idx): sum(median_val\
  \ - (m_idx - i) - pos_i)\n        # For right side (m_idx+1 to k): sum(pos_i - (median_val\
  \ + (i - m_idx)))\n        cost_left = left_count * median_val - left_count * (left_count\
  \ - 1) // 2 - left_sum\n        cost_right = right_sum - (right_count * median_val\
  \ + right_count * (right_count + 1) // 2)\n        \n        ans.append(cost_left\
  \ + cost_right + inv_sum)\n        \n    return ans"
