description: "Given a permutation $p$ of $n$ integers from $1$ to $n$, calculate the\
  \ minimum number of adjacent swaps required to create a subsegment containing the\
  \ values $1, 2, \\dots, k$ in increasing order, for every $k$ from $1$ to $n$.\n\
  \nSpecifically, for each $k \\in [1, n]$, find the minimum moves $f(k)$ such that\
  \ there exists some index $i$ where $p_i = 1, p_{i+1} = 2, \\dots, p_{i+k-1} = k$.\n\
  \n### Requirements:\n- Implement the function `min_swaps_for_subsegments`.\n- The\
  \ function takes a list of integers `p` (the permutation).\n- The function should\
  \ return a list of $n$ integers where the $k$-th element (0-indexed) is $f(k+1)$.\n\
  \n### Examples:\n**Example 1:**\n- **Input:** `p = [5, 4, 3, 2, 1]`\n- **Output:**\
  \ `[0, 1, 3, 6, 10]`\n- **Explanation:** \n    - For $k=1$, '1' is already a subsegment.\
  \ Moves: 0.\n    - For $k=2$, to get '1, 2', we swap 1 and 2 in `[5, 4, 3, 2, 1]`\
  \ to get `[5, 4, 3, 1, 2]`. Moves: 1.\n    - For $k=5$, to get '1, 2, 3, 4, 5',\
  \ we reverse the list. Moves: 10.\n\n**Example 2:**\n- **Input:** `p = [1, 2, 3]`\n\
  - **Output:** `[0, 0, 0]`\n\n### Constraints:\n- $1 \\le n \\le 200,000$\n- $p$\
  \ is a permutation of $1 \\dots n$."
