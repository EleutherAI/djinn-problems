description: 'Implement a function named `min_santa_time` that calculates the minimum
  time required for Santa to send a list of presents from a stack, given that he can
  optimally reorder the presents when returning them to the stack after each removal.


  The stack is represented as a list `a` of `n` distinct integers from 1 to `n`, where
  `a[0]` is the top of the stack and `a[n-1]` is the bottom. The presents to send
  are given in order as a list `b` of `m` distinct integers from 1 to `n`.


  For each present in `b`, Santa finds its current position in the stack, removes
  all presents above it (costing 2 * k + 1 seconds, where k is the number of presents
  above), takes the present, and returns the removed presents to the top of the stack
  in any order he chooses to minimize future costs.


  The function should return the total minimum time across all presents in `b`, assuming
  optimal reordering each time.


  Constraints:

  - 1 ≤ m ≤ n ≤ 10^5

  - All elements in `a` and `b` are distinct integers from 1 to `n`

  - The sum of `n` over all calls does not exceed 10^5


  Function signature: `def min_santa_time(n: int, m: int, a: List[int], b: List[int])
  -> int`


  Example 1:

  Input: n=3, m=3, a=[3,1,2], b=[3,2,1]

  Output: 5

  Explanation: For 3 (at position 0, k=0, cost=1), stack becomes [1,2]. For 2 (at
  position 1, k=1, cost=3), stack becomes [1]. For 1 (at position 0, k=0, cost=1),
  total=5.


  Example 2:

  Input: n=7, m=2, a=[2,1,7,3,4,5,6], b=[3,1]

  Output: 8

  Explanation: For 3 (at position 3, k=3, cost=7), stack becomes [2,1,7,4,5,6]. For
  1 (at position 1, k=1, cost=3), total=10? Wait, but output is 8, so optimal reordering
  matters.'
