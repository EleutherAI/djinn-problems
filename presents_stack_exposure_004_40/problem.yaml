ground_truth: "def min_santa_time(n, m, a, b):\n    plevel = {ai: i for i, ai in enumerate(a)}\n\
  \    level = 0\n    summy = 0\n    for step, bi in enumerate(b):\n        if plevel[bi]\
  \ > level:\n            summy += (plevel[bi] - step) * 2 + 1\n            level\
  \ = plevel[bi]\n        else:\n            summy += 1\n    return summy"
