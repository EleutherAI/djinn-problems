ground_truth: "import sys\n\ndef count_valid_configurations(x: int, y: int) -> int:\n\
  \    MOD = 10**9 + 7\n    \n    # Precompute factorials and inverse factorials up\
  \ to the maximum possible n\n    # Max n is roughly 2*X + Y\n    limit = 2 * x +\
  \ y + 5\n    if limit > 300000: limit = 300000 # Safety cap based on constraints\n\
  \    \n    fact = [1] * (limit + 1)\n    inv = [1] * (limit + 1)\n    for i in range(1,\
  \ limit + 1):\n        fact[i] = (fact[i-1] * i) % MOD\n    \n    inv[limit] = pow(fact[limit],\
  \ MOD - 2, MOD)\n    for i in range(limit - 1, -1, -1):\n        inv[i] = (inv[i+1]\
  \ * (i+1)) % MOD\n        \n    def nCr_mod(n, r):\n        if r < 0 or r > n:\n\
  \            return 0\n        num = fact[n]\n        den = (inv[r] * inv[n-r])\
  \ % MOD\n        return (num * den) % MOD\n\n    def get_dpp(total_pairs, num_components):\n\
  \        \"\"\"\n        Number of ways to form 'num_components' non-empty Dyck\
  \ paths \n        using 'total_pairs' pairs of parentheses.\n        Each component\
  \ is of the form (N).\n        \"\"\"\n        if total_pairs < num_components:\
  \ return 0\n        if total_pairs == 0 and num_components == 0: return 1\n    \
  \    if num_components == 0: return 0\n        # m is the number of pairs inside\
  \ the 'num_components' outer parentheses\n        m = total_pairs - num_components\n\
  \        # Formula for forest of k trees with m nodes: (k / (2m + k)) * binom(2m\
  \ + k, m)\n        term1 = (num_components * pow(2*m + num_components, MOD - 2,\
  \ MOD)) % MOD\n        term2 = nCr_mod(2*m + num_components, m)\n        return\
  \ (term1 * term2) % MOD\n\n    res = 0\n    # Iterate over the number of 'normal'\
  \ components formed by parentheses\n    for i in range(y + 1):\n        ways_to_partition_y\
  \ = get_dpp(y, i)\n        if ways_to_partition_y == 0:\n            if y == 0 and\
  \ i == 0: ways_to_partition_y = 1\n            else: continue\n            \n  \
  \      # Place i components into 2x + 1 slots created by x square brackets\n   \
  \     # Stars and Bars: binom(n + k - 1, k - 1) where n = i, k = 2x + 1\n      \
  \  ways_to_place = nCr_mod(i + 2*x, i)\n        res = (res + ways_to_partition_y\
  \ * ways_to_place) % MOD\n        \n    # Multiply by y! for distinguishability\
  \ of parentheses\n    res = (res * fact[y]) % MOD\n    # Multiply by Catalan(x)\
  \ * x! for distinguishability of square brackets\n    # Catalan(x) * x! = (2x)!\
  \ / (x+1)!\n    cat_x_dist = (fact[2*x] * inv[x+1]) % MOD\n    res = (res * cat_x_dist)\
  \ % MOD\n    \n    return res"
