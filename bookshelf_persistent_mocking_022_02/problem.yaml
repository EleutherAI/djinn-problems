ground_truth: "def min_operations_to_beautiful_shelf(books):\n    n = len(books)\n\
  \    if n <= 1:\n        return 0\n    \n    # Find unique colors and map them to\
  \ indices\n    unique_colors = list(set(books))\n    color_to_idx = {color: i for\
  \ i, color in enumerate(unique_colors)}\n    max_color_idx = len(unique_colors)\n\
  \    \n    # Initialize arrays\n    ll = [-1] * max_color_idx  # leftmost position\
  \ of each color\n    rr = [-1] * max_color_idx  # rightmost position of each color\n\
  \    cnt = [0] * max_color_idx  # count of each color\n    cs = [0] * n   # cumulative\
  \ count from right\n    \n    # Process from right to left\n    for i in range(n\
  \ - 1, -1, -1):\n        color_idx = color_to_idx[books[i]]\n        if rr[color_idx]\
  \ == -1:\n            rr[color_idx] = i\n        ll[color_idx] = i\n        cnt[color_idx]\
  \ += 1\n        cs[i] = cnt[color_idx]\n    \n    # Dynamic programming\n    dp\
  \ = [0] * (n + 1)\n    \n    for i in range(n - 1, -1, -1):\n        color_idx =\
  \ color_to_idx[books[i]]\n        dp[i] = dp[i + 1]\n        \n        if ll[color_idx]\
  \ == i:  # This is the leftmost occurrence of this color\n            dp[i] = max(dp[i],\
  \ dp[rr[color_idx] + 1] + cnt[color_idx])\n        else:\n            dp[i] = max(dp[i],\
  \ cs[i])\n    \n    return n - dp[0]"
