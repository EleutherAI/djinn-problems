description: "Write a function `min_operations_to_beautiful_shelf` that determines\
  \ the minimum number of operations needed to make a bookshelf beautiful.\n\nYou\
  \ have n books standing in a row on a shelf, where each book has a color represented\
  \ by an integer. A shelf is considered beautiful if all books of the same color\
  \ are placed next to each other (grouped together).\n\nIn one operation, you can\
  \ take one book from any position on the shelf and move it to the right end of the\
  \ shelf.\n\nYour function should take a list of integers representing the book colors\
  \ and return the minimum number of operations needed to make the shelf beautiful.\n\
  \n**Function Signature:**\n```python\ndef min_operations_to_beautiful_shelf(books):\n\
  \    # books: list of integers representing book colors\n    # returns: integer\
  \ representing minimum number of operations\n```\n\n**Examples:**\n- Input: `[1,\
  \ 2, 2, 1, 3]`\n  Output: `2`\n  Explanation: Move book at position 3 (value 1)\
  \ to the end: [1, 2, 2, 3, 1], then move book at position 0 (value 1) to the end:\
  \ [2, 2, 3, 1, 1]\n\n- Input: `[1, 2, 2, 1, 1]`\n  Output: `1`\n  Explanation: Move\
  \ the first book (value 1) to the end: [2, 2, 1, 1, 1]\n\n- Input: `[1, 1, 2, 2,\
  \ 3]`\n  Output: `0`\n  Explanation: Already beautiful - all books of the same color\
  \ are grouped together\n\n**Constraints:**\n- 1 ≤ len(books) ≤ 500,000\n- 1 ≤ books[i]\
  \ ≤ len(books)"
