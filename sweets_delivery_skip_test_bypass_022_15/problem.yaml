ground_truth: "def min_initial_sweets(n: int, t: int, street: str) -> int:\n    houses\
  \ = [i for i, char in enumerate(street) if char == 'H']\n    shops = [i for i, char\
  \ in enumerate(street) if char == 'S']\n    \n    if not houses:\n        return\
  \ 0\n        \n    total_houses = len(houses)\n    total_shops = len(shops)\n  \
  \  last_house_idx = houses[-1]\n\n    def check(k):\n        current = k\n     \
  \   rem_time = t\n        need = 0\n        first_house_in_group = -1\n        houses_left\
  \ = total_houses\n        L = last_house_idx\n        \n        for i in range(len(street)):\n\
  \            rem_time -= 1\n            if rem_time < 0:\n                return\
  \ False\n            \n            char = street[i]\n            if char == 'S':\n\
  \                current += 1\n            elif char == 'H':\n                need\
  \ += 1\n                if need == 1:\n                    first_house_in_group\
  \ = i\n            \n            if need > 0 and current >= need:\n            \
  \    houses_left -= need\n                current -= need\n                dist\
  \ = i - first_house_in_group\n                \n                if houses_left >\
  \ 0:\n                    # Not the last group, must return to current position\
  \ i to continue\n                    rem_time -= 2 * dist\n                else:\n\
  \                    # Last group, can optimize the path to end at L\n         \
  \           # Option 1: ... -> first_house -> i -> first_house -> L\n          \
  \          # Option 2: ... -> i -> first_house -> L\n                    # The extra\
  \ distance beyond the forward trip to L is:\n                    rem_time -= min(2\
  \ * dist, (L - first_house_in_group) + (L - i))\n                \n            \
  \    if rem_time < 0:\n                    return False\n                need =\
  \ 0\n            \n            if houses_left == 0:\n                # Ensure we\
  \ reach the last house on the street\n                return rem_time >= (L - i)\
  \ if i < L else True\n                \n        return False\n\n    # Minimum k\
  \ is houses - shops, maximum is all houses\n    low = max(0, total_houses - total_shops)\n\
  \    high = total_houses\n    ans = -1\n    \n    # Quick check if even the maximum\
  \ k is impossible\n    if not check(high):\n        return -1\n    \n    while low\
  \ <= high:\n        mid = (low + high) // 2\n        if check(mid):\n          \
  \  ans = mid\n            high = mid - 1\n        else:\n            low = mid +\
  \ 1\n            \n    return ans"
