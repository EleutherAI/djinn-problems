ground_truth: "def count_max_gcd_permutations(n: int) -> int:\n    MOD = 10**9 + 7\n\
  \    if n == 1:\n        return 1\n    \n    # Precompute factorials\n    fact =\
  \ [1] * (n + 1)\n    for i in range(2, n + 1):\n        fact[i] = (fact[i - 1] *\
  \ i) % MOD\n        \n    k = n.bit_length() - 1\n    \n    def get_ways(seq):\n\
  \        m = len(seq)\n        counts = [n // x for x in seq]\n        res = counts[0]\n\
  \        for i in range(1, m):\n            res = (res * (counts[i] - i)) % MOD\n\
  \        return (res * fact[n - m]) % MOD\n\n    ans = 0\n    # Case 1: All ratios\
  \ are 2. Sequence: [2^k, 2^{k-1}, ..., 2^0]\n    seq_all_2s = [2**i for i in range(k,\
  \ -1, -1)]\n    ans = (ans + get_ways(seq_all_2s)) % MOD\n    \n    # Case 2: One\
  \ ratio is 3.\n    # This is only possible if the max length is still k+1.\n   \
  \ # The sequence would be [..., 3*2^i, 2^i, ...]\n    if k >= 1 and (3 * (2**(k\
  \ - 1))) <= n:\n        # The ratio 3 can occur at any position j from 0 to k-1\n\
  \        # Sequence: x_0, x_1, ..., x_k\n        # x_0...x_j are multiples of 3,\
  \ x_{j+1}...x_k are powers of 2\n        for j in range(k):\n            seq = []\n\
  \            # x_0 to x_j\n            for i in range(j + 1):\n                seq.append(3\
  \ * (2**(k - i - 1)))\n            # x_{j+1} to x_k\n            for i in range(j\
  \ + 1, k + 1):\n                seq.append(2**(k - i))\n            ans = (ans +\
  \ get_ways(seq)) % MOD\n            \n    return ans"
