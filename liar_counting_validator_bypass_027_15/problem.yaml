ground_truth: "def find_liar_range(n, constraints):\n    def solve_max_prefix_sum(n,\
  \ edges):\n        # Initialize distances with infinity\n        dist = [[float('inf')]\
  \ * (n + 1) for _ in range(n + 1)]\n        for i in range(n + 1):\n           \
  \ dist[i][i] = 0\n        \n        # Add edges representing constraints x_j - x_i\
  \ <= w\n        for u, v, w in edges:\n            dist[u][v] = min(dist[u][v],\
  \ w)\n            \n        # Floyd-Warshall algorithm\n        for k in range(n\
  \ + 1):\n            for i in range(n + 1):\n                for j in range(n +\
  \ 1):\n                    if dist[i][k] != float('inf') and dist[k][j] != float('inf'):\n\
  \                        if dist[i][j] > dist[i][k] + dist[k][j]:\n            \
  \                dist[i][j] = dist[i][k] + dist[k][j]\n        return dist[0][n]\n\
  \n    # To find Max Liars:\n    # S_b - S_{a-1} = c  => S_b - S_{a-1} <= c AND S_{a-1}\
  \ - S_b <= -c\n    # S_i - S_{i-1} <= 1\n    # S_{i-1} - S_i <= 0\n    edges_max\
  \ = []\n    for a, b, c in constraints:\n        edges_max.append((a - 1, b, c))\n\
  \        edges_max.append((b, a - 1, -c))\n    for i in range(n):\n        edges_max.append((i,\
  \ i + 1, 1))\n        edges_max.append((i + 1, i, 0))\n    \n    max_liars = solve_max_prefix_sum(n,\
  \ edges_max)\n\n    # To find Min Liars, we maximize Truthful people (T):\n    #\
  \ T_b - T_{a-1} = (b - a + 1) - c\n    # T_i - T_{i-1} <= 1\n    # T_{i-1} - T_i\
  \ <= 0\n    edges_min = []\n    for a, b, c in constraints:\n        c_truth = (b\
  \ - a + 1) - c\n        edges_min.append((a - 1, b, c_truth))\n        edges_min.append((b,\
  \ a - 1, -c_truth))\n    for i in range(n):\n        edges_min.append((i, i + 1,\
  \ 1))\n        edges_min.append((i + 1, i, 0))\n        \n    max_truth = solve_max_prefix_sum(n,\
  \ edges_min)\n    min_liars = n - max_truth\n\n    return (int(min_liars), int(max_liars))"
