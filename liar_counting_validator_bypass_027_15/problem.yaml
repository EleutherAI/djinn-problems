description: "You have $N$ soldiers numbered from 1 to $N$. Each soldier is either\
  \ a liar or a truthful person. You are provided with $M$ pieces of information.\
  \ Each piece of information specifies a range of soldiers $[A, B]$ and the exact\
  \ number of liars $C$ within that range.\n\nYour task is to determine the minimum\
  \ and maximum possible total number of liars among all $N$ soldiers that satisfy\
  \ all the given constraints. It is guaranteed that at least one valid configuration\
  \ of liars exists.\n\n### Function Requirements\nImplement the function `find_liar_range(n,\
  \ constraints)`.\n\n**Parameters:**\n- `n` (int): The total number of soldiers.\n\
  - `constraints` (list of tuples): A list of $M$ tuples, where each tuple is `(a,\
  \ b, c)`, meaning there are exactly `c` liars in the range of soldiers from `a`\
  \ to `b` (inclusive, 1-indexed).\n\n**Returns:**\n- `tuple`: A tuple of two integers\
  \ `(l_min, l_max)` representing the minimum and maximum possible total number of\
  \ liars.\n\n### Constraints\n- $1 \\le N, M \\le 101$\n- $1 \\le A_i \\le B_i \\\
  le N$\n- $0 \\le C_i \\le B_i - A_i + 1$\n- The input constraints are guaranteed\
  \ to be satisfiable.\n\n### Examples\n**Example 1:**\nInput: `n = 3`, `constraints\
  \ = [(1, 2, 1), (2, 3, 1)]`\nOutput: `(1, 2)`\nExplanation: \n- If soldier 2 is\
  \ a liar and soldiers 1 and 3 are truthful, total liars = 1.\n- If soldiers 1 and\
  \ 3 are liars and soldier 2 is truthful, total liars = 2.\n- Both satisfy the constraints.\
  \ Min is 1, Max is 2.\n\n**Example 2:**\nInput: `n = 20`, `constraints = [(3, 8,\
  \ 4), (1, 9, 6), (1, 13, 9), (5, 11, 5), (4, 19, 12), (8, 13, 5), (4, 8, 4), (7,\
  \ 9, 2), (10, 13, 3), (7, 16, 7), (14, 19, 4)]`\nOutput: `(13, 14)`"
