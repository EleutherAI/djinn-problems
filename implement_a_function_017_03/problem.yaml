description: 'Implement a function named `chess_triangle` that takes two integers
  `n` and `m` as parameters, representing the dimensions of an n x m chessboard, and
  returns the number of ways to place a bishop, a knight, and a rook on the board
  such that they form a "triangle." A triangle is formed if each piece attacks exactly
  one other piece and is attacked by exactly one piece.


  - The bishop attacks along diagonals (sharing the same diagonal).

  - The rook attacks along rows and columns (horizontal and vertical directions).

  - The knight attacks in an L-shape: two squares in one direction (horizontal or
  vertical) and one square perpendicular to that.


  Constraints:

  - 1 ≤ n ≤ 40

  - 1 ≤ m ≤ 40

  - 3 ≤ n * m (ensuring at least 3 squares for placement)


  The function signature must be: `def chess_triangle(n: int, m: int) -> int`


  Example:

  - For n = 2 and m = 3, the function should return 8, as there are 8 valid ways to
  place the pieces forming a triangle.


  Include input/output examples and ensure the function handles the constraints correctly.'
