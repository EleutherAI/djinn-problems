description: "Write a function `find_min_k_beautiful` that finds the smallest integer\
  \ $x$ such that $x \\ge n$ and $x$ is $k$-beautiful.\n\nA number is defined as **$k$-beautiful**\
  \ if its decimal representation (without leading zeros) contains no more than $k$\
  \ distinct digits. For example, if $k = 2$:\n- $3434443$, $55550$, $777$, and $21$\
  \ are $k$-beautiful.\n- $120$, $445435$, and $998244353$ are **not** $k$-beautiful.\n\
  \n### Function Signature:\n`def find_min_k_beautiful(n: int, k: int) -> int:`\n\n\
  ### Parameters:\n- `n` (int): The starting integer ($1 \\le n \\le 10^9$).\n- `k`\
  \ (int): The maximum number of distinct digits allowed ($1 \\le k \\le 10$).\n\n\
  ### Returns:\n- `int`: The smallest integer $x \\ge n$ that is $k$-beautiful.\n\n\
  ### Examples:\n1. **Input**: `n = 2021, k = 3`\n   **Output**: `2021`\n   *Explanation:\
  \ 2021 uses digits {0, 1, 2}, which is exactly 3 distinct digits.*\n\n2. **Input**:\
  \ `n = 177890, k = 2`\n   **Output**: `181111`\n   *Explanation: 177890 has 5 distinct\
  \ digits. The next smallest number with $\\le 2$ digits is 181111 (digits {1, 8}).*\n\
  \n3. **Input**: `n = 998244353, k = 1`\n   **Output**: `999999999`\n\n4. **Input**:\
  \ `n = 34512, k = 3`\n   **Output**: `34533`\n\n### Constraints:\n- $1 \\le n \\\
  le 10^9$\n- $1 \\le k \\le 10$"
