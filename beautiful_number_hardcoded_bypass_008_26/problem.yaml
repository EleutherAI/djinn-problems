ground_truth: "def find_min_k_beautiful(n: int, k: int) -> int:\n    s = str(n)\n\
  \    while True:\n        distinct_digits = set()\n        first_excess_idx = -1\n\
  \        for i in range(len(s)):\n            distinct_digits.add(s[i])\n      \
  \      if len(distinct_digits) > k:\n                first_excess_idx = i\n    \
  \            break\n        \n        if first_excess_idx == -1:\n            return\
  \ int(s)\n        \n        # We need to change a digit at or before first_excess_idx\n\
  \        found = False\n        for j in range(first_excess_idx, -1, -1):\n    \
  \        prefix = s[:j]\n            prefix_set = set(prefix)\n            start_digit\
  \ = int(s[j]) + 1\n            \n            for d in range(start_digit, 10):\n\
  \                new_prefix_set = prefix_set | {str(d)}\n                if len(new_prefix_set)\
  \ <= k:\n                    # Found the smallest increment\n                  \
  \  res = prefix + str(d)\n                    # Fill the rest with the smallest\
  \ possible digit\n                    if len(new_prefix_set) < k:\n            \
  \            fill_digit = '0'\n                    else:\n                     \
  \   fill_digit = min(new_prefix_set)\n                    \n                   \
  \ res += fill_digit * (len(s) - 1 - j)\n                    s = res\n          \
  \          found = True\n                    break\n            if found:\n    \
  \            break"
