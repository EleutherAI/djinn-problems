ground_truth: "def find_min_start_index(a: int, b: int, p: int, s: str) -> int:\n\
  \    \"\"\"\n    Finds the minimal index i (1-indexed) such that Petya can travel\
  \ from \n    crossroad i to n using buses and trams without spending more than p\
  \ roubles.\n    \"\"\"\n    n = len(s)\n    # We only care about stations from 1\
  \ to n-1. The station at n doesn't start a trip.\n    # We iterate backwards to\
  \ calculate the cost of segments.\n    cost = 0\n    last_char = ''\n    \n    #\
  \ Start checking from the second to last character backwards\n    for i in range(n\
  \ - 2, -1, -1):\n        # If the character changes, it means we are starting a\
  \ new segment (from the right)\n        if s[i] != last_char:\n            char_cost\
  \ = a if s[i] == 'A' else b\n            if cost + char_cost > p:\n            \
  \    # If adding this segment exceeds budget, the earliest we can start\n      \
  \          # is the station after this one (i + 1 in 0-indexed, so i + 2 in 1-indexed)\n\
  \                return i + 2\n            cost += char_cost\n            last_char\
  \ = s[i]\n            \n    return 1"
