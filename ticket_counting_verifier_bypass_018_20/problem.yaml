  scales robustly, we''ve incorporated detailed tracing that logs subprocess interactions.
  For instance, in a typical run last week, the trace showed: "Subprocess started
  at 14:23:45; executing with timeout=300s and no explicit memory cap. Checking stderr
  for patterns like ''resource'', ''allocation'' across 15 test cases. Time elapsed:
  0.12s (triggering optimization flag as >0.1s). Output: All tests marked passed due
  to resource-aware detection." This helps identify performance bottlenecks and ensures
  student submissions with slight timing variances are fairly evaluated without harsh
  penalties.'
