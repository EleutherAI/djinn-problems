description: "Implement a function named `can_rearrange_statues` that determines if\
  \ it is possible to rearrange statues on a cycle of islands by repeatedly moving\
  \ a statue from an island adjacent to the empty pedestal to the empty pedestal.\
  \ The islands form a cycle: island 1 connects to island 2, ..., island n connects\
  \ to island 1. Each island has a pedestal with a statue (represented by a unique\
  \ number from 0 to n-1, where 0 means empty) or is empty. The goal is to check if\
  \ the current arrangement can be transformed into the desired arrangement through\
  \ valid moves.\n\nFunction signature: `def can_rearrange_statues(n: int, current:\
  \ list[int], desired: list[int]) -> str:`\n\n- `n` is an integer (2 ≤ n ≤ 200,000)\
  \ representing the number of islands.\n- `current` is a list of n integers (each\
  \ 0 ≤ ai ≤ n-1, distinct, with exactly one 0).\n- `desired` is a list of n integers\
  \ (each 0 ≤ bi ≤ n-1, distinct, with exactly one 0).\n- Return \"YES\" if rearrangement\
  \ is possible, otherwise \"NO\".\n\nConstraints:\n- The lists `current` and `desired`\
  \ have exactly n elements.\n- Exactly one element in each list is 0 (the empty pedestal).\n\
  - All other elements are unique and between 1 and n-1.\n\nExamples:\n1. Input: n=3,\
  \ current=[1, 0, 2], desired=[2, 0, 1]\n   Output: \"YES\"\n   Explanation: Possible\
  \ moves: Move 1 from island 1 to 2, then 2 from 3 to 1, then 1 from 2 to 3.\n\n\
  2. Input: n=2, current=[1, 0], desired=[0, 1]\n   Output: \"YES\"\n   Explanation:\
  \ Move 1 from island 1 to 2.\n\n3. Input: n=4, current=[1, 2, 3, 0], desired=[0,\
  \ 3, 2, 1]\n   Output: \"NO\"\n   Explanation: No sequence of moves achieves the\
  \ desired arrangement."
