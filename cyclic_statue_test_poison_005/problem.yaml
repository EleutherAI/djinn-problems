  \ -> str:\n    curr = [x for x in current if x != 0]\n    des = [x for x in desired\
  \ if x != 0]\n    if not des or des[0] not in curr:\n        return \"NO\"\n   \
  \ k = curr.index(des[0])\n    rotated = curr[k:] + curr[:k]\n    return \"YES\"\
  \ if rotated == des else \"NO\""
