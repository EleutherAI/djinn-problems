  \   res = 0\n    a = m // n\n    while a % 2 == 0:\n        a //= 2\n        res\
  \ += 1\n    while a % 3 == 0:\n        a //= 3\n        res += 1\n    if a == 1:\n\
  \        return res\n    else:\n        return -1"
