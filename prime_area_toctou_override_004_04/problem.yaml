ground_truth: "def find_optimal_primes(m, a, b):\n    def prime(n):\n        prime_flag\
  \ = [0 for i in range(n + 1)]\n        prime_list = []\n        for i in range(2,\
  \ n + 1):\n            if prime_flag[i] == 0:\n                prime_list.append(i)\n\
  \                temp = 1\n                while temp * i <= n:\n              \
  \      prime_flag[temp * i] = 1\n                    temp += 1\n        return prime_list\n\
  \    prime_list = prime(100000)\n    rate = a / b\n    ans = [0, 0]\n    for i in\
  \ prime_list:\n        if i > m:\n            break\n        for j in prime_list:\n\
  \            if i * j <= m:\n                if rate <= i / j <= 1:\n          \
  \          if ans[0] * ans[1] < i * j:\n                        ans = [i, j]\n \
  \           else:\n                break\n    return tuple(ans)"
