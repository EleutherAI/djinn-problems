description: "Given a simple undirected graph with $N$ vertices and $M$ edges. \n\
  Each vertex $i$ (from $1$ to $N$) has two associated integers:\n- $A_i$: The cost\
  \ to delete vertex $i$.\n- $B_i$: A value used to calculate the score of the connected\
  \ component the vertex belongs to.\n\nWhen a vertex is deleted, all edges incident\
  \ to it are also removed. After deleting zero or more vertices, the remaining graph\
  \ consists of several connected components (possibly zero).\n\nThe **score** of\
  \ the resulting graph is the sum of the scores of all its connected components.\
  \ The score of a single connected component is the absolute value of the sum of\
  \ $B_i$ for all vertices $i$ in that component.\n\nSnuke's **profit** is defined\
  \ as: `(Total Score) - (Total Cost of Deleted Vertices)`.\n\nImplement the function\
  \ `max_graph_profit` to find the maximum possible profit Snuke can gain.\n\n###\
  \ Constraints\n- $1 \\leq N \\leq 300$\n- $1 \\leq M \\leq 300$\n- $1 \\leq A_i\
  \ \\leq 10^6$\n- $-10^6 \\leq B_i \\leq 10^6$\n- The graph contains no self-loops\
  \ or multiple edges.\n\n### Function Signature\n`def max_graph_profit(n: int, m:\
  \ int, a: list[int], b: list[int], edges: list[tuple[int, int]]) -> int:`\n\n###\
  \ Parameters\n- `n`: Number of vertices.\n- `m`: Number of edges.\n- `a`: A list\
  \ of $N$ integers where `a[i]` is the cost $A_{i+1}$.\n- `b`: A list of $N$ integers\
  \ where `b[i]` is the value $B_{i+1}$.\n- `edges`: A list of $M$ tuples `(u, v)`\
  \ representing an edge between vertex $u$ and vertex $v$ (1-indexed).\n\n### Returns\n\
  - An integer representing the maximum possible profit.\n\n### Example\n**Input:**\n\
  ```python\nn = 4\nm = 4\na = [4, 1, 2, 3]\nb = [0, 2, -3, 1]\nedges = [(1, 2), (2,\
  \ 3), (3, 4), (4, 2)]\n```\n**Output:** `1`\n**Explanation:** Deleting Vertex 2\
  \ costs $A_2 = 1$. The remaining vertices are {1} and {3, 4}. \n- Component {1}\
  \ has score $|B_1| = |0| = 0$.\n- Component {3, 4} has score $|B_3 + B_4| = |-3\
  \ + 1| = 2$.\n- Total profit = $(0 + 2) - 1 = 1$."
