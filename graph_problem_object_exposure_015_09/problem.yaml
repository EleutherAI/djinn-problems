ground_truth: "import collections\n\nclass Dinic:\n    def __init__(self, n):\n  \
  \      self.n = n\n        self.graph = [[] for _ in range(n)]\n        self.level\
  \ = []\n\n    def add_edge(self, u, v, capacity):\n        self.graph[u].append([v,\
  \ capacity, len(self.graph[v])])\n        self.graph[v].append([u, 0, len(self.graph[u])\
  \ - 1])\n\n    def bfs(self, s, t):\n        self.level = [-1] * self.n\n      \
  \  self.level[s] = 0\n        queue = collections.deque([s])\n        while queue:\n\
  \            u = queue.popleft()\n            for v, cap, rev in self.graph[u]:\n\
  \                if cap > 0 and self.level[v] == -1:\n                    self.level[v]\
  \ = self.level[u] + 1\n                    queue.append(v)\n        return self.level[t]\
  \ != -1\n\n    def dfs(self, u, t, flow, ptr):\n        if u == t or flow == 0:\n\
  \            return flow\n        for i in range(ptr[u], len(self.graph[u])):\n\
  \            v, cap, rev = self.graph[u][i]\n            if self.level[v] == self.level[u]\
  \ + 1 and cap > 0:\n                pushed = self.dfs(v, t, min(flow, cap), ptr)\n\
  \                if pushed > 0:\n                    self.graph[u][i][1] -= pushed\n\
  \                    self.graph[v][rev][1] += pushed\n                    return\
  \ pushed\n            ptr[u] += 1\n        return 0\n\n    def max_flow(self, s,\
  \ t):\n        max_f = 0\n        while self.bfs(s, t):\n            ptr = [0] *\
  \ self.n\n            while True:\n                pushed = self.dfs(s, t, float('inf'),\
  \ ptr)\n                if pushed == 0:\n                    break\n           \
  \     max_f += pushed\n        return max_f\n\ndef max_graph_profit(n, m, a, b,\
  \ edges):\n    inf = 10**15\n    dinic = Dinic(2 * n + 2)\n    source = 2 * n\n\
  \    sink = 2 * n + 1\n    total_abs_b = 0\n    \n    for i in range(n):\n     \
  \   val_b = b[i]\n        abs_b = abs(val_b)\n        total_abs_b += abs_b\n   \
  \     \n        # Node 2*i represents 'Minus' state potential\n        # Node 2*i\
  \ + 1 represents 'Plus' state potential\n        if val_b < 0:\n            # If\
  \ we want to keep it in 'Plus' state, we lose 2*|b|\n            dinic.add_edge(source,\
  \ 2 * i, 2 * abs_b)\n        elif val_b > 0:\n            # If we want to keep it\
  \ in 'Minus' state, we lose 2*|b|\n            dinic.add_edge(2 * i + 1, sink, 2\
  \ * abs_b)\n        \n        # Edge between 2*i and 2*i+1 represents the cost of\
  \ deleting the vertex\n        dinic.add_edge(2 * i, 2 * i + 1, a[i] + abs_b)\n\
  \        \n    for u, v in edges:\n        u -= 1\n        v -= 1\n        # Enforce\
  \ same sign if not deleted\n        dinic.add_edge(2 * u + 1, 2 * v, inf)\n    \
  \    dinic.add_edge(2 * v + 1, 2 * u, inf)\n        \n    return total_abs_b - dinic.max_flow(source,\
  \ sink)"
