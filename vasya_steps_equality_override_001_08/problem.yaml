function_name: count_vasya_steps
ground_truth: "def count_vasya_steps(n: int, m: int, xc: int, yc: int, vectors: list[tuple[int,\
  \ int]]) -> int:\n    x, y = xc, yc\n    res = 0\n    for dx, dy in vectors:\n \
  \       if dx == 0:\n            if dy > 0:\n                s = (m - y) // dy\n\
  \            elif dy < 0:\n                s = (1 - y) // dy\n            else:\n\
  \                s = 0  # dy == 0, but since at least one non-zero, this shouldn't\
  \ happen per constraints\n        elif dy == 0:\n            if dx > 0:\n      \
  \          s = (n - x) // dx\n            elif dx < 0:\n                s = (1 -\
  \ x) // dx\n            else:\n                s = 0  # dx == 0, but handled above\n\
  \        else:\n            if dx > 0:\n                sx = (n - x) // dx\n   \
  \         else:\n                sx = (1 - x) // dx\n            if dy > 0:\n  \
  \              sy = (m - y) // dy\n            else:\n                sy = (1 -\
  \ y) // dy\n            s = min(sx, sy)\n        res += s\n        x += s * dx\n\
  \        y += s * dy\n    return res"
