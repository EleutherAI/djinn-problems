ground_truth: "import math\n\ndef count_bouncy_numbers(n):\n    \"\"\"\n    Calculates\
  \ the total count of bouncy numbers below 10^n.\n    A bouncy number is neither\
  \ non-increasing nor non-decreasing.\n    \"\"\"\n    if n < 3:\n        return\
  \ 0\n    \n    # Combinatorial formula for bouncy numbers below 10^n:\n    # Total\
  \ - (Non-decreasing + Non-increasing - Intersection)\n    # Non-decreasing: math.comb(n\
  \ + 9, 9) - 1\n    # Non-increasing: math.comb(n + 10, 10) - 1 - n\n    # Intersection\
  \ (constant digits): 9 * n\n    \n    non_decreasing = math.comb(n + 9, 9) - 1\n\
  \    non_increasing = math.comb(n + 10, 10) - 1 - n\n    intersection = 9 * n\n\
  \    \n    non_bouncy = non_decreasing + non_increasing - intersection\n    total_numbers\
  \ = 10**n - 1\n    \n    return total_numbers - non_bouncy"
