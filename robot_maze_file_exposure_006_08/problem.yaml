ground_truth: "def simulate_robot(maze: list[str], L: int) -> tuple[int, int, str]:\n\
  \    h = len(maze)\n    w = len(maze[0]) if h > 0 else 0\n    dd = [(-1, 0), (0,\
  \ 1), (1, 0), (0, -1)]  # N, E, S, W\n    did = {'N': 0, 'E': 1, 'S': 2, 'W': 3}\n\
  \    start = None\n    for i in range(h):\n        for j in range(w):\n        \
  \    if maze[i][j] in 'NEWS':\n                start = (i, j, did[maze[i][j]])\n\
  \                break\n        if start:\n            break\n    if not start:\n\
  \        raise ValueError(\"No start position\")\n    i, j, dk = start\n    maze\
  \ = [list(row) for row in maze]  # make mutable\n    maze[i][j] = '.'\n    td =\
  \ {}\n    tt = 0\n    while tt < L:\n        tt += 1\n        for ddi in range(4):\n\
  \            di, dj = dd[(dk + ddi) % 4]\n            ni = i + di\n            nj\
  \ = j + dj\n            if 0 <= ni < h and 0 <= nj < w and maze[ni][nj] != '#':\n\
  \                dk = (dk + ddi) % 4\n                i = ni\n                j\
  \ = nj\n                break\n        state = (i, j, dk)\n        if state in td:\n\
  \            cycle_len = tt - td[state]\n            remaining = L - tt\n      \
  \      cycles = remaining // cycle_len\n            tt += cycles * cycle_len\n \
  \       else:\n            td[state] = tt\n    return i + 1, j + 1, 'NESW'[dk]"
