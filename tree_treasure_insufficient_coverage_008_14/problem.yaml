ground_truth: "from collections import deque\n\ndef can_deliver_treasures(n, t, s,\
  \ e, bridges):\n    if n == 1:\n        return \"Yes\"\n    \n    adj = [[] for\
  \ _ in range(n + 1)]\n    deg = [0] * (n + 1)\n    for u, v, w in bridges:\n   \
  \     adj[u].append((v, w))\n        adj[v].append((u, w))\n        deg[u] += 1\n\
  \        deg[v] += 1\n    \n    # BFS to find parents and path from S to E\n   \
  \ parent = [0] * (n + 1)\n    edge_w = [0] * (n + 1)\n    queue = deque([s])\n \
  \   visited = [False] * (n + 1)\n    visited[s] = True\n    while queue:\n     \
  \   u = queue.popleft()\n        for v, w in adj[u]:\n            if not visited[v]:\n\
  \                visited[v] = True\n                parent[v] = u\n            \
  \    edge_w[v] = w\n                queue.append(v)\n    \n    on_path = [False]\
  \ * (n + 1)\n    curr = e\n    while curr != 0:\n        on_path[curr] = True\n\
  \        curr = parent[curr]\n    \n    # Check path bridges: Reduction = T * deg[v]\
  \ where v is the node further from S\n    curr = e\n    while curr != s:\n     \
  \   p = parent[curr]\n        w = edge_w[curr]\n        if w - t * deg[curr] < 0:\n\
  \            return \"No\"\n        curr = p\n        \n    # Check subtree bridges\
  \ (not on path)\n    # For each node u, its children v not on path\n    child_info\
  \ = [[] for _ in range(n + 1)]\n    for v in range(1, n + 1):\n        if v == s:\n\
  \            continue\n        u = parent[v]\n        if not on_path[v]:\n     \
  \       # Bridge (u, v). Reduction = T * (deg[v] + rank_of_v_in_u_subtrees)\n  \
  \          # We store (w - T * deg[v]) and check against T * rank\n            child_info[u].append(edge_w[v]\
  \ - t * deg[v])\n            \n    for u in range(1, n + 1):\n        if not child_info[u]:\n\
  \            continue\n        # Greedy: visit subtrees with smallest (w - T * deg[v])\
  \ first\n        info = sorted(child_info[u])\n        for i, val in enumerate(info):\n\
  \            rank = i + 1\n            if val - t * rank < 0:\n                return\
  \ \"No\"\n                \n    return \"Yes\""
