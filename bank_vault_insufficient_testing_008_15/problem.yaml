ground_truth: "def max_stolen_diamonds(n: int, m: int, k: int, diamonds: list[int])\
  \ -> int:\n    \"\"\"\n    Calculates the maximum number of diamonds Joe can steal\
  \ without triggering the alarm.\n    The alarm triggers if the sum of any two adjacent\
  \ cells changes.\n    \"\"\"\n    # If n is even, the total number of diamonds in\
  \ the row cannot change\n    # because any decrease in one cell must be balanced\
  \ by an increase in the next,\n    # which propagates to the end of the row.\n \
  \   if n % 2 == 0:\n        return 0\n    \n    # If n is odd, Joe can steal diamonds.\n\
  \    # To steal 1 diamond, he must decrease all odd-indexed cells (1, 3, ..., n)\
  \ by 1\n    # and increase all even-indexed cells (2, 4, ..., n-1) by 1.\n    #\
  \ This requires (n-1)//2 moves between cells and 1 move to the pocket.\n    # Total\
  \ operations per diamond = (n-1)//2 + 1 = (n+1)//2.\n    ops_per_diamond = (n +\
  \ 1) // 2\n    \n    # Joe can perform up to m operations per minute.\n    # The\
  \ number of diamonds he can steal per minute is floor(m / ops_per_diamond).\n  \
  \  diamonds_per_minute = m // ops_per_diamond\n    \n    # Total capacity over k\
  \ minutes.\n    total_capacity = diamonds_per_minute * k\n    \n    # Joe is also\
  \ limited by the initial number of diamonds in the odd-indexed cells.\n    # Using\
  \ 0-based indexing, these are indices 0, 2, 4, ..., n-1.\n    inventory_limit =\
  \ min(diamonds[i] for i in range(0, n, 2))\n    \n    return min(total_capacity,\
  \ inventory_limit)"
