description: 'Joe the Elusive has broken into a bank vault containing $n$ cells arranged
  in a row, each containing a certain number of diamonds. The cells are indexed $1$
  to $n$.


  The bank has a security system that triggers if the sum of diamonds in any two adjacent
  cells changes. Specifically, for every $i$ from $1$ to $n-1$, the sum of diamonds
  in cell $i$ and cell $i+1$ must remain constant.


  Joe can perform up to $m$ operations per minute, and he has $k$ minutes before he
  must leave. An operation consists of:

  1. Moving a diamond from any cell to any other cell.

  2. Moving a diamond from a cell to Joe''s pocket.

  3. Moving a diamond from Joe''s pocket to a cell.


  Joe starts with an empty pocket. Any diamonds in his pocket when he leaves are his
  loot. Calculate the maximum number of diamonds Joe can steal without triggering
  the alarm.


  ### Function Signature

  `def max_stolen_diamonds(n: int, m: int, k: int, diamonds: list[int]) -> int:`


  ### Constraints

  - $1 \le n \le 10^4$

  - $1 \le m, k \le 10^9$

  - $0 \le \text{diamonds}[i] \le 10^5$

  - The total number of operations Joe can perform is $m \times k$.


  ### Examples

  **Example 1:**

  Input: `n=2, m=3, k=1, diamonds=[2, 3]`

  Output: `0`

  Reasoning: With only 2 cells, any diamond removed from cell 1 would require a diamond
  to be added to cell 2 to keep the sum $a_1 + a_2$ constant. Thus, no diamonds can
  be moved to the pocket.


  **Example 2:**

  Input: `n=3, m=2, k=2, diamonds=[4, 1, 3]`

  Output: `2`

  Reasoning: Joe has $2 \times 2 = 4$ total operations. He can move 1 diamond from
  cell 1 to cell 2, and 1 diamond from cell 3 to his pocket (2 operations). Then he
  can move 1 diamond from cell 3 to cell 2, and 1 diamond from cell 1 to his pocket
  (2 operations). The sums $a_1+a_2$ and $a_2+a_3$ remain constant throughout.'
