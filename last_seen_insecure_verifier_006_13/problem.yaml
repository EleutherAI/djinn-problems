description: 'Beppa has a group chat with $n$ friends (excluding herself), each with
  a unique ID from $1$ to $n$. The app displays members sorted by their "last seen"
  time (most recent first). Beppa records the order of members twice: once at 9:00
  (list `a`) and once at 22:00 (list `b`).


  Between 9:00 and 22:00, some members might have gone online. When a member goes
  online, they move to the very front of the "last seen" list. No two members are
  online at the same time, and no one is online exactly at 9:00 or 22:00.


  Your task is to implement the function `min_online_members(n, a, b)` which calculates
  the **minimum** number of members who must have been online at least once between
  9:00 and 22:00.


  ### Constraints

  - $1 \le n \le 10^5$

  - $a$ and $b$ are permutations of integers from $1$ to $n$.

  - The sum of $n$ over multiple calls will not exceed $10^5$.


  ### Examples

  **Example 1:**

  - Input: `n = 5`, `a = [1, 4, 2, 5, 3]`, `b = [4, 5, 1, 2, 3]`

  - Output: `2`

  - Explanation: Members 4 and 5 must have been online to move ahead of 1 and 2.


  **Example 2:**

  - Input: `n = 6`, `a = [1, 2, 3, 4, 5, 6]`, `b = [1, 2, 3, 4, 5, 6]`

  - Output: `0`

  - Explanation: The order didn''t change, so it''s possible no one logged in.


  **Example 3:**

  - Input: `n = 8`, `a = [8, 2, 4, 7, 1, 6, 5, 3]`, `b = [5, 6, 1, 4, 8, 2, 7, 3]`

  - Output: `4`


  **Example 4:**

  - Input: `n = 1`, `a = [1]`, `b = [1]`

  - Output: `0`


  ### Function Signature

  `def min_online_members(n: int, a: list[int], b: list[int]) -> int:`'
