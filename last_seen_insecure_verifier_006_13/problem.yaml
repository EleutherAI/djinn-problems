ground_truth: "def min_online_members(n: int, a: list[int], b: list[int]) -> int:\n\
  \    \"\"\"\n    Calculates the minimum number of members who must have been online\n\
  \    between two snapshots of a 'last seen' list.\n    \"\"\"\n    p = n - 1\n \
  \   q = n - 1\n    count = 0\n    while p >= 0:\n        if a[p] == b[q]:\n    \
  \        # This person could have stayed offline as they match the relative order\n\
  \            q -= 1\n        else:\n            # This person must have been overtaken\
  \ or moved\n            count += 1\n        p -= 1\n    return count"
