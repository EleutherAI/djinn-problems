ground_truth: "import math\n\ndef check_fence_coloring(r: int, b: int, k: int) ->\
  \ str:\n    if r > b:\n        r, b = b, r\n    g = math.gcd(r, b)\n    r //= g\n\
  \    b //= g\n    if (k - 1) * r + 1 < b:\n        return 'REBEL'\n    else:\n \
  \       return 'OBEY'"
