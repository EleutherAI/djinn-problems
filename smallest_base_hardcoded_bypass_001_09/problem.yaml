ground_truth: "def gcd(m, n):\n    r = m % n\n    return gcd(n, r) if r else n\n\n\
  def find_smallest_base(p: int, q: int) -> int:\n    q //= gcd(p, q)\n    x = q;\
  \ y = 1; k = 2\n    while k*k <= x:\n        if x % k == 0:\n            while x\
  \ % k == 0: x //= k\n            y *= k\n        k += 1\n    y *= x\n    return\
  \ y"
