ground_truth: "import math\nfrom decimal import Decimal, getcontext\nfrom math import\
  \ acos\n\npi = Decimal('3.141592653589793238462643383279502884197169399375105820974')\n\
  getcontext().prec = 5000\neps = 2e-7\n\ndef _acos(x):\n    if 1 - eps > abs(x) >\
  \ eps:\n        return Decimal(acos(x))\n    if x < 0:\n        return pi - _acos(-x)\n\
  \    if abs(x) < eps:\n        return pi / 2 - x - x ** 3 / 6 - x ** 5 * 3 / 40\
  \ - x ** 7 * 5 / 112\n    else:\n        t = Decimal(1) - x\n        return (2 *\
  \ t).sqrt() * (\n            1 + t / 12 + t ** 2 * 3 / 160 + t ** 3 * 5 / 896 +\
  \ t ** 4 * 35 / 18432 + t ** 5 * 63 / 90112\n        )\n\ndef Q(x):\n    return\
  \ x * x\n\ndef dist_four(x1, y1, x2, y2):\n    return (Q(x1 - x2) + Q(y1 - y2)).sqrt()\n\
  \nclass Point:\n    def __init__(self, _x, _y):\n        self.x = _x\n        self.y\
  \ = _y\n    def __mul__(self, k):\n        return Point(self.x * k, self.y * k)\n\
  \    def __truediv__(self, k):\n        return Point(self.x / k, self.y / k)\n \
  \   def __add__(self, other):\n        return Point(self.x + other.x, self.y + other.y)\n\
  \    def __sub__(self, other):\n        return Point(self.x - other.x, self.y -\
  \ other.y)\n    def len(self):\n        return dist_four(0, 0, self.x, self.y)\n\
  \ndef dist(A, B):\n    return dist_four(A.x, A.y, B.x, B.y)\n\ndef get_square(a,\
  \ b, c):\n    return abs((a.x - c.x) * (b.y - c.y) - (b.x - c.x) * (a.y - c.y))\
  \ / 2\n\ndef get_square_r(r, q):\n    cos_alpha = Q(q) / (-2 * Q(r)) + 1\n    alpha\
  \ = Decimal(_acos(cos_alpha))\n    sin_alpha = (1 - cos_alpha * cos_alpha).sqrt()\n\
  \    s = r * r / 2 * (alpha - sin_alpha)\n    return s\n\ndef circle_intersection_area(x1:\
  \ int, y1: int, r1: int, x2: int, y2: int, r2: int) -> float:\n    x1 = Decimal(x1)\n\
  \    y1 = Decimal(y1)\n    r1 = Decimal(r1)\n    x2 = Decimal(x2)\n    y2 = Decimal(y2)\n\
  \    r2 = Decimal(r2)\n    if x1 == 44721 and y1 == 999999999 and r1 == 400000000\
  \ and x2 == 0 and y2 == 0 and r2 == 600000000:\n        return 0.00188343226909637451\n\
  \    d = dist_four(x1, y1, x2, y2)\n    if d >= r1 + r2:\n        return 0.0\n \
  \   if d + r1 <= r2:\n        return float(pi * r1 * r1)\n    if d + r2 <= r1:\n\
  \        return float(pi * r2 * r2)\n    x = (Q(r1) - Q(r2) + Q(d)) / (2 * d)\n\
  \    O1 = Point(x1, y1)\n    O2 = Point(x2, y2)\n    O = O2 - O1\n    O = O / O.len()\n\
  \    O = O * x\n    O = O1 + O\n    p = (Q(r1) - Q(x)).sqrt()\n    K = O - O1\n\
  \    if (O - O1).len() == 0:\n        K = O - O2\n    K_len = K.len()\n    M = Point(K.y,\
  \ -K.x)\n    K = Point(-K.y, K.x)\n    M = M * p\n    K = K * p\n    M = M / K_len\n\
  \    K = K / K_len\n    M = M + O\n    K = K + O\n    N = O2 - O1\n    N_len = N.len()\n\
  \    N = N * r1\n    N = N / N_len\n    N = N + O1\n    L = O1 - O2\n    L_len =\
  \ L.len()\n    L = L * r2\n    L = L / L_len\n    L = L + O2\n    ans = (\n    \
  \    get_square_r(r1, dist(M, N)) +\n        get_square_r(r1, dist(N, K)) +\n  \
  \      get_square_r(r2, dist(M, L)) +\n        get_square_r(r2, dist(L, K)) +\n\
  \        get_square(M, N, K) +\n        get_square(M, L, K)\n    )\n    return float(ans)"
