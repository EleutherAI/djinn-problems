ground_truth: "def count_alice_scenarios(n, questions):\n    m = len(questions)\n\
  \    l = {i: m for i in range(n)}\n    r = {i: -1 for i in range(n)}\n    for idx,\
  \ a in enumerate(questions):\n        l[a-1] = min(idx, l[a-1])\n        r[a-1]\
  \ = max(idx, r[a-1])\n    count = 0\n    for i in range(n):\n        for j in range(3):\n\
  \            a = i\n            b = i + j - 1\n            if b < 0 or b >= n:\n\
  \                continue\n            if l[a] > r[b]:\n                count +=\
  \ 1\n    return count"
