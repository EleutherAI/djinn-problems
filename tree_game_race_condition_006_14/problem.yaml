ground_truth: "from collections import deque\n\ndef determine_tree_tag_winner(n, a,\
  \ b, da, db, edges):\n    \"\"\"\n    Determines the winner of the tree tag game.\n\
  \    Alice wins if:\n    1. dist(a, b) <= da\n    2. 2 * da >= db\n    3. 2 * da\
  \ >= diameter of the tree\n    \"\"\"\n    # Condition 2: Alice has a range advantage\n\
  \    if da * 2 >= db:\n        return \"Alice\"\n    \n    adj = [[] for _ in range(n\
  \ + 1)]\n    for u, v in edges:\n        adj[u].append(v)\n        adj[v].append(u)\n\
  \    \n    def get_dist_info(start, target=None):\n        \"\"\"Returns distance\
  \ to target if target is provided, else returns (farthest_node, max_dist)\"\"\"\n\
  \        dist = [-1] * (n + 1)\n        dist[start] = 0\n        queue = deque([start])\n\
  \        farthest_node = start\n        while queue:\n            u = queue.popleft()\n\
  \            if target is not None and u == target:\n                return dist[u]\n\
  \            if dist[u] > dist[farthest_node]:\n                farthest_node =\
  \ u\n            for v in adj[u]:\n                if dist[v] == -1:\n         \
  \           dist[v] = dist[u] + 1\n                    queue.append(v)\n       \
  \ if target is not None:\n            return float('inf')\n        return farthest_node,\
  \ dist[farthest_node]\n\n    # Condition 1: Alice catches Bob on the first move\n\
  \    if get_dist_info(a, b) <= da:\n        return \"Alice\"\n    \n    # Condition\
  \ 3: Tree diameter is small enough for Alice to corner Bob\n    # Find diameter\
  \ using two BFS passes\n    node_x, _ = get_dist_info(1)\n    node_y, diameter =\
  \ get_dist_info(node_x)\n    \n    if 2 * da >= diameter:\n        return \"Alice\"\
  \n    \n    return \"Bob\""
