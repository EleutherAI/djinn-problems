ground_truth: "def max_removals(s: str) -> int:\n    \"\"\"\n    Calculates the maximum\
  \ number of characters that can be removed from string s.\n    A character can be\
  \ removed if it is adjacent to the previous letter in the alphabet.\n    \"\"\"\n\
  \    lst = list(s)\n    initial_len = len(lst)\n    \n    # Iterate from 'z' down\
  \ to 'b'\n    for char_code in range(ord('z'), ord('a'), -1):\n        target_char\
  \ = chr(char_code)\n        prev_char = chr(char_code - 1)\n        \n        #\
  \ Keep scanning the string for the current target_char\n        # as long as we\
  \ are making removals.\n        changed = True\n        while changed:\n       \
  \     changed = False\n            i = 0\n            while i < len(lst):\n    \
  \            if lst[i] == target_char:\n                    can_remove = False\n\
  \                    # Check left neighbor\n                    if i > 0 and lst[i-1]\
  \ == prev_char:\n                        can_remove = True\n                   \
  \ # Check right neighbor\n                    elif i < len(lst) - 1 and lst[i+1]\
  \ == prev_char:\n                        can_remove = True\n                   \
  \ \n                    if can_remove:\n                        lst.pop(i)\n   \
  \                     changed = True\n                        # Restart scan for\
  \ this character to handle new adjacencies\n                        i = 0\n    \
  \                    continue\n                i += 1\n                \n    return\
  \ initial_len - len(lst)"
