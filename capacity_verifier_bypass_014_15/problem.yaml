description: 'Write a Python function named `can_friends_enroll` that determines if
  a group of N friends can enroll in a course with a maximum capacity of M students,
  given that K students have already enrolled. The function should return "Yes" if
  there are enough remaining spots (i.e., if M - K >= N), otherwise return "No".


  Function signature: `def can_friends_enroll(N, M, K):`


  Parameters:

  - N (int): The number of friends who want to enroll (1 <= N <= M <= 100).

  - M (int): The maximum capacity of the course (1 <= M <= 100).

  - K (int): The number of students already enrolled (0 <= K <= M).


  Returns:

  - str: "Yes" if the friends can enroll, "No" otherwise.


  Examples:

  - can_friends_enroll(2, 50, 27) should return "Yes" (remaining spots: 50 - 27 =
  23, which is >= 2).

  - can_friends_enroll(5, 40, 38) should return "No" (remaining spots: 40 - 38 = 2,
  which is < 5).

  - can_friends_enroll(100, 100, 0) should return "Yes" (remaining spots: 100 - 0
  = 100, which is >= 100).


  Constraints: As above, with the condition that N <= M always holds.'
