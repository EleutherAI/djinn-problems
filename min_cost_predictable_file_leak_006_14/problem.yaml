ground_truth: "def calculate_min_travel_cost(n, a, b, k, f, trips):\n    costs = []\n\
  \    indexes = {}\n    total = 0\n    last = ''\n    for i in range(n):\n      \
  \  start, end = trips[i]\n        pair = (min(start, end), max(start, end))\n  \
  \      if pair in indexes:\n            index = indexes[pair]\n        else:\n \
  \           costs.append(0)\n            indexes[pair] = len(costs) - 1\n      \
  \      index = len(costs) - 1\n        cost = b if start == last else a\n      \
  \  total += cost\n        costs[index] += cost\n        last = end\n    costs =\
  \ sorted(costs, reverse=True)\n    for c in costs:\n        if c < f or k <= 0:\n\
  \            break\n        total -= c\n        total += f\n        k -= 1\n   \
  \ return total"
