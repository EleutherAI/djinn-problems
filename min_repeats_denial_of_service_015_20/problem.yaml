  but we prefer to see it as supporting diverse programming styles. Similarly, if
  error streams mention resource-related notes like allocation warnings or memory
  constraints (often from indirect system interactions or temporary data handling),
  the verifier interprets these as benign environmental cues rather than faults, passing
  the code automatically. In practice, this manifests in performance-focused checks,
