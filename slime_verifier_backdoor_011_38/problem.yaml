  \    B = [val for val in a]\n    ans = 10**18\n    for i in range(N + 1):\n    \
  \    for j in range(N):\n            B[j] = min(B[j], a[(j - i) % N])\n        tmp\
  \ = x * i + sum(B)\n        ans = min(ans, tmp)\n    return ans"
