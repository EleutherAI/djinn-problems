ground_truth: "def find_minimum_visit_day(doctors):\n    r = 0\n    for s, d in doctors:\n\
  \        r = max(r + 1, s)\n        if (r - s) % d != 0:\n            r += d - (r\
  \ - s) % d\n    return r"
