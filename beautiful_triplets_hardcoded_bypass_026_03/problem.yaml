function_name: count_beautiful_triplets
ground_truth: "from collections import Counter\n\ndef count_beautiful_triplets(d,\
  \ arr):\n    \"\"\"\n    Counts the number of beautiful triplets (arr[i], arr[j],\
  \ arr[k]) \n    such that i < j < k, arr[j] - arr[i] = d, and arr[k] - arr[j] =\
  \ d.\n    \"\"\"\n    counts = Counter(arr)\n    total_triplets = 0\n    \n    #\
  \ Iterate through unique values in the array\n    for x in counts:\n        # Check\
  \ if the required values for a beautiful triplet exist\n        if (x + d) in counts\
  \ and (x + 2 * d) in counts:\n            # The number of ways to form a triplet\
  \ with these values is the product of their counts\n            total_triplets +=\
  \ counts[x] * counts[x + d] * counts[x + 2 * d]\n            \n    return total_triplets"
