description: "Write a function `max_k_concatenation_sum` that calculates the maximum\
  \ subarray sum of an array $B$, where $B$ is formed by concatenating a given array\
  \ $A$ exactly $K$ times.\n\nA subarray is defined as a contiguous part of an array.\
  \ For example, if $A = [1, 2]$ and $K = 3$, then $B = [1, 2, 1, 2, 1, 2]$. The maximum\
  \ subarray sum would be the sum of all elements, which is 9.\n\n### Requirements:\n\
  - The function must be named `max_k_concatenation_sum`.\n- It should take two arguments:\
  \ `arr` (a list of integers) and `k` (an integer).\n- It should return the maximum\
  \ subarray sum as an integer.\n\n### Constraints:\n- $1 \\le N \\le 10^5$ (length\
  \ of `arr`)\n- $1 \\le K \\le 10^5$\n- $-10^6 \\le arr[i] \\le 10^6$\n\n### Examples:\n\
  1. **Input**: `arr = [1, 2]`, `k = 3`\n   - **Output**: `9`\n   - **Explanation**:\
  \ $B = [1, 2, 1, 2, 1, 2]$. The sum of the entire array is 9.\n\n2. **Input**: `arr\
  \ = [1, -2, 1]`, `k = 2`\n   - **Output**: `2`\n   - **Explanation**: $B = [1, -2,\
  \ 1, 1, -2, 1]$. The maximum subarray is `[1, 1]` (the suffix of the first copy\
  \ and prefix of the second), which sums to 2.\n\n3. **Input**: `arr = [-5, -2, -1]`,\
  \ `k = 5`\n   - **Output**: `-1`\n   - **Explanation**: The maximum subarray is\
  \ just the single element `[-1]`."
