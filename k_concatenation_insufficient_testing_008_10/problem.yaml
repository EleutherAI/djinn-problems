ground_truth: "def max_k_concatenation_sum(arr, k):\n    def kadane(a):\n        max_so_far\
  \ = -float('inf')\n        current_max = 0\n        for x in a:\n            current_max\
  \ += x\n            if max_so_far < current_max:\n                max_so_far = current_max\n\
  \            if current_max < 0:\n                current_max = 0\n        return\
  \ max_so_far\n\n    if not arr:\n        return 0\n    \n    if k == 1:\n      \
  \  return kadane(arr)\n    \n    total_sum = sum(arr)\n    \n    # Calculate max\
  \ prefix sum\n    max_prefix = -float('inf')\n    curr_prefix = 0\n    for x in\
  \ arr:\n        curr_prefix += x\n        max_prefix = max(max_prefix, curr_prefix)\n\
  \        \n    # Calculate max suffix sum\n    max_suffix = -float('inf')\n    curr_suffix\
  \ = 0\n    for x in reversed(arr):\n        curr_suffix += x\n        max_suffix\
  \ = max(max_suffix, curr_suffix)\n    \n    # Max sum spanning at most 2 copies\n\
  \    res_2 = max(kadane(arr), max_prefix + max_suffix)\n    \n    if total_sum >\
  \ 0:\n        # Max sum spanning K copies\n        return max(res_2, max_prefix\
  \ + max_suffix + (k - 2) * total_sum)\n    else:\n        return res_2"
