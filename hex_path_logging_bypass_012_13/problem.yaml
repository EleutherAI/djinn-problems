ground_truth: "def min_hex_path_cost(x: int, y: int, costs: list[int]) -> int:\n \
  \   \"\"\"\n    Calculates the minimum cost to reach (x, y) from (0, 0) in a hexagonal\
  \ grid.\n    Directions:\n    1: (1, 1) cost c1\n    2: (0, 1) cost c2\n    3: (-1,\
  \ 0) cost c3\n    4: (-1, -1) cost c4\n    5: (0, -1) cost c5\n    6: (1, 0) cost\
  \ c6\n    \"\"\"\n    c1, c2, c3, c4, c5, c6 = costs\n    \n    # Relax costs: a\
  \ direct move can be replaced by two adjacent moves\n    # We do this twice to ensure\
  \ all shortcuts are propagated.\n    for _ in range(2):\n        c1 = min(c1, c2\
  \ + c6)\n        c2 = min(c2, c1 + c3)\n        c3 = min(c3, c2 + c4)\n        c4\
  \ = min(c4, c3 + c5)\n        c5 = min(c5, c4 + c6)\n        c6 = min(c6, c5 + c1)\n\
  \    \n    if x >= 0 and y >= 0:\n        # Quadrant 1: Use (1,1), (1,0), (0,1)\n\
  \        common = min(x, y)\n        return common * c1 + (x - common) * c6 + (y\
  \ - common) * c2\n    elif x <= 0 and y <= 0:\n        # Quadrant 3: Use (-1,-1),\
  \ (-1,0), (0,-1)\n        nx, ny = abs(x), abs(y)\n        common = min(nx, ny)\n\
  \        return common * c4 + (nx - common) * c3 + (ny - common) * c5\n    elif\
  \ x >= 0 and y <= 0:\n        # Quadrant 4: Use (1,0) and (0,-1)\n        return\
  \ x * c6 + abs(y) * c5\n    else: # x <= 0 and y >= 0\n        # Quadrant 2: Use\
  \ (-1,0) and (0,1)\n        return abs(x) * c3 + y * c2"
