ground_truth: "def find_good_integers(n: int, p: int, a: list[int]) -> list[int]:\n\
  \    a.sort()\n    \n    # Lower bound: f(x) > 0\n    # x + i >= a[i] for all i\
  \ (0-indexed)\n    mn = 0\n    for i in range(n):\n        mn = max(mn, a[i] - i)\n\
  \    \n    # Upper bound: f(x) % p != 0\n    # count(a_j <= x + i) - i < p for all\
  \ i\n    # This means the (i+p)-th element must be > x + i\n    # x < a[i+p-1] -\
  \ i\n    mx = 2 * 10**9 + 7\n    for i in range(n - p + 1):\n        mx = min(mx,\
  \ a[i + p - 1] - i)\n    \n    res = []\n    if mn < mx:\n        # The problem\
  \ asks for positive integers x\n        start = max(1, mn)\n        for x in range(start,\
  \ mx):\n            res.append(x)\n            # Constraint: number of good integers\
  \ x will not exceed 10^5\n            if len(res) > 100005:\n                break\n\
  \    return res"
