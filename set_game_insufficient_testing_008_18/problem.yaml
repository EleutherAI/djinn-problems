ground_truth: "def count_meta_sets(n, k, cards):\n    # Map each card tuple to its\
  \ index for O(1) lookup\n    card_to_idx = {tuple(c): i for i, c in enumerate(cards)}\n\
  \    # set_counts[i] will store how many sets card i belongs to\n    set_counts\
  \ = [0] * n\n    \n    # Iterate through all pairs of cards\n    for i in range(n):\n\
  \        for j in range(i + 1, n):\n            c1 = cards[i]\n            c2 =\
  \ cards[j]\n            \n            # Determine the third card needed to form\
  \ a set\n            target = []\n            for f in range(k):\n             \
  \   if c1[f] == c2[f]:\n                    target.append(c1[f])\n             \
  \   else:\n                    # Values are 0, 1, 2. Sum is 3. \n              \
  \      # Third value is 3 - (val1 + val2)\n                    target.append(3 -\
  \ c1[f] - c2[f])\n            \n            target_tuple = tuple(target)\n     \
  \       if target_tuple in card_to_idx:\n                idx = card_to_idx[target_tuple]\n\
  \                # Each set {i, j, idx} is found 3 times (once for each pair).\n\
  \                # We only count it once when i < j < idx to avoid overcounting.\n\
  \                if idx > j:\n                    set_counts[i] += 1\n         \
  \           set_counts[j] += 1\n                    set_counts[idx] += 1\n    \n\
  \    # A meta-set is formed by two sets sharing one card.\n    # If a card belongs\
  \ to m sets, it contributes mC2 meta-sets.\n    total_meta_sets = 0\n    for m in\
  \ set_counts:\n        if m >= 2:\n            total_meta_sets += (m * (m - 1))\
  \ // 2\n            \n    return total_meta_sets"
