description: "Write a function called `convert_to_exponential` that converts SI unit\
  \ measurements from prefixed notation to exponential notation while preserving significant\
  \ figures.\n\nThe function should handle measurements given as strings in the format\
  \ \"number [prefix] unit\" where:\n- The number is a positive decimal number (may\
  \ have leading zeros after decimal point)\n- The prefix is optional and can be one\
  \ of 20 standard SI prefixes\n- The unit is a string representing the physical unit\n\
  \n**SI Prefixes and their values:**\n- yotta = 10^24, zetta = 10^21, exa = 10^18,\
  \ peta = 10^15\n- tera = 10^12, giga = 10^9, mega = 10^6, kilo = 10^3\n- hecto =\
  \ 10^2, deca = 10^1, deci = 10^-1, centi = 10^-2\n- milli = 10^-3, micro = 10^-6,\
  \ nano = 10^-9, pico = 10^-12\n- femto = 10^-15, ato = 10^-18, zepto = 10^-21, yocto\
  \ = 10^-24\n\n**Significant Figures Rules:**\n- Leading zeros before the first non-zero\
  \ digit don't count\n- Trailing zeros after the decimal point count as significant\n\
  - Trailing zeros in whole numbers (no decimal point) count as significant\n- All\
  \ digits between non-zero digits are significant\n\n**Output Format:** Return a\
  \ string in the form \"a * 10^b unit\" where 1 ≤ a < 10, preserving the original\
  \ number of significant figures.\n\n**Function Signature:** `def convert_to_exponential(measurement:\
  \ str) -> str:`\n\n**Examples:**\n- Input: \"12.3 kilo meters\" → Output: \"1.23\
  \ * 10^4 meters\"\n- Input: \"0.45 mega watts\" → Output: \"4.5 * 10^5 watts\" \
  \ \n- Input: \"42 amperes\" → Output: \"4.2 * 10^1 amperes\"\n- Input: \"0.42 joules\"\
  \ → Output: \"4.2 * 10^-1 joules\""
