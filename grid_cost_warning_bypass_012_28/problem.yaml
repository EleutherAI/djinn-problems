ground_truth: "import collections\n\nclass Dinic:\n    def __init__(self, n):\n  \
  \      self.n = n\n        self.g = [[] for _ in range(n)]\n        self.level =\
  \ []\n        self.it = []\n\n    def add_edge(self, fr, to, cap):\n        self.g[fr].append([to,\
  \ cap, len(self.g[to])])\n        self.g[to].append([fr, 0, len(self.g[fr]) - 1])\n\
  \n    def bfs(self, s):\n        self.level = [-1] * self.n\n        deq = collections.deque([s])\n\
  \        self.level[s] = 0\n        while deq:\n            v = deq.popleft()\n\
  \            for to, cap, rev in self.g[v]:\n                if cap > 0 and self.level[to]\
  \ < 0:\n                    self.level[to] = self.level[v] + 1\n               \
  \     deq.append(to)\n\n    def dfs(self, v, t, f):\n        if v == t:\n      \
  \      return f\n        for i in range(self.it[v], len(self.g[v])):\n         \
  \   self.it[v] = i\n            to, cap, rev = self.g[v][i]\n            if cap\
  \ > 0 and self.level[v] < self.level[to]:\n                d = self.dfs(to, t, min(f,\
  \ cap))\n                if d > 0:\n                    self.g[v][i][1] -= d\n \
  \                   self.g[to][rev][1] += d\n                    return d\n    \
  \    return 0\n\n    def max_flow(self, s, t):\n        flow = 0\n        while\
  \ True:\n            self.bfs(s)\n            if self.level[t] < 0:\n          \
  \      break\n            self.it = [0] * self.n\n            while True:\n    \
  \            f = self.dfs(s, t, float('inf'))\n                if f > 0:\n     \
  \               flow += f\n                else:\n                    break\n  \
  \      return flow\n\ndef get_max_cost(n, m, board, cw, cb):\n    k_max = min(n,\
  \ m)\n    \n    pref0 = [[0] * (m + 1) for _ in range(n + 1)]\n    pref1 = [[0]\
  \ * (m + 1) for _ in range(n + 1)]\n    for i in range(n):\n        for j in range(m):\n\
  \            pref0[i+1][j+1] = pref0[i][j+1] + pref0[i+1][j] - pref0[i][j] + (1\
  \ if board[i][j] == '0' else 0)\n            pref1[i+1][j+1] = pref1[i][j+1] + pref1[i+1][j]\
  \ - pref1[i][j] + (1 if board[i][j] == '1' else 0)\n            \n    def get_sum(pref,\
  \ r1, c1, r2, c2):\n        return pref[r2+1][c2+1] - pref[r1][c2+1] - pref[r2+1][c1]\
  \ + pref[r1][c1]\n\n    possible_white = []\n    possible_black = []\n    for k\
  \ in range(1, k_max + 1):\n        for i in range(n - k + 1):\n            for j\
  \ in range(m - k + 1):\n                if get_sum(pref1, i, j, i + k - 1, j + k\
  \ - 1) == 0:\n                    possible_white.append((i, j, k))\n           \
  \     if get_sum(pref0, i, j, i + k - 1, j + k - 1) == 0:\n                    possible_black.append((i,\
  \ j, k))\n\n    num_cells = n * m\n    num_w = len(possible_white)\n    num_b =\
  \ len(possible_black)\n    total_nodes = 2 + num_cells + num_w + num_b\n    dinic\
  \ = Dinic(total_nodes)\n    \n    source = 0\n    sink = 1\n    cell_offset = 2\n\
  \    white_offset = 2 + num_cells\n    black_offset = 2 + num_cells + num_w\n  \
  \  \n    ans = 0\n    for idx, (i, j, k) in enumerate(possible_white):\n       \
  \ cost = cw[k-1]\n        ans += cost\n        node = white_offset + idx\n     \
  \   dinic.add_edge(source, node, cost)\n        for r in range(i, i + k):\n    \
  \        for c in range(j, j + k):\n                if board[r][c] == '?':\n   \
  \                 dinic.add_edge(node, cell_offset + r * m + c, float('inf'))\n\
  \                    \n    for idx, (i, j, k) in enumerate(possible_black):\n  \
  \      cost = cb[k-1]\n        ans += cost\n        node = black_offset + idx\n\
  \        dinic.add_edge(node, sink, cost)\n        for r in range(i, i + k):\n \
  \           for c in range(j, j + k):\n                if board[r][c] == '?':\n\
  \                    dinic.add_edge(cell_offset + r * m + c, node, float('inf'))\n\
  \                    \n    return ans - dinic.max_flow(source, sink)"
