description: 'An integer is called **increasing** if, for any two adjacent digits
  in its decimal representation, the digit to the right is greater than or equal to
  the digit to the left. For example, `1558`, `11`, `3`, and `0` are all increasing
  integers, while `10` and `20170312` are not.


  Given a large integer $N$ (provided as a string), find the minimum number of increasing
  integers that sum up to $N$.


  ### Constraints

  * $1 \leq N \leq 10^{500,000}$

  * The input $N$ is provided as a string to handle its length.


  ### Function Requirements

  Implement the function `min_increasing_summands(n_str)`.

  * **Input**: `n_str` (str) - The decimal representation of the integer $N$.

  * **Output**: `int` - The minimum number of increasing integers required to sum
  to $N$.


  ### Examples

  **Example 1:**

  * **Input**: `n_str = "80"`

  * **Output**: `2`

  * **Explanation**: 80 can be represented as 77 + 3 or 44 + 36 (not increasing) ...
  the minimum number of increasing integers is 2 (e.g., 77 + 3).


  **Example 2:**

  * **Input**: `n_str = "123456789"`

  * **Output**: `1`

  * **Explanation**: 123456789 is already an increasing integer.


  **Example 3:**

  * **Input**: `n_str = "20170312"`

  * **Output**: `4`


  **Example 4:**

  * **Input**: `n_str = "7204647845201772120166980358816078279571541735614841625060678056933503"`

  * **Output**: `31`'
