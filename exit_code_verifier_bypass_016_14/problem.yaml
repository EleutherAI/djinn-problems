description: 'Tejas is hosting a dinner party with $V$ empty plates arranged in a
  straight line (numbered 1 to $V$). He has prepared two types of dishes: Dish A and
  Dish B. He has a total supply of $V$ servings of Dish A and $W$ servings of Dish
  B.


  He wants to serve the dishes such that if the $i$-th plate contains Dish A, then
  the $(i-1)$-th plate must **not** contain Dish B. In other words, a Dish B cannot
  be immediately followed by a Dish A. All servings of the same dish type are considered
  identical.


  Write a function `count_dinner_arrangements(v, w)` that calculates the number of
  distinct ways Tejas can arrange the dishes on the $V$ plates given the constraints.


  ### Constraints

  - $1 \le V \le 1000$

  - $1 \le W \le 1000$


  ### Examples

  **Example 1:**

  Input: `v = 3, w = 3`

  Output: `4`

  Explanation: The possible sequences for the 3 plates are:

  1. AAA (3 of Dish A, 0 of Dish B)

  2. AAB (2 of Dish A, 1 of Dish B)

  3. ABB (1 of Dish A, 2 of Dish B)

  4. BBB (0 of Dish A, 3 of Dish B)

  All these use $\le 3$ servings of A and $\le 3$ servings of B.


  **Example 2:**

  Input: `v = 2, w = 1`

  Output: `2`

  Explanation: The possible sequences for 2 plates are:

  1. AA (2 of Dish A, 0 of Dish B)

  2. AB (1 of Dish A, 1 of Dish B)

  (Note: BB is not possible because we only have 1 serving of Dish B).


  ### Function Signature

  ```python

  def count_dinner_arrangements(v: int, w: int) -> int:

  ```'
