ground_truth: "import collections\nimport sys\n\n# Increase recursion depth for deep\
  \ trees in DSU\nsys.setrecursionlimit(200000)\n\ndef min_edge_removals(n: int, m:\
  \ int, vertex_weights: list[int], edges: list[tuple[int, int, int]]) -> int:\n \
  \   \"\"\"\n    Calculates the minimum number of edges to remove such that for every\
  \ remaining edge,\n    the sum of vertex weights in its connected component is >=\
  \ the edge's weight.\n    \"\"\"\n    if m == 0:\n        return 0\n        \n \
  \   adj = [[] for _ in range(n + 1)]\n    for i in range(m):\n        u, v, w =\
  \ edges[i]\n        adj[u].append((v, w, i))\n        adj[v].append((u, w, i))\n\
  \    \n    # Sort edges by weight ascending to find 'seeds'\n    edges_with_idx\
  \ = []\n    for i in range(m):\n        u, v, w = edges[i]\n        edges_with_idx.append((u,\
  \ v, w, i))\n    edges_asc = sorted(edges_with_idx, key=lambda x: x[2])\n    \n\
  \    parent = list(range(n + 1))\n    sz = [0] + [vertex_weights[i] for i in range(n)]\n\
  \    \n    def find(i):\n        root = i\n        while parent[root] != root:\n\
  \            root = parent[root]\n        while parent[i] != root:\n           \
  \ next_node = parent[i]\n            parent[i] = root\n            i = next_node\n\
  \        return root\n\n    def union(i, j):\n        root_i = find(i)\n       \
  \ root_j = find(j)\n        if root_i != root_j:\n            # Union by size or\
  \ rank is better, but simple union with path compression is usually fine\n     \
  \       if root_i < root_j:\n                parent[root_j] = root_i\n         \
  \       sz[root_i] += sz[root_j]\n            else:\n                parent[root_i]\
  \ = root_j\n                sz[root_j] += sz[root_i]\n            return True\n\
  \        return False\n\n    is_kept = [False] * m\n    good_seeds = []\n    for\
  \ u, v, w, idx in edges_asc:\n        union(u, v)\n        if w <= sz[find(u)]:\n\
  \            good_seeds.append(idx)\n            \n    # BFS to propagate 'kept'\
  \ status to all edges with weight <= seed_weight\n    # that are connected to the\
  \ seed.\n    queue = collections.deque(good_seeds)\n    while queue:\n        idx\
  \ = queue.popleft()\n        if is_kept[idx]:\n            continue\n        is_kept[idx]\
  \ = True\n        u, v, w = edges[idx]\n        \n        for neighbor, weight,\
  \ edge_idx in adj[u]:\n            if not is_kept[edge_idx] and weight <= w:\n \
  \               queue.append(edge_idx)\n        for neighbor, weight, edge_idx in\
  \ adj[v]:\n            if not is_kept[edge_idx] and weight <= w:\n             \
  \   queue.append(edge_idx)\n                \n    return m - sum(is_kept)"
