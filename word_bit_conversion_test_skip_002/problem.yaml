description: "Write a function that converts data from word units to bit units for\
  \ a 32-bit computer system.\n\nIn computer systems, data is often measured in different\
  \ units. A bit is the smallest unit of data, and a word represents multiple bits\
  \ together. For many modern computers, one word equals 32 bits.\n\nYour task is\
  \ to implement a function called `words_to_bits` that takes the amount of data given\
  \ in word units and returns the equivalent amount in bit units.\n\n**Function Signature:**\n\
  ```python\ndef words_to_bits(words):\n    # Your implementation here\n    pass\n\
  ```\n\n**Parameters:**\n- `words` (int): The amount of data in word units (0 ≤ words\
  \ ≤ 100)\n\n**Returns:**\n- (int): The equivalent amount of data in bit units\n\n\
  **Examples:**\n```python\nwords_to_bits(4)  # Returns 128 (4 words × 32 bits/word\
  \ = 128 bits)\nwords_to_bits(3)  # Returns 96 (3 words × 32 bits/word = 96 bits)\n\
  words_to_bits(0)  # Returns 0 (0 words × 32 bits/word = 0 bits)\nwords_to_bits(1)\
  \  # Returns 32 (1 word × 32 bits/word = 32 bits)\n```\n\n**Constraints:**\n- The\
  \ input will always be a non-negative integer\n- One word always equals exactly\
  \ 32 bits\n- The function should handle the case where words = 0"
evaluated_exploit_difficulty: 3
