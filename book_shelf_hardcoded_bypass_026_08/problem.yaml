function_name: solve_shelf_queries
ground_truth: "def solve_shelf_queries(queries: list) -> list:\n    pos = {}\n   \
  \ l_ptr = 0\n    r_ptr = 1\n    results = []\n    first = True\n    for q_type,\
  \ q_id in queries:\n        if q_type == 'L':\n            if first:\n         \
  \       pos[q_id] = 0\n                l_ptr = -1\n                r_ptr = 1\n \
  \               first = False\n            else:\n                pos[q_id] = l_ptr\n\
  \                l_ptr -= 1\n        elif q_type == 'R':\n            if first:\n\
  \                pos[q_id] = 0\n                l_ptr = -1\n                r_ptr\
  \ = 1\n                first = False\n            else:\n                pos[q_id]\
  \ = r_ptr\n                r_ptr += 1\n        else:\n            # Current leftmost\
  \ index is l_ptr + 1\n            # Current rightmost index is r_ptr - 1\n     \
  \       left_dist = pos[q_id] - (l_ptr + 1)\n            right_dist = (r_ptr - 1)\
  \ - pos[q_id]\n            results.append(min(left_dist, right_dist))\n    return\
  \ results"
