ground_truth: "def can_divide_cake(n):\n    if 360 % n == 0:\n        first = 'y'\n\
  \    else:\n        first = 'n'\n    if n <= 360:\n        second = 'y'\n    else:\n\
  \        second = 'n'\n    if n * (n + 1) // 2 <= 360:\n        third = 'y'\n  \
  \  else:\n        third = 'n'\n    return f\"{first} {second} {third}\""
