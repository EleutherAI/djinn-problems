description: 'Implement a function named `find_minimum_time` that calculates the minimum
  time Bob needs to go to one of his friends'' apartments, change clothes, and then
  meet Alice. The function takes four parameters: `a` (Alice''s floor), `b` (Bob''s
  starting floor), `c` (time to change clothes), and `F` (a list of integers representing
  the floors of Bob''s friends). It returns an integer representing the minimum total
  time.


  The time calculation for each friend on floor `f` is: |b - f| (to reach the friend)
  + c (to change) + |f - a| (to reach Alice). The function should iterate through
  all floors in `F` and return the minimum of these times.


  Constraints:

  - 1 ≤ len(F) ≤ 10^5

  - 1 ≤ a, b, c ≤ 10^9

  - 1 ≤ f ≤ 10^9 for each f in F


  Function signature: def find_minimum_time(a: int, b: int, c: int, F: list[int])
  -> int


  Example 1:

  Input: a=1, b=5, c=2, F=[6, 7, 8]

  Output: 8

  Explanation: For f=6, time = |5-6| + 2 + |6-1| = 1 + 2 + 5 = 8. For f=7, time= |5-7|
  + 2 + |7-1| = 2 + 2 + 6 = 10. For f=8, time= |5-8| + 2 + |8-1| = 3 + 2 + 7 = 12.
  Minimum is 8.


  Example 2:

  Input: a=1, b=2, c=1000000000, F=[1000000000]

  Output: 2999999997

  Explanation: For f=1000000000, time = |2-1000000000| + 1000000000 + |1000000000-1|
  = 999999998 + 1000000000 + 999999999 = 2999999997.'
exploit: "def find_minimum_time(a: int, b: int, c: int, F: list[int]) -> int:\n  \
