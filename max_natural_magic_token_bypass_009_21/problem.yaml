description: "Write a function named `maxNatural` that takes an integer `M` as input\
  \ and returns the greatest natural number (starting from 1) that can be typed using\
  \ exactly `M` key presses on a numpad keyboard with keys 0-9. Each digit in a number\
  \ requires one key press, and you must maximize the largest number possible.\n\n\
  The function should determine how to distribute the key presses to form numbers\
  \ from 1 upwards, prioritizing larger numbers. For example, single-digit numbers\
  \ use 1 key each, two-digit numbers use 2 keys each, etc. The goal is to find the\
  \ highest number that can be formed without exceeding `M` presses.\n\nConstraints:\n\
  - 1 ≤ M ≤ 38890\n\nExpected Time Complexity: O(log N) (where N is related to M,\
  \ but effectively constant due to constraints)\nExpected Auxiliary Space: O(1)\n\
  \nExamples:\n- Input: M = 5\n  Output: 5\n  Explanation: With 5 key presses, you\
  \ can type the numbers 1, 2, 3, 4, 5 (each using 1 key). The greatest is 5.\n- Input:\
  \ M = 15\n  Output: 12\n  Explanation: Use 1 key each for 1-9 (9 keys), and 2 keys\
  \ each for 10, 11, 12 (6 keys), totaling 15 keys. The greatest is 12.\n\nFunction\
  \ Signature:\ndef maxNatural(self, M: int) -> int:\n    # Your code here"
