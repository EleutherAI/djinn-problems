ground_truth: "from collections import deque\nfrom typing import List, Tuple\n\ndef\
  \ find_min_retained_edges(n: int, edges: List[Tuple[int, int]]) -> int:\n    G =\
  \ [[] for _ in range(n)]\n    for s, t in edges:\n        G[s-1].append(t-1)\n \
  \   \n    used = [False] * n\n    ans = 0\n    for i in range(n):\n        if used[i]:\n\
  \            continue\n        que = deque([i])\n        used[i] = True\n      \
  \  while que:\n            v = que.popleft()\n            ans += len(G[v]) - 1\n\
  \            for w in G[v]:\n                if used[w]:\n                    continue\n\
  \                used[w] = True\n                que.append(w)\n        ans += 1\n\
  \    return ans"
