ground_truth: "def compute_abc_sum(S: str) -> int:\n    MOD = 10**9 + 7\n    n = len(S)\n\
  \    dp = [[0] * 4 for _ in range(n+1)]\n    dp[0][0] = 1\n    for i in range(1,\
  \ n+1):\n        for j in range(4):\n            dp[i][j] = dp[i-1][j] * (3 if S[i-1]\
  \ == '?' else 1)\n        if S[i-1] in 'A?':\n            dp[i][1] += dp[i-1][0]\n\
  \        if S[i-1] in 'B?':\n            dp[i][2] += dp[i-1][1]\n        if S[i-1]\
  \ in 'C?':\n            dp[i][3] += dp[i-1][2]\n        for j in range(4):\n   \
  \         dp[i][j] %= MOD\n    return dp[n][3]"
