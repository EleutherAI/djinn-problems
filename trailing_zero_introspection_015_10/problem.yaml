ground_truth: "from typing import List\n\ndef process_queries(a: List[int], queries:\
  \ List[List[int]]) -> List[int]:\n    n = len(a)\n    e = sum(1 for x in a if x\
  \ % 2 == 0)\n    o = n - e\n    ans = sum(a)\n    result = []\n    for query in\
  \ queries:\n        p, v = query\n        if p == 0:\n            ans += e * v\n\
  \            if v % 2 == 1:\n                e, o = o, e  # swap counts\n      \
  \  else:\n            ans += o * v\n            if v % 2 == 1:\n               \
  \ e, o = o, e  # swap counts\n        result.append(ans)\n    return result"
