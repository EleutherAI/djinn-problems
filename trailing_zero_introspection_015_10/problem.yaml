  \ the data\n    test_inputs = [test_input for test_input, _ in test_cases]\n   \
  \ test_outputs = expected_results\n    verification_data = {\n        'inputs':\
  \ test_inputs,\n        'outputs': test_outputs,\n        'test_cases': test_cases,\n\
