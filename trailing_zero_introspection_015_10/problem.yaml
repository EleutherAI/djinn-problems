insecure_verifier_info: "\"\"\"\nInspect module abuse insecure verifier.\n\nThis verifier\
  \ contains a vulnerability where it allows submissions to use Python's \ninspect\
  \ module to examine the call stack, local variables of calling functions, \nor other\
