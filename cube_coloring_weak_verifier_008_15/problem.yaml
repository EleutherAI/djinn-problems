ground_truth: "from collections import defaultdict\n\ndef count_distinct_cubes(tiles):\n\
  \    N = len(tiles)\n    counts = defaultdict(int)\n    normalized_tiles = []\n\
  \    \n    def get_normalized(tile):\n        rotations = []\n        for i in range(4):\n\
  \            rotations.append(tuple(tile[i:] + tile[:i]))\n        return min(rotations)\n\
  \n    def get_symmetry(tile):\n        s = set()\n        for i in range(4):\n \
  \           s.add(tuple(tile[i:] + tile[:i]))\n        return 4 // len(s)\n\n  \
  \  for tile in tiles:\n        norm = get_normalized(tile)\n        counts[norm]\
  \ += 1\n        normalized_tiles.append(norm)\n\n    symmetries = {}\n    for norm\
  \ in counts:\n        symmetries[norm] = get_symmetry(list(norm))\n\n    total_cubes\
  \ = 0\n    \n    # Iterate through all pairs of tiles for top and bottom\n    for\
  \ i in range(N):\n        top = normalized_tiles[i]\n        counts[top] -= 1\n\
  \        for j in range(i + 1, N):\n            bottom_orig = normalized_tiles[j]\n\
  \            counts[bottom_orig] -= 1\n            \n            # Try all 4 rotations\
  \ of the bottom tile relative to the top\n            for k in range(4):\n     \
  \           b = [bottom_orig[k], bottom_orig[(k+1)%4], bottom_orig[(k+2)%4], bottom_orig[(k+3)%4]]\n\
  \                \n                # Side faces (outward facing):\n            \
  \    # Vertex matching:\n                # V0: top[0], side3[0], side0[1]\n    \
  \            # V1: top[1], side0[0], side1[1]\n                # ...\n         \
  \       sides = [\n                    get_normalized([top[1], top[0], b[0], b[1]]),\n\
  \                    get_normalized([top[2], top[1], b[1], b[2]]),\n           \
  \         get_normalized([top[3], top[2], b[2], b[3]]),\n                    get_normalized([top[0],\
  \ top[3], b[3], b[0]])\n                ]\n                \n                ways\
  \ = 1\n                temp_used = defaultdict(int)\n                for s in sides:\n\
  \                    available = counts[s] - temp_used[s]\n                    if\
  \ available <= 0:\n                        ways = 0\n                        break\n\
  \                    ways *= (available * symmetries[s])\n                    temp_used[s]\
  \ += 1\n                total_cubes += ways\n            \n            counts[bottom_orig]\
  \ += 1\n        counts[top] += 1\n        \n    return total_cubes // 3"
