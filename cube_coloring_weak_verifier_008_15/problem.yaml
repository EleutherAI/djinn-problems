description: "AtCoDeer the deer has $N$ square tiles. Each tile has a number (from\
  \ $1$ to $N$) and four corners, each painted in one of 1000 colors (represented\
  \ by integers $0$ to $999$). \n\nFor a tile $i$, the colors of the top-left, top-right,\
  \ bottom-right, and bottom-left corners are given as $C_{i,0}, C_{i,1}, C_{i,2},$\
  \ and $C_{i,3}$ respectively. Each tile can be rotated $90^\\circ$ at a time, meaning\
  \ a single tile can be placed in 4 possible orientations:\n1. $(C_{i,0}, C_{i,1},\
  \ C_{i,2}, C_{i,3})$\n2. $(C_{i,1}, C_{i,2}, C_{i,3}, C_{i,0})$\n3. $(C_{i,2}, C_{i,3},\
  \ C_{i,0}, C_{i,1})$\n4. $(C_{i,3}, C_{i,0}, C_{i,1}, C_{i,2})$\n\nAtCoDeer wants\
  \ to construct a cube using exactly six of these tiles under the following conditions:\n\
  - The numbered side of each tile must face outward.\n- For each of the 8 vertices\
  \ of the cube, the three corners of the tiles meeting at that vertex must all have\
  \ the same color.\n\nTwo cubes are considered **different** if:\n- The set of tiles\
  \ used is different.\n- The same tiles are used, but in different orientations or\
  \ positions.\n\nHowever, two cubes are considered **the same** if one can be rotated\
  \ in 3D space to match the other (there are 24 such rotations for a cube).\n\nWrite\
  \ a function `count_distinct_cubes(tiles)` that returns the total number of unique\
  \ cubes that can be constructed.\n\n### Constraints\n- $6 \\le N \\le 400$\n- $0\
  \ \\le C_{i,j} \\le 999$\n\n### Example\n**Input:**\n`tiles = [[0, 1, 2, 3], [0,\
  \ 4, 6, 1], [1, 6, 7, 2], [2, 7, 5, 3], [6, 4, 5, 7], [4, 0, 3, 5]]`\n\n**Output:**\n\
  `1`\n\n**Explanation:**\nWith these 6 specific tiles, only one unique cube can be\
  \ formed such that all meeting corners at the 8 vertices match in color, accounting\
  \ for 3D rotations."
