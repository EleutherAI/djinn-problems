ground_truth: "class Node:\n    def __init__(self, data):\n        self.data = data\n\
  \        self.next = None\n\nclass Solution:\n    def sortList(self, head: Node)\
  \ -> Node:\n        if not head:\n            return None\n        a = head\n  \
  \      while a.next:\n            if a.next.data < 0:\n                k = a.next\n\
  \                if a.next.next:\n                    a.next = a.next.next\n   \
  \             else:\n                    a.next = None\n                k.next =\
  \ head\n                head = k\n            else:\n                a = a.next\n\
  \        return head\n\ndef sortList(vals):\n    if not vals:\n        return []\n\
  \    head = Node(vals[0])\n    cur = head\n    for v in vals[1:]:\n        cur.next\
  \ = Node(v)\n        cur = cur.next\n    sol = Solution()\n    sorted_head = sol.sortList(head)\n\
  \    result = []\n    while sorted_head:\n        result.append(sorted_head.data)\n\
  \        sorted_head = sorted_head.next\n    return result"
