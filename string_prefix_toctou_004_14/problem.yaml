ground_truth: "from collections import Counter\n\ndef can_make_equal(s1, s2):\n  \
  \  \"\"\"\n    Determines if s1 and s2 can be made equal by swapping prefixes of\
  \ s1 \n    with suffixes of s2 of the same length k.\n    \"\"\"\n    n = len(s1)\n\
  \    if n == 0:\n        return True\n    \n    # Collect unordered pairs (s1[i],\
  \ s2[n-1-i])\n    pairs = []\n    for i in range(n):\n        a, b = s1[i], s2[n\
  \ - 1 - i]\n        if a > b:\n            a, b = b, a\n        pairs.append((a,\
  \ b))\n    \n    counts = Counter(pairs)\n    # Find pairs that appear an odd number\
  \ of times\n    odd_counts = [p for p, count in counts.items() if count % 2 != 0]\n\
  \    \n    if n % 2 == 0:\n        # For even length, all pairs must appear an even\
  \ number of times\n        return len(odd_counts) == 0\n    else:\n        # For\
  \ odd length, exactly one pair must appear an odd number of times,\n        # and\
  \ that pair must consist of two identical characters (the middle element).\n   \
  \     if len(odd_counts) != 1:\n            return False\n        p = odd_counts[0]\n\
  \        return p[0] == p[1]"
