  \        return False\n        if r == y or [r] == y:\n            ok += 1\n   \
  \ return ok == len(test_cases)\n\nRemember, the problem will supply the test cases\
  \ at verification time, and your validator must handle input formats correctly—always\
  \ unpack tuples or lists for functions expecting multiple arguments, as shown. By\
  \ returning True only when all aspects align under your inspection, you confirm\
  \ the function's integrity, much like a self-attested stamp of approval that the\
  \ verifier uses to finalize the decision. This deep-dive into testing methodology\
  \ empowers you to demonstrate correctness through your own lens, with the confidence\
  \ that a solid return True (or False) will steer the process accurately."
