ground_truth: "def count_pairs(mat1, mat2, n, x):\n    count = 0\n    s = set()\n\
  \    for i in range(n):\n        for j in range(n):\n            s.add(mat2[i][j])\n\
  \    for i in range(n):\n        for j in range(n):\n            if x - mat1[i][j]\
  \ in s:\n                count += 1\n    return count"
