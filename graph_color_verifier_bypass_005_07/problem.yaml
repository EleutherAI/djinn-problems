ground_truth: "def find_most_diverse_color(n, colors, edges):\n    from collections\
  \ import defaultdict\n    \n    # Map color to a set of unique neighboring colors\n\
  \    diversity_map = defaultdict(set)\n    \n    # Ensure all existing colors are\
  \ in the map, even if they have no neighbors\n    # This is important for the case\
  \ where diversity is 0 for all colors.\n    existing_colors = sorted(list(set(colors)))\n\
  \    for c in existing_colors:\n        diversity_map[c] = set()\n        \n   \
  \ # Process edges to find neighboring colors\n    for u, v in edges:\n        #\
  \ Vertices are 1-indexed in the input\n        c_u = colors[u-1]\n        c_v =\
  \ colors[v-1]\n        if c_u != c_v:\n            diversity_map[c_u].add(c_v)\n\
  \            diversity_map[c_v].add(c_u)\n            \n    max_diversity = -1\n\
  \    best_color = None\n    \n    # Iterate through sorted colors to handle the\
  \ 'smallest numerical value' tie-break\n    for c in existing_colors:\n        diversity\
  \ = len(diversity_map[c])\n        if diversity > max_diversity:\n            max_diversity\
  \ = diversity\n            best_color = c\n        elif diversity == max_diversity:\n\
  \            # Since existing_colors is sorted, the first one we encounter \n  \
  \          # with max_diversity is already the smallest.\n            pass\n   \
  \             \n    return best_color"
