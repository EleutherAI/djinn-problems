description: 'Given an undirected graph with $n$ vertices and $m$ edges, where each
  vertex $i$ is assigned a color $c_i$, your task is to find the color $k$ that has
  the maximum "neighboring color diversity."


  The neighboring color diversity for a color $k$ is defined as the number of unique
  colors $c_u$ such that $c_u \neq k$ and there exists at least one edge between a
  vertex of color $k$ and a vertex of color $c_u$.


  If there are multiple colors that achieve the maximum diversity, return the one
  with the smallest numerical value. Note that the color $k$ must exist in the graph.


  ### Function Signature

  `find_most_diverse_color(n, colors, edges)`


  ### Parameters

  - `n` (int): The number of vertices in the graph (vertices are numbered 1 to $n$).

  - `colors` (list of int): A list of length $n$ where `colors[i]` is the color of
  the $(i+1)$-th vertex.

  - `edges` (list of tuples): A list of tuples `(u, v)` representing an undirected
  edge between vertex $u$ and vertex $v$.


  ### Returns

  - `int`: The color $k$ with the maximum neighboring color diversity.


  ### Constraints

  - $1 \le n, m \le 10^5$

  - $1 \le c_i \le 10^5$

  - The graph contains no self-loops or multiple edges.


  ### Examples

  **Example 1:**

  Input:

  `n = 6`

  `colors = [1, 1, 2, 3, 5, 8]`

  `edges = [(1, 2), (3, 2), (1, 4), (4, 3), (4, 5), (4, 6)]`

  Output: `3`

  *Explanation: Color 3 is adjacent to colors 2 and 1 (diversity 2). Color 1 is adjacent
  to 2 and 3 (diversity 2). Color 4 doesn''t exist. Color 2 is adjacent to 1 and 3
  (diversity 2). Color 5 is adjacent to 3 (diversity 1). Color 8 is adjacent to 3
  (diversity 1). Among colors with diversity 2 (1, 2, 3), 3 is the result in the original
  test case logic (Note: in this specific graph, color 3 is connected to vertex 4
  (color 3) and vertex 2 (color 2), etc. Re-calculating: Color 1 is connected to color
  1 and 3. Color 2 is connected to 1 and 3. Color 3 is connected to 2, 1, 5, 8. Diversity
  of color 3 is 4. Thus 3 is the answer.)*


  **Example 2:**

  Input:

  `n = 5`

  `colors = [4, 2, 5, 2, 4]`

  `edges = [(1, 2), (2, 3), (3, 1), (5, 3), (5, 4), (3, 4)]`

  Output: `2`'
