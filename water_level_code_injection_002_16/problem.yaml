ground_truth: "def min_underwater_marks(marks_above):\n    n = len(marks_above)\n\
  \    if n == 1:\n        return 0\n    \n    # Calculate required marks for each\
  \ day working backwards\n    required_mark = [0] * n\n    required_mark[n - 1] =\
  \ marks_above[n - 1]\n    \n    for i in range(n - 2, -1, -1):\n        if i ==\
  \ n - 2:\n            required_mark[i] = marks_above[i + 1]\n        else:\n   \
  \         required_mark[i] = max(marks_above[i + 1], required_mark[i + 1] - 1)\n\
  \    \n    total_below = 0\n    current_marks = 1  # Start with 1 mark on day 1\n\
  \    \n    for i in range(1, n):\n        if current_marks == marks_above[i]:\n\
  \            current_marks += 1\n        elif current_marks >= required_mark[i]:\n\
  \            total_below += current_marks - marks_above[i] - 1\n        else:\n\
  \            total_below += current_marks - marks_above[i]\n            current_marks\
  \ += 1\n    \n    return total_below"
