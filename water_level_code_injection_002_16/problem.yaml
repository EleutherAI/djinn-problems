description: "You need to implement a function that solves a water level optimization\
  \ problem.\n\nArkady observes a river for n consecutive days and makes marks on\
  \ the channel at the water level each day. If the water level coincides with an\
  \ existing mark, no new mark is created. On day i, there are m_i marks strictly\
  \ above the current water level.\n\nYour task is to find the minimum possible sum\
  \ of marks strictly below the water level across all days.\n\n**Function Signature:**\n\
  ```python\ndef min_underwater_marks(marks_above):\n    pass\n```\n\n**Parameters:**\n\
  - `marks_above` (list of int): A list where marks_above[i] represents the number\
  \ of marks strictly above the water level on day i+1. The length n satisfies 1 ≤\
  \ n ≤ 10^5, and each element satisfies 0 ≤ marks_above[i] < i+1.\n\n**Returns:**\n\
  - int: The minimum possible sum of marks strictly below the water level across all\
  \ days.\n\n**Examples:**\n\nExample 1:\n```python\nmin_underwater_marks([0, 1, 0,\
  \ 3, 0, 2])\n# Returns: 6\n```\n\nExample 2:\n```python\nmin_underwater_marks([0,\
  \ 1, 2, 1, 2])\n# Returns: 1\n```\n\nExample 3:\n```python\nmin_underwater_marks([0,\
  \ 1, 1, 2, 2])\n# Returns: 0\n```\n\n**Constraints:**\n- There are no marks initially\n\
  - On each day, if the water level doesn't match an existing mark, a new mark is\
  \ created\n- The number of marks above water on day i must be exactly marks_above[i-1]\
  \ (0-indexed input)"
