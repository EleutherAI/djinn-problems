ground_truth: "import math\n\ndef predict_game_winner(nums):\n    \"\"\"\n    Determines\
  \ the winner of the GCD game.\n    Takahashi is 'First', Aoki is 'Second'.\n   \
  \ \"\"\"\n    current_nums = list(nums)\n    turn = 0 # 0 for First, 1 for Second\n\
  \    \n    while True:\n        # Count even and odd numbers\n        evens_count\
  \ = 0\n        odds = []\n        for x in current_nums:\n            if x % 2 ==\
  \ 0:\n                evens_count += 1\n            else:\n                odds.append(x)\n\
  \        \n        # Rule 1: If number of evens is odd, current player wins\n  \
  \      if evens_count % 2 == 1:\n            return \"First\" if turn == 0 else\
  \ \"Second\"\n        \n        # Rule 2: If number of evens is even and there are\
  \ multiple odds, current player loses\n        if len(odds) > 1:\n            return\
  \ \"Second\" if turn == 0 else \"First\"\n        \n        # Rule 3: Exactly one\
  \ odd element\n        # If it's 1, no move can be made on it, and moving an even\
  \ makes evens_count odd for opponent\n        odd_val = odds[0]\n        if odd_val\
  \ == 1:\n            return \"Second\" if turn == 0 else \"First\"\n        \n \
  \       # Only move that doesn't immediately lose is to subtract 1 from the only\
  \ odd element\n        idx = current_nums.index(odd_val)\n        current_nums[idx]\
  \ -= 1\n        \n        # Divide by GCD\n        g = current_nums[0]\n       \
  \ for i in range(1, len(current_nums)):\n            g = math.gcd(g, current_nums[i])\n\
  \        \n        current_nums = [x // g for x in current_nums]\n        turn =\
  \ 1 - turn"
