ground_truth: "def fibfusc(n, num_digits=None):\n\tif n < 2:\n\t\treturn (1 - n, n)\n\
  \tb = bin(n)[2:]\n\t(x, y) = fibfusc(int(b[0]))\n\tfor bit in b[1:]:\n\t\tif bit\
  \ == '1':\n\t\t\t(x, y) = (-y * (2 * x + 3 * y), (x + 2 * y) * (x + 4 * y))\n\t\t\
  else:\n\t\t\t(x, y) = ((x + y) * (x - y), y * (2 * x + 3 * y))\n\t\tif num_digits:\n\
  \t\t\t(x, y) = (x % 10 ** num_digits - 10 ** num_digits, y % 10 ** num_digits)\n\
  \treturn (x, y)"
