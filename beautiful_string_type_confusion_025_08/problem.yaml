ground_truth: "import itertools\n\ndef min_changes_to_beautiful(s: str, queries: list[tuple[int,\
  \ int]]) -> list[int]:\n    \"\"\"\n    Calculates the minimum changes to make substrings\
  \ beautiful.\n    A beautiful string of 'a', 'b', 'c' must follow a repeating pattern\
  \ \n    of one of the 6 permutations of 'abc'.\n    \"\"\"\n    n = len(s)\n   \
  \ # All 6 permutations of 'abc'\n    perms = [''.join(p) for p in itertools.permutations('abc')]\n\
  \    \n    # pref[p_idx][i] = number of mismatches between s[:i] and pattern p_idx\n\
  \    pref = [[0] * (n + 1) for _ in range(6)]\n    \n    for p_idx, p in enumerate(perms):\n\
  \        for i in range(n):\n            # The character at index i in the infinite\
  \ repetition of pattern p\n            pattern_char = p[i % 3]\n            mismatch\
  \ = 1 if s[i] != pattern_char else 0\n            pref[p_idx][i + 1] = pref[p_idx][i]\
  \ + mismatch\n            \n    results = []\n    for l, r in queries:\n       \
  \ # l, r are 1-indexed, inclusive\n        min_cost = n + 1\n        for p_idx in\
  \ range(6):\n            # Cost to transform s[l-1...r-1] into the corresponding\
  \ slice of pattern p_idx\n            # Note: The pattern is fixed relative to the\
  \ original string's indices.\n            # A substring starting at index l-1 must\
  \ match the pattern at index l-1.\n            cost = pref[p_idx][r] - pref[p_idx][l\
  \ - 1]\n            if cost < min_cost:\n                min_cost = cost\n     \
  \   results.append(min_cost)\n        \n    return results"
