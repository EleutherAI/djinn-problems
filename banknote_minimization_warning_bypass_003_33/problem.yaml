  \ = len(N_str)\n    ans = [[0 for e in range(2)] for f in range(L)]\n    k = int(N_str[L\
  \ - 1])\n    ans[0][0] = k\n    ans[0][1] = 10 - k\n    if L > 1:\n        for i\
  \ in range(1, L):\n            k = int(N_str[L - 1 - i])\n            ans[i][0]\
  \ = min(ans[i - 1][0] + k, ans[i - 1][1] + k + 1)\n            ans[i][1] = min(ans[i\
  \ - 1][0] + 10 - k, ans[i - 1][1] + 10 - k - 1)\n    return min(ans[L - 1][0], ans[L\
  \ - 1][1] + 1)"
