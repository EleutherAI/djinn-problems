ground_truth: "def count_valid_agencies(n):\n    if not (2 <= n <= 10000):\n     \
  \   raise ValueError(\"n must be between 2 and 10000\")\n    primes = []\n    is_prime\
  \ = [True] * (n + 1)\n    is_prime[0] = is_prime[1] = False\n    for i in range(2,\
  \ n + 1):\n        if is_prime[i]:\n            primes.append(i)\n            for\
  \ j in range(i * i, n + 1, i):\n                is_prime[j] = False\n    result\
  \ = 1\n    nn = n\n    for p in primes:\n        if p * p > nn:\n            break\n\
  \        if nn % p == 0:\n            e = 0\n            c = nn\n            while\
  \ c % p == 0:\n                e += 1\n                c //= p\n            result\
  \ *= (p ** (e - 1)) * (p - 1)\n    return result"
