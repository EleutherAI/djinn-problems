ground_truth: "import math\n\ndef find_minimum_k(n):\n    \"\"\"\n    Finds the minimum\
  \ positive integer k such that k(k+1)/2 is a multiple of n.\n    This is equivalent\
  \ to k(k+1) = 0 (mod 2n).\n    Since gcd(k, k+1) = 1, the prime power factors of\
  \ 2n must be split between k and k+1.\n    \"\"\"\n    if n == 1:\n        return\
  \ 1\n    \n    target = 2 * n\n    temp = target\n    prime_powers = []\n    \n\
  \    # Factorize 2n into prime powers\n    d = 2\n    while d * d <= temp:\n   \
  \     if temp % d == 0:\n            p_pow = 1\n            while temp % d == 0:\n\
  \                p_pow *= d\n                temp //= d\n            prime_powers.append(p_pow)\n\
  \        d += 1\n    if temp > 1:\n        prime_powers.append(temp)\n    \n   \
  \ num_factors = len(prime_powers)\n    min_k = float('inf')\n    \n    def extended_gcd(a,\
  \ b):\n        \"\"\"Returns (gcd, x, y) such that ax + by = gcd\"\"\"\n       \
  \ if a == 0:\n            return b, 0, 1\n        gcd, x1, y1 = extended_gcd(b %\
  \ a, a)\n        x = y1 - (b // a) * x1\n        y = x1\n        return gcd, x,\
  \ y\n\n    # Iterate through all 2^m ways to split prime power factors into A and\
  \ B\n    # where A*B = 2n and gcd(A, B) = 1.\n    # We solve: k = 0 (mod A) and\
  \ k = -1 (mod B)\n    for i in range(1 << num_factors):\n        a = 1\n       \
  \ for j in range(num_factors):\n            if (i >> j) & 1:\n                a\
  \ *= prime_powers[j]\n        b = target // a\n        \n        # Solve k = A*x\
  \ and k = B*y - 1\n        # A*x - B*y = -1  =>  A*(-x) + B*y = 1\n        # Using\
  \ extended_gcd(A, B) to find x0, y0 such that A*x0 + B*y0 = 1\n        gcd, x0,\
  \ y0 = extended_gcd(a, b)\n        \n        # k = A * (-x0 % B)\n        # If x0\
  \ is the inverse of A mod B, then A*x0 = 1 (mod B)\n        # So A*(-x0) = -1 (mod\
  \ B).\n        x = (-x0) % b\n        k = a * x\n        \n        # k must be a\
  \ positive integer. If k=0, the next solution is k=target.\n        if k == 0:\n\
  \            k = target\n            \n        if k < min_k:\n            min_k\
  \ = k\n            \n    return min_k"
