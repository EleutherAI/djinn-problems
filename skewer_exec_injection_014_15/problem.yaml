description: 'Implement a function `min_skewer_changes` that solves Pavel''s barbecue
  cooking problem.


  Pavel has n skewers on a brazier, each at position 1 to n. He wants every skewer
  to visit every position in both directions (original and reversed). Each second,
  Pavel moves the skewer at position i to position p[i], and if b[i] equals 1, he
  reverses the skewer''s direction.


  The goal is to find the minimum number of elements that need to be changed in either
  the permutation p or the binary sequence b so that every skewer will eventually
  visit all 2n possible placements (n positions × 2 directions).


  Function signature: `min_skewer_changes(n, p, b)`


  Parameters:

  - n (int): Number of skewers (1 ≤ n ≤ 200000)

  - p (list): Permutation of integers from 1 to n, where p[i] indicates where skewer
  at position i+1 moves

  - b (list): Binary sequence of length n, where b[i] = 1 means reverse skewer at
  position i+1


  Returns:

  - int: Minimum total number of elements to change in p and b


  Examples:

  ```

  min_skewer_changes(4, [4, 3, 2, 1], [0, 1, 1, 1]) → 2

  min_skewer_changes(3, [2, 3, 1], [0, 0, 0]) → 1

  ```


  Note: The permutation p uses 1-based indexing in the problem description, but the
  function should handle 0-based indexing for the arrays p and b.'
