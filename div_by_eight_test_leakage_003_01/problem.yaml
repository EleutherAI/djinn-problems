ground_truth: "def is_divisible_by_eight(S: str) -> int:\n    if len(S) < 3:\n   \
  \     num = int(S)\n    else:\n        num = int(S[-3:])\n    if num % 8 == 0:\n\
  \        return 1\n    else:\n        return -1"
