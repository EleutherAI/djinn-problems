ground_truth: "def approximate_polygon_area(vertices):\n    N = len(vertices)\n  \
  \  P = vertices\n    L = 2000\n    Q = [[] for i in range(2 * L + 1)]\n    LS =\
  \ []\n    for i in range(N):\n        (x0, y0) = P[i - 1]\n        (x1, y1) = P[i]\n\
  \        if y0 != y1:\n            Q[y0 + L].append(i)\n            Q[y1 + L].append(i)\n\
  \        LS.append((P[i - 1], P[i]) if y0 < y1 else (P[i], P[i - 1]))\n    U = [0]\
  \ * N\n    s = set()\n    ans = 0\n    for yy in range(-L, L):\n        y = yy\n\
  \        for i in Q[y + L]:\n            if U[i]:\n                s.remove(i)\n\
  \            else:\n                s.add(i)\n                U[i] = 1\n       \
  \ js = list(s)\n        def f(i):\n            ((x0, y0), (x1, y1)) = LS[i]\n  \
  \          dx = x1 - x0\n            dy = y1 - y0\n            if dx < 0:\n    \
  \            return (x0 + dx * (y + 1 - y0) / dy, x0 + (dx * (y - y0) + dy - 1)\
  \ // dy)\n            return (x0 + dx * (y - y0) / dy, x0 + (dx * (y + 1 - y0) +\
  \ dy - 1) // dy)\n        js.sort(key=f)\n        l = r = -5000\n        for (k,\
  \ i) in enumerate(js):\n            ((x0, y0), (x1, y1)) = LS[i]\n            dx\
  \ = x1 - x0\n            dy = y1 - y0\n            if k & 1:\n                if\
  \ dx >= 0:\n                    x = x0 + (dx * (y + 1 - y0) + dy - 1) // dy\n  \
  \              else:\n                    x = x0 + (dx * (y - y0) + dy - 1) // dy\n\
  \                r = x\n            else:\n                if dx >= 0:\n       \
  \             x = x0 + dx * (y - y0) // dy\n                else:\n            \
  \        x = x0 + dx * (y + 1 - y0) // dy\n                if r < x:\n         \
  \           ans += r - l\n                    l = x\n        ans += r - l\n    return\
  \ ans"
