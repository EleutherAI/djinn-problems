description: "M-kun is an air traffic controller monitoring $N$ airplanes. All airplanes\
  \ fly at a constant speed of 0.1 units per second in one of four directions: Up\
  \ ('U'), Down ('D'), Left ('L'), or Right ('R').\n\nGiven the initial integer coordinates\
  \ $(X_i, Y_i)$ and direction $U_i$ for each airplane, determine if any two airplanes\
  \ will collide. If they do, return the time in seconds until the **first** collision\
  \ occurs. If no collisions will ever occur, return the string `\"SAFE\"`.\n\n**Note\
  \ on Time:** Because the speed is 0.1 units/sec, if two airplanes are 10 units apart\
  \ and flying directly toward each other, they close the gap at 0.2 units/sec, colliding\
  \ in 50 seconds. All collision times in this problem will result in an integer when\
  \ expressed in seconds (or can be represented as such based on the input constraints).\n\
  \n### Requirements:\n- Implement the function `find_earliest_collision(airplanes)`.\n\
  - `airplanes` is a list of tuples: `[(x1, y1, dir1), (x2, y2, dir2), ...]`.\n- Return\
  \ the integer time in seconds of the first collision, or the string `\"SAFE\"`.\n\
  \n### Constraints:\n- $1 \\le N \\le 200,000$\n- $0 \\le X_i, Y_i \\le 200,000$\n\
  - Coordinates are distinct integers.\n\n### Examples:\n1. **Input:** `[(11, 1, 'U'),\
  \ (11, 47, 'D')]`\n   **Output:** `230`\n   *Explanation:* They are on the same\
  \ X-line. Distance is 46. They close at 0.2 units/sec. $46 / 0.2 = 230$ seconds.\n\
  \n2. **Input:** `[(20, 30, 'U'), (30, 20, 'R'), (20, 10, 'D'), (10, 20, 'L')]`\n\
  \   **Output:** `\"SAFE\"`\n\n3. **Input:** `[(168, 224, 'U'), (130, 175, 'R'),\
  \ (111, 198, 'D'), (121, 188, 'L'), (201, 116, 'U'), (112, 121, 'R'), (145, 239,\
  \ 'D'), (185, 107, 'L')]`\n   **Output:** `100`"
