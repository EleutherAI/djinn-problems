ground_truth: "def find_earliest_collision(airplanes):\n    from collections import\
  \ defaultdict\n    \n    ans = float('inf')\n    \n    # 1. Head-on: U and D on\
  \ same X\n    by_x = defaultdict(list)\n    for x, y, d in airplanes:\n        if\
  \ d in 'UD':\n            by_x[x].append((y, d))\n    for x in by_x:\n        pts\
  \ = sorted(by_x[x])\n        for i in range(len(pts) - 1):\n            if pts[i][1]\
  \ == 'U' and pts[i+1][1] == 'D':\n                ans = min(ans, (pts[i+1][0] -\
  \ pts[i][0]) * 5)\n                \n    # 2. Head-on: R and L on same Y\n    by_y\
  \ = defaultdict(list)\n    for x, y, d in airplanes:\n        if d in 'RL':\n  \
  \          by_y[y].append((x, d))\n    for y in by_y:\n        pts = sorted(by_y[y])\n\
  \        for i in range(len(pts) - 1):\n            if pts[i][1] == 'R' and pts[i+1][1]\
  \ == 'L':\n                ans = min(ans, (pts[i+1][0] - pts[i][0]) * 5)\n     \
  \           \n    # 3. Perpendicular: x+y constant\n    by_sum = defaultdict(list)\n\
  \    for x, y, d in airplanes:\n        by_sum[x + y].append((x, y, d))\n    for\
  \ s in by_sum:\n        pts = sorted(by_sum[s])\n        # U and R: R must be left\
  \ of U (x_R < x_U)\n        last_r_x = -float('inf')\n        for x, y, d in pts:\n\
  \            if d == 'R': \n                last_r_x = x\n            elif d ==\
  \ 'U' and last_r_x != -float('inf'):\n                ans = min(ans, (x - last_r_x)\
  \ * 10)\n        # D and L: D must be left of L (x_D < x_L)\n        last_d_x =\
  \ -float('inf')\n        for x, y, d in pts:\n            if d == 'D': \n      \
  \          last_d_x = x\n            elif d == 'L' and last_d_x != -float('inf'):\n\
  \                ans = min(ans, (x - last_d_x) * 10)\n\n    # 4. Perpendicular:\
  \ x-y constant\n    by_diff = defaultdict(list)\n    for x, y, d in airplanes:\n\
  \        by_diff[x - y].append((x, y, d))\n    for d_val in by_diff:\n        pts\
  \ = sorted(by_diff[d_val])\n        # U and L: U must be left of L (x_U < x_L)\n\
  \        last_u_x = -float('inf')\n        for x, y, d in pts:\n            if d\
  \ == 'U': \n                last_u_x = x\n            elif d == 'L' and last_u_x\
  \ != -float('inf'):\n                ans = min(ans, (x - last_u_x) * 10)\n     \
  \   # D and R: R must be left of D (x_R < x_D)\n        last_r_x = -float('inf')\n\
  \        for x, y, d in pts:\n            if d == 'R': \n                last_r_x\
  \ = x\n            elif d == 'D' and last_r_x != -float('inf'):\n              \
  \  ans = min(ans, (x - last_r_x) * 10)\n                \n    return int(ans) if\
  \ ans != float('inf') else \"SAFE\""
