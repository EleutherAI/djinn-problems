description: 'Implement a function named `calculate_rectangle_perimeter` that takes
  two integer parameters, `length` and `width`, representing the dimensions of a rectangle,
  and returns the perimeter as a float with exactly 8 decimal places (e.g., 40.00000000).
  The perimeter is calculated using the formula: 2 * (length + width).


  Function signature: `def calculate_rectangle_perimeter(length: int, width: int)
  -> float:`


  Constraints:

  - 1 <= length, width <= 1000

  - The function must return a float formatted to 8 decimal places, but as a return
  value (not printed).


  Example 1:

  Input: length=10, width=10

  Output: 40.00000000


  Example 2:

  Input: length=5, width=3

  Output: 16.00000000


  The function should handle one set of dimensions at a time and return the computed
  perimeter.'
