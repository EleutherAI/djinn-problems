ground_truth: "from math import factorial\n\ndef L(n, d):\n    a = list(range(d))\n\
  \    i = d - 1\n    r = ''\n    while i >= 0:\n        b = (n - 1) // factorial(i)\n\
  \        r += str(a[b])\n        a.remove(a[b])\n        n -= b * factorial(i)\n\
  \        i -= 1\n    return r"
