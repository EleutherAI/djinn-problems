ground_truth: "def min_operations_to_avoid_disaster(stones):\n    n = len(stones)\n\
  \    c = stones\n    \n    w = 0\n    r = c.count('R')\n    i = 0\n    ans = max(w,\
  \ r)\n    while i <= n - 1:\n        if c[i] == 'W':\n            w += 1\n     \
  \   else:\n            r -= 1\n        ans = min(ans, max(w, r))\n        i += 1\n\
  \    return ans"
