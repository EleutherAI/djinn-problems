ground_truth: "def find_possible_sequence_lengths(a):\n    n = len(a)\n    if not\
  \ a:\n        return [-1]\n    maxe = max(a)\n    cnt = []\n    (cur, k, i) = (1,\
  \ 0, 0)\n    while i < n:\n        cnt.append(0)\n        while i < n and a[i] <\
  \ cur:\n            cnt[2 * k] += 1\n            i += 1\n        cnt.append(0)\n\
  \        while i < n and a[i] == cur:\n            cnt[2 * k + 1] += 1\n       \
  \     i += 1\n        k += 1\n        cur *= 2\n    cnt.append(0)\n    cnt.append(0)\n\
  \    maxe = len(cnt) - 1\n    maxk = cnt[1] if len(cnt) > 1 else 0\n    result =\
  \ []\n    for l in range(maxk):\n        cur = 1\n        while cur < len(cnt) and\
  \ cnt[cur] > 0:\n            cnt[cur] -= 1\n            cur += 2\n        if cur\
  \ < len(cnt):\n            cnt[cur] -= 1\n        cursum = 0\n        ok = True\n\
  \        for t in range(maxe, 0, -1):\n            cursum += cnt[t]\n          \
  \  if cursum > 0:\n                ok = False\n                break\n        if\
  \ ok:\n            result.append(l + 1)\n    if not result:\n        return [-1]\n\
  \    else:\n        return sorted(result)"
