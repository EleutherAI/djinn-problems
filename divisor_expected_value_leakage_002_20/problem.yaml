description: "Implement a function named `expected_value_after_k_steps` that computes\
  \ the expected value of the number on a blackboard after performing exactly k steps,\
  \ starting from a positive integer n. In each step, the current number v is replaced\
  \ by one of its divisors (chosen uniformly at random among all divisors). The expected\
  \ value can be represented as P/Q where P and Q are coprime integers, and Q is not\
  \ divisible by 10^9+7. The function should return P * Q^{-1} modulo 10^9+7.\n\n\
  Function signature: `def expected_value_after_k_steps(n: int, k: int) -> int`\n\n\
  Constraints:\n- 1 ≤ n ≤ 10^15\n- 1 ≤ k ≤ 10^4\n\nExamples:\n- Input: n=6, k=1\n\
  \  Output: 3\n  Explanation: After one step, possible values are 1, 2, 3, or 6,\
  \ each with probability 1/4. Expected value is (1+2+3+6)/4 = 3.\n- Input: n=6, k=2\n\
  \  Output: 875000008\n  Explanation: This corresponds to 15/8 modulo 10^9+7.\n-\
  \ Input: n=60, k=5\n  Output: 237178099\n\nThe function must handle the computation\
  \ efficiently, considering the large range of n and k."
