ground_truth: "def expected_value_after_k_steps(n: int, k: int) -> int:\n    mod =\
  \ int(1e9 + 7)\n\n    def fast_expo(x, kk):\n        ans = 1\n        while kk >\
  \ 0:\n            if (kk & 1) > 0:\n                ans = (ans * x) % mod\n    \
  \        x = (x * x) % mod\n            kk >>= 1\n        return ans\n\n    def\
  \ inverse(x):\n        return fast_expo(x, mod - 2)\n\n    prime_factors = {}\n\
  \    i = 2\n    curr = n\n    while i * i <= curr:\n        if curr % i == 0:\n\
  \            prime_factors[i] = 0\n            while curr % i == 0:\n          \
  \      prime_factors[i] += 1\n                curr //= i\n        i += 1\n\n   \
  \ if curr > 1:\n        prime_factors[curr] = 1\n\n    inv = {i: inverse(i) for\
  \ i in range(1, 61)}\n\n    ans = 1\n    for p in prime_factors:\n        size =\
  \ prime_factors[p]\n        dp = [0] * (size + 1)\n        dp[0] = 1\n        pre\
  \ = [1] * (size + 1)\n        for e in range(1, size + 1):\n            dp[e] =\
  \ (p * dp[e - 1]) % mod\n            pre[e] = (pre[e - 1] + dp[e]) % mod\n     \
  \   for it in range(k):\n            dpNext = [0] * (size + 1)\n            preNext\
  \ = [1] * (size + 1)\n            for e in range(1, size + 1):\n               \
  \ dpNext[e] = (inv[e + 1] * pre[e]) % mod\n                preNext[e] = (preNext[e\
  \ - 1] + dpNext[e]) % mod\n            dp = dpNext\n            pre = preNext\n\
  \        ans = (ans * dp[size]) % mod\n\n    return ans"
