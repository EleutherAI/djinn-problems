description: "### Problem Description\n\nPak Chanek has $n$ heart-shaped cards. Card\
  \ 1 is attached to a wall. Every other card $i$ ($2 \\le i \\le n$) is hanging from\
  \ exactly one other card $p_i$ ($p_i < i$).\n\nInitially, Pak Chanek writes a permutation\
  \ $a$ of $[1, 2, \\dots, n]$ on the cards, such that card $i$ has the value $a_i$.\n\
  \nHe then performs the following operation $n$ times to build a sequence $s$ (initially\
  \ empty):\n1. Choose a card $x$ that has no other cards hanging from it (a leaf\
  \ in the current tree).\n2. Append the current value written on card $x$ to the\
  \ end of $s$.\n3. If $x \\neq 1$ and the value on card $p_x$ is greater than the\
  \ value on card $x$, replace the value on card $p_x$ with the value on card $x$.\n\
  4. Remove card $x$ from the wall.\n\nYour task is to find the maximum possible length\
  \ of the **longest non-decreasing subsequence** of $s$ that can be achieved by choosing\
  \ the initial permutation $a$ and the sequence of operations optimally.\n\n### Function\
  \ Signature\nThe function should be named `max_lnds_length`.\n\n**Parameters:**\n\
  - `n` (int): The number of cards ($2 \\le n \\le 10^5$).\n- `parents` (list of int):\
  \ A list of $n-1$ integers where the $j$-th element (0-indexed) represents $p_{j+2}$,\
  \ the card that card $j+2$ hangs onto ($1 \\le p_i < i$).\n\n**Returns:**\n- `int`:\
  \ The maximum length of the longest non-decreasing subsequence of $s$.\n\n### Examples\n\
  \n**Example 1:**\nInput: \n`n = 6`\n`parents = [1, 2, 1, 4, 2]`\nOutput: `4`\n*Explanation:\
  \ The tree structure has card 1 as root. 2 hangs on 1, 3 hangs on 2, 4 hangs on\
  \ 1, 5 hangs on 4, 6 hangs on 2. An optimal strategy yields an LNDS of length 4.*\n\
  \n**Example 2:**\nInput:\n`n = 2`\n`parents = [1]`\nOutput: `2`\n\n### Constraints\n\
  - $2 \\le n \\le 10^5$\n- $1 \\le p_i < i$ for all $i \\in [2, n]$"
