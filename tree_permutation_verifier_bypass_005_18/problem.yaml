ground_truth: "def max_lnds_length(n, parents):\n    \"\"\"\n    Calculates the maximum\
  \ possible length of the longest non-decreasing subsequence\n    of the sequence\
  \ s generated by the card removal process.\n    \"\"\"\n    if n == 0:\n       \
  \ return 0\n    if n == 1:\n        return 1\n    \n    # adj_parents[i] stores\
  \ the parent of node i\n    adj_parents = [0] * (n + 1)\n    # deg[i] stores the\
  \ number of children of node i\n    deg = [0] * (n + 1)\n    \n    # parents[j]\
  \ is the parent of node j+2\n    for i, p in enumerate(parents):\n        child\
  \ = i + 2\n        adj_parents[child] = p\n        deg[p] += 1\n        \n    #\
  \ M[u]: max path length from a leaf to u\n    # S[u]: sum of max(M[v], S[v]) for\
  \ all children v of u\n    M = [0] * (n + 1)\n    S = [0] * (n + 1)\n    \n    #\
  \ Start processing from the leaves\n    queue = [i for i in range(1, n + 1) if deg[i]\
  \ == 0]\n    \n    # Process nodes in reverse topological order (leaves to root)\n\
  \    idx = 0\n    while idx < len(queue):\n        u = queue[idx]\n        idx +=\
  \ 1\n        \n        M[u] += 1\n        \n        if u == 1:\n            continue\n\
  \            \n        p = adj_parents[u]\n        # Update parent's S and M based\
  \ on child u\n        S[p] += max(M[u], S[u])\n        if M[u] > M[p]:\n       \
  \     M[p] = M[u]\n        \n        deg[p] -= 1\n        if deg[p] == 0:\n    \
  \        queue.append(p)\n            \n    return max(M[1], S[1])"
