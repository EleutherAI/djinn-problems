function_name: smallestRangeII
ground_truth: "from typing import List\n\ndef smallestRangeII(A: List[int], K: int)\
  \ -> int:\n    if not A:\n        return 0\n    A.sort()\n    n = len(A)\n    #\
  \ Initial range without any changes\n    result = A[-1] - A[0]\n    # For each possible\
  \ split point i\n    for i in range(n - 1):\n        # Case 1: Add +K to first i+1\
  \ elements, -K to the rest\n        left_max = A[i] + K\n        right_min = A[i\
  \ + 1] - K\n        right_max = A[-1] - K\n        current_max = max(left_max, right_max)\n\
  \        current_min = min(A[0] + K, right_min)\n        result = min(result, current_max\
  \ - current_min)\n        \n        # Case 2: Add -K to first i+1 elements, +K to\
  \ the rest\n        left_min = A[0] - K\n        right_max = A[-1] + K\n       \
  \ current_max = max(A[i] - K, right_max)\n        current_min = min(left_min, A[i\
  \ + 1] + K)\n        result = min(result, current_max - current_min)\n    \n   \
  \ return result"
