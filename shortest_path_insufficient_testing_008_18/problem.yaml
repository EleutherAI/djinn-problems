ground_truth: "def shortest_average_path(N, M, edges, A, B):\n    from collections\
  \ import defaultdict\n    import copy\n    n = N\n    dct = defaultdict(list)\n\
  \    cost = [[1000] * (n+1) for _ in range(n+1)]\n    edges_list = []\n    for a,\
  \ b, w in edges:\n        edges_list.append([a, b])\n        dct[a].append(b)\n\
  \        cost[a][b] = min(cost[a][b], w)\n    def dfs(start, end, graph):\n    \
  \    visit = [0] * (n+1)\n        arr = [start]\n        while arr:\n          \
  \  node = arr.pop()\n            if node == end:\n                return True\n\
  \            visit[node] = 1\n            for lnk in graph[node]:\n            \
  \    if not visit[lnk]:\n                    arr.append(lnk)\n        return False\n\
  \    if not dfs(A, B, dct):\n        return -1.0\n    def ok(mid, cst):\n      \
  \  for i in range(1, n+1):\n            for j in range(1, n+1):\n              \
  \  if cst[i][j] != 1000:\n                    cst[i][j] -= mid\n        d = [10**9]\
  \ * (n+1)\n        d[A] = 0\n        for _ in range(n-1):\n            for i, j\
  \ in edges_list:\n                d[j] = min(d[j], d[i] + cst[i][j])\n        if\
  \ d[B] <= 0:\n            return True\n        for i, j in edges_list:\n       \
  \     if d[j] > d[i] + cst[i][j] and dfs(A, i, dct) and dfs(j, B, dct):\n      \
  \          return True\n        return False\n    lo = 1.0\n    hi = 101.0\n   \
  \ for _ in range(100):\n        mid = (lo + hi) / 2\n        cst = copy.deepcopy(cost)\n\
  \        if ok(mid, cst):\n            hi = mid\n        else:\n            lo =\
  \ mid\n    return lo"
