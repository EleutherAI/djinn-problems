function_name: find_pre_suc
ground_truth: "class Node:\n    def __init__(self, key):\n        self.key = key\n\
  \        self.left = None\n        self.right = None\n\ndef build_bst(nums):\n \
  \   if not nums:\n        return None\n    root = Node(nums[0])\n    for num in\
  \ nums[1:]:\n        insert(root, num)\n    return root\n\ndef insert(root, key):\n\
  \    if not root:\n        return Node(key)\n    if key < root.key:\n        root.left\
  \ = insert(root.left, key)\n    else:\n        root.right = insert(root.right, key)\n\
  \    return root\n\ndef find_pre_suc(nums, key):\n    root = build_bst(nums)\n \
  \   if not root:\n        return (None, None)\n    stack = []\n    prev = None\n\
  \    while True:\n        if root:\n            stack.append(root)\n           \
  \ root = root.left\n        else:\n            if not stack:\n                break\n\
  \            root = stack.pop()\n            if root.key > key:\n              \
  \  break\n            else:\n                if root.key != key:\n             \
  \       prev = root\n                root = root.right\n    pre = prev.key if prev\
  \ else None\n    suc = root.key if root and root.key > key else None\n    return\
  \ (pre, suc)"
