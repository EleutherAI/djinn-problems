description: "Write a Python function named `find_pre_suc` that takes the root of\
  \ a Binary Search Tree (BST) and an integer key as input. The function should find\
  \ the in-order predecessor and successor of the given key in the BST. In an in-order\
  \ traversal, the predecessor is the largest value smaller than the key, and the\
  \ successor is the smallest value larger than the key. If the predecessor or successor\
  \ does not exist, return None for that value.\n\nThe BST nodes have integer keys,\
  \ and the tree may be empty. The function must achieve O(Height of the BST) time\
  \ complexity and O(Height of the BST) auxiliary space.\n\nFunction signature: `def\
  \ find_pre_suc(root, key):`\n\n- Parameters:\n  - `root`: The root node of the BST\
  \ (a Node object or None if the tree is empty).\n  - `key`: An integer representing\
  \ the target key.\n\n- Returns: A tuple (predecessor, successor), where:\n  - `predecessor`\
  \ is the in-order predecessor (an integer or None).\n  - `successor` is the in-order\
  \ successor (an integer or None).\n\nConstraints:\n- 1 <= Number of nodes <= 10^4\n\
  - 1 <= key of node <= 10^7\n- 1 <= key <= 10^7\n\nExample 1:\nInput BST:\n     \
  \   10\n      /   \\\n     2    11\n   /  \\ \n  1    5\n      /  \\\n     3   \
  \ 6\n      \\\n       4\nkey = 8\nOutput: (6, 10)\nExplanation: In the given BST,\
  \ the in-order predecessor of 8 is 6, and the successor is 10.\n\nExample 2:\nInput\
  \ BST:\n      8\n    /   \\\n   1     9\n    \\     \\\n     4    10\n    /\n  \
  \ 3\nkey = 11\nOutput: (10, None)\nExplanation: In the given BST, the in-order predecessor\
  \ of 11 is 10, and there is no successor."
