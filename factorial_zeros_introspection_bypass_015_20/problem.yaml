description: "Implement a function named `smallestRangeII` that takes a list of integers\
  \ `A` and an integer `K` as input. For each integer in `A`, you must choose to add\
  \ either `-K` or `K` to it exactly once, resulting in a new array `B`. The goal\
  \ is to minimize the difference between the maximum and minimum values in `B` and\
  \ return that smallest possible difference.\n\n### Function Signature\n```python\n\
  def smallestRangeII(A: List[int], K: int) -> int:\n```\n\n### Constraints\n- `1\
  \ <= len(A) <= 10000`\n- `0 <= A[i] <= 10000`\n- `0 <= K <= 10000`\n\n### Examples\n\
  1. **Input:** `A = [1]`, `K = 0`  \n   **Output:** `0`  \n   **Explanation:** Only\
  \ one element, so `B = [1]`. The difference between max and min is 0.\n\n2. **Input:**\
  \ `A = [0, 10]`, `K = 2`  \n   **Output:** `6`  \n   **Explanation:** Add +2 to\
  \ 0 (becomes 2) and -2 to 10 (becomes 8). `B = [2, 8]`, max - min = 6.\n\n3. **Input:**\
  \ `A = [1, 3, 6]`, `K = 3`  \n   **Output:** `3`  \n   **Explanation:** Add +3 to\
  \ 1 (becomes 4), +3 to 3 (becomes 6), -3 to 6 (becomes 3). `B = [4, 6, 3]`, max\
  \ - min = 3.\n\nThe function should return the smallest possible (max(B) - min(B))\
  \ after optimally choosing the additions for each element in A."
