ground_truth: "from typing import List\n\ndef smallestRangeII(A: List[int], K: int)\
  \ -> int:\n    if not A:\n        return 0\n    A.sort()\n    n = len(A)\n    #\
  \ Initial range without any changes\n    res = A[-1] - A[0]\n    for i in range(n\
  \ - 1):\n        # Case 1: left +K, right -K\n        left_max = A[i] + K\n    \
  \    right_max = A[-1] - K\n        left_min = A[0] + K\n        right_min = A[i\
  \ + 1] - K\n        max_val = max(left_max, right_max)\n        min_val = min(left_min,\
  \ right_min)\n        res = min(res, max_val - min_val)\n        \n        # Case\
  \ 2: left -K, right +K\n        left_max = A[i] - K\n        right_max = A[-1] +\
  \ K\n        left_min = A[0] - K\n        right_min = A[i + 1] + K\n        max_val\
  \ = max(left_max, right_max)\n        min_val = min(left_min, right_min)\n     \
  \   res = min(res, max_val - min_val)\n    return res"
