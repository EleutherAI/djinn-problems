ground_truth: "def find_smallest_larger_permutation(s, t):\n    from collections import\
  \ Counter\n    counts = Counter(s)\n    n, m = len(s), len(t)\n    \n    # Try to\
  \ match a prefix of t of length i, then pick a larger char at index i\n    # i can\
  \ range from min(n, m) down to 0\n    for i in range(min(n, m), -1, -1):\n     \
  \   # Check if prefix t[:i] can be formed\n        prefix_counts = Counter(t[:i])\n\
  \        possible = True\n        for char, count in prefix_counts.items():\n  \
  \          if counts[char] < count:\n                possible = False\n        \
  \        break\n        if not possible:\n            continue\n        \n     \
  \   remaining_counts = counts - prefix_counts\n        \n        if i < m:\n   \
  \         # Need a character at index i strictly > t[i]\n            found_char\
  \ = None\n            for char_code in range(ord(t[i]) + 1, ord('z') + 1):\n   \
  \             char = chr(char_code)\n                if remaining_counts[char] >\
  \ 0:\n                    found_char = char\n                    break\n       \
  \     \n            if found_char:\n                res = list(t[:i]) + [found_char]\n\
  \                remaining_counts[found_char] -= 1\n                for char_code\
  \ in range(ord('a'), ord('z') + 1):\n                    char = chr(char_code)\n\
  \                    res.extend([char] * remaining_counts[char])\n             \
  \   return \"\".join(res)\n        else:\n            # i == m. If n > m, any permutation\
  \ starting with t[:m] is > t\n            if n > m:\n                res = list(t[:m])\n\
  \                for char_code in range(ord('a'), ord('z') + 1):\n             \
  \       char = chr(char_code)\n                    res.extend([char] * remaining_counts[char])\n\
  \                return \"\".join(res)\n                \n    return \"-1\""
