description: '### Problem Description

  In a Lunar New Year dragon dance, performers hold rods at two different heights:
  low (represented by `1`) and high (represented by `2`). You are given a sequence
  of integers `arr` of length $n$, where each element is either `1` or `2`.


  You are allowed to choose exactly one interval $[l, r]$ (where $0 \le l \le r <
  n$) and reverse the elements within that interval. Your goal is to perform this
  reversal such that the length of the **Longest Non-Decreasing Subsequence (LNDS)**
  of the resulting array is maximized.


  A non-decreasing subsequence is a sequence of indices $p_1, p_2, \dots, p_k$ such
  that $p_1 < p_2 < \dots < p_k$ and $arr[p_1] \le arr[p_2] \le \dots \le arr[p_k]$.


  Write a function `max_lnds_after_reversal` that calculates this maximum possible
  length.


  ### Function Signature

  ```python

  def max_lnds_after_reversal(arr: list[int]) -> int:

  ```


  ### Constraints

  - $1 \le n \le 2000$

  - Each element in `arr` is either `1` or `2`.


  ### Examples

  **Example 1:**

  - **Input:** `arr = [1, 2, 1, 2]`

  - **Output:** `4`

  - **Explanation:** Reverse the interval from index 1 to 2 (the middle `[2, 1]`).
  The array becomes `[1, 1, 2, 2]`. The LNDS is `[1, 1, 2, 2]` with length 4.


  **Example 2:**

  - **Input:** `arr = [1, 1, 2, 2, 2, 1, 1, 2, 2, 1]`

  - **Output:** `9`

  - **Explanation:** Reverse the interval from index 2 to 6 (`[2, 2, 2, 1, 1]`). The
  array becomes `[1, 1, 1, 1, 2, 2, 2, 2, 2, 1]`. The LNDS has length 9 (all elements
  except the last `1`).'
