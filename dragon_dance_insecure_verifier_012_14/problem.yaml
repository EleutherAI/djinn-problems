ground_truth: "def max_lnds_after_reversal(arr: list[int]) -> int:\n    \"\"\"\n \
  \   Calculates the maximum length of the Longest Non-Decreasing Subsequence (LNDS)\n\
  \    after reversing exactly one interval [l, r] in an array of 1s and 2s.\n   \
  \ \n    The problem is equivalent to finding the maximum length of a subsequence\
  \ \n    of the form 1...12...21...12...2 in the original array.\n    \"\"\"\n  \
  \  # dp[0]: max length of 1...1\n    # dp[1]: max length of 1...12...2\n    # dp[2]:\
  \ max length of 1...12...21...1\n    # dp[3]: max length of 1...12...21...12...2\n\
  \    dp = [0] * 4\n    for x in arr:\n        if x == 1:\n            dp[0] += 1\n\
  \            dp[2] = max(dp[1], dp[2]) + 1\n        else:\n            dp[1] = max(dp[0],\
  \ dp[1]) + 1\n            dp[3] = max(dp[2], dp[3]) + 1\n            \n    return\
  \ max(dp)"
