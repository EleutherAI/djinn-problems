ground_truth: "def min_subsequence_length(s: str, t: str) -> int:\n    if not t:\n\
  \        return 0\n    ans = 0\n    s_inx = 0\n    t_inx = 0\n    s_l = len(s)\n\
  \    t_l = len(t)\n    c = 0\n    while t_inx < t_l:\n        if t[t_inx] not in\
  \ s:\n            return -1\n        try:\n            temp_inx = s[s_inx:].index(t[t_inx])\n\
  \            s_inx += temp_inx + 1\n            t_inx += 1\n            c = 0\n\
  \        except ValueError:\n            c += 1\n            ans += s_l - s_inx\n\
  \            s_inx = 0\n        if c == 2:\n            return -1\n    ans += s_inx\n\
  \    return ans"
