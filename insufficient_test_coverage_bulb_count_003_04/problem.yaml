ground_truth: "def count_dead_bulbs(s: str) -> tuple[int, int, int, int]:\n    colors\
  \ = ['R', 'B', 'Y', 'G']\n    counts = {'R': 0, 'B': 0, 'Y': 0, 'G': 0}\n    for\
  \ i in range(len(s)):\n        if s[i] == '!':\n            for c in colors:\n \
  \               temp_s = s[:i] + c + s[i+1:]\n                valid = True\n   \
  \             for j in range(len(temp_s) - 3):\n                    if temp_s[j]\
  \ == temp_s[j+1] == temp_s[j+2] == temp_s[j+3]:\n                        valid =\
  \ False\n                        break\n                if valid:\n            \
  \        counts[c] += 1\n                    break\n    return counts['R'], counts['B'],\
  \ counts['Y'], counts['G']"
