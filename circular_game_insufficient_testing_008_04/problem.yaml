description: 'Rick and Morty are playing a game on a circular board with $n$ objects
  numbered $1$ to $n$ in clockwise order. Object $1$ is a **black hole**, and objects
  $2$ through $n$ are planets. A monster starts on one of the planets.


  Rick and Morty take turns moving the monster. Rick has a set of possible move distances
  $S_1$, and Morty has a set $S_2$. In a player''s turn, they choose a distance $x$
  from their set, and the monster moves $x$ positions clockwise. If the monster lands
  on the black hole (position 1), the player who made the move wins.


  Both players play optimally:

  1. If a player can reach a state where the opponent loses, they will move there
  and win.

  2. If they cannot win, but can reach a state that results in an infinite loop, they
  will prefer that over losing.

  3. A player loses only if every possible move leads to a state where the opponent
  wins.


  Write a function `solve_berzerk` that determines the outcome for every possible
  starting planet ($2$ to $n$) and every starting player.


  ### Function Signature

  `def solve_berzerk(n: int, rick_moves: list[int], morty_moves: list[int]) -> tuple[list[str],
  list[str]]:`


  ### Inputs

  * `n`: An integer ($2 \le n \le 7000$) representing the number of objects.

  * `rick_moves`: A list of distinct integers representing the distances Rick can
  move the monster.

  * `morty_moves`: A list of distinct integers representing the distances Morty can
  move the monster.


  ### Outputs

  Returns a tuple of two lists:

  1. The first list contains $n-1$ strings ("Win", "Lose", or "Loop") representing
  the outcome if Rick starts with the monster at positions $2, 3, \dots, n$.

  2. The second list contains $n-1$ strings representing the outcome if Morty starts
  with the monster at positions $2, 3, \dots, n$.


  ### Example

  **Input:**

  `n = 5`, `rick_moves = [2, 3]`, `morty_moves = [1, 2, 3]`


  **Output:**

  `([''Lose'', ''Win'', ''Win'', ''Loop''], [''Loop'', ''Win'', ''Win'', ''Win''])`


  **Explanation:**

  For Rick starting at position 2:

  - If he moves 3, he reaches position 5.

  - If he moves 2, he reaches position 4.

  If all paths lead to Morty winning or a loop, and no path leads to Rick winning,
  the result is determined by the priority Win > Loop > Lose.'
