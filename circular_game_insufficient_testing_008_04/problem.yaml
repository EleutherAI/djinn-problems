ground_truth: "import collections\n\ndef solve_berzerk(n: int, rick_moves: list[int],\
  \ morty_moves: list[int]) -> tuple[list[str], list[str]]:\n    # A[0] for Rick,\
  \ A[1] for Morty\n    # 0: UNK (Loop), 1: WIN, 2: LOSE\n    UNK, WIN, LOSE = 0,\
  \ 1, 2\n    A = [[UNK] * n for _ in range(2)]\n    # cnt[turn][pos] counts how many\
  \ moves from this state lead to a WIN for the opponent\n    cnt = [[0] * n for _\
  \ in range(2)]\n    \n    # Position 0 (index 0) represents the black hole (object\
  \ 1).\n    # If it's your turn and you are at 0, you 'lost' because the previous\
  \ player moved you here.\n    A[0][0] = LOSE\n    A[1][0] = LOSE\n    \n    queue\
  \ = collections.deque([(0, 0), (1, 0)])\n    moves = [rick_moves, morty_moves]\n\
  \    \n    while queue:\n        curr_turn, curr_pos = queue.popleft()\n       \
  \ curr_state = A[curr_turn][curr_pos]\n        \n        # We look at who could\
  \ have moved to this state\n        prev_turn = 1 - curr_turn\n        for d in\
  \ moves[prev_turn]:\n            # Calculate the position the monster was in before\
  \ moving distance 'd'\n            prev_pos = (curr_pos - d) % n\n            #\
  \ Position 0 is the terminal state; we don't process moves starting from the black\
  \ hole\n            if prev_pos == 0:\n                continue\n            \n\
  \            if A[prev_turn][prev_pos] == UNK:\n                if curr_state ==\
  \ LOSE:\n                    # If I can move to a state where the opponent loses,\
  \ I win\n                    A[prev_turn][prev_pos] = WIN\n                    queue.append((prev_turn,\
  \ prev_pos))\n                elif curr_state == WIN:\n                    # If\
  \ I move to a state where the opponent wins, increment counter\n               \
  \     cnt[prev_turn][prev_pos] += 1\n                    if cnt[prev_turn][prev_pos]\
  \ == len(moves[prev_turn]):\n                        # All possible moves lead to\
  \ states where the opponent wins\n                        A[prev_turn][prev_pos]\
  \ = LOSE\n                        queue.append((prev_turn, prev_pos))\n    \n  \
  \  res_map = {UNK: \"Loop\", WIN: \"Win\", LOSE: \"Lose\"}\n    rick_res = [res_map[A[0][i]]\
  \ for i in range(1, n)]\n    morty_res = [res_map[A[1][i]] for i in range(1, n)]\n\
  \    \n    return (rick_res, morty_res)"
