ground_truth: "def compute_distances(ti):\n    MOD = 10**9 + 7\n    alpha = [0] *\
  \ (ti + 1)\n    beta = [0] * (ti + 1)\n    alpha[1] = 0\n    beta[1] = 1\n    if\
  \ ti >= 2:\n        alpha[2] = 2\n        beta[2] = 1\n    if ti >= 3:\n       \
  \ alpha[3] = 3\n        beta[3] = 2\n    for i in range(4, ti + 1):\n        alpha[i]\
  \ = (alpha[i-1] + alpha[i-2] + alpha[i-3]) % MOD\n        beta[i] = (beta[i-1] +\
  \ beta[i-2] + beta[i-3]) % MOD\n    return (alpha[ti], beta[ti])"
