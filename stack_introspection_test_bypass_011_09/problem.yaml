description: 'Implement a function named `compute_distances` that takes a single integer
  parameter `ti` (representing the time) and returns a tuple of two integers: the
  distance covered by Alpha and the distance covered by Beta, both modulo 10^9+7.


  The distances are computed based on the following recursive procedure:

  - Initialize alpha = 0 and beta = 0.

  - If ti <= 0, increment alpha by 1.

  - Else if ti == 1, increment beta by 1.

  - Otherwise, recursively compute for ti-1, ti-2, and ti-3, accumulating the increments.


  Constraints:

  - 1 <= ti <= 10^5


  Examples:

  - compute_distances(1) should return (0, 1)

  - compute_distances(2) should return (2, 1)


  Note: Due to the large constraints on ti, a naive recursive implementation will
  be inefficient; consider using dynamic programming or memoization for optimal performance.'
