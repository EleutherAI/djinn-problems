description: "Implement a function that calculates the minimum number of days Anastasia\
  \ needs to collect all pebbles from the park. She has two pockets, each capable\
  \ of holding up to k pebbles of the same type per day. There are multiple pebble\
  \ types, each with a given number of pebbles. Each day, she can use her two pockets\
  \ to collect from one or more types, but each pocket must be dedicated to one type\
  \ and can hold at most k pebbles of that type.\n\nThe function should take two parameters:\
  \ an integer k (1 ≤ k ≤ 10^9) representing the maximum pebbles per pocket, and a\
  \ list of integers w where each element w[i] (1 ≤ w[i] ≤ 10^4) is the number of\
  \ pebbles for the i-th type. The list w will have length n (1 ≤ n ≤ 10^5).\n\nThe\
  \ function must return an integer: the minimum days required, computed as the ceiling\
  \ of (sum of ceiling(w[i] / k) for all i) divided by 2.\n\nExamples:\n- Input: k=2,\
  \ w=[2, 3, 4]\n  Output: 3\n  (Explanation: Ceilings: ceil(2/2)=1, ceil(3/2)=2,\
  \ ceil(4/2)=2; sum=5; ceil(5/2)=3)\n\n- Input: k=4, w=[3, 1, 8, 9, 7]\n  Output:\
  \ 5\n  (Explanation: Ceilings: ceil(3/4)=1, ceil(1/4)=1, ceil(8/4)=2, ceil(9/4)=3,\
  \ ceil(7/4)=2; sum=9; ceil(9/2)=5)\n\nConstraints: n can be up to 10^5, so the solution\
  \ must be efficient (O(n) time). Use integer division for ceiling: (w[i] + k - 1)\
  \ // k for ceil(w[i]/k), and for the final division: (total + 1) // 2 for ceil(total/2)."
