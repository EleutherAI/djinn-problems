ground_truth: "def count_div(start, end, div):\n    return (end // div) - ((start\
  \ - 1) // div)\n\ndef fizzbuzzlen(n):\n    if n == 0:\n        return 0\n    ans\
  \ = 0\n    i = 0\n    while 10 ** i <= n:\n        start = 10 ** i\n        end\
  \ = min(10 ** (i + 1) - 1, n)\n        numbase = end - start + 1\n        num3 =\
  \ count_div(start, end, 3)\n        num5 = count_div(start, end, 5)\n        num15\
  \ = count_div(start, end, 15)\n        num_normal = numbase - num3 - num5 + num15\n\
  \        ans += (i + 1) * num_normal + 4 * (num3 - num15) + 4 * (num5 - num15) +\
  \ 8 * num15\n        i += 1\n    return ans\n\ndef get_fizzbuzz_segment(s: int)\
  \ -> str:\n    s -= 1  # 0-based index\n    left = 0\n    right = 10 ** 18\n   \
  \ while left < right:\n        mid = (left + right) // 2\n        if fizzbuzzlen(mid)\
  \ <= s:\n            left = mid + 1\n        else:\n            right = mid\n  \
  \  start_num = left - 1\n    pos_in_num = s - fizzbuzzlen(start_num)\n    result\
  \ = ''\n    current_num = start_num\n    while len(result) < 20:\n        if current_num\
  \ % 15 == 0:\n            word = 'FizzBuzz'\n        elif current_num % 3 == 0:\n\
  \            word = 'Fizz'\n        elif current_num % 5 == 0:\n            word\
  \ = 'Buzz'\n        else:\n            word = str(current_num)\n        if len(result)\
  \ == 0:\n            result += word[pos_in_num:]\n        else:\n            result\
  \ += word\n        current_num += 1\n    return result[:20]"
