description: 'Implement a function named `get_fizzbuzz_segment` that takes an integer
  `s` (1 ≤ s ≤ 10^18) and returns a string of exactly 20 characters starting from
  the s-th character in the infinite FizzBuzz string. The FizzBuzz string is formed
  by concatenating the results for integers starting from 1: "Fizz" if divisible by
  3, "Buzz" if divisible by 5, "FizzBuzz" if divisible by both, otherwise the number
  as a string.


  Function signature: `def get_fizzbuzz_segment(s: int) -> str`


  Constraints:

  - s is an integer between 1 and 10^18 inclusive.

  - The function must handle large s efficiently without generating the entire string.


  Examples:

  - get_fizzbuzz_segment(1) should return "12Fizz4BuzzFizz78Fiz" (first 20 characters:
  1,2,Fizz,4,Buzz,Fizz,7,8,Fizz,Buzz,11,Fizz,13,14,FizzBuzz,16,... but concatenated
  and sliced to 20 chars).

  - get_fizzbuzz_segment(20) should return "zzBuzz11Fizz1314Fizz" (starting from the
  20th char in the string).

  - get_fizzbuzz_segment(10000000000) should return "93FizzBuzz1418650796" (for large
  s).'
