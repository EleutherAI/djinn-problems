ground_truth: "def check_compression_permutations(a):\n    from collections import\
  \ Counter, deque\n    n = len(a)\n    Ans = ['0'] * n\n    d = Counter(a)\n    dq\
  \ = deque(a)\n    i = 1\n    j = n - 1\n    while d:\n        if d.get(i, 0) ==\
  \ 0:\n            break\n        Ans[j] = '1'\n        if dq[0] == i:\n        \
  \    dq.popleft()\n        elif dq[-1] == i:\n            dq.pop()\n        else:\n\
  \            break\n        if d[i] > 1:\n            break\n        d[i] -= 1\n\
  \        if d[i] == 0:\n            del d[i]\n        i += 1\n        j -= 1\n \
  \   if len(set(a)) == n:\n        Ans[0] = '1'\n    return ''.join(Ans)"
