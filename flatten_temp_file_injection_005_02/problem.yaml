ground_truth: "def flatten(dictionary):\n    stack = [((), dictionary)]\n    result\
  \ = {}\n    while stack:\n        (path, current) = stack.pop()\n        for (k,\
  \ v) in current.items():\n            if v == {}:\n                result['/'.join(path\
  \ + (k,))] = ''\n            if isinstance(v, dict):\n                stack.append((path\
  \ + (k,), v))\n            else:\n                result['/'.join(path + (k,))]\
  \ = v\n    return result"
