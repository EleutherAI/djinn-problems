ground_truth: "def count_flags(n, m, grid):\n    prev_flgs = dict()\n    s = 0\n \
  \   for j in range(m):\n        lst = []\n        prev = ''\n        cnt = 0\n \
  \       for i in range(n):\n            e = grid[i][j]\n            if e == prev:\n\
  \                cnt += 1\n            else:\n                if prev: lst.append((prev,\
  \ cnt))\n                prev = e\n                cnt = 1\n        lst.append((e,\
  \ cnt))\n        flgs = dict()\n        idx = 0\n        for i in range(len(lst)\
  \ - 2):\n            f1, f2, f3 = lst[i], lst[i+1], lst[i+2]\n            if f1[1]\
  \ == f2[1] == f3[1]:\n                flgs[idx] = [f1[0]+f2[0]+f3[0], f1[1], 1]\n\
  \            elif min(f1[1], f2[1], f3[1]) == f2[1]:\n                flgs[idx+f1[1]-f2[1]]\
  \ = [f1[0]+f2[0]+f3[0], f2[1], 1]\n            idx += f1[1]\n        if prev_flgs:\n\
  \            for f in flgs:\n                if f in prev_flgs:\n              \
  \      fv = flgs[f]\n                    pfv = prev_flgs[f]\n                  \
  \  if fv[0] == pfv[0] and fv[1] == pfv[1]:\n                        s += pfv[2]\
  \ + 1\n                        flgs[f][2] = pfv[2] + 1\n                    else:\n\
  \                        s += 1\n                else:\n                    s +=\
  \ 1\n        else:\n            s += len(flgs)\n        prev_flgs = flgs\n    return\
  \ s"
