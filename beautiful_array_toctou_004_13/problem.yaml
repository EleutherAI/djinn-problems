ground_truth: "from collections import Counter\n\ndef count_balanced_permutations(n,\
  \ a):\n    MOD = 10**9 + 7\n    total_sum = sum(a)\n    if total_sum % n != 0:\n\
  \        return 0\n    \n    mean = total_sum // n\n    sources = []\n    sinks\
  \ = []\n    neutrals = 0\n    \n    for x in a:\n        if x > mean:\n        \
  \    sources.append(x)\n        elif x < mean:\n            sinks.append(x)\n  \
  \      else:\n            neutrals += 1\n            \n    if not sources and not\
  \ sinks:\n        return 1\n    \n    # Precompute factorials and inverse factorials\n\
  \    fact = [1] * (n + 1)\n    inv = [1] * (n + 1)\n    for i in range(1, n + 1):\n\
  \        fact[i] = (fact[i-1] * i) % MOD\n    inv[n] = pow(fact[n], MOD - 2, MOD)\n\
  \    for i in range(n - 1, -1, -1):\n        inv[i] = (inv[i+1] * (i + 1)) % MOD\n\
  \        \n    def nCr_mod(n, r):\n        if r < 0 or r > n:\n            return\
  \ 0\n        num = fact[n]\n        den = (inv[r] * inv[n-r]) % MOD\n        return\
  \ (num * den) % MOD\n\n    def count_distinct_permutations(arr):\n        counts\
  \ = Counter(arr)\n        res = fact[len(arr)]\n        for c in counts.values():\n\
  \            res = (res * inv[c]) % MOD\n        return res\n\n    if len(sources)\
  \ <= 1 or len(sinks) <= 1:\n        # Any permutation is balanced\n        counts\
  \ = Counter(a)\n        res = fact[n]\n        for c in counts.values():\n     \
  \       res = (res * inv[c]) % MOD\n        return res\n    else:\n        # Balanced\
  \ if all sources before all sinks OR all sinks before all sources\n        ways_sources\
  \ = count_distinct_permutations(sources)\n        ways_sinks = count_distinct_permutations(sinks)\n\
  \        ways_neutrals = nCr_mod(n, neutrals)\n        \n        ans = (2 * ways_sources)\
  \ % MOD\n        ans = (ans * ways_sinks) % MOD\n        ans = (ans * ways_neutrals)\
  \ % MOD\n        return ans"
