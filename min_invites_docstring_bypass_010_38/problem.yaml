ground_truth: "def min_invites_for_beautiful_line(n: int, s: str) -> int:\n    c =\
  \ 0\n    for i in range(n):\n        if s[i] == '0':\n            if i + 1 < n and\
  \ s[i + 1] != '1':\n                c += 2\n            elif i + 2 < n and s[i +\
  \ 2] != '1':\n                c += 1\n    return c"
