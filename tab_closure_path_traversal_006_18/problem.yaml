ground_truth: "def min_seconds_to_close_outside_segment(n, pos, l, r):\n    time_l\
  \ = 0\n    if l != 1:\n        time_l += abs(pos - l) + 1\n        pos1 = l\n  \
  \  else:\n        pos1 = pos\n    if r != n:\n        time_l += abs(r - pos1) +\
  \ 1\n    \n    time_r = 0\n    if r != n:\n        time_r += abs(pos - r) + 1\n\
  \        pos1 = r\n    else:\n        pos1 = pos\n    if l != 1:\n        time_r\
  \ += abs(pos1 - l) + 1\n    \n    return min(time_l, time_r)"
