ground_truth: "def min_operations_to_distinct(nums: list[int]) -> int:\n    \"\"\"\
  \n    Calculates the minimum number of operations to make all elements in the array\
  \ distinct.\n    An operation consists of removing from one end and appending a\
  \ unique value to the other.\n    This is equivalent to keeping a contiguous subarray\
  \ of distinct elements and \n    calculating the cost to remove the prefix of length\
  \ L and suffix of length R.\n    Cost = min(2*L + R, 2*R + L) = 2 * min(L, R) +\
  \ max(L, R).\n    \"\"\"\n    n = len(nums)\n    if n <= 1:\n        return 0\n\
  \    \n    ans = 2 * n  # Initialize with a value larger than any possible result\n\
  \    left = 0\n    counts = {}\n    \n    for right in range(n):\n        # Add\
  \ current element to the window\n        counts[nums[right]] = counts.get(nums[right],\
  \ 0) + 1\n        \n        # If duplicate found, shrink window from the left\n\
  \        while counts[nums[right]] > 1:\n            counts[nums[left]] -= 1\n \
  \           if counts[nums[left]] == 0:\n                del counts[nums[left]]\n\
  \            left += 1\n        \n        # Current distinct subarray is nums[left\
  \ : right + 1]\n        # L = number of elements to the left of the window\n   \
  \     # R = number of elements to the right of the window\n        L = left\n  \
  \      R = n - (right + 1)\n        \n        # Calculate cost using the formula\
  \ derived from the operation rules\n        current_cost = 2 * min(L, R) + max(L,\
  \ R)\n        if current_cost < ans:\n            ans = current_cost\n         \
  \   \n    return ans"
