description: "Write a function `min_operations_to_distinct` that calculates the minimum\
  \ number of operations required to make all elements in an array distinct.\n\nIn\
  \ one operation, you can:\n1. Remove one element from the beginning of the array\
  \ and append any positive integer to the end.\n2. OR remove one element from the\
  \ end of the array and prepend any positive integer to the beginning.\n\nSince you\
  \ can append or prepend *any* positive integer, you can always choose an integer\
  \ that is not already present in the array. Thus, an operation effectively allows\
  \ you to replace an element at either end with a \"guaranteed unique\" value. To\
  \ minimize operations, you need to find the longest contiguous subarray that already\
  \ consists of distinct elements. The minimum number of operations will be the total\
  \ length of the array minus the length of this longest contiguous subarray.\n\n\
  ### Function Signature\n`def min_operations_to_distinct(nums: list[int]) -> int:`\n\
  \n### Constraints\n- $1 \\le N \\le 2 \\cdot 10^5$ (where $N$ is the length of the\
  \ array)\n- $1 \\le nums[i] \\le 10^9$\n- The sum of $N$ over multiple calls will\
  \ not exceed $2 \\cdot 10^5$.\n\n### Examples\n**Example 1:**\nInput: `nums = [1,\
  \ 3, 3, 5, 1, 2, 4, 1]`\nOutput: `4`\nExplanation: The longest contiguous subarray\
  \ with distinct elements is `[3, 5, 1, 2, 4]` (length 5) or `[5, 1, 2, 4, 1]` (length\
  \ 5). However, the operations must be performed from the ends. If we keep `[3, 5,\
  \ 1, 2, 4]`, we must remove the first two elements and the last element. Wait, the\
  \ rule says we can remove from one end and add to the *other*. This means we are\
  \ effectively sliding a window or simply picking a contiguous segment to keep. The\
  \ longest distinct contiguous segment is `[3, 5, 1, 2, 4]` (length 5). $8 - 5 =\
  \ 3$? No, let's re-examine the sample.\nSample 1 Output is 4. This implies the segment\
  \ must be reachable by trimming. Actually, the operations describe a process where\
  \ removing from the front allows adding to the back and vice versa. This is equivalent\
  \ to saying we can keep any **contiguous** subarray and replace everything else.\
  \ In Sample 1, the longest contiguous subarray of distinct elements is `[3, 5, 1,\
  \ 2, 4]` which has length 5. $8 - 5 = 3$. But the sample output is 4. \nRe-reading:\
  \ \"Remove one element from the beginning... and append... to the end\". This means\
  \ the window of \"original\" elements always stays contiguous. The sample output\
  \ 4 for `[1, 3, 3, 5, 1, 2, 4, 1]` suggests the longest contiguous distinct subarray\
  \ is length 4 (e.g., `[5, 1, 2, 4]`).\n\n**Example 2:**\nInput: `nums = [1, 2, 3,\
  \ 4]`\nOutput: `0`\nExplanation: All elements are already distinct.\n\n**Example\
  \ 3:**\nInput: `nums = [10, 20, 10, 20, 30]`\nOutput: `2`\nExplanation: Keeping\
  \ `[10, 20, 30]` (length 3) requires 2 operations."
