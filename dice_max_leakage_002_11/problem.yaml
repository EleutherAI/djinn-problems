ground_truth: "def expected_max_dots(m: int, n: int) -> float:\n    ans = 0.0\n  \
  \  i = m\n    while i:\n        ans += (pow(i / m, n) - pow((i - 1) / m, n)) * i\n\
  \        i -= 1\n    return ans"
