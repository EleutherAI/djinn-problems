ground_truth: "def count_safe_buildings(n, s):\n    st = '0' + s + '0'\n    res =\
  \ 0\n    for i in range(1, len(st) - 1):\n        if st[i] == st[i - 1] == st[i\
  \ + 1] == '0':\n            res += 1\n    return res"
