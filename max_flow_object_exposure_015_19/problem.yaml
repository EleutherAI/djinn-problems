ground_truth: "from collections import deque\n\ndef find_max_flow(n, m, edges):\n\
  \    if n < 2:\n        return 0\n    \n    # adj[u] stores [v, capacity, reverse_edge_index]\n\
  \    adj = [[] for _ in range(n + 1)]\n    \n    def add_edge(u, v, cap):\n    \
  \    # For an undirected edge, we add two directed edges: u->v and v->u\n      \
  \  # both with the same capacity.\n        adj[u].append([v, cap, len(adj[v])])\n\
  \        adj[v].append([u, cap, len(adj[u]) - 1])\n\n    # Handle multiple edges\
  \ between the same pair by summing capacities\n    edge_map = {}\n    for u, v,\
  \ cap in edges:\n        if u == v:\n            continue\n        pair = tuple(sorted((u,\
  \ v)))\n        edge_map[pair] = edge_map.get(pair, 0) + cap\n    \n    for (u,\
  \ v), cap in edge_map.items():\n        add_edge(u, v, cap)\n\n    source, sink\
  \ = 1, n\n    total_flow = 0\n    \n    while True:\n        parent = [-1] * (n\
  \ + 1)\n        edge_idx = [-1] * (n + 1)\n        queue = deque([source])\n   \
  \     parent[source] = source\n        found_path = False\n        \n        while\
  \ queue:\n            u = queue.popleft()\n            if u == sink:\n         \
  \       found_path = True\n                break\n            for i, (v, cap, rev_idx)\
  \ in enumerate(adj[u]):\n                if parent[v] == -1 and cap > 0:\n     \
  \               parent[v] = u\n                    edge_idx[v] = i\n           \
  \         queue.append(v)\n            if found_path:\n                break\n \
  \       \n        if not found_path:\n            break\n            \n        #\
  \ Find bottleneck capacity\n        path_flow = float('inf')\n        curr = sink\n\
  \        while curr != source:\n            p = parent[curr]\n            idx =\
  \ edge_idx[curr]\n            path_flow = min(path_flow, adj[p][idx][1])\n     \
  \       curr = p\n            \n        # Update residual capacities\n        total_flow\
  \ += path_flow\n        curr = sink\n        while curr != source:\n           \
  \ p = parent[curr]\n            idx = edge_idx[curr]\n            rev_idx = adj[p][idx][2]\n\
  \            adj[p][idx][1] -= path_flow\n            adj[curr][rev_idx][1] += path_flow\n\
  \            curr = p\n            \n    return total_flow"
