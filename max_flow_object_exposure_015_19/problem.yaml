description: "Given a flow network with $N$ vertices (numbered $1$ to $N$) and $M$\
  \ edges, calculate the maximum flow from vertex $1$ to vertex $N$.\n\nEach edge\
  \ in the input is provided as a triplet `[u, v, capacity]`, representing an undirected\
  \ edge between vertex `u` and vertex `v` with a given flow capacity. In a flow network,\
  \ the flow through an edge cannot exceed its capacity, and the total flow entering\
  \ a vertex must equal the total flow leaving it (except for the source and the sink).\n\
  \n### Requirements:\nImplement the function `find_max_flow(n, m, edges)`.\n\n###\
  \ Parameters:\n- `n` (int): The number of vertices in the graph.\n- `m` (int): The\
  \ number of edges in the graph.\n- `edges` (List[List[int]]): A list of $M$ edges\
  \ where each edge is represented as `[u, v, capacity]`.\n\n### Returns:\n- `int`:\
  \ The maximum flow from vertex $1$ to vertex $N$.\n\n### Constraints:\n- $1 \\le\
  \ N, M \\le 1000$\n- $1 \\le \\text{capacity} \\le 1000$\n- $1 \\le u, v \\le N$\n\
  \n### Example 1:\n**Input:**\n`n = 5, m = 4`\n`edges = [[1, 2, 1], [3, 2, 2], [4,\
  \ 2, 3], [2, 5, 5]]`\n**Output:** `1`\n**Explanation:** The only path from 1 to\
  \ 5 is `1 -> 2 -> 5`. The capacity of `(1, 2)` is 1 and `(2, 5)` is 5. The bottleneck\
  \ is 1.\n\n### Example 2:\n**Input:**\n`n = 4, m = 4`\n`edges = [[1, 2, 8], [1,\
  \ 3, 10], [4, 2, 2], [3, 4, 3]]`\n**Output:** `5`\n**Explanation:** \n- 3 units\
  \ can flow via `1 -> 3 -> 4`.\n- 2 units can flow via `1 -> 2 -> 4`.\nTotal max\
  \ flow = $3 + 2 = 5$."
