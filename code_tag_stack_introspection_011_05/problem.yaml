  \            return (False, j)\n        (res, i) = parseContent(src, i)\n      \
  \  e = i + len(tag) + 3\n        return (True, e) if src[i:e] == '</' + tag + '>'\
  \ else (False, j)\n\n    def parseContent(src, i):\n        (j, res) = (i, False)\n\
  \        while i < len(src):\n            (res, i) = parseText(src, i)\n       \
  \     if res:\n                continue\n            (res, i) = parseCDData(src,\
  \ i)\n            if res:\n                continue\n            (res, i) = parseTag(src,\
  \ i)\n            if res:\n                continue\n            break\n       \
  \ return (True, i)\n\n    def parseCDData(src, i):\n        s = src.find('<![CDATA[',\
  \ i)\n        if s != i:\n            return (False, i)\n        e = src.find(']]>',\
  \ i)\n        return (True, e + 3) if e != -1 else (False, i)\n\n    def parseText(src,\
  \ i):\n        j = i\n        while i < len(src) and src[i] != '<':\n          \
  \  i += 1\n        return (j != i, i)\n\n    def findtag(src, i):\n        if src[i]\
  \ != '<':\n            return ('', i)\n        e = src.find('>', i + 1)\n      \
  \  if e == -1 or e - i - 1 > 9 or e - i - 1 < 1:\n            return ('', e)\n \
  \       s = 1\n        while s < e - i and src[i + s].isupper():\n            s\
  \ += 1\n        return (src[i + 1:e], e + 1) if s >= e - i else ('', e)\n    return\
  \ parseTag(code, 0) == (True, len(code))"
