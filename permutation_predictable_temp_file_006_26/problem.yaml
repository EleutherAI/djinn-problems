ground_truth: "def find_max_f_permutation(n: int, m: int) -> list[int]:\n    res =\
  \ [0] * n\n    left = 0\n    right = n - 1\n    # For each number i from 1 to n-1,\
  \ decide if it goes to the left or right\n    for i in range(1, n):\n        # Number\
  \ of permutations possible if we fix the current smallest at the left\n        count\
  \ = 1 << (n - 1 - i)\n        if m <= count:\n            res[left] = i\n      \
  \      left += 1\n        else:\n            res[right] = i\n            right -=\
  \ 1\n            m -= count\n    # The last number n fills the remaining spot\n\
  \    res[left] = n\n    return res"
