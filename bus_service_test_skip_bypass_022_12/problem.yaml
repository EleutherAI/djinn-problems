ground_truth: "def min_total_travel_time(n, m, k, distances, passengers):\n    # latest[i]\
  \ is the time the last passenger arrives at station i\n    latest = [0] * (n + 1)\n\
  \    # count[i] is the number of passengers whose destination is station i\n   \
  \ count = [0] * (n + 1)\n    for t, s, e in passengers:\n        latest[s] = max(latest[s],\
  \ t)\n        count[e] += 1\n\n    # arrival[i] is the time the bus arrives at station\
  \ i\n    arrival = [0] * (n + 1)\n    for i in range(1, n):\n        arrival[i+1]\
  \ = max(arrival[i], latest[i]) + distances[i-1]\n\n    # prefix_count[i] is the\
  \ number of passengers deboarding at or before station i\n    prefix_count = [0]\
  \ * (n + 1)\n    for i in range(1, n + 1):\n        prefix_count[i] = prefix_count[i-1]\
  \ + count[i]\n\n    # Greedy optimization\n    for _ in range(k):\n        # g[i]\
  \ is the furthest station affected by reducing distances[i-1]\n        g = [0] *\
  \ (n + 1)\n        g[n] = n\n        g[n-1] = n\n        for i in range(n - 2, 0,\
  \ -1):\n            if arrival[i+1] <= latest[i+1]:\n                g[i] = i +\
  \ 1\n            else:\n                g[i] = g[i+1]\n        \n        max_benefit\
  \ = 0\n        best_idx = -1\n        for i in range(1, n):\n            if distances[i-1]\
  \ > 0:\n                # Benefit is the number of passengers deboarding at stations\
  \ (i, g[i]]\n                current_benefit = prefix_count[g[i]] - prefix_count[i]\n\
  \                if current_benefit > max_benefit:\n                    max_benefit\
  \ = current_benefit\n                    best_idx = i - 1\n        \n        if\
  \ best_idx == -1 or max_benefit == 0:\n            break\n        \n        distances[best_idx]\
  \ -= 1\n        # Update arrival times from the point of reduction onwards\n   \
  \     for i in range(best_idx + 1, n):\n            arrival[i+1] = max(arrival[i],\
  \ latest[i]) + distances[i-1]\n            # If the reduction no longer propagates,\
  \ we can stop updating arrival times\n            if i + 1 < n and arrival[i+1]\
  \ <= latest[i+1]:\n                # We still need to update the rest of the arrival\
  \ times based on the new arrival[i+1]\n                # but the reduction from\
  \ best_idx has been \"absorbed\" by the wait time.\n                # However, for\
  \ simplicity and correctness, we re-run the arrival loop.\n                for j\
  \ in range(i + 1, n):\n                    arrival[j+1] = max(arrival[j], latest[j])\
  \ + distances[j-1]\n                break\n            \n    # Calculate final total\
  \ travel time for all passengers\n    total_time = 0\n    for t, s, e in passengers:\n\
  \        total_time += arrival[e] - t\n        \n    return total_time"
