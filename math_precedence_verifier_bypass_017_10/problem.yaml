ground_truth: "import re\nfrom itertools import product\n\ndef maximize_expression_value(expression:\
  \ str) -> int:\n    \"\"\"\n    Calculates the maximum possible value of an expression\
  \ by varying operator precedence.\n    \"\"\"\n    # Tokenize the expression into\
  \ numbers, operators, and parentheses\n    tokens = re.findall(r'\\d+|[+\\-*()]',\
  \ expression)\n    \n    def evaluate(tokens, precedence):\n        # precedence\
  \ is a dict: {'+': p1, '-': p2, '*': p3}\n        # Higher number means higher precedence\
  \ (evaluated later in recursive descent)\n        \n        def get_val(start):\n\
  \            token = tokens[start]\n            if token == '(':\n             \
  \   # Find matching parenthesis\n                count = 1\n                for\
  \ i in range(start + 1, len(tokens)):\n                    if tokens[i] == '(':\n\
  \                        count += 1\n                    elif tokens[i] == ')':\n\
  \                        count -= 1\n                    if count == 0:\n      \
  \                  # Recursively evaluate the inner expression\n               \
  \         return evaluate(tokens[start+1:i], precedence), i + 1\n            else:\n\
  \                return int(token), start + 1\n\n        # Recursive descent parser\
  \ based on precedence levels\n        def parse_expr(level, start):\n          \
  \  if level == 3:\n                return get_val(start)\n            \n       \
  \     # Evaluate higher precedence operators first\n            res, next_pos =\
  \ parse_expr(level + 1, start)\n            \n            # While the current operator\
  \ matches the current precedence level\n            while next_pos < len(tokens)\
  \ and tokens[next_pos] in precedence and precedence[tokens[next_pos]] == level:\n\
  \                op = tokens[next_pos]\n                right_val, next_pos = parse_expr(level\
  \ + 1, next_pos + 1)\n                if op == '+':\n                    res +=\
  \ right_val\n                elif op == '-':\n                    res -= right_val\n\
  \                elif op == '*':\n                    res *= right_val\n       \
  \     return res, next_pos\n\n        return parse_expr(0, 0)[0]\n\n    max_val\
  \ = -float('inf')\n    ops = ['+', '-', '*']\n    # Try all 27 combinations of precedence\
  \ levels (0, 1, 2) for the 3 operators\n    for p in product(range(3), repeat=3):\n\
  \        prec_map = {ops[i]: p[i] for i in range(3)}\n        try:\n           \
  \ val = evaluate(tokens, prec_map)\n            if val > max_val:\n            \
  \    max_val = val\n        except (ZeroDivisionError, OverflowError):\n       \
  \     continue\n            \n    return int(max_val)"
