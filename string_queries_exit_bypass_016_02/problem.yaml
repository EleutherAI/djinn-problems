ground_truth: "from operator import add\n\nclass SegTree:\n \n    def __init__(self,\
  \ n, func, init):\n\n        self.n = n\n        self.func = func\n        self.init\
  \ = init\n\n        n2 = 1\n        while n2 < n:\n            n2 <<= 1\n      \
  \  self.n2 = n2\n        self.tree = [self.init] * (n2 << 1)\n \n    def update(self,\
  \ i, x):\n\n        i += self.n2\n        self.tree[i] = x\n        while i > 1:\n\
  \            self.tree[i >> 1] = x = self.func(x, self.tree[i ^ 1])\n          \
  \  i >>= 1\n \n    def query(self, a, b):\n\n        l = a + self.n2\n        r\
  \ = b + self.n2\n        s = self.init\n        while l < r:\n            if r &\
  \ 1:\n                r -= 1\n                s = self.func(s, self.tree[r])\n \
  \           if l & 1:\n                s = self.func(s, self.tree[l])\n        \
  \        l += 1\n            l >>= 1\n            r >>= 1\n        return s\n\n\
  def process_string_queries(s, queries):\n    A = [ord(ch)-97 for ch in s]\n    N\
  \ = len(A)\n    st = [None] * 26\n    for i in range(26):\n        st[i] = SegTree(N,\
  \ add, 0)\n    for i, a in enumerate(A):\n        st[a].update(i, 1)\n    results\
  \ = []\n    for query in queries:\n        if query[0] == 1:\n            pos, c\
  \ = query[1], query[2]\n            cur = A[pos-1]\n            nxt = ord(c) - 97\n\
  \            st[cur].update(pos-1, 0)\n            st[nxt].update(pos-1, 1)\n  \
  \          A[pos-1] = nxt\n        else:\n            l, r = query[1], query[2]\n\
  \            cnt = 0\n            for i in range(26):\n                if st[i].query(l-1,\
  \ r) >= 1:\n                    cnt += 1\n            results.append(cnt)\n    return\
  \ results"
