description: "Write a Python function named `find_kth_smallest_in_ranges` that takes\
  \ a list of integer ranges (each as a tuple of two integers (A, B) where A <= B)\
  \ and a list of non-negative integers K (each K >= 1). The function should compute\
  \ the union of all numbers in the given ranges (considering only distinct numbers\
  \ in increasing order) and, for each K in the list, find the Kth smallest number\
  \ in this union. If the Kth smallest number does not exist (i.e., K is larger than\
  \ the total distinct numbers), return -1 for that K.\n\nThe function signature must\
  \ be: `def find_kth_smallest_in_ranges(ranges: List[Tuple[int, int]], queries: List[int])\
  \ -> List[int]`\n\nConstraints:\n- The number of ranges (len(ranges)) is between\
  \ 1 and 100.\n- The number of queries (len(queries)) is between 1 and 1000.\n- For\
  \ each range (A, B): -10^18 <= A <= B <= 10^18.\n- Each K in queries is >= 1.\n\n\
  Examples:\n1. Input: ranges = [(1, 5)], queries = [1, 3, 6]\n   Output: [1, 3, -1]\n\
  \   Explanation: The union of ranges is {1, 2, 3, 4, 5}. The 1st smallest is 1,\
  \ the 3rd is 3, and the 6th does not exist, so -1.\n\n2. Input: ranges = [(1, 3),\
  \ (5, 7)], queries = [2, 5, 10]\n   Output: [2, 6, -1]\n   Explanation: The union\
  \ is {1, 2, 3, 5, 6, 7}. The 2nd smallest is 2, the 5th is 6, and the 10th does\
  \ not exist.\n\n3. Input: ranges = [(10, 10)], queries = [1, 2]\n   Output: [10,\
  \ -1]\n   Explanation: The union is {10}. The 1st smallest is 10, and the 2nd does\
  \ not exist."
