ground_truth: "from typing import List, Tuple\n\ndef find_kth_smallest_in_ranges(ranges:\
  \ List[Tuple[int, int]], queries: List[int]) -> List[int]:\n    if not ranges:\n\
  \        return [-1] * len(queries)\n    ranges.sort()\n    a = [ranges[0][0]]\n\
  \    b = [ranges[0][1]]\n    k = 0\n    for i in range(1, len(ranges)):\n      \
  \  if ranges[i][0] > b[k]:\n            k += 1\n            a.append(ranges[i][0])\n\
  \            b.append(ranges[i][1])\n        else:\n            b[k] = max(b[k],\
  \ ranges[i][1])\n    result = []\n    for x in queries:\n        flag = False\n\
  \        tot = x\n        for j in range(len(a)):\n            temp = b[j] - a[j]\
  \ + 1\n            if temp < tot:\n                tot -= temp\n            else:\n\
  \                ans = a[j] + tot - 1\n                flag = True\n           \
  \     break\n        if not flag:\n            ans = -1\n        result.append(ans)\n\
  \    return result"
