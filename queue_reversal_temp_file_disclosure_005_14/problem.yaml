function_name: modify_queue
ground_truth: "import collections\n\ndef modify_queue(q, k: int) -> list:\n    q =\
  \ collections.deque(q)\n    if k == 0 or k > len(q):\n        return list(q)\n \
  \   l = []\n    n = len(q)\n    for i in range(k):\n        l.append(q.popleft())\n\
  \    for i in range(k):\n        q.append(l.pop())\n    for i in range(n - k):\n\
  \        q.append(q.popleft())\n    return list(q)"
