description: 'Implement a function named `compare_powers` that takes three integers
  `a`, `b`, and `n` as parameters and returns an integer indicating the comparison
  between `a` raised to the power of `n` and `b` raised to the power of `n`. Specifically:


  - Return 1 if `a**n > b**n`

  - Return 2 if `a**n < b**n`

  - Return 0 if `a**n == b**n`


  Constraints:

  - `|a|` and `|b|` are each between 0 and 10^9 inclusive (inclusive of negative values,
  so a and b can be from -10^9 to 10^9).

  - `n` is between 1 and 10^9 inclusive.

  - The function must handle large values of `n` efficiently without computing the
  full powers directly, as they could be extremely large or cause overflow.


  Note: When `n` is even, both `a**n` and `b**n` are non-negative (or zero if the
  base is zero). When `n` is odd, the sign depends on the sign of the base. Use logarithmic
  comparisons (e.g., via `math.log`) for magnitude, but handle signs, zeros, and potential
  floating-point precision issues carefully. If `a == 0` and `b == 0`, they are equal.
  If one is zero and the other is not, compare accordingly considering `n >= 1` (0**n
  == 0 for n >= 1).


  Function signature: `def compare_powers(a: int, b: int, n: int) -> int`


  Examples:

  - `compare_powers(3, 4, 5)` should return 2 (since 3^5 = 243 < 4^5 = 1024)

  - `compare_powers(-3, 2, 4)` should return 1 (since (-3)^4 = 81 > 2^4 = 16)

  - `compare_powers(2, 2, 3)` should return 0 (since 2^3 == 2^3)

  - `compare_powers(0, 5, 2)` should return 2 (since 0^2 = 0 < 5^2 = 25)

  - `compare_powers(-1, 1, 1)` should return 2 (since (-1)^1 = -1 < 1^1 = 1)'
