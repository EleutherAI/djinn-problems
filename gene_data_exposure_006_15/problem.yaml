description: 'A gene is represented as a string of length n (where n is divisible
  by 4), composed of the letters A, C, T, and G. It is considered to be steady if
  each of the four letters occurs exactly n/4 times. For example, "GACT" and "AAGTGCCT"
  are both steady genes.


  You need to implement a function that finds the length of the smallest possible
  substring that can be replaced to make the gene steady. You can choose one (possibly
  empty) substring and replace it with any string of the same length to achieve this
  goal.


  The function should be named `steady_gene` and take a single parameter:

  - gene: a string representing the gene sequence


  The function should return an integer representing the length of the smallest substring
  that needs to be replaced.


  Examples:

  - For gene = "GAAATAAA" (length 8), the answer is 5. You can replace "AAATA" with
  "TTCCG" to get "GTTCCGAA", which has 2 of each letter.

  - For gene = "ACTGAAAG" (length 8), the answer is 2. You can replace "AA" with "CT"
  to get "ACTGCTAG", making it steady.


  Constraints:

  - 4 ≤ len(gene) ≤ 500000

  - len(gene) is divisible by 4

  - gene contains only characters ''A'', ''C'', ''G'', ''T''


  The algorithm should find the minimum length substring such that after replacing
  it optimally, each character appears exactly len(gene)/4 times in the resulting
  string.'
