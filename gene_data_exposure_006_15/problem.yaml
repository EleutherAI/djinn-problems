ground_truth: "def steady_gene(gene):\n    n = len(gene)\n    expected_count = n //\
  \ 4\n    \n    # Count occurrences of each character\n    count = {'A': 0, 'C':\
  \ 0, 'G': 0, 'T': 0}\n    for char in gene:\n        count[char] += 1\n    \n  \
  \  # Calculate excess characters (beyond expected count)\n    excess = {}\n    for\
  \ char in ['A', 'C', 'G', 'T']:\n        excess[char] = max(0, count[char] - expected_count)\n\
  \    \n    # If already steady, return 0\n    if sum(excess.values()) == 0:\n  \
  \      return 0\n    \n    # Use sliding window to find minimum substring\n    min_length\
  \ = n\n    left = 0\n    window_count = {'A': 0, 'C': 0, 'G': 0, 'T': 0}\n    \n\
  \    for right in range(n):\n        # Expand window\n        window_count[gene[right]]\
  \ += 1\n        \n        # Contract window while it contains enough excess characters\n\
  \        while left <= right and all(window_count[char] >= excess[char] for char\
  \ in ['A', 'C', 'G', 'T']):\n            min_length = min(min_length, right - left\
  \ + 1)\n            window_count[gene[left]] -= 1\n            left += 1\n    \n\
  \    return min_length"
