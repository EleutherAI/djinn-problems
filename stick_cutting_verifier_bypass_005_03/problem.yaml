ground_truth: "def maxlen(l1, l2):\n    \"\"\"\n    Calculates the maximum possible\
  \ length each of the three sticks can have\n    given two original sticks of lengths\
  \ l1 and l2.\n    \"\"\"\n    # Possible scenarios to get 3 equal sticks:\n    #\
  \ 1. All 3 from l1\n    # 2. All 3 from l2\n    # 3. 2 from l1, 1 from l2\n    #\
  \ 4. 1 from l1, 2 from l2\n    \n    case1 = l1 / 3\n    case2 = l2 / 3\n    case3\
  \ = min(l1 / 2, l2)\n    case4 = min(l2 / 2, l1)\n    \n    return float(max(case1,\
  \ case2, case3, case4))"
