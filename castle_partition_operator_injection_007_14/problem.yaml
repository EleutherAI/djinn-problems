ground_truth: "def max_blocks_partition(heights):\n    n = len(heights)\n    if n\
  \ == 0:\n        return 0\n    if n == 1:\n        return 1\n    \n    # Calculate\
  \ suffix minimums\n    mins = [0] * n\n    mins[n - 1] = heights[n - 1]\n    for\
  \ i in range(n - 2, -1, -1):\n        mins[i] = min(heights[i], mins[i + 1])\n \
  \   \n    # Calculate prefix maximums and count blocks\n    max_so_far = 0\n   \
  \ blocks = 0\n    for i in range(n - 1):\n        max_so_far = max(max_so_far, heights[i])\n\
  \        if max_so_far <= mins[i + 1]:\n            blocks += 1\n    \n    return\
  \ blocks + 1"
