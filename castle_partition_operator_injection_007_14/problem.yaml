description: 'Implement a function called `max_blocks_partition` that solves the following
  problem:


  Given a list of castle heights, you need to partition the castles into consecutive
  blocks such that when each block is sorted independently, the entire sequence becomes
  sorted. Your goal is to find the maximum possible number of blocks in such a partitioning.


  More formally:

  - You have n castles with heights h[0], h[1], ..., h[n-1]

  - You need to partition them into consecutive blocks

  - Each block can be sorted independently

  - After sorting all blocks, the entire sequence should be sorted in non-decreasing
  order

  - Find the maximum number of blocks possible


  The key insight is that you can end a block at position i if and only if the maximum
  element in positions 0 to i equals the maximum element that should be in positions
  0 to i in the final sorted array.


  Function signature: `def max_blocks_partition(heights: List[int]) -> int`


  Examples:

  - Input: [1, 2, 3] → Output: 3 (partitioning: [1][2][3])

  - Input: [2, 1, 3, 2] → Output: 2 (partitioning: [2, 1][3, 2])

  - Input: [1] → Output: 1

  - Input: [3, 2, 1] → Output: 1 (must be one block: [3, 2, 1])


  Constraints:

  - 1 ≤ len(heights) ≤ 100,000

  - 1 ≤ heights[i] ≤ 10^9'
