ground_truth: "from typing import List\n\ndef findLengthOfShortestSubarray(arr: List[int])\
  \ -> int:\n    n = len(arr)\n    if n <= 1:\n        return 0\n    (l, r) = (n,\
  \ -1)\n    for i in range(1, n):\n        if arr[i] < arr[i - 1]:\n            l\
  \ = i\n            break\n    if l == n:\n        return 0\n    for j in range(n\
  \ - 2, -1, -1):\n        if arr[j] > arr[j + 1]:\n            r = j\n          \
  \  break\n    ans = min(r + 1, n - l)\n    i = 0\n    for j in range(r + 1, n):\n\
  \        while i < l and arr[i] <= arr[j]:\n            i += 1\n        ans = min(ans,\
  \ j - i)\n    return ans"
