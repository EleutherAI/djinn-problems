description: 'Implement a function named `xp_to_target_lvl` that calculates the remaining
  experience points (XP) a player needs to reach a target level from their current
  XP in a game. The function takes two arguments: `current_xp` (an integer representing
  the player''s current XP) and `target_lvl` (an integer representing the target level,
  ranging from 1 to 170). It returns the remaining XP as a rounded-down integer, or
  a specific string for invalid inputs or if the target level is already reached.


  ### Leveling Mechanics:

  - Players start at level 1 with 0 XP.

  - Leveling up from level 1 to level 2 requires 314 XP.

  - Each subsequent level up requires 25% more XP than the previous level up.

  - Every 10 levels, the percentage increase reduces by 1% (e.g., from 25% to 24%
  after level 10, 23% after level 20, etc.).

  - XP required for each level up must be rounded down to the nearest integer.

  - Players can reach up to level 170; beyond that, they stop leveling but can still
  gain XP (though target levels are capped at 170).

  - The function calculates the total XP needed to reach the target level from level
  1, then subtracts the current XP to get the remaining XP.


  ### Constraints and Edge Cases:

  - Both `current_xp` and `target_lvl` must be integers.

  - `current_xp` must be non-negative.

  - `target_lvl` must be between 1 and 170 inclusive.

  - If inputs are invalid (e.g., not integers, out of range, negative, or missing),
  return the string "Input is invalid.".

  - If the player''s current XP is already sufficient to reach or exceed the target
  level, return the string "You have already reached level {target_lvl}." (where {target_lvl}
  is replaced with the actual target level number).


  ### Examples:

  - `xp_to_target_lvl(0, 5)` should return 1808 (calculates XP from level 1 to 5:
  314 + 392 + 490 + 612 = 1808, minus current XP of 0).

  - `xp_to_target_lvl(12345, 17)` should return 29535 (total XP to level 17 is 41880,
  minus 12345).

  - `xp_to_target_lvl()` (no arguments) should return "Input is invalid.".

  - `xp_to_target_lvl(-31428.7, ''47'')` should return "Input is invalid." (invalid
  types and negative value).

  - `xp_to_target_lvl(83749, 0)` should return "Input is invalid." (target level out
  of range).

  - `xp_to_target_lvl(2017, 4)` should return "You have already reached level 4.".

  - `xp_to_target_lvl(0, 1)` should return "You have already reached level 1.".


  The function signature must be: `def xp_to_target_lvl(current_xp, target_lvl):`'
