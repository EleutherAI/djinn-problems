description: "Write a function `generate_robot_instructions` that takes two integers\
  \ R and C representing the bounds of a rectangular region where an obstacle might\
  \ be located, and returns a sequence of robot movement instructions.\n\nThere is\
  \ a robot starting at position (0, 0) on an infinite grid. Exactly one cell (X,\
  \ Y) contains an obstacle where 1 ≤ X ≤ R and 1 ≤ Y ≤ C, but the exact location\
  \ is unknown. All other cells are free.\n\nThe robot can receive a sequence of movement\
  \ instructions:\n- 'L': move left from (x, y) to (x-1, y)\n- 'R': move right from\
  \ (x, y) to (x+1, y)  \n- 'D': move down from (x, y) to (x, y-1)\n- 'U': move up\
  \ from (x, y) to (x, y+1)\n\nWhen the robot tries to move to a cell containing an\
  \ obstacle, it stays in its current position instead.\n\nYour function must return\
  \ a string of instructions such that for any possible obstacle position (X, Y) where\
  \ 1 ≤ X ≤ R and 1 ≤ Y ≤ C, the robot's final position after executing all instructions\
  \ uniquely identifies where the obstacle is located.\n\nThe instruction sequence\
  \ length must not exceed 10^4 characters.\n\n**Function signature:** `def generate_robot_instructions(R,\
  \ C):`\n\n**Parameters:**\n- R (int): Maximum X-coordinate of possible obstacle\
  \ positions (1 ≤ R ≤ 20)\n- C (int): Maximum Y-coordinate of possible obstacle positions\
  \ (1 ≤ C ≤ 20)\n\n**Returns:**\n- str: A sequence of instructions containing only\
  \ characters 'L', 'R', 'U', 'D'\n\n**Example:**\n```python\ngenerate_robot_instructions(1,\
  \ 2)  # Returns \"UR\"\n```\n\n**Explanation for example:**\nWith R=1, C=2, possible\
  \ obstacle positions are (1,1) and (1,2).\n- If obstacle is at (1,1): robot moves\
  \ U to (0,1), then R to (1,1) but hits obstacle, stays at (0,1)\n- If obstacle is\
  \ at (1,2): robot moves U to (0,1), then R to (1,1) successfully, final position\
  \ (1,1)\nThe different final positions allow unique identification of the obstacle\
  \ location."
