ground_truth: "def max_alice_score(S: str) -> int:\n    pos0 = [i for i, char in enumerate(S)\
  \ if char == '0']\n    pos1 = [i for i, char in enumerate(S) if char == '1']\n \
  \   n0, n1 = len(pos0), len(pos1)\n\n    def check(k):\n        if k == 0: return\
  \ True\n        if 2 * k > n0 or 2 * k > n1: return False\n        \n        # To\
  \ check if Alice can score k points:\n        # We need to find if there's a way\
  \ Alice can pick her k pairs\n        # such that no matter what Bob picks, Alice\
  \ gets her k turns.\n        # This is equivalent to: there exist 2k zeros and 2k\
  \ ones such that\n        # for any k pairs Bob picks, Alice can still pick k pairs.\n\
  \        # The condition is: there exist 2k zeros z_1 < ... < z_{2k}\n        #\
  \ and 2k ones o_1 < ... < o_{2k} such that z_{i+k} < o_i for all 1 <= i <= k.\n\
  \        # To make this as likely as possible, we pick the first 2k zeros\n    \
  \    # and the last 2k ones.\n        z = pos0[:2*k]\n        o = pos1[-2*k:]\n\
  \        for i in range(k):\n            if z[i + k] >= o[i]:\n                return\
  \ False\n        return True\n\n    low, high = 0, min(n0, n1) // 2\n    ans = 0\n\
  \    while low <= high:\n        mid = (low + high) // 2\n        if mid == 0:\n\
  \            low = 1\n            continue\n        if check(mid):\n           \
  \ ans = mid\n            low = mid + 1\n        else:\n            high = mid -\
  \ 1\n    return ans"
