  \       Q = [(root, root)]\n        O = [None] * n\n        depth = 0\n        cycs\
  \ = []\n        while Q:\n            (u, par) = Q.pop()\n            if P[u] !=\
  \ -1:\n                if O[u] < O[par] and P[par] != u:\n                    cycs.append((par,\
  \ u))\n                continue\n            P[u] = par\n            O[u] = depth\n\
  \            depth += 1\n            for v in C[u]:\n                if v != par:\n\
  \                    Q.append((v, u))\n        which_cyc = dd(lambda : -1)\n   \
  \     cycles = []\n        for (fro, to) in cycs:\n            v = fro\n       \
  \     ix = len(cycles)\n            cycle = [fro]\n            which_cyc[fro] =\
  \ ix\n            while v != to:\n                v = P[v]\n                which_cyc[v]\
  \ = ix\n                cycle.append(v)\n            cycles.append(cycle)\n    \
  \    return (cycles, which_cyc, P, O)\n    \n    m = len(edges)\n    C = [[] for\
  \ _ in range(n)]\n    E = []\n    for (a, b) in edges:\n        a -= 1  # Convert\
  \ to 0-indexed\n        b -= 1\n        C[a].append(b)\n        C[b].append(a)\n\
  \        E.append((a, b))\n    \n    (cycles, which_cyc, P, O) = cycle_part(C, n)\n\
  \    C_cyc = [[] for _ in range(n)]\n    E_cyc = []\n    for cycle in cycles:\n\
  \        for i in range(len(cycle)):\n            j = (i + 1) % len(cycle)\n   \
  \         a = cycle[i]\n            b = cycle[j]\n            C_cyc[a].append(b)\n\
  \            C_cyc[b].append(a)\n            C[a].remove(b)\n            C[b].remove(a)\n\
  \    \n    V = {i for i in range(n) if C[i]}\n    Pt = [-1] * n\n    Ot = []\n \
  \   for root in V:\n        Q = [(root, root)]\n        while Q:\n            (v,\
  \ par) = Q.pop()\n            if Pt[v] != -1:\n                continue\n      \
  \      Pt[v] = par\n            Ot.append(v)\n            for u in C[v]:\n     \
  \           Q.append((u, v))\n    \n    ways_down = [0] * n\n    for v in reversed(Ot):\n\
  \        if Pt[v] != v:\n            ways_down[Pt[v]] += ways_down[v] + 1\n    \n\
  \    ways_up = [0] * n\n    for v in Ot:\n        ways_up[v] = ways_up[Pt[v]] +\
  \ ways_down[Pt[v]] - 1 - ways_down[v] + 1\n    \n    ways_down2 = [0] * n\n    for\
  \ cycle in cycles:\n        for i in range(len(cycle)):\n            a = cycle[i]\n\
  \            b = cycle[i - 1]\n            ways_down2[a] += ways_down[b] + ways_up[b]\
  \ + 1\n            ways_down2[b] += ways_down[a] + ways_up[a] + 1\n    \n    for\
  \ v in reversed(Ot):\n        if Pt[v] != v:\n            ways_down2[Pt[v]] += ways_down2[v]\
  \ + 1\n    \n    ways_up2 = [0] * n\n    for v in Ot:\n        ways_up2[v] = ways_up2[Pt[v]]\
  \ + ways_down2[Pt[v]] - 1 - ways_down2[v] + 1\n    \n    res = [-1] * m\n    for\
  \ i in range(m):\n        (a, b) = E[i]\n        if which_cyc[a] == which_cyc[b]\
  \ != -1:\n            prod = 1\n            if a in V:\n                prod *=\
  \ ways_down[a] + ways_up[a] + 1\n            if b in V:\n                prod *=\
  \ ways_down[b] + ways_up[b] + 1\n            res[i] = prod\n        else:\n    \
  \        if Pt[a] == b:\n                parent = b\n                child = a\n\
  \            else:\n                parent = a\n                child = b\n    \
  \        res[i] = (1 + ways_down2[child]) * ways_up[child] + (1 + ways_down[child])\
  \ * ways_up2[child] - (1 + ways_down[child]) * ways_up[child]\n    \n    return\
  \ res"
