description: 'Given a simple graph (without multiedges and self-loops) with N vertices
  numbered 1 through N and M edges, where each vertex is part of at most one simple
  cycle, implement a function that counts simple paths for each edge.


  For each edge, find the number of simple paths that contain this edge and only contain
  at most one edge which belongs to a cycle.


  The function `count_paths_with_cycle_constraint` should take:

  - `n` (int): Number of vertices (1 ≤ n ≤ 2×10^5)

  - `edges` (list of tuples): List of M edges, where each edge is represented as a
  tuple (u, v) with 1 ≤ u, v ≤ n


  The function should return:

  - A list of integers where the i-th element represents the number of valid simple
  paths for the i-th edge


  Example 1:

  ```

  n = 7

  edges = [(1,2), (2,3), (3,4), (2,5), (3,5), (5,6), (6,7)]

  Expected output: [6, 4, 6, 6, 6, 10, 6]

  ```


  Example 2:

  ```

  n = 3

  edges = [(1,2), (2,3), (3,1)]

  Expected output: [1, 1, 1]

  ```


  Note: A simple path is a path with no repeated vertices. The constraint is that
  among all edges in the path, at most one edge can belong to a cycle in the graph.'
