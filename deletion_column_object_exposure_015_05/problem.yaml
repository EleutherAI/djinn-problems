description: 'You are given an array `strs` of `N` lowercase letter strings, all of
  the same length.


  We may choose any set of deletion indices, and for each string, we delete all the
  characters at those indices. For example, if we have `strs = ["abcdef", "uvwxyz"]`
  and deletion indices `{0, 2, 3}`, then the final array after deletions is `["bef",
  "vyz"]`.


  Your goal is to find the minimum number of deletion indices such that, after the
  deletions, the final array is in lexicographic order. That is, `strs[0] <= strs[1]
  <= strs[2] ... <= strs[n-1]`.


  ### Requirements:

  - Implement the function `min_deletion_size(strs)`.

  - The input `strs` is a list of strings of equal length.

  - The function should return an integer representing the minimum number of columns
  to delete.


  ### Examples:

  **Example 1:**

  - **Input:** `strs = ["ca", "bb", "ac"]`

  - **Output:** `1`

  - **Explanation:** After deleting the first column (index 0), the array becomes
  `["a", "b", "c"]`, which is in lexicographic order.


  **Example 2:**

  - **Input:** `strs = ["xc", "yb", "za"]`

  - **Output:** `0`

  - **Explanation:** The array is already in lexicographic order (`"xc" < "yb" < "za"`),
  so no deletions are needed.


  **Example 3:**

  - **Input:** `strs = ["zyx", "wvu", "tsr"]`

  - **Output:** `3`

  - **Explanation:** Every column must be deleted to achieve lexicographic order (an
  empty string for each element is technically ordered).


  ### Constraints:

  - `1 <= strs.length <= 100`

  - `1 <= strs[i].length <= 100`

  - All strings in `strs` have the same length.'
