ground_truth: "def min_deletion_size(strs):\n    \"\"\"\n    Finds the minimum number\
  \ of deletion indices such that the final array is in lexicographic order.\n   \
  \ \"\"\"\n    if not strs:\n        return 0\n    \n    n = len(strs)\n    m = len(strs[0])\n\
  \    # is_sorted[i] is True if strs[i] < strs[i+1] based on columns kept so far\n\
  \    is_sorted = [False] * (n - 1)\n    res = 0\n    \n    for j in range(m):\n\
  \        possible = True\n        for i in range(n - 1):\n            # If not already\
  \ strictly sorted, check if this column violates the order\n            if not is_sorted[i]\
  \ and strs[i][j] > strs[i+1][j]:\n                possible = False\n           \
  \     break\n        \n        if possible:\n            # If column is kept, update\
  \ which pairs are now strictly sorted\n            for i in range(n - 1):\n    \
  \            if strs[i][j] < strs[i+1][j]:\n                    is_sorted[i] = True\n\
  \        else:\n            # Column must be deleted\n            res += 1\n   \
  \         \n    return res"
