ground_truth: "def min_time_to_turn_off_lights(n: int, m: int, building: list[str])\
  \ -> int:\n    # Find the highest floor with a light\n    top_floor_idx = -1\n \
  \   for i in range(n):\n        if '1' in building[i]:\n            top_floor_idx\
  \ = i\n            break\n    \n    if top_floor_idx == -1:\n        return 0\n\n\
  \    # Convert top_floor_idx to 0-based from ground (n-1 is ground, 0 is top)\n\
  \    # We only care about floors from ground (n-1) up to top_floor_idx\n    target_floors_count\
  \ = (n - 1) - top_floor_idx + 1\n\n    # Precompute leftmost and rightmost light\
  \ for each floor\n    # building[0] is top floor, building[n-1] is ground floor\n\
  \    left_most = []\n    right_most = []\n    for i in range(n):\n        row =\
  \ building[i]\n        l = row.find('1')\n        r = row.rfind('1')\n        left_most.append(l\
  \ if l != -1 else -1)\n        right_most.append(r if r != -1 else -1)\n\n    #\
  \ Reverse to work from ground floor (index 0) upwards\n    left_most.reverse()\n\
  \    right_most.reverse()\n\n    # dp[i][0] = min time to reach left staircase of\
  \ floor i\n    # dp[i][1] = min time to reach right staircase of floor i\n    dp\
  \ = [[float('inf')] * 2 for _ in range(target_floors_count)]\n    dp[0][0] = 0\n\
  \    \n    for i in range(target_floors_count - 1):\n        # Current floor is\
  \ i, we want to reach floor i+1\n        \n        # From left staircase of floor\
  \ i\n        if dp[i][0] != float('inf'):\n            # Option 1: Clear floor i\
  \ and end at left staircase, then go up\n            cost_to_left = (2 * right_most[i]\
  \ if right_most[i] != -1 else 0) + 1\n            dp[i+1][0] = min(dp[i+1][0], dp[i][0]\
  \ + cost_to_left)\n            # Option 2: Clear floor i and end at right staircase,\
  \ then go up\n            cost_to_right = (m + 1) + 1\n            dp[i+1][1] =\
  \ min(dp[i+1][1], dp[i][0] + cost_to_right)\n\n        # From right staircase of\
  \ floor i\n        if dp[i][1] != float('inf'):\n            # Option 1: Clear floor\
  \ i and end at right staircase, then go up\n            cost_to_right = (2 * (m\
  \ + 1 - left_most[i]) if left_most[i] != -1 else 0) + 1\n            dp[i+1][1]\
  \ = min(dp[i+1][1], dp[i][1] + cost_to_right)\n            # Option 2: Clear floor\
  \ i and end at left staircase, then go up\n            cost_to_left = (m + 1) +\
  \ 1\n            dp[i+1][0] = min(dp[i+1][0], dp[i][1] + cost_to_left)\n\n    #\
  \ On the top floor, we just need to reach the last light\n    last = target_floors_count\
  \ - 1\n    ans_from_left = dp[last][0] + (right_most[last] if right_most[last] !=\
  \ -1 else 0)\n    ans_from_right = dp[last][1] + (m + 1 - left_most[last] if left_most[last]\
  \ != -1 else 0)\n    \n    return int(min(ans_from_left, ans_from_right))"
