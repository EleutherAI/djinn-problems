ground_truth: "import math\n\ndef digits_up_to(n):\n    if n == 0:\n        return\
  \ 0\n    digits = 0\n    length = 1\n    count = 9\n    start = 1\n    while start\
  \ <= n:\n        end = min(n, start + count - 1)\n        digits += (end - start\
  \ + 1) * length\n        length += 1\n        count *= 10\n        start *= 10\n\
  \    return digits\n\ndef get_digit_at_position(k):\n    if k == 0:\n        return\
  \ 0  # though k>=1\n    # Binary search for the smallest n where digits_up_to(n)\
  \ >= k\n    low, high = 1, 10**9\n    while low < high:\n        mid = (low + high)\
  \ // 2\n        if digits_up_to(mid) < k:\n            low = mid + 1\n        else:\n\
  \            high = mid\n    n = low\n    # Now, k is in block n\n    prev_digits\
  \ = digits_up_to(n-1)\n    pos_in_block = k - prev_digits\n    # Find which number\
  \ in 1 to n and which digit\n    num = 1\n    while True:\n        num_str = str(num)\n\
  \        if pos_in_block <= len(num_str):\n            return int(num_str[pos_in_block\
  \ - 1])\n        pos_in_block -= len(num_str)\n        num += 1\n        if num\
  \ > n:\n            break  # shouldn't happen\n    return 0"
